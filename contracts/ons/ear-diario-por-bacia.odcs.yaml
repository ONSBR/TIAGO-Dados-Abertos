- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver nível de armazenamento de reservatórios hidrelétricos
    por bacia, percentual de capacidade dos reservatórios, evolução histórica da EAR diária ou análise
    de risco hidrológico por bacia do SIN. Também relevante para perguntas sobre CMO, despacho hidrotérmico
    e condições hídricas que requerem granularidade diária e desagregação por bacia.
- property: agentInstructions
  value: '- [ear_data] Coluna ear_data está armazenada como VARCHAR no Parquet em vez de DATE. Operações
    de filtro temporal, ordenação e extração de componentes de data falharão sem conversão explícita.
    O formato observado é YYYY-MM-DD (ISO 8601), mas a ausência de tipagem nativa exige cuidado em joins
    temporais.


    - [ear_max_bacia] Valor mínimo de 0.0 em ear_max_bacia pode indicar bacias sem capacidade de regularização
    em períodos históricos específicos ou registros de bacias a fio d''água. Divisões por ear_max_bacia
    para recalcular percentual resultarão em erro de divisão por zero nesses casos.


    - [ear_verif_bacia_percentual] Valor máximo de 154.43% ultrapassa 100%, indicando situações de volume
    acima da capacidade nominal dos reservatórios (vertimento ou cheias extraordinárias). Não é anomalia
    de dados — é comportamento físico real. Sistemas de monitoramento que alertem para valores acima de
    100% devem considerar esse limiar estendido (até ~160%) como válido para este dataset.


    - [ear_verif_bacia_mwmes] Valor mínimo de 0.0 em ear_verif_bacia_mwmes pode representar situações
    de reservatórios completamente vazios (volume morto atingido) ou bacias sem armazenamento regularizável.
    Embora fisicamente possível, valores zero merecem verificação contextual para distinguir dado real
    de possível falha de coleta.


    - [nomecurto] A chave primária natural é (nomecurto, ear_data). Duplicatas nessa combinação indicariam
    inconsistência no processo de carga dos 27 arquivos Parquet, possivelmente por sobreposição de partições
    ou reprocessamento parcial. Deve ser verificado antes de agregações que assumam unicidade por bacia/data.

    '
