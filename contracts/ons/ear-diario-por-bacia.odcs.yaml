description:
  purpose: Disponibilizar aos geradores, comercializadores, agentes do mercado de energia elétrica, pesquisadores
    e reguladores a evolução diária do nível de armazenamento dos reservatórios hidrelétricos por bacia,
    permitindo o acompanhamento das condições hídricas do SIN, a projeção do Custo Marginal de Operação
