    em comercialização de energia.
  limitations: Coluna ear_data está armazenada como VARCHAR no Parquet em vez de DATE. Valor máximo de
    154,43% ultrapassa o limite esperado de 100% para um percentual de capacidade. Valor mínimo de 0.
  usage: Recuperar este dataset quando a pergunta envolver nível de armazenamento de reservatórios hidrelétricos
    por bacia, percentual de capacidade dos reservatórios, evolução histórica da EAR diária ou análise
    de risco hidrológico por bacia do SIN.
