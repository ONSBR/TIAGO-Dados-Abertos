    sql_patterns:
      ear_verif_percentual_bacia_serie:
        template: "SELECT TRY_CAST(ear_data AS DATE) AS data,\n  nomecurto AS bacia,\n  AVG(ear_verif_bacia_percentual)\
          \ AS ear_percentual\nFROM {source}\nWHERE nomecurto = '{bacia}'\n  AND TRY_CAST(ear_data AS\
          \ DATE) BETWEEN '{data_inicio}' AND '{data_fim}'\nGROUP BY 1, 2\nORDER BY 1"
        output_unit: '%'
        matches:
          output_modes:
          - time_series
          metrics:
          - ear_verif_bacia_percentual
          grain: day
        validated_params:
          bacia: GRANDE
          data_inicio: '2000-01-01'
          data_fim: '2015-03-18'
      ear_verif_mwmes_mensal_bacia:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(ear_data AS DATE)) AS mes,\n  nomecurto AS bacia,\n\
          \  AVG(ear_verif_bacia_mwmes) AS ear_media_mwmes\nFROM {source}\nWHERE nomecurto = '{bacia}'\n\
          \  AND TRY_CAST(ear_data AS DATE) BETWEEN '{data_inicio}' AND '{data_fim}'\nGROUP BY 1, 2\n\
          ORDER BY 1"
        output_unit: MWmes
        matches:
          output_modes:
          - time_series
          - average
          metrics:
          - ear_verif_bacia_mwmes
          grain: month
        validated_params:
          bacia: DOCE
          data_inicio: '2000-01-01'
          data_fim: '2015-03-18'
      ear_comparacao_bacias_data:
        template: "SELECT nomecurto AS bacia,\n  ear_verif_bacia_mwmes,\n  ear_verif_bacia_percentual,\n\
          \  ear_max_bacia\nFROM {source}\nWHERE TRY_CAST(ear_data AS DATE) = '{data}'\nORDER BY ear_verif_bacia_percentual\
          \ DESC"
        output_unit: MWmes e '%'
        matches:
          output_modes:
          - comparison
          - ranking
          metrics:
          - ear_verif_bacia_mwmes
          - ear_verif_bacia_percentual
          grain: day
        validated_params:
          data: '2003-05-24'
      ear_percentual_recalculado:
        template: "SELECT TRY_CAST(ear_data AS DATE) AS data,\n  nomecurto AS bacia,\n  ear_verif_bacia_mwmes,\n\
          \  ear_max_bacia,\n  CASE\n    WHEN NULLIF(ear_max_bacia, 0) IS NULL THEN NULL\n    ELSE ROUND(ear_verif_bacia_mwmes\
          \ / NULLIF(ear_max_bacia, 0) * 100, 2)\n  END AS ear_percentual_calculado\nFROM {source}\nWHERE\
          \ nomecurto = '{bacia}'\n  AND TRY_CAST(ear_data AS DATE) = '{data}'"
        output_unit: '%'
        matches:
          output_modes:
          - comparison
          metrics:
          - ear_max_bacia
          - ear_verif_bacia_mwmes
          grain: day
        validated_params:
          bacia: GRANDE
          data: '2003-05-24'
- property: fewShotQueries
  value:
  - question: Como evoluiu o percentual de armazenamento de cada bacia nos últimos 12 meses?
    sql: SELECT nomecurto, TRY_CAST(ear_data AS DATE) AS ear_data_date, ear_verif_bacia_percentual FROM
      read_parquet('s3://ons-aws-prod-opendata/dataset/ear_bacia_di/*.parquet') WHERE TRY_CAST(ear_data
      AS DATE) >= CURRENT_DATE - INTERVAL 365 DAY AND TRY_CAST(ear_data AS DATE) IS NOT NULL ORDER BY
      nomecurto, ear_data_date
  - question: Quais bacias estão com armazenamento abaixo de 30% da capacidade máxima na data mais recente
      disponível?
    sql: WITH ultima_data AS ( SELECT MAX(TRY_CAST(ear_data AS DATE)) AS max_data FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ear_bacia_di/*.parquet')
      ) SELECT b.nomecurto, TRY_CAST(b.ear_data AS DATE) AS ear_data_date, b.ear_verif_bacia_mwmes, b.ear_max_bacia,
      b.ear_verif_bacia_percentual FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ear_bacia_di/*.parquet')
      AS b INNER JOIN ultima_data AS u ON TRY_CAST(b.ear_data AS DATE) = u.max_data WHERE b.ear_verif_bacia_percentual
      < 30.0 AND b.ear_max_bacia > 0.0 ORDER BY b.ear_verif_bacia_percentual ASC
  - question: Qual foi o menor nível de armazenamento histórico de cada bacia e em que data ocorreu?
    sql: WITH ranked AS ( SELECT nomecurto, TRY_CAST(ear_data AS DATE) AS ear_data_date, ear_verif_bacia_percentual,
      ear_verif_bacia_mwmes, ROW_NUMBER() OVER ( PARTITION BY nomecurto ORDER BY ear_verif_bacia_percentual
      ASC ) AS rn FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ear_bacia_di/*.parquet') WHERE
      ear_max_bacia > 0.0 AND TRY_CAST(ear_data AS DATE) IS NOT NULL ) SELECT nomecurto, ear_data_date,
      ear_verif_bacia_percentual, ear_verif_bacia_mwmes FROM ranked WHERE rn = 1 ORDER BY ear_verif_bacia_percentual
      ASC
