- property: fewShotQueries
  value:
  - question: Qual o fator de disponibilidade médio por tipo de usina em cada ano?
    sql: SELECT din_ano, id_tipousina, ROUND(AVG(val_dispf), 2) AS dispf_medio, ROUND(AVG(val_indisppf),
      2) AS indisppf_medio, ROUND(AVG(val_indispff), 2) AS indispff_medio, COUNT(*) AS qtd_unidades FROM
      read_parquet('s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_an/*.parquet')
      GROUP BY din_ano, id_tipousina ORDER BY din_ano DESC, dispf_medio DESC;
  - question: Quais unidades geradoras tiveram maior indisponibilidade forçada em 2023?
    sql: SELECT din_ano, id_usina, nom_usina, cod_equipamento, num_unidadegeradora, nom_agenteproprietario,
      id_tipousina, id_subsistema, val_indispff, val_tdff, val_dmdff FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_an/*.parquet')
      WHERE din_ano = 2023 ORDER BY val_indispff DESC LIMIT 20;
  - question: Como evoluiu o fator de disponibilidade médio por subsistema entre 2011 e 2023?
    sql: SELECT din_ano, id_subsistema, nom_subsistema, ROUND(AVG(val_dispf), 2) AS dispf_medio, ROUND(AVG(val_indisppf),
      2) AS indisppf_medio, ROUND(AVG(val_indispff), 2) AS indispff_medio, COUNT(DISTINCT id_usina) AS
      qtd_usinas, COUNT(*) AS qtd_unidades FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_an/*.parquet')
      WHERE din_ano BETWEEN 2011 AND 2023 GROUP BY din_ano, id_subsistema, nom_subsistema ORDER BY id_subsistema,
      din_ano;
