    union_by_name=true)
- property: temporalCoverageStart
  value: '2011-01-01'
- property: semantics
  value:
    measure_terms:
    - disponibilidade
    - disponivel
    - indisponibilidade
    - indisponivel
    temporal_perspective: verificado
    row_grain:
      temporal: 1 dia
      temporal_column: din_ano
      spatial: usina
      entity: usina
      one_row_per:
      - din_ano
      - id_subsistema
      - ceg
      - id_usina
      - cod_equipamento
      - num_unidadegeradora
    dimension_columns:
