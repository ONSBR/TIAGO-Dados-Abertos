customProperties:
- property: vectorTags
  value:
  - disponibilidade das unidades geradoras
  - indisponibilidade das maquinas
  - falhas forcadas das unidades geradoras
  - quanto a unidade geradora ficou parada
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver indicadores de desempenho de unidades geradoras
    como disponibilidade, indisponibilidade programada ou forçada, frequência ou duração de falhas forçadas,
    ou confiabilidade do parque gerador brasileiro em base anual. Também relevante para perguntas sobre
    benchmarking de desempenho entre usinas, agentes proprietários ou tipos de geração, e para análises
    regulatórias referentes ao Submódulo 9.2 dos Procedimentos de Rede do ONS.
- property: agentInstructions
  value: '- [din_ano] O dataset é nominalmente mensal (''_mensal'' no nome e no título CKAN), porém o
    schema físico S3 apresenta apenas a coluna din_ano (BIGINT) com valores inteiros de ano (desde 2011),
    sem coluna de mês (din_mes). Isso indica que os dados foram agregados anualmente ou que a coluna de
    mês foi omitida na exportação. Usuários devem estar cientes de que a granularidade real disponível
    é anual.


    - [val_tdff] O valor máximo de val_tdff é 178.560,07 horas, equivalente a aproximadamente 20.4 anos
    de desligamento forçado contínuo. Para um período anual (máximo 8.760 horas/ano), este valor é fisicamente
    impossível para uma única unidade geradora em um único ano, sugerindo possível acumulação histórica,
    erro de cálculo ou unidade de medida diferente da esperada. Requer validação com a metodologia do
    Submódulo 9.2 do ind_disponibilidade_fgeracao_uge_mensal.


    - [val_dmdff] O valor máximo de val_dmdff é 735.99 horas (aproximadamente 30.7 dias), representando
    a duração média de um único evento de desligamento forçado no dataset ind_disponibilidade_fgeracao_uge_mensal.
    Valores acima de 720 horas (30 dias) merecem verificação para distinguir manutenção forçada de manutenção
    programada classificada incorretamente conforme Submódulo 9.2.


    - [val_dispf] Verificar consistência entre val_dispf, val_indisppf e val_indispff no dataset ind_disponibilidade_fgeracao_uge_mensal:
    a soma dos fatores deve ser aproximadamente 100%. Desvios significativos podem indicar sobreposição
    de eventos ou erro de apuração conforme Submódulo 9.2 dos Procedimentos de Rede.


    - [val_fdff] O valor máximo de val_fdff é 0.0369, muito pequeno e com unidade de medida não explicitamente
    documentada no dicionário de dados do ind_disponibilidade_fgeracao_uge_mensal. Pode representar desligamentos
    por hora de operação, por dia ou por mês. Requer confirmação da unidade com a metodologia do Submódulo
    9.2 para uso correto em análises comparativas.


    - [num_unidadegeradora] A coluna num_unidadegeradora é armazenada como VARCHAR em vez de INTEGER/BIGINT
    no dataset ind_disponibilidade_fgeracao_uge_mensal, podendo conter valores com formatação especial
    (ex: "01", "02", "UG-1") ou valores não numéricos. Ordenações e comparações numéricas requerem CAST
    explícito para evitar ordenação lexicográfica incorreta.

    '
- property: typicalQuestions
  value:
  - Quais usinas hidrelétricas tiveram maior fator de indisponibilidade forçada em 2023?
  - Qual a evolução do fator de disponibilidade médio das termelétricas do subsistema Nordeste entre 2015
    e 2023?
  - Quais unidades geradoras apresentaram maior tempo total de desligamento por falha forçada no último
    ano disponível?
  - Como se compara a disponibilidade média de usinas eólicas versus hidrelétricas por subsistema?
  - Quais agentes proprietários têm as unidades geradoras com maior frequência de desligamentos forçados?
- property: granularity
  value: anual
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
