description:
  purpose: Suportar o monitoramento regulatório e operacional da confiabilidade do parque gerador brasileiro em base mensal, permitindo que agentes do setor elétrico, reguladores (ANEEL) e o próprio ONS avaliem o desempenho histórico de cada unidade geradora, identifiquem padrões de indisponibilidade forçada e programada, subsidiem decisões de planejamento da operação e manutenção, e cumpram obrigações regulatórias de reporte de confiabilidade conforme o Submódulo 9.2 dos Procedimentos de Rede. Analistas de confiabilidade, engenheiros de manutenção e gestores de ativos de geração utilizam este dataset para benchmarking de desempenho entre usinas, identificação de unidades geradoras com alta taxa de falhas forçadas e planejamento de intervenções de manutenção em base mensal.
  limitations: A granularidade temporal é mensal, com chave natural (dat_mesreferencia, cod_equipamento). A coluna nom_estado apresenta nulos em parte dos registros. Os dados fazem parte de processo de consistência recorrente e podem ser atualizados após publicação. Valores de val_tdff podem atingir magnitudes elevadas que requerem validação contra a metodologia do Submódulo 9.2.
  usage: Recuperar este dataset quando a pergunta envolver indicadores mensais de desempenho de unidades geradoras como disponibilidade (DISPF), indisponibilidade programada (INDISPPF) ou forçada (INDISPFF), frequência de desligamentos forçados (FDFF), duração média de falhas forçadas (DMDFF), taxa de desligamento forçado (TDFF), ou confiabilidade do parque gerador brasileiro em base mensal por unidade geradora.
