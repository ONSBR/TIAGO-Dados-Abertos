- property: fewShotQueries
  value:
  - question: Quais usinas hidrelétricas tiveram maior fator de indisponibilidade forçada em janeiro de 2024?
    sql: SELECT nom_usina, id_usina, AVG(val_indispff) as indispff_media FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_me/*.parquet', union_by_name=true) WHERE id_tipousina = 'UHE' AND dat_mesreferencia >= '2024-01-01' AND dat_mesreferencia < '2024-02-01' GROUP BY nom_usina, id_usina ORDER BY indispff_media DESC LIMIT 20
  - question: Qual a evolução mensal do fator de disponibilidade médio das termelétricas do subsistema Nordeste em 2023?
    sql: SELECT dat_mesreferencia, AVG(val_dispf) as dispf_media FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_me/*.parquet', union_by_name=true) WHERE id_tipousina = 'UTE' AND nom_subsistema = 'Nordeste' AND dat_mesreferencia >= '2023-01-01' AND dat_mesreferencia < '2024-01-01' GROUP BY dat_mesreferencia ORDER BY dat_mesreferencia
  - question: Quais unidades geradoras apresentaram maior duração média de desligamento forçado nos últimos 12 meses?
    sql: SELECT nom_unidadegeradora, nom_usina, id_tipousina, SUM(val_dmdff) as dmdff_total FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_me/*.parquet', union_by_name=true) WHERE dat_mesreferencia >= '2023-01-01' AND dat_mesreferencia < '2024-01-01' GROUP BY nom_unidadegeradora, nom_usina, id_tipousina ORDER BY dmdff_total DESC LIMIT 20
  - question: Como se compara a disponibilidade mensal média de usinas nucleares versus hidrelétricas por subsistema?
    sql: SELECT nom_subsistema, id_tipousina, dat_mesreferencia, AVG(val_dispf) as dispf_media FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_me/*.parquet', union_by_name=true) WHERE id_tipousina IN ('UTN', 'UHE') AND dat_mesreferencia >= '2023-01-01' AND dat_mesreferencia < '2024-01-01' GROUP BY nom_subsistema, id_tipousina, dat_mesreferencia ORDER BY nom_subsistema, id_tipousina, dat_mesreferencia
  - question: Quais agentes proprietários têm as unidades geradoras com maior frequência de desligamentos forçados no último trimestre disponível?
    sql: SELECT nom_agenteproprietario, SUM(val_fdff) as fdff_total FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_me/*.parquet', union_by_name=true) WHERE dat_mesreferencia >= '2023-10-01' AND dat_mesreferencia < '2024-01-01' GROUP BY nom_agenteproprietario ORDER BY fdff_total DESC LIMIT 20
