customProperties:
- property: partitionPruning
  value: year
- property: aiContext
  value: Indicadores mensais de disponibilidade, indisponibilidade programada e forçada de unidades geradoras individuais (UHE, UTE, UTN), com fatores DISPF, INDISPPF, INDISPFF, duração média (DMDFF), frequência (FDFF) e taxa de desligamentos forçados (TDFF), agregados por unidade geradora em base mensal. Permite benchmarking de confiabilidade entre máquinas, identificação de unidades com alta taxa de falhas, análise de desempenho por agente proprietário, subsistema ou tipo de geração, e monitoramento de tendências mensais de confiabilidade do parque gerador brasileiro conforme Submódulo 9.2 dos Procedimentos de Rede.
- property: agentInstructions
  value: |
    - [dat_mesreferencia] A chave natural do dataset é (dat_mesreferencia, cod_equipamento). Sempre filtrar por ambas as colunas para garantir unicidade de registros por unidade geradora e mês.

    - [nom_estado] A coluna nom_estado apresenta nulos em parte dos registros. Filtros ou agregações por estado devem usar COALESCE ou tratar nulos explicitamente para evitar perda de registros.

    - [val_dispf] Verificar consistência entre val_dispf, val_indisppf e val_indispff: a soma dos três indicadores deve ser aproximadamente 100%. Desvios significativos podem indicar sobreposição de eventos ou erro de apuração conforme Submódulo 9.2.

    - [val_indisppf] Valores de val_indisppf próximos a 100% indicam unidade geradora com quase todo o tempo em manutenção programada no mês, podendo representar unidades em reforma completa ou dados inconsistentes.

    - [val_indispff] Valores de val_indispff próximos a 100% indicam unidade geradora com quase todo o tempo em indisponibilidade forçada no mês, situação extrema que pode indicar unidade desativada ou erro de dados.

    - [val_dmdff] Valores elevados de val_dmdff (acima de 720 horas ou 30 dias) merecem validação para distinguir falhas forçadas de manutenções programadas mal classificadas conforme Submódulo 9.2.

    - [val_fdff] O valor de val_fdff tem unidade de medida não explicitamente documentada. Pode representar desligamentos por hora de operação ou outra métrica. Requer confirmação da unidade com a metodologia do Submódulo 9.2 para uso correto em análises comparativas.

    - [val_tdff] Valores muito elevados de val_tdff podem indicar acumulação de horas de desligamento forçado; interpretar conforme a metodologia do Submódulo 9.2.

    - [num_unidadegeradora] A coluna num_unidadegeradora é armazenada como VARCHAR, podendo conter valores com formatação especial. Ordenações e comparações numéricas requerem CAST explícito para evitar ordenação lexicográfica incorreta.

    - [geral] Os dados fazem parte de processo de consistência recorrente do ONS e podem ser atualizados após publicação. Análises históricas devem considerar possíveis reprocessamentos que alterem valores passados.
- property: typicalQuestions
  value:
  - Quais usinas hidrelétricas tiveram maior fator de indisponibilidade forçada em janeiro de 2024?
  - Qual a evolução mensal do fator de disponibilidade médio das termelétricas do subsistema Nordeste em 2023?
  - Quais unidades geradoras apresentaram maior duração média de desligamento forçado nos últimos 12 meses?
  - Como se compara a disponibilidade mensal média de usinas nucleares versus hidrelétricas por subsistema?
  - Quais agentes proprietários têm as unidades geradoras com maior frequência de desligamentos forçados no último trimestre disponível?
- property: vectorTags
  value:
  - disponibilidade mensal das unidades geradoras
  - indisponibilidade das maquinas por mes
  - falhas forcadas das unidades geradoras mensais
  - disponibilidade por unidade geradora mensal
  - indisponibilidade forcada por maquina mes
  - taxa de falha mensal por ug
  - confiabilidade das turbinas mensal
  - tempo parado por falha na usina mes
  - fator disponibilidade mensal por equipamento
  - desempenho das unidades geradoras por agente mensal
  - frequencia desligamento forcado por ug mes
  - duracao media falha mensal ug
- property: granularity
  value: mensal
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_me/*.parquet', union_by_name=true)
