            ROUND(AVG(val_dispf), 1) AS dispf,
            ROUND(AVG(val_indisppf), 1) AS indisppf,
            ROUND(AVG(val_indispff), 1) AS indispff,
            ROUND(SUM(val_dmdff), 1) AS dmdff,
            ROUND(SUM(val_fdff), 1) AS fdff
