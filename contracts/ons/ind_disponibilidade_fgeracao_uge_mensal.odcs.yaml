      fonte: null
      usina: ceg
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: potencia
      label: Potencia
      columns:
      - val_potencia
      expression: val_potencia
      quantity_kind: capacity
      unit_native: MW
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total:
          sql: SUM(val_potencia)
          unit: MW
        maximum:
          sql: MAX(val_potencia)
          unit: MW
        time_series:
          sql: SUM(val_potencia)
          unit: MW
        ranking:
          sql: SUM(val_potencia)
          unit: MW
        comparison:
          sql: SUM(val_potencia)
          unit: MW
      interval_hours: 24.0
      aliases:
      - potencia
      - potencia_instalada
      - capacidade_instalada
      - MW
    - id: dispf
      label: Fator de Disponibilidade (FD)
      columns:
      - val_dispf
      expression: val_dispf
      quantity_kind: ratio
      unit_native: '%'
      default_aggregation: avg
      forbidden_aggregations:
      - sum
      aggregation_modes:
        average:
          sql: AVG(val_dispf)
          unit: '%'
        maximum:
          sql: MAX(val_dispf)
          unit: '%'
        minimum:
          sql: MIN(val_dispf)
          unit: '%'
        time_series:
          sql: AVG(val_dispf)
          unit: '%'
        ranking:
          sql: AVG(val_dispf)
          unit: '%'
        comparison:
          sql: AVG(val_dispf)
          unit: '%'
      interval_hours: 24.0
      aliases:
      - disponibilidade
      - fator_disponibilidade
      - fd
      - disponibilidade_forcada
      - val_fd
    - id: indisppf
