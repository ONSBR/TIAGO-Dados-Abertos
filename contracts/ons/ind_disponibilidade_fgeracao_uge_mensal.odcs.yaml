servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_an/*.parquet
  format: parquet
description:
  purpose: Suportar o monitoramento regulatório e operacional da confiabilidade do parque gerador brasileiro,
    permitindo que agentes do setor elétrico, reguladores (ANEEL) e o próprio ONS avaliem o desempenho
    histórico de cada unidade geradora, identifiquem padrões de indisponibilidade forçada e programada,
    subsidiem decisões de planejamento da operação, e cumpram obrigações regulatórias de reporte de confiabilidade
    conforme o Submódulo 9.2 dos Procedimentos de Rede. Analistas de confiabilidade, engenheiros de manutenção
    e gestores de ativos de geração utilizam este dataset para benchmarking de desempenho entre usinas,
    identificação de unidades geradoras com alta taxa de falhas forçadas e planejamento de intervenções
    de manutenção.
  limitations: O nome do dataset contém '_mensal' mas a única coluna temporal é din_ano (BIGINT), sem
    coluna de mês. val_fdff possui escala decimal com max=0. val_tdff possui max=178560.
  usage: Recuperar este dataset quando a pergunta envolver indicadores de desempenho de unidades geradoras
    como disponibilidade, indisponibilidade programada ou forçada, frequência ou duração de falhas forçadas,
    ou confiabilidade do parque gerador brasileiro em base anual.
domain: geracao
schema:
