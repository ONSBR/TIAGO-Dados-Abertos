    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: true
      supports_ranking: true
      primary_use_case: serie_temporal
    selection_policy:
      covers_metrics:
      - potencia
      - dispf
      - indisppf
      - indispff
      - dmdff
      - fdff
      - tdff
      preferred_for:
      - DMFF por unidade geradora
      - FDFF por unidade geradora
      - duracao media falha forcada UGE
      - frequencia desligamento forcado UGE
      - TDFF acumulado por UGE
      - tempo total desligamento UGE
      - indicadores Submodulo 9.2 por UGE
      - benchmarking disponibilidade por agente proprietario
      - FIF por unidade geradora anual
      - FIP por unidade geradora anual
      not_preferred_for:
      - nuclear
      - MMGD
      - microgeracao
      - minigeracao
      - geracao distribuida
      - balanco carga-geracao
      - geracao por subsistema agregada
      - carga verificada
      - preco spot
      - CMO
      - ENA
      - afluencia
      - reservatorio
      - transmissao
      - linha de transmissao
      - subestacao
      - intercambio
      - programacao diaria agregada
      - despacho programado
    value_aliases:
      subsistema:
        SE:
          aliases:
          - sudeste
          - centro-oeste
          - se/co
          - sudeste centro-oeste
          filter: id_subsistema = 'SE'
        S:
          aliases:
          - sul
          filter: id_subsistema = 'S'
        NE:
          aliases:
          - nordeste
          filter: id_subsistema = 'NE'
        N:
          aliases:
          - norte
          filter: id_subsistema = 'N'
        PY:
          aliases:
          - paraguai
          filter: id_subsistema = 'PY'
      nom_subsistema:
        Nordeste:
          aliases:
          - Nordeste
          filter: nom_subsistema = 'Nordeste'
        Norte:
          aliases:
          - Norte
          filter: nom_subsistema = 'Norte'
        Paraguai:
          aliases:
          - Paraguai
          filter: nom_subsistema = 'Paraguai'
        Sudeste/Centro-Oeste:
          aliases:
          - Sudeste/Centro-Oeste
          filter: nom_subsistema = 'Sudeste/Centro-Oeste'
        Sul:
          aliases:
          - Sul
          filter: nom_subsistema = 'Sul'
      nom_modalidadeoperacao:
        Tipo I:
          aliases:
          - Tipo I
          - tipo 1
          - despachada centralizadamente
          filter: nom_modalidadeoperacao = 'Tipo I'
        Tipo II-A:
          aliases:
          - Tipo II-A
          - tipo 2a
          - nao despachada centralizadamente
          filter: nom_modalidadeoperacao = 'Tipo II-A'
      id_tipousina:
        UHE:
          aliases:
          - UHE
          - hidreletrica
          - hidreletrico
          - usina hidreletrica
          filter: id_tipousina = 'UHE'
        UTE:
          aliases:
          - UTE
          - termoeletrica
          - termoeletrico
          - usina termoeletrica
          filter: id_tipousina = 'UTE'
        UTN:
          aliases:
          - UTN
          - termonuclear
          - nuclear
          - usina nuclear
          filter: id_tipousina = 'UTN'
    sql_patterns:
      disponibilidade_media_por_tipo_usina:
        template: "SELECT din_ano, id_tipousina,\n  AVG(val_dispf) AS fator_disponibilidade_medio_pct\n\
          FROM {source}\nWHERE din_ano = {year}\nGROUP BY din_ano, id_tipousina\nORDER BY din_ano, id_tipousina"
        output_unit: '%'
        matches:
          output_modes:
          - average
          metrics:
          - dispf
          grain: year
        validated_params:
          year: '2026'
      ranking_indisponibilidade_forcada:
        template: "SELECT nom_usina, nom_unidadegeradora, id_tipousina,\n  AVG(val_indispff) AS fif_medio_pct\n\
          FROM {source}\nWHERE din_ano = {year}\nGROUP BY nom_usina, nom_unidadegeradora, id_tipousina\n\
          ORDER BY fif_medio_pct DESC\nLIMIT 20"
        output_unit: '%'
        matches:
          output_modes:
          - ranking
          metrics:
          - indispff
          grain: year
        validated_params:
          year: '2026'
      duracao_media_falha_por_agente:
        template: "SELECT nom_agenteproprietario,\n  AVG(val_dmdff) AS dmff_medio_horas\nFROM {source}\n\
          WHERE din_ano = {year}\n  AND val_dmdff IS NOT NULL\nGROUP BY nom_agenteproprietario\nORDER\
          \ BY dmff_medio_horas DESC"
        output_unit: h
        matches:
          output_modes:
          - average
          metrics:
          - dmdff
          grain: year
        validated_params:
          year: '2026'
      cast_num_unidadegeradora:
        template: "SELECT nom_usina,\n  TRY_CAST(num_unidadegeradora AS INTEGER) AS num_ug_int,\n  val_dispf\n\
          FROM {source}\nWHERE din_ano = {year}\nORDER BY nom_usina, num_ug_int"
        output_unit: '%'
        matches:
          output_modes:
          - comparison
          metrics:
          - dispf
          grain: year
        validated_params:
          year: '2026'
    ambiguity_policy:
      default_assumptions:
      - when: usuario pergunta disponibilidade sem especificar metrica
        assume_metric: dispf
        assume_output: average
        note: FD (fator de disponibilidade) e a metrica principal de disponibilidade; usar AVG pois e
          percentual
      - when: usuario pergunta indisponibilidade sem especificar programada ou forcada
        assume_metric: indispff
        assume_output: average
        note: Indisponibilidade forcada e mais frequentemente consultada para analise de confiabilidade;
          se contexto indicar manutencao programada, usar indisppf
      - when: usuario pergunta duracao de falha sem especificar total ou media
        assume_metric: dmdff
        assume_output: average
        note: DMFF (duracao media) e mais interpretavel que TDFF (total acumulado com unidade incerta)
      - when: usuario pergunta frequencia de falha ou taxa de falha
        assume_metric: fdff
        assume_output: average
        note: FDFF e escala decimal (falhas/h), nao percentual; alertar usuario sobre escala
      must_clarify_when:
      - ambiguity: dmdff_vs_tdff
        question: Voce quer a duracao MEDIA de cada falha forcada (DMFF, em horas) ou o tempo TOTAL acumulado
          de desligamento forcado (TDFF, possivelmente em minutos com valores muito altos)?
        trigger_terms:
        - tempo de falha
        - duracao falha
        - horas indisponivel
        - tempo desligado
        note: TDFF tem valores suspeitos (max 178560) que podem representar acumulacao historica; preferir
          DMFF para analises pontuais
      - ambiguity: granularidade_mensal_vs_anual
        question: Este dataset possui granularidade ANUAL (coluna din_ano apenas, sem coluna de mes).
          Voce deseja continuar com dados anuais ou prefere buscar granularidade mensal em outro dataset?
        trigger_terms:
        - mensal
        - por mes
        - mes a mes
        - janeiro
        - fevereiro
        - marco
        - abril
        - maio
        - junho
        - julho
        - agosto
        - setembro
        - outubro
        - novembro
        - dezembro
        note: O nome do dataset contem '_mensal' mas o schema fisico so tem din_ano (BIGINT anual)
      - ambiguity: num_unidadegeradora_ordenacao
        question: Para ordenar unidades geradoras numericamente, e necessario converter num_unidadegeradora
          (VARCHAR) para inteiro. Confirmar uso de TRY_CAST?
        trigger_terms:
        - ordenar por unidade
        - ranking de unidades
        - ug 1
        - ug 2
        - primeira unidade
        note: num_unidadegeradora e VARCHAR; ordenacao lexicografica pode ser incorreta
      redirect_when:
      - user_mentions:
        - nuclear
        - angra
        reason: Tipo UTN existe no dataset mas nao ha coluna de combustivel nuclear separada; para geracao
          verificada de Angra use geracao-usina-2.
        redirect: geracao-usina-2 com filtro id_tipousina = 'UTN'
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Schema nao contem coluna MMGD separada; dataset cobre apenas UHE, UTE e UTN.
        redirect: dataset com coluna val_germmgd ou val_ger_mmgd quando disponivel
      - user_mentions:
        - geracao verificada
        - geracao realizada
        - MWh gerado
        - MWmed gerado
        reason: Dataset contem indicadores de disponibilidade (percentuais e duracao), nao geracao verificada
          em MWmed ou MWh.
        redirect: geracao-usina-2
      - user_mentions:
        - carga
        - demanda
        - consumo
        reason: Dataset nao contem dados de carga ou demanda.
        redirect: ind-disponibilidade-geracao-sin ou dataset de carga ONS
      - user_mentions:
        - preco
        - PLD
        - CMO
        - custo marginal
        reason: Dataset nao contem variaveis de preco ou custo.
        redirect: dataset de CMO ou PLD da CCEE/ONS
      - user_mentions:
        - reservatorio
        - nivel
        - cota
        - afluencia
        - ENA
        reason: Dataset nao contem dados hidrologicos ou de reservatorio.
        redirect: dataset reservatorio ou ENA do ONS
      - user_mentions:
        - intercambio
        - fluxo transmissao
        - linha transmissao
        reason: Dataset nao contem dados de transmissao ou intercambio entre subsistemas.
        redirect: ind_disponibilidade_ft_trlt ou dataset de intercambio ONS
- property: fewShotQueries
  value:
  - question: Qual o fator de disponibilidade médio por tipo de usina em cada ano?
    sql: SELECT din_ano, id_tipousina, ROUND(AVG(val_dispf), 2) AS dispf_medio, ROUND(AVG(val_indisppf),
      2) AS indisppf_medio, ROUND(AVG(val_indispff), 2) AS indispff_medio, COUNT(*) AS qtd_unidades FROM
      read_parquet('s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_an/*.parquet')
      GROUP BY din_ano, id_tipousina ORDER BY din_ano DESC, dispf_medio DESC;
  - question: Quais unidades geradoras tiveram maior indisponibilidade forçada em 2023?
    sql: SELECT din_ano, id_usina, nom_usina, cod_equipamento, num_unidadegeradora, nom_agenteproprietario,
      id_tipousina, id_subsistema, val_indispff, val_tdff, val_dmdff FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_an/*.parquet')
      WHERE din_ano = 2023 ORDER BY val_indispff DESC LIMIT 20;
  - question: Como evoluiu o fator de disponibilidade médio por subsistema entre 2011 e 2023?
    sql: SELECT din_ano, id_subsistema, nom_subsistema, ROUND(AVG(val_dispf), 2) AS dispf_medio, ROUND(AVG(val_indisppf),
      2) AS indisppf_medio, ROUND(AVG(val_indispff), 2) AS indispff_medio, COUNT(DISTINCT id_usina) AS
      qtd_usinas, COUNT(*) AS qtd_unidades FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_an/*.parquet')
      WHERE din_ano BETWEEN 2011 AND 2023 GROUP BY din_ano, id_subsistema, nom_subsistema ORDER BY id_subsistema,
      din_ano;
