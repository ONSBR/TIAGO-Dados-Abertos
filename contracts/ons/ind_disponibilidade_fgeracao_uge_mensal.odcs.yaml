      value:
      - tempo_total_desligamento_forcado
      - tdff
      - horas_indisponibilidade_forcada
    - property: semanticType
      value: METRIC
    - property: unit
      value: min
  quality:
  - type: custom
    engine: soda
    implementation: "checks for ind_disponibilidade_fgeracao_uge_mensal:\n  - row_count > 0:\n      name:\
      \ Tabela não pode estar vazia\n\n  # Referential integrity\n  - invalid_count(id_subsistema) = 0:\n\
      \      valid values:\n        - 'N'\n        - 'NE'\n        - 'PY'\n        - 'S'\n        - 'SE'\n\
      \      name: id_subsistema deve ser um dos valores válidos\n  - invalid_count(nom_subsistema) =\
      \ 0:\n      valid values:\n        - 'Nordeste'\n        - 'Norte'\n        - 'Paraguai'\n     \
      \   - 'Sudeste/Centro-Oeste'\n        - 'Sul'\n      name: nom_subsistema deve ser um dos valores\
      \ válidos\n  - invalid_count(id_estado) = 0:\n      valid values:\n        - 'AL'\n        - 'AM'\n\
      \        - 'AP'\n        - 'BA'\n        - 'CE'\n        - 'DF'\n        - 'ES'\n        - 'GO'\n\
      \        - 'I'\n        - 'MA'\n        - 'MG'\n        - 'MS'\n        - 'MT'\n        - 'PA'\n\
      \        - 'PB'\n        - 'PE'\n        - 'PI'\n        - 'PR'\n        - 'RJ'\n        - 'RN'\n\
      \        - 'RO'\n        - 'RR'\n        - 'RS'\n        - 'SC'\n        - 'SE'\n        - 'SP'\n\
      \        - 'TO'\n      name: id_estado deve ser um dos valores válidos\n  - invalid_count(nom_estado)\
      \ = 0:\n      valid values:\n        - 'Alagoas'\n        - 'Amapá'\n        - 'Amazonas'\n    \
      \    - 'Bahia'\n        - 'Ceará'\n        - 'Distrito Federal'\n        - 'Espírito Santo'\n  \
      \      - 'Goiás'\n        - 'Maranhão'\n        - 'Mato Grosso'\n        - 'Mato Grosso do Sul'\n\
      \        - 'Minas Gerais'\n        - 'Paraná'\n        - 'Paraíba'\n        - 'Pará'\n        -\
      \ 'Pernambuco'\n        - 'Piauí'\n        - 'Rio Grande do Norte'\n        - 'Rio Grande do Sul'\n\
      \        - 'Rio de Janeiro'\n        - 'Rondônia'\n        - 'Roraima'\n        - 'Santa Catarina'\n\
      \        - 'Sergipe'\n        - 'São Paulo'\n        - 'Tocantins'\n      name: nom_estado deve\
      \ ser um dos valores válidos\n  - invalid_count(nom_modalidadeoperacao) = 0:\n      valid values:\n\
      \        - 'Tipo I'\n        - 'Tipo II-A'\n      name: nom_modalidadeoperacao deve ser um dos valores\
      \ válidos\n  - invalid_count(id_tipousina) = 0:\n      valid values:\n        - 'UHE'\n        -\
      \ 'UTE'\n        - 'UTN'\n      name: id_tipousina deve ser um dos valores válidos\n\n  # Circuit\
      \ breaker: colunas numéricas VARCHAR (formato de origem)\n  - missing_percent(num_unidadegeradora)\
      \ < 5:\n      name: num_unidadegeradora não pode ter >5% nulos\n\n  # Baseline de volume — margem\
      \ ±20% do row_count validado\n  - row_count between 12840 and 19260:\n      name: Volume esperado\
      \ entre 12,840 e 19,260 registros\n\n  # Unicidade da chave primária composta ['id_usina', 'cod_equipamento',\
      \ 'num_unidadegeradora', 'din_ano'] (candidata LLM)\n  - failed rows:\n      name: Chave composta\
      \ (id_usina, cod_equipamento, num_unidadegeradora, din_ano) não deve ter duplicatas\n      fail\
      \ query: |\n        SELECT * FROM ind_disponibilidade_fgeracao_uge_mensal\n        WHERE (id_usina,\
      \ cod_equipamento, num_unidadegeradora, din_ano) IN (\n          SELECT id_usina, cod_equipamento,\
      \ num_unidadegeradora, din_ano FROM ind_disponibilidade_fgeracao_uge_mensal\n          GROUP BY\
      \ id_usina, cod_equipamento, num_unidadegeradora, din_ano\n          HAVING COUNT(*) > 1\n     \
      \   )\n"
team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/ind_disponibilidade_fgeracao_uge_mensal
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - disponibilidade das unidades geradoras
  - indisponibilidade das maquinas
  - falhas forcadas das unidades geradoras
  - quanto a unidade geradora ficou parada
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver indicadores de desempenho de unidades geradoras
    como disponibilidade, indisponibilidade programada ou forçada, frequência ou duração de falhas forçadas,
    ou confiabilidade do parque gerador brasileiro em base anual. Também relevante para perguntas sobre
    benchmarking de desempenho entre usinas, agentes proprietários ou tipos de geração, e para análises
    regulatórias referentes ao Submódulo 9.2 dos Procedimentos de Rede do ONS.
- property: agentInstructions
  value: '- [din_ano] O dataset é nominalmente mensal (''_mensal'' no nome e no título CKAN), porém o
    schema físico S3 apresenta apenas a coluna din_ano (BIGINT) com valores inteiros de ano (2011 a 2026),
    sem coluna de mês (din_mes). Isso indica que os dados foram agregados anualmente ou que a coluna de
    mês foi omitida na exportação. Usuários devem estar cientes de que a granularidade real disponível
    é anual.


    - [val_tdff] O valor máximo de val_tdff é 178.560,07 horas, equivalente a aproximadamente 20.4 anos
    de desligamento forçado contínuo. Para um período anual (máximo 8.760 horas/ano), este valor é fisicamente
    impossível para uma única unidade geradora em um único ano, sugerindo possível acumulação histórica,
    erro de cálculo ou unidade de medida diferente da esperada. Requer validação com a metodologia do
    Submódulo 9.2 do ind_disponibilidade_fgeracao_uge_mensal.


    - [val_dmdff] O valor máximo de val_dmdff é 735.99 horas (aproximadamente 30.7 dias), representando
    a duração média de um único evento de desligamento forçado no dataset ind_disponibilidade_fgeracao_uge_mensal.
    Valores acima de 720 horas (30 dias) merecem verificação para distinguir manutenção forçada de manutenção
    programada classificada incorretamente conforme Submódulo 9.2.


    - [val_dispf] Verificar consistência entre val_dispf, val_indisppf e val_indispff no dataset ind_disponibilidade_fgeracao_uge_mensal:
    a soma dos fatores deve ser aproximadamente 100%. Desvios significativos podem indicar sobreposição
    de eventos ou erro de apuração conforme Submódulo 9.2 dos Procedimentos de Rede.


    - [val_fdff] O valor máximo de val_fdff é 0.0369, muito pequeno e com unidade de medida não explicitamente
    documentada no dicionário de dados do ind_disponibilidade_fgeracao_uge_mensal. Pode representar desligamentos
    por hora de operação, por dia ou por mês. Requer confirmação da unidade com a metodologia do Submódulo
    9.2 para uso correto em análises comparativas.


    - [num_unidadegeradora] A coluna num_unidadegeradora é armazenada como VARCHAR em vez de INTEGER/BIGINT
    no dataset ind_disponibilidade_fgeracao_uge_mensal, podendo conter valores com formatação especial
    (ex: "01", "02", "UG-1") ou valores não numéricos. Ordenações e comparações numéricas requerem CAST
    explícito para evitar ordenação lexicográfica incorreta.

    '
- property: typicalQuestions
  value:
  - Quais usinas hidrelétricas tiveram maior fator de indisponibilidade forçada em 2023?
  - Qual a evolução do fator de disponibilidade médio das termelétricas do subsistema Nordeste entre 2015
    e 2023?
  - Quais unidades geradoras apresentaram maior tempo total de desligamento por falha forçada no último
    ano disponível?
  - Como se compara a disponibilidade média de usinas eólicas versus hidrelétricas por subsistema?
  - Quais agentes proprietários têm as unidades geradoras com maior frequência de desligamentos forçados?
- property: granularity
  value: anual
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_an/*.parquet',
    union_by_name=true)
- property: temporalCoverageStart
  value: '2011-01-01'
- property: semantics
  value:
    temporal_perspective: verificado
    row_grain:
      temporal: 1 dia
      temporal_column: din_ano
      spatial: usina
      entity: usina
      one_row_per:
      - din_ano
      - id_subsistema
      - ceg
      - id_usina
      - cod_equipamento
      - num_unidadegeradora
    dimension_columns:
      subsistema: id_subsistema
      fonte: null
      usina: ceg
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: potencia
      label: Potencia
      columns:
      - val_potencia
      expression: val_potencia
      quantity_kind: capacity
      unit_native: MW
      default_aggregation: sum
      forbidden_aggregations: []
      valid_intents:
      - potencia
      - potencia_instalada
      - capacidade_instalada
      - MW
      aggregation_modes:
        total:
          sql: SUM(val_potencia)
          unit: MW
        maximum:
          sql: MAX(val_potencia)
          unit: MW
        time_series:
          sql: SUM(val_potencia)
          unit: MW
        ranking:
          sql: SUM(val_potencia)
          unit: MW
        comparison:
          sql: SUM(val_potencia)
          unit: MW
      interval_hours: 24.0
      aliases:
      - potencia
      - potencia_instalada
      - capacidade_instalada
      - MW
    - id: dispf
      label: Fator de Disponibilidade (FD)
      columns:
      - val_dispf
      expression: val_dispf
      quantity_kind: ratio
      unit_native: '%'
      default_aggregation: avg
      forbidden_aggregations:
      - sum
      valid_intents:
      - dispf
      - disponibilidade
      - fator_disponibilidade
      - fd
      - disponibilidade_forcada
      - val_fd
      aggregation_modes:
        average:
          sql: AVG(val_dispf)
          unit: '%'
        maximum:
          sql: MAX(val_dispf)
          unit: '%'
        minimum:
          sql: MIN(val_dispf)
          unit: '%'
        time_series:
          sql: AVG(val_dispf)
          unit: '%'
        ranking:
          sql: AVG(val_dispf)
          unit: '%'
        comparison:
          sql: AVG(val_dispf)
          unit: '%'
      interval_hours: 24.0
      aliases:
      - disponibilidade
      - fator_disponibilidade
      - fd
      - disponibilidade_forcada
      - val_fd
    - id: indisppf
      label: Fator de Indisponibilidade Programada (FIP)
