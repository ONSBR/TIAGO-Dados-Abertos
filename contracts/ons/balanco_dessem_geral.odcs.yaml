      - consumo de bombeamento
      - estacao elevatoria
    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: true
      supports_ranking: false
      primary_use_case: serie_temporal
    selection_policy:
      covers_metrics:
      - geracao_total
      - demanda
      - geracao_renovavel
      - geracao_hidraulica
      - geracao_termica
      - cons_elevatoria
      preferred_for:
      - balanco DESSEM geral
      - mix geracao DESSEM subsistema
      - balanco energetico semi-horario
      - geracao agregada por fonte subsistema
      - demanda programada DESSEM patamar
      - consumo elevatoria DESSEM
      - participacao renovavel DESSEM
      - fechamento balanco SIN DESSEM
      - despacho agregado curto prazo
      not_preferred_for:
      - ranking usinas
      - usina individual
      - nuclear separado
      - MMGD
      - gas natural separado
      - carvao separado
      - biomassa separada
      - CEG
      - eolica individual
      - solar individual
      - PCH individual
      - dados verificados realizados
      - historico pre-2025
    value_aliases:
      subsistema:
        SE:
          aliases:
          - sudeste
          - centro-oeste
          - se/co
          - sudeste centro-oeste
          filter: cod_subsistema = 'SE'
        S:
          aliases:
          - sul
          filter: cod_subsistema = 'S'
        NE:
          aliases:
          - nordeste
          filter: cod_subsistema = 'NE'
        N:
          aliases:
          - norte
          filter: cod_subsistema = 'N'
      fonte:
        hidraulica:
          aliases:
          - hidraulica
          - hidreletrica
          - hidrica
          - uhe
          - agua
          - hidro
          columns:
          - val_geracao_hidraulica
        termica:
          aliases:
          - termica
          - termeletrica
          - ute
          - despacho termico
          columns:
          - val_geracao_termica
        renovavel:
          aliases:
          - renovavel
          - eolica e solar
          - nao-convencional
          - fontes renovaveis
          columns:
          - val_geracao_renovavel
    sql_patterns:
      geracao_total_mensal:
        template: "SELECT DATE_TRUNC('month', CAST(din_programacaodia AS DATE)) AS mes, cod_subsistema,\n\
          \  SUM((TRY_CAST(val_geracao_renovavel AS DOUBLE) + TRY_CAST(val_geracao_hidraulica AS DOUBLE)\
          \ + TRY_CAST(val_geracao_termica AS DOUBLE)) * 0.5) / 1000 AS geracao_gwh\nFROM {source}\nWHERE\
          \ EXTRACT(YEAR FROM CAST(din_programacaodia AS DATE)) = {year}\nGROUP BY 1, 2\nORDER BY 1, 2"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracao_total
          grain: month
        validated_params:
          year: '2025'
      mix_geracao_diario:
        template: "SELECT CAST(din_programacaodia AS DATE) AS dia, cod_subsistema,\n  SUM(TRY_CAST(val_geracao_hidraulica\
          \ AS DOUBLE) * 0.5) / 1000 AS hidraulica_gwh,\n  SUM(TRY_CAST(val_geracao_termica AS DOUBLE)\
          \ * 0.5) / 1000 AS termica_gwh,\n  SUM(TRY_CAST(val_geracao_renovavel AS DOUBLE) * 0.5) / 1000\
          \ AS renovavel_gwh\nFROM {source}\nWHERE CAST(din_programacaodia AS DATE) = '{date}'\nGROUP\
          \ BY 1, 2\nORDER BY 1, 2"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracao_hidraulica
          - geracao_termica
          - geracao_renovavel
          grain: day
        validated_params:
          date: '2025-06-05'
      participacao_renovavel:
        template: "SELECT CAST(din_programacaodia AS DATE) AS dia, cod_subsistema,\n  AVG(\n    TRY_CAST(val_geracao_renovavel\
          \ AS DOUBLE) /\n    NULLIF(TRY_CAST(val_geracao_renovavel AS DOUBLE) + TRY_CAST(val_geracao_hidraulica\
          \ AS DOUBLE) + TRY_CAST(val_geracao_termica AS DOUBLE), 0)\n  ) * 100 AS participacao_renovavel_pct\n\
          FROM {source}\nWHERE CAST(din_programacaodia AS DATE) BETWEEN '{start}' AND '{end}'\nGROUP BY\
          \ 1, 2\nORDER BY 1, 2"
        output_unit: '%'
        matches:
          output_modes:
          - average
          metrics:
          - geracao_renovavel
          grain: day
        validated_params:
          start: '2025-05-23'
          end: '2026-07-09'
      pico_demanda_patamar:
        template: "SELECT num_patamar, cod_subsistema,\n  MAX(TRY_CAST(val_demanda AS DOUBLE)) AS pico_demanda_mwmed\n\
          FROM {source}\nWHERE CAST(din_programacaodia AS DATE) BETWEEN '{start}' AND '{end}'\nGROUP BY\
          \ 1, 2\nORDER BY 3 DESC"
        output_unit: MWmed
        matches:
          output_modes:
          - peak_power
          metrics:
          - demanda
          grain: patamar
        validated_params:
          start: '2025-05-23'
          end: '2026-07-09'
      balanco_dessem_geral_mensal_gwh:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_programacaodia AS TIMESTAMP)) AS mes,\n\
          \  ROUND(SUM(TRY_CAST(TRY_CAST(val_cons_elevatoria AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1)\
          \ AS val_cons_elevatoria_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_demanda AS VARCHAR) AS DOUBLE))\
          \ * 0.5 / 1000, 1) AS val_demanda_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracao_hidraulica\
          \ AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1) AS val_geracao_hidraulica_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracao_renovavel\
          \ AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1) AS val_geracao_renovavel_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracao_termica\
          \ AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1) AS val_geracao_termica_gwh\nFROM {source}\nWHERE\
          \ EXTRACT(YEAR FROM TRY_CAST(din_programacaodia AS TIMESTAMP)) = {year}\nGROUP BY 1\nORDER BY\
          \ 1"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          grain: month
        validated_params:
          year: '2025'
      balanco_dessem_geral_mensal_mwmed:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_programacaodia AS TIMESTAMP)) AS mes,\n\
          \  ROUND(SUM(TRY_CAST(TRY_CAST(val_cons_elevatoria AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT\
          \ TRY_CAST(din_programacaodia AS TIMESTAMP)), 1) AS val_cons_elevatoria_mwmed,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_demanda\
          \ AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_programacaodia AS TIMESTAMP)), 1) AS\
          \ val_demanda_mwmed,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracao_hidraulica AS VARCHAR) AS DOUBLE))\
          \ / COUNT(DISTINCT TRY_CAST(din_programacaodia AS TIMESTAMP)), 1) AS val_geracao_hidraulica_mwmed,\n\
          \  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracao_renovavel AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT\
          \ TRY_CAST(din_programacaodia AS TIMESTAMP)), 1) AS val_geracao_renovavel_mwmed,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracao_termica\
          \ AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_programacaodia AS TIMESTAMP)), 1) AS\
          \ val_geracao_termica_mwmed\nFROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_programacaodia\
          \ AS TIMESTAMP)) = {year}\nGROUP BY 1\nORDER BY 1"
        output_unit: MWmed
        matches:
          output_modes:
          - average_power
          grain: month
        validated_params:
          year: '2025'
    ambiguity_policy:
      default_assumptions:
      - when: geracao
        assume_metric: geracao_total
        assume_output: total_energy
        assume_unit: GWh
        unless_mentions:
        - media
        - potencia
        - pico
        - instantaneo
        - MWmed
      - when: mix de geracao
        assume_metric: geracao_total
        assume_output: total_energy
        assume_unit: GWh
        note: Detalhar por fonte hidraulica, termica e renovavel separadamente
      - when: demanda
        assume_metric: demanda
        assume_output: average_power
        assume_unit: MWmed
        unless_mentions:
        - total
        - energia
        - GWh
      - when: carga
        assume_metric: demanda
        assume_output: average_power
        assume_unit: MWmed
        unless_mentions:
        - total
        - energia
        - GWh
      - when: renovavel
        assume_metric: geracao_renovavel
        assume_output: total_energy
        assume_unit: GWh
        unless_mentions:
        - media
        - potencia
        - pico
      - when: elevatoria
        assume_metric: cons_elevatoria
        assume_output: total_energy
        assume_unit: GWh
      must_clarify_when:
      - ambiguity: energia_total_vs_potencia_media
        question: Você quer energia total no período (GWh) ou potência média (MWmed)?
        trigger_terms:
        - quanto foi gerado
        - nivel de geracao
        - valor de geracao
      - ambiguity: subsistema_vs_sin
        question: 'Você quer o resultado por subsistema (SE, S, NE, N) ou o total do SIN? Nota: este dataset
          não contém linha SIN agregada; o total SIN deve ser calculado somando os quatro subsistemas.'
        trigger_terms:
        - brasil
        - nacional
        - SIN
        - total do pais
      redirect_when:
      - user_mentions:
        - usina
        - ceg
        - itaipu
        - belo monte
        - tucurui
        - ranking de usinas
        reason: Schema nao contem CEG, usina ou identificador fisico de usina; granularidade e subsistema.
        redirect: geracao-usina-2
      - user_mentions:
        - nuclear
        - angra
        reason: Geracao termica esta agregada; nao ha coluna nuclear separada.
        redirect: geracao-usina-2 com filtro de combustivel nuclear
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Schema nao contem coluna MMGD; microgeracao nao e despachada centralizadamente pelo DESSEM.
        redirect: dataset com coluna val_germmgd ou val_ger_mmgd
      - user_mentions:
        - gas
        - gas natural
        - GNL
        reason: Geracao termica esta agregada em val_geracao_termica; nao ha abertura por combustivel.
        redirect: geracao-usina-2 com filtro de combustivel gas
      - user_mentions:
        - carvao
        - carvoeira
        reason: Geracao termica esta agregada em val_geracao_termica; nao ha abertura por combustivel.
        redirect: geracao-usina-2 com filtro de combustivel carvao
      - user_mentions:
        - biomassa
        reason: Geracao termica esta agregada em val_geracao_termica; nao ha abertura por combustivel.
        redirect: geracao-usina-2 com filtro de combustivel biomassa
      - user_mentions:
        - verificado
        - realizado
        - historico
        - antes de 2025
        reason: Dataset contem apenas programacao DESSEM (programado); dados verificados/realizados estao
          em outro dataset.
        redirect: balanco_energia_subsistema ou dataset de geracao verificada ONS
- property: fewShotQueries
  value:
  - question: Qual a composição da geração hidráulica, térmica e renovável programada pelo DESSEM para
      cada subsistema em um dia específico?
    sql: SELECT cod_subsistema, TRY_CAST(din_programacaodia AS DATE) AS data_programacao, SUM(TRY_CAST(val_geracao_hidraulica
      AS DOUBLE)) AS total_hidraulica_mwmed, SUM(TRY_CAST(val_geracao_termica AS DOUBLE)) AS total_termica_mwmed,
      SUM(TRY_CAST(val_geracao_renovavel AS DOUBLE)) AS total_renovavel_mwmed, SUM(TRY_CAST(val_demanda
      AS DOUBLE)) AS total_demanda_mwmed, ROUND( 100.0 * SUM(TRY_CAST(val_geracao_hidraulica AS DOUBLE))
      / NULLIF(SUM(TRY_CAST(val_geracao_hidraulica AS DOUBLE)) + SUM(TRY_CAST(val_geracao_termica AS DOUBLE))
      + SUM(TRY_CAST(val_geracao_renovavel AS DOUBLE)), 0), 2 ) AS pct_hidraulica FROM read_parquet('s3://ons-aws-prod-opendata/dataset/balanco_dessem_geral/*.parquet')
      WHERE TRY_CAST(din_programacaodia AS DATE) = '2025-06-01' AND cod_subsistema <> 'SIN' GROUP BY cod_subsistema,
      TRY_CAST(din_programacaodia AS DATE) ORDER BY cod_subsistema;
  - question: Como varia a demanda programada pelo DESSEM ao longo dos 48 patamares do dia para o subsistema
      Sudeste?
    sql: SELECT num_patamar, AVG(TRY_CAST(val_demanda AS DOUBLE)) AS demanda_media_mwmed, MIN(TRY_CAST(val_demanda
      AS DOUBLE)) AS demanda_min_mwmed, MAX(TRY_CAST(val_demanda AS DOUBLE)) AS demanda_max_mwmed FROM
      read_parquet('s3://ons-aws-prod-opendata/dataset/balanco_dessem_geral/*.parquet') WHERE cod_subsistema
      = 'SE' GROUP BY num_patamar ORDER BY num_patamar;
  - question: Existem dias ou subsistemas com menos de 48 patamares no dataset DESSEM geral?
    sql: SELECT TRY_CAST(din_programacaodia AS DATE) AS data_programacao, cod_subsistema, COUNT(DISTINCT
      num_patamar) AS qtd_patamares, CASE WHEN COUNT(DISTINCT num_patamar) = 48 THEN 'COMPLETO' ELSE 'INCOMPLETO'
      END AS status_completude FROM read_parquet('s3://ons-aws-prod-opendata/dataset/balanco_dessem_geral/*.parquet')
      GROUP BY TRY_CAST(din_programacaodia AS DATE), cod_subsistema ORDER BY status_completude DESC, data_programacao,
      cod_subsistema;
- property: relatedDatasets
  value:
    balanco_dessem_detalhe:
      join_keys:
      - cod_subsistema
      - din_programacaodia
      - num_patamar
      - val_demanda
      - val_cons_elevatoria
    programacao_x_previsao:
      join_keys:
      - num_patamar
    descontinuado-dados-do-historico-de-despacho-de-energia-de-01-2021-a-09-2024:
      join_keys:
      - cod_subsistema
      - num_patamar
- property: license
  value: CC-BY
