description:
  purpose: Suportar operadores do ONS, agentes do setor elétrico e analistas de planejamento na validação
    e acompanhamento da programação diária da operação, permitindo verificar o balanço entre geração por
    fonte e demanda por subsistema em cada patamar semi-horário. Subsidia decisões de despacho de curto
    prazo, análise de adequação de oferta, monitoramento do mix de geração programado e verificação do
    fechamento energético do SIN.
  limitations: Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização . Coluna armazenada
    como VARCHAR no Parquet devido ao formato de serialização . Coluna armazenada como VARCHAR no Parquet
    devido ao formato de serialização .
  usage: Recuperar este dataset quando a pergunta envolver programação diária da operação do sistema elétrico,
    balanço de energia por subsistema em intervalos semi-horários ou mix de geração (hidráulica, térmica,
    renovável) resultante do modelo DESSEM.
domain: planejamento
