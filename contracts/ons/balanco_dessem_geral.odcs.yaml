      - geração hídrica
      - hidráulica
      - geração de hidrelétricas
      - hidro
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_geracao_hidraulica AS DOUBLE)
    - property: unit
      value: MWmed
  - name: val_geracao_termica
    physicalType: VARCHAR
    logicalType: string
    description: 'Geração de energia térmica programada pelo DESSEM para o subsistema no patamar semi-horário.
      Inclui usinas termelétricas a gás, carvão, óleo, nuclear e biomassa despachadas centralizadamente.
      Armazenada como VARCHAR devido a formato de serialização; requer TRY_CAST para uso numérico.

      '
    customProperties:
    - property: aliases
      value:
      - geração térmica
      - térmica
      - geração termelétrica
      - despacho térmico
      - termelétricas
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_geracao_termica AS DOUBLE)
    - property: unit
      value: MWmed
  - name: val_cons_elevatoria
    physicalType: VARCHAR
    logicalType: string
    description: 'Consumo de energia pelas estações elevatórias (bombas de recalque) programado pelo DESSEM
      para o subsistema no patamar semi-horário. Representa a parcela da demanda destinada ao bombeamento
      de água em sistemas de transposição ou irrigação despachados centralizadamente. Armazenada como
      VARCHAR devido ao formato de serialização; requer TRY_CAST para uso numérico.

      '
    customProperties:
    - property: aliases
      value:
      - consumo elevatória
      - elevatória
      - bombeamento
      - consumo de bombeamento
      - estação elevatória
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_cons_elevatoria AS DOUBLE)
    - property: unit
      value: MWmed
    - property: enum
      value:
      - '0.00'
      - '108.03'
      - '111.23'
      - '24.43'
      - '27.63'
      - '49.40'
      - '51.00'
      - '62.81'
