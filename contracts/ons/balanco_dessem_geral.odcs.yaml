  quality:
  - type: custom
    engine: soda
    implementation: "checks for balanco_dessem_geral:\n  - row_count > 0:\n      name: Tabela não pode\
      \ estar vazia\n\n  # Referential integrity\n  - invalid_count(cod_subsistema) = 0:\n      valid\
      \ values:\n        - 'N'\n        - 'NE'\n        - 'S'\n        - 'SE'\n      name: cod_subsistema\
      \ deve ser um dos valores válidos\n\n  # Circuit breaker: colunas numéricas VARCHAR (formato de\
      \ origem)\n  - missing_percent(val_demanda) < 5:\n      name: val_demanda não pode ter >5% nulos\n\
      \  - missing_percent(val_geracao_renovavel) < 5:\n      name: val_geracao_renovavel não pode ter\
      \ >5% nulos\n  - missing_percent(val_geracao_hidraulica) < 5:\n      name: val_geracao_hidraulica\
      \ não pode ter >5% nulos\n  - missing_percent(val_geracao_termica) < 5:\n      name: val_geracao_termica\
      \ não pode ter >5% nulos\n  - missing_percent(val_cons_elevatoria) < 5:\n      name: val_cons_elevatoria\
      \ não pode ter >5% nulos\n\n  # Baseline de volume — margem ±20% do row_count validado\n  - row_count\
      \ between 307 and 460:\n      name: Volume esperado entre 307 e 460 registros\n\n  # Unicidade da\
      \ chave primária composta ['din_programacaodia', 'num_patamar', 'cod_subsistema'] (candidata LLM)\n\
      \  - failed rows:\n      name: Chave composta (din_programacaodia, num_patamar, cod_subsistema)\
      \ não deve ter duplicatas\n      fail query: |\n        SELECT * FROM balanco_dessem_geral\n   \
      \     WHERE (din_programacaodia, num_patamar, cod_subsistema) IN (\n          SELECT din_programacaodia,\
      \ num_patamar, cod_subsistema FROM balanco_dessem_geral\n          GROUP BY din_programacaodia,\
      \ num_patamar, cod_subsistema\n          HAVING COUNT(*) > 1\n        )\n"
