description:
  purpose: Registrar e disponibilizar o detalhamento intra-semihorário das restrições operativas por constrained-off de usinas eólicas, permitindo que operadores do ONS, agentes do setor elétrico, auditores da CCEE e analistas da ANEEL auditem eventos de curtailment com precisão de minutos dentro de cada patamar de 30 minutos, monitorem a duração efetiva das restrições e analisem as causas (razão e origem) de limitação de geração eólica no SIN. Suporta decisões de redespacho, auditoria da duração das restrições e estudos de impacto operativo do curtailment eólico.
  limitations: A coluna dsc_restricao possui nulos na maior parte dos registros, indicando que a descrição textual detalhada da restrição é campo opcional e seu preenchimento não é sistemático. Análises qualitativas baseadas neste campo cobrem apenas uma fração do universo de restrições. A chave natural (din_instante, id_ons) não é única, pois uma mesma usina pode ter múltiplos eventos de restrição dentro do mesmo patamar semi-horário, diferenciados por hor_inicial e hor_final.
  usage: Recuperar este dataset quando a pergunta envolver restrições de geração eólica por constrained-off com detalhamento intra-semihorário (períodos de minutos dentro de cada intervalo de 30 min), duração efetiva de eventos de curtailment, razão ou origem da restrição operativa (CNF, ENE, REL; LOC, SIS), ou análise de geração limitada versus disponibilidade em granularidade sub-patamar para usinas eólicas individuais.
domain: geracao
schema:
