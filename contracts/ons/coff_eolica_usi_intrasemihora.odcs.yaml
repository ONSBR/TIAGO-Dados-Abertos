  - name: cod_razaorestricao
    physicalType: VARCHAR
    logicalType: string
    description: 'Código da razão operativa da restrição de constrained-off. Valores possíveis: CNF (confiabilidade), ENE (energia), REL (religamento).'
    customProperties:
    - property: aliases
      value:
      - razão
      - motivo
      - causa restrição
      - razão restrição
      - tipo restrição
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - CNF
      - ENE
      - REL
  - name: cod_origemrestricao
    physicalType: VARCHAR
    logicalType: string
    description: 'Código da origem geográfica/sistêmica da restrição de constrained-off. Valores possíveis: LOC (local, restrição na própria usina ou rede próxima), SIS (sistêmica, restrição por condição do sistema interligado).'
    customProperties:
    - property: aliases
      value:
      - origem
      - origem restrição
      - tipo origem
      - escopo restrição
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - LOC
      - SIS
  - name: val_geracaolimitada
    physicalType: DOUBLE
    logicalType: number
    description: Valor de geração limitada imposta pela restrição de constrained-off no período intra-semihorário, em megawatts (MW). Representa o limite de geração aplicado durante o intervalo de restrição.
    customProperties:
    - property: aliases
      value:
      - geração limitada
      - limite geração
      - curtailment
      - corte geração
      - potência limitada
    - property: semanticType
      value: METRIC
    - property: unit
      value: MW
  - name: dsc_restricao
    physicalType: VARCHAR
    logicalType: string
    description: Descrição textual detalhada da restrição de constrained-off. Possui nulos na maior parte dos registros, pois é campo opcional e seu preenchimento não é sistemático.
    customProperties:
    - property: aliases
      value:
      - descrição
      - descrição restrição
      - detalhamento
      - observação
    - property: semanticType
      value: DIMENSION
