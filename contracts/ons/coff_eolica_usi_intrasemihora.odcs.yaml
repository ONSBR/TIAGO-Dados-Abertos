      - N
      - NE
      - S
      - SE
  - name: id_estado
    physicalType: VARCHAR
    logicalType: string
    description: 'Sigla da Unidade Federativa (estado) onde a usina eólica está localizada. Valores possíveis: BA, CE, MA, PB, PE, PI, RN, RS, SC.'
    customProperties:
    - property: aliases
      value:
      - estado
      - UF
      - unidade federativa
      - sigla_estado
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - BA
      - CE
      - MA
      - PB
      - PE
      - PI
      - RN
      - RS
      - SC
  - name: nom_agenteoperador
    physicalType: VARCHAR
    logicalType: string
    description: Nome do agente operador responsável pela usina eólica conforme cadastro ONS
    customProperties:
    - property: aliases
      value:
      - agente
      - operador
      - agente operador
      - nome agente
    - property: semanticType
      value: DIMENSION
  - name: nom_usina
    physicalType: VARCHAR
    logicalType: string
    description: Nome da usina eólica individual sujeita à restrição de constrained-off conforme cadastro ONS
    customProperties:
    - property: aliases
