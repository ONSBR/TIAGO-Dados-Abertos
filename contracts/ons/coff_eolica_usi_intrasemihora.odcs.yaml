authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/coff_eolica_usi_intrasemihora
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: partitionPruning
  value: year
- property: aiContext
  value: Detalhamento intra-semihorário das restrições operativas por constrained-off de usinas eólicas, registrando períodos de curtailment com precisão de minutos dentro de cada patamar de 30 minutos. Inclui horário inicial e final de cada evento, duração em minutos, geração limitada aplicada (MW), razão da restrição (CNF, ENE, REL) e origem (LOC, SIS). Permite análise de duração efetiva de eventos de curtailment e identificação de padrões de restrição por usina, razão e origem. Não traz geração verificada, referência nem energia não gerada (GNRa).
- property: agentInstructions
  value: |
    - [dsc_restricao] A maior parte dos registros possuem dsc_restricao nulo ou vazio. A descrição textual é campo opcional e seu preenchimento não é sistemático. Análises qualitativas baseadas neste campo cobrem apenas uma fração do universo de restrições.

    - [din_instante] A chave natural é (din_instante, id_ons, hor_inicial, hor_final), pois uma mesma usina pode ter múltiplos eventos de restrição dentro do mesmo patamar semi-horário. Agregações por (din_instante, id_ons) sem considerar hor_inicial/hor_final podem gerar duplicatas ou somas incorretas.

    - [num_minutosrestricao] Representa a duração efetiva da restrição dentro do patamar de 30 minutos. Multiplicar por val_geracaolimitada / 60 dá a energia correspondente ao limite imposto durante o evento (teto da restrição, em MWh), não a energia não gerada. Valores acima de 30 minutos indicam sobreposição de patamares; verificar antes de agregar.

    - [hor_inicial] Armazenado como VARCHAR no formato HH:MM:SS. Para análises de distribuição horária, extrair a hora com CAST ou funções de string. Comparações diretas entre strings funcionam para ordenação, mas cuidado com formatos inconsistentes.

    - [hor_final] Armazenado como VARCHAR no formato HH:MM:SS. Para calcular duração, use num_minutosrestricao em vez de diferença entre hor_final e hor_inicial, pois a coluna já traz o valor consolidado e trata corretamente transições de hora.

    - [cod_razaorestricao] Valores possíveis: CNF (confiabilidade), ENE (energia), REL (religamento). Filtros devem usar exatamente esses códigos. Análises de causa de restrição devem agrupar por este campo.

    - [cod_origemrestricao] Valores possíveis: LOC (local), SIS (sistêmica). Permite distinguir restrições por problema na própria usina/rede próxima (LOC) de restrições por condição do sistema interligado (SIS). Essencial para análises de responsabilidade operativa.

    - [val_geracaolimitada] Representa o limite de geração aplicado durante o período de restrição em MW. ATENÇÃO: val_geracaolimitada × num_minutosrestricao / 60 é a energia correspondente ao limite imposto durante o evento (teto da restrição, em MWh), não a energia não gerada. Este dataset não tem geração de referência nem geração verificada, portanto não permite calcular energia não gerada, GNRa ou compensação financeira. Valores nulos indicam períodos sem limitação ativa.

    - [geral] O dataset cobre o período a partir de 2021-10-01 com atualização diária às 12h e 19h. Por ser um processo de consistência recorrente, podem existir lacunas temporais para usinas específicas ou períodos sem restrição registrada. Verificar continuidade por usina é essencial antes de análises de séries temporais.
- property: typicalQuestions
  value:
  - Qual foi a duração média das restrições de constrained-off por usina eólica no Nordeste em 2024?
  - Quais usinas eólicas tiveram eventos de restrição com duração superior a 20 minutos dentro de um mesmo patamar semi-horário?
  - Qual a proporção de restrições por razão CNF versus ENE no subsistema Sul em 2024?
  - Quantos eventos de constrained-off de origem LOC versus SIS ocorreram no Rio Grande do Norte em janeiro de 2024?
  - Qual o horário do dia com maior concentração de início de restrições (hor_inicial) nas usinas eólicas do Ceará?
  - Top 10 usinas com maior número de eventos de restrição intra-semihorários em 2024
  - Duração total de curtailment por razão de restrição no NE em Q1 2024
- property: vectorTags
  value:
  - duracao do curtailment eolico
  - quanto tempo a eolica ficou restrita
  - minutos de constrained-off
  - horario exato do corte eolico
  - inicio e fim da restricao eolica
  - restricao intra-semihora eolica
  - restricao local versus sistemica
  - confiabilidade versus energia restricao
- property: granularity
  value: 30min
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_intrasemihora/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2021-10-01'
- property: semantics
  value:
    row_grain:
      temporal: 30 min
      temporal_column: din_instante
      spatial: usina
      entity: usina
      one_row_per:
      - din_instante
      - id_ons
    temporal_perspective: verificado
    dimension_columns:
      subsistema: id_subsistema
      fonte: null
      usina: id_ons
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: num_minutosrestricao
      label: Num Minutosrestricao
      columns:
      - num_minutosrestricao
      expression: num_minutosrestricao
      quantity_kind: duration_minutes
      unit_native: minutos
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total:
          sql: SUM(num_minutosrestricao)
          unit: minutos
        average:
          sql: AVG(num_minutosrestricao)
          unit: minutos
        maximum:
          sql: MAX(num_minutosrestricao)
          unit: minutos
        time_series:
          sql: SUM(num_minutosrestricao)
          unit: minutos
        ranking:
          sql: SUM(num_minutosrestricao)
          unit: minutos
        comparison:
          sql: SUM(num_minutosrestricao)
          unit: minutos
      interval_hours: 0.5
      aliases:
      - minutos restrição
      - duração
      - tempo restrição
      - minutos
      - duração minutos
    - id: geracaolimitada
      label: Geração limitada (limite imposto; total_energy = energia no limite durante o evento, não energia não gerada)
      columns:
      - val_geracaolimitada
      expression: val_geracaolimitada
      quantity_kind: average_power
      unit_native: MW
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total_energy:
          sql: SUM(val_geracaolimitada * num_minutosrestricao / 60.0) / 1000
          unit: GWh
        average_power:
          sql: AVG(val_geracaolimitada)
          unit: MW
        peak_power:
          sql: MAX(val_geracaolimitada)
          unit: MW
        time_series:
          sql: AVG(val_geracaolimitada)
          unit: MW
        ranking:
          sql: SUM(val_geracaolimitada * num_minutosrestricao / 60.0) / 1000
          unit: GWh
        comparison:
          sql: AVG(val_geracaolimitada)
          unit: MW
      interval_hours: 0.5
      aliases:
      - geração limitada
      - limite geração
      - curtailment
      - corte geração
      - potência limitada
    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: true
      supports_ranking: true
      primary_use_case: serie_temporal
    value_aliases:
      subsistema:
        N:
          aliases:
          - norte
          - subsistema norte
          - regiao norte
          filter: id_subsistema = 'N'
        NE:
          aliases:
          - nordeste
          - subsistema nordeste
          - regiao nordeste
          filter: id_subsistema = 'NE'
        S:
          aliases:
          - sul
          - subsistema sul
          - regiao sul
          filter: id_subsistema = 'S'
        SE:
          aliases:
          - sudeste
          - subsistema sudeste
          - regiao sudeste
          filter: id_subsistema = 'SE'
      id_estado:
        BA:
          aliases:
          - bahia
          filter: id_estado = 'BA'
        CE:
          aliases:
          - ceara
          - ceará
          filter: id_estado = 'CE'
        MA:
          aliases:
          - maranhao
          - maranhão
          filter: id_estado = 'MA'
        PB:
          aliases:
          - paraiba
          - paraíba
          filter: id_estado = 'PB'
        PE:
          aliases:
          - pernambuco
          filter: id_estado = 'PE'
        PI:
          aliases:
          - piaui
          - piauí
          filter: id_estado = 'PI'
        RN:
          aliases:
          - rio grande do norte
          - rn
          filter: id_estado = 'RN'
        RS:
          aliases:
          - rio grande do sul
          - rs
          filter: id_estado = 'RS'
        SC:
          aliases:
          - santa catarina
          filter: id_estado = 'SC'
      cod_razaorestricao:
        CNF:
          aliases:
          - confiabilidade
          - seguranca
          - segurança
          filter: cod_razaorestricao = 'CNF'
        ENE:
          aliases:
          - energia
          - energetico
          - energético
          filter: cod_razaorestricao = 'ENE'
        REL:
          aliases:
          - religamento
          - religacao
          - religação
          filter: cod_razaorestricao = 'REL'
      cod_origemrestricao:
        LOC:
          aliases:
          - local
          - localizada
          - usina
          filter: cod_origemrestricao = 'LOC'
        SIS:
          aliases:
          - sistemica
          - sistêmica
          - sistema
          - sin
          filter: cod_origemrestricao = 'SIS'
    sql_patterns:
      todas_metricas_mensal:
        template: |-
          SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,
            ROUND(SUM(num_minutosrestricao), 1) AS num_minutosrestricao,
            ROUND(AVG(val_geracaolimitada), 1) AS geracaolimitada
          FROM {source}
          WHERE EXTRACT(YEAR FROM din_instante) = {year}
          GROUP BY 1
          ORDER BY 1
        output_unit: minutos
        matches:
          output_modes:
          - time_series
          - comparison
          metrics:
          - num_minutosrestricao
          - geracaolimitada
          grain: month
        validated_params:
          year: '2026'
      geracaolimitada_mensal_mwmed:
        template: |-
          SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, id_subsistema,
            AVG(val_geracaolimitada) AS valor
          FROM {source}
          WHERE EXTRACT(YEAR FROM din_instante) = {year}
          GROUP BY 1, 2
          ORDER BY 1, 2
        output_unit: MW
        matches:
          output_modes:
          - average_power
          metrics:
          - geracaolimitada
          grain: month
        validated_params:
          year: '2026'
      geracaolimitada_mensal:
        template: |-
          SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, id_subsistema,
            SUM(val_geracaolimitada * num_minutosrestricao / 60.0) / 1000 AS valor
          FROM {source}
          WHERE EXTRACT(YEAR FROM din_instante) = {year}
          GROUP BY 1, 2
          ORDER BY 1, 2
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracaolimitada
          grain: month
        validated_params:
          year: '2026'
      curtailment_eolico_mensal:
        template: |-
          SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,
            id_subsistema,
            SUM(num_minutosrestricao) AS total
          FROM {source}
          WHERE EXTRACT(YEAR FROM din_instante) = {year}
          GROUP BY 1, 2
          ORDER BY 1, 3 DESC
        output_unit: minutos
        matches:
          output_modes:
          - time_series
          metrics:
          - num_minutosrestricao
          grain: month
        validated_params:
          year: '2026'
      ranking_num_minutosrestricao_por_subsistema:
        template: |-
          SELECT id_subsistema,
            SUM(num_minutosrestricao) AS valor
          FROM {source}
          WHERE EXTRACT(YEAR FROM din_instante) = {year}
          GROUP BY 1
          ORDER BY 2 DESC
          LIMIT {limit}
        output_unit: minutos
        matches:
          output_modes:
          - ranking
          metrics:
          - num_minutosrestricao
          grain: year
        validated_params:
          year: '2026'
          limit: '10'
      ranking_geracaolimitada_por_subsistema:
        template: |-
          SELECT id_subsistema,
            SUM(val_geracaolimitada * num_minutosrestricao / 60.0) / 1000 AS valor
          FROM {source}
          WHERE EXTRACT(YEAR FROM din_instante) = {year}
          GROUP BY 1
          ORDER BY 2 DESC
          LIMIT {limit}
        output_unit: GWh
        matches:
          output_modes:
          - ranking
          metrics:
          - geracaolimitada
          grain: year
        validated_params:
          year: '2026'
          limit: '10'
      ranking_num_minutosrestricao_por_ons:
        template: |-
          SELECT id_ons,
            SUM(num_minutosrestricao) AS valor
          FROM {source}
          WHERE EXTRACT(YEAR FROM din_instante) = {year}
          GROUP BY 1
          ORDER BY 2 DESC
          LIMIT {limit}
        output_unit: minutos
        matches:
          output_modes:
          - ranking
          metrics:
          - num_minutosrestricao
          grain: year
        validated_params:
          year: '2026'
          limit: '10'
      ranking_geracaolimitada_por_ons:
        template: |-
          SELECT id_ons,
            SUM(val_geracaolimitada * num_minutosrestricao / 60.0) / 1000 AS valor
          FROM {source}
          WHERE EXTRACT(YEAR FROM din_instante) = {year}
          GROUP BY 1
          ORDER BY 2 DESC
          LIMIT {limit}
        output_unit: GWh
        matches:
          output_modes:
          - ranking
          metrics:
          - geracaolimitada
          grain: year
        validated_params:
          year: '2026'
          limit: '10'
    family: restricao_eolica
    family_default: false
    measure_terms:
    - duração
    - duracao
    - minutos
    - intra-semihorário
    - intra-semihora
    - intrasemihora
    - início e fim
    - inicio e fim
    - horário exato
    - horario exato
- property: fewShotQueries
  value:
  - question: Qual foi a duração média das restrições de constrained-off por usina eólica no Nordeste em 2024?
    sql: SELECT nom_usina, AVG(num_minutosrestricao) as duracao_media_minutos FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_intrasemihora/*.parquet', union_by_name=true) WHERE id_subsistema = 'NE' AND din_instante >= '2024-01-01' AND din_instante < '2025-01-01' GROUP BY nom_usina ORDER BY duracao_media_minutos DESC
  - question: Quais usinas eólicas tiveram eventos de restrição com duração superior a 20 minutos dentro de um mesmo patamar semi-horário?
    sql: SELECT DISTINCT nom_usina, id_subsistema, din_instante, hor_inicial, hor_final, num_minutosrestricao FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_intrasemihora/*.parquet', union_by_name=true) WHERE num_minutosrestricao > 20 ORDER BY num_minutosrestricao DESC
  - question: Qual a proporção de restrições por razão CNF versus ENE no subsistema Sul em 2024?
    sql: SELECT cod_razaorestricao, COUNT(*) as num_eventos, ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 2) as percentual FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_intrasemihora/*.parquet', union_by_name=true) WHERE id_subsistema = 'S' AND din_instante >= '2024-01-01' AND din_instante < '2025-01-01' AND cod_razaorestricao IN ('CNF', 'ENE') GROUP BY cod_razaorestricao ORDER BY num_eventos DESC
  - question: Quantos eventos de constrained-off de origem LOC versus SIS ocorreram no Rio Grande do Norte em janeiro de 2024?
    sql: SELECT cod_origemrestricao, COUNT(*) as num_eventos FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_intrasemihora/*.parquet', union_by_name=true) WHERE id_estado = 'RN' AND din_instante >= '2024-01-01' AND din_instante < '2024-02-01' GROUP BY cod_origemrestricao ORDER BY num_eventos DESC
  - question: Qual o horário do dia com maior concentração de início de restrições (hor_inicial) nas usinas eólicas do Ceará?
    sql: SELECT hor_inicial, COUNT(*) as num_restricoes FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_intrasemihora/*.parquet', union_by_name=true) WHERE id_estado = 'CE' GROUP BY hor_inicial ORDER BY num_restricoes DESC LIMIT 10
  - question: Top 10 usinas com maior número de eventos de restrição intra-semihorários em 2024
    sql: SELECT nom_usina, id_estado, id_subsistema, COUNT(*) as num_eventos FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_intrasemihora/*.parquet', union_by_name=true) WHERE din_instante >= '2024-01-01' AND din_instante < '2025-01-01' GROUP BY nom_usina, id_estado, id_subsistema ORDER BY num_eventos DESC LIMIT 10
