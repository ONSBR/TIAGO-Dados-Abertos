      - data hora
      - timestamp
      - data e hora
      - patamar
    - property: semanticType
      value: TIMESTAMP
  - name: hor_inicial
    physicalType: VARCHAR
    logicalType: string
    description: Horário de início do período de restrição dentro do patamar semi-horário, no formato HH:MM:SS. Permite identificar o momento exato em que a restrição foi aplicada dentro do intervalo de 30 minutos.
    customProperties:
    - property: aliases
