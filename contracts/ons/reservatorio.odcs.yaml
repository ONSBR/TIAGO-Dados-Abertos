    sql_patterns:
      cotamaxima_por_reservatorio:
        template: "SELECT nom_reservatorio, id_subsistema,\n  MAX(TRY_CAST(val_cotamaxima AS DOUBLE))\
          \ AS cota_maxima_m\nFROM {source}\nWHERE TRY_CAST(val_cotamaxima AS DOUBLE) IS NOT NULL\nGROUP\
          \ BY 1, 2\nORDER BY cota_maxima_m DESC"
        output_unit: m
        matches:
          output_modes:
          - maximum
          - ranking
          metrics:
          - cotamaxima
      volume_util_por_subsistema:
        template: "SELECT nom_subsistema,\n  SUM(TRY_CAST(val_volutiltot AS DOUBLE)) AS vol_util_total_hm3\n\
          FROM {source}\nWHERE TRY_CAST(val_volutiltot AS DOUBLE) IS NOT NULL\nGROUP BY 1\nORDER BY vol_util_total_hm3\
          \ DESC"
        output_unit: hm3
        matches:
          output_modes:
          - total
          metrics:
          - volutiltot
      reservatorios_sem_produtibilidade:
        template: 'SELECT nom_reservatorio, nom_usina, tip_reservatorio, nom_subsistema

          FROM {source}

          WHERE val_produtibilidadeespecifica IS NULL

          ORDER BY nom_reservatorio'
        output_unit: null
        matches:
          output_modes:
          - listing
          metrics:
          - produtibilidadeespecifica
      parametros_por_ree:
        template: "SELECT nom_ree,\n  COUNT(*) AS qtd_reservatorios,\n  SUM(TRY_CAST(val_volutiltot AS\
          \ DOUBLE)) AS vol_util_total_hm3,\n  AVG(val_produtibilidadeespecifica) AS produtibilidade_media\n\
          FROM {source}\nWHERE TRY_CAST(val_volutiltot AS DOUBLE) IS NOT NULL\nGROUP BY 1\nORDER BY vol_util_total_hm3\
          \ DESC"
        output_unit: hm3
        matches:
          output_modes:
          - total
          - average
          metrics:
          - volutiltot
          - produtibilidadeespecifica
- property: fewShotQueries
  value:
  - question: Qual é o volume útil total de armazenamento (hm³) dos reservatórios por subsistema elétrico?
    sql: SELECT nom_subsistema, id_subsistema, COUNT(*) AS qtd_reservatorios, SUM(TRY_CAST(val_volutiltot
      AS DOUBLE)) AS vol_util_total_hm3, SUM(TRY_CAST(val_volmax AS DOUBLE)) AS vol_max_total_hm3, SUM(TRY_CAST(val_volmin
      AS DOUBLE)) AS vol_min_total_hm3 FROM read_parquet('s3://ons-aws-prod-opendata/dataset/reservatorio/*.parquet')
      WHERE TRY_CAST(val_volutiltot AS DOUBLE) IS NOT NULL GROUP BY nom_subsistema, id_subsistema ORDER
      BY vol_util_total_hm3 DESC
  - question: Quais são os 20 reservatórios com maior volume útil total no Brasil?
    sql: SELECT nom_reservatorio, nom_usina, nom_subsistema, nom_bacia, nom_ree, TRY_CAST(val_volutiltot
      AS DOUBLE) AS vol_util_hm3, TRY_CAST(val_volmax AS DOUBLE) AS vol_max_hm3, TRY_CAST(val_cotamaxima
      AS DOUBLE) AS cota_max_m, TRY_CAST(val_cotaminima AS DOUBLE) AS cota_min_m FROM read_parquet('s3://ons-aws-prod-opendata/dataset/reservatorio/*.parquet')
      WHERE TRY_CAST(val_volutiltot AS DOUBLE) IS NOT NULL ORDER BY vol_util_hm3 DESC LIMIT 20
  - question: Quais são os parâmetros de produtibilidade dos reservatórios agrupados por Reservatório
      Equivalente de Energia?
    sql: SELECT nom_ree, nom_subsistema, COUNT(*) AS qtd_reservatorios, AVG(val_produtibilidadeespecifica)
      AS prod_especifica_media, MIN(val_produtibilidadeespecifica) AS prod_especifica_min, MAX(val_produtibilidadeespecifica)
      AS prod_especifica_max, AVG(val_produtividade65volutil) AS prod_65_media, AVG(val_perda) AS perda_media_pct
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/reservatorio/*.parquet') WHERE val_produtibilidadeespecifica
      IS NOT NULL AND val_produtividade65volutil IS NOT NULL GROUP BY nom_ree, nom_subsistema ORDER BY
      nom_subsistema, nom_ree
