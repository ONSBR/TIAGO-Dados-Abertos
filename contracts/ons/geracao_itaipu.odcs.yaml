    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: false
      supports_ranking: false
      primary_use_case: serie_temporal
    sql_patterns:
      itaipu_total_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  AVG(val_itaipu_total)\
          \ AS media_mwmed,\n  SUM(val_itaipu_total) * 1.0 AS energia_mwh\nFROM {source}\nWHERE EXTRACT(YEAR\
          \ FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1\nORDER BY 1"
        output_unit: MWmed (media), MWh (energia)
        matches:
          output_modes:
          - average_power
          - total_energy
          metrics:
          - itaipu_total
          grain: month
        validated_params:
          year: '2011'
      itaipu_brasil_vs_paraguai_anual:
        template: "SELECT EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) AS ano,\n  AVG(val_itaipu_br)\
          \ AS media_brasil_mwmed,\n  AVG(val_itaipu_50hz - val_itaipu_50hz_br) AS media_paraguai_mwmed,\n  SUM(val_itaipu_br)\
          \ * 1.0 AS energia_brasil_mwh,\n  SUM(val_itaipu_50hz - val_itaipu_50hz_br) * 1.0 AS energia_paraguai_mwh\nFROM {source}\n\
          GROUP BY 1\nORDER BY 1"
        output_unit: MWmed (media), MWh (energia)
        matches:
          output_modes:
          - average_power
          - total_energy
          metrics:
          - itaipu_br
          - itaipu_py
          grain: year
      itaipu_60hz_vs_50hz_horario:
        template: "SELECT EXTRACT(HOUR FROM TRY_CAST(din_instante AS TIMESTAMP)) AS hora_dia,\n  AVG(val_itaipu_60hz)\
          \ AS media_60hz_mwmed,\n  AVG(val_itaipu_50hz) AS media_50hz_mwmed\nFROM {source}\nWHERE din_instante\
          \ BETWEEN '{data_inicio}' AND '{data_fim}'\nGROUP BY 1\nORDER BY 1"
        output_unit: MWmed
        matches:
          output_modes:
          - average_power
          metrics:
          - itaipu_60hz
          - itaipu_50hz
          grain: hour_of_day
        validated_params:
          data_inicio: '2000-01-01 00:00:00'
          data_fim: '2011-05-31 23:00:00'
      itaipu_pico_historico:
        template: "SELECT din_instante,\n  val_itaipu_total,\n  val_itaipu_60hz,\n  val_itaipu_50hz,\n\
          \  val_itaipu_br,\n  (val_itaipu_50hz - val_itaipu_50hz_br) AS itaipu_paraguai\nFROM {source}\nORDER BY val_itaipu_total DESC\nLIMIT 10"
        output_unit: MWmed
        matches:
          output_modes:
          - peak_power
          metrics:
          - itaipu_total
          grain: hour
      geracao_itaipu_mensal_gwh:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_itaipu_50hz\
          \ AS VARCHAR) AS DOUBLE)) * 1.0 / 1000, 1) AS val_itaipu_50hz_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_itaipu_50hz_br\
          \ AS VARCHAR) AS DOUBLE)) * 1.0 / 1000, 1) AS val_itaipu_50hz_br_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_itaipu_60hz\
          \ AS VARCHAR) AS DOUBLE)) * 1.0 / 1000, 1) AS val_itaipu_60hz_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_itaipu_br\
          \ AS VARCHAR) AS DOUBLE)) * 1.0 / 1000, 1) AS val_itaipu_br_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_itaipu_total\
          \ AS VARCHAR) AS DOUBLE)) * 1.0 / 1000, 1) AS val_itaipu_total_gwh\nFROM {source}\nWHERE EXTRACT(YEAR\
          \ FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1\nORDER BY 1"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          grain: month
        validated_params:
          year: '2025'
      geracao_itaipu_mensal_mwmed:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_itaipu_50hz\
          \ AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante AS TIMESTAMP)), 1) AS val_itaipu_50hz_mwmed,\n\
          \  ROUND(SUM(TRY_CAST(TRY_CAST(val_itaipu_50hz_br AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante\
          \ AS TIMESTAMP)), 1) AS val_itaipu_50hz_br_mwmed,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_itaipu_60hz\
          \ AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante AS TIMESTAMP)), 1) AS val_itaipu_60hz_mwmed,\n\
          \  ROUND(SUM(TRY_CAST(TRY_CAST(val_itaipu_br AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante\
          \ AS TIMESTAMP)), 1) AS val_itaipu_br_mwmed,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_itaipu_total\
          \ AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante AS TIMESTAMP)), 1) AS val_itaipu_total_mwmed\n\
          FROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP\
          \ BY 1\nORDER BY 1"
        output_unit: MWmed
        matches:
          output_modes:
          - average_power
          grain: month
        validated_params:
          year: '2025'
- property: fewShotQueries
  value:
  - question: Qual foi a geração média mensal de Itaipu no setor de 60 Hz e no setor de 50 Hz em cada
      ano?
    sql: SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, AVG(val_itaipu_60hz)
      AS media_60hz_mw, AVG(val_itaipu_50hz) AS media_50hz_mw, AVG(val_itaipu_total) AS media_total_mw
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/geracao_itaipu/*.parquet') GROUP BY DATE_TRUNC('month',
      TRY_CAST(din_instante AS TIMESTAMP)) ORDER BY mes;
  - question: Qual foi a participação percentual da geração destinada ao Brasil em relação ao total de
      Itaipu em cada ano?
    sql: SELECT EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) AS ano, SUM((val_itaipu_br) * 1.0)
      AS geracao_brasil_gwh, SUM((val_itaipu_total) * 1.0) AS geracao_total_gwh, ROUND(100.0 * SUM((val_itaipu_br)
      * 1.0) / NULLIF(SUM((val_itaipu_total) * 1.0), 0), 2) AS participacao_brasil_pct FROM read_parquet('s3://ons-aws-prod-opendata/dataset/geracao_itaipu/*.parquet')
      GROUP BY EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) ORDER BY ano;
  - question: Qual foi o fator de capacidade anual de Itaipu considerando capacidade instalada de 14.000
      MW?
    sql: SELECT EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) AS ano, COUNT(*) AS horas_operacao,
      AVG(val_itaipu_total) AS geracao_media_mw, ROUND(100.0 * AVG(val_itaipu_total) / 14000.0, 2) AS
      fator_capacidade_pct FROM read_parquet('s3://ons-aws-prod-opendata/dataset/geracao_itaipu/*.parquet')
      GROUP BY EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) ORDER BY ano;
