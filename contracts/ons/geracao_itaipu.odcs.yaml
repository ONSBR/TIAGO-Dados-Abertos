          sql: SUM(val_itaipu_50hz - val_itaipu_50hz_br) * 1.0
          unit: MWh
        average_power:
          sql: AVG(val_itaipu_50hz - val_itaipu_50hz_br)
          unit: MWmed
        peak_power:
          sql: MAX(val_itaipu_50hz - val_itaipu_50hz_br)
          unit: MWmed
        time_series:
          sql: AVG(val_itaipu_50hz - val_itaipu_50hz_br)
          unit: MWmed
        comparison:
