    - id: itaipu_50hz_br
      label: Itaipu 50Hz Brasil
      columns:
      - val_itaipu_50hz_br
      expression: val_itaipu_50hz_br
      quantity_kind: average_power
      unit_native: MWmed
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total_energy:
          sql: SUM(val_itaipu_50hz_br) * 1.0
          unit: MWh
        average_power:
          sql: AVG(val_itaipu_50hz_br)
          unit: MWmed
