    - id: itaipu_50hz
      label: Itaipu 50Hz
      columns:
      - val_itaipu_50hz
      expression: val_itaipu_50hz
      quantity_kind: average_power
      unit_native: MWmed
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total_energy:
          sql: SUM(val_itaipu_50hz) * 1.0
          unit: MWh
        average_power:
          sql: AVG(val_itaipu_50hz)
          unit: MWmed
        peak_power:
          sql: MAX(val_itaipu_50hz)
          unit: MWmed
        time_series:
          sql: AVG(val_itaipu_50hz)
          unit: MWmed
        comparison:
          sql: AVG(val_itaipu_50hz)
