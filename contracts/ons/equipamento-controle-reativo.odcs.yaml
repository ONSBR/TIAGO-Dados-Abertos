status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/equipamento_controle_reativo/*.parquet
  format: parquet
description:
  purpose: Subsidiar operadores do sistema elétrico, planejadores e analistas de transmissão no inventário
    e caracterização dos ativos de controle de tensão e potência reativa do SIN, suportando decisões de
    despacho de reativos, controle de tensão em subestações, planejamento da expansão da rede e análises
    regulatórias de adequação do parque de equipamentos por subsistema e agente proprietário.
  limitations: 93. 93. Valor mínimo de -9999.
  usage: Recuperar este dataset quando a pergunta envolver inventário, cadastro ou caracterização de equipamentos
    de suporte de tensão e controle de potência reativa (reatores shunt, capacitores shunt, compensadores
    síncronos ou estáticos) nas subestações do SIN.
domain: transmissao
schema:
