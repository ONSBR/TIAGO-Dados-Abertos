team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/equipamento-controle-reativo
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - quantos capacitores existem
  - compensadores sincronos instalados
  - equipamentos de controle de tensao
  - reatores das subestacoes
  - lista de compensadores
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver inventário, cadastro ou caracterização de equipamentos
    de suporte de tensão e controle de potência reativa (reatores shunt, capacitores shunt, compensadores
    síncronos ou estáticos) nas subestações do SIN. Também relevante para perguntas sobre capacidade instalada
    de reativos por subestação, subsistema, estado ou agente proprietário, e para análises de adequação
    do parque de equipamentos de controle de tensão da rede de transmissão.
- property: agentInstructions
  value: '- [val_limiteinferior_mvar] A maior parte dos registros possuem val_limiteinferior_mvar nulo no dataset
    equipamento-controle-reativo, indicando que limites operativos inferiores não estão preenchidos para
    a grande maioria dos equipamentos cadastrados. Isso limita o uso desta coluna em análises de capacidade
    operativa.


    - [val_limitesuperior_mvar] A maior parte dos registros possuem val_limitesuperior_mvar nulo no dataset equipamento-controle-reativo,
    indicando que limites operativos superiores não estão preenchidos para a grande maioria dos equipamentos
    cadastrados. Isso limita o uso desta coluna em análises de capacidade operativa.


    - [val_limiteinferior_mvar] val_limiteinferior_mvar no dataset equipamento-controle-reativo apresenta
    valor mínimo de -9999,9, possivelmente sentinela para "sem limite inferior definido". Deve ser filtrado
    antes de qualquer análise quantitativa de limites operativos.


    - [val_limitesuperior_mvar] val_limitesuperior_mvar no dataset equipamento-controle-reativo apresenta
    valor máximo de 9999,9, possivelmente sentinela para "sem limite superior definido". Deve ser filtrado
    antes de qualquer análise quantitativa de limites operativos.


    - [val_potreativanominal_mvar] Parte dos registros possuem val_potreativanominal_mvar nulo no dataset
    equipamento-controle-reativo. Para um campo que representa a capacidade nominal do equipamento, a
    ausência compromete análises de capacidade instalada de compensação reativa por subestação ou subsistema.


    - [nom_agente_proprietario] Poucos registros possuem nom_agente_proprietario nulo no dataset equipamento-controle-reativo.
    Embora residual, equipamentos sem agente proprietário identificado podem gerar inconsistências em
    relatórios de responsabilidade operativa e manutenção.


    - [dat_entradaoperacao] dat_entradaoperacao é armazenado como VARCHAR no dataset equipamento-controle-reativo,
    exigindo conversão explícita para DATE em análises temporais. Podem existir formatos inconsistentes
    que causariam falha no TRY_CAST.


    - [dat_desativacao] dat_desativacao é armazenado como VARCHAR no dataset equipamento-controle-reativo,
    exigindo conversão explícita para DATE em análises temporais. Podem existir valores padrão (ex: "9999-12-31")
    para equipamentos ainda ativos que devem ser tratados antes de filtros de vigência.


    - [cod_equipamento] cod_equipamento é a chave primária natural do dataset equipamento-controle-reativo.
    Duplicatas indicariam inconsistência cadastral grave, como equipamentos com múltiplos registros ativos
    simultaneamente.


    - [id_subsistema] Valores com trailing spaces detectados em ''id_subsistema''. Use TRIM() em filtros
    WHERE para evitar perda de registros.

    - [nom_subsistema] Valores com trailing spaces detectados em ''nom_subsistema''. Use TRIM() em filtros
    WHERE para evitar perda de registros.

    - [nom_estado] Valores com trailing spaces detectados em ''nom_estado''. Use TRIM() em filtros WHERE
    para evitar perda de registros.

    - [nom_tipoderede] Valores com trailing spaces detectados em ''nom_tipoderede''. Use TRIM() em filtros
    WHERE para evitar perda de registros.

    - [nom_tipoequipamento] Valores com trailing spaces detectados em ''nom_tipoequipamento''. Use TRIM()
    em filtros WHERE para evitar perda de registros.'
- property: typicalQuestions
  value:
  - Quais subestações possuem compensadores estáticos de reativos cadastrados no SIN?
  - Qual é a capacidade total de reativos instalada por subsistema elétrico?
  - Quais equipamentos de controle de reativos pertencem à FURNAS e estão ativos?
  - Qual a distribuição de tipos de equipamentos de controle de reativos por estado?
  - Quais subestações têm limites operativos de Qmin e Qmax definidos para seus compensadores?
- property: granularity
  value: STATIC
- property: spatialGranularity
  value: por_subestacao
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/equipamento_controle_reativo/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '1988-12-31'
- property: semantics
  value:
    temporal_perspective: cadastral
    row_grain:
      temporal: STATIC
      temporal_column: dat_entradaoperacao
      spatial: subestacao
      entity: subestacao
      one_row_per:
      - dat_entradaoperacao
      - id_subsistema
      - cod_equipamento
    dimension_columns:
      subsistema: id_subsistema
      fonte: null
      usina: null
      reservatorio: null
      bacia: null
      subestacao: nom_subestacao
      patamar: null
    metrics:
    - id: potreativanominal_mvar
      label: Potencia Reativa Nominal (Mvar)
      columns:
      - val_potreativanominal_mvar
      expression: val_potreativanominal_mvar
      quantity_kind: capacity
      unit_native: Mvar
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total:
          sql: SUM(val_potreativanominal_mvar)
          unit: Mvar
        average:
          sql: AVG(val_potreativanominal_mvar)
          unit: Mvar
        maximum:
          sql: MAX(val_potreativanominal_mvar)
          unit: Mvar
        time_series:
          sql: SUM(val_potreativanominal_mvar)
          unit: Mvar
        ranking:
          sql: SUM(val_potreativanominal_mvar)
          unit: Mvar
        comparison:
          sql: SUM(val_potreativanominal_mvar)
          unit: Mvar
      aliases:
      - potencia reativa nominal
      - potencia nominal
      - Mvar nominal
      - capacidade reativa
      - capacidade instalada reativa
    - id: limiteinferior_mvar
      label: Limite Inferior Reativo (Qmin, Mvar)
      columns:
      - val_limiteinferior_mvar
      expression: val_limiteinferior_mvar
      quantity_kind: capacity
      unit_native: Mvar
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total:
          sql: SUM(val_limiteinferior_mvar)
          unit: Mvar
        average:
          sql: AVG(val_limiteinferior_mvar)
          unit: Mvar
        maximum:
          sql: MAX(val_limiteinferior_mvar)
          unit: Mvar
        time_series:
          sql: SUM(val_limiteinferior_mvar)
          unit: Mvar
        ranking:
          sql: SUM(val_limiteinferior_mvar)
          unit: Mvar
        comparison:
          sql: AVG(val_limiteinferior_mvar)
          unit: Mvar
      aliases:
      - limite inferior
      - limite minimo reativo
      - Qmin
      - limite inferior Mvar
    - id: limitesuperior_mvar
      label: Limite Superior Reativo (Qmax, Mvar)
      columns:
      - val_limitesuperior_mvar
      expression: val_limitesuperior_mvar
      quantity_kind: capacity
      unit_native: Mvar
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total:
          sql: SUM(val_limitesuperior_mvar)
          unit: Mvar
        average:
          sql: AVG(val_limitesuperior_mvar)
          unit: Mvar
        maximum:
          sql: MAX(val_limitesuperior_mvar)
          unit: Mvar
        time_series:
          sql: SUM(val_limitesuperior_mvar)
          unit: Mvar
        ranking:
          sql: SUM(val_limitesuperior_mvar)
          unit: Mvar
        comparison:
          sql: AVG(val_limitesuperior_mvar)
          unit: Mvar
      aliases:
      - limite superior
      - limite maximo reativo
      - Qmax
      - limite superior Mvar
    query_routing:
      supports_listing: true
      supports_time_series: false
      supports_comparison: true
      supports_ranking: true
      primary_use_case: cadastro
    value_aliases:
      subsistema:
        SE:
          aliases:
          - sudeste
          - centro-oeste
          - se/co
          - sudeste centro-oeste
          filter: TRIM(id_subsistema) = 'SE'
        S:
          aliases:
          - sul
          filter: TRIM(id_subsistema) = 'S'
        NE:
          aliases:
          - nordeste
          filter: TRIM(id_subsistema) = 'NE'
        N:
          aliases:
          - norte
          filter: TRIM(id_subsistema) = 'N'
      nom_tipoderede:
        BASICA:
          aliases:
          - rede basica
          - basica
          - RB
          filter: TRIM(nom_tipoderede) = 'BASICA'
        COMPLEMENTAR:
          aliases:
          - rede complementar
          - complementar
          filter: TRIM(nom_tipoderede) = 'COMPLEMENTAR'
      nom_tipoequipamento:
        Banco de Capacitores:
          aliases:
          - banco de capacitores
          - capacitor shunt
          - capacitor
          - banco capacitor
          filter: TRIM(nom_tipoequipamento) = 'Banco de Capacitores'
        Compensador Reativo Estatico Controlavel:
          aliases:
          - compensador estatico
          - SVC
          - CEREC
          - compensador reativo estatico
          - compensador estatico controlavel
          filter: TRIM(nom_tipoequipamento) = 'Compensador Reativo Estático Controlável'
        Compensador Sincrono:
          aliases:
          - compensador sincrono
          - CS
          - compensador sincronico
          filter: TRIM(nom_tipoequipamento) = 'Compensador Síncrono'
        Reator:
          aliases:
          - reator
          - reator shunt
          - reator derivacao
          filter: TRIM(nom_tipoequipamento) = 'Reator'
      dat_desativacao:
        ativo:
          aliases:
          - ativo
          - em operacao
          - vigente
          - nao desativado
          filter: dat_desativacao = '9999-12-31' OR dat_desativacao IS NULL
    sql_patterns:
      contagem_por_tipo_equipamento:
        template: "SELECT TRIM(nom_tipoequipamento) AS tipo_equipamento,\n  COUNT(*) AS quantidade,\n\
          \  SUM(val_potreativanominal_mvar) AS capacidade_total_mvar\nFROM {source}\nWHERE val_potreativanominal_mvar\
          \ IS NOT NULL\nGROUP BY 1\nORDER BY 3 DESC"
        output_unit: Mvar
        matches:
          output_modes:
          - total
          - ranking
          metrics:
          - potreativanominal_mvar
          grain: static
      capacidade_por_subsistema:
        template: "SELECT TRIM(id_subsistema) AS subsistema,\n  TRIM(nom_tipoequipamento) AS tipo_equipamento,\n\
          \  COUNT(*) AS quantidade,\n  SUM(val_potreativanominal_mvar) AS capacidade_total_mvar\nFROM\
          \ {source}\nWHERE val_potreativanominal_mvar IS NOT NULL\nGROUP BY 1, 2\nORDER BY 1, 4 DESC"
        output_unit: Mvar
        matches:
          output_modes:
          - total
          - comparison
          metrics:
          - potreativanominal_mvar
          grain: static
      equipamentos_com_limites_operativos:
        template: "SELECT nom_subestacao, nom_equipamento, TRIM(nom_tipoequipamento) AS tipo,\n  val_limiteinferior_mvar\
          \ AS Qmin,\n  val_limitesuperior_mvar AS Qmax\nFROM {source}\nWHERE val_limiteinferior_mvar\
          \ IS NOT NULL\n  AND val_limiteinferior_mvar != -9999.9\n  AND val_limitesuperior_mvar IS NOT\
          \ NULL\n  AND val_limitesuperior_mvar != 9999.9\nORDER BY nom_subestacao"
        output_unit: Mvar
        matches:
          output_modes:
          - listing
          metrics:
          - limiteinferior_mvar
          - limitesuperior_mvar
          grain: static
      equipamentos_ativos_por_agente:
        template: "SELECT nom_agente_proprietario,\n  TRIM(nom_tipoequipamento) AS tipo_equipamento,\n\
          \  COUNT(*) AS quantidade,\n  SUM(val_potreativanominal_mvar) AS capacidade_total_mvar\nFROM\
          \ {source}\nWHERE (dat_desativacao = '9999-12-31' OR dat_desativacao IS NULL)\n  AND nom_agente_proprietario\
          \ IS NOT NULL\nGROUP BY 1, 2\nORDER BY 3 DESC"
        output_unit: Mvar
        matches:
          output_modes:
          - ranking
          - comparison
          metrics:
          - potreativanominal_mvar
          grain: static
- property: fewShotQueries
  value:
  - question: Qual é a capacidade total instalada de compensação reativa (em Mvar) por subsistema e tipo
      de equipamento no SIN?
    sql: SELECT id_subsistema, nom_subsistema, nom_tipoequipamento, COUNT(*) AS qtd_equipamentos, ROUND(SUM(val_potreativanominal_mvar),
