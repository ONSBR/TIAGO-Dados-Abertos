version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:equipamento-controle-reativo
name: equipamento-controle-reativo
tenant: ons
tags:
- ONS
- SIN
- capacitor shunt
- capacitor-shunt
- compensador estático de reativos
- compensador síncrono
- compensador-estatico
- compensador-sincrono
- controle de reativos
- controle-de-reativos
