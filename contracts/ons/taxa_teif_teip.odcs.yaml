authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/taxa_teif_teip
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - taxa de indisponibilidade da usina
  - quanto a usina falhou
  - indisponibilidade forcada das usinas
  - confiabilidade das usinas
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver confiabilidade, indisponibilidade forçada ou
    programada, desempenho operacional ou taxas TEIFa/TEIP de usinas geradoras despachadas centralizadamente
    pelo ONS. Também relevante para perguntas sobre manutenção programada, risco de indisponibilidade
    no despacho ou histórico de falhas de usinas específicas nos últimos 60 meses.
- property: agentInstructions
  value: '- [cod_ceg] Poucos registros possuem cod_ceg nulo, possivelmente correspondendo
    a usinas sem CEG cadastrado na ANEEL ou em processo de regularização. Joins com cadastros externos
    baseados em cod_ceg perderão esses registros silenciosamente.


    - [num_versao] Múltiplas versões (1 a 19) existem para a mesma combinação nom_usina+din_mes+nom_taxa,
    resultado do processo de consistência recorrente do ONS. Análises que não filtrem pela versão mais
    recente produzirão duplicatas e distorções em agregações.


    - [val_taxa] O valor máximo de val_taxa é 1.0 (100% de indisponibilidade), tecnicamente possível mas
    representando indisponibilidade total da usina no mês. Registros com val_taxa = 1.0 merecem verificação
    para distinguir indisponibilidade real de erro de preenchimento ou usina em comissionamento/desativação.


    - [din_calculo] din_calculo registra o momento de publicação/cálculo e pode apresentar concentração
    em horários específicos (12h e 19h conforme frequência declarada). Verificar se há lacunas de publicação
    que indiquem períodos sem atualização dos dados.


    - [tip_usina] Valores com trailing spaces detectados em ''tip_usina''. Use TRIM() em filtros WHERE
    para evitar perda de registros.'
- property: typicalQuestions
  value:
  - Quais usinas tiveram maior TEIFa média nos últimos 12 meses?
  - Como evoluiu a taxa de indisponibilidade programada (TEIP) da usina Angra 1 ao longo dos últimos 5
    anos?
  - Qual o ranking de usinas Tipo I com maior indisponibilidade forçada acumulada em 2024?
  - Qual a diferença entre TEIFa e TEIP para usinas hidrelétricas versus termelétricas no último ano?
  - Quais usinas apresentaram TEIFa acima de 20% em pelo menos 3 meses consecutivos?
  # geradas e validadas pelo benchmark em 2026-09-06
  - "Quais usinas tiveram TEIFa acima de 20% por mais de um mês em 2024?"
- property: granularity
  value: anual
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/taxa_teif_teip/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2021-06-01'
- property: semantics
  value:
    measure_terms:
    - teif
    - teip
    - taxa de indisponibilidade
    family: taxa_teif
    family_default: true
    temporal_perspective: verificado
    row_grain:
      temporal: 1 ano
      temporal_column: din_mes
      spatial: usina
      entity: usina
      one_row_per:
      - din_mes
      - nom_usina
      - nom_taxa
      - num_versao
    dimension_columns:
      subsistema: null
      fonte: null
      usina: nom_usina
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: taxa
      label: Taxa de Indisponibilidade
      columns:
      - val_taxa
      expression: val_taxa
      quantity_kind: ratio
      unit_native: proporcao_0_1
      default_aggregation: sum
      forbidden_aggregations:
      - sum
      aggregation_modes:
        average:
          sql: AVG(val_taxa)
          unit: proporcao_0_1
        maximum:
          sql: MAX(val_taxa)
          unit: proporcao_0_1
        minimum:
          sql: MIN(val_taxa)
          unit: proporcao_0_1
        time_series:
          sql: AVG(val_taxa)
          unit: proporcao_0_1
        ranking:
          sql: AVG(val_taxa)
          unit: proporcao_0_1
        comparison:
          sql: AVG(val_taxa)
          unit: proporcao_0_1
      interval_hours: 8760.0
      aliases:
      - taxa de indisponibilidade
      - valor da taxa
      - teifa
      - teip
      - indisponibilidade
      - percentual de indisponibilidade
      - taxa equivalente de indisponibilidade forcada
      - taxa de indisponibilidade programada
    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: true
      supports_ranking: true
      primary_use_case: serie_temporal
    value_aliases:
      tip_usina:
        Hidroeletrica:
          aliases:
          - hidroeletrica
          - hidreletrica
          - hidro
          - UHE
          - PCH
          filter: TRIM(tip_usina) = 'Hidroelétrica'
        Nuclear:
          aliases:
          - nuclear
          - Angra
          - usina nuclear
          filter: TRIM(tip_usina) = 'Nuclear'
        Termica:
          aliases:
          - termica
          - termeletrica
          - UTE
          - gas
          - carvao
          - oleo
          - biomassa
          filter: TRIM(tip_usina) = 'Térmica'
      nom_taxa:
        TEIFa:
          aliases:
          - TEIFa
          - teifa
          - indisponibilidade forcada
          - indisponibilidade forcada ajustada
          - taxa equivalente indisponibilidade forcada
          - falha forcada
          filter: nom_taxa = 'TEIFa'
        TEIP:
          aliases:
          - TEIP
          - teip
          - indisponibilidade programada
          - manutencao programada
          - parada programada
          filter: nom_taxa = 'TEIP'
      num_versao:
        versao_mais_recente:
          aliases:
          - versao mais recente
          - ultima versao
          - dado mais atual
          - dado consistido
          - versao final
          filter: num_versao = (SELECT MAX(num_versao) FROM taxa_teif_teip t2 WHERE t2.nom_usina = taxa_teif_teip.nom_usina
            AND t2.din_mes = taxa_teif_teip.din_mes AND t2.nom_taxa = taxa_teif_teip.nom_taxa)
        '1.0':
          aliases:
          - '1.0'
          - versao 1
          filter: num_versao = 1
        '2.0':
          aliases:
          - '2.0'
          - versao 2
          filter: num_versao = 2
        '3.0':
          aliases:
          - '3.0'
          - versao 3
          filter: num_versao = 3
        '4.0':
          aliases:
          - '4.0'
          - versao 4
          filter: num_versao = 4
        '5.0':
          aliases:
          - '5.0'
          - versao 5
          filter: num_versao = 5
        '6.0':
          aliases:
          - '6.0'
          - versao 6
          filter: num_versao = 6
        '7.0':
          aliases:
          - '7.0'
          - versao 7
          filter: num_versao = 7
        '8.0':
          aliases:
          - '8.0'
          - versao 8
          filter: num_versao = 8
        '9.0':
          aliases:
          - '9.0'
          - versao 9
          filter: num_versao = 9
        '10.0':
          aliases:
          - '10.0'
          - versao 10
          filter: num_versao = 10
        '16.0':
          aliases:
          - '16.0'
          - versao 16
          filter: num_versao = 16
        '17.0':
          aliases:
          - '17.0'
          - versao 17
          filter: num_versao = 17
        '18.0':
          aliases:
          - '18.0'
          - versao 18
          filter: num_versao = 18
        '19.0':
          aliases:
          - '19.0'
          - versao 19
          filter: num_versao = 19
    sql_patterns:
      taxa_media_mensal_por_usina:
        template: "WITH dados AS (\n  SELECT * FROM {source}\n)\nSELECT nom_usina, \n       EXTRACT(YEAR\
          \ FROM TRY_CAST(din_referencia AS DATE)) AS ano,\n       EXTRACT(MONTH FROM TRY_CAST(din_referencia\
          \ AS DATE)) AS mes,\n       AVG(TRY_CAST(val_taxa AS DOUBLE)) AS taxa_media\nFROM dados\nWHERE\
          \ din_referencia IS NOT NULL\nGROUP BY nom_usina, ano, mes\nORDER BY nom_usina, ano, mes"
        output_unit: proporcao_0_1
        matches:
          output_modes:
          - time_series
          metrics:
          - taxa
          grain: month
      ranking_usinas_teifa:
        template: "SELECT nom_usina,\n  AVG(TRY_CAST(val_taxa AS DOUBLE)) AS teifa_media\nFROM {source}\n\
          WHERE val_taxa IS NOT NULL\nGROUP BY nom_usina\nORDER BY teifa_media DESC\nLIMIT 20"
        output_unit: proporcao_0_1
        matches:
          output_modes:
          - ranking
          metrics:
          - taxa
          grain: year
      comparacao_teifa_teip:
        template: "WITH dados AS (\n  SELECT * FROM {source}\n)\nSELECT nom_usina,\n       AVG(TRY_CAST(val_taxa\
          \ AS DOUBLE)) AS taxa_media\nFROM dados\nGROUP BY nom_usina\nORDER BY taxa_media DESC"
        output_unit: proporcao_0_1
        matches:
          output_modes:
          - comparison
          metrics:
          - taxa
          grain: month
- property: fewShotQueries
  value:
  - question: Quais usinas tiveram a maior taxa média de indisponibilidade forçada (TEIFa) nos últimos
      12 meses?
    sql: "WITH versao_max AS (\n  SELECT nom_usina, din_mes, nom_taxa, MAX(num_versao) AS max_versao\n\
      \  FROM read_parquet('s3://ons-aws-prod-opendata/dataset/taxa_teif_teip/*.parquet')\n  GROUP BY\
      \ nom_usina, din_mes, nom_taxa\n),\ndados_recentes AS (\n  SELECT t.nom_usina, t.tip_usina, t.din_mes,\
      \ t.val_taxa\n  FROM read_parquet('s3://ons-aws-prod-opendata/dataset/taxa_teif_teip/*.parquet')\
      \ AS t\n  INNER JOIN versao_max AS v\n    ON t.nom_usina = v.nom_usina\n    AND t.din_mes = v.din_mes\n\
      \    AND t.nom_taxa = v.nom_taxa\n    AND t.num_versao = v.max_versao\n  WHERE t.nom_taxa = 'TEIFa'\n\
      \    AND t.din_mes >= (CURRENT_DATE - INTERVAL '12 months')\n)\nSELECT nom_usina,\n       tip_usina,\n\
      \       ROUND(AVG(val_taxa) * 100, 2) AS teifa_media_pct,\n       COUNT(*) AS meses_com_dado\nFROM\
      \ dados_recentes\nGROUP BY nom_usina, tip_usina\nORDER BY teifa_media_pct DESC\nLIMIT 20;"
  - question: Como evoluiu a taxa de indisponibilidade programada (TEIP) média por tipo de usina ao longo
      dos últimos 24 meses?
    sql: "WITH versao_max AS (\n  SELECT nom_usina, din_mes, nom_taxa, MAX(num_versao) AS max_versao\n\
      \  FROM read_parquet('s3://ons-aws-prod-opendata/dataset/taxa_teif_teip/*.parquet')\n  GROUP BY\
      \ nom_usina, din_mes, nom_taxa\n)\nSELECT t.tip_usina,\n       t.din_mes,\n       ROUND(AVG(t.val_taxa)\
      \ * 100, 2) AS teip_media_pct,\n       COUNT(DISTINCT t.nom_usina) AS qtd_usinas\nFROM read_parquet('s3://ons-aws-prod-opendata/dataset/taxa_teif_teip/*.parquet')\
      \ AS t\nINNER JOIN versao_max AS v\n  ON t.nom_usina = v.nom_usina\n  AND t.din_mes = v.din_mes\n\
      \  AND t.nom_taxa = v.nom_taxa\n  AND t.num_versao = v.max_versao\nWHERE t.nom_taxa = 'TEIP'\n \
      \ AND t.din_mes >= (CURRENT_DATE - INTERVAL '24 months')\nGROUP BY t.tip_usina, t.din_mes\nORDER\
      \ BY t.din_mes ASC, t.tip_usina ASC;"
  - question: Qual é a comparação entre TEIFa e TEIP das usinas nucleares (UTN) mês a mês?
    sql: "WITH versao_max AS (\n  SELECT nom_usina, din_mes, nom_taxa, MAX(num_versao) AS max_versao\n\
      \  FROM read_parquet('s3://ons-aws-prod-opendata/dataset/taxa_teif_teip/*.parquet')\n  GROUP BY\
      \ nom_usina, din_mes, nom_taxa\n)\nSELECT t.nom_usina,\n       t.din_mes,\n       t.nom_taxa,\n\
      \       ROUND(t.val_taxa * 100, 2) AS taxa_pct\nFROM read_parquet('s3://ons-aws-prod-opendata/dataset/taxa_teif_teip/*.parquet')\
      \ AS t\nINNER JOIN versao_max AS v\n  ON t.nom_usina = v.nom_usina\n  AND t.din_mes = v.din_mes\n\
      \  AND t.nom_taxa = v.nom_taxa\n  AND t.num_versao = v.max_versao\nWHERE t.tip_usina = 'UTN'\nORDER\
      \ BY t.nom_usina ASC, t.din_mes ASC, t.nom_taxa ASC;"
- property: license
