    sql_patterns:
      dispf_serie_mensal:
        template: "SELECT\n  TRY_CAST(dat_referencia AS DATE) AS mes,\n  val_dispf AS disponibilidade_pct\n\
          FROM {source}\nWHERE TRY_CAST(dat_referencia AS DATE) BETWEEN '{data_inicio}' AND '{data_fim}'\n\
          ORDER BY 1\n"
        output_unit: '%'
        matches:
          output_modes:
          - time_series
          metrics:
          - dispf
          grain: month
        validated_params:
          data_inicio: '2026-01-01'
          data_fim: '2026-06-01'
      dispf_media_anual:
        template: "SELECT\n  EXTRACT(YEAR FROM TRY_CAST(dat_referencia AS DATE)) AS ano,\n  AVG(val_dispf)\
          \ AS dispf_medio_pct,\n  MIN(val_dispf) AS dispf_minimo_pct,\n  MAX(val_dispf) AS dispf_maximo_pct\n\
          FROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(dat_referencia AS DATE)) = {year}\nGROUP BY\
          \ 1\nORDER BY 1\n"
        output_unit: '%'
        matches:
          output_modes:
          - average
          metrics:
          - dispf
          grain: year
        validated_params:
          year: '2026'
      indispff_acima_limiar:
        template: "SELECT\n  TRY_CAST(dat_referencia AS DATE) AS mes,\n  val_indispff AS indisponibilidade_forcada_pct\n\
          FROM {source}\nWHERE val_indispff > {limiar}\nORDER BY val_indispff DESC\n"
        output_unit: '%'
        matches:
          output_modes:
          - time_series
          - comparison
          metrics:
          - indispff
          grain: month
      tres_indicadores_serie:
        template: "SELECT\n  TRY_CAST(dat_referencia AS DATE) AS mes,\n  val_dispf   AS dispf_pct,\n \
          \ val_indisppf AS indisppf_pct,\n  val_indispff AS indispff_pct\nFROM {source}\nORDER BY 1\n"
        output_unit: '%'
        matches:
          output_modes:
          - time_series
          metrics:
          - dispf
          - indisppf
          - indispff
          grain: month
    ambiguity_policy:
      default_assumptions:
      - when: usuario pergunta disponibilidade sem especificar metrica
        assume_metric: dispf
        assume_output: average
        note: DISPF e o indicador principal de disponibilidade. Se usuario mencionar 'indisponibilidade'
          sem qualificar, perguntar se e programada (INDISPPF) ou forcada (INDISPFF).
      - when: usuario pede media de disponibilidade em periodo
        assume_metric: dispf
        assume_output: average
        note: Media de percentual — usar AVG, nunca SUM.
      - when: usuario pede pior mes de disponibilidade
        assume_metric: dispf
        assume_output: minimum
        note: Menor DISPF = pior disponibilidade.
      - when: usuario pede melhor mes de disponibilidade
        assume_metric: dispf
        assume_output: maximum
        note: Maior DISPF = melhor disponibilidade.
      must_clarify_when:
      - ambiguity: indisponibilidade_sem_tipo
        question: Voce quer indisponibilidade programada (manutencao planejada, INDISPPF) ou indisponibilidade
          forcada (falhas nao planejadas, INDISPFF)?
        trigger_terms:
        - indisponibilidade
        - indisponivel
        - parada
        - falha
        note: Nao perguntar se o usuario ja usou INDISPPF, INDISPFF, 'programada' ou 'forcada' explicitamente.
      redirect_when:
      - user_mentions:
        - usina
        - ceg
        - itaipu
        - belo monte
        - tucurui
        - angra
        - UGE
        - unidade geradora
        reason: Schema nao contem identificador de usina ou UGE. Granularidade e SIN consolidado.
