description:
  purpose: Fornecer aos analistas de confiabilidade, planejadores do sistema elétrico e reguladores os
    indicadores mensais consolidados de desempenho do parque gerador nacional, permitindo monitorar tendências
    de disponibilidade e indisponibilidade do SIN ao longo do tempo, suportar decisões de planejamento
    da expansão da geração, avaliar o cumprimento de metas regulatórias estabelecidas pelo ONS e pela
    ANEEL, e subsidiar estudos de confiabilidade do sistema elétrico brasileiro.
  limitations: A coluna dat_referencia está armazenada como VARCHAR no Parquet em vez de DATE. Verificar
    se a soma dos três indicadores (DISPF + INDISPPF + INDISPFF) é aproximadamente 100% para cada registro.
    O valor máximo de INDISPPF observado é 12,67%, consideravelmente acima da mediana esperada para indisponibilidade
    programada.
  usage: Recuperar este dataset quando a pergunta envolver indicadores mensais de disponibilidade, indisponibilidade
    programada ou indisponibilidade forçada das funções geração agregados para o Sistema Interligado Nacional
    como um todo.
