- property: fewShotQueries
  value:
  - question: Como evoluíram os indicadores DISPF, INDISPPF e INDISPFF do SIN mês a mês desde 2023?
    sql: "SELECT\n  TRY_CAST(dat_referencia AS DATE) AS competencia,\n  EXTRACT(YEAR FROM TRY_CAST(dat_referencia\
      \ AS DATE)) AS ano,\n  EXTRACT(MONTH FROM TRY_CAST(dat_referencia AS DATE)) AS mes,\n  ROUND(val_dispf,\
      \ 4) AS dispf_pct,\n  ROUND(val_indisppf, 4) AS indisppf_pct,\n  ROUND(val_indispff, 4) AS indispff_pct,\n\
      \  ROUND(val_dispf + val_indisppf + val_indispff, 4) AS soma_total\nFROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind-disponibilidade-geracao-sin/*.parquet')\n\
      WHERE TRY_CAST(dat_referencia AS DATE) IS NOT NULL\nORDER BY TRY_CAST(dat_referencia AS DATE)"
  - question: Qual foi a disponibilidade média do parque gerador nacional por ano?
    sql: "SELECT\n  EXTRACT(YEAR FROM TRY_CAST(dat_referencia AS DATE)) AS ano,\n  ROUND(AVG(val_dispf),\
      \ 4) AS dispf_medio_pct,\n  ROUND(AVG(val_indisppf), 4) AS indisppf_medio_pct,\n  ROUND(AVG(val_indispff),\
      \ 4) AS indispff_medio_pct,\n  COUNT(*) AS qtd_competencias\nFROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind-disponibilidade-geracao-sin/*.parquet')\n\
      WHERE TRY_CAST(dat_referencia AS DATE) IS NOT NULL\nGROUP BY EXTRACT(YEAR FROM TRY_CAST(dat_referencia\
      \ AS DATE))\nORDER BY ano"
  - question: Em quais meses a indisponibilidade forçada do SIN foi mais elevada?
    sql: "SELECT\n  TRY_CAST(dat_referencia AS DATE) AS competencia,\n  ROUND(val_indispff, 4) AS indispff_pct,\n\
      \  ROUND(val_dispf, 4) AS dispf_pct,\n  ROUND(val_indisppf, 4) AS indisppf_pct\nFROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind-disponibilidade-geracao-sin/*.parquet')\n\
      WHERE TRY_CAST(dat_referencia AS DATE) IS NOT NULL\nORDER BY val_indispff DESC\nLIMIT 5"
