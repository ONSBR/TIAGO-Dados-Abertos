- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver indicadores mensais de disponibilidade, indisponibilidade
    programada ou indisponibilidade forçada das funções geração agregados para o Sistema Interligado Nacional
    como um todo. Também recuperar quando o analista precisar de uma visão consolidada nacional de desempenho
    do parque gerador para comparação com metas regulatórias ou análise de tendência histórica do SIN.
- property: agentInstructions
  value: '- [dat_referencia] A coluna dat_referencia está armazenada como VARCHAR no Parquet em vez de
    DATE. O formato observado é YYYY-MM-DD (ex: ''2023-01-01''), sempre com dia 01 representando o primeiro
    dia do mês de competência. Operações de filtro temporal, ordenação e extração de ano/mês falharão
    silenciosamente se a coluna for tratada como string sem conversão explícita.


    - [val_dispf] O dataset ind-disponibilidade-geracao-sin contém apenas 17 registros para um período
    de aproximadamente 40 meses (2023-01 a 2026-05), indicando que cerca de 57% das competências mensais
    estão ausentes. Análises de tendência e médias móveis devem considerar as competências faltantes antes
    de interpretar resultados para val_dispf.


    - [val_indispff] A Indisponibilidade Forçada (INDISPFF) no dataset ind-disponibilidade-geracao-sin
    apresenta variação relativa elevada entre o mínimo (1,45%) e o máximo (3,71%), representando variação
    de ~156% entre os extremos. Valores acima de 3,5% podem indicar períodos de estresse operativo ou
    eventos climáticos extremos que impactaram o parque gerador nacional.

    '
- property: typicalQuestions
  value:
  - Qual foi a disponibilidade média das funções geração do SIN em 2024?
  - Em quais meses a indisponibilidade forçada do SIN superou 3%?
