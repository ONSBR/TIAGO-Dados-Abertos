      - energia natural afluente armazenavel
      - ENA armazenavel em MWmed
      - afluencia armazenavel
      - energia armazenavel da bacia
    - id: ena_armazenavel_bacia_percentualmlt
      label: ENA Armazenavel por Bacia (% MLT)
      columns:
      - ena_armazenavel_bacia_percentualmlt
      expression: ena_armazenavel_bacia_percentualmlt
      quantity_kind: ratio
      unit_native: '%'
      default_aggregation: avg
      forbidden_aggregations:
      - sum
      valid_intents:
