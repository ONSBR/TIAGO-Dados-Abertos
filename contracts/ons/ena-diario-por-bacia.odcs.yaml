          unit: '%'
        maximum:
          sql: MAX(TRY_CAST(ena_armazenavel_bacia_percentualmlt AS DOUBLE))
          unit: '%'
        minimum:
          sql: MIN(TRY_CAST(ena_armazenavel_bacia_percentualmlt AS DOUBLE))
          unit: '%'
        time_series:
          sql: AVG(TRY_CAST(ena_armazenavel_bacia_percentualmlt AS DOUBLE))
          unit: '%'
        ranking:
          sql: AVG(TRY_CAST(ena_armazenavel_bacia_percentualmlt AS DOUBLE))
          unit: '%'
        comparison:
          sql: AVG(TRY_CAST(ena_armazenavel_bacia_percentualmlt AS DOUBLE))
          unit: '%'
      interval_hours: 24.0
      aliases:
