    sql_patterns:
      ena_bruta_bacia_mwmed_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(ena_data AS DATE)) AS mes,\n  SUM((TRY_CAST(ena_bruta_bacia_mwmed\
          \ AS DOUBLE)) * 24.0) / 1000 AS valor_gwh\nFROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(ena_data\
          \ AS DATE)) = {year}\n  AND nom_bacia = '{bacia}'\nGROUP BY 1\nORDER BY 1"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - ena_bruta_bacia_mwmed
          grain: month
        validated_params:
          year: '2024'
          bacia: URUGUAI
      ena_abaixo_limiar_mlt:
        template: "SELECT nom_bacia, TRY_CAST(ena_data AS DATE) AS data,\n  TRY_CAST(ena_armazenavel_bacia_percentualmlt\
          \ AS DOUBLE) AS pct_mlt\nFROM {source}\nWHERE TRY_CAST(ena_data AS DATE) = (SELECT MAX(TRY_CAST(ena_data\
          \ AS DATE)) FROM {source})\n  AND TRY_CAST(ena_armazenavel_bacia_percentualmlt AS DOUBLE) <\
          \ {limiar}\nORDER BY pct_mlt ASC"
        output_unit: '%'
        matches:
          output_modes:
          - minimum
          metrics:
          - ena_armazenavel_bacia_percentualmlt
          grain: day
        validated_params:
          limiar: '1756.67163086'
      serie_temporal_bacia:
        template: "SELECT TRY_CAST(ena_data AS DATE) AS data,\n  AVG(TRY_CAST(ena_armazenavel_bacia_mwmed\
          \ AS DOUBLE)) AS ena_armazenavel_mwmed,\n  AVG(TRY_CAST(ena_bruta_bacia_mwmed AS DOUBLE)) AS\
          \ ena_bruta_mwmed\nFROM {source}\nWHERE nom_bacia = '{bacia}'\n  AND TRY_CAST(ena_data AS DATE)\
          \ BETWEEN '{data_inicio}' AND '{data_fim}'\nGROUP BY 1\nORDER BY 1"
        output_unit: MWmed
        matches:
          output_modes:
          - time_series
          metrics:
          - ena_armazenavel_bacia_mwmed
          - ena_bruta_bacia_mwmed
          grain: day
        validated_params:
          bacia: URUGUAI
          data_inicio: '2021-01-01'
          data_fim: '2026-07-07'
    ambiguity_policy:
      default_assumptions:
      - when: usuario menciona ENA sem especificar bruta ou armazenavel
        assume_metric: ena_armazenavel_bacia_mwmed
        assume_output: average_power
        note: ENA armazenavel e a metrica operacional mais relevante para despacho e risco hidrologico;
          ENA bruta e secundaria para analise de afluencia total.
      - when: usuario pede ENA em percentual sem especificar bruta ou armazenavel
        assume_metric: ena_armazenavel_bacia_percentualmlt
        assume_output: average
        note: Percentual armazenavel e o indicador padrao de risco hidrologico no setor eletrico brasileiro.
      - when: usuario pede total de energia sem especificar unidade
        assume_metric: ena_armazenavel_bacia_mwmed
        assume_output: total_energy
        note: Total em GWh e a forma mais comum de reportar energia acumulada em periodos.
      - when: usuario pede media de ENA sem especificar periodo
        assume_metric: ena_armazenavel_bacia_mwmed
        assume_output: average_power
        note: Media em MWmed e a unidade nativa do dataset.
      must_clarify_when:
      - trigger_terms:
        - bruta ou armazenavel
        - total ou media
        question: Voce deseja a ENA Bruta (afluencia total sem desconto de vertimento) ou a ENA Armazenavel
          (descontando vertimentos)? E prefere o valor em MWmed ou como percentual da MLT?
        rationale: Ambiguidade real entre quatro metricas disponiveis com semanticas distintas.
      - trigger_terms:
        - todas as bacias
        - SIN
        - Brasil
        question: Voce deseja ver os valores por bacia individualmente ou um total agregado de todas as
          bacias do SIN?
        rationale: Soma de bacias pode duplicar contribuicoes em bacias com reservatorios compartilhados;
          agregacao deve ser explicita.
      redirect_when:
      - user_mentions:
        - usina
        - ceg
        - itaipu
        - belo monte
        - tucurui
        - ranking de usinas
        reason: Schema nao contem CEG, usina ou identificador fisico de usina. Granularidade e bacia hidro
          energetica.
        redirect: geracao-usina-2
      - user_mentions:
        - nuclear
        - angra
        reason: Schema nao contem coluna ou dimensao nuclear separada.
        redirect: geracao-usina-2 com filtro de combustivel/tipo quando disponivel
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Schema nao contem coluna MMGD separada.
        redirect: dataset com coluna val_germmgd/val_ger_mmgd quando disponivel
      - user_mentions:
        - reservatorio
        - por reservatorio
        reason: Este dataset agrega por bacia, nao por reservatorio individual.
        redirect: ena-diario-por-reservatorio
      - user_mentions:
        - subsistema
        - SE
        - sudeste
        - nordeste
        - sul
        - norte
        reason: Este dataset agrega por bacia hidro energetica, nao por subsistema eletrico.
        redirect: ena-diario-por-subsistema
      - user_mentions:
        - energia armazenada
        - EAR
        - nivel do reservatorio
        reason: EAR (energia armazenada) e diferente de ENA (energia afluente). Este dataset contem apenas
          ENA.
        redirect: ear-diario-por-reservatorio
- property: fewShotQueries
  value:
  - question: Quais bacias apresentaram ENA armazenável abaixo de 50% da MLT com maior frequência nos
      últimos 12 meses?
    sql: SELECT nom_bacia, COUNT(*) AS dias_abaixo_50pct_mlt, ROUND(AVG(TRY_CAST(ena_armazenavel_bacia_percentualmlt AS DOUBLE)),
      2) AS media_percentual_mlt, ROUND(MIN(ena_armazenavel_bacia_percentualmlt), 2) AS minimo_percentual_mlt
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ena_bacia_di/*.parquet') WHERE TRY_CAST(ena_data
      AS DATE) >= (DATE '2026-06-13' - INTERVAL '365 days') AND ena_armazenavel_bacia_percentualmlt <
      50 GROUP BY nom_bacia ORDER BY dias_abaixo_50pct_mlt DESC LIMIT 20
  - question: Qual foi a média mensal de ENA bruta em MWmed para cada bacia em 2024?
    sql: SELECT nom_bacia, DATE_TRUNC('month', TRY_CAST(ena_data AS DATE)) AS mes_referencia, ROUND(AVG(TRY_CAST(ena_bruta_bacia_mwmed AS DOUBLE)),
      2) AS media_ena_bruta_mwmed, ROUND(AVG(ena_bruta_bacia_percentualmlt), 2) AS media_ena_bruta_pct_mlt,
      COUNT(*) AS dias_com_dado FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ena_bacia_di/*.parquet')
      WHERE TRY_CAST(ena_data AS DATE) BETWEEN DATE '2024-01-01' AND DATE '2024-12-31' GROUP BY nom_bacia,
      DATE_TRUNC('month', TRY_CAST(ena_data AS DATE)) ORDER BY nom_bacia, mes_referencia
  - question: Em quais datas e bacias ocorreram eventos de ENA armazenável acima de 300% da MLT?
    sql: SELECT nom_bacia, ena_data, ROUND(TRY_CAST(ena_armazenavel_bacia_percentualmlt AS DOUBLE), 2)
      AS ena_arm_pct_mlt, ROUND(TRY_CAST(ena_armazenavel_bacia_mwmed AS DOUBLE), 2) AS ena_arm_mwmed,
      ROUND(TRY_CAST(ena_bruta_bacia_percentualmlt AS DOUBLE), 2) AS ena_bruta_pct_mlt FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ena_bacia_di/*.parquet',
      union_by_name=true) WHERE TRY_CAST(ena_armazenavel_bacia_percentualmlt AS DOUBLE) > 300 ORDER BY
      TRY_CAST(ena_armazenavel_bacia_percentualmlt AS DOUBLE) DESC LIMIT 100
- property: relatedDatasets
  value:
    ear-diario-por-reservatorio:
      join_keys:
      - nom_bacia
- property: license
  value: CC-BY
