      valid_intents:
      - ena_armazenavel_bacia_mwmed
      - ENA armazenavel
      - energia natural afluente armazenavel
      - ENA armazenavel em MWmed
      - afluencia armazenavel
      - energia armazenavel da bacia
      aggregation_modes:
        total_energy:
          sql: SUM((TRY_CAST(ena_armazenavel_bacia_mwmed AS DOUBLE)) * 24.0) / 1000
          unit: GWh
        average_power:
          sql: AVG(TRY_CAST(ena_armazenavel_bacia_mwmed AS DOUBLE))
          unit: MWmed
        peak_power:
          sql: MAX(TRY_CAST(ena_armazenavel_bacia_mwmed AS DOUBLE))
          unit: MWmed
        time_series:
          sql: AVG(TRY_CAST(ena_armazenavel_bacia_mwmed AS DOUBLE))
          unit: MWmed
        ranking:
          sql: SUM((TRY_CAST(ena_armazenavel_bacia_mwmed AS DOUBLE)) * 24.0) / 1000
          unit: GWh
        comparison:
          sql: AVG(TRY_CAST(ena_armazenavel_bacia_mwmed AS DOUBLE))
