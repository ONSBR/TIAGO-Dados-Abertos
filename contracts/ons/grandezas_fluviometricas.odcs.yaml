version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:grandezas_fluviometricas
name: grandezas_fluviometricas
tenant: ons
tags:
- ENA
- ONS
- bacia hidrográfica
- disponibilidade hídrica
- energia natural afluente
- fluviometria
- geração hidrelétrica
- grandezas fluviométricas
- hidrologia
- medições de vazão
- posto fluviométrico
- postos fluviométricos ONS
- vazão
- vazão diária por bacia
- vazão fluviométrica
- vazão fluviométrica ONS
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/grandezas_fluviometricas_di/*.parquet
  format: parquet
description:
  purpose: Fornecer séries históricas diárias de vazão para analistas de hidrologia, operadores do sistema
    elétrico e planejadores energéticos que necessitam acompanhar a disponibilidade hídrica nas bacias
    hidrográficas brasileiras, subsidiar o despacho hidrelétrico, alimentar modelos de previsão de Energia
    Natural Afluente (ENA) e suportar decisões de operação e planejamento do Sistema Interligado Nacional
    (SIN).
  limitations: Coluna de data tipada como VARCHAR no schema físico DuckDB, quando deveria ser DATE. Quase todos os registros possuem val_vazaomediaincr nulo. val_vazaomedia possui valor mínimo igual a 0.
  usage: Recuperar este dataset quando a pergunta envolver vazão de rios, medições em postos fluviométricos,
    disponibilidade hídrica por bacia hidrográfica ou séries temporais diárias de grandezas hidrológicas
    no contexto do sistema elétrico brasileiro.
domain: hidrologia
schema:
- name: grandezas_fluviometricas
  physicalType: parquet
  logicalType: object
  physicalName: grandezas_fluviometricas
  properties:
  - name: id_postofluv
    physicalType: VARCHAR
    logicalType: string
    description: Identificador único do posto fluviométrico cadastrado pelo ONS
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - código do posto
      - id posto
      - identificador posto fluviométrico
      - código fluviométrico
    - property: semanticType
      value: IDENTIFIER
  - name: nom_postofluviometrico
    physicalType: VARCHAR
    logicalType: string
    description: Nome descritivo do posto fluviométrico onde a medição foi realizada
    customProperties:
    - property: aliases
      value:
      - nome do posto
      - posto fluviométrico
      - estação fluviométrica
      - nome estação
    - property: semanticType
      value: DIMENSION
  - name: val_latitude
    physicalType: DOUBLE
    logicalType: number
    description: Latitude geográfica do posto fluviométrico em graus decimais (negativo = hemisfério sul)
    customProperties:
    - property: aliases
      value:
      - latitude
      - coordenada latitude
      - lat
    - property: semanticType
      value: METRIC
    - property: unit
      value: graus decimais
  - name: val_longitude
    physicalType: DOUBLE
    logicalType: number
    description: Longitude geográfica do posto fluviométrico em graus decimais (negativo = oeste de Greenwich)
    customProperties:
    - property: aliases
      value:
      - longitude
      - coordenada longitude
      - lon
    - property: semanticType
      value: METRIC
    - property: unit
      value: graus decimais
  - name: nom_rio
    physicalType: VARCHAR
    logicalType: string
    description: Nome do rio onde o posto fluviométrico está localizado
    customProperties:
    - property: aliases
      value:
      - rio
      - nome do rio
      - curso d'água
    - property: semanticType
      value: DIMENSION
  - name: nom_bacia
    physicalType: VARCHAR
    logicalType: string
    description: Nome da bacia hidrográfica à qual o posto fluviométrico pertence, principal atributo
      de agrupamento geográfico
    customProperties:
    - property: aliases
      value:
      - bacia
      - bacia hidrográfica
      - nome da bacia
      - bacia fluviométrica
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - BACIA DO RIO AMAZONAS
      - BACIA DO RIO ARAGUARI
      - BACIA DO RIO CAPIVARI
      - BACIA DO RIO DOCE
      - BACIA DO RIO GRANDE
      - BACIA DO RIO IGUACU
      - BACIA DO RIO ITABAPOANA
      - BACIA DO RIO ITAJAI
      - BACIA DO RIO JACUI
      - BACIA DO RIO MUCURI
      - BACIA DO RIO PARAGUACU
      - BACIA DO RIO PARAGUAI
      - BACIA DO RIO PARAIBA DO SUL
      - BACIA DO RIO PARANA
      - BACIA DO RIO PARANAIBA
      - BACIA DO RIO PARANAPANEMA
      - BACIA DO RIO PARNAIBA
      - BACIA DO RIO SAO FRANCISCO
      - BACIA DO RIO TIETE
      - BACIA DO RIO TOCANTINS
      - BACIA DO RIO URUGUAI
  - name: din_medicao
    physicalType: VARCHAR
    logicalType: string
    description: 'Data da medição fluviométrica. Tipado como VARCHAR no schema físico (característica
      do formato de origem); deve ser convertido para DATE via TRY_CAST ou STRPTIME no pipeline antes
      de uso temporal. Período real coberto: a partir de 2023-01-01.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - data de medição
      - data
      - data da leitura
      - din medicao
      - data fluviométrica
    - property: semanticType
      value: TIMESTAMP
  - name: val_vazaomedia
    physicalType: DOUBLE
    logicalType: number
    description: 'Vazão média diária medida no posto fluviométrico em m³/s. Representa o volume de água
      por unidade de tempo passando pela seção transversal do rio. Valor mínimo registrado é 0.0, podendo
      indicar período de seca extrema ou erro de medição — requer validação contextual.

      '
    customProperties:
    - property: aliases
      value:
      - vazão média
      - vazão
      - vazão diária
      - val vazao media
      - Q médio
    - property: semanticType
      value: METRIC
    - property: unit
      value: m³/s
  - name: val_vazaomediaincr
    physicalType: DOUBLE
    logicalType: number
    description: 'Vazão média incremental diária no posto fluviométrico em m³/s. Representa a contribuição
      hídrica incremental entre postos consecutivos de uma mesma bacia, calculada apenas para postos de
      referência de usinas com reservatório. Possui nulos em quase todas as linhas por design do sistema ONS.

      '
    customProperties:
    - property: aliases
      value:
      - vazão incremental
      - vazão média incremental
      - val vazao media incremental
      - Q incremental
      - vazão afluente incremental
    - property: semanticType
      value: METRIC
    - property: unit
      value: m³/s
