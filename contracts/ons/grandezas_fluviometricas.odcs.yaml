      fonte: null
      usina: null
      reservatorio: null
      bacia: nom_bacia
      subestacao: null
      patamar: null
    metrics:
    - id: vazaomedia
      label: Vazaomedia
      columns:
      - val_vazaomedia
      expression: val_vazaomedia
      quantity_kind: flow
      unit_native: m³/s
      default_aggregation: avg
      forbidden_aggregations: []
      aggregation_modes:
        average:
          sql: AVG(val_vazaomedia)
          unit: m³/s
        peak:
          sql: MAX(val_vazaomedia)
          unit: m³/s
        minimum:
          sql: MIN(val_vazaomedia)
          unit: m³/s
        time_series:
          sql: AVG(val_vazaomedia)
          unit: m³/s
        ranking:
          sql: AVG(val_vazaomedia)
          unit: m³/s
        comparison:
          sql: AVG(val_vazaomedia)
          unit: m³/s
      interval_hours: 24.0
      aliases:
      - vazão média
      - vazão
      - vazão diária
      - val vazao media
      - Q médio
    - id: vazaomediaincr
      label: Vazaomediaincr
      columns:
      - val_vazaomediaincr
      expression: val_vazaomediaincr
      quantity_kind: flow
      unit_native: m³/s
      default_aggregation: avg
      forbidden_aggregations: []
      aggregation_modes:
        average:
          sql: AVG(val_vazaomediaincr)
          unit: m³/s
        peak:
          sql: MAX(val_vazaomediaincr)
          unit: m³/s
        minimum:
          sql: MIN(val_vazaomediaincr)
          unit: m³/s
        time_series:
          sql: AVG(val_vazaomediaincr)
          unit: m³/s
        ranking:
          sql: AVG(val_vazaomediaincr)
          unit: m³/s
        comparison:
          sql: AVG(val_vazaomediaincr)
          unit: m³/s
