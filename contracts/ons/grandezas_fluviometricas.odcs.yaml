    sql_patterns:
      vazaomedia_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_medicao AS DATE)) AS mes,\n  AVG(val_vazaomedia)\
          \ AS vazao_media_m3s\nFROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_medicao AS DATE))\
          \ = {year}\nGROUP BY 1\nORDER BY 1"
        output_unit: m³/s
        matches:
          output_modes:
          - average
          metrics:
          - vazaomedia
          grain: month
        validated_params:
          year: '2026'
      vazaomedia_por_bacia:
        template: "SELECT nom_bacia,\n  AVG(val_vazaomedia) AS vazao_media_m3s\nFROM {source}\nWHERE TRY_CAST(din_medicao\
          \ AS DATE) BETWEEN '{data_inicio}' AND '{data_fim}'\nGROUP BY nom_bacia\nORDER BY vazao_media_m3s\
          \ DESC"
        output_unit: m³/s
        matches:
          output_modes:
          - average
          - ranking
          metrics:
          - vazaomedia
          grain: bacia
        validated_params:
          data_inicio: '2026-01-01'
          data_fim: '2026-07-19'
      vazaomediaincr_postos_disponiveis:
        template: "SELECT id_postofluv, nom_postofluviometrico, nom_rio, nom_bacia,\n  COUNT(*) AS dias_com_dado,\n\
          \  AVG(val_vazaomediaincr) AS vazao_incr_media_m3s\nFROM {source}\nWHERE val_vazaomediaincr\
          \ IS NOT NULL\nGROUP BY 1, 2, 3, 4\nORDER BY dias_com_dado DESC"
        output_unit: m³/s
        matches:
          output_modes:
          - average
          metrics:
          - vazaomediaincr
          grain: posto
      vazao_zero_por_posto:
        template: "SELECT id_postofluv, nom_postofluviometrico, nom_rio, nom_bacia,\n  COUNT(*) AS dias_vazao_zero\n\
          FROM {source}\nWHERE val_vazaomedia = 0.0\nGROUP BY 1, 2, 3, 4\nORDER BY dias_vazao_zero DESC"
        output_unit: contagem
        matches:
          output_modes:
          - listing
          metrics:
          - vazaomedia
          grain: posto
- property: fewShotQueries
  value:
  - question: Qual foi a evolução da vazão média diária por bacia hidrográfica nos últimos 30 dias disponíveis?
    sql: SELECT nom_bacia, TRY_CAST(din_medicao AS DATE) AS data_medicao, AVG(val_vazaomedia) AS vazao_media_m3s,
      COUNT(DISTINCT id_postofluv) AS num_postos FROM read_parquet('s3://ons-aws-prod-opendata/dataset/grandezas_fluviometricas_di/*.parquet')
      WHERE TRY_CAST(din_medicao AS DATE) >= ( SELECT MAX(TRY_CAST(din_medicao AS DATE)) - INTERVAL '30'
      DAY FROM read_parquet('s3://ons-aws-prod-opendata/dataset/grandezas_fluviometricas_di/*.parquet')
      ) GROUP BY nom_bacia, TRY_CAST(din_medicao AS DATE) ORDER BY data_medicao DESC, nom_bacia
  - question: Quais postos fluviométricos registraram vazão zero e em quais datas?
    sql: SELECT id_postofluv, nom_postofluviometrico, nom_rio, nom_bacia, TRY_CAST(din_medicao AS DATE)
      AS data_medicao, val_vazaomedia FROM read_parquet('s3://ons-aws-prod-opendata/dataset/grandezas_fluviometricas_di/*.parquet')
      WHERE val_vazaomedia = 0.0 ORDER BY nom_bacia, nom_postofluviometrico, data_medicao
  - question: Quais são os 10 postos fluviométricos com maior vazão média histórica no período disponível?
    sql: SELECT id_postofluv, nom_postofluviometrico, nom_rio, nom_bacia, AVG(val_vazaomedia) AS vazao_media_historica_m3s,
      MAX(val_vazaomedia) AS vazao_maxima_m3s, MIN(val_vazaomedia) AS vazao_minima_m3s, COUNT(*) AS dias_com_medicao
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/grandezas_fluviometricas_di/*.parquet') GROUP
      BY id_postofluv, nom_postofluviometrico, nom_rio, nom_bacia ORDER BY vazao_media_historica_m3s DESC
      LIMIT 10
- property: license
  value: CC-BY
