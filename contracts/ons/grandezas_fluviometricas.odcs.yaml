customProperties:
- property: vectorTags
  value:
  - vazao do rio
  - quanta agua passou no posto
  - medicao fluviometrica
  - vazao natural do rio
  - vazao afluente media
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver vazão de rios, medições em postos fluviométricos,
    disponibilidade hídrica por bacia hidrográfica ou séries temporais diárias de grandezas hidrológicas
    no contexto do sistema elétrico brasileiro. Também relevante quando a análise requer correlação entre
    condições hidrológicas e geração hidrelétrica ou Energia Natural Afluente (ENA).
- property: agentInstructions
  value: '- [val_vazaomediaincr] Quase todos os registros possuem val_vazaomediaincr nulo. A vazão incremental
    é calculada apenas para postos com contribuição incremental relevante ao SIN, tornando este campo
    esparso por design. Filtros sem tratamento de nulos em agregações produzirão resultados enviesados
    ou incorretos.


    - [val_latitude] Poucos registros possuem val_latitude nulo, indicando postos fluviométricos sem
    coordenadas georreferenciadas cadastradas no dataset grandezas_fluviometricas. Análises espaciais
    devem filtrar ou tratar esses registros para evitar erros em joins geoespaciais.


    - [val_longitude] Poucos registros possuem val_longitude nulo, coincidindo com os mesmos postos
    sem val_latitude no dataset grandezas_fluviometricas. Postos sem coordenadas completas não podem ser
    utilizados em análises geoespaciais ou mapas de distribuição de vazões.


    - [din_medicao] Coluna din_medicao está tipada como VARCHAR no schema físico DuckDB do dataset grandezas_fluviometricas,
    embora represente datas no formato YYYY-MM-DD. Operações de filtro temporal, ordenação cronológica
    e agregações por período requerem cast explícito para DATE.


    - [val_vazaomedia] val_vazaomedia no dataset grandezas_fluviometricas possui valor máximo de 37181.93
    m³/s, compatível com grandes rios como o Paraná próximo a Itaipu, mas requer validação contextual
    por posto. Valor mínimo de 0.0 m³/s pode indicar períodos de seca extrema, postos em rios intermitentes
    ou erros de medição/registro.


    - [nom_rio] Valores têm ACENTO e prefixo "RIO " (ex.: ''RIO SÃO FRANCISCO'', ''RIO PARANÁ''). Igualdade
    exata sem acento retorna ZERO linhas, e LIKE simples também falha com acento (''RIO PARANÁ'' NÃO casa
    com LIKE ''%PARANA%''). Na PRIMEIRA consulta normalize os dois lados: strip_accents(upper(nom_rio))
    LIKE ''%PARANA%'' (fragmento maiúsculo sem acento; strip_accents é nativo do DuckDB). NÃO gaste consultas
    separadas sondando cobertura de datas: a cobertura temporal varia POR POSTO — traga MAX(TRY_CAST(din_medicao
    AS DATE)) por posto junto com a vazão mais recente na mesma consulta (window function ou GROUP BY)
    e declare a data real dos dados na resposta.


    - [val_vazaomedia] DIA MAIS RECENTE NÃO CONSOLIDADO: o último dia da série pode chegar com val_vazaomedia
    = 0.0 em TODOS os postos (artefato de ingestão D-1; provado em 2026-08-12: 17/17 postos do São Francisco
    em 0.0, contra 4/20 zeros crônicos localizados em dias normais). O descarte automático da borda só
    vale quando o recorte tem VÁRIOS postos e TODOS zeram juntos no último dia — nesse caso descarte o
    dia, use o anterior como "mais recente" e declare a data. Com UM posto só ou em recorte histórico
    pedido pelo usuário, NÃO descarte: zero isolado pode ser seca real (a própria coluna registra secas
    extremas) — reporte e marque como "a confirmar (borda da série)". ATENÇÃO aos padrões prontos deste
    contrato que contam ou agregam zeros (vazao_zero_por_posto, médias mensais): eles NÃO excluem a borda
    zerada — exclua o último dia não consolidado antes de contar/mediar, senão o artefato contamina o
    resultado.

    '
- property: typicalQuestions
  value:
  - Qual foi a vazão média diária na bacia do Paraná nos últimos 30 dias?
  - Quais postos fluviométricos registraram vazão zero em 2024?
  - Como evoluiu a vazão média no rio Paraná ao longo de 2023 e 2024?
  - Quais bacias hidrográficas apresentaram maior variabilidade de vazão no período seco?
  - Quais postos possuem dados de vazão incremental disponíveis?
