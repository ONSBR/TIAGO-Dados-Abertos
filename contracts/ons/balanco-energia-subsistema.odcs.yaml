description:
  purpose: Suportar operadores do sistema elétrico, analistas de planejamento energético e reguladores
    no acompanhamento do equilíbrio horário entre oferta e demanda de energia em cada subsistema do SIN,
    permitindo análise da composição da matriz energética, avaliação de intercâmbios inter-regionais,
    detecção de desvios entre programação e realização do despacho, e suporte a decisões de operação,
    planejamento e regulação do setor elétrico brasileiro.
  limitations: A coluna val_intercambio admite valores negativos por definição (importação líquida), mas
    a soma de val_intercambio de todos os subsistemas para um mesmo din_instante deve ser próxima de zero.
    Geração solar deve ser zero em períodos noturnos (aproximadamente 21h–04h). Geração eólica deve ser
    zero ou muito próxima de zero para o subsistema Norte (N) e para períodos anteriores a 2005 em qualquer
    subsistema, dado o histórico de expansão eólica no Brasil.
  usage: Recuperar este dataset quando a pergunta envolver balanço carga-geração horário por subsistema
    do SIN, composição da matriz energética (hidráulica, térmica, eólica, solar), intercâmbio líquido
    entre subsistemas ou análise de equilíbrio oferta-demanda em granularidade horária.
domain: carga
schema:
- name: balanco_energia_subsistema
  physicalType: parquet
  logicalType: object
  physicalName: balanco_energia_subsistema
  properties:
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Identificador alfanumérico do subsistema elétrico do SIN. Valores possíveis: SE (Sudeste/Centro-Oeste),
      S (Sul), NE (Nordeste), N (Norte) e SIN (linha AGREGADA oficial = soma exata dos 4 subsistemas,
      presente em todos os anos). CUIDADO: somar sem filtrar esta coluna DOBRA o total — use = ''SIN''
      para o total oficial ou <> ''SIN'' para abrir por subsistema. Compõe a chave primária natural junto
      com din_instante.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - subsistema
      - id subsistema
      - código do subsistema
      - sigla subsistema
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
      - SIN
  - name: nom_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome completo do subsistema elétrico correspondente ao id_subsistema. Exemplos: Sudeste/Centro-Oeste,
      Sul, Nordeste, Norte.

      '
    customProperties:
    - property: aliases
      value:
      - nome subsistema
      - subsistema
      - região
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - NORDESTE
      - NORTE
      - SISTEMA INTERLIGADO NACIONAL
      - SUDESTE/CENTRO-OESTE
      - SUL
  - name: din_instante
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: 'Data e hora do registro horário do balanço de energia. Representa o instante de referência
      (início do intervalo horário) para os valores de geração, carga e intercâmbio registrados. Granularidade
      horária confirmada pela descrição CKAN e pelo tipo TIMESTAMP no schema físico. Compõe a chave primária
      natural junto com id_subsistema.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - data
      - hora
      - instante
      - data hora
      - timestamp
      - data e hora
    - property: semanticType
      value: TIMESTAMP
  - name: val_gerhidraulica
    physicalType: VARCHAR
    logicalType: number
    description: 'Geração hidráulica verificada no subsistema no instante de referência, expressa em MWmed.
      Representa a potência média gerada pelas usinas hidrelétricas do subsistema no intervalo horário.
      Valores negativos são fisicamente impossíveis em condições normais (exceto usinas reversíveis, raras
      no SIN).

      '
    customProperties:
    - property: aliases
      value:
      - geração hidráulica
      - geração hidrelétrica
      - hidráulica
      - hidro
      - geração hídrica
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_gerhidraulica AS DOUBLE)
    - property: unit
      value: MWmed
  - name: val_gertermica
    physicalType: VARCHAR
    logicalType: number
    description: 'Geração térmica verificada no subsistema no instante de referência, expressa em MWmed.
      Inclui usinas termelétricas a gás natural, carvão, óleo combustível, nuclear e biomassa despachadas
      no período. Valores negativos são fisicamente impossíveis.

      '
    customProperties:
    - property: aliases
      value:
      - geração térmica
      - geração termelétrica
      - térmica
      - termelétrica
      - despacho térmico
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_gertermica AS DOUBLE)
    - property: unit
      value: MWmed
  - name: val_gereolica
    physicalType: VARCHAR
    logicalType: number
    description: 'Geração eólica verificada no subsistema no instante de referência, expressa em MWmed.
      Representa a potência média gerada pelos parques eólicos do subsistema no intervalo horário. Valores
      próximos de zero são esperados para o subsistema Norte (N) e para períodos anteriores à expansão
      eólica (~2005).

      '
    customProperties:
    - property: aliases
      value:
      - geração eólica
      - eólica
      - vento
      - geração eólica verificada
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_gereolica AS DOUBLE)
    - property: unit
      value: MWmed
  - name: val_gersolar
    physicalType: VARCHAR
    logicalType: number
    description: 'Geração solar fotovoltaica verificada no subsistema no instante de referência, expressa
      em MWmed. Inclui geração centralizada (UFV) e distribuída (GD solar). Valores zero são esperados
      em períodos noturnos e em anos anteriores à expansão solar (~2015). Pode incluir geração distribuída
      a partir de determinado período de revisão metodológica.

      '
    customProperties:
    - property: aliases
      value:
      - geração solar
      - solar
      - fotovoltaica
      - geração fotovoltaica
      - GD solar
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_gersolar AS DOUBLE)
    - property: unit
      value: MWmed
  - name: val_carga
    physicalType: VARCHAR
    logicalType: number
    description: 'Carga verificada (demanda de energia elétrica) no subsistema no instante de referência,
      expressa em MWmed. Representa o consumo total verificado no subsistema, incluindo perdas de transmissão
      e distribuição. É a variável central do balanço carga-geração. Valores zero ou negativos são fisicamente
      impossíveis para subsistemas em operação normal.

      '
    customProperties:
    - property: aliases
      value:
      - carga
      - demanda
      - consumo
      - carga verificada
      - demanda verificada
      - carga do sistema
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_carga AS DOUBLE)
    - property: unit
      value: MWmed
  - name: val_intercambio
    physicalType: VARCHAR
    logicalType: number
    description: 'Intercâmbio líquido de energia verificado no subsistema no instante de referência, expresso
      em MWmed. Valor positivo indica exportação líquida; valor negativo indica importação líquida. A
      soma dos intercâmbios de todos os subsistemas para um mesmo din_instante deve ser próxima de zero
      (balanço sistêmico do SIN).

      '
    customProperties:
    - property: aliases
      value:
      - intercâmbio
      - intercambio
      - troca de energia
      - exportação
      - importação
      - fluxo entre subsistemas
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_intercambio AS DOUBLE)
    - property: unit
      value: MWmed
