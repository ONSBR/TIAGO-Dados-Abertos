    sql_patterns:
      geracao_total_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, id_subsistema,\n\
          \  SUM((TRY_CAST(val_gerhidraulica AS DOUBLE) + TRY_CAST(val_gertermica AS DOUBLE) + TRY_CAST(val_gereolica\
          \ AS DOUBLE) + TRY_CAST(val_gersolar AS DOUBLE)) * 1.0) / 1000 AS valor\nFROM {source}\nWHERE\
          \ EXTRACT(YEAR FROM din_instante) = {year}\n  AND id_subsistema NOT IN ('SIN')\nGROUP BY 1,\
          \ 2\nORDER BY 1, 2"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracao_total
          grain: month
        validated_params:
          year: '2002'
      balanco_horario_subsistema:
        template: "SELECT din_instante, id_subsistema,\n  TRY_CAST(val_gerhidraulica AS DOUBLE) AS hidraulica_mwmed,\n\
          \  TRY_CAST(val_gertermica AS DOUBLE) AS termica_mwmed,\n  TRY_CAST(val_gereolica AS DOUBLE)\
          \ AS eolica_mwmed,\n  TRY_CAST(val_gersolar AS DOUBLE) AS solar_mwmed,\n  TRY_CAST(val_carga\
          \ AS DOUBLE) AS carga_mwmed\nFROM {source}\nWHERE TRY_CAST(din_instante AS DATE) = '{data}'\n\
          ORDER BY din_instante"
        output_unit: MWmed
        matches:
          output_modes:
          - time_series
          metrics:
          - geracao_total
          - carga
          - intercambio
          grain: hour
      intercambio_liquido_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, id_subsistema,\n\
          \  SUM(TRY_CAST(val_intercambio AS DOUBLE) * 1.0) / 1000 AS intercambio_gwh\nFROM {source}\n\
          WHERE id_subsistema NOT IN ('SIN')\n  AND din_instante BETWEEN {start} AND {end}\nGROUP BY 1,\
          \ 2\nORDER BY 1, intercambio_gwh DESC"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - intercambio
          grain: month
        validated_params:
          start: '2000-01-01 00:00:00'
          end: '2002-04-13 09:00:00'
      geracao_por_fonte_mensal:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  SUM(TRY_CAST(val_gerhidraulica\
          \ AS DOUBLE)) / 1000 AS hidraulica_gwh,\n  SUM(TRY_CAST(val_gertermica AS DOUBLE)) / 1000 AS\
          \ termica_gwh,\n  SUM(TRY_CAST(val_gereolica AS DOUBLE)) / 1000 AS eolica_gwh,\n  SUM(TRY_CAST(val_gersolar\
          \ AS DOUBLE)) / 1000 AS solar_gwh\nFROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_instante\
          \ AS TIMESTAMP)) = {year}\n  AND id_subsistema NOT IN ('SIN')\nGROUP BY 1\nORDER BY 1"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracao_total
          grain: month
        validated_params:
          year: '2025'
      geracao_por_fonte_mensal_mwmed:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  ROUND(SUM(TRY_CAST(val_gerhidraulica\
          \ AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante AS TIMESTAMP)), 1) AS hidraulica_mwmed,\n\
          \  ROUND(SUM(TRY_CAST(val_gertermica AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante AS TIMESTAMP)),\
          \ 1) AS termica_mwmed,\n  ROUND(SUM(TRY_CAST(val_gereolica AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante\
          \ AS TIMESTAMP)), 1) AS eolica_mwmed,\n  ROUND(SUM(TRY_CAST(val_gersolar AS DOUBLE)) / COUNT(DISTINCT\
          \ TRY_CAST(din_instante AS TIMESTAMP)), 1) AS solar_mwmed\nFROM {source}\nWHERE EXTRACT(YEAR\
          \ FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\n  AND id_subsistema NOT IN ('SIN')\nGROUP\
          \ BY 1\nORDER BY 1"
        output_unit: MWmed
        matches:
          output_modes:
          - average_power
          metrics:
          - geracao_total
          grain: month
        validated_params:
          year: '2025'
      geracao_por_fonte_anual:
        template: "WITH a AS (\n  SELECT\n    SUM(TRY_CAST(val_gerhidraulica AS DOUBLE)) AS hidraulica,\n\
          \    SUM(TRY_CAST(val_gertermica AS DOUBLE)) AS termica,\n    SUM(TRY_CAST(val_gereolica AS\
          \ DOUBLE)) AS eolica,\n    SUM(TRY_CAST(val_gersolar AS DOUBLE)) AS solar\n  FROM {source}\n\
          \  WHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\n    AND id_subsistema\
          \ NOT IN ('SIN')\n)\nSELECT fonte,\n       ROUND(energia / 1000, 1) AS energia_gwh,\n      \
          \ ROUND(100.0 * energia / (SELECT hidraulica + termica + eolica + solar FROM a), 1) AS participacao_pct\n\
          FROM (\n  SELECT 'Hidraulica' AS fonte, hidraulica AS energia FROM a\n  UNION ALL SELECT 'Termica',\
          \ termica FROM a\n  UNION ALL SELECT 'Eolica', eolica FROM a\n  UNION ALL SELECT 'Solar', solar\
          \ FROM a\n) t\nORDER BY energia_gwh DESC"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracao_total
          grain: year
        validated_params:
          year: '2024'
      geracao_total_mensal_mwmed:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  ROUND(SUM(TRY_CAST(val_gerhidraulica\
          \ AS DOUBLE) + TRY_CAST(val_gertermica AS DOUBLE) + TRY_CAST(val_gereolica AS DOUBLE) + TRY_CAST(val_gersolar\
          \ AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante AS TIMESTAMP)), 1) AS geracao_total_mwmed\n\
          FROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\n  AND\
          \ id_subsistema NOT IN ('SIN')\nGROUP BY 1\nORDER BY 1"
        output_unit: MWmed
        matches:
          output_modes:
          - average_power
          metrics:
          - geracao_total
          grain: month
        validated_params:
          year: '2025'
      intercambio_diario_por_subsistema:
        template: "SELECT\n  DATE_TRUNC('day', TRY_CAST(din_instante AS TIMESTAMP)) AS dia,\n  TRIM(id_subsistema)\
          \ AS id_subsistema,\n  ROUND(AVG(TRY_CAST(val_intercambio AS DOUBLE)), 1) AS intercambio_medio_mwmed,\n\
          \  ROUND(MIN(TRY_CAST(val_intercambio AS DOUBLE)), 1) AS intercambio_min_mwmed,\n  ROUND(MAX(TRY_CAST(val_intercambio\
          \ AS DOUBLE)), 1) AS intercambio_max_mwmed,\n  COUNT(TRY_CAST(val_intercambio AS DOUBLE)) AS\
          \ horas\nFROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\n\
          \  AND EXTRACT(MONTH FROM TRY_CAST(din_instante AS TIMESTAMP)) = {month}\n  AND TRIM(id_subsistema)\
          \ IN ('N', 'NE', 'S', 'SE')\nGROUP BY 1, 2\nORDER BY 1, 2"
        output_unit: MWmed
        matches:
          output_modes:
          - time_series
          metrics:
          - intercambio
          grain: day
        validated_params:
          year: '2026'
          month: '8'
- property: fewShotQueries
  value:
  - question: Como evoluiu a participação percentual da geração eólica na carga do subsistema Nordeste
      mês a mês?
    sql: SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, id_subsistema, AVG(TRY_CAST(val_gereolica AS DOUBLE))
      AS media_eolica_mwmed, AVG(val_carga) AS media_carga_mwmed, ROUND(100.0 * AVG(val_gereolica) / NULLIF(AVG(val_carga),
      0), 2) AS participacao_eolica_pct FROM read_parquet('s3://ons-aws-prod-opendata/dataset/balanco_energia_subsistema_ho/*.parquet')
      WHERE id_subsistema = 'NE' AND din_instante >= '2015-01-01' GROUP BY DATE_TRUNC('month', TRY_CAST(din_instante
      AS TIMESTAMP)), id_subsistema ORDER BY mes DESC LIMIT 100;
  - question: Qual foi o pico de carga horária em cada subsistema do SIN durante o ano de 2024 e em que
      data/hora ocorreu?
    sql: WITH ranked AS ( SELECT id_subsistema, nom_subsistema, din_instante, val_carga, ROW_NUMBER()
      OVER (PARTITION BY id_subsistema ORDER BY val_carga DESC) AS rn FROM read_parquet('s3://ons-aws-prod-opendata/dataset/balanco_energia_subsistema_ho/*.parquet')
      WHERE din_instante >= '2024-01-01' AND din_instante < '2025-01-01' ) SELECT id_subsistema, nom_subsistema,
      din_instante AS instante_pico, val_carga AS pico_carga_mwmed FROM ranked WHERE rn = 1 ORDER BY pico_carga_mwmed
      DESC;
  - question: Qual foi o balanço entre geração total e carga verificada no SIN nas últimas 24 horas disponíveis?
    sql: WITH ultima_data AS ( SELECT MAX(DATE_TRUNC('day', TRY_CAST(din_instante AS TIMESTAMP))) AS max_dia
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/balanco_energia_subsistema_ho/*.parquet')
      ) SELECT b.din_instante, SUM((b.val_gerhidraulica) * 1.0) / 1000 AS geracao_hidraulica_sin, SUM((b.val_gertermica)
      * 1.0) / 1000 AS geracao_termica_sin, SUM((b.val_gereolica) * 1.0) / 1000 AS geracao_eolica_sin,
      SUM((b.val_gersolar) * 1.0) / 1000 AS geracao_solar_sin, SUM((b.val_gerhidraulica + b.val_gertermica
      + b.val_gereolica + b.val_gersolar) * 1.0) / 1000 AS geracao_total_sin, SUM((b.val_carga) * 1.0)
      / 1000 AS carga_total_sin, SUM((b.val_gerhidraulica + b.val_gertermica + b.val_gereolica + b.val_gersolar)
      * 1.0) / 1000 - SUM((b.val_carga) * 1.0) / 1000 AS saldo_balanco FROM read_parquet('s3://ons-aws-prod-opendata/dataset/balanco_energia_subsistema_ho/*.parquet')
      AS b CROSS JOIN ultima_data AS u WHERE DATE_TRUNC('day', b.din_instante) = u.max_dia GROUP BY b.din_instante
      ORDER BY b.din_instante;
