  - name: val_vazaoturbinada
    physicalType: DOUBLE
    logicalType: number
    description: 'Vazão total turbinada pela usina no intervalo horário, em m³/s. Representa o volume
      de água efetivamente passado pelas turbinas por segundo. Mínimo: 0.0, máximo: 222890.0 m³/s.

      '
    customProperties:
    - property: aliases
      value:
      - vazão turbinada
      - vazão nas turbinas
      - turbinamento
      - Q turbinado
    - property: semanticType
      value: METRIC
    - property: unit
      value: m³/s
  - name: val_vazaovertida
    physicalType: DOUBLE
    logicalType: number
    description: 'Vazão total vertida pela usina no intervalo horário, em m³/s. Inclui tanto a parcela
      turbinável quanto a não turbinável. Mínimo: 0.0, máximo: 41498.0 m³/s.

      '
    customProperties:
    - property: aliases
      value:
      - vazão vertida
      - vertimento total
      - Q vertido
      - vazão de vertimento
    - property: semanticType
      value: METRIC
    - property: unit
      value: m³/s
  - name: val_vazaovertidanaoturbinavel
    physicalType: DOUBLE
    logicalType: number
    description: 'Parcela da vazão vertida que não pode ser aproveitada para geração de energia (vertimento
      não turbinável), em m³/s. Ocorre quando o vertimento é obrigatório por restrições operativas ou
      de segurança. Mínimo: 0.0, máximo: 4538.0 m³/s.

      '
    customProperties:
    - property: aliases
      value:
      - vazão vertida não turbinável
      - vertimento não turbinável
      - Q não turbinável
      - vazão não aproveitável
    - property: semanticType
      value: METRIC
    - property: unit
      value: m³/s
  - name: val_produtividade
    physicalType: DOUBLE
    logicalType: number
    description: 'Produtividade específica da usina no intervalo horário, expressa em MW/(m³/s). Representa
      a eficiência de conversão hidráulica: quantidade de energia gerada por unidade de vazão turbinada.
      Mínimo: 0.0, máximo: 204.63 MW/(m³/s).

      '
    customProperties:
    - property: aliases
      value:
      - produtividade
      - eficiência hidráulica
      - rendimento
      - produtividade específica
    - property: semanticType
      value: METRIC
    - property: unit
      value: MW/(m³/s)
  - name: val_folgadegeracao
