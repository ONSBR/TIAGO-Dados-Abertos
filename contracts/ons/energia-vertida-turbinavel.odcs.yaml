    - property: aliases
      value:
      - vazão vertida turbinável
      - vertimento turbinável
      - Q turbinável vertido
      - vazão aproveitável vertida
    - property: semanticType
      value: METRIC
    - property: unit
      value: m³/s
  - name: val_energiavertidaturbinavel
    physicalType: DOUBLE
    logicalType: number
    description: 'Energia vertida turbinável no intervalo horário, em MW médios. Métrica central do dataset:
      representa a energia que poderia ter sido gerada a partir da vazão vertida turbinável, mas foi perdida.
      Indicador de perda de oportunidade de geração. Mínimo: 0.0, máximo: 6609.185 MW.

