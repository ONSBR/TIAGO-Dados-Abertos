  - name: val_energiavertida
    physicalType: DOUBLE
    logicalType: number
    description: 'Energia total vertida pela usina no intervalo horário, em MW médios. Corresponde à energia
      que seria gerada se toda a vazão vertida fosse turbinada. Inclui componentes turbináveis e não turbináveis.
