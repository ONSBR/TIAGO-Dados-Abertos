    sql_patterns:
      evt_mensal_por_usina:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  nom_reservatorio,\n\
          \  SUM(TRY_CAST(val_energiavertidaturbinavel AS DOUBLE) * 0.5) AS evt_mwh\nFROM {source}\nWHERE\
          \ TRY_CAST(din_instante AS TIMESTAMP) IS NOT NULL\nGROUP BY 1, 2\nORDER BY 1, 2"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - energiavertidaturbinavel
          grain: month
      produtividade_media_por_usina:
        template: "SELECT nom_reservatorio,\n  nom_bacia,\n  AVG(TRY_CAST(val_produtividade AS DOUBLE))\
          \ AS produtividade_media\nFROM {source}\nWHERE TRY_CAST(val_produtividade AS DOUBLE) BETWEEN\
          \ 0.1 AND 10.0\n  AND TRY_CAST(val_vazaoturbinada AS DOUBLE) > 0\nGROUP BY 1, 2\nORDER BY produtividade_media\
          \ DESC"
        output_unit: MW/(m³/s)
        matches:
          output_modes:
          - average
          metrics:
          - produtividade
      geracao_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  nom_reservatorio,\n\
          \  SUM(TRY_CAST(val_geracao AS DOUBLE) * 0.5) AS geracao_mwh\nFROM {source}\nWHERE TRY_CAST(din_instante\
          \ AS TIMESTAMP) IS NOT NULL\nGROUP BY 1, 2\nORDER BY 1, 2"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracao
          grain: month
      folga_geracao_horaria:
        template: "SELECT din_instante,\n  nom_reservatorio,\n  AVG(TRY_CAST(val_folgadegeracao AS DOUBLE))\
          \ AS folga_mwmed\nFROM {source}\nWHERE TRY_CAST(din_instante AS TIMESTAMP) >= CURRENT_TIMESTAMP\
          \ - INTERVAL '7 days'\nGROUP BY 1, 2\nORDER BY 1"
        output_unit: MWmed
        matches:
          output_modes:
          - average_power
          metrics:
          - folgadegeracao
          grain: hour
      energia_vertida_turbinavel_mensal_gwh:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_disponibilidade\
          \ AS VARCHAR) AS DOUBLE)) * 1.0 / 1000, 1) AS val_disponibilidade_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_energiavertida\
          \ AS VARCHAR) AS DOUBLE)) * 1.0 / 1000, 1) AS val_energiavertida_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_energiavertidaturbinavel\
          \ AS VARCHAR) AS DOUBLE)) * 1.0 / 1000, 1) AS val_energiavertidaturbinavel_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_folgadegeracao\
          \ AS VARCHAR) AS DOUBLE)) * 1.0 / 1000, 1) AS val_folgadegeracao_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracao\
          \ AS VARCHAR) AS DOUBLE)) * 1.0 / 1000, 1) AS val_geracao_gwh\nFROM {source}\nWHERE EXTRACT(YEAR\
          \ FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1\nORDER BY 1"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          grain: month
        validated_params:
          year: '2025'
      energia_vertida_turbinavel_mensal_mwmed:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_disponibilidade\
          \ AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante AS TIMESTAMP)), 1) AS val_disponibilidade_mwmed,\n\
          \  ROUND(SUM(TRY_CAST(TRY_CAST(val_energiavertida AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante\
          \ AS TIMESTAMP)), 1) AS val_energiavertida_mwmed,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_energiavertidaturbinavel\
          \ AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante AS TIMESTAMP)), 1) AS val_energiavertidaturbinavel_mwmed,\n\
          \  ROUND(SUM(TRY_CAST(TRY_CAST(val_folgadegeracao AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante\
          \ AS TIMESTAMP)), 1) AS val_folgadegeracao_mwmed,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracao\
          \ AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante AS TIMESTAMP)), 1) AS val_geracao_mwmed\n\
          FROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP\
          \ BY 1\nORDER BY 1"
        output_unit: MWmed
        matches:
          output_modes:
          - average_power
          grain: month
        validated_params:
          year: '2025'
    ambiguity_policy:
      default_assumptions:
      - when: energia vertida turbinavel
        assume_metric: energiavertidaturbinavel
        assume_output: total_energy
        assume_unit: GWh
        unless_mentions:
        - media
        - potencia
        - pico
        - instantaneo
        - MWmed
      - when: EVT
        assume_metric: energiavertidaturbinavel
        assume_output: total_energy
        assume_unit: GWh
        unless_mentions:
        - media
        - potencia
        - pico
      - when: vertimento
        assume_metric: energiavertidaturbinavel
        assume_output: total_energy
        assume_unit: GWh
        unless_mentions:
        - vazao
        - m3/s
        - nao turbinavel
        - total
      - when: geracao
        assume_metric: geracao
        assume_output: total_energy
        assume_unit: GWh
        unless_mentions:
        - media
        - potencia
        - pico
        - instantaneo
      - when: produtividade
        assume_metric: produtividade
        assume_output: average
        assume_unit: MW/(m³/s)
        unless_mentions:
        - maxima
        - pico
      - when: folga
        assume_metric: folgadegeracao
        assume_output: average_power
        assume_unit: MWmed
        unless_mentions:
        - total
        - acumulada
        - GWh
      must_clarify_when:
      - ambiguity: energia_total_vs_potencia_media
        question: Voce quer energia total no periodo (GWh) ou potencia media (MWmed)?
        trigger_terms:
        - quanto gerou
        - total gerado
        - media de geracao
      - ambiguity: vertimento_turbinavel_vs_nao_turbinavel_vs_total
        question: Voce quer vertimento turbinavel (EVT), nao turbinavel ou total (turbinavel + nao turbinavel)?
        trigger_terms:
        - vertimento
        - energia vertida
        - vazao vertida
      - ambiguity: vazao_vs_energia_vertida
        question: Voce quer a vazao vertida (m³/s) ou a energia equivalente vertida (MWmed/GWh)?
        trigger_terms:
        - vertimento turbinavel
        - perda turbinavel
      redirect_when:
      - user_mentions:
        - nuclear
        - angra
        reason: Dataset cobre apenas usinas hidreletricas. Nao ha dados de geracao nuclear.
        redirect: geracao-usina-2 com filtro de tipo de combustivel nuclear
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Dataset nao contem coluna MMGD separada.
        redirect: dataset com coluna val_germmgd/val_ger_mmgd quando disponivel
      - user_mentions:
        - CMO
        - PLD
        - preco energia
        - custo marginal
        reason: Dataset nao contem informacoes de preco ou custo marginal.
        redirect: dataset de CMO/PLD da CCEE
      - user_mentions:
        - EAR
        - energia armazenada
        - reservatorio armazenamento
        reason: Dataset nao contem energia armazenada por subsistema ou reservatorio.
        redirect: ear-diario-por-reservatorio
      - user_mentions:
        - afluencia natural
        - ENA
        - energia natural afluente
        reason: Dataset nao contem ENA. Contem apenas vazoes turbinadas e vertidas realizadas.
        redirect: ena-diario-por-reservatorio
      - user_mentions:
        - restricao eolica
        - COFF eolico
        - corte eolico
        reason: Dataset nao contem restricoes de geracao eolica.
        redirect: restricao_coff_eolica_usi
      - user_mentions:
        - termica
        - gas natural
        - carvao
        - biomassa
        - combustivel
        reason: Dataset e exclusivo de usinas hidreletricas. Nao ha dados de geracao termica por combustivel.
        redirect: geracao-usina-2 ou cvu-usitermica para analises termicas
- property: fewShotQueries
  value:
  - question: Quais usinas hidrelétricas tiveram maior energia vertida turbinável acumulada no ano de
      2024?
    sql: SELECT cod_usina, nom_reservatorio, nom_bacia, id_subsistema, SUM((val_energiavertidaturbinavel)
      * 1.0) / 1000 AS total_evt_mwmed, COUNT(*) AS horas_com_vertimento FROM read_parquet('s3://ons-aws-prod-opendata/dataset/energia_vertida_turbinavel_ho/*.parquet')
      WHERE YEAR(din_instante) = 2024 AND val_energiavertidaturbinavel > 0 GROUP BY cod_usina, nom_reservatorio,
      nom_bacia, id_subsistema ORDER BY total_evt_mwmed DESC LIMIT 20;
  - question: Como evoluiu mensalmente a energia vertida turbinável em cada subsistema elétrico entre
      2020 e 2024?
    sql: SELECT id_subsistema, nom_subsistema, DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP))
      AS mes_referencia, SUM((val_energiavertidaturbinavel) * 1.0) / 1000 AS total_evt_mwmed, SUM((val_energiavertida)
      * 1.0) / 1000 AS total_ev_mwmed, CASE WHEN SUM((val_energiavertida) * 1.0) / 1000 > 0 THEN ROUND(SUM((val_energiavertidaturbinavel)
      * 1.0) / 1000 / SUM((val_energiavertida) * 1.0) / 1000 * 100, 2) ELSE 0 END AS pct_turbinavel FROM
      read_parquet('s3://ons-aws-prod-opendata/dataset/energia_vertida_turbinavel_ho/*.parquet') WHERE
      din_instante >= '2020-01-01' AND din_instante < '2025-01-01' GROUP BY id_subsistema, nom_subsistema,
      DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) ORDER BY id_subsistema, mes_referencia;
  - question: Qual o fator de aproveitamento hidráulico (geração / disponibilidade) médio por usina em
      2023, considerando apenas horas com vertimento turbinável?
    sql: SELECT cod_usina, nom_reservatorio, nom_bacia, id_subsistema, COUNT(*) AS horas_com_evt, ROUND(AVG(val_geracao),
      2) AS geracao_media_mwmed, ROUND(AVG(val_disponibilidade), 2) AS disponibilidade_media_mwmed, ROUND(AVG(val_energiavertidaturbinavel),
      2) AS evt_medio_mwmed, CASE WHEN AVG(val_disponibilidade) > 0 THEN ROUND(AVG(val_geracao) / AVG(val_disponibilidade)
      * 100, 2) ELSE NULL END AS fator_aproveitamento_pct FROM read_parquet('s3://ons-aws-prod-opendata/dataset/energia_vertida_turbinavel_ho/*.parquet')
      WHERE YEAR(din_instante) = 2023 AND val_energiavertidaturbinavel > 0 AND val_disponibilidade > 0
      GROUP BY cod_usina, nom_reservatorio, nom_bacia, id_subsistema ORDER BY evt_medio_mwmed DESC LIMIT
      30;
