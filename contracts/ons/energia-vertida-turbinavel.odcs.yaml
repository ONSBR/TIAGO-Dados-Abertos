version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:energia-vertida-turbinavel
name: energia-vertida-turbinavel
tenant: ons
tags:
- EVT
- ONS
- SIN
- aproveitamento-hidrico
- energia turbinável perdida
- energia vertida aproveitável
- energia vertida turbinável
- energia-vertida-turbinavel
- geracao-hidraulica
- hidrologia
- horario
- perda hidráulica turbinável
- usinas-hidreletricas
- vazao-vertida
- vertimento turbinável
- vertimento-turbinavel
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/energia_vertida_turbinavel_ho/*.parquet
  format: parquet
description:
  purpose: Monitorar, em periodicidade horária e por usina hidrelétrica, os volumes de energia vertida
    turbinável e vazões associadas, permitindo que operadores do ONS, planejadores energéticos e agentes
    do setor elétrico identifiquem perdas de geração por vertimento turbinável, avaliem o aproveitamento
    hidráulico das usinas, subsidiem decisões de despacho e otimização do uso dos recursos hídricos, e
    apoiem análises de eficiência operacional e conformidade regulatória perante ANEEL e CCEE.
  limitations: Valor máximo de 6609. Valor máximo de 222890. Valor máximo de 204.
  usage: Recuperar este dataset quando a pergunta envolver perdas de geração por vertimento hidráulico,
    aproveitamento de vazões turináveis, eficiência operacional de usinas hidrelétricas ou análise de
    oportunidades de geração não aproveitadas.
domain: hidrologia
schema:
- name: energia_vertida_turbinavel
  physicalType: parquet
  logicalType: object
  physicalName: energia_vertida_turbinavel
  properties:
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Identificador do subsistema elétrico ao qual a usina pertence (ex: SE, S, NE, N)'
    customProperties:
    - property: aliases
      value:
      - subsistema
      - sistema
      - região elétrica
      - id subsistema
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
  - name: nom_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: Nome completo do subsistema elétrico ao qual a usina pertence
    customProperties:
    - property: aliases
      value:
      - nome subsistema
      - nome do subsistema
      - região
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - NORDESTE
      - NORTE
      - SUDESTE
      - SUL
  - name: nom_bacia
    physicalType: VARCHAR
    logicalType: string
    description: Nome da bacia hidrográfica onde a usina está localizada
    customProperties:
    - property: aliases
      value:
      - bacia
      - bacia hidrográfica
      - bacia hidrológica
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - AMAZONAS
      - ARAGUARI
      - CAPIVARI
      - DOCE
      - GRANDE
      - IGUACU
      - ITABAPOANA
      - ITAJAI
      - JACUI
      - JEQUITINHONHA
      - MUCURI
      - PARAGUACU
      - PARAGUAI
      - PARAIBA DO SUL
      - PARANA
      - PARANAIBA
      - PARANAPANEMA
      - PARNAIBA
      - SANTA MARIA VIT
      - SAO FRANCISCO
      - TIETE
      - TOCANTINS
      - URUGUAI
  - name: nom_rio
    physicalType: VARCHAR
    logicalType: string
    description: Nome do rio no qual a usina hidrelétrica está instalada
    customProperties:
    - property: aliases
      value:
      - rio
      - nome do rio
      - curso d'água
    - property: semanticType
      value: DIMENSION
  - name: nom_agente
    physicalType: VARCHAR
    logicalType: string
