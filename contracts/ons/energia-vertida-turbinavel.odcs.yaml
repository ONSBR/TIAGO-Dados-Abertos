    customProperties:
    - property: aliases
      value:
      - energia vertida turbinável
      - EVT
      - energia turbinável perdida
      - perda turbinável
      - energia de vertimento turbinável
    - property: semanticType
      value: METRIC
    - property: unit
      value: MW
  quality:
  - type: custom
    engine: soda
    implementation: "checks for energia_vertida_turbinavel:\n  - row_count > 0:\n      name: Tabela não\
      \ pode estar vazia\n\n  # Referential integrity\n  - invalid_count(id_subsistema) = 0:\n      valid\
      \ values:\n        - 'N'\n        - 'NE'\n        - 'S'\n        - 'SE'\n      name: id_subsistema\
      \ deve ser um dos valores válidos\n  - invalid_count(nom_subsistema) = 0:\n      valid values:\n\
      \        - 'NORDESTE'\n        - 'NORTE'\n        - 'SUDESTE'\n        - 'SUL'\n      name: nom_subsistema\
      \ deve ser um dos valores válidos\n  - invalid_count(nom_bacia) = 0:\n      valid values:\n    \
      \    - 'AMAZONAS'\n        - 'ARAGUARI'\n        - 'CAPIVARI'\n        - 'DOCE'\n        - 'GRANDE'\n\
      \        - 'IGUACU'\n        - 'ITABAPOANA'\n        - 'ITAJAI'\n        - 'JACUI'\n        - 'JEQUITINHONHA'\n\
      \        - 'MUCURI'\n        - 'PARAGUACU'\n        - 'PARAGUAI'\n        - 'PARAIBA DO SUL'\n \
      \       - 'PARANA'\n        - 'PARANAIBA'\n        - 'PARANAPANEMA'\n        - 'PARNAIBA'\n    \
      \    - 'SANTA MARIA VIT'\n        - 'SAO FRANCISCO'\n        - 'TIETE'\n        - 'TOCANTINS'\n\
      \        - 'URUGUAI'\n      name: nom_bacia deve ser um dos valores válidos\n\n  # Unicidade da\
      \ chave primária composta ['cod_usina', 'din_instante'] (candidata LLM)\n  - failed rows:\n    \
      \  name: Chave composta (cod_usina, din_instante) não deve ter duplicatas\n      fail query: |\n\
      \        SELECT * FROM energia_vertida_turbinavel\n        WHERE (cod_usina, din_instante) IN (\n\
      \          SELECT cod_usina, din_instante FROM energia_vertida_turbinavel\n          GROUP BY cod_usina,\
      \ din_instante\n          HAVING COUNT(*) > 1\n        )\n\n  # Freshness: din_instante deve ter\
      \ dados recentes (SLA: Atualizado diariamente)\n  - freshness(din_instante) < 3d:\n      name: din_instante\
      \ não pode ter dados com mais de 3 dias de atraso\n"
team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/energia-vertida-turbinavel
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - quanta energia foi desperdicada
  - agua vertida que daria energia
  - perda por vertimento
  - geracao perdida na hidraulica
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver perdas de geração por vertimento hidráulico,
    aproveitamento de vazões turináveis, eficiência operacional de usinas hidrelétricas ou análise de
    oportunidades de geração não aproveitadas. Também relevante para perguntas sobre balanço hídrico horário
    por usina, produtividade específica e correlação entre vertimento e despacho no SIN.
- property: agentInstructions
  value: '- [val_energiavertidaturbinavel] Valor máximo de 6.609,19 MWmed é extremamente elevado para
    uma única usina em um intervalo horário. Pode representar grandes usinas como Itaipu em situações
    excepcionais de cheia, mas merece validação para identificar possíveis erros de consolidação.


    - [val_vazaoturbinada] Valor máximo de 222.890 m³/s é excepcionalmente alto. A vazão turbinada máxima
    de Itaipu é ~17.000 m³/s; valores acima de 50.000 m³/s merecem investigação para descartar erros de
    escala ou unidade no dataset energia-vertida-turbinavel.


    - [val_produtividade] Valor máximo de 204,63 MW/(m³/s) é muito superior ao esperado para usinas hidrelétricas
    brasileiras (tipicamente 0,5–1,5 MW/(m³/s)). Pode indicar erro de unidade, divisão por vazão próxima
    de zero ou problema de consolidação no dataset energia-vertida-turbinavel.


    - [val_vazaovertidanaoturbinavel] Máximo de 1.506 m³/s é muito inferior ao máximo de val_vazaovertida
    (41.498 m³/s), confirmando que a maior parte do vertimento é turbinável. Verificar se registros com
    val_vazaovertidanaoturbinavel > 0 e val_vazaovertidaturbinavel = 0 são consistentes no dataset energia-vertida-turbinavel.


    - [din_instante] Dataset cobre 11+ anos com atualização diária. Possíveis lacunas horárias por falhas
    de telemetria ou reprocessamento. A partir de 2024 os arquivos são mensais (MES-ANO), o que pode gerar
    descontinuidades na transição de arquivos anuais para mensais no dataset energia-vertida-turbinavel.


    - [val_geracao] Valor máximo de 14.147,78 MWmed próximo à capacidade instalada de Itaipu (~14.000
    MW). Verificar se existem registros com val_geracao > val_disponibilidade no dataset energia-vertida-turbinavel,
    pois indicariam inconsistência lógica.


    - [val_energiavertida] Verificar consistência entre val_energiavertida (total) e val_energiavertidaturbinavel
    (parcela). Registros onde val_energiavertida < val_energiavertidaturbinavel indicam inconsistência
    lógica no dataset energia-vertida-turbinavel (total menor que parcela turbinável).


    - [val_folgadegeracao] Valor máximo de 8.688,58 MWmed é muito elevado. Verificar se registros com
    val_folgadegeracao > val_disponibilidade existem no dataset energia-vertida-turbinavel, pois indicariam
    folga maior que a própria disponibilidade — inconsistência lógica.


    - [cod_usina] A chave primária natural é (cod_usina, din_instante). Verificar se existem registros
    duplicados para a mesma usina no mesmo instante horário no dataset energia-vertida-turbinavel, o que
    indicaria problema no processo de consolidação ou ingestão dos arquivos parquet.

    '
- property: typicalQuestions
  value:
  - Quais usinas tiveram maior energia vertida turbinável no verão de 2024?
  - Qual foi a perda acumulada de geração por vertimento turbinável no subsistema Sudeste em 2023?
  - Em quais horas do dia ocorrem mais eventos de vertimento turbinável na bacia do Paraná?
  - Qual a relação entre afluência e energia vertida turbinável em Itaipu nos últimos 5 anos?
  - Quais usinas apresentam maior produtividade específica média e ainda assim registram vertimento turbinável?
- property: granularity
  value: horária
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/energia_vertida_turbinavel_ho/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2015-01-01'
- property: semantics
  value:
    temporal_perspective: verificado
    row_grain:
      temporal: 1 hora
      temporal_column: din_instante
      spatial: usina
      entity: reservatorio
      one_row_per:
      - din_instante
      - id_subsistema
      - cod_usina
    dimension_columns:
      subsistema: id_subsistema
      fonte: null
      usina: null
      reservatorio: nom_reservatorio
      bacia: nom_bacia
      subestacao: null
      patamar: null
    metrics:
    - id: geracao
      label: Geracao
      columns:
      - val_geracao
      expression: val_geracao
      quantity_kind: average_power
      unit_native: MWmed
      default_aggregation: sum
      forbidden_aggregations: []
      valid_intents:
      - geracao
      - geração
      - geração elétrica
      - potência gerada
      - geração da usina
      - MW gerado
      aggregation_modes:
        total_energy:
          sql: SUM((val_geracao) * 1.0) / 1000
          unit: GWh
        average_power:
          sql: AVG(val_geracao)
          unit: MWmed
        peak_power:
          sql: MAX(val_geracao)
          unit: MWmed
        time_series:
          sql: AVG(val_geracao)
          unit: MWmed
        ranking:
          sql: SUM((val_geracao) * 1.0) / 1000
          unit: GWh
        comparison:
          sql: AVG(val_geracao)
          unit: MWmed
      interval_hours: 1.0
      aliases:
      - geração
      - geração elétrica
      - potência gerada
      - geração da usina
      - MW gerado
    - id: disponibilidade
      label: Disponibilidade
      columns:
      - val_disponibilidade
      expression: val_disponibilidade
      quantity_kind: average_power
      unit_native: MWmed
      default_aggregation: sum
      forbidden_aggregations: []
      valid_intents:
      - disponibilidade
      - capacidade disponível
      - potência disponível
      - MW disponível
      aggregation_modes:
        total_energy:
          sql: SUM((val_disponibilidade) * 1.0) / 1000
          unit: GWh
        average_power:
          sql: AVG(val_disponibilidade)
          unit: MWmed
        peak_power:
          sql: MAX(val_disponibilidade)
          unit: MWmed
        time_series:
          sql: AVG(val_disponibilidade)
          unit: MWmed
        ranking:
          sql: SUM((val_disponibilidade) * 1.0) / 1000
          unit: GWh
        comparison:
          sql: AVG(val_disponibilidade)
          unit: MWmed
      interval_hours: 1.0
      aliases:
      - disponibilidade
      - capacidade disponível
      - potência disponível
      - MW disponível
    - id: vazaoturbinada
      label: Vazaoturbinada
      columns:
      - val_vazaoturbinada
