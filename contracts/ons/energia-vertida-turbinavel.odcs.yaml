    customProperties:
    - property: aliases
      value:
      - energia vertida
      - energia de vertimento
      - energia perdida por vertimento
      - vertimento em energia
    - property: semanticType
      value: METRIC
    - property: unit
      value: MW
  - name: val_vazaovertidaturbinavel
    physicalType: DOUBLE
    logicalType: number
    description: 'Parcela da vazão vertida que poderia ser aproveitada para geração de energia (vertimento
