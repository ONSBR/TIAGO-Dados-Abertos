version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:ena-diario-por-reservatorio
name: ena-diario-por-reservatorio
tenant: ons
tags:
- ENA
- ENA bruta reservatório
- ENA diária
- ENA diária reservatório
- ENA por reservatório
- MLT
- ONS
- REE
- afluência energética diária
- diário
- energia natural afluente
- energia natural afluente diária
- hidrologia
- média de longo termo
- reservatório
- subsistema
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/ena_reservatorio_di/*.parquet
  format: parquet
description:
  purpose: Fornecer aos geradores hidrelétricos, comercializadores de energia, pesquisadores e ao próprio
    ONS a série diária de disponibilidade hídrica por reservatório, permitindo acompanhar a produtividade
    energética de cada aproveitamento, calcular desvios em relação à média histórica (MLT), subsidiar
    estudos de planejamento da operação hidrotérmica, projeção do Custo Marginal de Operação (CMO) e análise
    de risco hidrológico no mercado de energia elétrica brasileiro.
  limitations: Coluna de data armazenada como VARCHAR no Parquet em vez de DATE; filtros temporais diretos
    podem falhar ou retornar resultados incorretos sem cast explícito. Aproximadamente 0. Aproximadamente
    0.
  usage: Recuperar este dataset quando a pergunta envolver Energia Natural Afluente (ENA) com granularidade
    diária e nível de detalhe por reservatório ou usina hidrelétrica individual.
domain: hidrologia
schema:
- name: ena_diario_por_reservatorio
  physicalType: parquet
  logicalType: object
  physicalName: ena_diario_por_reservatorio
  properties:
  - name: nom_reservatorio
    physicalType: VARCHAR
    logicalType: string
    description: Nome do reservatório hidrelétrico ao qual os dados de ENA se referem
    customProperties:
    - property: aliases
      value:
      - nome do reservatório
      - reservatório
      - usina
      - nome da usina
    - property: semanticType
      value: DIMENSION
  - name: cod_resplanejamento
    physicalType: DOUBLE
    logicalType: number
    description: Código numérico do reservatório utilizado no planejamento energético do ONS; identifica
      unicamente cada aproveitamento hidrelétrico
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - código do reservatório
      - código de planejamento
      - cod reservatório
      - id reservatório
    - property: semanticType
      value: IDENTIFIER
  - name: tip_reservatorio
    physicalType: VARCHAR
    logicalType: string
    description: Tipo do reservatório, indicando sua característica operativa (reservatório de acumulação
      ou fio d'água)
    customProperties:
    - property: aliases
      value:
      - tipo do reservatório
      - tipo de reservatório
      - classificação do reservatório
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Fio dagua
      - Reservatório com Usina
  - name: nom_bacia
    physicalType: VARCHAR
    logicalType: string
    description: Nome da bacia hidrográfica à qual o reservatório pertence; permite agregações por bacia
    customProperties:
    - property: aliases
      value:
      - bacia
      - bacia hidrográfica
      - nome da bacia
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - AMAZONAS
      - ARAGUARI
      - CAPIVARI
      - DOCE
      - GRANDE
      - IGUACU
      - ITABAPOANA
      - ITAJAI
      - JACUI
      - JEQUITINHONHA
      - MUCURI
      - PARAGUACU
      - PARAGUAI
      - PARAIBA DO SUL
      - PARANA
      - PARANAIBA
      - PARANAPANEMA
      - PARNAIBA
      - SANTA MARIA VIT
      - SAO FRANCISCO
      - TIETE
      - TOCANTINS
      - URUGUAI
  - name: nom_ree
    physicalType: VARCHAR
    logicalType: string
    description: Nome do Reservatório Equivalente de Energia (REE) ao qual o reservatório está associado;
      nível intermediário de agregação entre usina e subsistema
    customProperties:
    - property: aliases
      value:
      - REE
      - reservatório equivalente
      - nome do REE
      - reservatório equivalente de energia
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - BELO MONTE
      - IGUACU
      - ITAIPU
      - MADEIRA
      - MANAUS-AMAPA
      - NORDESTE
      - NORTE
      - PARANA
      - PARANAPANEMA
      - SUDESTE
      - SUL
      - TELES PIRES
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: Sigla identificadora do subsistema elétrico ao qual o reservatório pertence (SE, S, NE,
      N)
    customProperties:
    - property: aliases
      value:
      - subsistema
      - sigla do subsistema
      - id subsistema
      - código do subsistema
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
  - name: nom_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: Nome completo do subsistema elétrico ao qual o reservatório pertence
    customProperties:
    - property: aliases
      value:
      - nome do subsistema
      - região
      - subsistema por extenso
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - NORDESTE
      - NORTE
      - SUDESTE
      - SUL
  - name: ena_data
    physicalType: VARCHAR
    logicalType: string
    description: Data de referência da medição de ENA no formato YYYY-MM-DD; armazenada como VARCHAR no
      Parquet — recomenda-se cast para DATE nas queries
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - data
      - data da ENA
      - data de referência
      - data da medição
    - property: semanticType
      value: DIMENSION
  - name: ena_bruta_res_mwmed
    physicalType: VARCHAR
    logicalType: number
    description: Energia Natural Afluente (ENA) Bruta do reservatório em MWmed; calculada pelo produto
      das vazões naturais afluentes pela produtividade da usina a 65% do volume útil
    customProperties:
    - property: castExpression
      value: TRY_CAST(ena_bruta_res_mwmed AS DOUBLE)
    - property: aliases
      value:
      - ENA bruta
      - energia natural afluente bruta
      - ENA bruta em MWmed
      - energia afluente bruta
    - property: unit
      value: MWmed
  - name: ena_bruta_res_percentualmlt
    physicalType: VARCHAR
    logicalType: number
    description: ENA Bruta do reservatório expressa como percentual da Média de Longo Termo (MLT); indica
      o desvio da afluência em relação à média histórica
    customProperties:
    - property: castExpression
      value: TRY_CAST(ena_bruta_res_percentualmlt AS DOUBLE)
    - property: aliases
      value:
      - ENA bruta percentual MLT
      - ENA bruta % MLT
      - percentual da MLT bruta
      - ENA bruta relativa
    - property: unit
      value: '%MLT'
  - name: ena_armazenavel_res_mwmed
    physicalType: VARCHAR
    logicalType: number
    description: Energia Natural Afluente Armazenável do reservatório em MWmed; considera as vazões naturais
      descontadas das vazões vertidas, representando a parcela efetivamente aproveitável para armazenamento
    customProperties:
    - property: castExpression
      value: TRY_CAST(ena_armazenavel_res_mwmed AS DOUBLE)
    - property: aliases
      value:
      - ENA armazenável
      - energia armazenável
      - ENA armazenável em MWmed
      - energia natural armazenável
    - property: unit
      value: MWmed
  - name: ena_armazenavel_res_percentualmlt
    physicalType: VARCHAR
    logicalType: number
    description: ENA Armazenável do reservatório expressa como percentual da MLT; indica a disponibilidade
      hídrica armazenável em relação à média histórica
    customProperties:
    - property: castExpression
      value: TRY_CAST(ena_armazenavel_res_percentualmlt AS DOUBLE)
    - property: aliases
      value:
      - ENA armazenável percentual MLT
      - ENA armazenável % MLT
      - percentual da MLT armazenável
      - ENA armazenável relativa
    - property: unit
      value: '%MLT'
  - name: ena_queda_bruta
    physicalType: VARCHAR
    logicalType: number
    description: Queda bruta do reservatório em metros, utilizada no cálculo da produtividade hidráulica
      da usina; representa a diferença de nível entre montante e jusante
    customProperties:
    - property: castExpression
      value: TRY_CAST(ena_queda_bruta AS DOUBLE)
    - property: aliases
      value:
      - queda bruta
      - queda
      - altura de queda
      - queda hidráulica bruta
    - property: unit
      value: m
  - name: mlt_ena
    physicalType: VARCHAR
    logicalType: number
    description: Média de Longo Termo (MLT) da ENA do reservatório em MWmed; valor de referência histórico
      utilizado para calcular os percentuais de ENA bruta e armazenável
    customProperties:
    - property: castExpression
      value: TRY_CAST(mlt_ena AS DOUBLE)
    - property: aliases
      value:
      - MLT
      - média de longo termo
      - MLT da ENA
      - média histórica ENA
    - property: unit
      value: MWmed
  quality:
  - type: custom
    engine: soda
    implementation: "checks for ena_diario_por_reservatorio:\n  - row_count > 0:\n      name: Tabela não\
      \ pode estar vazia\n\n  # Referential integrity\n  - invalid_count(tip_reservatorio) = 0:\n    \
      \  valid values:\n        - 'Fio dagua'\n        - 'Reservatório com Usina'\n      name: tip_reservatorio\
      \ deve ser um dos valores válidos\n  - invalid_count(nom_bacia) = 0:\n      valid values:\n    \
      \    - 'AMAZONAS'\n        - 'ARAGUARI'\n        - 'CAPIVARI'\n        - 'DOCE'\n        - 'GRANDE'\n\
      \        - 'IGUACU'\n        - 'ITABAPOANA'\n        - 'ITAJAI'\n        - 'JACUI'\n        - 'JEQUITINHONHA'\n\
      \        - 'MUCURI'\n        - 'PARAGUACU'\n        - 'PARAGUAI'\n        - 'PARAIBA DO SUL'\n \
      \       - 'PARANA'\n        - 'PARANAIBA'\n        - 'PARANAPANEMA'\n        - 'PARNAIBA'\n    \
      \    - 'SANTA MARIA VIT'\n        - 'SAO FRANCISCO'\n        - 'TIETE'\n        - 'TOCANTINS'\n\
      \        - 'URUGUAI'\n      name: nom_bacia deve ser um dos valores válidos\n  - invalid_count(nom_ree)\
      \ = 0:\n      valid values:\n        - 'BELO MONTE'\n        - 'IGUACU'\n        - 'ITAIPU'\n  \
      \      - 'MADEIRA'\n        - 'MANAUS-AMAPA'\n        - 'NORDESTE'\n        - 'NORTE'\n        -\
      \ 'PARANA'\n        - 'PARANAPANEMA'\n        - 'SUDESTE'\n        - 'SUL'\n        - 'TELES PIRES'\n\
      \      name: nom_ree deve ser um dos valores válidos\n  - invalid_count(id_subsistema) = 0:\n  \
      \    valid values:\n        - 'N'\n        - 'NE'\n        - 'S'\n        - 'SE'\n      name: id_subsistema\
      \ deve ser um dos valores válidos\n  - invalid_count(nom_subsistema) = 0:\n      valid values:\n\
      \        - 'NORDESTE'\n        - 'NORTE'\n        - 'SUDESTE'\n        - 'SUL'\n      name: nom_subsistema\
      \ deve ser um dos valores válidos\n\n  # Unicidade da chave primária composta ['cod_resplanejamento',\
      \ 'ena_data'] (candidata LLM)\n  - failed rows:\n      name: Chave composta (cod_resplanejamento,\
      \ ena_data) não deve ter duplicatas\n      fail query: |\n        SELECT * FROM ena_diario_por_reservatorio\n\
      \        WHERE (cod_resplanejamento, ena_data) IN (\n          SELECT cod_resplanejamento, ena_data\
      \ FROM ena_diario_por_reservatorio\n          GROUP BY cod_resplanejamento, ena_data\n         \
      \ HAVING COUNT(*) > 1\n        )\n\n  # Nulos em ena_bruta_res_mwmed — alerta de qualidade (real=0%,\
      \ threshold=5.0%)\n  - missing_percent(ena_bruta_res_mwmed) < 5.0:\n      name: ena_bruta_res_mwmed\
      \ não deve ter >5.0% nulos\n\n  # Nulos em ena_bruta_res_percentualmlt — alerta de qualidade (real=0%,\
      \ threshold=5.0%)\n  - missing_percent(ena_bruta_res_percentualmlt) < 5.0:\n      name: ena_bruta_res_percentualmlt\
      \ não deve ter >5.0% nulos\n\n  # Nulos em ena_armazenavel_res_mwmed — alerta de qualidade (real=0%,\
      \ threshold=5.0%)\n  - missing_percent(ena_armazenavel_res_mwmed) < 5.0:\n      name: ena_armazenavel_res_mwmed\
      \ não deve ter >5.0% nulos\n\n  # Nulos em ena_armazenavel_res_percentualmlt — alerta de qualidade\
      \ (real=0%, threshold=5.0%)\n  - missing_percent(ena_armazenavel_res_percentualmlt) < 5.0:\n   \
      \   name: ena_armazenavel_res_percentualmlt não deve ter >5.0% nulos\n\n  # Nulos em ena_queda_bruta\
      \ — alerta de qualidade (real=0%, threshold=5.0%)\n  - missing_percent(ena_queda_bruta) < 5.0:\n\
      \      name: ena_queda_bruta não deve ter >5.0% nulos\n\n  # Nulos em mlt_ena — alerta de qualidade\
      \ (real=0%, threshold=5.0%)\n  - missing_percent(mlt_ena) < 5.0:\n      name: mlt_ena não deve ter\
      \ >5.0% nulos\n"
team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/ena-diario-por-reservatorio
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - afluencia de cada usina
  - ena por usina
  - quanta agua chegou na represa
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver Energia Natural Afluente (ENA) com granularidade
    diária e nível de detalhe por reservatório ou usina hidrelétrica individual. Também relevante para
    análises de desvio em relação à MLT, comparação de produtividade entre aproveitamentos, ou quando
    o usuário mencionar termos como ENA bruta, ENA armazenável, queda bruta, MLT por reservatório ou afluência
    diária de usinas específicas do SIN.
- property: agentInstructions
  value: |
    - [ena_data] Coluna de data armazenada como VARCHAR no Parquet S3 em vez de DATE. Filtros temporais e ordenações diretas podem produzir resultados incorretos sem conversão explícita. Padrão YYYY-MM-DD inferido pelo período 2021-01-01 a 2026-06-12.

    - [ena_bruta_res_mwmed] Aproximadamente 0,2% dos registros apresentam valor nulo. Provavelmente corresponde a reservatórios sem operação ou sem dados consistidos em determinadas datas. Deve ser tratado antes de agregações e médias.

    - [ena_bruta_res_percentualmlt] Aproximadamente 0,2% dos registros apresentam valor nulo, coincidindo com os nulos de ena_bruta_res_mwmed. Indica ausência de dado de ENA bruta para o cálculo do percentual MLT nessas datas/reservatórios.

    - [ena_bruta_res_percentualmlt] Percentuais de ENA bruta em relação à MLT podem apresentar valores extremamente elevados (acima de 500%) em eventos de cheia excepcional ou valores negativos em secas severas. Recomenda-se verificar outliers para identificar possíveis erros de consistência.

    - [ena_armazenavel_res_mwmed] Aproximadamente 0,2% dos registros apresentam valor nulo. Reservatórios fio d'água podem não ter ENA armazenável definida, contribuindo para esta fração de nulos.

    - [ena_armazenavel_res_percentualmlt] Aproximadamente 0,2% dos registros apresentam valor nulo, alinhado com os nulos de ena_armazenavel_res_mwmed. Ausência do percentual MLT armazenável nas mesmas datas/reservatórios sem dado de ENA armazenável.

    - [ena_queda_bruta] Aproximadamente 0,2% dos registros apresentam valor nulo para a queda bruta. Pode indicar reservatórios sem modelagem de queda ou dados não disponíveis para o período.

    - [mlt_ena] Aproximadamente 0,2% dos registros apresentam valor nulo para a MLT da ENA. Sem a MLT, os percentuais em relação à média histórica não podem ser calculados para esses registros.

    - [cod_resplanejamento] A chave primária natural é (cod_resplanejamento, ena_data). Verificar se existem múltiplos registros para o mesmo reservatório na mesma data, o que indicaria duplicatas ou inconsistência de carga dos arquivos Parquet.

    - [tipos] As colunas `ena_armazenavel_res_mwmed`, `ena_armazenavel_res_percentualmlt`, `ena_bruta_res_mwmed`, `ena_bruta_res_percentualmlt`, `ena_queda_bruta`, `mlt_ena` mudam de tipo entre arquivos anuais (texto em uns, número em outros); cada uma traz `castExpression` no schema: use-o em toda agregação e comparação.
- property: typicalQuestions
  value:
  - Qual foi a ENA bruta diária do reservatório de Furnas em janeiro de 2024?
  - Quais reservatórios do subsistema Sudeste apresentaram ENA abaixo de 50% da MLT nos últimos 30 dias?
  - Como evoluiu a ENA armazenável do REE Paraná Médio ao longo de 2023?
  - Qual é a participação percentual de cada reservatório na ENA total do subsistema Sul?
  - Quais reservatórios fio d'água tiveram ENA armazenável negativa em 2022?
- property: granularity
  value: diária
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/ena_reservatorio_di/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2021-01-01'
- property: semantics
  value:
    temporal_perspective: verificado
    row_grain:
      temporal: 1 dia
      temporal_column: ena_data
      spatial: usina
      entity: reservatorio
      one_row_per:
      - ena_data
      - id_subsistema
      - cod_resplanejamento
    dimension_columns:
      subsistema: id_subsistema
      fonte: null
      usina: null
      reservatorio: nom_reservatorio
      bacia: nom_bacia
      subestacao: null
      patamar: null
    metrics:
    - id: ena_bruta_res_mwmed
      label: ENA Bruta por Reservatorio
      columns:
      - ena_bruta_res_mwmed
      expression: ena_bruta_res_mwmed
      quantity_kind: average_power
      unit_native: MWmed
      default_aggregation: sum
      forbidden_aggregations: []
      valid_intents:
      - ena_bruta_res_mwmed
      - ENA bruta
      - energia natural afluente bruta
      - ENA bruta em MWmed
      - energia afluente bruta
      aggregation_modes:
        total_energy:
          sql: SUM((TRY_CAST(ena_bruta_res_mwmed AS DOUBLE)) * 24.0) / 1000
          unit: GWh
        average_power:
          sql: AVG(TRY_CAST(ena_bruta_res_mwmed AS DOUBLE))
          unit: MWmed
        peak_power:
          sql: MAX(TRY_CAST(ena_bruta_res_mwmed AS DOUBLE))
          unit: MWmed
        time_series:
          sql: AVG(TRY_CAST(ena_bruta_res_mwmed AS DOUBLE))
          unit: MWmed
        ranking:
          sql: SUM((TRY_CAST(ena_bruta_res_mwmed AS DOUBLE)) * 24.0) / 1000
          unit: GWh
        comparison:
          sql: AVG(TRY_CAST(ena_bruta_res_mwmed AS DOUBLE))
          unit: MWmed
      interval_hours: 24.0
      aliases:
      - ENA bruta
      - energia natural afluente bruta
      - ENA bruta em MWmed
      - energia afluente bruta
    - id: ena_bruta_res_percentualmlt
      label: ENA Bruta Percentual MLT
      columns:
      - ena_bruta_res_percentualmlt
      expression: ena_bruta_res_percentualmlt
      quantity_kind: ratio
      unit_native: '%'
      default_aggregation: avg
      forbidden_aggregations:
      - sum
      valid_intents:
      - ena_bruta_res_percentualmlt
      - ENA bruta percentual MLT
      - ENA bruta % MLT
      - percentual da MLT bruta
      - ENA bruta relativa
      aggregation_modes:
        average:
          sql: AVG(TRY_CAST(ena_bruta_res_percentualmlt AS DOUBLE))
          unit: '%'
        maximum:
          sql: MAX(TRY_CAST(ena_bruta_res_percentualmlt AS DOUBLE))
          unit: '%'
        minimum:
          sql: MIN(TRY_CAST(ena_bruta_res_percentualmlt AS DOUBLE))
          unit: '%'
        time_series:
          sql: AVG(TRY_CAST(ena_bruta_res_percentualmlt AS DOUBLE))
          unit: '%'
        ranking:
          sql: AVG(TRY_CAST(ena_bruta_res_percentualmlt AS DOUBLE))
          unit: '%'
        comparison:
          sql: AVG(TRY_CAST(ena_bruta_res_percentualmlt AS DOUBLE))
          unit: '%'
      interval_hours: 24.0
      aliases:
      - ENA bruta percentual MLT
      - ENA bruta % MLT
      - percentual da MLT bruta
      - ENA bruta relativa
      - desvio ENA bruta MLT
    - id: ena_armazenavel_res_mwmed
      label: ENA Armazenavel por Reservatorio
      columns:
      - ena_armazenavel_res_mwmed
      expression: ena_armazenavel_res_mwmed
      quantity_kind: average_power
      unit_native: MWmed
      default_aggregation: sum
      forbidden_aggregations: []
      valid_intents:
      - ena_armazenavel_res_mwmed
      - ENA armazenavel
      - energia armazenavel
      - ENA armazenavel em MWmed
      - energia natural armazenavel
      aggregation_modes:
        total_energy:
          sql: SUM((TRY_CAST(ena_armazenavel_res_mwmed AS DOUBLE)) * 24.0) / 1000
          unit: GWh
        average_power:
          sql: AVG(TRY_CAST(ena_armazenavel_res_mwmed AS DOUBLE))
          unit: MWmed
        peak_power:
          sql: MAX(TRY_CAST(ena_armazenavel_res_mwmed AS DOUBLE))
          unit: MWmed
        time_series:
          sql: AVG(TRY_CAST(ena_armazenavel_res_mwmed AS DOUBLE))
          unit: MWmed
        ranking:
          sql: SUM((TRY_CAST(ena_armazenavel_res_mwmed AS DOUBLE)) * 24.0) / 1000
          unit: GWh
        comparison:
          sql: AVG(TRY_CAST(ena_armazenavel_res_mwmed AS DOUBLE))
          unit: MWmed
      interval_hours: 24.0
      aliases:
      - ENA armazenavel
      - energia armazenavel
      - ENA armazenavel em MWmed
      - energia natural armazenavel
      - afluencia armazenavel
    - id: ena_armazenavel_res_percentualmlt
      label: ENA Armazenavel Percentual MLT
      columns:
      - ena_armazenavel_res_percentualmlt
      expression: ena_armazenavel_res_percentualmlt
      quantity_kind: ratio
      unit_native: '%'
      default_aggregation: avg
      forbidden_aggregations:
      - sum
      valid_intents:
      - ena_armazenavel_res_percentualmlt
      - ENA armazenavel percentual MLT
      - ENA armazenavel % MLT
      - percentual da MLT armazenavel
      - ENA armazenavel relativa
      aggregation_modes:
        average:
          sql: AVG(TRY_CAST(ena_armazenavel_res_percentualmlt AS DOUBLE))
          unit: '%'
