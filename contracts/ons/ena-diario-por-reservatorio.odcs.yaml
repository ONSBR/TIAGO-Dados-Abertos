    sql_patterns:
      ena_bruta_res_mwmed_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(ena_data AS DATE)) AS mes,\n  id_subsistema,\n\
          \  SUM((TRY_CAST(ena_bruta_res_mwmed AS DOUBLE)) * 24.0) / 1000 AS ena_bruta_gwh\nFROM {source}\n\
          WHERE EXTRACT(YEAR FROM TRY_CAST(ena_data AS DATE)) = {year}\n  AND ena_bruta_res_mwmed IS NOT\
          \ NULL\nGROUP BY 1, 2\nORDER BY 1, 2"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - ena_bruta_res_mwmed
          grain: month
        validated_params:
          year: '2021'
      ena_percentual_mlt_por_reservatorio:
        template: "SELECT nom_reservatorio,\n  AVG(TRY_CAST(ena_bruta_res_percentualmlt AS DOUBLE)) AS\
          \ ena_bruta_pct_mlt_media,\n  AVG(TRY_CAST(ena_armazenavel_res_percentualmlt AS DOUBLE)) AS\
          \ ena_arm_pct_mlt_media\nFROM {source}\nWHERE TRY_CAST(ena_data AS DATE) BETWEEN '{data_inicio}'\
          \ AND '{data_fim}'\n  AND ena_bruta_res_percentualmlt IS NOT NULL\nGROUP BY 1\nORDER BY 2 ASC"
        output_unit: '%'
        matches:
          output_modes:
          - average
          metrics:
          - ena_bruta_res_percentualmlt
          - ena_armazenavel_res_percentualmlt
          grain: period
        validated_params:
          data_inicio: '2021-01-01'
          data_fim: '2022-10-27'
      ena_armazenavel_fio_dagua:
        template: "SELECT nom_reservatorio,\n  TRY_CAST(ena_data AS DATE) AS data,\n  TRY_CAST(ena_armazenavel_res_mwmed\
          \ AS DOUBLE) AS ena_armazenavel_mwmed\nFROM {source}\nWHERE tip_reservatorio = 'Fio dagua'\n\
          \  AND TRY_CAST(ena_data AS DATE) BETWEEN '{data_inicio}' AND '{data_fim}'\n  AND ena_armazenavel_res_mwmed\
          \ IS NOT NULL\nORDER BY 1, 2"
        output_unit: MWmed
        matches:
          output_modes:
          - time_series
          metrics:
          - ena_armazenavel_res_mwmed
          grain: day
        validated_params:
          data_inicio: '2021-01-01'
          data_fim: '2022-10-27'
      mlt_referencia_por_reservatorio:
        template: "SELECT nom_reservatorio, nom_ree, id_subsistema,\n  AVG(TRY_CAST(mlt_ena AS DOUBLE))\
          \ AS mlt_mwmed\nFROM {source}\nWHERE mlt_ena IS NOT NULL\nGROUP BY 1, 2, 3\nORDER BY 4 DESC"
        output_unit: MWmed
        matches:
          output_modes:
          - average_power
          metrics:
          - mlt_ena
          grain: static
    ambiguity_policy:
      default_assumptions:
      - when: usuario menciona ENA sem especificar bruta ou armazenavel
        assume_metric: ena_bruta_res_mwmed
        assume_output: average_power
        note: ENA bruta e a metrica primaria de afluencia natural; ENA armazenavel e derivada e requer
          esclarecimento apenas se contexto indicar analise de armazenamento.
      - when: usuario pede total ou soma de ENA em periodo
        assume_metric: ena_bruta_res_mwmed
        assume_output: total_energy
        note: Soma de MWmed x 24h = GWh e a conversao correta para energia total diaria.
      - when: usuario pede percentual ou desvio da MLT sem especificar bruta ou armazenavel
        assume_metric: ena_bruta_res_percentualmlt
        assume_output: average
        note: Percentual MLT bruta e o indicador padrao de desvio hidrologico no ONS.
      - when: usuario pede MLT sem especificar metrica
        assume_metric: mlt_ena
        assume_output: average_power
        note: mlt_ena e a unica coluna de referencia historica disponivel neste dataset.
      must_clarify_when:
      - ambiguity: bruta_vs_armazenavel
        question: Voce quer a ENA Bruta (afluencia total) ou a ENA Armazenavel (desconta vertimentos)?
        trigger_terms:
        - armazenavel
        - aproveitavel
        - vertimento
        - vertida
        - desconta
      - ambiguity: mwmed_vs_gwh
        question: Voce quer o resultado em MWmed (potencia media) ou GWh (energia total do periodo)?
        trigger_terms:
        - energia total
        - total do mes
        - total do ano
        - acumulado
      redirect_when:
      - user_mentions:
        - energia armazenada
        - EAR
        - estoque hidrico
        - armazenamento reservatorio
        reason: EAR (energia armazenada) esta em dataset separado, nao neste dataset de ENA.
        redirect: ear-diario-por-reservatorio
      - user_mentions:
        - cota
        - nivel dagua
        - volume util
        - volume armazenado
        - vazao afluente
        - vazao em m3
        reason: Dados hidrologicos de nivel, volume e vazao estao em dataset de dados hidrologicos.
        redirect: dados-hidrologicos-res
      - user_mentions:
        - geracao verificada
        - geracao hidraulica
        - MWh gerado
        - despacho hidraulico
        reason: Geracao verificada de usinas hidraulicas esta em dataset de geracao por usina.
        redirect: geracao-usina-2
      - user_mentions:
        - CEG
        - usina individual
        - ranking de usinas
        reason: Schema nao contem CEG ou identificador fisico de usina individual.
        redirect: geracao-usina-2
      - user_mentions:
        - nuclear
        - angra
        reason: Schema nao contem dimensao nuclear.
        redirect: geracao-usina-2
      - user_mentions:
        - MMGD
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Schema nao contem coluna MMGD.
        redirect: dataset com coluna val_germmgd
      - user_mentions:
        - carga
        - consumo
        - demanda eletrica
        reason: Dataset contem apenas ENA hidrologica, nao carga de consumo.
        redirect: carga-energia-subsistema
      - user_mentions:
        - PLD
        - CMO
        - preco spot
        - custo marginal
        reason: Dataset nao contem precos de energia.
        redirect: dataset de precos CCEE
- property: fewShotQueries
  value:
  - question: Qual foi a ENA bruta diária do reservatório de Furnas em 2023?
    sql: SELECT TRY_CAST(ena_data AS DATE) AS data, nom_reservatorio, ena_bruta_res_mwmed, ena_bruta_res_percentualmlt
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ena_reservatorio_di/*.parquet') WHERE nom_reservatorio
      = 'FURNAS' AND TRY_CAST(ena_data AS DATE) BETWEEN DATE '2023-01-01' AND DATE '2023-12-31' ORDER
      BY data
  - question: Quais reservatórios estiveram com ENA armazenável abaixo de 30% da MLT nos últimos 30 dias?
    sql: SELECT nom_reservatorio, id_subsistema, nom_bacia, TRY_CAST(ena_data AS DATE) AS data, TRY_CAST(ena_armazenavel_res_percentualmlt
      AS DOUBLE) AS ena_armazenavel_res_percentualmlt FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ena_reservatorio_di/*.parquet',
      union_by_name=true) WHERE TRY_CAST(ena_armazenavel_res_percentualmlt AS DOUBLE) < 30.0 AND TRY_CAST(ena_armazenavel_res_percentualmlt
      AS DOUBLE) IS NOT NULL AND TRY_CAST(ena_data AS DATE) >= (CURRENT_DATE - INTERVAL '30' DAY) ORDER
      BY TRY_CAST(ena_armazenavel_res_percentualmlt AS DOUBLE) ASC LIMIT 100
  - question: Qual foi a ENA bruta média mensal por subsistema em 2023, somando todos os reservatórios?
    sql: SELECT id_subsistema, nom_subsistema, DATE_TRUNC('month', TRY_CAST(ena_data AS DATE)) AS mes,
      SUM(ena_bruta_res_mwmed) AS ena_bruta_total_mwmed, AVG(ena_bruta_res_percentualmlt) AS ena_bruta_media_pct_mlt
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ena_reservatorio_di/*.parquet') WHERE TRY_CAST(ena_data
      AS DATE) BETWEEN DATE '2023-01-01' AND DATE '2023-12-31' AND ena_bruta_res_mwmed IS NOT NULL GROUP
      BY id_subsistema, nom_subsistema, DATE_TRUNC('month', TRY_CAST(ena_data AS DATE)) ORDER BY id_subsistema,
      mes
