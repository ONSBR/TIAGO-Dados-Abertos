version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:ind_confiarb_energianaosuprida
name: ind_confiarb_energianaosuprida
tenant: ons
tags:
- ENS
- ONS
- SIN
- Submódulo 9.1
- confiabilidade
- corte de carga transmissão
- déficit de energia
- energia não fornecida
- energia não suprida
- indicador operacional
- rede básica
- subsistema
- transmissão
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/ind_confiarb_energianaosuprida/*.parquet
  format: parquet
description:
  purpose: Monitorar a confiabilidade do sistema de transmissão da Rede Básica brasileira por meio do
    indicador ENS, permitindo que planejadores do sistema elétrico, reguladores da ANEEL e o próprio ONS
    avaliem o desempenho operacional da rede, subsidiem decisões de expansão e manutenção, e cumpram obrigações
    regulatórias do Submódulo 9.1 dos Procedimentos de Rede.
  limitations: O valor máximo de val_ens é 36. O dataset cobre 2007-01-01 a 2026-03-01 com registros mensais
    e anuais. Registros mensais (id_periodicidade = 'M') e anuais (id_periodicidade = 'A') coexistem no
    dataset.
  usage: Recuperar este dataset quando a pergunta envolver energia não suprida (ENS), confiabilidade da
    Rede Básica de transmissão, indicadores do Submódulo 9.
domain: qualidade
schema:
- name: ind_confiarb_energianaosuprida
  physicalType: parquet
  logicalType: object
  physicalName: ind_confiarb_energianaosuprida
  properties:
  - name: dsc_agregacao
    physicalType: VARCHAR
    logicalType: string
    description: 'Nível geográfico de agregação do indicador ENS. Indica se o registro corresponde ao
      Sistema Interligado Nacional (SIN), a um Subsistema elétrico, a uma Região geográfica ou a um Estado
      brasileiro.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - nível de agregação
      - tipo de agregação
      - agregação geográfica
      - escopo geográfico
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Estado
      - Região Geográfica
      - Sistema
      - Subsistema
  - name: cod_caracteristica
    physicalType: VARCHAR
    logicalType: string
    description: 'Código identificador da entidade geográfica específica dentro do nível de agregação
      indicado por dsc_agregacao. Por exemplo, o código do subsistema (SE, S, NE, N) ou o código do estado
      (sigla UF) ou da região. Para o nível SIN, assume valor único representando o sistema completo.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - código da entidade
      - código do subsistema
      - código do estado
      - código da região
      - cod_subsistema
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - AC
      - AL
      - AM
      - AP
      - BA
      - CE
      - CO
      - DF
      - ES
      - GO
      - MA
      - MG
      - MS
      - MT
      - N
      - NE
      - PA
      - PB
      - PE
      - PI
      - PR
      - RJ
      - RN
      - RO
      - RR
      - RS
      - S
      - SBR
      - SC
      - SE
      - SP
      - TO
  - name: dsc_caracteristica
    physicalType: VARCHAR
    logicalType: string
    description: 'Descrição textual da entidade geográfica identificada por cod_caracteristica. Complementa
      o código com o nome completo da entidade (ex: "Sudeste/Centro-Oeste", "Sul", "Nordeste", "Norte",
      nome do estado, "SIN").

      '
    customProperties:
    - property: aliases
      value:
      - nome da entidade
      - nome do subsistema
      - nome do estado
      - nome da região
      - descrição da característica
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - ACRE
      - ALAGOAS
      - AMAPA
      - AMAZONAS
      - BAHIA
      - CEARA
      - Centro-Oeste
      - DISTRITO FEDERAL
      - ESPIRITO SANTO
      - GOIAS
      - MARANHAO
      - MATO GROSSO
      - MATO GROSSO DO SUL
      - MINAS GERAIS
      - NORDESTE
      - NORTE
      - Nordeste
      - Norte
      - PARA
      - PARAIBA
      - PARANA
      - PERNAMBUCO
      - PIAUI
      - RIO DE JANEIRO
      - RIO GRANDE DO NORTE
      - RIO GRANDE DO SUL
      - RONDONIA
      - RORAIMA
      - SANTA CATARINA
      - SAO PAULO
      - SERGIPE
      - SUDESTE
      - SUL
      - Sistema Brasileiro
      - Sudeste
      - Sul
      - TOCANTINS
  - name: id_periodicidade
    physicalType: VARCHAR
    logicalType: string
    description: 'Identificador da periodicidade do registro. Distingue se o valor de ENS refere-se a
      um período mensal (''M'') ou anual (''A''). Registros anuais são agregações dos mensais e coexistem
      no mesmo dataset. É obrigatório filtrar por este campo antes de qualquer soma ou média de val_ens
      para evitar dupla contagem.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - periodicidade
      - tipo de período
      - frequência
      - mensal ou anual
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - AN
      - ME
  - name: din_referencia
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: 'Data de referência do indicador ENS. Para registros mensais, corresponde ao primeiro
      dia do mês de referência (ex: 2024-01-01 00:00:00). Para registros anuais, corresponde ao primeiro
      dia do ano de referência (ex: 2024-01-01 00:00:00). Cobre o período de janeiro de 2007 a março de
      2026.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - data de referência
      - mês de referência
      - ano de referência
      - data
      - período
      - competência
    - property: semanticType
      value: TIMESTAMP
  - name: val_ens
    physicalType: DOUBLE
    logicalType: number
    description: 'Valor da Energia Não Suprida (ENS) para a entidade geográfica e período de referência
      indicados. Representa a energia que deixou de ser fornecida aos consumidores em decorrência de falhas
      ou indisponibilidades na Rede Básica, conforme Submódulo 9.1 dos Procedimentos de Rede do ONS. Valor
      mínimo observado: 0.0; valor máximo observado: 36.4693 MWh. Ausência de valores nulos.

      '
    customProperties:
    - property: aliases
      value:
      - energia não suprida
      - ENS
      - energia não fornecida
      - déficit de energia
      - corte de carga
      - valor ENS
    - property: semanticType
      value: METRIC
    - property: unit
      value: MWh
  quality:
  - type: custom
    engine: soda
    implementation: "checks for ind_confiarb_energianaosuprida:\n  - row_count > 0:\n      name: Tabela\
      \ não pode estar vazia\n\n  # Referential integrity\n  - invalid_count(dsc_agregacao) = 0:\n   \
      \   valid values:\n        - 'Estado'\n        - 'Região Geográfica'\n        - 'Sistema'\n    \
      \    - 'Subsistema'\n      name: dsc_agregacao deve ser um dos valores válidos\n  - invalid_count(cod_caracteristica)\
      \ = 0:\n      valid values:\n        - 'AC'\n        - 'AL'\n        - 'AM'\n        - 'AP'\n  \
      \      - 'BA'\n        - 'CE'\n        - 'CO'\n        - 'DF'\n        - 'ES'\n        - 'GO'\n\
      \        - 'MA'\n        - 'MG'\n        - 'MS'\n        - 'MT'\n        - 'N'\n        - 'NE'\n\
      \        - 'PA'\n        - 'PB'\n        - 'PE'\n        - 'PI'\n        - 'PR'\n        - 'RJ'\n\
      \        - 'RN'\n        - 'RO'\n        - 'RR'\n        - 'RS'\n        - 'S'\n        - 'SBR'\n\
      \        - 'SC'\n        - 'SE'\n        - 'SP'\n        - 'TO'\n      name: cod_caracteristica\
      \ deve ser um dos valores válidos\n  - invalid_count(dsc_caracteristica) = 0:\n      valid values:\n\
      \        - 'ACRE'\n        - 'ALAGOAS'\n        - 'AMAPA'\n        - 'AMAZONAS'\n        - 'BAHIA'\n\
      \        - 'CEARA'\n        - 'Centro-Oeste'\n        - 'DISTRITO FEDERAL'\n        - 'ESPIRITO\
      \ SANTO'\n        - 'GOIAS'\n        - 'MARANHAO'\n        - 'MATO GROSSO'\n        - 'MATO GROSSO\
      \ DO SUL'\n        - 'MINAS GERAIS'\n        - 'NORDESTE'\n        - 'NORTE'\n        - 'Nordeste'\n\
      \        - 'Norte'\n        - 'PARA'\n        - 'PARAIBA'\n        - 'PARANA'\n        - 'PERNAMBUCO'\n\
      \        - 'PIAUI'\n        - 'RIO DE JANEIRO'\n        - 'RIO GRANDE DO NORTE'\n        - 'RIO\
      \ GRANDE DO SUL'\n        - 'RONDONIA'\n        - 'RORAIMA'\n        - 'SANTA CATARINA'\n      \
      \  - 'SAO PAULO'\n        - 'SERGIPE'\n        - 'SUDESTE'\n        - 'SUL'\n        - 'Sistema\
      \ Brasileiro'\n        - 'Sudeste'\n        - 'Sul'\n        - 'TOCANTINS'\n      name: dsc_caracteristica\
      \ deve ser um dos valores válidos\n  - invalid_count(id_periodicidade) = 0:\n      valid values:\n\
      \        - 'AN'\n        - 'ME'\n      name: id_periodicidade deve ser um dos valores válidos\n\n\
      \  # Baseline de volume — margem ±20% do row_count validado\n  - row_count between 7429 and 11144:\n\
      \      name: Volume esperado entre 7,429 e 11,144 registros\n\n  # Unicidade da chave primária composta\
      \ ['dsc_agregacao', 'cod_caracteristica', 'id_periodicidade', 'din_referencia'] (candidata LLM)\n\
      \  - failed rows:\n      name: Chave composta (dsc_agregacao, cod_caracteristica, id_periodicidade,\
      \ din_referencia) não deve ter duplicatas\n      fail query: |\n        SELECT * FROM ind_confiarb_energianaosuprida\n\
      \        WHERE (dsc_agregacao, cod_caracteristica, id_periodicidade, din_referencia) IN (\n    \
      \      SELECT dsc_agregacao, cod_caracteristica, id_periodicidade, din_referencia FROM ind_confiarb_energianaosuprida\n\
      \          GROUP BY dsc_agregacao, cod_caracteristica, id_periodicidade, din_referencia\n      \
      \    HAVING COUNT(*) > 1\n        )\n\n  # Freshness: din_referencia deve ter dados recentes (SLA:\
      \ Atualizado diariamente)\n  - freshness(din_referencia) < 3d:\n      name: din_referencia não pode\
      \ ter dados com mais de 3 dias de atraso\n"
team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/ind_confiarb_energianaosuprida
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - energia que deixou de ser entregue
  - quanto de energia nao foi suprida
  - ens da rede basica
  - deficit de fornecimento
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver energia não suprida (ENS), confiabilidade da
    Rede Básica de transmissão, indicadores do Submódulo 9.1 dos Procedimentos de Rede do ONS, ou análise
    de desempenho operacional por subsistema, região ou estado. Também relevante quando o analista busca
    quantificar déficits de fornecimento de energia ou avaliar impacto de indisponibilidades na transmissão
    em séries históricas mensais ou anuais.
- property: agentInstructions
  value: '- [val_ens] O valor máximo de val_ens é aproximadamente 36,47 MWh, que pode representar eventos
    extremos de interrupção ou erros de registro. Recomenda-se verificar registros com val_ens acima de
    30 MWh para validar a consistência com eventos históricos conhecidos do sistema elétrico.


    - [din_referencia] O dataset cobre 2007-01-01 a 2026-04-01 e é atualizado com possibilidade de revisão
    retroativa. Podem existir lacunas temporais para determinadas combinações de dsc_agregacao e cod_caracteristica,
    especialmente em períodos anteriores a 2010, ou inconsistências entre registros mensais e anuais para
    o mesmo período.


    - [id_periodicidade] A coluna id_periodicidade distingue registros mensais (''M'') e anuais (''A'').
    Valores fora do domínio esperado indicariam inconsistência de carga. Registros anuais e mensais para
    o mesmo período e entidade podem gerar dupla contagem em agregações inadvertidas sem filtro adequado.


    - [cod_caracteristica] A chave primária natural é composta por dsc_agregacao, cod_caracteristica,
    id_periodicidade e din_referencia. Duplicatas nessa combinação indicariam problema de carga ou revisão
    retroativa não consolidada, dado que o dataset é atualizado com possibilidade de revisão dos dados
    publicados.

    '
- property: typicalQuestions
  value:
  - Qual foi a energia não suprida total do SIN em 2023?
  - Quais subsistemas apresentaram maior ENS nos últimos 5 anos?
  - Como evoluiu a ENS mensal do subsistema Nordeste entre 2015 e 2025?
  - Em quais meses ocorreram os maiores eventos de energia não suprida na Rede Básica?
  - Qual o ranking de estados por ENS acumulada no ano de 2022?
- property: granularity
  value: anual
- property: spatialGranularity
  value: nacional
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_energianaosuprida/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2007-01-01'
- property: semantics
  value:
    temporal_perspective: verificado
    row_grain:
      temporal: 1 ano
      temporal_column: din_referencia
      spatial: nacional
      entity: dataset_row
      one_row_per:
      - din_referencia
      - dsc_agregacao
      - cod_caracteristica
      - id_periodicidade
    dimension_columns:
      subsistema: null
      fonte: null
      usina: null
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: ens
      label: Energia Nao Suprida (ENS)
      columns:
      - val_ens
      expression: val_ens
      quantity_kind: energy
      unit_native: MWh
      default_aggregation: sum
      forbidden_aggregations: []
      valid_intents:
      - ens
      - energia nao suprida
      - ENS
      - energia nao fornecida
      - deficit de energia
      - corte de carga
      aggregation_modes:
        total:
          sql: SUM(val_ens)
          unit: MWh
        average:
          sql: AVG(val_ens)
          unit: MWh
        maximum:
          sql: MAX(val_ens)
          unit: MWh
        time_series:
          sql: SUM(val_ens)
          unit: MWh
        ranking:
          sql: SUM(val_ens)
          unit: MWh
        comparison:
          sql: SUM(val_ens)
          unit: MWh
      interval_hours: 8760.0
      aliases:
      - energia nao suprida
      - ENS
      - energia nao fornecida
      - deficit de energia
      - corte de carga
      - valor ENS
    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: false
      supports_ranking: false
      primary_use_case: serie_temporal
    selection_policy:
      covers_metrics:
      - ens
      preferred_for:
      - energia nao suprida
      - ENS submódulo 9.1
      - deficit fornecimento transmissao
      - indisponibilidade rede basica MWh
      - corte carga rede basica
      - energia interrompida transmissao
      - ENS por estado
      - ENS por subsistema
      - ENS SIN historico
      not_preferred_for:
      - CIPER
      - severidade perturbacao
      - robustez SIN
      - DREQ
      - FREQ
      - indisponibilidade equipamento
      - usina individual
      - geracao nuclear
      - MMGD
      - CEG
      - carga interrompida MW
      exclude_in_aggregation:
      - id_periodicidade: AN
        note: 'Nunca some registros AN e ME do mesmo periodo — registros anuais sao agregacoes dos mensais.
          Sempre filtre id_periodicidade = ''ME'' para series mensais ou id_periodicidade = ''AN'' para
          totais anuais pre-calculados.

          '
      - dsc_agregacao: Sistema
        cod_caracteristica: SBR
        note: 'O registro dsc_agregacao=''Sistema'' / cod_caracteristica=''SBR'' representa o total do
          SIN. Nao some junto com subsistemas ou estados para evitar dupla contagem.

          '
    value_aliases:
      dsc_agregacao:
        Estado:
          aliases:
          - estado
          - UF
          - unidade federativa
          filter: dsc_agregacao = 'Estado'
        Regiao Geografica:
          aliases:
          - regiao geografica
          - regiao
          - macro-regiao
          filter: dsc_agregacao = 'Região Geográfica'
        Sistema:
          aliases:
          - sistema
          - SIN
          - sistema interligado nacional
          - brasil
          - nacional
          filter: dsc_agregacao = 'Sistema'
        Subsistema:
          aliases:
          - subsistema
          - submercado
          filter: dsc_agregacao = 'Subsistema'
      id_periodicidade:
        AN:
          aliases:
          - anual
          - ano
          - AN
          filter: id_periodicidade = 'AN'
        ME:
          aliases:
          - mensal
          - mes
          - ME
          filter: id_periodicidade = 'ME'
      cod_caracteristica:
        SE:
          aliases:
          - sudeste
          - sudeste centro-oeste
          - SE
          filter: cod_caracteristica = 'SE'
        S:
          aliases:
          - sul
          - S
          filter: cod_caracteristica = 'S'
        NE:
          aliases:
          - nordeste
          - NE
          filter: cod_caracteristica = 'NE'
        N:
          aliases:
          - norte
          - N
          filter: cod_caracteristica = 'N'
        SBR:
          aliases:
          - SIN
          - sistema brasileiro
          - brasil
          - nacional
          - SBR
          filter: cod_caracteristica = 'SBR'
    sql_patterns:
      ens_mensal_por_entidade:
        template: "SELECT\n  din_referencia AS mes,\n  cod_caracteristica,\n  dsc_caracteristica,\n  SUM(val_ens)\
          \ AS ens_mwh\nFROM {source}\nWHERE id_periodicidade = 'ME'\n  AND dsc_agregacao = '{dsc_agregacao}'\n\
          \  AND EXTRACT(YEAR FROM TRY_CAST(din_referencia AS TIMESTAMP)) = {year}\nGROUP BY 1, 2, 3\n\
          ORDER BY 1\n"
        output_unit: MWh
        matches:
          output_modes:
          - time_series
          - total
          metrics:
          - ens
          grain: month
        validated_params:
          dsc_agregacao: Estado
          year: '2026'
      ens_anual_sin:
        template: "SELECT\n  EXTRACT(YEAR FROM TRY_CAST(din_referencia AS TIMESTAMP)) AS ano,\n  SUM(val_ens)\
          \ AS ens_mwh\nFROM {source}\nWHERE id_periodicidade = 'AN'\n  AND dsc_agregacao = 'Sistema'\n\
          \  AND cod_caracteristica = 'SBR'\nGROUP BY 1\nORDER BY 1\n"
        output_unit: MWh
        matches:
          output_modes:
          - total
          - time_series
          metrics:
          - ens
          grain: year
      ranking_estados_ens:
        template: "SELECT\n  cod_caracteristica AS uf,\n  dsc_caracteristica AS estado,\n  SUM(val_ens)\
          \ AS ens_mwh\nFROM {source}\nWHERE id_periodicidade = 'ME'\n  AND dsc_agregacao = 'Estado'\n\
          \  AND EXTRACT(YEAR FROM TRY_CAST(din_referencia AS TIMESTAMP)) = {year}\nGROUP BY 1, 2\nORDER\
          \ BY ens_mwh DESC\n"
        output_unit: MWh
        matches:
          output_modes:
          - ranking
          metrics:
          - ens
          grain: year
        validated_params:
          year: '2026'
    ambiguity_policy:
      default_assumptions:
      - when: usuario pergunta ENS sem especificar periodicidade
        assume_metric: ens
        assume_output: total
        assume_filter: id_periodicidade = 'ME'
        note: 'Registros mensais sao a granularidade base. Registros anuais (AN) sao pre-calculados e
          podem ser usados quando o usuario pede explicitamente total anual ou serie anual.

          '
      - when: usuario pergunta ENS do SIN ou Brasil sem especificar agregacao
        assume_metric: ens
        assume_filter: dsc_agregacao = 'Sistema' AND cod_caracteristica = 'SBR'
        note: 'O registro Sistema/SBR representa o total nacional pre-calculado. Preferir este ao inves
          de somar subsistemas.

          '
      must_clarify_when:
      - ambiguity: mensal_vs_anual
        question: Voce quer a serie mensal de ENS ou os totais anuais pre-calculados?
        trigger_terms:
        - total do ano
        - acumulado anual
        - serie historica
        - evolucao anual
        notes: 'Perguntar apenas quando o usuario usa termos que podem indicar tanto soma de mensais quanto
          uso do registro anual pre-calculado (AN). Nao perguntar em consultas claramente mensais ou claramente
          anuais.

          '
      - ambiguity: nivel_geografico
        question: Voce quer ENS por subsistema, por regiao geografica ou por estado?
        trigger_terms:
        - nordeste
        - norte
        - sul
        - centro-oeste
        notes: 'Nordeste/Norte/Sul/Centro-Oeste aparecem tanto como subsistemas quanto como regioes geograficas
          no dataset. Clarificar dsc_agregacao quando ambiguo.

          '
      redirect_when:
      - user_mentions:
        - CIPER
        - carga interrompida
        - MW interrompido
        reason: CIPER mede carga interrompida em MW, nao energia nao suprida em MWh.
        redirect: ind_confiarb_ciper
      - user_mentions:
        - severidade
        - magnitude perturbacao
        reason: Severidade de perturbacoes e metrica de dataset distinto.
        redirect: ind_confiarb_severidade
      - user_mentions:
        - robustez
        reason: Indicador de robustez do SIN e metrica de dataset distinto.
        redirect: ind_confiarb_robustez
      - user_mentions:
        - DREQ
        - FREQ
        - indisponibilidade equipamento
        reason: DREQ/FREQ medem indisponibilidade de equipamentos, nao ENS.
        redirect: ind_confiarb_dreq_freq
      - user_mentions:
        - usina
        - ceg
        - itaipu
        - angra
        reason: Schema nao contem identificador fisico de usina.
        redirect: geracao-usina-2
      - user_mentions:
        - nuclear
        reason: Schema nao contem coluna ou dimensao nuclear separada.
        redirect: geracao-usina-2 com filtro de combustivel/tipo quando disponivel
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Schema nao contem coluna MMGD separada.
        redirect: dataset com coluna val_germmgd/val_ger_mmgd quando disponivel
      - user_mentions:
        - previsao
        - programacao
        - programada
        - prevista
        - dessem
        - pmo
        reason: Este dataset contem apenas dados verificados (realizados) de ENS.
        redirect: dataset de previsao/programacao operativa quando disponivel
- property: fewShotQueries
  value:
  - question: Qual foi a energia não suprida total do Sistema Interligado Nacional por ano?
    sql: SELECT EXTRACT(YEAR FROM TRY_CAST(din_referencia AS TIMESTAMP)) AS ano, SUM(TRY_CAST(val_ens
      AS DOUBLE)) AS ens_total_mwh FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_energianaosuprida/*.parquet')
      WHERE dsc_agregacao = 'SIN' AND id_periodicidade = 'A' GROUP BY EXTRACT(YEAR FROM TRY_CAST(din_referencia
      AS TIMESTAMP)) ORDER BY ano;
  - question: Quais subsistemas acumularam maior energia não suprida nos últimos 5 anos?
    sql: SELECT cod_caracteristica, dsc_caracteristica, SUM(TRY_CAST(val_ens AS DOUBLE)) AS ens_acumulada_mwh,
      COUNT(*) AS meses_com_ens FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_energianaosuprida/*.parquet')
      WHERE dsc_agregacao = 'Subsistema' AND id_periodicidade = 'M' AND din_referencia >= (CURRENT_DATE
      - INTERVAL '5 years') GROUP BY cod_caracteristica, dsc_caracteristica ORDER BY ens_acumulada_mwh
      DESC;
  - question: Como evoluiu a ENS mensal do subsistema Sudeste/Centro-Oeste entre 2020 e 2024?
    sql: SELECT DATE_TRUNC('month', TRY_CAST(din_referencia AS TIMESTAMP)) AS mes_referencia, cod_caracteristica,
      dsc_caracteristica, TRY_CAST(val_ens AS DOUBLE) AS val_ens_mwh FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_energianaosuprida/*.parquet')
      WHERE dsc_agregacao = 'Subsistema' AND cod_caracteristica = 'SE' AND id_periodicidade = 'M' AND
      din_referencia BETWEEN '2020-01-01' AND '2024-12-31' ORDER BY mes_referencia;
