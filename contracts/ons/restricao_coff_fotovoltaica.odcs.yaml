version: 1.1.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:restricao_coff_fotovoltaica
name: restricao_coff_fotovoltaica
tenant: ons
tags:
- ONS
- SIN
- coff fotovoltaico
- constrained-off
- constrained-off fotovoltaico
- constrained-off solar
- corte de geração solar
- curtailment
- curtailment fotovoltaico
- fotovoltaico
- geração renovável
- irradiância
- restrição UFV
- restrição operativa
- solar
- usina fotovoltaica
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/restricao_coff_fotovoltaica_tm/*.parquet
  format: parquet
description:
  purpose: Registrar e disponibilizar as restrições operativas por constrained-off de usinas fotovoltaicas para
    uso pelo ONS, agentes do setor elétrico, CCEE e ANEEL na apuração, auditoria e compensação financeira de curtailment
    de geração solar. Suporta decisões de despacho, análise de curtailment de renováveis, estudos de planejamento
    da expansão da rede de transmissão, monitoramento da integração de fontes fotovoltaicas ao Sistema Interligado
    Nacional (SIN) e cálculo de encargos setoriais por energia não gerada.
  limitations: A chave natural é (din_instante, id_ons). Granularidade temporal de 30 minutos. Cobertura a partir
    de 2024-04-01. Campos cod_razaorestricao, cod_origemrestricao e dsc_restricao ausentes na maior parte dos registros
    (string vazia para cod_razaorestricao e cod_origemrestricao, indicando que IS NOT NULL não os exclui). val_geracaolimitada
    nulo na maior parte das linhas, indicando intervalos sem limitação ativa. val_geracaoreferenciafinal nulo na
    maior parte das linhas, preenchido apenas após conclusão do processo de consistência e apuração definitiva.
    Campos id_pontoconexao, nom_pontoconexao e nom_agenteoperador ausentes em parte dos registros. Dados sujeitos
    a atualização recorrente após publicação. As colunas de apuracao (GNRa, minutos por razao, ponto de conexao,
    agente operador, dsc_restricao) nao existem nos arquivos de 2024-05 a 2024-12 e vem como NULL nesses meses.
  usage: Recuperar este dataset quando a pergunta envolver restrições operativas, curtailment ou corte de geração
    de usinas fotovoltaicas (UFV) no SIN, incluindo análises de volume de energia não gerada, auditoria de compensação
    financeira por constrained-off, comparação entre geração verificada e geração de referência, apuração de geração
    não realizada (GNRa), razão e origem de restrições (REL, CNF, ENE, LOC, SIS), ou análise de minutos de restrição
    por tipo.
domain: geracao
schema:
- name: restricao_coff_fotovoltaica_tm
  physicalType: parquet
  logicalType: object
  physicalName: restricao_coff_fotovoltaica_tm
  properties:
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Identificador do Subsistema elétrico ao qual a usina fotovoltaica pertence. Valores possíveis:
      NE, SE.'
    customProperties:
    - property: aliases
      value:
      - subsistema
      - sistema
      - cod_subsistema
      - regiao
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - NE
      - SE
  - name: nom_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome do Subsistema elétrico. Valores possíveis: NORDESTE, Nordeste, SUDESTE/CENTRO-OESTE, Sudeste/Centro-Oeste.'
    customProperties:
    - property: aliases
      value:
      - nome_subsistema
      - nome_sistema
      - regiao_nome
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - NORDESTE
      - Nordeste
      - SUDESTE/CENTRO-OESTE
      - Sudeste/Centro-Oeste
  - name: id_estado
    physicalType: VARCHAR
    logicalType: string
    description: 'Sigla do Estado onde a usina fotovoltaica está localizada. Valores possíveis: BA, CE, GO, MG,
      MS, PB, PE, PI, RN, SP.'
    customProperties:
    - property: aliases
      value:
      - estado
      - uf
      - sigla_estado
      - cod_estado
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - BA
      - CE
      - GO
      - MG
      - MS
      - PB
      - PE
      - PI
      - RN
      - SP
  - name: nom_estado
    physicalType: VARCHAR
    logicalType: string
    description: Nome do Estado onde a usina fotovoltaica está localizada. Valores possíveis incluem Bahia, Ceará,
      Goiás, Minas Gerais, Mato Grosso do Sul, Paraíba, Pernambuco, Piauí, Rio Grande do Norte, São Paulo (com variações
      de grafia).
    customProperties:
    - property: aliases
      value:
      - nome_estado
      - estado_nome
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - BAHIA
      - Bahia
      - CEARA
      - Ceará
      - Goiás
      - MINAS GERAIS
      - Mato Grosso do Sul
      - Minas Gerais
      - PARAIBA
      - PERNAMBUCO
      - PIAUI
      - Paraíba
      - Pernambuco
      - Piauí
      - RIO GRANDE DO NORTE
      - Rio Grande do Norte
      - SAO PAULO
      - São Paulo
  - name: nom_usina
    physicalType: VARCHAR
    logicalType: string
    description: Nome da Usina ou Conjunto de Usinas fotovoltaicas sujeitas à restrição de constrained-off.
    customProperties:
    - property: aliases
      value:
      - usina
      - nome_usina
      - planta
      - nome_planta
      - ufv
      - conjunto
    - property: semanticType
      value: DIMENSION
  - name: id_ons
    physicalType: VARCHAR
    logicalType: string
    description: Identificador da Usina ou Conjunto no ONS, utilizado como chave de referência no cadastro de agentes
      e usinas.
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - codigo_ons
      - cod_ons
      - id_usina_ons
    - property: semanticType
      value: IDENTIFIER
  - name: ceg
    physicalType: VARCHAR
    logicalType: string
    description: Código Único do Empreendimento de Geração (CEG), estabelecido pela ANEEL. Os Conjuntos de Usinas
      não possuem código CEG, sendo representados por "-".
    customProperties:
    - property: aliases
      value:
      - codigo_ceg
      - ceg_aneel
      - cod_empreendimento
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - '-'
      - UFV.RS.CE.034037-5.01
      - UFV.RS.CE.047255-7.01
      - UFV.RS.PI.046552-6.01
      - UFV.RS.PI.056709-4.01
      - UFV.RS.RN.034184-3.01
  - name: din_instante
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Data/Hora do instante de apuração da restrição de constrained-off, com granularidade de 30 minutos
      (48 patamares por dia).
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - instante
      - data_hora
      - timestamp
      - data_instante
      - momento
      - patamar
    - property: semanticType
      value: TIMESTAMP
  - name: val_geracao
    physicalType: DOUBLE
    logicalType: number
    description: Geração verificada, em MWmed. São considerados conjuntos que possuem pelo menos uma usina em operação
      comercial. Nesses casos, a geração das usinas em operação em teste é considerada. O valor é recebido pelo
      ONS pelo sistema SCADA e pode ser alterado pelo agente em ambiente de pós-operação.
    customProperties:
    - property: aliases
      value:
      - geracao
      - geracao_verificada
      - geracao_realizada
      - potencia_gerada
    - property: semanticType
      value: METRIC
    - property: unit
      value: MWmed
  - name: val_geracaolimitada
    physicalType: DOUBLE
    logicalType: number
    description: Geração limitada. Representa o limite para a geração da usina/conjunto estabelecido pelo ONS em
      Tempo Real, em MWmed. Se o campo for nulo, não houve limitação estabelecida pelo ONS naquele patamar. Se o
      campo for igual a zero, o ONS solicitou que a usina/conjunto permanecesse desligada ou com injeção de potência
      ativa nula.
    customProperties:
    - property: aliases
      value:
      - geracao_limitada
      - limite_geracao
      - curtailment
      - corte_geracao
    - property: semanticType
      value: METRIC
    - property: unit
      value: MWmed
  - name: val_disponibilidade
    physicalType: DOUBLE
    logicalType: number
    description: Disponibilidade Eletromecânica Verificada das usinas em operação comercial, em MWmed. O valor é
      recebido pelo ONS pelo sistema SCADA e pode ser alterado pelo agente em ambiente de pós-operação.
    customProperties:
    - property: aliases
      value:
      - disponibilidade
      - potencia_disponivel
      - capacidade_disponivel
    - property: semanticType
      value: METRIC
    - property: unit
      value: MWmed
  - name: val_geracaoreferencia
    physicalType: DOUBLE
    logicalType: number
    description: Geração de referência (ou estimada), em MWmed. Representa a estimativa de quanto a usina/conjunto
      poderia gerar caso não houvesse limitação de geração, sendo obtida conforme mecanismos estabelecidos na RO-AO.BR.13,
      disponível no MPO.
    customProperties:
    - property: aliases
      value:
      - geracao_referencia
      - referencia
      - geracao_ref
      - baseline
      - geracao_estimada
    - property: semanticType
      value: METRIC
    - property: unit
      value: MWmed
  - name: val_geracaoreferenciafinal
    physicalType: DOUBLE
    logicalType: number
    description: Geração de Referência Final, em MWmed. Considera as regras de apuração estabelecidas na RO-AO.BR.13
      aplicadas na Geração de Referência. O valor é calculado apenas para os patamares em que houve restrição por
      indisponibilidade externa (REL), sendo encaminhado pelo ONS à CCEE para fins de obtenção da geração frustrada
      e cálculo dos ESS por constrained-off.
    customProperties:
    - property: aliases
      value:
      - geracao_referencia_final
      - referencia_final
      - geracao_ref_final
    - property: semanticType
      value: METRIC
    - property: unit
      value: MWmed
  - name: cod_razaorestricao
    physicalType: VARCHAR
    logicalType: string
    description: 'Código da razão da restrição. Valores possíveis: REL (Razão de indisponibilidade externa/elétrica),
      CNF (Razão de atendimento a requisitos de confiabilidade), ENE (Razão energética). Ausente na maior parte
      dos registros (string vazia).'
    customProperties:
    - property: aliases
      value:
      - razao_restricao
      - motivo_restricao
      - tipo_restricao
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - CNF
      - ENE
      - REL
  - name: cod_origemrestricao
    physicalType: VARCHAR
    logicalType: string
    description: 'Código da origem da restrição. Valores possíveis: LOC (Local), SIS (Sistêmica). Ausente na maior
      parte dos registros (string vazia).'
    customProperties:
    - property: aliases
      value:
      - origem_restricao
      - tipo_origem
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - LOC
      - SIS
  - name: dsc_restricao
    physicalType: VARCHAR
    logicalType: string
    description: Detalhamento do motivo da restrição de geração. O campo está disponível a partir de setembro/2025.
      Ausente na maior parte dos registros. Ausente nos arquivos de 2024-05 a 2024-12 (publicados no schema anterior);
      com union_by_name=true vem como NULL nesses meses. Agregados de 2024 nesta coluna cobrem apenas abril; declare
      a cobertura ao responder.
    customProperties:
    - property: aliases
      value:
      - descricao_restricao
      - motivo_detalhado
      - detalhamento
    - property: semanticType
      value: DIMENSION
  - name: id_pontoconexao
    physicalType: VARCHAR
    logicalType: string
    description: Identificador do ponto de conexão da usina ou conjunto de usinas. Ausente em parte dos registros.
      Ausente nos arquivos de 2024-05 a 2024-12 (publicados no schema anterior); com union_by_name=true vem como
      NULL nesses meses. Agregados de 2024 nesta coluna cobrem apenas abril; declare a cobertura ao responder.
    customProperties:
    - property: aliases
      value:
      - ponto_conexao
      - cod_ponto_conexao
    - property: semanticType
      value: IDENTIFIER
  - name: nom_pontoconexao
    physicalType: VARCHAR
    logicalType: string
    description: Nome do ponto de conexão da usina ou conjunto de usinas. Ausente em parte dos registros. Ausente
      nos arquivos de 2024-05 a 2024-12 (publicados no schema anterior); com union_by_name=true vem como NULL nesses
      meses. Agregados de 2024 nesta coluna cobrem apenas abril; declare a cobertura ao responder.
    customProperties:
    - property: aliases
      value:
      - nome_ponto_conexao
      - ponto_conexao_nome
    - property: semanticType
      value: DIMENSION
  - name: nom_agenteoperador
    physicalType: VARCHAR
    logicalType: string
    description: Agente responsável pela operação da usina ou conjunto de usinas. Ausente em parte dos registros.
      Ausente nos arquivos de 2024-05 a 2024-12 (publicados no schema anterior); com union_by_name=true vem como
      NULL nesses meses. Agregados de 2024 nesta coluna cobrem apenas abril; declare a cobertura ao responder.
    customProperties:
    - property: aliases
      value:
      - agente_operador
      - operador
      - agente
    - property: semanticType
      value: DIMENSION
  - name: val_geracaonaorealizadaapurada
    physicalType: DOUBLE
    logicalType: number
    description: Geração Não Realizada Apurada (GNRa). Representa a estimativa de geração frustrada da usina ou
      conjunto de usina, obtida pela diferença entre a geração de referência e a geração verificada (Se menor que
      zero, GNRa = 0), nos períodos em que houve limitação de geração. Ausente nos arquivos de 2024-05 a 2024-12
      (publicados no schema anterior); com union_by_name=true vem como NULL nesses meses. Agregados de 2024 nesta
      coluna cobrem apenas abril; declare a cobertura ao responder.
    customProperties:
    - property: aliases
      value:
      - gnra
      - geracao_nao_realizada
      - energia_nao_gerada
      - geracao_frustrada
    - property: semanticType
      value: METRIC
    - property: unit
      value: MWmed
  - name: num_minutos_rel
    physicalType: BIGINT
    logicalType: integer
    description: Número de minutos em que houve restrição por indisponibilidade externa (REL) no patamar semi-horário
      correspondente. Ausente na maior parte dos registros. Ausente nos arquivos de 2024-05 a 2024-12 (publicados
      no schema anterior); com union_by_name=true vem como NULL nesses meses. Agregados de 2024 nesta coluna cobrem
      apenas abril; declare a cobertura ao responder.
    customProperties:
    - property: aliases
      value:
      - minutos_rel
      - duracao_rel
    - property: semanticType
      value: METRIC
    - property: unit
      value: minutos
  - name: num_minutos_cnf
    physicalType: BIGINT
    logicalType: integer
    description: Número de minutos em que houve restrição por confiabilidade (CNF) no patamar semi-horário correspondente.
      Ausente na maior parte dos registros. Ausente nos arquivos de 2024-05 a 2024-12 (publicados no schema anterior);
      com union_by_name=true vem como NULL nesses meses. Agregados de 2024 nesta coluna cobrem apenas abril; declare
      a cobertura ao responder.
    customProperties:
    - property: aliases
      value:
      - minutos_cnf
      - duracao_cnf
    - property: semanticType
      value: METRIC
    - property: unit
      value: minutos
  - name: num_minutos_ene
    physicalType: BIGINT
    logicalType: integer
    description: Número de minutos em que houve restrição por razão energética (ENE) no patamar semi-horário correspondente.
      Ausente na maior parte dos registros. Ausente nos arquivos de 2024-05 a 2024-12 (publicados no schema anterior);
      com union_by_name=true vem como NULL nesses meses. Agregados de 2024 nesta coluna cobrem apenas abril; declare
      a cobertura ao responder.
    customProperties:
    - property: aliases
      value:
      - minutos_ene
      - duracao_ene
    - property: semanticType
      value: METRIC
    - property: unit
      value: minutos
  - name: num_minutos_restricao
    physicalType: BIGINT
    logicalType: integer
    description: Número de minutos em que houve restrição por qualquer razão no patamar semi-horário correspondente.
      Ausente na maior parte dos registros. Ausente nos arquivos de 2024-05 a 2024-12 (publicados no schema anterior);
      com union_by_name=true vem como NULL nesses meses. Agregados de 2024 nesta coluna cobrem apenas abril; declare
      a cobertura ao responder.
    customProperties:
    - property: aliases
      value:
      - minutos_restricao
      - duracao_restricao
      - minutos_totais
    - property: semanticType
      value: METRIC
    - property: unit
      value: minutos
team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Diariamento, as 12h e 19h
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/restricao_coff_fotovoltaica
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver restrições operativas, curtailment ou corte de geração
    de usinas fotovoltaicas (UFV, solar) no SIN, por usina e intervalo de 30 minutos, incluindo volume de energia
    não gerada, geração limitada, razão e origem da restrição (REL, CNF, ENE), minutos de restrição, auditoria de
    compensação financeira por constrained-off e ranking de usinas ou estados mais afetados por corte solar.
- property: agentInstructions
  value: '- [val_geracaolimitada] A maior parte dos registros possuem val_geracaolimitada nulo, indicando que na
    maioria dos instantes não há limitação de geração aplicada. Filtros sem tratamento de nulo podem subestimar
    o universo de restrições ativas. Ao calcular energia restringida, use COALESCE ou filtre explicitamente por
    IS NOT NULL.


    - [val_geracaoreferenciafinal] A maior parte dos registros possuem val_geracaoreferenciafinal nulo, pois este
    campo é preenchido apenas após a conclusão do processo de consistência e apuração definitiva do ONS. Análises
    de compensação financeira definitiva devem filtrar apenas registros com este campo preenchido.


    - [cod_razaorestricao] A maior parte dos registros possuem cod_razaorestricao como string vazia. IS NOT NULL
    não exclui esses registros. Use cod_razaorestricao != '''' ou cod_razaorestricao IN (''REL'', ''CNF'', ''ENE'')
    para filtrar apenas registros com razão preenchida.


    - [cod_origemrestricao] A maior parte dos registros possuem cod_origemrestricao como string vazia. IS NOT NULL
    não exclui esses registros. Use cod_origemrestricao != '''' ou cod_origemrestricao IN (''LOC'', ''SIS'') para
    filtrar apenas registros com origem preenchida.


    - [dsc_restricao] A maior parte dos registros possuem dsc_restricao nulo ou vazio. A descrição textual é campo
    opcional e seu preenchimento não é sistemático. Análises qualitativas baseadas neste campo cobrem apenas uma
    fração do universo de restrições.


    - [id_pontoconexao] Ausente em parte dos registros. Filtros ou joins baseados neste campo podem excluir usinas
    sem ponto de conexão cadastrado.


    - [nom_pontoconexao] Ausente em parte dos registros. Filtros ou joins baseados neste campo podem excluir usinas
    sem ponto de conexão cadastrado.


    - [nom_agenteoperador] Ausente em parte dos registros. Filtros ou joins baseados neste campo podem excluir usinas
    sem agente operador cadastrado.


    - [num_minutos_rel] Ausente na maior parte dos registros. Preenchido apenas quando há restrição por indisponibilidade
    externa (REL). Use COALESCE(num_minutos_rel, 0) para cálculos de duração total.


    - [num_minutos_cnf] Ausente na maior parte dos registros. Preenchido apenas quando há restrição por confiabilidade
    (CNF). Use COALESCE(num_minutos_cnf, 0) para cálculos de duração total.


    - [num_minutos_ene] Ausente na maior parte dos registros. Preenchido apenas quando há restrição por razão energética
    (ENE). Use COALESCE(num_minutos_ene, 0) para cálculos de duração total.


    - [num_minutos_restricao] Ausente na maior parte dos registros. Preenchido apenas quando há restrição por qualquer
    razão. Use COALESCE(num_minutos_restricao, 0) para cálculos de duração total.


    - [din_instante] O dataset cobre o período a partir de 2024-04-01 com atualização diária às 12h e 19h. Por ser
    um processo de consistência recorrente, podem existir lacunas temporais para usinas específicas ou períodos
    sem restrição registrada. Verificar continuidade por usina é essencial antes de análises de séries temporais.


    - [geral] A chave natural é (din_instante, id_ons). Verificar se existem duplicatas nessa combinação, o que
    indicaria múltiplos registros para a mesma usina no mesmo instante — possível reprocessamento
    de dados históricos sem deduplicação.


    - [cobertura por arquivo] As colunas dsc_restricao, id_pontoconexao, nom_pontoconexao, nom_agenteoperador, val_geracaonaorealizadaapurada
    e num_minutos_rel/cnf/ene/restricao nao existem nos arquivos de 2024-05 a 2024-12 (schema anterior) e vem como
    NULL nesses meses com union_by_name=true. GNRa e minutos de restricao de 2024 cobrem apenas abril; a partir
    de 2025-01 a serie e'' completa. Declare essa cobertura ao agregar 2024.


    - [val_geracaonaorealizadaapurada] GNRa = Geracao Nao Realizada Apurada pelo ONS (referencia - verificada, zero
    se negativa), em MWmed, por patamar de 30 minutos. Energia nao gerada em MWh = SUM(val_geracaonaorealizadaapurada)
    * 0,5 (e /1000 para GWh). NUNCA multiplique GNRa por num_minutos_* ou divida por 60: os minutos sao duracao,
    nao fator de conversao. Para GNRa por razao, agrupe por cod_razaorestricao com a mesma formula.


    - [num_minutos_rel/cnf/ene/restricao] Minutos de restricao dentro do patamar de 30 minutos, por razao (REL/CNF/ENE)
    e total. Use apenas para duracao (SUM em minutos ou /60 em horas). Nao entram no calculo de energia: GNRa e
    geracoes ja sao medias do patamar (MWmed) e convertem para MWh com * 0,5.'
- property: typicalQuestions
  value:
  - Qual foi o volume total de energia cortada por constrained-off em usinas fotovoltaicas do Nordeste em 2025?
  - Quais usinas fotovoltaicas tiveram maior curtailment acumulado no último trimestre?
  - Qual a evolução mensal do constrained-off fotovoltaico por razão de restrição (REL, CNF, ENE)?
  - Top 10 usinas fotovoltaicas que mais sofreram corte no 3º trimestre
  - Curtailment no NE - como variou semana a semana em 2025?
  - Qual estado deixou mais energia sem gerar por restricao em 2025?
  - Taxa media de curtailment das UFV do RJ em jul-ago 2025
  - Qual foi a energia não gerada por constrained-off na usina UFV Bahia em janeiro de 2025?
