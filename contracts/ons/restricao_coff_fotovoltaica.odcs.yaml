    sql_patterns:
      todas_metricas_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  ROUND(AVG(val_geracao),\
          \ 1) AS geracao,\n  ROUND(AVG(val_geracaolimitada), 1) AS geracaolimitada,\n  ROUND(AVG(val_disponibilidade),\
          \ 1) AS disponibilidade,\n  ROUND(AVG(val_geracaoreferencia), 1) AS geracaoreferencia,\n  ROUND(AVG(val_geracaoreferenciafinal),\
          \ 1) AS geracaoreferenciafinal,\n  ROUND(AVG(val_geracaonaorealizadaapurada), 1) AS geracaonaorealizadaapurada\n\
          FROM {source}\nWHERE EXTRACT(YEAR FROM din_instante) = {year}\nGROUP BY 1\nORDER BY 1"
        output_unit: MWmed
        matches:
          output_modes:
          - time_series
          - comparison
          metrics:
          - geracao
          - geracaolimitada
          - disponibilidade
          - geracaoreferencia
          - geracaoreferenciafinal
          - geracaonaorealizadaapurada
          grain: month
        validated_params:
          year: '2026'
      participacao_geracao_por_subsistema:
        template: "WITH totais AS (\n  SELECT id_subsistema,\n    SUM(val_geracao * num_minutos_rel / 60.0) / 1000\
          \ AS valor\n  FROM {source}\n  WHERE EXTRACT(YEAR FROM din_instante) = {year}\n  GROUP BY 1\n),\ntotal_geral\
          \ AS (\n  SELECT SUM(valor) AS total FROM totais\n)\nSELECT t.id_subsistema,\n  ROUND(t.valor, 1) AS valor,\n\
          \  ROUND(100.0 * t.valor / g.total, 1) AS participacao_pct\nFROM totais t\nCROSS JOIN total_geral g\n\
          ORDER BY t.valor DESC"
        output_unit: GWh
        matches:
          output_modes:
          - ranking
          - comparison
          metrics:
          - geracao
          grain: year
        validated_params:
          year: '2026'
      participacao_geracao_por_ons:
        template: "WITH totais AS (\n  SELECT id_ons,\n    SUM(val_geracao * num_minutos_rel / 60.0) / 1000 AS valor\n\
