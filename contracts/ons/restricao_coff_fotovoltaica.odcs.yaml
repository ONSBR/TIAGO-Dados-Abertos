    sql_patterns:
      constrained_off_mensal_subsistema:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  id_subsistema,\n\
          \  SUM(GREATEST(val_geracaoestimada - val_geracaoverificada, 0) * 0.5) / 1000 AS constrained_off_gwh\n\
          FROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP\
          \ BY 1, 2\nORDER BY 1, 2\n"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - constrained_off
          grain: month
        validated_params:
          year: '2026'
      taxa_curtailment_por_usina:
        template: "SELECT\n  nom_usina,\n  id_subsistema,\n  SUM(GREATEST(val_geracaoestimada - val_geracaoverificada,\
          \ 0) * 0.5) / 1000 AS coff_gwh,\n  CASE WHEN SUM(val_geracaoestimada) > 0\n    THEN 100.0 *\
          \ SUM(GREATEST(val_geracaoestimada - val_geracaoverificada, 0)) / SUM(val_geracaoestimada)\n\
          \    ELSE NULL END AS taxa_curtailment_pct\nFROM {source}\nWHERE din_instante BETWEEN '{start_date}'\
          \ AND '{end_date}'\nGROUP BY 1, 2\nORDER BY coff_gwh DESC\n"
        output_unit: GWh e %
        matches:
          output_modes:
          - ranking
          metrics:
          - constrained_off
          - taxa_curtailment
          grain: period
        validated_params:
          start_date: '2026-01-01'
          end_date: '2026-07-18'
      irradiancia_valida_mensal:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  id_subsistema,\n\
          \  AVG(val_irradianciaverificado) AS irradiancia_media_wm2\nFROM {source}\nWHERE flg_dadoirradianciainvalido\
          \ = FALSE\n  AND EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1,\
          \ 2\nORDER BY 1, 2\n"
        output_unit: W/m2
        matches:
          output_modes:
          - time_series
          metrics:
          - irradianciaverificado
          grain: month
        validated_params:
          year: '2026'
      proporcao_invalidos_por_subsistema:
        template: "SELECT\n  id_subsistema,\n  100.0 * SUM(CASE WHEN flg_dadoirradianciainvalido = TRUE\
          \ THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0) AS pct_invalidos\nFROM {source}\nWHERE EXTRACT(YEAR\
          \ FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1\nORDER BY pct_invalidos DESC\n"
        output_unit: '%'
        matches:
          output_modes:
          - ranking
          metrics:
          - proporcao_irradiancia_invalida
          grain: year
        validated_params:
          year: '2026'
      restricao_coff_fotovoltaica_mensal_gwh:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracaoestimada\
          \ AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1) AS val_geracaoestimada_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracaoverificada\
          \ AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1) AS val_geracaoverificada_gwh\nFROM {source}\nWHERE\
          \ EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1\nORDER BY 1"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          grain: month
        validated_params:
          year: '2025'
      restricao_coff_fotovoltaica_mensal_mwmed:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracaoestimada\
          \ AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante AS TIMESTAMP)), 1) AS val_geracaoestimada_mwmed,\n\
          \  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracaoverificada AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT\
          \ TRY_CAST(din_instante AS TIMESTAMP)), 1) AS val_geracaoverificada_mwmed\nFROM {source}\nWHERE\
          \ EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1\nORDER BY 1"
        output_unit: MWmed
        matches:
          output_modes:
          - average_power
          grain: month
        validated_params:
          year: '2025'
    ambiguity_policy:
      default_assumptions:
      - when: curtailment
        assume_metric: constrained_off
        assume_output: total_energy
        assume_unit: GWh
        unless_mentions:
        - percentual
        - taxa
        - proporcao
        - media
        - potencia
      - when: constrained-off
        assume_metric: constrained_off
        assume_output: total_energy
        assume_unit: GWh
        unless_mentions:
        - percentual
        - taxa
        - proporcao
        - media
      - when: energia cortada
        assume_metric: constrained_off
        assume_output: total_energy
        assume_unit: GWh
        unless_mentions:
        - percentual
        - taxa
      - when: geracao solar
        assume_metric: geracaoverificada
        assume_output: total_energy
        assume_unit: GWh
        unless_mentions:
        - estimada
        - potencial
        - sem restricao
        - media
        - potencia
        - pico
      - when: irradiancia
        assume_metric: irradianciaverificado
        assume_output: average
        assume_unit: W/m2
        unless_mentions:
        - total
        - acumulada
      must_clarify_when:
      - ambiguity: geracao_estimada_vs_verificada
        question: 'Voce quer a geracao ESTIMADA (potencial sem restricao, baseada em irradiancia) ou a
          geracao VERIFICADA (efetivamente medida na usina)?

          '
        trigger_terms:
        - geracao fotovoltaica
        - geracao solar
        - producao solar
      - ambiguity: curtailment_absoluto_vs_percentual
        question: 'Voce quer o volume absoluto de energia cortada (GWh) ou a taxa percentual de curtailment
          em relacao ao potencial estimado?

          '
        trigger_terms:
        - curtailment
        - constrained-off
        - corte
      - ambiguity: irradiancia_com_invalidos
        question: 'Deseja incluir ou excluir registros com irradiancia invalida (flg_dadoirradianciainvalido
          = TRUE) na analise?

          '
        trigger_terms:
        - irradiancia media
        - irradiancia total
        - radiacao solar
      redirect_when:
      - user_mentions:
        - nuclear
        - angra
        reason: Dataset cobre exclusivamente usinas fotovoltaicas.
        redirect: geracao-usina-2 com filtro de combustivel nuclear
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Dataset nao contem coluna MMGD nem granularidade de geracao distribuida.
        redirect: dataset com coluna val_germmgd quando disponivel
      - user_mentions:
        - eolica
        - vento
        - curtailment eolico
        - coff eolico
        reason: Para curtailment eolico use o dataset especifico de restricao eolica.
        redirect: restricao_coff_eolica_usi
      - user_mentions:
        - fator de capacidade
        - capacity factor
        reason: Fator de capacidade requer potencia instalada, nao disponivel neste dataset.
        redirect: fator-capacidade-2
      - user_mentions:
        - disponibilidade
        - indisponibilidade
        - manutencao
        reason: Indicadores de disponibilidade estao em datasets especificos de disponibilidade de UGE.
        redirect: ind_disponibilidade_fgeracao_uge_mensal
- property: fewShotQueries
  value:
  - question: Qual foi o total de energia cortada por constrained-off fotovoltaico por subsistema em cada
      mês?
    sql: SELECT id_subsistema, DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, SUM(GREATEST(val_geracaoestimada
      - val_geracaoverificada, 0) * 0.5) AS curtailment_mwh, SUM(val_geracaoestimada * 0.5) AS geracao_estimada_mwh,
      SUM(GREATEST(val_geracaoverificada, 0) * 0.5) AS geracao_verificada_mwh FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_fotovoltaica_detail_tm/*.parquet')
      WHERE flg_dadoirradianciainvalido = false GROUP BY id_subsistema, DATE_TRUNC('month', TRY_CAST(din_instante
      AS TIMESTAMP)) ORDER BY mes DESC, curtailment_mwh DESC;
  - question: Quais são as 20 usinas fotovoltaicas com maior volume de curtailment acumulado no período
      disponível?
    sql: SELECT nom_usina, id_ons, id_subsistema, id_estado, nom_modalidadeoperacao, SUM(GREATEST(val_geracaoestimada
      - val_geracaoverificada, 0) * 0.5) AS curtailment_total_gwh, COUNT(*) AS total_intervalos, SUM((CASE
      WHEN val_geracaoestimada > val_geracaoverificada THEN 1 ELSE 0 END) * 0.5) / 1000 AS intervalos_com_coff
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_fotovoltaica_detail_tm/*.parquet')
      WHERE flg_dadoirradianciainvalido = false GROUP BY nom_usina, id_ons, id_subsistema, id_estado,
      nom_modalidadeoperacao ORDER BY curtailment_total_gwh DESC LIMIT 20;
  - question: Em quais horários do dia ocorre maior concentração de constrained-off fotovoltaico no Nordeste?
    sql: SELECT EXTRACT(HOUR FROM TRY_CAST(din_instante AS TIMESTAMP)) AS hora_dia, EXTRACT(MINUTE FROM
      TRY_CAST(din_instante AS TIMESTAMP)) AS minuto, AVG(GREATEST(val_geracaoestimada - val_geracaoverificada,
      0)) AS curtailment_medio_mw, AVG(val_geracaoestimada) AS geracao_estimada_media_mw, AVG(GREATEST(val_geracaoverificada,
      0)) AS geracao_verificada_media_mw, COUNT(*) AS total_registros FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_fotovoltaica_detail_tm/*.parquet')
      WHERE id_subsistema = 'NE' AND flg_dadoirradianciainvalido = false GROUP BY EXTRACT(HOUR FROM TRY_CAST(din_instante
      AS TIMESTAMP)), EXTRACT(MINUTE FROM TRY_CAST(din_instante AS TIMESTAMP)) ORDER BY hora_dia, minuto;
