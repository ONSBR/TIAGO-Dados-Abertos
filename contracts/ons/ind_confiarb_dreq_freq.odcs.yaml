customProperties:
- property: vectorTags
  value:
  - quanto tempo ficou sem energia
  - quantas interrupcoes houve
  - duracao e frequencia de interrupcao
  - indicador de interrupcao da transmissao
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver indicadores de confiabilidade, duração ou frequência
    de interrupções da rede básica de transmissão do SIN, incluindo análises de desempenho de transmissoras,
    cumprimento de metas regulatórias da ANEEL ou comparações históricas de qualidade do sistema elétrico
    por subsistema, região ou estado. Também relevante para correlações entre confiabilidade e condições
    hidrológicas ou balanço energético.
- property: agentInstructions
  value: '- [id_periodicidade] A coexistência de registros mensais e anuais na mesma tabela para a mesma
    entidade geográfica e período de referência pode gerar dupla contagem em agregações que não filtrem
    explicitamente por id_periodicidade. Consultas de soma de val_dreq ou val_freq sem filtro de periodicidade
    produzirão resultados incorretos, pois valores anuais já incorporam os mensais do mesmo ano.


    - [val_dreq] Valor máximo de val_dreq é ~15.636 horas, muito superior ao número de horas em um ano
    (~8.760h). Isso é esperado para registros anuais de entidades com múltiplos pontos de carga (DREQ
    é ponderado pela carga), mas deve ser validado para garantir que não há erros de cálculo ou registros
    duplicados inflacionando o indicador. Recomenda-se verificar se valores extremos pertencem exclusivamente
    a id_periodicidade anual e a agregações de maior escopo (SIN ou Subsistema).


    - [val_freq] Valor máximo de val_freq é ~11,24 interrupções equivalentes. Embora coerente com indicadores
    de frequência equivalente para períodos anuais, valores acima de 5 interrupções mensais seriam atípicos
    e merecem verificação. Recomenda-se checar se valores elevados ocorrem apenas em registros anuais
    ou se há anomalias em registros mensais específicos.


    - [din_referencia] O período cobre a partir de 2007-01-01. Possíveis lacunas temporais em meses específicos
    para determinadas entidades geográficas podem indicar ausência de dados ou períodos sem interrupções
    não registrados. Recomenda-se verificar a completude da série temporal por entidade geográfica e periodicidade.


    - [cod_caracteristica] Sem dicionário de dados formal disponível no CKAN, os valores de cod_caracteristica
    para diferentes níveis de dsc_agregacao (SIN, Subsistema, Região, Estado) podem usar convenções de
    codificação distintas ou sobrepor códigos entre níveis. É necessário sempre filtrar por dsc_agregacao
    em conjunto com cod_caracteristica para evitar ambiguidade na identificação da entidade geográfica.

    '
- property: typicalQuestions
  value:
  - Qual foi a evolução do DREQ do subsistema Sudeste/Centro-Oeste nos últimos 5 anos?
  - Quais subsistemas apresentaram maior frequência de interrupções (FREQ) em 2023?
  - Como o indicador DREQ anual do SIN variou entre 2010 e 2025?
  - Em quais meses historicamente ocorrem os maiores valores de DREQ por subsistema?
  - Qual o ranking de estados com maior duração equivalente de interrupção em 2022?
- property: granularity
  value: anual
- property: spatialGranularity
  value: nacional
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_dreq_freq/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2007-01-01'
- property: semantics
  value:
    temporal_perspective: verificado
    row_grain:
      temporal: 1 ano
      temporal_column: din_referencia
      spatial: nacional
      entity: dataset_row
      one_row_per:
