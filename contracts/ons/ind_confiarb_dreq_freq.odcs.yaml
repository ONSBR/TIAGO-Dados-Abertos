      fonte: null
      usina: null
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: dreq
      label: Dreq
      columns:
      - val_dreq
      expression: val_dreq
      quantity_kind: numeric
      unit_native: horas
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total:
          sql: SUM(val_dreq)
          unit: horas
        average:
          sql: AVG(val_dreq)
          unit: horas
        maximum:
          sql: MAX(val_dreq)
          unit: horas
        time_series:
          sql: SUM(val_dreq)
          unit: horas
        ranking:
          sql: SUM(val_dreq)
          unit: horas
        comparison:
          sql: SUM(val_dreq)
          unit: horas
      interval_hours: 8760.0
      aliases:
      - DREQ
      - duração equivalente de interrupção
      - duração de interrupção
      - horas de interrupção
      - DEC rede básica
    - id: freq
      label: Freq
      columns:
      - val_freq
      expression: val_freq
      quantity_kind: count
      unit_native: interrupções/período
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total:
          sql: SUM(val_freq)
          unit: interrupções/período
        average:
          sql: AVG(val_freq)
          unit: interrupções/período
        maximum:
          sql: MAX(val_freq)
          unit: interrupções/período
        time_series:
          sql: SUM(val_freq)
          unit: interrupções/período
        ranking:
          sql: SUM(val_freq)
          unit: interrupções/período
        comparison:
          sql: SUM(val_freq)
          unit: interrupções/período
      interval_hours: 8760.0
      aliases:
      - FREQ
      - frequência equivalente de interrupção
      - número de interrupções
      - FEC rede básica
      - frequência de interrupção
    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: false
      supports_ranking: false
      primary_use_case: serie_temporal
    value_aliases:
      dsc_agregacao:
        Estado:
          aliases:
          - estado
          - UF
          - unidade federativa
          filter: dsc_agregacao = 'Estado'
        Região Geográfica:
          aliases:
          - região geográfica
          - regiao geografica
          - região
          - regiao
          filter: dsc_agregacao = 'Região Geográfica'
        Sistema:
          aliases:
          - sistema
          - SIN
          - sistema interligado nacional
          - sistema brasileiro
          filter: dsc_agregacao = 'Sistema'
        Subsistema:
          aliases:
          - subsistema
          - submercado
          filter: dsc_agregacao = 'Subsistema'
      id_periodicidade:
        AN:
          aliases:
          - AN
          - anual
          - ano
          - acumulado anual
          filter: id_periodicidade = 'AN'
        ME:
          aliases:
          - ME
          - mensal
          - mes
          - mês
          - acumulado mensal
          filter: id_periodicidade = 'ME'
      cod_caracteristica:
        SE:
          aliases:
          - SE
          - Sudeste
          - sudeste
          - Sudeste/Centro-Oeste
          - sudeste centro-oeste
          filter: cod_caracteristica = 'SE'
        S:
          aliases:
          - S
          - Sul
          - sul
          filter: cod_caracteristica = 'S'
        NE:
          aliases:
          - NE
          - Nordeste
          - nordeste
          filter: cod_caracteristica = 'NE'
        N:
          aliases:
          - N
          - Norte
          - norte
          filter: cod_caracteristica = 'N'
        SBR:
          aliases:
          - SBR
          - SIN
          - sistema brasileiro
          - sistema interligado
          - Brasil
          - nacional
          filter: cod_caracteristica = 'SBR'
        CO:
          aliases:
          - CO
          - Centro-Oeste
          - centro-oeste
          filter: cod_caracteristica = 'CO'
    sql_patterns:
      dreq_anual_sin:
        template: "SELECT EXTRACT(YEAR FROM TRY_CAST(din_referencia AS TIMESTAMP)) AS ano,\n  SUM(val_dreq)\
          \ AS dreq_total_horas\nFROM {source}\nWHERE id_periodicidade = 'AN'\n  AND cod_caracteristica\
          \ = 'SBR'\nGROUP BY 1\nORDER BY 1\n"
        output_unit: horas
        matches:
          output_modes:
          - total
          - time_series
          metrics:
          - dreq
          grain: year
      dreq_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_referencia AS TIMESTAMP)) AS mes,\n  SUM(val_dreq)\
          \ AS dreq_total_horas\nFROM {source}\nWHERE id_periodicidade = 'ME'\n  AND EXTRACT(YEAR FROM\
          \ TRY_CAST(din_referencia AS TIMESTAMP)) = {year}\nGROUP BY 1\nORDER BY 1\n"
        output_unit: horas
        matches:
          output_modes:
          - total
          - time_series
          metrics:
          - dreq
          grain: month
        validated_params:
          year: '2026'
      freq_ranking_subsistema:
        template: "SELECT cod_caracteristica,\n  dsc_caracteristica,\n  SUM(val_freq) AS freq_total\n\
          FROM {source}\nWHERE id_periodicidade = 'AN'\n  AND dsc_agregacao = 'Subsistema'\n  AND EXTRACT(YEAR\
          \ FROM TRY_CAST(din_referencia AS TIMESTAMP)) = {year}\nGROUP BY 1, 2\nORDER BY freq_total DESC\n"
        output_unit: interrupções/período
        matches:
          output_modes:
          - ranking
          metrics:
          - freq
          grain: year
      dreq_freq_por_estado:
        template: "SELECT cod_caracteristica,\n  dsc_caracteristica,\n  SUM(val_dreq) AS dreq_horas,\n\
          \  SUM(val_freq) AS freq_interrupcoes\nFROM {source}\nWHERE id_periodicidade = 'AN'\n  AND dsc_agregacao\
          \ = 'Estado'\n  AND EXTRACT(YEAR FROM din_referencia) = {year}\nGROUP BY 1, 2\nORDER BY dreq_horas\
          \ DESC\n"
        output_unit: horas / interrupções/período
        matches:
          output_modes:
          - ranking
          - comparison
          metrics:
          - dreq
          - freq
          grain: year
- property: fewShotQueries
  value:
  - question: Como evoluiu o indicador DREQ anual para cada subsistema elétrico entre 2010 e 2025?
    sql: SELECT cod_caracteristica, dsc_caracteristica, YEAR(din_referencia) AS ano, val_dreq FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_dreq_freq/*.parquet')
      WHERE id_periodicidade = 'AN' AND dsc_agregacao = 'Subsistema' AND YEAR(din_referencia) BETWEEN
      2010 AND 2025 ORDER BY cod_caracteristica, ano;
  - question: Quais estados tiveram maior frequência equivalente de interrupção (FREQ) mensal em 2025?
    sql: SELECT cod_caracteristica, dsc_caracteristica, MONTH(din_referencia) AS mes, val_freq FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_dreq_freq/*.parquet')
      WHERE id_periodicidade = 'ME' AND dsc_agregacao = 'Estado' AND YEAR(din_referencia) = 2025 ORDER
      BY val_freq DESC LIMIT 50;
  - question: A soma dos DREQs mensais de 2023 é consistente com o valor anual registrado para o SIN?
    sql: SELECT mensal.cod_caracteristica, mensal.dsc_caracteristica, SUM(mensal.val_dreq) AS soma_dreq_mensal,
      MAX(anual.val_dreq) AS dreq_anual_registrado, MAX(anual.val_dreq) - SUM(mensal.val_dreq) AS diferenca
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_dreq_freq/*.parquet') AS mensal
      INNER JOIN read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_dreq_freq/*.parquet') AS
      anual ON mensal.cod_caracteristica = anual.cod_caracteristica AND mensal.dsc_agregacao = anual.dsc_agregacao
      AND YEAR(mensal.din_referencia) = YEAR(anual.din_referencia) WHERE mensal.id_periodicidade = 'ME'
      AND anual.id_periodicidade = 'AN' AND mensal.dsc_agregacao = 'SIN' AND YEAR(mensal.din_referencia)
      = 2023 GROUP BY mensal.cod_caracteristica, mensal.dsc_caracteristica ORDER BY mensal.cod_caracteristica;
- property: license
  value: CC-BY
