version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:ind_confiarb_dreq_freq
name: ind_confiarb_dreq_freq
tenant: ons
tags:
- DREQ
- FREQ
- SIN
- confiabilidade
- duração equivalente de interrupção
- frequência equivalente de interrupção
- indicadores
- indicadores de confiabilidade
- interrupção de carga
- qualidade
- rede básica
- subsistema
- transmissão
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/ind_confiarb_dreq_freq/*.parquet
  format: parquet
description:
  purpose: Permitir que agentes do setor elétrico, reguladores da ANEEL e o próprio ONS monitorem a qualidade
    e confiabilidade do sistema de transmissão da Rede Básica do SIN ao longo do tempo, suportando decisões
    de planejamento da expansão da transmissão, avaliação de desempenho de empresas transmissoras, cumprimento
    de metas regulatórias e identificação de períodos e regiões com maior incidência de interrupções de
    carga.
  limitations: Valor máximo de val_dreq é ~15. Valor máximo de val_freq é ~11,24 interrupções por período.
    O dataset contém registros mensais e anuais coexistentes (id_periodicidade M e A).
  usage: Recuperar este dataset quando a pergunta envolver indicadores de confiabilidade, duração ou frequência
    de interrupções da rede básica de transmissão do SIN, incluindo análises de desempenho de transmissoras,
    cumprimento de metas regulatórias da ANEEL ou comparações históricas de qualidade do sistema elétrico
    por subsistema, região ou estado.
domain: qualidade
schema:
- name: ind_confiarb_dreq_freq
  physicalType: parquet
  logicalType: object
  physicalName: ind_confiarb_dreq_freq
  properties:
  - name: dsc_agregacao
    physicalType: VARCHAR
    logicalType: string
    description: 'Nível geográfico de agregação dos indicadores. Indica se o registro se refere ao Sistema
      Interligado Nacional (SIN), a um Subsistema elétrico, a uma Região geográfica ou a um Estado brasileiro.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - nível de agregação
      - agregação geográfica
      - nível espacial
      - escopo geográfico
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Estado
      - Região Geográfica
      - Sistema
      - Subsistema
  - name: cod_caracteristica
    physicalType: VARCHAR
    logicalType: string
    description: 'Código identificador da característica geográfica correspondente ao nível de agregação
      definido em dsc_agregacao. Pode representar o código do subsistema (ex: SE, S, NE, N), código de
      região ou sigla de estado.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - código do subsistema
      - código da região
      - código do estado
      - cod_subsistema
      - sigla
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - AC
      - AL
      - AM
      - AP
      - BA
      - CE
      - CO
      - DF
      - ES
      - GO
      - MA
      - MG
      - MS
      - MT
      - N
      - NE
      - PA
      - PB
      - PE
      - PI
      - PR
      - RJ
      - RN
      - RO
      - RR
      - RS
      - S
      - SBR
      - SC
      - SE
      - SP
      - TO
  - name: dsc_caracteristica
    physicalType: VARCHAR
    logicalType: string
    description: 'Descrição textual da característica geográfica identificada por cod_caracteristica.
      Exemplos: nome do subsistema (Sudeste/Centro-Oeste), nome da região geográfica ou nome do estado.

      '
    customProperties:
    - property: aliases
      value:
      - nome do subsistema
      - nome da região
      - nome do estado
      - descrição geográfica
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - ACRE
      - ALAGOAS
      - AMAPA
      - AMAZONAS
      - BAHIA
      - CEARA
      - Centro-Oeste
      - DISTRITO FEDERAL
      - ESPIRITO SANTO
      - GOIAS
      - MARANHAO
      - MATO GROSSO
      - MATO GROSSO DO SUL
      - MINAS GERAIS
      - NORDESTE
      - NORTE
      - Nordeste
      - Norte
      - PARA
      - PARAIBA
      - PARANA
      - PERNAMBUCO
      - PIAUI
      - RIO DE JANEIRO
      - RIO GRANDE DO NORTE
      - RIO GRANDE DO SUL
      - RONDONIA
      - RORAIMA
      - SANTA CATARINA
      - SAO PAULO
      - SERGIPE
      - SUDESTE
      - SUL
      - Sistema Brasileiro
      - Sudeste
      - Sul
      - TOCANTINS
  - name: id_periodicidade
    physicalType: VARCHAR
    logicalType: string
    description: 'Identificador da periodicidade do indicador. Indica se o registro representa um acumulado
      mensal (''M'') ou anual (''A''), conforme padrão ONS.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - periodicidade
      - frequência do indicador
      - mensal
      - anual
      - tipo de período
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - AN
      - ME
  - name: din_referencia
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: 'Data de referência do indicador, sempre no primeiro dia do mês ou do ano. Para registros
      mensais, representa o mês de apuração (ex: 2024-01-01 = janeiro/2024). Para registros anuais, representa
      o ano de apuração (ex: 2024-01-01 = ano 2024). Cobre o período de 2007-01-01 em diante.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - data de referência
      - mês de referência
      - ano de referência
      - competência
      - período
      - dat_referencia
    - property: semanticType
      value: TIMESTAMP
  - name: val_dreq
    physicalType: DOUBLE
    logicalType: number
    description: 'Duração Equivalente de Interrupção de Carga (DREQ) da Rede Básica, em horas. Mede o
      tempo total equivalente de interrupção ponderado pela carga afetada no período de referência, conforme
      Submódulo 9.1 dos Procedimentos de Rede do ONS. Valores anuais do SIN podem atingir ~15.636 horas
      (acumulado ponderado). Valor mínimo é 0,0 (sem interrupções no período).

      '
    customProperties:
    - property: aliases
      value:
      - DREQ
      - duração equivalente de interrupção
      - duração de interrupção
      - horas de interrupção
      - DEC rede básica
    - property: semanticType
      value: METRIC
    - property: unit
      value: horas
  - name: val_freq
    physicalType: DOUBLE
    logicalType: number
    description: 'Frequência Equivalente de Interrupção de Carga (FREQ) da Rede Básica, em número de interrupções
      por período. Mede a quantidade equivalente de interrupções ponderada pela carga afetada no período
      de referência, conforme Submódulo 9.1 dos Procedimentos de Rede do ONS. Valor máximo observado ~11,24.
      Valor mínimo é 0,0.

      '
    customProperties:
    - property: aliases
      value:
      - FREQ
      - frequência equivalente de interrupção
      - número de interrupções
      - FEC rede básica
      - frequência de interrupção
    - property: semanticType
      value: METRIC
    - property: unit
      value: interrupções/período
