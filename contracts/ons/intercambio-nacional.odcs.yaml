- property: agentInstructions
  value: |
    - [val_intercambiomwmed] Coluna armazenada como VARCHAR no Parquet pelo formato de serialização object→UTF8. Contém valores numéricos de ponto flutuante representando MWmed. A coluna nao possui nulos no periodo apurado, mas qualquer operação aritmética ou de agregação direta falhará sem conversão explícita de tipo via TRY_CAST.

    - [val_intercambioprogmwmed] A maior parte dos registros possuem valor nulo nesta coluna. A ausência é sistemática e provavelmente reflete indisponibilidade do campo programado para dados históricos anteriores à implantação do campo ou registros fora do horizonte de programação operacional do ONS.

    - [val_intercambioprogmwmed] Além dos nulos frequentes, a coluna é armazenada como VARCHAR pelo formato de serialização. Os valores não nulos são strings numéricas de ponto flutuante e requerem TRY_CAST para uso em cálculos de desvio entre realizado e programado.

    - [val_intercambiomwmed] Valores negativos são esperados e semanticamente válidos: indicam inversão do sentido real do fluxo em relação ao par origem→destino declarado (o subsistema "origem" está na verdade importando energia do subsistema "destino"). Deve-se verificar se há valores negativos inesperadamente extremos que possam indicar erros de medição.

    - [din_instante] Possíveis lacunas horárias na série temporal a partir de 2023-01-01. Descontinuidades podem indicar falhas de coleta, manutenção do sistema ou períodos sem transmissão entre determinados pares de subsistemas. Deve-se verificar a completude da série para cada par origem→destino.

    - [nom_subsistema_origem] Valores com trailing spaces detectados em 'nom_subsistema_origem'. Use TRIM() em filtros WHERE para evitar perda de registros.
    - [nom_subsistema_destino] Valores com trailing spaces detectados em 'nom_subsistema_destino'. Use TRIM() em filtros WHERE para evitar perda de registros.
    - [val_intercambioprogmwmed] Coluna 'val_intercambioprogmwmed' ausente em arquivos históricos (ex: INTERCAMBIO_NACIONAL_2023.parquet). Presente apenas a partir de versões recentes (ex: INTERCAMBIO_NACIONAL_2026.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [tipos] As colunas `val_intercambiomwmed` mudam de tipo entre arquivos anuais (texto em uns, número em outros); cada uma traz `castExpression` no schema: use-o em toda agregação e comparação.
    - [SALDO LÍQUIDO POR SUBSISTEMA — semântica obrigatória] O dado é um FLUXO COM SINAL por par origem→destino (negativo = sentido invertido; a direção JÁ está no sinal). Saldo líquido de X = SUM(v onde X é origem) − SUM(v onde X é destino), SEMPRE com o valor assinado. PROIBIDO separar por sinal (WHERE v>0 no ramo da origem e v<0 com -SUM no ramo do destino): isso soma só as EXPORTAÇÕES dos dois sentidos, nunca subtrai importação, e TODOS os subsistemas saem "exportadores" — fisicamente impossível (comportamento observado, 13/08/2026). CHEQUE OBRIGATÓRIO antes de afirmar: a soma dos saldos dos 4 subsistemas internos ≈ 0 (soma zero; desvio pequeno = fluxos internacionais do Sul). Padrão validado (2025, motor vivo: NE +6.263,50 / N +2.169,39 / S −2.793,01 / SE −5.639,88 MWmed médios): SELECT subsistema, ROUND(SUM(v_dir)/8760.0,2) AS saldo_medio_mwmed FROM (SELECT id_subsistema_origem AS subsistema, TRY_CAST(val_intercambiomwmed AS DOUBLE) AS v_dir FROM {source} WHERE <periodo> UNION ALL SELECT id_subsistema_destino, -TRY_CAST(val_intercambiomwmed AS DOUBLE) FROM {source} WHERE <periodo>) GROUP BY subsistema. Saldo negativo = importador líquido — preserve e REPORTE o sinal.

    - [UNIDADES do saldo] Dado HORÁRIO em MWmed: média do período → AVG (reporte em MWmed); total de energia → SUM das linhas horárias ≈ MWh (reporte em GWh/TWh). "MWmed-hora" NÃO EXISTE (aconteceu: "58,2 bilhões de MWmed-hora", errado ~1.000×). Cheque de sanidade: média_MWmed × horas_do_período ≈ total_MWh — se não fechar, não afirme.
