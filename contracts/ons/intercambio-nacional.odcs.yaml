apiVersion: v3.1.0
id: urn:ons-opendata:intercambio-nacional
name: intercambio-nacional
tenant: ons
tags:
- MWmed
- Nordeste
- Norte
- SE
- SIN
- Sul
- exportacao importacao subsistema
- fluxo inter-regional
- fluxo-energia
