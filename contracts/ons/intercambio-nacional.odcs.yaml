- property: fewShotQueries
  value:
  - question: Qual foi o intercâmbio médio de energia (MWmed) entre cada par de subsistemas ao longo de
      2024?
    sql: SELECT id_subsistema_origem, nom_subsistema_origem, id_subsistema_destino, nom_subsistema_destino,
      ROUND(AVG(TRY_CAST(val_intercambiomwmed AS DOUBLE)), 2) AS intercambio_medio_mwmed, ROUND(MIN(TRY_CAST(val_intercambiomwmed
      AS DOUBLE)), 2) AS intercambio_minimo_mwmed, ROUND(MAX(TRY_CAST(val_intercambiomwmed AS DOUBLE)),
      2) AS intercambio_maximo_mwmed, COUNT(*) AS total_horas FROM read_parquet('s3://ons-aws-prod-opendata/dataset/intercambio_nacional_ho/*.parquet')
      WHERE din_instante >= '2024-01-01' AND din_instante < '2025-01-01' GROUP BY id_subsistema_origem,
      nom_subsistema_origem, id_subsistema_destino, nom_subsistema_destino ORDER BY intercambio_medio_mwmed
      DESC;
  - question: Qual subsistema foi exportador líquido de energia em cada mês de 2024 e 2025?
    sql: WITH exportacoes AS ( SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,
      id_subsistema_origem AS subsistema, SUM((TRY_CAST(val_intercambiomwmed AS DOUBLE)) * 1.0) / 1000
      AS total_exportado FROM read_parquet('s3://ons-aws-prod-opendata/dataset/intercambio_nacional_ho/*.parquet')
      WHERE din_instante >= '2024-01-01' AND din_instante < '2026-01-01' AND TRY_CAST(val_intercambiomwmed
      AS DOUBLE) > 0 GROUP BY DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)), id_subsistema_origem
      ), importacoes AS ( SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, id_subsistema_destino
      AS subsistema, SUM((TRY_CAST(val_intercambiomwmed AS DOUBLE)) * 1.0) / 1000 AS total_importado FROM
      read_parquet('s3://ons-aws-prod-opendata/dataset/intercambio_nacional_ho/*.parquet') WHERE din_instante
      >= '2024-01-01' AND din_instante < '2026-01-01' AND TRY_CAST(val_intercambiomwmed AS DOUBLE) > 0
      GROUP BY DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)), id_subsistema_destino ) SELECT
      COALESCE(e.mes, i.mes) AS mes, COALESCE(e.subsistema, i.subsistema) AS subsistema, COALESCE(e.total_exportado,
      0) AS total_exportado_mwmed, COALESCE(i.total_importado, 0) AS total_importado_mwmed, COALESCE(e.total_exportado,
      0) - COALESCE(i.total_importado, 0) AS saldo_liquido_mwmed FROM exportacoes e FULL OUTER JOIN importacoes
      i ON e.mes = i.mes AND e.subsistema = i.subsistema ORDER BY mes, saldo_liquido_mwmed DESC;
  - question: Qual o desvio médio entre o intercâmbio realizado e o programado por par de subsistemas?
    sql: SELECT id_subsistema_origem, id_subsistema_destino, COUNT(*) AS horas_com_programado, ROUND(AVG(TRY_CAST(val_intercambiomwmed
      AS DOUBLE)), 2) AS media_realizado_mwmed, ROUND(AVG(TRY_CAST(val_intercambioprogmwmed AS DOUBLE)),
      2) AS media_programado_mwmed, ROUND( AVG( TRY_CAST(val_intercambiomwmed AS DOUBLE) - TRY_CAST(val_intercambioprogmwmed
      AS DOUBLE) ), 2 ) AS desvio_medio_mwmed, ROUND( STDDEV( TRY_CAST(val_intercambiomwmed AS DOUBLE)
      - TRY_CAST(val_intercambioprogmwmed AS DOUBLE) ), 2 ) AS desvio_padrao_mwmed FROM read_parquet('s3://ons-aws-prod-opendata/dataset/intercambio_nacional_ho/*.parquet')
      WHERE val_intercambioprogmwmed IS NOT NULL AND TRY_CAST(val_intercambiomwmed AS DOUBLE) IS NOT NULL
      AND TRY_CAST(val_intercambioprogmwmed AS DOUBLE) IS NOT NULL GROUP BY id_subsistema_origem, id_subsistema_destino
      ORDER BY ABS( AVG( TRY_CAST(val_intercambiomwmed AS DOUBLE) - TRY_CAST(val_intercambioprogmwmed
      AS DOUBLE) ) ) DESC;
