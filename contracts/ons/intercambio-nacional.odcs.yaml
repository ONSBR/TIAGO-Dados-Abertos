status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/intercambio_nacional_ho/*.parquet
  format: parquet
description:
  purpose: Permitir que operadores do ONS, analistas de planejamento energético e agentes do mercado de
    energia monitorem e avaliem os fluxos de energia entre regiões do SIN, suportem decisões de despacho
    inter-regional, verifiquem o cumprimento de programações de intercâmbio e analisem o balanço energético
    entre subsistemas em base horária.
  limitations: Coluna armazenada como VARCHAR no Parquet pelo formato de serialização (dtype object→UTF8).
    val_intercambioprogmwmed tem nulos na maior parte das linhas, indicando que o intercâmbio programado não está disponível para a
    maior parte do período histórico coberto (desde 2023). Além do alto percentual de nulos, a coluna val_intercambioprogmwmed
    é armazenada como VARCHAR pelo formato de serialização.
  usage: Recuperar este dataset quando a pergunta envolver fluxos de energia entre regiões ou subsistemas
    do SIN (SE, S, NE, N), análise de balanço energético inter-regional, despacho entre subsistemas, exportação/importação
    de energia entre regiões, ou comparação entre intercâmbio realizado e programado em base horária.
domain: intercâmbio
schema:
- name: intercambio_nacional
  physicalType: parquet
  logicalType: object
  physicalName: intercambio_nacional
  properties:
  - name: din_instante
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: 'Data e hora do registro de intercâmbio, com granularidade horária. Representa o instante
      de referência da medição do fluxo de potência ativa entre os subsistemas.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - data
      - hora
      - instante
      - timestamp
      - data_hora
      - din_instante
    - property: semanticType
      value: TIMESTAMP
  - name: id_subsistema_origem
    physicalType: VARCHAR
    logicalType: string
    description: 'Identificador/sigla do subsistema elétrico de origem do fluxo de intercâmbio. Representa
      o subsistema que exporta energia para o subsistema destino.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - subsistema_origem
      - origem
      - id_origem
      - sigla_origem
      - subsistema_de
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
  - name: nom_subsistema_origem
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome completo do subsistema elétrico de origem do fluxo de intercâmbio. Complementa
      id_subsistema_origem com a descrição textual do subsistema exportador.

      '
    customProperties:
    - property: aliases
      value:
      - nome_subsistema_origem
      - nome_origem
      - regiao_origem
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - NORDESTE
      - NORTE
      - SUDESTE
      - SUL
  - name: id_subsistema_destino
    physicalType: VARCHAR
    logicalType: string
    description: 'Identificador/sigla do subsistema elétrico de destino do fluxo de intercâmbio. Representa
      o subsistema que recebe energia proveniente do subsistema origem.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - subsistema_destino
      - destino
      - id_destino
      - sigla_destino
      - subsistema_para
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
  - name: nom_subsistema_destino
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome completo do subsistema elétrico de destino do fluxo de intercâmbio. Complementa
      id_subsistema_destino com a descrição textual do subsistema receptor.

      '
    customProperties:
    - property: aliases
      value:
      - nome_subsistema_destino
      - nome_destino
      - regiao_destino
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - NORDESTE
      - NORTE
      - SUDESTE
      - SUL
  - name: val_intercambiomwmed
    physicalType: VARCHAR
    logicalType: string
    description: 'Valor medido do intercâmbio de energia entre o subsistema origem e o subsistema destino,
      expresso em MWmed (megawatts médios). Representa a soma das medidas de fluxo de potência ativa nas
      linhas de transmissão de fronteira entre os subsistemas no intervalo horário. Valores positivos
      indicam fluxo no sentido origem→destino; valores negativos indicam fluxo reverso.

      '
    customProperties:
    - property: aliases
      value:
      - intercambio
      - val_intercambio
      - fluxo
      - potencia_intercambio
      - intercambio_mwmed
      - energia_intercambiada
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_intercambiomwmed AS DOUBLE)
    - property: unit
      value: MWmed
  - name: val_intercambioprogmwmed
    physicalType: VARCHAR
    logicalType: string
    description: 'Valor programado do intercâmbio de energia entre o subsistema origem e o subsistema
      destino, expresso em MWmed. Representa o intercâmbio previsto/programado pelo ONS para o intervalo
      horário, permitindo comparação entre o realizado e o programado. Possui nulos na maior parte das linhas, indicando
      disponibilidade restrita — possivelmente preenchido apenas para períodos mais recentes ou para horizontes
      futuros de programação. Armazenado como VARCHAR no Parquet pelo formato de serialização.

      '
    customProperties:
    - property: availableFrom
      value: '2026'
    - property: coverageNote
      value: Coluna ausente nos arquivos anteriores a 2026 (1 de 4 periodos da serie, que comeca em 2023). Como a fonte e' lida com union_by_name, consulta que inclua periodo anterior recebe NULL e nao erro, e AVG/SUM ignoram nulo - filtre o periodo ou declare a cobertura na resposta. Apurado em 2026-09-07.
    - property: aliases
      value:
      - intercambio_programado
      - val_programado
      - programado_mwmed
      - intercambio_prog
      - desvio_programacao
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_intercambioprogmwmed AS DOUBLE)
    - property: unit
      value: MWmed
