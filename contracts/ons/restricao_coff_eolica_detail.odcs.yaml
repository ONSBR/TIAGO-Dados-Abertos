version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:restricao_coff_eolica_detail
name: restricao_coff_eolica_detail
tenant: ons
tags:
- 30min
- ONS
- SIN
- coff eólico detalhe
- constrained-off
- constrained-off eólico
- constrained-off eólico por usina
- corte de geração eólica
- curtailment
- curtailment eólico 30min
- eólica
- geração-eólica
- por-usina
- restrição eólica detalhada
- restrição-operativa
- semi-horário
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_detail_tm/*.parquet
  format: parquet
description:
  purpose: Registrar e disponibilizar o detalhamento por usina individual das restrições de geração eólica
    por constrained-off, permitindo que operadores do ONS, agentes do setor elétrico, auditores da CCEE
    e pesquisadores calculem a energia curtailed por usina, apurem compensações financeiras regulatórias,
    monitorem a qualidade dos dados de vento e analisem o impacto operativo do curtailment eólico no SIN.
    Suporta decisões de despacho, auditoria de restrições e estudos de planejamento da expansão eólica.
  limitations: 'Valor máximo de 297,529 m/s é fisicamente impossível para velocidade do vento em operação
    de turbinas eólicas (limite operacional típico: 25 m/s). val_geracaoestimada possui poucos nulos.'
  usage: Recuperar este dataset quando a pergunta envolver restrições de geração eólica por constrained-off
    com detalhamento por usina individual, cálculo de energia curtailed (diferença entre geração estimada
    e verificada), análise de velocidade do vento em períodos de restrição, ou auditoria de modalidades
    operativas (Tipo I, Tipo II-B, Tipo II-C) em granularidade semi-horária.
domain: geração
schema:
- name: restricao_coff_eolica_detail
  physicalType: parquet
  logicalType: object
  physicalName: restricao_coff_eolica_detail
  properties:
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Identificador do subsistema elétrico ao qual a usina eólica pertence (ex: NE, SE, S,
      N)'
    customProperties:
    - property: aliases
      value:
      - subsistema
      - sistema
      - região elétrica
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
  - name: id_estado
    physicalType: VARCHAR
    logicalType: string
    description: Sigla do estado brasileiro onde a usina eólica está localizada
    customProperties:
    - property: aliases
      value:
      - estado
      - UF
      - unidade federativa
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - BA
      - CE
      - MA
      - PB
      - PE
      - PI
      - RN
      - RS
      - SC
  - name: nom_modalidadeoperacao
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome da modalidade de operação de constrained-off à qual a usina está classificada.
      Valores possíveis: Tipo I (restrição por congestionamento de rede), Tipo II-B e Tipo II-C (restrições
      por outros critérios operativos definidos pelo ONS).

      '
    customProperties:
    - property: aliases
      value:
      - modalidade
      - tipo de constrained-off
      - modalidade operação
      - tipo operação
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Tipo I
      - Tipo II-B
      - Tipo II-C
  - name: nom_conjuntousina
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome do conjunto (agrupamento) de usinas ao qual a usina individual pertence. Representa
      o complexo eólico ou grupo operativo de referência para fins de apuração do constrained-off.

      '
    customProperties:
    - property: aliases
      value:
      - conjunto
      - complexo eólico
      - grupo de usinas
      - conjunto de usinas
    - property: semanticType
      value: DIMENSION
  - name: nom_usina
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome da usina eólica individual conforme cadastro do ONS. Identifica a unidade geradora
      específica dentro do conjunto/complexo eólico.

      '
    customProperties:
    - property: aliases
      value:
      - usina
      - nome da usina
      - usina eólica
      - planta eólica
    - property: semanticType
      value: DIMENSION
  - name: id_ons
    physicalType: VARCHAR
    logicalType: string
    description: 'Código identificador da usina no cadastro do ONS. Chave de referência para joins com
      datasets de cadastro de usinas e outros datasets operativos do ONS.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - código ONS
      - id ONS
      - código da usina
      - identificador ONS
    - property: semanticType
      value: IDENTIFIER
  - name: ceg
    physicalType: VARCHAR
    logicalType: string
    description: 'Código de Empreendimento de Geração (CEG) da ANEEL. Identificador único do empreendimento
      gerador no cadastro regulatório. Permite join com bases da ANEEL e outros datasets do setor.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - CEG
      - código ANEEL
      - código empreendimento
      - código de geração
    - property: semanticType
      value: IDENTIFIER
  - name: din_instante
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: 'Data e hora do instante de medição/apuração da restrição de constrained-off, com granularidade
      de 30 minutos. Cada registro representa um intervalo de meia hora para a usina identificada. Cobre
      o período de 2023-01-01 em diante.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - instante
      - data hora
      - timestamp
      - data e hora
      - intervalo
      - meia hora
    - property: semanticType
      value: TIMESTAMP
  - name: val_ventoverificado
    physicalType: DOUBLE
    logicalType: number
    description: 'Velocidade do vento verificada (medida) na usina eólica no instante de apuração, em
      metros por segundo (m/s). Valores extremos (ex: 297,529 m/s) indicam dados inválidos, devendo ser
      filtrados pelo flag flg_dadoventoinvalido=1.

      '
    customProperties:
    - property: aliases
      value:
      - vento
      - velocidade do vento
      - vento verificado
      - velocidade vento medida
    - property: semanticType
      value: METRIC
    - property: unit
      value: m/s
  - name: flg_dadoventoinvalido
    physicalType: DOUBLE
    logicalType: number
    description: 'Flag binária indicando a qualidade do dado de velocidade do vento. Valor 0 indica dado
      de vento válido; valor 1 indica dado de vento inválido ou indisponível. Deve ser usado como filtro
      ao analisar val_ventoverificado.

      '
    customProperties:
    - property: aliases
      value:
      - flag vento inválido
      - dado vento inválido
      - qualidade vento
      - flag qualidade vento
    - property: semanticType
      value: FLAG
    - property: enum
      value:
      - 0.0
      - 1.0
  - name: val_geracaoestimada
    physicalType: DOUBLE
    logicalType: number
    description: 'Geração eólica estimada para a usina no instante de apuração, em megawatts (MW). Representa
      a geração que a usina poderia ter produzido na ausência da restrição de constrained-off, calculada
      com base na velocidade do vento e curva de potência. Possui poucos nulos, possivelmente
      em períodos sem estimativa disponível.

      '
    customProperties:
    - property: aliases
      value:
      - geração estimada
      - geração potencial
      - potência estimada
      - geração sem restrição
    - property: semanticType
      value: METRIC
    - property: unit
      value: MW
  - name: val_geracaoverificada
    physicalType: DOUBLE
    logicalType: number
    description: 'Geração eólica verificada (medida) da usina no instante de apuração, em megawatts (MW).
      Representa a geração efetivamente realizada durante o período de constrained-off. Máximo observado
      de 150 MW, consistente com capacidade de usinas eólicas individuais.

      '
    customProperties:
    - property: aliases
      value:
      - geração verificada
      - geração realizada
      - geração medida
      - potência verificada
      - geração efetiva
    - property: semanticType
      value: METRIC
    - property: unit
      value: MW
