    sql_patterns:
      curtailment_mensal_subsistema:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  id_subsistema,\n\
          \  SUM((val_geracaoestimada - val_geracaoverificada) * 0.5) / 1000 AS energia_curtailed_gwh\nFROM {source}\n\
          WHERE val_geracaoestimada IS NOT NULL\n  AND EXTRACT(YEAR FROM din_instante) = {year}\nGROUP BY 1, 2\n\
          ORDER BY 1, 2"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - energia_curtailed
          grain: month
        validated_params:
          year: '2023'
      vento_medio_usina:
        template: "SELECT\n  nom_usina,\n  AVG(val_ventoverificado) AS vento_medio_ms\nFROM {source}\nWHERE flg_dadoventoinvalido\
          \ = 0.0\n  AND din_instante BETWEEN '{start}' AND '{end}'\nGROUP BY 1\nORDER BY 2 DESC"
        output_unit: m/s
        matches:
          output_modes:
          - average
          metrics:
          - ventoverificado
          grain: period
        validated_params:
          start: '2023-01-01 00:00:00'
          end: '2023-01-03 09:30:00'
      curtailment_por_modalidade:
        template: "SELECT\n  nom_modalidadeoperacao,\n  SUM((val_geracaoestimada - val_geracaoverificada) * 0.5)\
          \ / 1000 AS energia_curtailed_gwh\nFROM {source}\nWHERE val_geracaoestimada IS NOT NULL\n  AND din_instante\
          \ BETWEEN '{start}' AND '{end}'\nGROUP BY 1\nORDER BY 2 DESC"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - energia_curtailed
          grain: period
        validated_params:
          start: '2023-01-01 00:00:00'
          end: '2023-01-03 09:30:00'
      curtailment_por_conjunto:
        template: "SELECT\n  nom_conjuntousina,\n  SUM((val_geracaoestimada - val_geracaoverificada) * 0.5) / 1000\
          \ AS energia_curtailed_gwh\nFROM {source}\nWHERE val_geracaoestimada IS NOT NULL\n  AND din_instante BETWEEN\
          \ '{start}' AND '{end}'\nGROUP BY 1\nORDER BY 2 DESC"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - energia_curtailed
          grain: period
        validated_params:
          start: '2023-01-01 00:00:00'
          end: '2023-01-03 09:30:00'
- property: fewShotQueries
  value:
  - question: Qual foi o total de energia cortada (MWh) por subsistema e modalidade de constrained-off em janeiro
      de 2024?
    sql: SELECT id_subsistema, nom_modalidadeoperacao, SUM((COALESCE(val_geracaoestimada, 0.0) - val_geracaoverificada)
      * 1.0) * 0.5 AS energia_cortada_mwh, COUNT(*) AS num_intervalos, COUNT(DISTINCT id_ons) AS num_usinas FROM
      read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_detail_tm/*.parquet') WHERE din_instante
      >= '2024-01-01' AND din_instante < '2024-02-01' AND val_geracaoestimada IS NOT NULL GROUP BY id_subsistema,
      nom_modalidadeoperacao ORDER BY energia_cortada_mwh DESC
  - question: Quais foram as 20 usinas eólicas com maior volume de energia cortada por constrained-off em 2024?
    sql: SELECT id_ons, nom_usina, nom_conjuntousina, id_subsistema, id_estado, nom_modalidadeoperacao, SUM((COALESCE(val_geracaoestimada,
      0.0) - val_geracaoverificada) * 0.5) / 1000 * 0.5 AS energia_cortada_gwh, COUNT(*) AS num_intervalos_restringidos,
      AVG(val_geracaoestimada) AS media_geracao_estimada_mw, AVG(val_geracaoverificada) AS media_geracao_verificada_mw
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_detail_tm/*.parquet') WHERE din_instante
      >= '2024-01-01' AND din_instante < '2025-01-01' AND val_geracaoestimada IS NOT NULL GROUP BY id_ons, nom_usina,
      nom_conjuntousina, id_subsistema, id_estado, nom_modalidadeoperacao ORDER BY energia_cortada_gwh DESC LIMIT
      20
  - question: Em quais usinas e períodos o dado de vento foi marcado como inválido e qual o impacto na geração estimada?
    sql: SELECT id_ons, nom_usina, id_subsistema, DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes_referencia,
      COUNT(*) AS total_intervalos, SUM(CASE WHEN flg_dadoventoinvalido = 1.0 THEN 1 ELSE 0 END) AS intervalos_vento_invalido,
      ROUND(100.0 * SUM(CASE WHEN flg_dadoventoinvalido = 1.0 THEN 1 ELSE 0 END) / COUNT(*), 2) AS pct_vento_invalido,
      AVG(CASE WHEN flg_dadoventoinvalido = 1.0 THEN val_geracaoestimada END) AS media_estimada_vento_invalido,
      AVG(CASE WHEN flg_dadoventoinvalido = 0.0 THEN val_geracaoestimada END) AS media_estimada_vento_valido FROM
      read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_detail_tm/*.parquet') WHERE din_instante
      >= '2024-01-01' AND din_instante < '2025-01-01' GROUP BY id_ons, nom_usina, id_subsistema, DATE_TRUNC('month',
      TRY_CAST(din_instante AS TIMESTAMP)) HAVING SUM(CASE WHEN flg_dadoventoinvalido = 1.0 THEN 1 ELSE 0 END) >
      0 ORDER BY pct_vento_invalido DESC LIMIT 50
  - question: Quantos patamares com restrição ativa (flg_geracaorestrita = 1) cada usina teve em agosto de 2026?
    sql: SELECT nom_usina, COUNT(*) AS patamares_com_restricao FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_detail_tm/*.parquet',
      union_by_name=true) WHERE flg_geracaorestrita = 1 AND din_instante >= '2026-08-01' AND din_instante < '2026-09-01'
      GROUP BY nom_usina ORDER BY patamares_com_restricao DESC LIMIT 20
