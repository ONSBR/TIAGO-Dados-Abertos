      - limite_geracao
      - curtailment
      - corte_geracao
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_geracaolimitada AS DOUBLE)
    - property: unit
      value: MW
  - name: val_disponibilidade
    physicalType: VARCHAR
    logicalType: string
    description: Potência disponível da usina eólica no intervalo, representando a capacidade de geração
      declarada antes da restrição. Armazenada como VARCHAR pelo formato de serialização.
    customProperties:
    - property: aliases
      value:
      - disponibilidade
      - potencia_disponivel
      - capacidade_disponivel
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_disponibilidade AS DOUBLE)
    - property: unit
      value: MW
  - name: val_geracaoreferencia
    physicalType: VARCHAR
    logicalType: string
    description: Geração de referência utilizada como base para cálculo da energia não gerada por constrained-off,
      conforme metodologia ONS. Armazenada como VARCHAR pelo formato de serialização.
    customProperties:
    - property: aliases
      value:
      - geracao_referencia
      - referencia
      - geracao_ref
      - baseline
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_geracaoreferencia AS DOUBLE)
    - property: unit
      value: MW
  - name: val_geracaoreferenciafinal
    physicalType: VARCHAR
    logicalType: string
    description: Geração de referência final após consolidação do processo de apuração de constrained-off;
      nulo quando o cálculo final ainda não foi realizado ou não se aplica (48,9% de nulos). Armazenada
      como VARCHAR pelo formato de serialização.
    customProperties:
    - property: aliases
      value:
      - geracao_referencia_final
      - referencia_final
      - geracao_ref_final
      - baseline_final
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_geracaoreferenciafinal AS DOUBLE)
    - property: unit
      value: MW
  - name: cod_razaorestricao
    physicalType: VARCHAR
    logicalType: string
    description: 'Código que classifica a razão/motivo da restrição de constrained-off aplicada à usina
      (ex: restrição de rede, desequilíbrio de carga)'
    primaryKey: true
    customProperties:
