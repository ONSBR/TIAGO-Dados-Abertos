      - MA
      - PB
      - PE
      - PI
      - RN
      - RS
      - SC
  - name: nom_estado
    physicalType: VARCHAR
    logicalType: string
    description: Nome por extenso do estado federativo onde a usina eólica está localizada
    customProperties:
    - property: aliases
      value:
      - nome_estado
      - estado_nome
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - BAHIA
      - CEARA
      - MARANHAO
      - PARAIBA
      - PERNAMBUCO
      - PIAUI
      - RIO GRANDE DO NORTE
      - RIO GRANDE DO SUL
