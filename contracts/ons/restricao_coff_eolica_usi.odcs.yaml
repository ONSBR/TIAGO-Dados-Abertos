      geracaoreferenciafinal_mensal_mwmed:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, id_subsistema,\n  AVG(val_geracaoreferenciafinal)\
          \ AS valor\nFROM {source}\nWHERE EXTRACT(YEAR FROM din_instante) = {year}\nGROUP BY 1, 2\nORDER BY 1,\
          \ 2"
        output_unit: MWmed
        matches:
          output_modes:
          - average_power
          metrics:
          - geracaoreferenciafinal
          grain: month
        validated_params:
          year: '2026'
      gnra_por_razao_mensal:
        template: "SELECT DATE_TRUNC('month', din_instante) AS mes, cod_razaorestricao AS razao,\n  ROUND(SUM(val_geracaonaorealizadaapurada)\
          \ * 0.5 / 1000, 3) AS gnra_gwh,\n  SUM(num_minutos_restricao) AS minutos_restricao\nFROM {source}\nWHERE\
          \ EXTRACT(YEAR FROM din_instante) = {year}\n  AND val_geracaonaorealizadaapurada IS NOT NULL\nGROUP BY\
          \ 1, 2\nORDER BY 1, 2"
        output_unit: GWh
