    - property: aliases
      value:
      - subsistema
      - sistema
      - cod_subsistema
      - regiao
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
  - name: nom_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome por extenso do subsistema elétrico (ex: Sudeste, Sul, Nordeste, Norte)'
