  - name: val_geracaoreferenciafinal
    physicalType: VARCHAR
    logicalType: string
    description: Geração de referência final após consolidação do processo de apuração de constrained-off;
      nulo quando o cálculo final ainda não foi realizado ou não se aplica (nulos em quase todas as linhas). Armazenada
      como VARCHAR pelo formato de serialização.
    customProperties:
