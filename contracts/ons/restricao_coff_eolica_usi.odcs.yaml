servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/restricao_coff_fotovoltaica_tm/*.parquet
  format: parquet
description:
  purpose: Suporta a apuração de compensações financeiras por energia não gerada, o monitoramento operacional de
    curtailment eólico e a análise de causas de restrição de geração renovável no SIN. É utilizado por agentes do
    setor elétrico, reguladores da ANEEL, o próprio ONS e pesquisadores para calcular energia não gerada por usina
    e intervalo, auditar eventos de constrained-off, subsidiar decisões de redespacho e avaliar o impacto sistêmico
    das restrições de rede sobre a geração eólica.
  limitations: 'A maior parte dos registros possui val_geracaolimitada, cod_razaorestricao, cod_origemrestricao,
    val_geracaonaorealizadaapurada e num_minutos_* nulos ou vazios: sao preenchidos apenas nos patamares em que
    houve limitacao de geracao. val_geracaoreferenciafinal e'' preenchida so apos a apuracao definitiva do ONS.
    Os dados fazem parte de um processo de consistencia recorrente e podem ser atualizados apos a publicacao.'
  usage: Recuperar este dataset quando a pergunta envolver restrições de geração eólica, curtailment de usinas eólicas,
    energia não gerada por constrained-off, apuração de compensações financeiras por restrição operacional ou análise
    de causas de limitação de geração renovável no SIN.
domain: geração
schema:
- name: restricao_coff_eolica_usi
  physicalType: parquet
  logicalType: object
  physicalName: restricao_coff_eolica_usi
  properties:
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: Identificador do Subsistema
    customProperties:
    - property: aliases
      value:
      - subsistema
      - sistema
      - cod_subsistema
      - regiao
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
  - name: nom_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: Nome do Subsistema
    customProperties:
    - property: aliases
      value:
      - nome_subsistema
      - nome_sistema
      - regiao_nome
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Nordeste
      - Norte
      - Sudeste/Centro-Oeste
      - Sul
  - name: id_estado
    physicalType: VARCHAR
    logicalType: string
    description: Sigla do Estado
    customProperties:
    - property: aliases
      value:
      - estado
      - uf
      - sigla_estado
      - cod_estado
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - BA
      - CE
      - MA
      - MG
      - PB
      - PE
      - PI
      - RN
      - RS
      - SC
  - name: nom_estado
    physicalType: VARCHAR
    logicalType: string
    description: Nome do Estado
    customProperties:
    - property: aliases
      value:
      - nome_estado
      - estado_nome
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Bahia
      - Ceará
      - Maranhão
      - Minas Gerais
      - Paraíba
      - Pernambuco
      - Piauí
      - Rio Grande do Norte
      - Rio Grande do Sul
      - Santa Catarina
  - name: nom_usina
    physicalType: VARCHAR
    logicalType: string
    description: Nome da Usina ou Conjunto de Usinas
    customProperties:
    - property: aliases
      value:
      - usina
      - nome_usina
      - planta
      - nome_planta
      - eolica
      - parque eolico
      - conjunto
    - property: semanticType
      value: DIMENSION
  - name: id_ons
    physicalType: VARCHAR
    logicalType: string
    description: Identificador da Usina ou do Conjunto de Usinas no ONS
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - codigo_ons
      - cod_ons
      - id_usina_ons
    - property: semanticType
      value: IDENTIFIER
  - name: ceg
    physicalType: VARCHAR
    logicalType: string
    description: Código Único do Empreendimento de Geração (CEG), estabelecido pela ANEEL.Os Conjuntos de Usinas
      não possuem código CEG, sendo representados por “-“
    customProperties:
    - property: aliases
      value:
      - codigo_ceg
      - ceg_aneel
      - cod_empreendimento
    - property: semanticType
      value: IDENTIFIER
  - name: din_instante
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Data/Hora
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - instante
      - data_hora
      - timestamp
      - data_instante
      - momento
      - patamar
    - property: semanticType
      value: TIMESTAMP
  - name: val_geracao
    physicalType: DOUBLE
    logicalType: number
    description: Geração verificada, em MWmed. São considerados conjuntos que possuem pelo menos uma usina em operação
      comercial. Nesses casos, a geração das usinas em operação em teste é considerada. O valor é recebido pelo
      ONS pelo sistema SCADA e pode ser alterado pelo agente em ambiente de pós-operação.
    customProperties:
    - property: aliases
      value:
      - geracao
      - geracao_verificada
      - geracao_realizada
      - potencia_gerada
    - property: semanticType
      value: METRIC
    - property: unit
      value: MWmed
  - name: val_geracaolimitada
    physicalType: DOUBLE
    logicalType: number
    description: Geração limitada. Representa o limite para a geração da usina/conjunto estabelecido pelo ONS em
      Tempo Real, em MWmed. Se o campo for nulo, não houve limitação estabelecida pelo ONS naquele patamar. Se o
      campo for igual a zero, o ONS solicitou que a usina/conjunto permanecesse desligada ou com injeção de potência
      ativa nula.
    customProperties:
    - property: aliases
      value:
      - geracao_limitada
      - limite_geracao
      - curtailment
      - corte_geracao
    - property: semanticType
      value: METRIC
    - property: unit
      value: MWmed
  - name: val_disponibilidade
    physicalType: DOUBLE
    logicalType: number
    description: Disponibilidade Eletromecâmica Verificada das usinas em operação comercial, em MWmed. O valor é
      recebido pelo ONS pelo sistema SCADA e pode ser alterado pelo agente em ambiente de pós-operação.
    customProperties:
    - property: aliases
      value:
      - disponibilidade
      - potencia_disponivel
      - capacidade_disponivel
    - property: semanticType
      value: METRIC
    - property: unit
      value: MWmed
  - name: val_geracaoreferencia
    physicalType: DOUBLE
    logicalType: number
    description: Geração de referência (ou estimada), em MWmed. Representa a estimativa de quanto a usina/conjunto
      poderia gerar caso não houvesse limitação de geração, sendo obtida conforme mecanismos estabelecidos na RO-AO.BR.13,
      disponível no MPO.
    customProperties:
    - property: aliases
      value:
      - geracao_referencia
      - referencia
      - geracao_ref
      - baseline
      - geracao_estimada
    - property: semanticType
      value: METRIC
    - property: unit
      value: MWmed
  - name: val_geracaoreferenciafinal
    physicalType: DOUBLE
    logicalType: number
    description: Geração de Referência Final, em MWmed. Considera as regras de apuração estabelecidas na RO-AO.BR.13
      aplicadas na Geração de Referência. O valor é calculado apenas para os patamares em que houve restrição por
      indisponibilidade externa (REL), sendo encaminhado pelo ONS à CCEE para fins de obtenção da geração frustrada
      e cálculo dos ESS por constrained-off.
    customProperties:
    - property: aliases
      value:
      - geracao_referencia_final
      - referencia_final
      - geracao_ref_final
    - property: semanticType
      value: METRIC
    - property: unit
      value: MWmed
  - name: cod_razaorestricao
    physicalType: VARCHAR
    logicalType: string
    description: 'Código da Razão da Restrição, podendo ser: REL – Razão de indisponibilidade externa (elétrica).
      CNF – Razão de atendimento a requisitos de confiabilidade. ENE – Razão energética PAR - Restrição indicada
      no parecer de acesso'
    customProperties:
    - property: aliases
      value:
      - razao_restricao
      - motivo_restricao
      - tipo_restricao
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - CNF
      - ENE
      - REL
  - name: cod_origemrestricao
    physicalType: VARCHAR
    logicalType: string
    description: 'Código da Origem da Restrição, podendo ser: LOC – Local. SIS – Sistêmica'
    customProperties:
    - property: aliases
      value:
      - origem_restricao
      - tipo_origem
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - LOC
      - SIS
  - name: dsc_restricao
    physicalType: VARCHAR
    logicalType: string
    description: Detalhamento do motivo da restrição de geração
    customProperties:
    - property: aliases
      value:
      - descricao_restricao
      - motivo_detalhado
      - detalhamento
    - property: semanticType
      value: DIMENSION
  - name: id_pontoconexao
    physicalType: VARCHAR
    logicalType: string
    description: Identificador do ponto de conexão da usina ou conjunto de usinas
    customProperties:
    - property: aliases
      value:
      - ponto_conexao
      - cod_ponto_conexao
    - property: semanticType
      value: IDENTIFIER
  - name: nom_pontoconexao
    physicalType: VARCHAR
    logicalType: string
    description: Nome do ponto de conexão da usina ou conjunto de usinas
    customProperties:
    - property: aliases
      value:
      - nome_ponto_conexao
      - ponto_conexao_nome
    - property: semanticType
      value: DIMENSION
  - name: nom_agenteoperador
    physicalType: VARCHAR
    logicalType: string
    description: Agente responsável pela operação da usina ou conjunto de usinas
    customProperties:
    - property: aliases
      value:
      - agente_operador
      - operador
      - agente
    - property: semanticType
      value: DIMENSION
  - name: val_geracaonaorealizadaapurada
    physicalType: DOUBLE
    logicalType: number
    description: Geração Não Realizada Apurada (GNRa).Representa a estimativa de geração frustrada da usina ou conjunto
      de usina, obtida pela diferença entre a geração de referência e a geração verificada (Se menor que zero, GNRa
      = 0), nos períodos em que houve limitação de geração.
    customProperties:
    - property: aliases
      value:
      - gnra
      - geracao_nao_realizada
      - energia_nao_gerada
      - geracao_frustrada
    - property: semanticType
      value: METRIC
    - property: unit
      value: MWmed
  - name: num_minutos_rel
    physicalType: BIGINT
    logicalType: integer
    description: Número de minutos em que houve restrição por indisponibilidade externa (REL) no patamar semi-horário
      correspondente.
    customProperties:
    - property: aliases
      value:
      - minutos_rel
      - duracao_rel
    - property: semanticType
      value: METRIC
    - property: unit
      value: minutos
  - name: num_minutos_cnf
    physicalType: BIGINT
    logicalType: integer
    description: Número de minutos em que houve restrição por confiabilidade (CNF) no patamar semi-horário correspondente.
    customProperties:
    - property: aliases
      value:
      - minutos_cnf
      - duracao_cnf
    - property: semanticType
      value: METRIC
    - property: unit
      value: minutos
  - name: num_minutos_ene
    physicalType: BIGINT
    logicalType: integer
    description: Número de minutos em que houve restrição por razão energética (ENE) no patamar semi-horário correspondente.
    customProperties:
    - property: aliases
      value:
      - minutos_ene
      - duracao_ene
    - property: semanticType
      value: METRIC
    - property: unit
      value: minutos
  - name: num_minutos_restricao
    physicalType: BIGINT
    logicalType: integer
    description: Número de minutos em que houve restrição por qualquer razão no patamar semi-horário correspondente.
    customProperties:
    - property: aliases
      value:
      - minutos_restricao
      - duracao_restricao
      - minutos_totais
    - property: semanticType
      value: METRIC
    - property: unit
      value: minutos
team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/restricao_coff_eolica_usi
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - corte de geracao eolica
  - quanto a eolica deixou de gerar
  - razao energetica do corte
  - energia cortada da eolica
  - curtailment eolico por usina
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver restrições de geração eólica, curtailment de usinas eólicas,
    energia não gerada por constrained-off, apuração de compensações financeiras por restrição operacional ou análise
    de causas de limitação de geração renovável no SIN. Também relevante para perguntas sobre geração limitada,
    disponibilidade declarada versus geração realizada em usinas eólicas individuais em intervalos de 30 minutos.
    Inclui geracao verificada, limite aplicado, disponibilidade, geracao de referencia (provisoria e final), razao
    e origem da restricao, minutos de restricao por razao e a Geracao Nao Realizada Apurada (GNRa) pelo ONS, por
    usina e patamar de 30 minutos.
- property: agentInstructions
  value: '- [val_geracaolimitada] Nulos em boa parte das linhas: preenchido apenas nos patamares com restricao registrada
    (ou, no caso de val_geracaoreferenciafinal, apos a apuracao definitiva). Valores ausentes podem vir como string
    VAZIA e nao como NULL em colunas de texto - use NULLIF(coluna, '''') ou coluna <> ''''.


    - [cod_razaorestricao] Nulos em boa parte das linhas: preenchido apenas nos patamares com restricao registrada
    (ou, no caso de val_geracaoreferenciafinal, apos a apuracao definitiva). Valores ausentes podem vir como string
    VAZIA e nao como NULL em colunas de texto - use NULLIF(coluna, '''') ou coluna <> ''''.


    - [cod_origemrestricao] Nulos em boa parte das linhas: preenchido apenas nos patamares com restricao registrada
    (ou, no caso de val_geracaoreferenciafinal, apos a apuracao definitiva). Valores ausentes podem vir como string
    VAZIA e nao como NULL em colunas de texto - use NULLIF(coluna, '''') ou coluna <> ''''.


    - [dsc_restricao] Nulos na maior parte das linhas: preenchido apenas nos patamares com restricao registrada
    (ou, no caso de val_geracaoreferenciafinal, apos a apuracao definitiva). Valores ausentes podem vir como string
    VAZIA e nao como NULL em colunas de texto - use NULLIF(coluna, '''') ou coluna <> ''''.


    - [val_geracaoreferenciafinal] Nulos na maior parte das linhas: preenchido apenas nos patamares com restricao
    registrada (ou, no caso de val_geracaoreferenciafinal, apos a apuracao definitiva). Valores ausentes podem vir
    como string VAZIA e nao como NULL em colunas de texto - use NULLIF(coluna, '''') ou coluna <> ''''.


    - [val_geracaonaorealizadaapurada] GNRa = Geracao Nao Realizada Apurada pelo ONS (referencia - verificada, zero
    se negativa), em MWmed, por patamar de 30 minutos. Energia nao gerada em MWh = SUM(val_geracaonaorealizadaapurada)
    * 0,5 (e /1000 para GWh). NUNCA multiplique GNRa por num_minutos_* ou divida por 60: os minutos sao duracao,
    nao fator de conversao. Para GNRa por razao, agrupe por cod_razaorestricao com a mesma formula.


    - [num_minutos_restricao] Nulos em boa parte das linhas: preenchido apenas nos patamares com restricao registrada
    (ou, no caso de val_geracaoreferenciafinal, apos a apuracao definitiva). Valores ausentes podem vir como string
    VAZIA e nao como NULL em colunas de texto - use NULLIF(coluna, '''') ou coluna <> ''''.


    - [val_geracaonaorealizadaapurada] GNRa = Geracao Nao Realizada Apurada pelo ONS (referencia - verificada, zero
    se negativa), em MWmed, por patamar de 30 minutos. Energia nao gerada em MWh = SUM(val_geracaonaorealizadaapurada)
    * 0,5 (e /1000 para GWh). NUNCA multiplique GNRa por num_minutos_* ou divida por 60: os minutos sao duracao,
    nao fator de conversao. Para GNRa por razao, agrupe por cod_razaorestricao com a mesma formula.


    - [num_minutos_rel/cnf/ene/restricao] Minutos de restricao dentro do patamar de 30 minutos, por razao (REL/CNF/ENE)
    e total. Use apenas para duracao (SUM em minutos ou /60 em horas). Nao entram no calculo de energia: GNRa e
    geracoes ja sao medias do patamar (MWmed) e convertem para MWh com * 0,5.


    - [din_instante] Serie desde 2021-10-01 com patamares de 30 minutos, atualizada diariamente. Todas as colunas
    existem em todos os arquivos da serie (schema uniforme, tipos numericos DOUBLE/BIGINT; nenhuma conversao de
    VARCHAR e'' necessaria).


    - [geral] A chave natural e'' (din_instante, id_ons). Conjuntos de usinas (Tipo II-C) aparecem com ceg = ''-''.'
- property: typicalQuestions
  value:
  - Qual foi a energia não gerada por constrained-off na usina EOL VENTOS DE SANTA EUGENIA em janeiro de 2024?
  - Quais usinas eólicas do Nordeste tiveram maior curtailment acumulado em 2024?
  - Qual a razão de restrição mais frequente nas usinas eólicas do subsistema NE?
  - Em quais intervalos de 30 minutos a geração limitada foi inferior a 50% da geração de referência?
  - Qual o percentual de intervalos com restrição ativa (val_geracaolimitada preenchido) por usina e mês?
  - Qual foi o total de energia não gerada por COFF no Nordeste em agosto de 2024?
  - Como foi a geracao realizada versus a disponibilidade em janeiro no Nordeste?
  - Qual subsistema teve maior curtailment em 2024 - SE, S ou NE?
  - Qual estado teve mais usinas com geração limitada no Q2?
  - E aí, qual foi a disponibilidade versus a geracao realizada no Sul em julho?
  - Ranking das 5 eólicas com maior energia não gerada em 2024
  - Quantos intervalos de 30 min com COFF teve em RN durante março?
  - Tem restricao ativa ultimamente nas eólicas do Norte?
  - Qual foi a energia não gerada apurada (GNRa) por constrained-off das usinas eólicas do Nordeste em 2026, por
    razão?
  - Quantos minutos de restrição por razão (REL, CNF, ENE) as usinas eólicas do Rio Grande do Norte acumularam em
    janeiro de 2026?
  - Quais agentes operadores tiveram maior GNRa eólica no último trimestre?
- property: granularity
  value: 30min
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_tm/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2021-10-01'
- property: semantics
  value:
    row_grain:
      temporal: 30 minutos
      temporal_column: din_instante
      spatial: usina
      entity: usina
      one_row_per:
      - din_instante
      - id_ons
    temporal_perspective: verificado
    dimension_columns:
      subsistema: id_subsistema
      fonte: _pivot(val_geracao, val_geracaolimitada, val_geracaoreferencia, val_geracaoreferenciafinal, val_geracaonaorealizadaapurada)
      usina: id_ons
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: geracao
      label: Geracao
      columns:
      - val_geracao
      expression: val_geracao
      quantity_kind: average_power
      unit_native: MWmed
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total_energy:
          sql: SUM(val_geracao * num_minutos_rel / 60.0) / 1000
          unit: GWh
        average_power:
          sql: AVG(val_geracao)
          unit: MWmed
        peak_power:
          sql: MAX(val_geracao)
          unit: MWmed
        time_series:
          sql: AVG(val_geracao)
          unit: MWmed
        ranking:
          sql: SUM(val_geracao * num_minutos_rel / 60.0) / 1000
          unit: GWh
        comparison:
          sql: AVG(val_geracao)
          unit: MWmed
      interval_hours: 0.5
      aliases:
      - geracao
      - geracao_verificada
      - geracao_realizada
      - potencia_gerada
    - id: geracaolimitada
      label: Geracaolimitada
      columns:
      - val_geracaolimitada
      expression: val_geracaolimitada
      quantity_kind: average_power
      unit_native: MWmed
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total_energy:
          sql: SUM(val_geracaolimitada * num_minutos_rel / 60.0) / 1000
          unit: GWh
        average_power:
          sql: AVG(val_geracaolimitada)
          unit: MWmed
        peak_power:
          sql: MAX(val_geracaolimitada)
          unit: MWmed
        time_series:
          sql: AVG(val_geracaolimitada)
          unit: MWmed
        ranking:
          sql: SUM(val_geracaolimitada * num_minutos_rel / 60.0) / 1000
          unit: GWh
        comparison:
          sql: AVG(val_geracaolimitada)
          unit: MWmed
      interval_hours: 0.5
      aliases:
      - geracao_limitada
      - limite_geracao
      - curtailment
      - corte_geracao
    - id: disponibilidade
      label: Disponibilidade
      columns:
      - val_disponibilidade
      expression: val_disponibilidade
      quantity_kind: average_power
      unit_native: MWmed
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total_energy:
          sql: SUM(val_disponibilidade * num_minutos_rel / 60.0) / 1000
          unit: GWh
        average_power:
          sql: AVG(val_disponibilidade)
          unit: MWmed
        peak_power:
          sql: MAX(val_disponibilidade)
          unit: MWmed
        time_series:
          sql: AVG(val_disponibilidade)
          unit: MWmed
        ranking:
          sql: SUM(val_disponibilidade * num_minutos_rel / 60.0) / 1000
          unit: GWh
        comparison:
          sql: AVG(val_disponibilidade)
          unit: MWmed
      interval_hours: 0.5
      aliases:
      - disponibilidade
      - potencia_disponivel
      - capacidade_disponivel
    - id: geracaoreferencia
      label: Geracaoreferencia
      columns:
