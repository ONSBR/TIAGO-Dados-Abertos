    sql_patterns:
      geracao_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, id_subsistema,\n\
          \  SUM((TRY_CAST(val_geracao AS DOUBLE)) * 0.5) / 1000 AS valor\nFROM {source}\nWHERE EXTRACT(YEAR\
          \ FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1, 2\nORDER BY 1, 2"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracao
          grain: month
        validated_params:
          year: '2023'
      curtailment_por_usina:
        template: "SELECT nom_usina, id_subsistema,\n  SUM((TRY_CAST(val_geracaolimitada AS DOUBLE)) *\
          \ 0.5) / 1000 AS energia_limitada_gwh,\n  COUNT(*) AS intervalos_com_restricao\nFROM {source}\n\
          WHERE val_geracaolimitada IS NOT NULL\n  AND TRY_CAST(val_geracaolimitada AS DOUBLE) IS NOT\
          \ NULL\n  AND EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1, 2\n\
          ORDER BY 3 DESC"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracaolimitada
          grain: usina
        validated_params:
          year: '2023'
      energia_nao_gerada_coff:
        template: "SELECT nom_usina, id_subsistema,\n  SUM((TRY_CAST(val_geracaoreferencia AS DOUBLE)\
          \ - TRY_CAST(val_geracao AS DOUBLE)) * 0.5) / 1000 AS energia_nao_gerada_gwh\nFROM {source}\n\
          WHERE val_geracaolimitada IS NOT NULL\n  AND TRY_CAST(val_geracaoreferencia AS DOUBLE) IS NOT\
          \ NULL\n  AND TRY_CAST(val_geracao AS DOUBLE) IS NOT NULL\nGROUP BY 1, 2\nORDER BY 3 DESC"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracaoreferencia
          - geracao
          grain: usina
      apuracao_definitiva_compensacao:
        template: "SELECT nom_usina, id_subsistema,\n  SUM((TRY_CAST(val_geracaoreferenciafinal AS DOUBLE))\
          \ * 0.5) / 1000 AS referencia_final_gwh\nFROM {source}\nWHERE val_geracaoreferenciafinal IS\
          \ NOT NULL\n  AND TRY_CAST(val_geracaoreferenciafinal AS DOUBLE) IS NOT NULL\nGROUP BY 1, 2\n\
          ORDER BY 3 DESC"
        output_unit: GWh
        note: Usar apenas para apuracao definitiva; 66.7% dos registros tem val_geracaoreferenciafinal
          nulo
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracaoreferenciafinal
          grain: usina
      curtailment_eolico_mensal:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  TRIM(CAST(id_subsistema\
          \ AS VARCHAR)) AS id_subsistema,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracaolimitada AS VARCHAR)\
          \ AS DOUBLE)) * 0.5 / 1000, 1) AS energia_limitada_gwh\nFROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_tm/*.parquet',\
          \ union_by_name=true)\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\n\
          GROUP BY 1, 2 ORDER BY 1, 2"
        output_unit: GWh
        note: val_geracaolimitada e MW em intervalos de 30 min; energia = SUM(MW)*0.5/1000 = GWh. Cast
          duplo TRY_CAST(TRY_CAST(x AS VARCHAR) AS DOUBLE) obrigatorio por schema-drift (VARCHAR com string
          vazia + DOUBLE em arquivos diferentes); union_by_name=true idem.
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracaolimitada
          grain: month
        validated_params:
          year: '2025'
      restricao_coff_eolica_usi_mensal_gwh:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_disponibilidade\
          \ AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1) AS val_disponibilidade_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracao\
          \ AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1) AS val_geracao_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracaolimitada\
          \ AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1) AS val_geracaolimitada_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracaoreferencia\
          \ AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1) AS val_geracaoreferencia_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracaoreferenciafinal\
          \ AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1) AS val_geracaoreferenciafinal_gwh\nFROM {source}\n\
          WHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1\nORDER BY\
          \ 1"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          grain: month
        validated_params:
          year: '2025'
      restricao_coff_eolica_usi_mensal_mwmed:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_disponibilidade\
          \ AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante AS TIMESTAMP)), 1) AS val_disponibilidade_mwmed,\n\
          \  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracao AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante\
          \ AS TIMESTAMP)), 1) AS val_geracao_mwmed,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracaolimitada\
          \ AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante AS TIMESTAMP)), 1) AS val_geracaolimitada_mwmed,\n\
          \  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracaoreferencia AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT\
          \ TRY_CAST(din_instante AS TIMESTAMP)), 1) AS val_geracaoreferencia_mwmed\nFROM {source}\nWHERE\
          \ EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1\nORDER BY 1"
        output_unit: MWmed
        matches:
          output_modes:
          - average_power
          grain: month
        validated_params:
          year: '2025'
- property: fewShotQueries
  value:
  - question: Quais usinas eólicas tiveram maior energia restringida (MWh) por constrained-off no período
      disponível?
    sql: "-- restricao_coff_eolica_usi: ranking de energia restringida por usina\nSELECT\n  id_ons,\n\
      \  nom_usina,\n  id_subsistema,\n  nom_subsistema,\n  id_estado,\n  COUNT(*) AS instantes_com_restricao,\n\
      \  ROUND(SUM((TRY_CAST(val_disponibilidade AS DOUBLE) - TRY_CAST(val_geracao AS DOUBLE)) * 1.0)\
      \ * 0.5, 2) AS energia_restringida_mwh,\n  ROUND(AVG(\n    TRY_CAST(val_disponibilidade AS DOUBLE)\
      \ - TRY_CAST(val_geracao AS DOUBLE)\n  ), 4) AS media_restricao_mw\nFROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_tm/*.parquet')\n\
      WHERE val_geracaolimitada IS NOT NULL\n  AND TRY_CAST(val_disponibilidade AS DOUBLE) IS NOT NULL\n\
      \  AND TRY_CAST(val_geracao AS DOUBLE) IS NOT NULL\nGROUP BY id_ons, nom_usina, id_subsistema, nom_subsistema,\
      \ id_estado\nORDER BY energia_restringida_mwh DESC\nLIMIT 20"
  - question: Como evoluiu o volume de constrained-off eólico mês a mês por subsistema?
    sql: "-- restricao_coff_eolica_usi: evolução mensal de constrained-off por subsistema\nSELECT\n  DATE_TRUNC('month',\
      \ TRY_CAST(din_instante AS TIMESTAMP)) AS mes_referencia,\n  id_subsistema,\n  nom_subsistema,\n\
      \  COUNT(DISTINCT id_ons) AS usinas_afetadas,\n  COUNT(*) AS total_instantes_restricao,\n  ROUND(SUM((TRY_CAST(val_disponibilidade\
      \ AS DOUBLE) - TRY_CAST(val_geracao AS DOUBLE)) * 0.5) / 1000, 2) AS energia_restringida_gwh,\n\
      \  ROUND(SUM((TRY_CAST(val_geracaoreferencia AS DOUBLE)) * 0.5) / 1000, 2) AS energia_referencia_gwh\n\
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_tm/*.parquet')\nWHERE\
      \ val_geracaolimitada IS NOT NULL\n  AND TRY_CAST(val_disponibilidade AS DOUBLE) IS NOT NULL\n \
      \ AND TRY_CAST(val_geracao AS DOUBLE) IS NOT NULL\nGROUP BY DATE_TRUNC('month', TRY_CAST(din_instante\
      \ AS TIMESTAMP)), id_subsistema, nom_subsistema\nORDER BY mes_referencia DESC, energia_restringida_gwh\
      \ DESC"
  - question: Qual o volume de geração de referência final apurado por usina para cálculo de compensação?
    sql: "-- restricao_coff_eolica_usi: geração de referência final para compensação financeira\nSELECT\n\
      \  id_ons,\n  nom_usina,\n  id_subsistema,\n  nom_subsistema,\n  DATE_TRUNC('month', TRY_CAST(din_instante\
      \ AS TIMESTAMP)) AS mes_referencia,\n  COUNT(*) AS instantes_apurados,\n  ROUND(SUM((TRY_CAST(val_geracaoreferenciafinal\
      \ AS DOUBLE)) * 0.5) / 1000 * 0.5, 2) AS energia_ref_final_gwh,\n  ROUND(SUM((TRY_CAST(val_geracaoreferencia\
      \ AS DOUBLE)) * 0.5) / 1000, 2) AS energia_ref_preliminar_gwh,\n  ROUND(SUM((TRY_CAST(val_geracaoreferenciafinal\
      \ AS DOUBLE)) * 0.5) / 1000\n    - SUM((TRY_CAST(val_geracaoreferencia AS DOUBLE)) * 0.5) / 1000,\
      \ 2) AS diferenca_revisao_gwh\nFROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_tm/*.parquet')\n\
      WHERE val_geracaoreferenciafinal IS NOT NULL\n  AND TRY_CAST(val_geracaoreferenciafinal AS DOUBLE)\
      \ IS NOT NULL\n  AND TRY_CAST(val_geracaoreferencia AS DOUBLE) IS NOT NULL\nGROUP BY id_ons, nom_usina,\
      \ id_subsistema, nom_subsistema, DATE_TRUNC('month', din_instante)\nORDER BY mes_referencia DESC,\
      \ energia_ref_final_gwh DESC\nLIMIT 50"
