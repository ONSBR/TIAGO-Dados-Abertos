  - name: din_instante
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Data e hora do instante de apuração da restrição de constrained-off, com granularidade
      de 30 minutos (48 patamares por dia)
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - instante
      - data_hora
      - timestamp
      - data_instante
      - momento
    - property: semanticType
      value: TIMESTAMP
  - name: val_geracao
    physicalType: VARCHAR
    logicalType: string
    description: Geração efetivamente realizada pela usina eólica no intervalo de 30 minutos. Armazenada
      como VARCHAR por formato de serialização; requer TRY_CAST para uso numérico.
    customProperties:
    - property: aliases
      value:
      - geracao
      - geracao_realizada
      - potencia_gerada
      - geracao_medida
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_geracao AS DOUBLE)
    - property: unit
      value: MW
  - name: val_geracaolimitada
    physicalType: VARCHAR
    logicalType: string
    description: Valor de geração limitada imposta pela restrição de constrained-off no intervalo; nulo
