team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/restricao_coff_eolica_usi
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - corte de geracao eolica
  - quanto a eolica deixou de gerar
  - razao energetica do corte
  - energia cortada da eolica
  - curtailment eolico por usina
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver restrições de geração eólica, curtailment de
    usinas eólicas, energia não gerada por constrained-off, apuração de compensações financeiras por restrição
    operacional ou análise de causas de limitação de geração renovável no SIN. Também relevante para perguntas
    sobre geração limitada, disponibilidade declarada versus geração realizada em usinas eólicas individuais
    em intervalos de 30 minutos.
- property: agentInstructions
  value: |
    - [val_geracaolimitada] A maior parte dos registros possuem val_geracaolimitada nulo, indicando que na maioria dos instantes não há limitação de geração aplicada. Filtros sem tratamento de nulo podem subestimar o universo de restrições ativas. Ao calcular energia restringida, use COALESCE ou filtre explicitamente por NOT NULL.

    - [val_geracaoreferenciafinal] Quase todos os registros possuem val_geracaoreferenciafinal nulo, pois este campo é preenchido apenas após a conclusão do processo de consistência e apuração definitiva do ONS. Análises de compensação financeira definitiva devem filtrar apenas registros com este campo preenchido.

    - [dsc_restricao] A maior parte dos registros possuem dsc_restricao nulo ou vazio. A descrição textual é campo opcional e seu preenchimento não é sistemático. Análises qualitativas baseadas neste campo cobrem apenas uma fração do universo de restrições.

    - [val_geracao] val_geracao está armazenado como VARCHAR devido ao formato de serialização . Qualquer operação aritmética ou de agregação retornará erro ou resultado incorreto sem conversão explícita. TRY_CAST retorna NULL para valores não numéricos, permitindo identificar registros corrompidos.

    - [val_geracaolimitada] val_geracaolimitada está armazenado como VARCHAR devido ao formato de serialização. Além do problema de tipo, possui nulos na maior parte das linhas. TRY_CAST deve ser combinado com COALESCE ou filtro NOT NULL para cálculos de energia restringida.

    - [val_disponibilidade] val_disponibilidade está armazenado como VARCHAR devido ao formato de serialização. Comparações entre val_disponibilidade e val_geracao para calcular energia não gerada por constrained-off requerem TRY_CAST em ambas as colunas.

    - [val_geracaoreferencia] val_geracaoreferencia está armazenado como VARCHAR devido ao formato de serialização. Este campo é base para cálculo de compensação financeira; erros de conversão podem impactar diretamente apurações regulatórias. Verificar se há valores não numéricos antes de usar em produção.

    - [val_geracaoreferenciafinal] val_geracaoreferenciafinal está armazenado como VARCHAR devido ao formato de serialização. Combinado com os nulos em quase todas as linhas, requer duplo tratamento: filtro NOT NULL e TRY_CAST para qualquer análise de apuração definitiva de compensação financeira.

    - [din_instante] O dataset cobre o período a partir de 2023-10-01 com atualização diária às 12h e 19h. Por ser um processo de consistência recorrente, podem existir lacunas temporais para usinas específicas ou períodos sem restrição registrada. Verificar continuidade por usina é essencial antes de análises de séries temporais.

    - [dsc_restricao] Coluna 'dsc_restricao' ausente em arquivos históricos (ex: RESTRICAO_COFF_EOLICA_2023_10.parquet). Presente apenas a partir de versões recentes (ex: RESTRICAO_COFF_EOLICA_2026_06.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [tipos] As colunas `val_disponibilidade`, `val_geracao`, `val_geracaolimitada`, `val_geracaoreferencia`, `val_geracaoreferenciafinal` mudam de tipo entre arquivos anuais (texto em uns, número em outros); cada uma traz `castExpression` no schema: use-o em toda agregação e comparação.
    - [val_geracaolimitada — conversao de energia] val_geracaolimitada e MW em intervalos de 30 min; energia = SUM(val)*0.5/1000 = GWh. Coluna vem VARCHAR com string vazia + DOUBLE (schema-drift): use union_by_name=true e TRY_CAST(TRY_CAST(x AS VARCHAR) AS DOUBLE).
- property: typicalQuestions
  value:
  - Qual foi a energia não gerada por constrained-off na usina EOL VENTOS DE SANTA EUGENIA em janeiro
    de 2024?
  - Quais usinas eólicas do Nordeste tiveram maior curtailment acumulado em 2024?
  - Qual a razão de restrição mais frequente nas usinas eólicas do subsistema NE?
  - Em quais intervalos de 30 minutos a geração limitada foi inferior a 50% da geração de referência?
  - Qual o percentual de intervalos com restrição ativa (val_geracaolimitada preenchido) por usina e mês?
  # geradas e validadas pelo benchmark em 2026-09-06
  - "Qual foi o total de energia não gerada por COFF no Nordeste em agosto de 2024?"
  - "Como foi a geracao realizada versus a disponibilidade em janeiro no Nordeste?"
  - "Qual subsistema teve maior curtailment em 2024 - SE, S ou NE?"
  - "Qual estado teve mais usinas com geração limitada no Q2?"
  - "E aí, qual foi a disponibilidade versus a geracao realizada no Sul em julho?"
  - "Ranking das 5 eólicas com maior energia não gerada em 2024"
  - "Quantos intervalos de 30 min com COFF teve em RN durante março?"
  - "Tem restricao ativa ultimamente nas eólicas do Norte?"
- property: granularity
  value: horária
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_tm/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2023-10-01'
- property: semantics
  value:
    measure_terms:
    - restricao
    - restricoes
    - corte
    - cortes
    - cortada
    - curtailment
    - constrained off
    - constrained-off
    - frustrada
    family: restricao_eolica
    family_default: true
    temporal_perspective: verificado
    row_grain:
      temporal: 30 minutos
      temporal_column: din_instante
      spatial: usina
      entity: usina
      one_row_per:
      - din_instante
      - id_subsistema
      - ceg
      - id_ons
      - cod_razaorestricao
      - cod_origemrestricao
    dimension_columns:
      subsistema: id_subsistema
      fonte: null
      usina: ceg
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: geracao
      label: Geracao
      columns:
      - val_geracao
      expression: TRY_CAST(val_geracao AS DOUBLE)
      quantity_kind: average_power
      unit_native: MWmed
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total_energy:
          sql: SUM((TRY_CAST(val_geracao AS DOUBLE)) * 0.5) / 1000
          unit: GWh
        average_power:
          sql: AVG(TRY_CAST(val_geracao AS DOUBLE))
          unit: MWmed
        peak_power:
          sql: MAX(TRY_CAST(val_geracao AS DOUBLE))
          unit: MWmed
        time_series:
          sql: AVG(TRY_CAST(val_geracao AS DOUBLE))
          unit: MWmed
        ranking:
          sql: SUM((TRY_CAST(val_geracao AS DOUBLE)) * 0.5) / 1000
          unit: GWh
        comparison:
          sql: AVG(TRY_CAST(val_geracao AS DOUBLE))
          unit: MWmed
      interval_hours: 0.5
      aliases:
      - geracao
      - geracao_realizada
      - potencia_gerada
      - geracao_medida
    - id: geracaolimitada
      label: Geracaolimitada
      columns:
      - val_geracaolimitada
      expression: TRY_CAST(val_geracaolimitada AS DOUBLE)
      quantity_kind: average_power
      unit_native: MWmed
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total_energy:
          sql: SUM((TRY_CAST(val_geracaolimitada AS DOUBLE)) * 0.5) / 1000
          unit: GWh
        average_power:
          sql: AVG(TRY_CAST(val_geracaolimitada AS DOUBLE))
