      \ id_ons, din_instante, cod_razaorestricao, cod_origemrestricao FROM restricao_coff_eolica_usi\n\
      \          GROUP BY id_ons, din_instante, cod_razaorestricao, cod_origemrestricao\n          HAVING\
      \ COUNT(*) > 1\n        )\n\n  # Nulos em val_geracaolimitada — alerta de qualidade (real=59.9%,\
      \ threshold=119.8%)\n  - missing_percent(val_geracaolimitada) < 119.8:\n      name: val_geracaolimitada\
      \ não deve ter >119.8% nulos\n\n  # Nulos em val_geracaoreferenciafinal — alerta de qualidade (real=66.7%,\
      \ threshold=133.4%)\n  - missing_percent(val_geracaoreferenciafinal) < 133.4:\n      name: val_geracaoreferenciafinal\
      \ não deve ter >133.4% nulos\n\n  # Nulos em dsc_restricao — alerta de qualidade (real=70.5%, threshold=141.0%)\n\
      \  - missing_percent(dsc_restricao) < 141.0:\n      name: dsc_restricao não deve ter >141.0% nulos\n\
      \n  # Freshness: din_instante deve ter dados recentes (SLA: Atualizado diariamente)\n  - freshness(din_instante)\
      \ < 3d:\n      name: din_instante não pode ter dados com mais de 3 dias de atraso\n"
team:
  name: ONS - Operador Nacional do Sistema Elétrico
