- property: fewShotQueries
  value:
  - question: Qual foi a energia não gerada por constrained-off na usina EOL Bahia em janeiro de 2025?
    sql: SELECT SUM(val_geracaonaorealizadaapurada * num_minutos_rel / 60.0) / 1000 AS energia_nao_gerada_gwh FROM
      read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_tm/*.parquet', union_by_name=true)
      WHERE nom_usina LIKE '%Bahia%' AND din_instante >= '2025-01-01' AND din_instante < '2025-02-01'
  - question: Quais usinas eólicas do Nordeste tiveram maior curtailment acumulado em 2024?
    sql: SELECT nom_usina, SUM(val_geracaonaorealizadaapurada * num_minutos_rel / 60.0) / 1000 AS curtailment_gwh
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_tm/*.parquet', union_by_name=true)
      WHERE id_subsistema = 'NE' AND din_instante >= '2024-01-01' AND din_instante < '2025-01-01' GROUP BY nom_usina
      ORDER BY curtailment_gwh DESC LIMIT 20
  - question: Qual a razão de restrição mais frequente nas usinas eólicas do subsistema SE?
    sql: SELECT cod_razaorestricao, COUNT(*) AS frequencia, SUM(num_minutos_restricao) AS total_minutos FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_tm/*.parquet',
      union_by_name=true) WHERE id_subsistema = 'SE' AND cod_razaorestricao IS NOT NULL GROUP BY cod_razaorestricao
      ORDER BY frequencia DESC
  - question: Em quais intervalos de 30 minutos a geração limitada foi inferior a 50% da geração de referência?
    sql: SELECT din_instante, nom_usina, val_geracaolimitada, val_geracaoreferencia, (val_geracaolimitada / NULLIF(val_geracaoreferencia,
      0)) * 100 AS percentual FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_tm/*.parquet',
      union_by_name=true) WHERE val_geracaoreferencia > 0 AND val_geracaolimitada < 0.5 * val_geracaoreferencia
      ORDER BY din_instante DESC LIMIT 100
  - question: Qual foi o total de energia não gerada por COFF no Nordeste em agosto de 2024?
    sql: SELECT SUM(val_geracaonaorealizadaapurada * num_minutos_rel / 60.0) / 1000 AS energia_nao_gerada_gwh FROM
      read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_tm/*.parquet', union_by_name=true)
      WHERE id_subsistema = 'NE' AND din_instante >= '2024-08-01' AND din_instante < '2024-09-01'
  - question: Qual foi a energia não gerada apurada (GNRa) por constrained-off, por razão de restrição, em julho
      de 2026?
    sql: SELECT cod_razaorestricao, ROUND(SUM(val_geracaonaorealizadaapurada) * 0.5, 1) AS gnra_mwh FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_tm/*.parquet',
      union_by_name=true) WHERE din_instante >= '2026-07-01' AND din_instante < '2026-08-01' AND val_geracaonaorealizadaapurada
      IS NOT NULL GROUP BY 1 ORDER BY 2 DESC
