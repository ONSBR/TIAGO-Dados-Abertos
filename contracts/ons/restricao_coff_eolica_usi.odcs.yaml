version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:restricao_coff_eolica_usi
name: restricao_coff_eolica_usi
tenant: ons
tags:
- 30min
- coff eólico
- compensacao-financeira
- constrained-off
- constrained-off eólico
- curtailment
- curtailment eólico
- energia não gerada eólica
- energia-nao-gerada
- eolica
- geracao-renovavel
- restricao-operacional
- restrição eólica
- semi-horario
- usina-eolica
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/restricao_coff_eolica_tm/*.parquet
  format: parquet
description:
  purpose: Suporta a apuração de compensações financeiras por energia não gerada, o monitoramento operacional
    de curtailment eólico e a análise de causas de restrição de geração renovável no SIN. É utilizado
    por agentes do setor elétrico, reguladores da ANEEL, o próprio ONS e pesquisadores para calcular energia
    não gerada por usina e intervalo, auditar eventos de constrained-off, subsidiar decisões de redespacho
    e avaliar o impacto sistêmico das restrições de rede sobre a geração eólica.
  limitations: Coluna armazena valores numéricos de geração (MW) como VARCHAR devido ao formato de serialização
    do ONS. A maior parte dos registros possuem val_geracaolimitada nulo, indicando intervalos sem limitação de geração aplicada no dataset restricao_coff_eolica_usi. Além dos nulos frequentes, os valores não nulos
    de val_geracaolimitada estão armazenados como VARCHAR pelo formato de serialização no dataset restricao_coff_eolica_usi.
  usage: Recuperar este dataset quando a pergunta envolver restrições de geração eólica, curtailment de
    usinas eólicas, energia não gerada por constrained-off, apuração de compensações financeiras por restrição
    operacional ou análise de causas de limitação de geração renovável no SIN.
domain: geração
schema:
- name: restricao_coff_eolica_usi
  physicalType: parquet
  logicalType: object
  physicalName: restricao_coff_eolica_usi
  properties:
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Código identificador do subsistema elétrico ao qual a usina eólica pertence (ex: SE,
