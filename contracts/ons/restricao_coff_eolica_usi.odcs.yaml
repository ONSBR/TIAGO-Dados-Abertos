      disponibilidade_mensal_mwmed:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, id_subsistema,\n  AVG(val_disponibilidade)\
          \ AS valor\nFROM {source}\nWHERE EXTRACT(YEAR FROM din_instante) = {year}\nGROUP BY 1, 2\nORDER BY 1,\
