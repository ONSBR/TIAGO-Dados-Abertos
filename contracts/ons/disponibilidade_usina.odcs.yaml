      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: potenciainstalada
      label: Potencia Instalada
      columns:
      - val_potenciainstalada
      expression: TRY_CAST(val_potenciainstalada AS DOUBLE)
      quantity_kind: capacity
      unit_native: MW
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total:
          sql: SUM(TRY_CAST(val_potenciainstalada AS DOUBLE))
          unit: MW
        maximum:
          sql: MAX(TRY_CAST(val_potenciainstalada AS DOUBLE))
          unit: MW
        time_series:
          sql: SUM(TRY_CAST(val_potenciainstalada AS DOUBLE))
          unit: MW
        ranking:
          sql: SUM(TRY_CAST(val_potenciainstalada AS DOUBLE))
          unit: MW
        comparison:
          sql: SUM(TRY_CAST(val_potenciainstalada AS DOUBLE))
          unit: MW
      interval_hours: 1.0
      aliases:
      - potencia instalada
      - capacidade instalada
      - potencia total
      - MW instalado
    - id: dispoperacional
      label: Disponibilidade Operacional
      columns:
      - val_dispoperacional
      expression: TRY_CAST(val_dispoperacional AS DOUBLE)
      quantity_kind: capacity
      unit_native: MW
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total:
          sql: SUM(TRY_CAST(val_dispoperacional AS DOUBLE))
          unit: MW
        average:
          sql: AVG(TRY_CAST(val_dispoperacional AS DOUBLE))
          unit: MW
        maximum:
          sql: MAX(TRY_CAST(val_dispoperacional AS DOUBLE))
          unit: MW
        time_series:
          sql: AVG(TRY_CAST(val_dispoperacional AS DOUBLE))
          unit: MW
        ranking:
          sql: AVG(TRY_CAST(val_dispoperacional AS DOUBLE))
          unit: MW
        comparison:
          sql: AVG(TRY_CAST(val_dispoperacional AS DOUBLE))
          unit: MW
      interval_hours: 1.0
      aliases:
      - disponibilidade operacional
      - disp operacional
      - capacidade operacional
      - disponivel operacional
      - capacidade disponivel
    - id: dispsincronizada
      label: Disponibilidade Sincronizada
      columns:
      - val_dispsincronizada
      expression: TRY_CAST(val_dispsincronizada AS DOUBLE)
