          end_date: '2015-01-31 23:00:00'
- property: fewShotQueries
  value:
  - question: Qual foi a disponibilidade operacional média (em MW) por subsistema e tipo de usina em 2023?
    sql: SELECT id_subsistema, nom_subsistema, id_tipousina, AVG(TRY_CAST(val_dispoperacional AS DOUBLE))
      AS avg_disp_operacional_mw, AVG(TRY_CAST(val_potenciainstalada AS DOUBLE)) AS avg_potencia_instalada_mw,
      AVG(TRY_CAST(val_dispoperacional AS DOUBLE)) / NULLIF(AVG(TRY_CAST(val_potenciainstalada AS DOUBLE)),
      0) AS fator_disponibilidade FROM read_parquet('s3://ons-aws-prod-opendata/dataset/disponibilidade_usina_ho/*.parquet')
      WHERE din_instante >= '2023-01-01' AND din_instante < '2024-01-01' GROUP BY id_subsistema, nom_subsistema,
      id_tipousina ORDER BY id_subsistema, id_tipousina;
  - question: Quais usinas acumularam maior indisponibilidade (MW×hora) no ano de 2024?
    sql: SELECT id_ons, nom_usina, id_subsistema, id_tipousina, SUM( TRY_CAST(val_potenciainstalada AS
      DOUBLE) - TRY_CAST(val_dispoperacional AS DOUBLE) ) AS indisponibilidade_acumulada_mwh, COUNT(*)
      AS horas_com_registro, AVG(TRY_CAST(val_potenciainstalada AS DOUBLE)) AS potencia_media_mw FROM
      read_parquet('s3://ons-aws-prod-opendata/dataset/disponibilidade_usina_ho/*.parquet') WHERE din_instante
      >= '2024-01-01' AND din_instante < '2025-01-01' AND TRY_CAST(val_potenciainstalada AS DOUBLE) >
      0 GROUP BY id_ons, nom_usina, id_subsistema, id_tipousina ORDER BY indisponibilidade_acumulada_mwh
      DESC LIMIT 20;
  - question: Como evoluiu a disponibilidade sincronizada total do SIN hora a hora em janeiro de 2024?
    sql: SELECT din_instante, SUM(TRY_CAST(val_dispsincronizada AS DOUBLE)) AS total_disp_sincronizada_mw,
      SUM(TRY_CAST(val_dispoperacional AS DOUBLE)) AS total_disp_operacional_mw, SUM(TRY_CAST(val_potenciainstalada
      AS DOUBLE)) AS total_potencia_instalada_mw FROM read_parquet('s3://ons-aws-prod-opendata/dataset/disponibilidade_usina_ho/*.parquet')
      WHERE din_instante >= '2024-01-01' AND din_instante < '2024-02-01' GROUP BY din_instante ORDER BY
      din_instante;
