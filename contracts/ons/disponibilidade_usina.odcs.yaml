          unit: MW
        comparison:
          sql: AVG(TRY_CAST(val_dispsincronizada AS DOUBLE))
          unit: MW
      interval_hours: 1.0
      aliases:
      - disponibilidade sincronizada
      - disp sincronizada
      - capacidade sincronizada
      - disponivel sincronizado
    query_routing:
