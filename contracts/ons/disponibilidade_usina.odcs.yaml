    sql_patterns:
      potenciainstalada_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, id_subsistema,\n\
          \  SUM(TRY_CAST(val_potenciainstalada AS DOUBLE)) AS valor\nFROM {source}\nWHERE EXTRACT(YEAR\
          \ FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1, 2\nORDER BY 1, 2"
        output_unit: MW
        matches:
          output_modes:
          - total
          metrics:
          - potenciainstalada
          grain: month
        validated_params:
          year: '2015'
      dispoperacional_media_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, id_subsistema,\n\
          \  AVG(TRY_CAST(val_dispoperacional AS DOUBLE)) AS disp_operacional_media_mw\nFROM {source}\n\
          WHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1, 2\nORDER\
          \ BY 1, 2"
        output_unit: MW
        matches:
          output_modes:
          - average
          metrics:
          - dispoperacional
          grain: month
        validated_params:
          year: '2015'
      diferenca_potencia_disponibilidade:
        template: "SELECT nom_usina, id_subsistema,\n  AVG(TRY_CAST(val_potenciainstalada AS DOUBLE))\
          \ AS potencia_instalada_media_mw,\n  AVG(TRY_CAST(val_dispoperacional AS DOUBLE)) AS disp_operacional_media_mw,\n\
          \  AVG(TRY_CAST(val_potenciainstalada AS DOUBLE)) - AVG(TRY_CAST(val_dispoperacional AS DOUBLE))\
          \ AS diferenca_mw\nFROM {source}\nWHERE din_instante >= {start_date} AND din_instante < {end_date}\n\
          GROUP BY 1, 2\nORDER BY diferenca_mw DESC"
        output_unit: MW
        matches:
          output_modes:
          - comparison
          metrics:
          - potenciainstalada
          - dispoperacional
          grain: period
        validated_params:
          start_date: '2015-01-01 01:00:00'
          end_date: '2015-01-31 23:00:00'
      dispsincronizada_por_combustivel:
        template: "SELECT nom_tipocombustivel,\n  AVG(TRY_CAST(val_dispsincronizada AS DOUBLE)) AS disp_sincronizada_media_mw\n\
          FROM {source}\nWHERE din_instante >= {start_date} AND din_instante < {end_date}\n  AND nom_tipocombustivel\
          \ IS NOT NULL\nGROUP BY 1\nORDER BY disp_sincronizada_media_mw DESC"
        output_unit: MW
        matches:
          output_modes:
          - average
          metrics:
          - dispsincronizada
          grain: period
