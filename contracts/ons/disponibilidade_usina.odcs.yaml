- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver disponibilidade operacional, disponibilidade
    sincronizada ou potência instalada de usinas hidráulicas ou térmicas em base horária. Também relevante
    para análises de confiabilidade do parque gerador, fator de capacidade, índices de indisponibilidade
    e monitoramento da capacidade disponível por subsistema ou usina. Priorizar quando o contexto mencionar
    despacho, programação operativa ou análise de reserva de potência.
- property: agentInstructions
  value: |
    - [val_potenciainstalada] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização. Contém valores numéricos representando potência instalada em MW. Qualquer operação aritmética ou agregação (SUM, AVG, MAX, MIN) exige conversão explícita via TRY_CAST.

    - [val_dispoperacional] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização. Contém valores numéricos representando disponibilidade operacional em MW. Qualquer operação aritmética ou agregação exige conversão explícita via TRY_CAST.

    - [val_dispsincronizada] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização. Contém valores numéricos representando disponibilidade sincronizada em MW. Qualquer operação aritmética ou agregação exige conversão explícita via TRY_CAST.

    - [val_dispoperacional] Disponibilidade operacional não deveria exceder a potência instalada nem ser negativa. Valores fora do intervalo [0, val_potenciainstalada] indicam inconsistência nos dados, possivelmente oriundos de revisões recorrentes ainda não consolidadas.

    - [val_dispsincronizada] Disponibilidade sincronizada não deveria exceder a disponibilidade operacional nem ser negativa. Valores fora do intervalo [0, val_dispoperacional] indicam inconsistência, pois a capacidade sincronizada é subconjunto da capacidade operacional disponível.

    - [din_instante] Dataset cobre período de 2015-01-01 em diante com granularidade horária. Podem existir lacunas horárias para usinas específicas decorrentes de indisponibilidade de dados na fonte ou do processo de consistência recorrente com revisões pós-publicação.

    - [id_ons] A chave primária natural é composta por (din_instante, id_ons). Duplicatas nessa combinação podem ocorrer em decorrência do processo de consistência recorrente com múltiplas versões de um mesmo registro publicadas em diferentes execuções diárias (12h e 19h).

    - [tipos] As colunas `val_dispoperacional`, `val_dispsincronizada`, `val_potenciainstalada` mudam de tipo entre arquivos anuais (texto em uns, número em outros); cada uma traz `castExpression` no schema: use-o em toda agregação e comparação.
- property: typicalQuestions
  value:
  - Qual foi a disponibilidade operacional média das usinas hidráulicas do subsistema Sudeste em janeiro
    de 2024?
  - Quais usinas apresentaram maior diferença entre potência instalada e disponibilidade operacional no
    último mês?
  - Qual o índice de disponibilidade sincronizada das usinas térmicas a gás natural em 2023?
  - Houve alguma usina com disponibilidade operacional superior à potência instalada nos últimos 12 meses?
  - Como evoluiu a disponibilidade total do parque gerador hidráulico do subsistema Sul ao longo de 2022?
- property: granularity
  value: horária
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/disponibilidade_usina_ho/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2015-01-01'
- property: semantics
  value:
    measure_terms:
    - disponibilidade
    - disponivel
    - indisponibilidade
    - indisponivel
    temporal_perspective: verificado
    row_grain:
      temporal: 1 hora
      temporal_column: din_instante
      spatial: usina
