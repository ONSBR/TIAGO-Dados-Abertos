version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:subestacao
name: subestacao
tenant: ons
tags:
- ONS
- SE
- SIN
- alta-tensao
- barra elétrica
- cadastro
- extra-alta-tensao
- nó da rede
- ponto de conexão
- rede-basica
- rede-complementar
- referencia
- subestacao
- subestação
- subestação de transmissão
- transmissao
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/subestacao/*.parquet
  format: parquet
description:
  purpose: Prover referência cadastral autoritativa das subestações da rede de transmissão brasileira
    para analistas de transmissão, planejadores do sistema elétrico e equipes de operação do ONS, suportando
    decisões de despacho, análise de contingências, planejamento da expansão da rede e estudos de fluxo
    de potência, além de servir como tabela de dimensão em joins com datasets operativos de restrições,
    intercâmbio e equipamentos de transmissão.
  limitations: Aproximadamente 0. val_latitude é armazenada como VARCHAR no Parquet devido ao formato
    de serialização. val_longitude é armazenada como VARCHAR no Parquet devido ao formato de serialização.
  usage: Recuperar este dataset quando a pergunta envolver identificação, localização ou caracterização
    de subestações da rede de transmissão brasileira, incluindo consultas por nível de tensão, agente
    responsável, estado ou subsistema elétrico.
domain: transmissão
schema:
- name: subestacao
  physicalType: parquet
  logicalType: object
  physicalName: subestacao
  properties:
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Identificador do subsistema elétrico ao qual a subestação pertence (ex: SE, S, NE, N)'
    customProperties:
    - property: aliases
      value:
      - subsistema
      - código do subsistema
      - id subsistema
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
  - name: nom_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: Nome completo do subsistema elétrico ao qual a subestação pertence
    customProperties:
    - property: aliases
      value:
      - nome do subsistema
      - subsistema elétrico
      - região elétrica
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Nordeste
      - Norte
      - Sudeste/Centro-Oeste
      - Sul
  - name: id_estado
    physicalType: VARCHAR
    logicalType: string
    description: Sigla do estado (UF) onde a subestação está localizada
    customProperties:
    - property: aliases
      value:
      - UF
      - estado
      - sigla do estado
      - unidade federativa
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - AC
      - AL
      - AM
      - AP
      - BA
      - CE
      - DF
      - ES
      - GO
      - MA
      - MG
      - MS
      - MT
      - PA
      - PB
      - PE
      - PI
      - PR
      - RJ
      - RN
      - RO
      - RR
      - RS
      - SC
      - SE
      - SP
      - TO
  - name: nom_estado
    physicalType: VARCHAR
    logicalType: string
    description: Nome completo do estado onde a subestação está localizada
    customProperties:
    - property: aliases
      value:
      - nome do estado
      - estado
      - unidade federativa
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Acre
      - Alagoas
      - Amapá
      - Amazonas
      - Bahia
      - Ceará
      - Distrito Federal
      - Espírito Santo
      - Goiás
      - Maranhão
      - Mato Grosso
      - Mato Grosso do Sul
      - Minas Gerais
      - Paraná
      - Paraíba
      - Pará
      - Pernambuco
      - Piauí
      - Rio Grande do Norte
      - Rio Grande do Sul
      - Rio de Janeiro
      - Rondônia
      - Roraima
      - Santa Catarina
      - Sergipe
      - São Paulo
      - Tocantins
  - name: nom_agente_principal
    physicalType: VARCHAR
    logicalType: string
    description: Nome do agente (empresa) responsável pela operação ou propriedade da subestação
    customProperties:
    - property: aliases
      value:
      - agente
      - empresa responsável
      - transmissora
      - proprietário
      - concessionária
    - property: semanticType
      value: DIMENSION
  - name: id_subestacao
    physicalType: VARCHAR
    logicalType: string
    description: Identificador único da subestação no sistema ONS
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - código da subestação
      - id SE
      - identificador da subestação
    - property: semanticType
      value: IDENTIFIER
  - name: nom_subestacao
    physicalType: VARCHAR
    logicalType: string
    description: Nome completo da subestação conforme cadastro ONS
    customProperties:
    - property: aliases
      value:
      - nome da subestação
      - subestação
      - SE
    - property: semanticType
      value: DIMENSION
  - name: val_niveltensao
    physicalType: DOUBLE
    logicalType: number
    description: 'Nível de tensão base da subestação em quilovolts (kV), variando de 69 kV a 800 kV conforme
      a rede básica brasileira. Tipo semântico DOUBLE; tipo físico no Parquet pode ser VARCHAR devido
      ao formato de serialização.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - tensão
      - nível de tensão
      - tensão base
      - kV
      - voltagem
    - property: semanticType
      value: METRIC
    - property: unit
      value: kV
    - property: enum
      value:
      - 69.0
      - 88.0
      - 122.0
      - 127.0
      - 138.0
      - 140.0
      - 161.0
      - 230.0
      - 289.0
      - 345.0
      - 440.0
      - 500.0
      - 600.0
      - 765.0
      - 800.0
  - name: id_estacao
    physicalType: VARCHAR
    logicalType: string
    description: Identificador da estação associada à subestação, utilizado como referência interna no
      sistema ONS
    customProperties:
    - property: aliases
      value:
      - código da estação
      - id estação
      - estação
    - property: semanticType
      value: IDENTIFIER
  - name: num_barra
    physicalType: INTEGER
    logicalType: integer
    description: 'Número da barra elétrica associada à subestação no modelo computacional do sistema elétrico,
      utilizado em estudos de fluxo de potência e análise de contingências

      '
    customProperties:
    - property: aliases
      value:
      - barra
      - número de barra
      - barra elétrica
      - bus number
    - property: semanticType
      value: IDENTIFIER
  - name: val_latitude
    physicalType: VARCHAR
    logicalType: string
    description: 'Latitude geográfica da subestação em graus decimais. Tipo semântico DOUBLE; armazenada
      como VARCHAR no Parquet devido ao formato de serialização. Requer TRY_CAST(val_latitude AS DOUBLE)
      para uso numérico em cálculos geoespaciais.

      '
    customProperties:
    - property: aliases
      value:
      - latitude
      - coordenada latitude
      - lat
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_latitude AS DOUBLE)
    - property: unit
      value: graus decimais
  - name: val_longitude
    physicalType: VARCHAR
    logicalType: string
    description: 'Longitude geográfica da subestação em graus decimais. Tipo semântico DOUBLE; armazenada
      como VARCHAR no Parquet devido ao formato de serialização. Requer TRY_CAST(val_longitude AS DOUBLE)
      para uso numérico em cálculos geoespaciais.

      '
    customProperties:
    - property: aliases
      value:
      - longitude
      - coordenada longitude
      - lon
      - lng
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_longitude AS DOUBLE)
    - property: unit
      value: graus decimais
team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
