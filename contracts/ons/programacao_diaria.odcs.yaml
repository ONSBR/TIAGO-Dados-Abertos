    sql_patterns:
      geracaoprogramada_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_programacaodia AS TIMESTAMP)) AS mes,\n  TRIM(id_subsistema)\
          \ AS id_subsistema,\n  SUM(TRY_CAST(val_geracaoprogramada AS DOUBLE) * 24.0) / 1000 AS energia_gwh\n\
          FROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_programacaodia AS TIMESTAMP)) = {year}\n\
          GROUP BY 1, 2\nORDER BY 1, 2"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracaoprogramada
          grain: month
      inflexibilidade_por_usina:
        template: "SELECT nom_usina, tip_geracao,\n  SUM(TRY_CAST(val_inflexibilidade AS DOUBLE)) AS inflexibilidade_total_mw\n\
          FROM {source}\nWHERE din_programacaodia BETWEEN '{start_date}' AND '{end_date}'\n  AND tip_geracao\
          \ = 'TÉRMICA'\nGROUP BY 1, 2\nORDER BY 3 DESC\nLIMIT 20"
        output_unit: MW
        matches:
          output_modes:
          - ranking
          metrics:
          - inflexibilidade
          grain: usina
        validated_params:
          start_date: '2026-01-01'
          end_date: '2026-07-20'
      disponibilidade_vs_programada:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_programacaodia AS TIMESTAMP)) AS mes,\n  tip_geracao,\n\
          \  AVG(TRY_CAST(val_disponibilidade AS DOUBLE)) AS disponibilidade_media_mwmed,\n  AVG(TRY_CAST(val_geracaoprogramada\
          \ AS DOUBLE)) AS programada_media_mwmed\nFROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_programacaodia\
          \ AS TIMESTAMP)) = {year}\nGROUP BY 1, 2\nORDER BY 1, 2"
        output_unit: MWmed
        matches:
          output_modes:
          - comparison
          metrics:
          - disponibilidade
          - geracaoprogramada
          grain: month
    ambiguity_policy:
      default_assumptions:
      - when: geracao
        assume_metric: geracaoprogramada
        assume_output: total_energy
        assume_unit: GWh
        unless_mentions:
        - media
        - potencia
        - pico
        - instantaneo
        - MWmed
      - when: disponibilidade
        assume_metric: disponibilidade
        assume_output: average_power
        assume_unit: MWmed
        unless_mentions:
        - total
        - energia
        - GWh
      - when: inflexibilidade
        assume_metric: inflexibilidade
        assume_output: total
        assume_unit: MW
        unless_mentions:
        - media
        - pico
      - when: ordem de merito
        assume_metric: ordemmerito
        assume_output: total
        assume_unit: MW
        unless_mentions:
        - media
        - pico
      - when: exportacao
        assume_metric: exportacao
        assume_output: total
        assume_unit: MW
        unless_mentions:
        - media
      - when: falta de combustivel
        assume_metric: faltacombustivel
        assume_output: total
        assume_unit: MW
        unless_mentions:
        - media
      must_clarify_when:
      - ambiguity: energia_total_vs_potencia_media
        question: Você quer energia total no período (GWh) ou potência média programada (MWmed)?
        trigger_terms:
        - quanto foi gerado
        - total de energia
        - potencia media
        - media de geracao
      - ambiguity: patamar_especifico_vs_agregado
        question: Você quer o valor para um patamar semi-horário específico (1-48) ou agregado para o
          dia inteiro?
        trigger_terms:
        - patamar
        - semi-horario
        - intervalo
        - bloco 30 minutos
      - ambiguity: tipo_geracao_nao_especificado
        question: Você quer filtrar por tipo de geração (HIDRÁULICA, TÉRMICA, EÓLICA, SOLAR) ou considerar
          todas as fontes?
        trigger_terms:
        - por fonte
        - por tipo
        - hidro ou termica
      redirect_when:
      - user_mentions:
        - nuclear
        - angra
        reason: tip_geracao nao contem valor NUCLEAR; usinas nucleares nao estao neste dataset.
        redirect: geracao-usina-2 com filtro de tipo de combustivel nuclear
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Schema nao contem coluna MMGD separada.
        redirect: dataset com coluna val_germmgd quando disponivel
      - user_mentions:
        - geracao verificada
        - geracao realizada
        - despacho realizado
        - historico de despacho
        reason: Dataset contem apenas dados programados; dados realizados estao em outro dataset.
        redirect: geracao-usina-2 ou descontinuado-dados-do-historico-de-despacho-de-energia-de-01-2021-a-09-2024
      - user_mentions:
        - fator de capacidade
        reason: Metrica exclusiva de fator-capacidade-2; nao calculavel diretamente neste dataset.
        redirect: fator-capacidade-2
      - user_mentions:
        - PLD
        - preco spot
        - custo marginal operacao
        - CMO
        reason: Dataset nao contem colunas de preco ou PLD.
        redirect: dataset de preco spot CCEE quando disponivel
      - user_mentions:
        - EAR
        - energia armazenada
        - nivel reservatorio
        - cota reservatorio
        reason: Dataset nao contem colunas de armazenamento ou nivel de reservatorio.
        redirect: ear-diario-por-reservatorio
      - user_mentions:
        - carga
        - consumo
        - demanda
        reason: Dataset nao contem colunas de carga ou consumo; apenas geracao programada por usina.
        redirect: dataset de carga quando disponivel
- property: fewShotQueries
  value:
  - question: Qual foi a geração programada total (em MW médio) por subsistema e tipo de geração em cada
      dia disponível?
    sql: "SELECT\n  din_programacaodia::DATE AS data_programacao,\n  id_subsistema,\n  tip_geracao,\n\
      \  AVG(TRY_CAST(val_geracaoprogramada AS DOUBLE)) AS media_geracao_mw,\n  SUM(TRY_CAST(val_geracaoprogramada\
      \ AS DOUBLE)) AS soma_geracao_mw\nFROM read_parquet('s3://ons-aws-prod-opendata/dataset/programacao_diaria/*.parquet')\n\
      WHERE id_subsistema != 'SIN'\nGROUP BY din_programacaodia::DATE, id_subsistema, tip_geracao\nORDER\
      \ BY data_programacao DESC, id_subsistema, tip_geracao\nLIMIT 100;"
  - question: Como se distribui a inflexibilidade programada ao longo dos 48 patamares do dia para cada
      tipo de geração?
    sql: "SELECT\n  num_patamar,\n  tip_geracao,\n  AVG(TRY_CAST(val_inflexibilidade AS DOUBLE)) AS media_inflexibilidade_mw,\n\
      \  MAX(TRY_CAST(val_inflexibilidade AS DOUBLE)) AS max_inflexibilidade_mw,\n  COUNT(DISTINCT cod_exibicaousina)\
      \ AS qtd_usinas\nFROM read_parquet('s3://ons-aws-prod-opendata/dataset/programacao_diaria/*.parquet')\n\
      WHERE TRY_CAST(val_inflexibilidade AS DOUBLE) > 0\n  AND id_subsistema != 'SIN'\nGROUP BY num_patamar,\
      \ tip_geracao\nORDER BY num_patamar, tip_geracao\nLIMIT 100;"
  - question: Quais usinas termelétricas declararam maior falta de combustível na programação diária e
      em quais períodos?
    sql: "SELECT\n  cod_exibicaousina,\n  nom_usina,\n  id_subsistema,\n  din_programacaodia::DATE AS\
      \ data_programacao,\n  SUM(TRY_CAST(val_faltacombustivel AS DOUBLE)) AS soma_falta_combustivel_mw,\n\
      \  AVG(TRY_CAST(val_faltacombustivel AS DOUBLE)) AS media_falta_combustivel_mw,\n  COUNT(*) AS qtd_patamares_afetados\n\
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/programacao_diaria/*.parquet')\nWHERE TRY_CAST(val_faltacombustivel\
      \ AS DOUBLE) > 0\n  AND tip_geracao = 'TERMICA'\nGROUP BY cod_exibicaousina, nom_usina, id_subsistema,\
      \ din_programacaodia::DATE\nORDER BY soma_falta_combustivel_mw DESC\nLIMIT 50;"
