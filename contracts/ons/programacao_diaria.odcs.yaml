  quality:
  - type: custom
    engine: soda
    implementation: "checks for programacao_diaria:\n  - row_count > 0:\n      name: Tabela não pode estar\
      \ vazia\n\n  # Referential integrity\n  - invalid_count(tip_geracao) = 0:\n      valid values:\n\
      \        - 'EÓLICA'\n        - 'HIDRÁULICA'\n        - 'SOLAR'\n        - 'TÉRMICA'\n      name:\
      \ tip_geracao deve ser um dos valores válidos\n  - invalid_count(nom_modalidadeoperacao) = 0:\n\
      \      valid values:\n        - 'TIPO I'\n        - 'TIPO II-A'\n        - 'TIPO II-B'\n       \
      \ - 'TIPO II-C'\n        - 'TIPO III'\n      name: nom_modalidadeoperacao deve ser um dos valores\
      \ válidos\n  - invalid_count(id_subsistema) = 0:\n      valid values:\n        - 'N'\n        -\
      \ 'NE'\n        - 'S'\n        - 'SE'\n      name: id_subsistema deve ser um dos valores válidos\n\
      \  - invalid_count(nom_subsistema) = 0:\n      valid values:\n        - 'SUBSISTEMA NORDESTE'\n\
      \        - 'SUBSISTEMA NORTE'\n        - 'SUBSISTEMA SUDESTE'\n        - 'SUBSISTEMA SUL'\n    \
      \  name: nom_subsistema deve ser um dos valores válidos\n  - invalid_count(id_estado) = 0:\n   \
      \   valid values:\n        - 'AC'\n        - 'AL'\n        - 'AM'\n        - 'AP'\n        - 'AR'\n\
      \        - 'BA'\n        - 'CE'\n        - 'DF'\n        - 'ES'\n        - 'GO'\n        - 'MA'\n\
      \        - 'MG'\n        - 'MS'\n        - 'MT'\n        - 'PA'\n        - 'PB'\n        - 'PE'\n\
      \        - 'PI'\n        - 'PR'\n        - 'PY'\n        - 'RJ'\n        - 'RN'\n        - 'RO'\n\
      \        - 'RR'\n        - 'RS'\n        - 'SC'\n        - 'SE'\n        - 'SP'\n        - 'TO'\n\
      \        - 'UY'\n      name: id_estado deve ser um dos valores válidos\n  - invalid_count(nom_estado)\
      \ = 0:\n      valid values:\n        - 'ACRE'\n        - 'ALAGOAS'\n        - 'AMAPA'\n        -\
      \ 'AMAZONAS'\n        - 'BAHIA'\n        - 'CEARA'\n        - 'DADOS REF. ARGENTINA'\n        -\
      \ 'DADOS REF. PARAGUAI'\n        - 'DADOS REF. URUGUAI'\n        - 'DISTRITO FEDERAL'\n        -\
      \ 'ESPIRITO SANTO'\n        - 'GOIAS'\n        - 'MARANHAO'\n        - 'MATO GROSSO'\n        -\
      \ 'MATO GROSSO DO SUL'\n        - 'MINAS GERAIS'\n        - 'PARA'\n        - 'PARAIBA'\n      \
      \  - 'PARANA'\n        - 'PERNAMBUCO'\n        - 'PIAUI'\n        - 'RIO DE JANEIRO'\n        -\
      \ 'RIO GRANDE DO NORTE'\n        - 'RIO GRANDE DO SUL'\n        - 'RONDONIA'\n        - 'RORAIMA'\n\
      \        - 'SANTA CATARINA'\n        - 'SAO PAULO'\n        - 'SERGIPE'\n        - 'TOCANTINS'\n\
      \      name: nom_estado deve ser um dos valores válidos\n\n  # Circuit breaker: colunas numéricas\
      \ VARCHAR (formato de origem)\n  - missing_percent(val_geracaoprogramada) < 5:\n      name: val_geracaoprogramada\
      \ não pode ter >5% nulos\n  - missing_percent(val_disponibilidade) < 5:\n      name: val_disponibilidade\
      \ não pode ter >5% nulos\n  - missing_percent(val_ordemmerito) < 5:\n      name: val_ordemmerito\
      \ não pode ter >5% nulos\n  - missing_percent(val_inflexibilidade) < 5:\n      name: val_inflexibilidade\
      \ não pode ter >5% nulos\n  - missing_percent(val_uc) < 5:\n      name: val_uc não pode ter >5%\
      \ nulos\n  - missing_percent(val_razaoeletrica) < 5:\n      name: val_razaoeletrica não pode ter\
      \ >5% nulos\n  - missing_percent(val_geracaoenergetica) < 5:\n      name: val_geracaoenergetica\
      \ não pode ter >5% nulos\n  - missing_percent(val_gesubgsub) < 5:\n      name: val_gesubgsub não\
      \ pode ter >5% nulos\n  - missing_percent(val_exportacao) < 5:\n      name: val_exportacao não pode\
      \ ter >5% nulos\n  - missing_percent(val_reposicaoexportacao) < 5:\n      name: val_reposicaoexportacao\
      \ não pode ter >5% nulos\n  - missing_percent(val_faltacombustivel) < 5:\n      name: val_faltacombustivel\
      \ não pode ter >5% nulos\n\n  # Baseline de volume — margem ±20% do row_count validado\n  - row_count\
      \ between 290304 and 435456:\n      name: Volume esperado entre 290,304 e 435,456 registros\n\n\
      \  # Unicidade da chave primária composta ['din_programacaodia', 'num_patamar', 'cod_exibicaousina']\
      \ (candidata LLM)\n  - failed rows:\n      name: Chave composta (din_programacaodia, num_patamar,\
      \ cod_exibicaousina) não deve ter duplicatas\n      fail query: |\n        SELECT * FROM programacao_diaria\n\
      \        WHERE (din_programacaodia, num_patamar, cod_exibicaousina) IN (\n          SELECT din_programacaodia,\
      \ num_patamar, cod_exibicaousina FROM programacao_diaria\n          GROUP BY din_programacaodia,\
      \ num_patamar, cod_exibicaousina\n          HAVING COUNT(*) > 1\n        )\n\n  # Nulos em nom_modalidadeoperacao\
      \ — alerta de qualidade (real=1.6%, threshold=6.6%)\n  - missing_percent(nom_modalidadeoperacao)\
      \ < 6.6:\n      name: nom_modalidadeoperacao não deve ter >6.6% nulos\n\n  # Nulos em id_estado\
      \ — alerta de qualidade (real=21.7%, threshold=43.4%)\n  - missing_percent(id_estado) < 43.4:\n\
      \      name: id_estado não deve ter >43.4% nulos\n\n  # Nulos em nom_estado — alerta de qualidade\
      \ (real=21.7%, threshold=43.4%)\n  - missing_percent(nom_estado) < 43.4:\n      name: nom_estado\
      \ não deve ter >43.4% nulos\n\n  # Freshness: din_programacaodia deve ter dados recentes (SLA: Atualizado\
      \ diariamente pelo ONS após fechamento da programaç)\n  - freshness(din_programacaodia) < 3d:\n\
      \      name: din_programacaodia não pode ter dados com mais de 3 dias de atraso\n"
