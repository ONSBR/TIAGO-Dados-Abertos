- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/programacao_diaria/*.parquet
  format: parquet
description:
  purpose: Suportar operadores do ONS, agentes de geração e analistas de mercado no acompanhamento, auditoria
    e análise da programação operativa diária do SIN, permitindo decisões de despacho, verificação de
    ordem de mérito, identificação de inflexibilidades, análise de equilíbrio carga-geração por subsistema
    e avaliação de restrições operativas por usina e patamar semi-horário.
  limitations: Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização (object→UTF8).
    Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização. Coluna armazenada como
    VARCHAR no Parquet devido a formato de serialização.
  usage: Recuperar este dataset quando a pergunta envolver valores programados de geração, disponibilidade
    ou despacho de usinas do SIN em base semi-horária (patamares de 30 minutos).
domain: geração
schema:
- name: programacao_diaria
  physicalType: parquet
  logicalType: object
  physicalName: programacao_diaria
  properties:
  - name: din_programacaodia
    physicalType: VARCHAR
    logicalType: timestamp
    description: 'Data e hora de referência do dia de programação. Representa o dia para o qual a programação
      diária foi elaborada. Combinada com num_patamar, identifica univocamente o intervalo semi-horário
      programado.

      '
    primaryKey: true
    customProperties:
    - property: castExpression
      value: TRY_CAST(din_programacaodia AS TIMESTAMP)
    - property: aliases
      value:
      - data de programação
      - dia de programação
      - data do despacho
      - din_programacao
    - property: semanticType
      value: TIMESTAMP
  - name: num_patamar
    physicalType: BIGINT
    logicalType: integer
    description: 'Número do patamar semi-horário dentro do dia de programação. Varia de 1 a 48, onde 1
      representa o intervalo 00:00–00:30 e 48 representa o intervalo 23:30–24:00. Cada patamar corresponde
      a um bloco de 30 minutos.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - patamar
      - intervalo semi-horário
      - bloco de 30 minutos
      - half-hour period
