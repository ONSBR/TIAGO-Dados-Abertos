  description: Atualizado diariamente pelo ONS após fechamento da programação diária; dados são recorrentemente
    revisados após publicação inicial no processo de consistência operativa.
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/programacao_diaria
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - quanto foi programado para gerar
  - geracao programada do dia
  - despacho programado das usinas
  - o que o ons programou
  - previsao de geracao
  - quanto vai gerar amanha
  - geracao prevista das usinas
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver valores programados de geração, disponibilidade
    ou despacho de usinas do SIN em base semi-horária (patamares de 30 minutos). Também relevante para
    consultas sobre ordem de mérito, inflexibilidade, geração por Usina Controlada, exportação programada
    ou restrições por falta de combustível no contexto da programação operativa diária do ONS.
- property: agentInstructions
  value: '- [nom_modalidadeoperacao] 2,3% dos registros possuem nom_modalidadeoperacao nulo. Provavelmente
    corresponde a usinas ou patamares sem modalidade operativa classificada no sistema de programação
    diária do ONS.


    - [id_estado] 49,2% dos registros possuem id_estado nulo. Indica que aproximadamente metade das usinas
    no dataset não possui localização estadual definida, o que é esperado para usinas virtuais, agregados
    de subsistema ou usinas com cadastro incompleto no ONS.


    - [nom_estado] 49,2% dos registros possuem nom_estado nulo, alinhado com id_estado. Confirma que a
    ausência de estado é estrutural para determinadas usinas, não um problema isolado de uma das colunas.


    - [val_geracaoprogramada] Coluna armazenada como VARCHAR devido ao formato de serialização. Contém
    valores numéricos representando geração programada em MW. Qualquer agregação requer TRY_CAST para
    DOUBLE.


    - [val_disponibilidade] Coluna armazenada como VARCHAR devido ao formato de serialização. Contém valores
    numéricos representando disponibilidade em MW. Requer TRY_CAST para uso em agregações analíticas.


    - [val_ordemmerito] Coluna armazenada como VARCHAR devido ao formato de serialização. Contém valores
    numéricos representando despacho por ordem de mérito em MW. Requer TRY_CAST para uso em agregações
    analíticas.


    - [val_inflexibilidade] Coluna armazenada como VARCHAR devido ao formato de serialização. Contém valores
    numéricos representando inflexibilidade em MW. Requer TRY_CAST para uso em agregações analíticas.


    - [val_uc] Coluna armazenada como VARCHAR devido ao formato de serialização. Contém valores numéricos
    representando Uso de Capacidade em MW. Requer TRY_CAST para uso em agregações analíticas.


    - [val_razaoeletrica] Coluna armazenada como VARCHAR devido ao formato de serialização. Contém valores
    numéricos representando razão elétrica (adimensional). Requer TRY_CAST para uso em agregações analíticas.


    - [val_geracaoenergetica] Coluna armazenada como VARCHAR devido ao formato de serialização. Contém
    valores numéricos representando geração energética em MWmed. Requer TRY_CAST para uso em agregações
    analíticas.


    - [val_gesubgsub] Coluna armazenada como VARCHAR devido ao formato de serialização. Contém valores
    numéricos representando geração subsistema→subsistema em MW. Requer TRY_CAST para uso em agregações
    analíticas.


    - [val_exportacao] Coluna armazenada como VARCHAR devido ao formato de serialização. Contém valores
    numéricos representando exportação programada em MW. Requer TRY_CAST para uso em agregações analíticas.


    - [val_reposicaoexportacao] Coluna armazenada como VARCHAR devido ao formato de serialização. Contém
    valores numéricos representando reposição de exportação em MW. Requer TRY_CAST para uso em agregações
    analíticas.


    - [val_faltacombustivel] Coluna armazenada como VARCHAR devido ao formato de serialização. Contém
    valores numéricos representando falta de combustível em MW. Requer TRY_CAST para uso em agregações
    analíticas.


    - [din_programacaodia] Dataset cobre 2024-10-01 a 2025-08-30 com 333 arquivos parquet. Considerando
    granularidade diária de arquivos, o período esperado seria ~334 dias. Verificar se há dias sem arquivo
    ou com registros faltantes, especialmente considerando que os dados são atualizados recorrentemente
    após publicação (processo de consistência).


    - [num_patamar] num_patamar deve variar estritamente entre 1 e 48 para granularidade semi-horária.
    Verificar existência de registros fora deste intervalo que indicariam corrupção de dados ou mudança
    de granularidade.


    - [id_subsistema] Valores com trailing spaces detectados em ''id_subsistema''. Use TRIM() em filtros
    WHERE para evitar perda de registros.

    - [nom_subsistema] Valores com trailing spaces detectados em ''nom_subsistema''. Use TRIM() em filtros
    WHERE para evitar perda de registros.

    - [nom_estado] Valores com trailing spaces detectados em ''nom_estado''. Use TRIM() em filtros WHERE
    para evitar perda de registros.'
- property: typicalQuestions
  value:
  - Qual foi a geração programada total por subsistema no dia 2025-01-15 em cada patamar semi-horário?
  - Quais usinas térmicas apresentaram maior inflexibilidade programada no mês de janeiro de 2025?
  - Qual a diferença entre disponibilidade declarada e geração programada por tipo de geração em fevereiro
    de 2025?
  - Quais usinas tiveram restrição por falta de combustível registrada na programação diária?
  - Como evoluiu a participação da geração eólica na programação diária do subsistema Nordeste ao longo
    de 2024-2025?
