version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:programacao_diaria
name: programacao_diaria
tenant: ons
tags:
- ONS
- PD
- SIN
- despacho
- despacho programado
- geracao
- geração programada semi-horária
- inflexibilidade
- ordem-de-merito
- programacao-diaria
