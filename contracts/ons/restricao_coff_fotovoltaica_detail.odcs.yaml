    sql_patterns:
      curtailment_mensal_por_usina:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  nom_usina,\n\
          \  id_subsistema,\n  SUM(GREATEST(GREATEST(val_geracaoestimada, 0) - GREATEST(val_geracaoverificada,\
          \ 0), 0) * 0.5) / 1000 AS curtailment_gwh\nFROM {source}\nWHERE EXTRACT(YEAR FROM din_instante)\
          \ = {year}\nGROUP BY 1, 2, 3\nORDER BY curtailment_gwh DESC"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - curtailment
          grain: month
        validated_params:
          year: '2026'
      percentual_curtailment_mensal:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  nom_usina,\n\
          \  id_subsistema,\n  100.0 * SUM(GREATEST(GREATEST(val_geracaoestimada, 0) - GREATEST(val_geracaoverificada,\
          \ 0), 0))\n    / NULLIF(SUM(GREATEST(val_geracaoestimada, 0)), 0) AS pct_curtailment\nFROM {source}\n\
          WHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1, 2, 3\nORDER\
          \ BY pct_curtailment DESC"
        output_unit: '%'
        matches:
          output_modes:
          - average
          metrics:
          - percentual_curtailment
          grain: month
        validated_params:
          year: '2026'
      irradiancia_valida_mensal:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  id_subsistema,\n\
          \  id_estado,\n  AVG(val_irradianciaverificado) AS irradiancia_media_wm2\nFROM {source}\nWHERE\
          \ flg_dadoirradianciainvalido = false\n  AND val_irradianciaverificado >= 0\n  AND EXTRACT(YEAR\
          \ FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1, 2, 3\nORDER BY 1, 2, 3"
        output_unit: W/m2
        matches:
          output_modes:
          - average
          metrics:
          - irradianciaverificado
          grain: month
        validated_params:
          year: '2026'
      constrained_off_severo:
        template: "SELECT\n  din_instante,\n  nom_usina,\n  id_subsistema,\n  val_irradianciaverificado,\n\
          \  val_geracaoestimada,\n  val_geracaoverificada,\n  val_geracaoestimada - val_geracaoverificada\
          \ AS curtailment_mw\nFROM {source}\nWHERE flg_dadoirradianciainvalido = false\n  AND val_irradianciaverificado\
          \ > {irradiancia_threshold}\n  AND val_geracaoverificada < {geracao_threshold}\nORDER BY curtailment_mw\
          \ DESC\nLIMIT 100"
        output_unit: MW
        matches:
          output_modes:
          - time_series
          metrics:
          - curtailment
          grain: 30min
        validated_params:
          irradiancia_threshold: '-2.0'
          geracao_threshold: '134.044'
      restricao_coff_fotovoltaica_detail_mensal_gwh:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracaoestimada\
          \ AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1) AS val_geracaoestimada_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracaoverificada\
          \ AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1) AS val_geracaoverificada_gwh\nFROM {source}\nWHERE\
          \ EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1\nORDER BY 1"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          grain: month
        validated_params:
          year: '2025'
      restricao_coff_fotovoltaica_detail_mensal_mwmed:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracaoestimada\
          \ AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante AS TIMESTAMP)), 1) AS val_geracaoestimada_mwmed,\n\
          \  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracaoverificada AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT\
          \ TRY_CAST(din_instante AS TIMESTAMP)), 1) AS val_geracaoverificada_mwmed\nFROM {source}\nWHERE\
          \ EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1\nORDER BY 1"
        output_unit: MWmed
        matches:
          output_modes:
          - average_power
          grain: month
        validated_params:
          year: '2025'
    ambiguity_policy:
      default_assumptions:
      - when: curtailment
        assume_metric: curtailment
        assume_output: total_energy
        assume_unit: GWh
        unless_mentions:
        - percentual
        - taxa
        - fracao
        - media
        - potencia
      - when: geracao solar
        assume_metric: geracaoverificada
        assume_output: total_energy
        assume_unit: GWh
        unless_mentions:
        - estimada
        - prevista
        - sem restricao
        - potencial
        - media
        - potencia
        - pico
      - when: geracao estimada
        assume_metric: geracaoestimada
        assume_output: total_energy
        assume_unit: GWh
        unless_mentions:
        - media
        - potencia
        - pico
      - when: irradiancia
        assume_metric: irradianciaverificado
        assume_output: average
        assume_unit: W/m2
        unless_mentions:
        - total
        - soma
        - maximo
        - pico
      must_clarify_when:
      - ambiguity: curtailment_absoluto_vs_percentual
        question: Você quer o curtailment em energia absoluta (GWh/MWh) ou como percentual da geração
          estimada (%)?'
        trigger_terms:
        - quanto foi cortado
        - volume de corte
        - restricao solar
      - ambiguity: usina_individual_vs_complexo
        question: Você quer o resultado por usina individual ou agregado por complexo/conjunto de usinas?
        trigger_terms:
        - complexo solar
        - conjunto de usinas
        - parque solar
      - ambiguity: incluir_dados_invalidos_irradiancia
        question: Deseja incluir registros com flag de iradiância inválida (flg_dadoirradianciainvalido=true)
          na análise?
        trigger_terms:
        - irradiancia
        - GHI
        - radiacao solar
        - insolacao
      redirect_when:
      - user_mentions:
        - nuclear
        - angra
        reason: Dataset cobre exclusivamente usinas fotovoltaicas.
        redirect: geracao-usina-2 com filtro por combustivel nuclear
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Dataset nao contem registros de micro/minigeracao distribuida.
        redirect: dataset especifico de MMGD
      - user_mentions:
        - curtailment eolico
        - restricao eolica
        - constrained-off eolico
        reason: Curtailment eolico esta em dataset separado.
        redirect: restricao_coff_eolica_detail
      - user_mentions:
        - tipo I
        - tipo 1
        reason: Enum fisico de nom_modalidadeoperacao nao contem Tipo I nos dados amostrados. Verificar
          dataset agregado.
        redirect: restricao_coff_fotovoltaica para verificar disponibilidade de Tipo I
- property: fewShotQueries
  value:
  - question: Qual foi a energia constrained-off total (MWh) das usinas fotovoltaicas por subsistema e
      mês em 2025?
    sql: SELECT id_subsistema, DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, SUM((GREATEST(val_geracaoestimada
      - val_geracaoverificada, 0)) * 0.5) * 0.5 AS energia_coff_mwh FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_fotovoltaica_detail_tm/*.parquet')
      WHERE YEAR(din_instante) = 2025 GROUP BY id_subsistema, DATE_TRUNC('month', TRY_CAST(din_instante
      AS TIMESTAMP)) ORDER BY mes, id_subsistema;
  - question: Quais são as 20 usinas fotovoltaicas com maior energia constrained-off acumulada no período
      disponível?
    sql: SELECT id_ons, nom_usina, id_estado, nom_conjuntousina, nom_modalidadeoperacao, SUM((GREATEST(val_geracaoestimada
      - val_geracaoverificada, 0)) * 0.5) / 1000 * 0.5 AS energia_coff_gwh, COUNT(*) AS total_intervalos
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_fotovoltaica_detail_tm/*.parquet')
      GROUP BY id_ons, nom_usina, id_estado, nom_conjuntousina, nom_modalidadeoperacao ORDER BY energia_coff_gwh
      DESC LIMIT 20;
  - question: Qual a proporção de intervalos com irradiância inválida por usina em cada mês de 2024?
    sql: SELECT id_ons, nom_usina, DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, COUNT(*)
      AS total_intervalos, SUM(CASE WHEN flg_dadoirradianciainvalido THEN 1 ELSE 0 END) AS intervalos_invalidos,
      ROUND( 100.0 * SUM(CASE WHEN flg_dadoirradianciainvalido THEN 1 ELSE 0 END) / COUNT(*), 2 ) AS pct_invalido
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/restricao_coff_fotovoltaica_detail_tm/*.parquet')
      WHERE YEAR(din_instante) = 2024 GROUP BY id_ons, nom_usina, DATE_TRUNC('month', TRY_CAST(din_instante
      AS TIMESTAMP)) HAVING SUM(CASE WHEN flg_dadoirradianciainvalido THEN 1 ELSE 0 END) > 0 ORDER BY
      pct_invalido DESC LIMIT 50;
