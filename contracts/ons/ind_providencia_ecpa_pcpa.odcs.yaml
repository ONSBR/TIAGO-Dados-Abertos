    sql_patterns:
      ecpa_medio_sin_ultimos_12_meses:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_referencia AS TIMESTAMP)) AS mes,\n  AVG(val_ecpa)\
          \ AS ecpa_medio\nFROM {source}\nWHERE dsc_agregacao = 'Sistema'\n  AND din_referencia >= CURRENT_DATE\
          \ - INTERVAL '12 months'\nGROUP BY 1\nORDER BY 1"
        output_unit: indice [0,1]
        matches:
          output_modes:
          - time_series
          - average
          metrics:
          - ecpa
          grain: month
      ranking_agentes_pcpa_ano:
        template: "SELECT dsc_caracteristica AS agente,\n  AVG(val_pcpa) AS pcpa_medio\nFROM {source}\n\
          WHERE dsc_agregacao = 'Agente'\n  AND EXTRACT(YEAR FROM TRY_CAST(din_referencia AS TIMESTAMP))\
          \ = {year}\nGROUP BY 1\nORDER BY pcpa_medio ASC"
        output_unit: indice [0,1]
        matches:
          output_modes:
          - ranking
          metrics:
          - pcpa
          grain: year
        validated_params:
          year: '2026'
      providencias_atrasadas_vs_antecipadas_agente:
        template: "SELECT dsc_caracteristica AS agente,\n  SUM(num_nprat_atrasadas) AS atrasadas,\n  SUM(num_npra_antecipadas)\
          \ AS antecipadas,\n  SUM(num_nprc_concluidas) AS concluidas\nFROM {source}\nWHERE dsc_agregacao\
          \ = 'Agente'\n  AND EXTRACT(YEAR FROM din_referencia) = {year}\nGROUP BY 1\nORDER BY atrasadas\
          \ DESC"
        output_unit: providencias
        matches:
          output_modes:
          - comparison
          - ranking
          metrics:
          - num_nprat_atrasadas
          - num_npra_antecipadas
          - num_nprc_concluidas
          grain: year
        validated_params:
          year: '2026'
      ecpa_calculado_manual:
        template: "SELECT dsc_caracteristica,\n  din_referencia,\n  num_nprc_concluidas,\n  num_nprp_programadas,\n\
          \  CASE\n    WHEN num_nprp_programadas > 0\n    THEN num_nprc_concluidas / num_nprp_programadas\n\
          \    ELSE NULL\n  END AS ecpa_calculado,\n  val_ecpa AS ecpa_oficial\nFROM {source}\nWHERE dsc_agregacao\
          \ = 'Agente'\nORDER BY din_referencia DESC"
        output_unit: indice [0,1]
        matches:
          output_modes:
          - comparison
          metrics:
          - ecpa
          - num_nprc_concluidas
          - num_nprp_programadas
          grain: month
    ambiguity_policy:
      default_assumptions:
      - when: usuario pergunta sobre ECPA sem especificar agregacao
        assume_metric: ecpa
        assume_output: average
        assume_filter: dsc_agregacao = 'Sistema'
        note: Assumir nivel Sistema (SIN) como padrao para visao consolidada
      - when: usuario pergunta sobre PCPA sem especificar agregacao
        assume_metric: pcpa
        assume_output: average
        assume_filter: dsc_agregacao = 'Sistema'
        note: Assumir nivel Sistema (SIN) como padrao para visao consolidada
      - when: usuario pergunta sobre ranking de agentes sem especificar metrica
        assume_metric: ecpa
        assume_output: ranking
        assume_filter: dsc_agregacao = 'Agente'
        note: Assumir ECPA como metrica principal de desempenho de manutencao
      must_clarify_when:
      - ambiguity: nivel_de_agregacao
        question: Você quer os dados por Agente, por Gestor de providências, por Área de atuação do agente
          ou para o Sistema (SIN) como um todo?
        trigger_terms:
        - todos
        - geral
        - consolidado
        - total
        - nivel
        - agregacao
      - ambiguity: metrica_ecpa_vs_pcpa
        question: 'Você quer o índice ECPA (evolução do cumprimento: concluídas/programadas) ou o índice
          PCPA (pontualidade: concluídas no prazo/concluídas)?'
        trigger_terms:
        - cumprimento
        - indicador de manutencao
        - desempenho de manutencao
        - indice de manutencao
      - ambiguity: contagem_vs_indice
        question: Você quer o índice calculado (val_ecpa ou val_pcpa, entre 0 e 1) ou a contagem bruta
          de providências (programadas, concluídas, atrasadas, antecipadas)?
        trigger_terms:
        - quantidade
        - numero
        - quantas
        - volume
        - contagem
      redirect_when:
      - user_mentions:
        - usina
        - ceg
        - itaipu
        - ranking de usinas
        - planta
        reason: Schema nao contem CEG, usina ou identificador fisico de usina.
        redirect: geracao-usina-2
      - user_mentions:
        - nuclear
        - angra
        reason: Schema nao contem coluna ou dimensao nuclear separada.
        redirect: geracao-usina-2 com filtro de combustivel/tipo quando disponivel
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Schema nao contem coluna MMGD separada.
        redirect: dataset com coluna val_germmgd/val_ger_mmgd quando disponivel
      - user_mentions:
        - carga interrompida
        - ciper
        reason: CIPER e indicador de confiabilidade distinto de ECPA/PCPA.
        redirect: ind_confiarb_ciper
      - user_mentions:
        - energia nao suprida
        - ens
        reason: ENS e indicador de confiabilidade distinto de ECPA/PCPA.
        redirect: ind_confiarb_energianaosuprida
      - user_mentions:
        - dreq
        - freq
        - frequencia de interrupcao
        - duracao de interrupcao
        reason: Indicadores DREQ/FREQ pertencem a dataset de confiabilidade especifico.
        redirect: ind_confiarb_dreq_freq
      - user_mentions:
        - severidade
        - perturbacao
        reason: Indicador de severidade pertence a dataset de confiabilidade especifico.
        redirect: ind_confiarb_severidade
      - user_mentions:
        - robustez
        reason: Indicador de robustez pertence a dataset de confiabilidade especifico.
        redirect: ind_confiarb_robustez
- property: fewShotQueries
  value:
  - question: Como evoluíram os indicadores ECPA e PCPA do SIN ao longo do tempo?
    sql: SELECT din_referencia, val_ecpa, val_pcpa, num_nprc_concluidas, num_nprp_programadas, num_nprat_atrasadas,
      num_npra_antecipadas, num_nprcp_concluidas_prazo FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_providencia_ecpa_pcpa/*.parquet')
      WHERE dsc_agregacao = 'SIN' AND dsc_caracteristica = 'SIN' ORDER BY din_referencia ASC;
  - question: Quais agentes tiveram menor pontualidade no cumprimento de providências no mês mais recente?
    sql: SELECT dsc_caracteristica AS agente, din_referencia, val_pcpa, val_ecpa, num_nprc_concluidas,
      num_nprat_atrasadas FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_providencia_ecpa_pcpa/*.parquet')
      WHERE dsc_agregacao = 'Agente' AND din_referencia = ( SELECT MAX(din_referencia) FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_providencia_ecpa_pcpa/*.parquet')
      WHERE dsc_agregacao = 'Agente' ) ORDER BY val_pcpa ASC LIMIT 20;
  - question: Quais agentes melhoraram ou pioraram o índice ECPA entre 2023 e 2024?
    sql: WITH ecpa_2023 AS ( SELECT dsc_caracteristica AS agente, AVG(val_ecpa) AS ecpa_medio_2023 FROM
      read_parquet('s3://ons-aws-prod-opendata/dataset/ind_providencia_ecpa_pcpa/*.parquet') WHERE dsc_agregacao
      = 'Agente' AND din_referencia >= TIMESTAMP '2023-01-01' AND din_referencia < TIMESTAMP '2024-01-01'
      GROUP BY dsc_caracteristica ), ecpa_2024 AS ( SELECT dsc_caracteristica AS agente, AVG(val_ecpa)
      AS ecpa_medio_2024 FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_providencia_ecpa_pcpa/*.parquet')
      WHERE dsc_agregacao = 'Agente' AND din_referencia >= TIMESTAMP '2024-01-01' AND din_referencia <
      TIMESTAMP '2025-01-01' GROUP BY dsc_caracteristica ) SELECT a.agente, a.ecpa_medio_2023, b.ecpa_medio_2024,
      (b.ecpa_medio_2024 - a.ecpa_medio_2023) AS variacao_ecpa FROM ecpa_2023 a INNER JOIN ecpa_2024 b
      ON a.agente = b.agente ORDER BY variacao_ecpa ASC LIMIT 30;
