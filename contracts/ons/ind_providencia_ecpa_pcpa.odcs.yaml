version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:ind_providencia_ecpa_pcpa
name: ind_providencia_ecpa_pcpa
tenant: ons
tags:
- ECPA
- ECPA PCPA cumprimento providências manutenção
- PCPA
- Procedimentos de Rede ONS
- Submodulo 9.5
- agentes distribuidores
- agentes transmissores
- conformidade operacional
- cumprimento de providencias
- indicadores de manutencao ONS
- indicadores de qualidade
- pontualidade de manutencao
- pontualidade de providencias
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/ind_providencia_ecpa_pcpa/*.parquet
  format: parquet
description:
  purpose: Monitorar o grau de atendimento às providências de manutenção programadas pelos agentes do
    setor elétrico brasileiro (transmissores e distribuidores), suportando decisões de gestão de conformidade
    operacional pelo ONS, ANEEL e pelos próprios agentes. Utilizado por fiscalizadores regulatórios para
    acompanhamento de desempenho, por gestores de manutenção para identificação de desvios e por analistas
    de qualidade operacional para correlacionar cumprimento de manutenções com disponibilidade e confiabilidade
    do sistema elétrico nacional.
  limitations: O valor máximo de num_nprp_programadas (2291. val_ecpa pode assumir valor 1. val_pcpa pode
    assumir valor 1.
  usage: Recuperar este dataset quando a pergunta envolver indicadores de cumprimento ou pontualidade
    de providências de manutenção (ECPA, PCPA), desempenho de agentes transmissores ou distribuidores
    no atendimento a obrigações de manutenção, ou análise de conformidade operacional conforme Submódulo
    9.
domain: qualidade
schema:
- name: ind_providencia_ecpa_pcpa
  physicalType: parquet
  logicalType: object
  physicalName: ind_providencia_ecpa_pcpa
  properties:
  - name: dsc_agregacao
    physicalType: VARCHAR
    logicalType: string
    description: 'Nível de agregação dos indicadores ECPA e PCPA. Indica se os dados se referem ao SIN
      (Sistema Interligado Nacional), a um Agente específico, à Área de Atuação do Agente ou ao Gestor
      responsável pelas providências de manutenção.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - agregacao
      - nivel de agregacao
      - tipo de agregacao
      - escopo
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Agente
      - Gestor de providências
      - Sistema
      - Área de atuação do agente
  - name: dsc_caracteristica
    physicalType: VARCHAR
    logicalType: string
    description: 'Identificação da entidade dentro do nível de agregação definido em dsc_agregacao. Pode
      conter o nome do agente, da área de atuação ou do gestor. Quando dsc_agregacao é "SIN", este campo
      representa o sistema como um todo.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - caracteristica
      - entidade
      - agente
      - gestor
      - area de atuacao
      - nome do agente
    - property: semanticType
      value: DIMENSION
  - name: din_referencia
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: 'Data de referência mensal dos indicadores ECPA e PCPA. Representa o mês de competência
      ao qual os valores calculados se referem. Sempre no primeiro dia do mês (ex: 2022-01-01 00:00:00).

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - data de referencia
      - mes de referencia
      - competencia
      - periodo
      - data
    - property: semanticType
      value: TIMESTAMP
  - name: num_nprc_concluidas
    physicalType: DOUBLE
    logicalType: number
    description: 'Número de providências de manutenção concluídas no período de referência, independentemente
      de terem sido concluídas dentro ou fora do prazo programado. Corresponde ao numerador parcial do
      cálculo do indicador ECPA.

      '
    customProperties:
    - property: aliases
      value:
      - providencias concluidas
      - nprc
      - numero de providencias concluidas
      - concluidas
    - property: semanticType
      value: IDENTIFIER
    - property: unit
      value: unidade (contagem)
  - name: num_nprp_programadas
    physicalType: DOUBLE
    logicalType: number
    description: 'Número de providências de manutenção programadas para o período de referência. Representa
      o total de providências que deveriam ser executadas conforme o planejamento de manutenção do agente.
      Denominador do indicador ECPA.

      '
    customProperties:
    - property: aliases
      value:
      - providencias programadas
      - nprp
      - numero de providencias programadas
      - programadas
    - property: semanticType
      value: IDENTIFIER
    - property: unit
      value: unidade (contagem)
  - name: num_nprat_atrasadas
    physicalType: DOUBLE
    logicalType: number
    description: 'Número de providências de manutenção concluídas com atraso em relação ao prazo programado.
      Indica o volume de providências que não foram cumpridas pontualmente, impactando negativamente o
      indicador PCPA.

      '
    customProperties:
    - property: aliases
      value:
      - providencias atrasadas
      - nprat
      - numero de providencias atrasadas
      - atrasadas
    - property: semanticType
      value: IDENTIFIER
    - property: unit
      value: unidade (contagem)
  - name: num_npra_antecipadas
    physicalType: DOUBLE
    logicalType: number
    description: 'Número de providências de manutenção concluídas de forma antecipada, ou seja, antes
      do prazo programado. Contribui positivamente para o indicador PCPA, demonstrando eficiência na execução
      das manutenções.

      '
    customProperties:
    - property: aliases
      value:
      - providencias antecipadas
      - npra
      - numero de providencias antecipadas
      - antecipadas
    - property: semanticType
      value: IDENTIFIER
    - property: unit
      value: unidade (contagem)
  - name: num_nprcp_concluidas_prazo
    physicalType: DOUBLE
    logicalType: number
    description: 'Número de providências de manutenção concluídas dentro do prazo programado. Representa
      as providências cumpridas pontualmente, sendo o numerador do indicador PCPA (Pontualidade do Cumprimento
      às Providências).

      '
    customProperties:
    - property: aliases
      value:
      - providencias concluidas no prazo
      - nprcp
      - concluidas no prazo
      - cumpridas no prazo
    - property: semanticType
      value: IDENTIFIER
    - property: unit
      value: unidade (contagem)
  - name: val_ecpa
    physicalType: DOUBLE
    logicalType: number
    description: 'Indicador de Evolução do Cumprimento às Providências (ECPA), calculado conforme o Submódulo
      9.5 dos Procedimentos de Rede do ONS. Representa a razão entre o número de providências concluídas
      (num_nprc_concluidas) e o número de providências programadas (num_nprp_programadas). Varia entre
      0.0 e 1.0, onde 1.0 indica cumprimento integral de todas as providências programadas.

      '
    customProperties:
    - property: aliases
      value:
      - ecpa
      - evolucao do cumprimento
      - indice ecpa
      - cumprimento de providencias
      - taxa de cumprimento
    - property: semanticType
      value: METRIC
    - property: unit
      value: índice normalizado [0,1]
  - name: val_pcpa
    physicalType: DOUBLE
    logicalType: number
    description: 'Indicador de Pontualidade do Cumprimento às Providências (PCPA), calculado conforme
      o Submódulo 9.5 dos Procedimentos de Rede do ONS. Representa a razão entre o número de providências
      concluídas no prazo (num_nprcp_concluidas_prazo) e o número de providências concluídas (num_nprc_concluidas).
      Varia entre 0.0 e 1.0, onde 1.0 indica que todas as providências concluídas foram cumpridas pontualmente.

      '
    customProperties:
    - property: aliases
      value:
      - pcpa
      - pontualidade do cumprimento
      - indice pcpa
      - pontualidade de providencias
      - taxa de pontualidade
    - property: semanticType
      value: METRIC
    - property: unit
      value: índice normalizado [0,1]
  quality:
  - type: custom
    engine: soda
    implementation: "checks for ind_providencia_ecpa_pcpa:\n  - row_count > 0:\n      name: Tabela não\
      \ pode estar vazia\n\n  # Referential integrity\n  - invalid_count(dsc_agregacao) = 0:\n      valid\
      \ values:\n        - 'Agente'\n        - 'Gestor de providências'\n        - 'Sistema'\n       \
      \ - 'Área de atuação do agente'\n      name: dsc_agregacao deve ser um dos valores válidos\n\n \
      \ # Baseline de volume — margem ±20% do row_count validado\n  - row_count between 35900 and 53851:\n\
      \      name: Volume esperado entre 35,900 e 53,851 registros\n\n  # Unicidade da chave primária\
      \ composta ['dsc_agregacao', 'dsc_caracteristica', 'din_referencia'] (candidata LLM)\n  - failed\
      \ rows:\n      name: Chave composta (dsc_agregacao, dsc_caracteristica, din_referencia) não deve\
      \ ter duplicatas\n      fail query: |\n        SELECT * FROM ind_providencia_ecpa_pcpa\n       \
      \ WHERE (dsc_agregacao, dsc_caracteristica, din_referencia) IN (\n          SELECT dsc_agregacao,\
      \ dsc_caracteristica, din_referencia FROM ind_providencia_ecpa_pcpa\n          GROUP BY dsc_agregacao,\
      \ dsc_caracteristica, din_referencia\n          HAVING COUNT(*) > 1\n        )\n\n  # Freshness:\
      \ din_referencia deve ter dados recentes (SLA: Atualizado diariamente)\n  - freshness(din_referencia)\
      \ < 3d:\n      name: din_referencia não pode ter dados com mais de 3 dias de atraso\n"
