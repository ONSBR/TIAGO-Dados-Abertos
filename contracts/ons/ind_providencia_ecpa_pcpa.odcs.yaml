customProperties:
- property: vectorTags
  value:
  - cumprimento de providencias de manutencao
  - agentes cumpriram a manutencao
  - pontualidade da manutencao
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver indicadores de cumprimento ou pontualidade
    de providências de manutenção (ECPA, PCPA), desempenho de agentes transmissores ou distribuidores
    no atendimento a obrigações de manutenção, ou análise de conformidade operacional conforme Submódulo
    9.5 dos Procedimentos de Rede do ONS. Também relevante para perguntas sobre ranking de agentes por
    qualidade de manutenção ou evolução temporal do cumprimento de providências.
- property: agentInstructions
  value: '- [num_nprp_programadas] Existem registros com num_nprp_programadas igual a 0.0, o que pode
    gerar divisão por zero ao calcular manualmente os indicadores ECPA e PCPA. Verificar se nesses casos
    os indicadores val_ecpa e val_pcpa também são 0.0.


    - [num_nprc_concluidas] num_nprc_concluidas pode ser maior que num_nprp_programadas em alguns registros,
    indicando que mais providências foram concluídas do que as originalmente programadas no mês. Possível
    por reprogramações, mas deve ser monitorado como anomalia.


    - [val_ecpa] Verificar consistência entre val_ecpa e as contagens brutas: val_ecpa deve ser aproximadamente
    num_nprc_concluidas / num_nprp_programadas quando num_nprp_programadas > 0. Divergências acima de
    0.01 podem indicar metodologia de cálculo diferente da esperada ou erros de exportação.


    - [val_pcpa] Verificar consistência entre val_pcpa e as contagens brutas: val_pcpa deve ser aproximadamente
    num_nprcp_concluidas_prazo / num_nprc_concluidas quando num_nprc_concluidas > 0. Divergências acima
    de 0.01 podem indicar metodologia diferente ou erros de exportação.


    - [dsc_caracteristica] A chave primária natural é (dsc_agregacao, dsc_caracteristica, din_referencia).
    Verificar se existem duplicatas nessa combinação, o que indicaria inconsistência no processo de carga
    ou múltiplas versões do mesmo indicador para o mesmo período.


    - [din_referencia] Verificar se há meses faltantes na série temporal para cada combinação de dsc_agregacao
    e dsc_caracteristica. O período cobre 2022-01-01 a 2026-04-01 (51 meses). Lacunas podem indicar ausência
    de dados ou agentes que entraram/saíram do sistema no período.

    '
- property: typicalQuestions
  value:
  - Qual foi o ECPA médio do SIN nos últimos 12 meses?
  - Quais agentes apresentaram menor PCPA em 2024?
  - Como evoluiu o índice de cumprimento de providências da CHESF entre 2022 e 2025?
  - Qual a proporção de providências atrasadas versus antecipadas por agente no último ano?
  - Quais agentes tiveram mais providências programadas não concluídas em 2023?
