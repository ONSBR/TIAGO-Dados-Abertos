description:
  purpose: Registrar e disponibilizar as restrições operativas por constrained-off em usinas fotovoltaicas com detalhamento intra-semihorário (períodos de restrição dentro dos patamares de 30 minutos) para uso por operadores do ONS, agentes do setor elétrico, auditores regulatórios da ANEEL e analistas de energia. Suporta decisões de apuração e auditoria da duração das restrições operativas, análise de causas e duração de restrições por usina, planejamento operativo de redespacho, conformidade regulatória e estudos de integração de fontes renováveis ao Sistema Interligado Nacional.
  limitations: Os dados disponibilizados fazem parte de um processo de consistência recorrente e, portanto, podem ser atualizados após a sua publicação. A chave natural é composta por (din_instante, id_ons, hor_final), permitindo múltiplos registros de restrição para a mesma usina no mesmo patamar de 30 minutos quando há diferentes períodos de restrição dentro do intervalo. A coluna dsc_restricao apresenta nulos na maior parte dos registros, indicando que a descrição textual detalhada é campo opcional e seu preenchimento não é sistemático.
  usage: Recuperar este dataset quando a pergunta envolver restrições operativas de usinas fotovoltaicas com detalhamento de duração e horário exato dentro dos patamares de 30 minutos, curtailment solar por usina com análise de minutos de restrição, razão e origem da restrição (local ou sistêmica), ou geração limitada (teto) imposta por constrained-off com granularidade temporal fina.
domain: geracao
