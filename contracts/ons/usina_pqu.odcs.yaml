customProperties:
- property: vectorTags
  value:
  - grupos de pequenas usinas
  - pequenas usinas por subsistema
- property: aiContext
  value: 'Recuperar este dataset quando a pergunta envolver composição ou membros de Grupos de Pequenas
    Usinas (GPQ), identificação de usinas Tipo III por subsistema ou estado, rastreabilidade de CEG ANEEL
    para pequenas usinas, ou quando for necessário fazer join entre dados de geração de usinas individuais
    e seus respectivos grupos agregados no SIN. Termos relacionados: PCH pequenas, Tipo_III, cadastro,
    contabilizacao_energia.'
- property: agentInstructions
  value: '- [id_ons_usina] Verificar se id_ons_usina é de fato único no dataset (chave primária natural
    esperada). Uma usina individual não deveria pertencer a mais de um GPQ simultaneamente; duplicatas
    indicariam inconsistência cadastral.


    - [ceg] O CEG ANEEL segue padrão estruturado (ex: PCH.PH.MG.030234-0.01). Valores fora deste padrão
    podem indicar erros de cadastro ou empreendimentos sem registro ANEEL formalizado.


    - [id_tipousina] Espera-se exclusivamente usinas Tipo III neste dataset conforme descrição CKAN. Presença
    de outros tipos indicaria ingestão incorreta de dados ou expansão não documentada do escopo do dataset.


    - [id_ons_pequenasusinas] Verificar a distribuição de usinas por GPQ para identificar grupos com número
    atipicamente alto ou baixo de usinas, o que pode indicar erros de associação cadastral.


    - [estad_id] Verificar se estad_id segue o padrão de siglas UF de 2 caracteres maiúsculos (ex: SP,
    MG). Valores fora deste padrão indicam inconsistência no campo de estado.


    - [id_subsistema] Verificar se id_subsistema contém apenas os valores válidos do domínio ONS (SE,
    S, NE, N). Valores fora deste conjunto indicam ingestão incorreta.

    '
- property: typicalQuestions
  value:
  - Quais usinas individuais compõem o Grupo de Pequenas Usinas X?
  - Quantas pequenas usinas existem por subsistema elétrico?
  - Qual é o CEG ANEEL da usina Y que pertence ao GPQ Z?
  - Quais estados concentram o maior número de pequenas usinas Tipo III?
  - Qual é a composição completa dos GPQs do subsistema Nordeste?
- property: granularity
