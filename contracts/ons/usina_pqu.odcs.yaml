version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:usina_pqu
name: usina_pqu
tenant: ons
tags:
- ANEEL
- CEG
- GPQ
- PCH pequenas
- SIN
- Tipo_III
- cadastro
- contabilizacao_energia
- despacho
- grupos de geração distribuída
- grupos de pequenas usinas GPQ Tipo III
- pequenas usinas
- pequenas_usinas
- subsistema
- usinas Tipo III
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/usina_pqu/*.parquet
  format: parquet
description:
  purpose: Prover o cadastro oficial de composição dos Grupos de Pequenas Usinas (GPQ) para analistas
    de planejamento e operação do ONS, permitindo rastrear quais usinas individuais Tipo III integram
    cada grupo, suportar o despacho agregado, a contabilização de energia e o cruzamento regulatório com
    a base ANEEL via CEG, viabilizando análises de geração distribuída por subsistema e estado no SIN.
  limitations: 'Verificar se id_ons_usina é de fato única no dataset (chave primária natural esperada).
    O CEG ANEEL possui formato padronizado (ex: PCH. Espera-se que todas as usinas neste dataset sejam
    classificadas como Tipo III.'
  usage: Recuperar este dataset quando a pergunta envolver composição ou membros de Grupos de Pequenas
    Usinas (GPQ), identificação de usinas Tipo III por subsistema ou estado, rastreabilidade de CEG ANEEL
    para pequenas usinas, ou quando for necessário fazer join entre dados de geração de usinas individuais
    e seus respectivos grupos agregados no SIN.
domain: geração
schema:
- name: usina_pqu
  physicalType: parquet
  logicalType: object
  physicalName: usina_pqu
  properties:
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Identificador do subsistema elétrico ao qual a usina pertence (ex: SE, S, NE, N)'
    customProperties:
    - property: aliases
      value:
      - subsistema
      - cod_subsistema
      - sistema
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
  - name: nom_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome por extenso do subsistema elétrico (ex: Sudeste/Centro-Oeste, Sul, Nordeste, Norte)'
    customProperties:
    - property: aliases
      value:
      - nome_subsistema
      - subsistema_nome
      - descricao_subsistema
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Nordeste
      - Norte
      - Sudeste/Centro-Oeste
      - Sul
  - name: estad_id
    physicalType: VARCHAR
    logicalType: string
    description: 'Sigla/código do estado da federação onde a usina está localizada (ex: SP, MG, RS)'
    customProperties:
    - property: aliases
      value:
      - cod_estado
      - uf
      - sigla_estado
      - estado_id
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - AL
      - BA
      - CE
      - DF
      - ES
      - GO
      - MA
      - MG
      - MS
      - MT
      - PA
      - PB
      - PE
      - PI
      - PR
      - RJ
      - RN
      - RO
      - RS
      - SC
      - SE
      - SP
      - TO
  - name: nom_estado
    physicalType: VARCHAR
    logicalType: string
    description: Nome por extenso do estado da federação onde a usina está localizada
    customProperties:
    - property: aliases
      value:
      - nome_estado
      - estado
      - descricao_estado
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - ALAGOAS
      - BAHIA
      - CEARÁ
      - DISTRITO FEDERAL
      - ESPÍRITO SANTO
      - GOIÁS
      - MARANHÃO
      - MATO GROSSO
      - MATO GROSSO DO SUL
      - MINAS GERAIS
      - PARANÁ
      - PARAÍBA
      - PARÁ
      - PERNAMBUCO
      - PIAUÍ
      - RIO DE JANEIRO
      - RIO GRANDE DO NORTE
      - RIO GRANDE DO SUL
      - RONDÔNIA
      - SANTA CATARINA
      - SERGIPE
      - SÃO PAULO
      - TOCANTINS
  - name: id_tipousina
    physicalType: VARCHAR
    logicalType: string
    description: Identificador do tipo de usina conforme classificação ONS. Espera-se predominantemente
      o valor correspondente a usinas Tipo III (pequenas usinas)
    customProperties:
    - property: aliases
      value:
      - tipo_usina
      - cod_tipo_usina
      - classificacao_usina
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - UEE
      - UFV
      - UHE
      - UTE
  - name: id_ons_pequenasusinas
    physicalType: VARCHAR
    logicalType: string
    description: Identificador ONS do Grupo de Pequenas Usinas (GPQ) ao qual a usina individual pertence.
      Representa a entidade agregada utilizada no despacho e contabilização
    customProperties:
    - property: aliases
      value:
      - id_grupo_pequenas_usinas
      - id_gpq
      - cod_grupo_pqu
      - identificador_grupo
    - property: semanticType
      value: IDENTIFIER
  - name: id_ons_usina
    physicalType: VARCHAR
    logicalType: string
    description: Identificador ONS da usina individual Tipo III que compõe o Grupo de Pequenas Usinas.
      Chave de identificação primária da usina no sistema ONS
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - id_usina
      - cod_usina_ons
      - identificador_usina
      - cod_ons_usina
    - property: semanticType
      value: IDENTIFIER
  - name: nom_pequenasusinas
    physicalType: VARCHAR
    logicalType: string
    description: Nome do Grupo de Pequenas Usinas (GPQ) conforme cadastro ONS
    customProperties:
    - property: aliases
      value:
      - nome_grupo_pequenas_usinas
      - nome_gpq
      - descricao_grupo_pqu
    - property: semanticType
      value: DIMENSION
  - name: nom_usina
    physicalType: VARCHAR
    logicalType: string
    description: Nome da usina individual Tipo III conforme cadastro ONS
    customProperties:
    - property: aliases
      value:
      - nome_usina
      - usina
      - descricao_usina
    - property: semanticType
      value: DIMENSION
  - name: ceg
    physicalType: VARCHAR
    logicalType: string
    description: Código de Empreendimento de Geração (CEG) atribuído pela ANEEL à usina individual. Permite
      rastreabilidade regulatória e cruzamento com bases da ANEEL
    customProperties:
    - property: aliases
      value:
      - cod_ceg
      - codigo_empreendimento
      - ceg_aneel
      - codigo_geracao
    - property: semanticType
      value: IDENTIFIER
