      bacia: null
      subestacao: null
      patamar: null
    metrics: []
    query_routing:
      supports_listing: true
      supports_time_series: false
      supports_comparison: true
      supports_ranking: true
      primary_use_case: cadastro
    selection_policy:
      preferred_for:
      - composicao GPQ
      - membros grupo pequenas usinas
      - usinas Tipo III
      - id_ons_pequenasusinas
      - nom_pequenasusinas
      - filiacao GPQ
      - usina individual GPQ
      - cadastro pequenas usinas ONS
      - grupo despacho agregado
      covers_metrics: []
      not_preferred_for:
