    sql_patterns:
      list_members_of_gpq:
        template: 'SELECT nom_usina, ceg, id_tipousina, estad_id, nom_estado FROM {source} WHERE id_ons_pequenasusinas
          = ''{id_gpq}'' ORDER BY nom_usina

          '
      count_by_subsistema:
        template: 'SELECT id_subsistema, nom_subsistema, COUNT(*) AS qtd_usinas FROM {source} GROUP BY
          id_subsistema, nom_subsistema ORDER BY qtd_usinas DESC

          '
      count_by_estado:
        template: 'SELECT estad_id, nom_estado, COUNT(*) AS qtd_usinas FROM {source} GROUP BY estad_id,
          nom_estado ORDER BY qtd_usinas DESC

          '
      list_gpq_by_subsistema:
        template: 'SELECT id_ons_pequenasusinas, nom_pequenasusinas, COUNT(*) AS qtd_usinas_individuais
          FROM {source} WHERE id_subsistema = ''{subsistema}'' GROUP BY id_ons_pequenasusinas, nom_pequenasusinas
          ORDER BY nom_pequenasusinas

          '
      find_ceg_by_usina:
        template: 'SELECT nom_usina, ceg, id_ons_pequenasusinas, nom_pequenasusinas, id_subsistema FROM
          {source} WHERE nom_usina ILIKE ''%<nome>%''

          '
    ambiguity_policy:
      default_assumptions: []
      must_clarify_when:
      - ambiguity: nome_usina_vs_nome_gpq
        question: Voce quer buscar pelo nome da usina individual (nom_usina) ou pelo nome do Grupo de
          Pequenas Usinas (nom_pequenasusinas)?
        trigger_terms:
        - nome
        - buscar
        - encontrar
        - qual usina
      - ambiguity: ceg_vs_id_ons
        question: 'Voce quer identificar a usina pelo CEG ANEEL (ex: PCH.PH.MG.030234-0.01) ou pelo identificador
          ONS (id_ons_usina)?'
        trigger_terms:
        - codigo
        - identificador
        - id
      redirect_when:
      - user_mentions:
        - nuclear
        - angra
        - angra 1
        - angra 2
        reason: Usinas nucleares sao Tipo I e nao integram GPQ. Dataset cobre apenas Tipo III.
        redirect: geracao-usina-2 com filtro de combustivel nuclear
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: MMGD nao e cadastrada como GPQ no ONS. Dataset nao contem coluna MMGD.
        redirect: dataset com coluna val_germmgd ou val_ger_mmgd
      - user_mentions:
        - geracao horaria
        - geracao diaria
        - serie temporal
        - MWh
        - MWmed
        - potencia gerada
        reason: Dataset e cadastral estatico sem metricas de geracao. Use dataset operativo adequado.
        redirect: geracao-usina-2 para serie de geracao por usina individual
      - user_mentions:
        - potencia instalada
        - capacidade instalada
        - MW instalado
        reason: Dataset nao contem coluna de capacidade nominal.
        redirect: capacidade-geracao para potencia instalada por usina
      - user_mentions:
        - gas natural
        - carvao
        - biomassa
        - oleo combustivel
        - combustivel
        reason: Dataset nao discrimina combustivel dentro de UTE. id_tipousina agrega todos os termicos.
        redirect: geracao-termica-despacho-2 ou geracao-usina-2 com filtro de combustivel
      - user_mentions:
        - conjunto
        - tipo II
        - tipo 2
        reason: Conjuntos ONS Tipo II-C sao entidades distintas de GPQ Tipo III.
        redirect: usina_conjunto para composicao de conjuntos Tipo II-C
- property: fewShotQueries
  value:
  - question: Quais usinas individuais compõem cada Grupo de Pequenas Usinas e em qual estado estão localizadas?
    sql: SELECT pqu.id_ons_pequenasusinas, pqu.nom_pequenasusinas, pqu.id_ons_usina, pqu.nom_usina, pqu.ceg,
      pqu.estad_id, pqu.nom_estado, pqu.id_subsistema FROM read_parquet('s3://ons-aws-prod-opendata/dataset/usina_pqu/*.parquet')
      AS pqu ORDER BY pqu.nom_pequenasusinas, pqu.nom_usina LIMIT 100;
  - question: Quantas usinas individuais Tipo III existem em cada subsistema elétrico?
    sql: SELECT pqu.id_subsistema, pqu.nom_subsistema, COUNT(DISTINCT pqu.id_ons_usina) AS qtd_usinas,
      COUNT(DISTINCT pqu.id_ons_pequenasusinas) AS qtd_gpq FROM read_parquet('s3://ons-aws-prod-opendata/dataset/usina_pqu/*.parquet')
      AS pqu GROUP BY pqu.id_subsistema, pqu.nom_subsistema ORDER BY qtd_usinas DESC;
  - question: Quais estados concentram o maior número de pequenas usinas Tipo III cadastradas no ONS?
    sql: SELECT pqu.estad_id, pqu.nom_estado, pqu.id_subsistema, COUNT(DISTINCT pqu.id_ons_usina) AS qtd_usinas
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/usina_pqu/*.parquet') AS pqu GROUP BY pqu.estad_id,
      pqu.nom_estado, pqu.id_subsistema ORDER BY qtd_usinas DESC LIMIT 27;
