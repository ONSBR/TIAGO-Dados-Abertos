      - codigo_empreendimento
      - ceg_aneel
      - codigo_geracao
    - property: semanticType
      value: IDENTIFIER
  quality:
  - type: custom
    engine: soda
    implementation: "checks for usina_pqu:\n  - row_count > 0:\n      name: Tabela não pode estar vazia\n\
      \n  # Referential integrity\n  - invalid_count(id_subsistema) = 0:\n      valid values:\n      \
      \  - 'N'\n        - 'NE'\n        - 'S'\n        - 'SE'\n      name: id_subsistema deve ser um dos\
      \ valores válidos\n  - invalid_count(nom_subsistema) = 0:\n      valid values:\n        - 'Nordeste'\n\
      \        - 'Norte'\n        - 'Sudeste/Centro-Oeste'\n        - 'Sul'\n      name: nom_subsistema\
      \ deve ser um dos valores válidos\n  - invalid_count(estad_id) = 0:\n      valid values:\n     \
      \   - 'AL'\n        - 'BA'\n        - 'CE'\n        - 'DF'\n        - 'ES'\n        - 'GO'\n   \
      \     - 'MA'\n        - 'MG'\n        - 'MS'\n        - 'MT'\n        - 'PA'\n        - 'PB'\n \
      \       - 'PE'\n        - 'PI'\n        - 'PR'\n        - 'RJ'\n        - 'RN'\n        - 'RO'\n\
      \        - 'RS'\n        - 'SC'\n        - 'SE'\n        - 'SP'\n        - 'TO'\n      name: estad_id\
      \ deve ser um dos valores válidos\n  - invalid_count(nom_estado) = 0:\n      valid values:\n   \
      \     - 'ALAGOAS'\n        - 'BAHIA'\n        - 'CEARÁ'\n        - 'DISTRITO FEDERAL'\n        -\
      \ 'ESPÍRITO SANTO'\n        - 'GOIÁS'\n        - 'MARANHÃO'\n        - 'MATO GROSSO'\n        -\
      \ 'MATO GROSSO DO SUL'\n        - 'MINAS GERAIS'\n        - 'PARANÁ'\n        - 'PARAÍBA'\n    \
      \    - 'PARÁ'\n        - 'PERNAMBUCO'\n        - 'PIAUÍ'\n        - 'RIO DE JANEIRO'\n        -\
      \ 'RIO GRANDE DO NORTE'\n        - 'RIO GRANDE DO SUL'\n        - 'RONDÔNIA'\n        - 'SANTA CATARINA'\n\
      \        - 'SERGIPE'\n        - 'SÃO PAULO'\n        - 'TOCANTINS'\n      name: nom_estado deve\
      \ ser um dos valores válidos\n  - invalid_count(id_tipousina) = 0:\n      valid values:\n      \
      \  - 'UEE'\n        - 'UFV'\n        - 'UHE'\n        - 'UTE'\n      name: id_tipousina deve ser\
      \ um dos valores válidos\n\n  # Baseline de volume — margem ±20% do row_count validado\n  - row_count\
      \ between 969 and 1454:\n      name: Volume esperado entre 969 e 1,454 registros\n\n  # Unicidade\
      \ da chave primária (candidata LLM — confirmar com dados reais)\n  - duplicate_count(id_ons_usina)\
      \ = 0:\n      name: id_ons_usina não deve ter duplicatas (chave primária)\n"
