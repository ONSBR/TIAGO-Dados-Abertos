      - EARmax subsistema jusante
      - capacidade maxima jusante
      - EAR maxima jusante MWmes
    - property: unit
      value: MWmes
    - property: enum
      value:
      - 0.0
      - 1004.893
      - 147.034
      - 16040.745
      - 16085.0
      - 42.91
      - 451.213
      - 4657.0
      - 484.803
      - 6620.419
  - name: ear_reservatorio_percentual
    physicalType: VARCHAR
    logicalType: number
    description: 'Percentual de energia armazenada no reservatório em relação à sua capacidade máxima
      total. Varia de 0 a 100. Apresenta nulos em parte das linhas. Pode ultrapassar 100% em situações de vertimento
      ou revisões de EARmax.

      '
    customProperties:
    - property: castExpression
      value: TRY_CAST(ear_reservatorio_percentual AS DOUBLE)
    - property: aliases
