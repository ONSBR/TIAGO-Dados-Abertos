version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:ear-diario-por-reservatorio
name: ear-diario-por-reservatorio
tenant: ons
tags:
- EAR
- EAR diario
- EAR por usina
- EAR reservatorio diario
- MWmes
- REE
- SIN
- armazenamento hidreletrico
- bacia-hidrografica
- diario
- energia armazenada reservatorio
- energia-armazenada
- hidreletrica
- nivel reservatorio
- reservatorio
- subsistema
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/ear_reservatorio_di/*.parquet
  format: parquet
description:
  purpose: Prover a série histórica diária de energia armazenada por reservatório hidrelétrico para uso
    de geradores, comercializadores, agentes do mercado de energia e pesquisadores do setor elétrico brasileiro.
    Suporta estudos energéticos, projeção do Custo Marginal de Operação (CMO), acompanhamento da segurança
    energética do SIN, análise de risco hidrológico, planejamento da operação hidrotérmica e validação
    de modelos como NEWAVE e DECOMP. Decisões de despacho, contratação de energia e gestão de reservatórios
    dependem diretamente desta série.
  limitations: Coluna de data tipada como VARCHAR no schema físico DuckDB, devendo ser DATE. cod_resplanejamento apresenta poucos nulos. ear_reservatorio_subsistema_proprio_mwmes apresenta nulos em parte das linhas, possivelmente reservatórios sem dados históricos completos no início da série (próximo a 2000-01-01).
  usage: Recuperar este dataset quando a pergunta envolver energia armazenada, nível de reservatório,
    percentual de armazenamento ou capacidade hídrica de usinas hidrelétricas individuais em base diária.
domain: reservatorio
schema:
- name: ear_diario_por_reservatorio
  physicalType: parquet
  logicalType: object
  physicalName: ear_diario_por_reservatorio
  properties:
  - name: nom_reservatorio
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome do reservatório hidrelétrico identificado no dataset. É o identificador primário
      da entidade espacial e compõe a chave primária natural junto com ear_data.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - reservatorio
      - nome do reservatorio
      - usina
      - nome da usina
    - property: semanticType
      value: DIMENSION
  - name: cod_resplanejamento
    physicalType: DOUBLE
    logicalType: number
    description: 'Código numérico do reservatório utilizado nos modelos de planejamento energético do
      ONS (ex. NEWAVE, DECOMP). Nem sempre preenchido (poucos nulos). Range observado de 1 a 311.

      '
    customProperties:
    - property: aliases
      value:
      - codigo de planejamento
      - codigo do reservatorio
      - cod planejamento
      - codigo NEWAVE
    - property: semanticType
      value: IDENTIFIER
  - name: tip_reservatorio
    physicalType: VARCHAR
    logicalType: string
    description: 'Tipo do reservatório, indicando sua característica operativa (ex. regularização, fio
      d''água, acumulação, equivalente).

      '
    customProperties:
    - property: aliases
      value:
      - tipo de reservatorio
      - tipo reservatorio
      - classificacao do reservatorio
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Reservatório com Usina
      - Reservatório sem usina
  - name: nom_bacia
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome da bacia hidrográfica à qual o reservatório pertence. Permite agregações por bacia
      e join com datasets de vazão.

      '
    customProperties:
    - property: aliases
      value:
      - bacia
      - bacia hidrografica
      - nome da bacia
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - AMAZONAS
      - CAPIVARI
      - DOCE
      - GRANDE
      - IGUACU
      - JACUI
      - JEQUITINHONHA
      - PARAGUACU
      - PARAGUAI
      - PARAIBA DO SUL
      - PARANA
      - PARANAIBA
      - PARANAPANEMA
      - PARNAIBA
      - SAO FRANCISCO
      - TIETE
      - TOCANTINS
      - URUGUAI
  - name: nom_ree
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome do Reservatório Equivalente de Energia (REE) ao qual o reservatório está associado.
      Agrupamento utilizado nos modelos de otimização energética NEWAVE e DECOMP.

      '
    customProperties:
    - property: aliases
      value:
      - REE
      - reservatorio equivalente
      - reservatorio equivalente de energia
      - nome do REE
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - BELO MONTE
      - IGUACU
      - MADEIRA
      - MANAUS-AMAPA
      - NORDESTE
      - NORTE
      - PARANA
      - PARANAPANEMA
      - SUDESTE
      - SUL
      - TELES PIRES
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Identificador do subsistema elétrico ao qual o reservatório pertence (subsistema próprio).
      Valores típicos: SE, S, NE, N.

      '
    customProperties:
    - property: aliases
      value:
      - subsistema
      - id subsistema proprio
      - subsistema proprio
      - regiao
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
  - name: nom_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome por extenso do subsistema elétrico próprio do reservatório.

      '
    customProperties:
    - property: aliases
      value:
      - nome do subsistema
      - subsistema por extenso
      - nome subsistema proprio
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - NORDESTE
      - NORTE
      - SUDESTE
      - SUL
  - name: id_subsistema_jusante
    physicalType: VARCHAR
    logicalType: string
    description: 'Identificador do subsistema elétrico à jusante na cascata. Quando igual ao id_subsistema,
      indica que não há subsistema à jusante diferente. Ausente em boa parte das linhas, quase sempre como string VAZIA e nao como NULL — um filtro IS NOT NULL nao a exclui. Trate vazio como ausencia antes de agrupar por subsistema a jusante.

      '
    customProperties:
    - property: aliases
      value:
      - subsistema jusante
      - id subsistema a jusante
      - subsistema downstream
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
  - name: nom_subsistema_jusante
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome por extenso do subsistema elétrico à jusante na cascata.

      '
    customProperties:
    - property: aliases
      value:
      - nome subsistema jusante
      - subsistema a jusante por extenso
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - NORDESTE
      - NORTE
      - SUDESTE
      - SUL
  - name: ear_data
    physicalType: VARCHAR
    logicalType: string
    description: 'Data de referência da medição da energia armazenada. Tipada como VARCHAR no schema físico
      — deve ser convertida para DATE em consultas temporais. Formato observado YYYY-MM-DD. Série de 2000-01-01 em diante.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - data
      - data de referencia
      - data EAR
      - data da medicao
      - din_instante
    - property: semanticType
      value: DIMENSION
  - name: ear_reservatorio_subsistema_proprio_mwmes
    physicalType: VARCHAR
    logicalType: number
    description: 'Energia armazenada no reservatório considerando apenas a contribuição para o subsistema
      próprio, em MWmês. Apresenta nulos em parte das linhas, possivelmente reservatórios sem dados históricos completos
      no início da série.

      '
    customProperties:
    - property: castExpression
      value: TRY_CAST(ear_reservatorio_subsistema_proprio_mwmes AS DOUBLE)
    - property: aliases
      value:
      - EAR subsistema proprio
      - energia armazenada propria
      - EAR proprio MWmes
    - property: unit
      value: MWmes
  - name: ear_reservatorio_subsistema_jusante_mwmes
