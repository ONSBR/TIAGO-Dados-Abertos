    - property: castExpression
      value: TRY_CAST(val_contribearsubsistema AS DOUBLE)
  - name: val_contribearmaxsubsistema
    physicalType: VARCHAR
    logicalType: number
    description: 'Contribuição percentual do reservatório para a EARmax total do subsistema próprio. Sem
      nulos.

      '
    customProperties:
    - property: aliases
      value:
      - contribuicao EARmax subsistema
      - contrib EARmax subsistema proprio
      - participacao maxima no subsistema
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_contribearmaxsubsistema AS DOUBLE)
  - name: val_contribearsubsistemajusante
    physicalType: VARCHAR
    logicalType: number
    description: 'Contribuição percentual do reservatório para a EAR total do subsistema à jusante. Quando
      não há subsistema à jusante distinto, o valor reflete a contribuição para o próprio subsistema.
      Sem nulos.

      '
    customProperties:
