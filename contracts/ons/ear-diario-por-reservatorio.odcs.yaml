team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/ear-diario-por-reservatorio
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - nivel do reservatorio da usina
  - armazenamento de cada usina
  - quanto cada represa tem armazenado
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver energia armazenada, nível de reservatório,
    percentual de armazenamento ou capacidade hídrica de usinas hidrelétricas individuais em base diária.
    Também relevante para análises de cascata, contribuição de reservatórios para subsistemas ou SIN,
    e correlação entre armazenamento e risco hidrológico. Preferir sobre ear-diario-por-subsistema quando
    a granularidade espacial requerida for o reservatório individual, não o subsistema agregado.
- property: agentInstructions
  value: |
    - [ear_data] Coluna de data tipada como VARCHAR no schema físico DuckDB, devendo ser DATE. Filtros e ordenações temporais diretas podem falhar ou produzir resultados incorretos sem conversão explícita.

    - [cod_resplanejamento] Código de planejamento apresenta poucos nulos. Reservatórios sem código não podem ser utilizados em joins com modelos de planejamento (NEWAVE/DECOMP) que referenciam este identificador.

    - [ear_reservatorio_subsistema_proprio_mwmes] Apresenta nulos em parte das linhas, possivelmente reservatórios sem dados históricos completos no início da série (próximo a 2000-01-01). Agregações de EAR por subsistema podem subestimar valores em datas antigas.

    - [ear_reservatorio_subsistema_jusante_mwmes] Apresenta nulos em boa parte das linhas — esperado para reservatórios cujo subsistema à jusante é idêntico ao próprio (id_subsistema = id_subsistema_jusante). Deve ser tratado como ausência de contribuição inter-subsistema, não como dado faltante.

    - [earmax_reservatorio_subsistema_proprio_mwmes] Apresenta nulos em parte das linhas, coincidindo com ear_reservatorio_subsistema_proprio_mwmes. Indica que os mesmos reservatórios sem EAR também não possuem EARmax, comprometendo o cálculo de percentual de armazenamento.

    - [earmax_reservatorio_subsistema_jusante_mwmes] Apresenta nulos em boa parte das linhas, espelhando ear_reservatorio_subsistema_jusante_mwmes. Reservatórios sem subsistema à jusante distinto não possuem capacidade máxima para esse componente.

    - [ear_reservatorio_percentual] Apresenta nulos em parte das linhas, coincidindo com as colunas de EAR e EARmax do subsistema próprio. Percentual não pode ser calculado quando EARmax é nulo ou zero.

    - [ear_reservatorio_percentual] Percentual de armazenamento pode ultrapassar 100% em situações de vertimento ou revisões de EARmax, ou apresentar valores negativos por inconsistências de consistência recorrente mencionada nos metadados CKAN.

    - [ear_total_mwmes] Energia armazenada total não deveria ser negativa. Valores negativos indicariam inconsistência no processo de consistência recorrente descrito nos metadados CKAN.

    - [nom_reservatorio] A chave primária natural é (nom_reservatorio, ear_data). Duplicatas nessa combinação indicariam registros redundantes ou erro de carga, comprometendo agregações e joins temporais.

    - [ear_data] Série diária de 26 anos pode conter lacunas temporais por reservatório. Dias faltantes afetam análises de tendência, médias móveis e modelos de previsão que assumem continuidade da série.

    - [tipos] As colunas `ear_maxima_total_mwmes`, `ear_reservatorio_percentual`, `ear_reservatorio_subsistema_jusante_mwmes`, `ear_reservatorio_subsistema_proprio_mwmes`, `ear_total_mwmes`, `earmax_reservatorio_subsistema_jusante_mwmes`, `earmax_reservatorio_subsistema_proprio_mwmes`, `val_contribearbacia`, `val_contribearmaxbacia`, `val_contribearmaxsin`, `val_contribearmaxsubsistema`, `val_contribearmaxsubsistemajusante`, `val_contribearsin`, `val_contribearsubsistema`, `val_contribearsubsistemajusante` mudam de tipo entre arquivos anuais (texto em uns, número em outros); cada uma traz `castExpression` no schema: use-o em toda agregação e comparação. As colunas de código `cod_resplanejamento` variam entre inteiro e decimal entre arquivos; compare-as como número, não como texto.
- property: typicalQuestions
  value:
  - Qual foi o percentual de armazenamento do reservatório de Furnas nos últimos 30 dias?
  - Quais reservatórios do subsistema Sudeste estavam abaixo de 30% de capacidade em janeiro de 2021?
  - Como evoluiu a EAR total dos reservatórios da bacia do Paraná entre 2015 e 2020?
  - Quais são os 10 reservatórios com maior contribuição para a EAR do SIN hoje?
  - Qual a diferença entre a EAR do subsistema próprio e à jusante para reservatórios de cascata inter-subsistemas?
- property: granularity
  value: diária
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/ear_reservatorio_di/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2000-01-01'
- property: semantics
  value:
    measure_terms:
    - armazenada
    - armazenamento
    - ear
    family: ear
    family_default: false
    temporal_perspective: verificado
    row_grain:
      temporal: 1 dia
      temporal_column: ear_data
      spatial: usina
      entity: reservatorio
      one_row_per:
      - ear_data
      - id_subsistema
      - nom_reservatorio
    dimension_columns:
      subsistema: id_subsistema
      fonte: null
      usina: null
      reservatorio: nom_reservatorio
      bacia: nom_bacia
      subestacao: null
      patamar: null
    metrics:
    - id: ear_reservatorio_subsistema_proprio_mwmes
      label: Energia Armazenada Subsistema Proprio
      columns:
      - ear_reservatorio_subsistema_proprio_mwmes
      expression: ear_reservatorio_subsistema_proprio_mwmes
      quantity_kind: energy_stock
      unit_native: MWmes
      default_aggregation: last_or_avg
      forbidden_aggregations:
      - sum
      aggregation_modes:
        last_value:
          sql: LAST_VALUE(TRY_CAST(ear_reservatorio_subsistema_proprio_mwmes AS DOUBLE))
          unit: MWmes
        average:
          sql: AVG(TRY_CAST(ear_reservatorio_subsistema_proprio_mwmes AS DOUBLE))
          unit: MWmes
        time_series:
          sql: AVG(TRY_CAST(ear_reservatorio_subsistema_proprio_mwmes AS DOUBLE))
          unit: MWmes
        ranking:
          sql: AVG(TRY_CAST(ear_reservatorio_subsistema_proprio_mwmes AS DOUBLE))
          unit: MWmes
        comparison:
          sql: AVG(TRY_CAST(ear_reservatorio_subsistema_proprio_mwmes AS DOUBLE))
          unit: MWmes
      interval_hours: 24.0
