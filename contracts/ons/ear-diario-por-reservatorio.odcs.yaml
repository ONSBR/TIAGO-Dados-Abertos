    logicalType: number
    description: 'Energia armazenada no reservatório considerando a contribuição para o subsistema à jusante
      (quando diferente do próprio), em MWmês. Apresenta nulos em boa parte das linhas — esperado pois nem todo reservatório
      possui subsistema à jusante distinto.

      '
    customProperties:
    - property: castExpression
      value: TRY_CAST(ear_reservatorio_subsistema_jusante_mwmes AS DOUBLE)
    - property: aliases
      value:
      - EAR subsistema jusante
      - energia armazenada jusante
      - EAR jusante MWmes
    - property: unit
      value: MWmes
  - name: earmax_reservatorio_subsistema_proprio_mwmes
    physicalType: VARCHAR
    logicalType: number
    description: 'Energia armazenada máxima do reservatório para o subsistema próprio (capacidade total
      com reservatório cheio), em MWmês. Apresenta nulos em parte das linhas.

      '
    customProperties:
    - property: castExpression
      value: TRY_CAST(earmax_reservatorio_subsistema_proprio_mwmes AS DOUBLE)
    - property: aliases
      value:
      - EARmax subsistema proprio
      - capacidade maxima propria
      - EAR maxima propria MWmes
    - property: unit
      value: MWmes
  - name: earmax_reservatorio_subsistema_jusante_mwmes
    physicalType: VARCHAR
    logicalType: number
