      - contribuicao EAR subsistema jusante
      - contrib EAR jusante
      - participacao no subsistema a jusante
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_contribearsubsistemajusante AS DOUBLE)
  - name: val_contribearmaxsubsistemajusante
    physicalType: VARCHAR
    logicalType: number
    description: 'Contribuição percentual do reservatório para a EARmax total do subsistema à jusante.
      Sem nulos.

      '
    customProperties:
    - property: aliases
      value:
      - contribuicao EARmax subsistema jusante
      - contrib EARmax jusante
      - participacao maxima no subsistema a jusante
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_contribearmaxsubsistemajusante AS DOUBLE)
