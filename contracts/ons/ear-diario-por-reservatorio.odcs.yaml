    sql_patterns:
      ear_percentual_reservatorio_periodo:
        template: "SELECT\n  nom_reservatorio,\n  AVG(TRY_CAST(ear_reservatorio_percentual AS DOUBLE))\
          \ AS ear_pct_medio,\n  MIN(TRY_CAST(ear_reservatorio_percentual AS DOUBLE)) AS ear_pct_minimo,\n\
          \  MAX(TRY_CAST(ear_reservatorio_percentual AS DOUBLE)) AS ear_pct_maximo\nFROM {source}\nWHERE\
          \ TRY_CAST(ear_data AS DATE) BETWEEN '{data_inicio}' AND '{data_fim}'\nGROUP BY nom_reservatorio\n\
          ORDER BY ear_pct_medio DESC"
        output_unit: '%'
        matches:
          output_modes:
          - average
          - minimum
          - maximum
          metrics:
          - ear_reservatorio_percentual
          grain: reservatorio
        validated_params:
          data_inicio: '2000-01-01'
          data_fim: '2003-11-25'
      ear_total_serie_diaria:
        template: "SELECT\n  TRY_CAST(ear_data AS DATE) AS data,\n  nom_reservatorio,\n  TRY_CAST(ear_total_mwmes\
          \ AS DOUBLE) AS ear_total_mwmes\nFROM {source}\nWHERE nom_reservatorio = '{reservatorio}'\n\
          ORDER BY TRY_CAST(ear_data AS DATE)"
        output_unit: MWmes
        matches:
          output_modes:
          - time_series
          metrics:
          - ear_total_mwmes
          grain: day
      ranking_contribuicao_sin:
        template: "SELECT\n  nom_reservatorio,\n  nom_bacia,\n  nom_subsistema,\n  AVG(TRY_CAST(val_contribearsin\
          \ AS DOUBLE)) AS contrib_ear_sin_pct\nFROM {source}\nWHERE TRY_CAST(ear_data AS DATE) = '{data}'\n\
          GROUP BY nom_reservatorio, nom_bacia, nom_subsistema\nORDER BY contrib_ear_sin_pct DESC\nLIMIT\
          \ 20"
        output_unit: '%'
        matches:
          output_modes:
          - ranking
          metrics:
          - contribearsin
          grain: reservatorio
      reservatorios_abaixo_threshold:
        template: "SELECT\n  nom_reservatorio,\n  nom_subsistema,\n  nom_bacia,\n  TRY_CAST(ear_reservatorio_percentual\
          \ AS DOUBLE) AS ear_pct\nFROM {source}\nWHERE TRY_CAST(ear_data AS DATE) = '{data}'\n  AND TRY_CAST(ear_reservatorio_percentual\
          \ AS DOUBLE) < {threshold}\nORDER BY ear_pct ASC"
        output_unit: '%'
        matches:
          output_modes:
          - comparison
          metrics:
          - ear_reservatorio_percentual
          grain: reservatorio
        validated_params:
          data: '2002-11-23'
          threshold: '121.81'
- property: fewShotQueries
  value:
  - question: Como evoluiu o percentual de armazenamento do reservatório de Furnas ao longo de 2021?
    sql: SELECT TRY_CAST(ear_data AS DATE) AS data_ref, nom_reservatorio, ear_reservatorio_percentual,
      ear_total_mwmes, ear_maxima_total_mwmes FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ear_reservatorio_di/*.parquet')
      WHERE nom_reservatorio = 'FURNAS' AND TRY_CAST(ear_data AS DATE) BETWEEN DATE '2021-01-01' AND DATE
      '2021-12-31' ORDER BY data_ref
  - question: Quais reservatórios do subsistema Nordeste estavam abaixo de 20% de capacidade em 15/03/2021?
    sql: SELECT nom_reservatorio, id_subsistema, nom_bacia, nom_ree, TRY_CAST(ear_reservatorio_percentual
      AS DOUBLE) AS ear_reservatorio_percentual, TRY_CAST(ear_total_mwmes AS DOUBLE) AS ear_total_mwmes,
      TRY_CAST(ear_maxima_total_mwmes AS DOUBLE) AS ear_maxima_total_mwmes FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ear_reservatorio_di/*.parquet',
      union_by_name=true) WHERE id_subsistema = 'NE' AND TRY_CAST(ear_data AS DATE) = DATE '2021-03-15'
      AND TRY_CAST(ear_reservatorio_percentual AS DOUBLE) < 20.0 ORDER BY TRY_CAST(ear_reservatorio_percentual
      AS DOUBLE) ASC LIMIT 100
  - question: Quais os 10 reservatórios com maior contribuição percentual para a EAR do SIN na última
      data disponível?
    sql: WITH ultima_data AS ( SELECT MAX(TRY_CAST(ear_data AS DATE)) AS max_data FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ear_reservatorio_di/*.parquet')
      ) SELECT r.nom_reservatorio, r.id_subsistema, r.nom_bacia, r.ear_total_mwmes, r.ear_reservatorio_percentual,
      r.val_contribearsin, ROUND(r.val_contribearsin * 100, 4) AS pct_contribuicao_sin FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ear_reservatorio_di/*.parquet')
      AS r INNER JOIN ultima_data AS u ON TRY_CAST(r.ear_data AS DATE) = u.max_data ORDER BY r.val_contribearsin
      DESC LIMIT 10
