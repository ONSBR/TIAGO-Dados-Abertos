- usina
- usina conjunto ONS
- usinas Tipo II-C
- vigência
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/usina_conjunto/*.parquet
  format: parquet
description:
  purpose: Suportar equipes de planejamento, operação e regulação do ONS na identificação da composição
    histórica e atual dos conjuntos de usinas Tipo II-C, permitindo decisões de despacho, contabilização
    de geração agregada, supervisão do parque gerador cadastrado e cruzamento com bases regulatórias da
    ANEEL via Código de Empreendimento de Geração (CEG).
  limitations: Coluna de data armazenada como VARCHAR no Parquet em vez de DATE. Coluna de data de fim
    armazenada como VARCHAR. Coexistência de dois identificadores de conjunto (id_conjuntousina INTEGER
    e id_ons_conjunto VARCHAR) pode gerar inconsistências se um conjunto possuir múltiplos id_conjuntousina
    ou vice-versa.
  usage: Recuperar este dataset quando a pergunta envolver composição, membros ou histórico de conjuntos
    de usinas Tipo II-C, identificação de usinas por conjunto ou conjunto por usina, ou cruzamento de
    identificadores ONS (id_ons_usina, id_ons_conjunto) com CEG da ANEEL.
domain: geração
schema:
- name: usina_conjunto
  physicalType: parquet
  logicalType: object
  physicalName: usina_conjunto
  properties:
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Identificador do subsistema elétrico ao qual a usina pertence (ex: SE, S, NE, N)'
    customProperties:
    - property: aliases
      value:
      - subsistema
      - sistema
      - submercado
      - cod_subsistema
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
  - name: nom_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome descritivo do subsistema elétrico (ex: Sudeste/Centro-Oeste, Sul, Nordeste, Norte)'
    customProperties:
    - property: aliases
      value:
      - nome subsistema
      - nome do subsistema
      - região elétrica
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Nordeste
      - Norte
      - Sudeste/Centro-Oeste
      - Sul
  - name: estad_id
    physicalType: VARCHAR
    logicalType: string
    description: Código identificador do estado federativo onde a usina está localizada (sigla UF)
    customProperties:
    - property: aliases
      value:
      - uf
      - estado_id
      - sigla_estado
      - cod_estado
      - UF
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - BA
      - CE
      - GO
      - MA
      - MG
      - MS
      - MT
      - PB
      - PE
      - PI
      - PR
      - RN
      - RS
      - SC
      - SP
  - name: nom_estado
    physicalType: VARCHAR
    logicalType: string
    description: Nome completo do estado federativo onde a usina está localizada
    customProperties:
    - property: aliases
      value:
      - estado
      - nome estado
      - nome do estado
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - BAHIA
      - CEARA
      - GOIAS
      - MARANHAO
      - MATO GROSSO
      - MATO GROSSO DO SUL
      - MINAS GERAIS
      - PARAIBA
      - PARANA
      - PERNAMBUCO
      - PIAUI
      - RIO GRANDE DO NORTE
      - RIO GRANDE DO SUL
      - SANTA CATARINA
      - SAO PAULO
  - name: id_tipousina
    physicalType: VARCHAR
    logicalType: string
    description: 'Código identificador do tipo de usina conforme classificação ONS (ex: II-C para usinas
      de conjunto)'
    customProperties:
    - property: aliases
      value:
      - tipo usina
      - cod_tipo_usina
      - tipo_usina
      - classificacao_usina
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - UEE
      - UFV
      - UHE
      - UTE
  - name: nom_tipousina
    physicalType: VARCHAR
    logicalType: string
    description: Descrição textual do tipo de usina conforme classificação ONS
    customProperties:
    - property: aliases
      value:
      - nome tipo usina
      - descricao tipo usina
      - tipo de usina
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Eolielétrica
      - Fotovoltaica
      - Hidroelétrica
      - Térmica
  - name: id_conjuntousina
    physicalType: INTEGER
    logicalType: integer
    description: Identificador numérico interno do conjunto de usinas no sistema ONS. Chave interna sequencial;
      coexiste com id_ons_conjunto. Valores observados entre 3 e 316.
    customProperties:
    - property: aliases
      value:
      - id conjunto
      - id_conjunto
      - conjunto_id
      - identificador conjunto
    - property: semanticType
      value: IDENTIFIER
  - name: id_ons_conjunto
    physicalType: VARCHAR
    logicalType: string
    description: Código oficial ONS do conjunto de usinas. Representa o identificador público/regulatório
