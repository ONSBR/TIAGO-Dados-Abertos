version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:usina_conjunto
name: usina_conjunto
tenant: ons
tags:
- ANEEL
- CEG
- ONS
- Tipo II-C
- cadastro
- composição de conjunto
- conjunto
- conjunto de usinas
- conjunto usinas Tipo II-C
- geração
- relacionamento conjunto usina
