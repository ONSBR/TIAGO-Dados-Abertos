customProperties:
- property: vectorTags
  value:
  - quais usinas formam o conjunto
  - composicao dos conjuntos de usinas
  - conjunto de usinas eolicas
  - ceg das usinas do conjunto
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver composição, membros ou histórico de conjuntos
    de usinas Tipo II-C, identificação de usinas por conjunto ou conjunto por usina, ou cruzamento de
    identificadores ONS (id_ons_usina, id_ons_conjunto) com CEG da ANEEL. Também relevante quando a consulta
    requer filtro de vigência de associação usina-conjunto para análises de geração agregada ou restrições
    operativas por conjunto.
- property: agentInstructions
  value: '- [dat_iniciorelacionamento] Coluna de data armazenada como VARCHAR no Parquet em vez de DATE/TIMESTAMP.
    Pode conter formatos variados (YYYY-MM-DD, DD/MM/YYYY) ou valores inválidos que impedem ordenação
    e filtragem direta sem conversão explícita.


    - [dat_fimrelacionamento] Coluna de data armazenada como VARCHAR no Parquet em vez de DATE/TIMESTAMP.
    Pode conter formatos variados ou valores inválidos que impedem operações de intervalo de vigência
    sem conversão explícita via TRY_CAST.


    - [id_conjuntousina] Identificador numérico interno com range 3–317, indicando que os IDs não são
    sequenciais a partir de 1. Pode haver lacunas na sequência que representam conjuntos inativos ou removidos
    do sistema, o que pode causar confusão em joins por ID numérico interno versus id_ons_conjunto alfanumérico.


    - [ceg] O CEG identifica unicamente um empreendimento de geração, mas uma mesma usina pode aparecer
    em múltiplos registros devido a diferentes períodos de vigência ou associação a diferentes conjuntos
    ao longo do tempo. Verificar se há CEGs com sobreposição de períodos de vigência no mesmo conjunto.


    - [id_ons_usina] Uma mesma usina (id_ons_usina) pode estar associada a múltiplos conjuntos ou ter
    múltiplos períodos de vigência. Verificar sobreposição temporal de relacionamentos para o mesmo id_ons_usina,
    o que indicaria inconsistência cadastral.


    - [nom_tipousina] Valores com trailing spaces detectados em ''nom_tipousina''. Use TRIM() em filtros
    WHERE para evitar perda de registros.'
