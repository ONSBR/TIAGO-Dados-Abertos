- property: fewShotQueries
  value:
  - question: Quais usinas estão atualmente associadas a conjuntos em cada subsistema?
    sql: SELECT uc.id_subsistema, uc.nom_subsistema, uc.id_ons_conjunto, uc.nom_conjunto, uc.id_ons_usina,
      uc.nom_usina, uc.id_tipousina, uc.nom_tipousina, TRY_CAST(uc.dat_iniciorelacionamento AS DATE) AS
      inicio_vigencia, TRY_CAST(uc.dat_fimrelacionamento AS DATE) AS fim_vigencia FROM read_parquet('s3://ons-aws-prod-opendata/dataset/usina_conjunto/*.parquet')
      AS uc WHERE TRY_CAST(uc.dat_fimrelacionamento AS DATE) >= CURRENT_DATE AND TRY_CAST(uc.dat_iniciorelacionamento
      AS DATE) <= CURRENT_DATE ORDER BY uc.nom_subsistema, uc.nom_conjunto, uc.nom_usina;
  - question: Quantas usinas de cada tipo estão associadas a conjuntos em cada subsistema?
    sql: SELECT uc.id_subsistema, uc.nom_subsistema, uc.id_tipousina, uc.nom_tipousina, COUNT(DISTINCT
      uc.id_ons_usina) AS qtd_usinas, COUNT(DISTINCT uc.id_ons_conjunto) AS qtd_conjuntos FROM read_parquet('s3://ons-aws-prod-opendata/dataset/usina_conjunto/*.parquet')
      AS uc WHERE TRY_CAST(uc.dat_fimrelacionamento AS DATE) >= CURRENT_DATE AND TRY_CAST(uc.dat_iniciorelacionamento
      AS DATE) <= CURRENT_DATE GROUP BY uc.id_subsistema, uc.nom_subsistema, uc.id_tipousina, uc.nom_tipousina
      ORDER BY uc.nom_subsistema, qtd_usinas DESC;
  - question: Qual é o histórico de usinas que integraram o conjunto de ID 42?
    sql: SELECT uc.id_conjuntousina, uc.id_ons_conjunto, uc.nom_conjunto, uc.id_ons_usina, uc.nom_usina,
      uc.ceg, uc.id_tipousina, TRY_CAST(uc.dat_iniciorelacionamento AS DATE) AS inicio_vigencia, TRY_CAST(uc.dat_fimrelacionamento
      AS DATE) AS fim_vigencia, DATEDIFF('day', TRY_CAST(uc.dat_iniciorelacionamento AS DATE), TRY_CAST(uc.dat_fimrelacionamento
      AS DATE) ) AS dias_vigencia FROM read_parquet('s3://ons-aws-prod-opendata/dataset/usina_conjunto/*.parquet')
      AS uc WHERE uc.id_conjuntousina = 42 ORDER BY TRY_CAST(uc.dat_iniciorelacionamento AS DATE), uc.nom_usina;
