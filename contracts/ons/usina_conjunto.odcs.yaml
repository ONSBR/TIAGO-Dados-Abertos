    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - codigo ons conjunto
      - cod_ons_conjunto
      - id ons conjunto
      - codigo conjunto ons
    - property: semanticType
      value: IDENTIFIER
  - name: id_ons_usina
    physicalType: VARCHAR
    logicalType: string
    description: Código oficial ONS da usina individual. Identificador único da usina no sistema ONS,
      utilizado para joins com outros datasets de geração.
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - codigo ons usina
      - cod_ons_usina
      - id ons usina
      - codigo usina ons
    - property: semanticType
      value: IDENTIFIER
  - name: nom_conjunto
    physicalType: VARCHAR
    logicalType: string
    description: Nome descritivo do conjunto de usinas ao qual a usina individual está associada
    customProperties:
    - property: aliases
      value:
      - nome conjunto
      - nome do conjunto
      - conjunto
    - property: semanticType
      value: DIMENSION
  - name: nom_usina
    physicalType: VARCHAR
    logicalType: string
    description: Nome descritivo da usina individual componente do conjunto
    customProperties:
    - property: aliases
      value:
      - nome usina
      - nome da usina
      - usina
    - property: semanticType
      value: DIMENSION
  - name: ceg
    physicalType: VARCHAR
    logicalType: string
    description: Código de Empreendimento de Geração da ANEEL. Identificador regulatório único da usina
      perante a ANEEL, utilizado para cruzamento com bases regulatórias externas.
    customProperties:
    - property: aliases
      value:
      - codigo empreendimento
      - cod_empreendimento
      - ceg aneel
      - codigo aneel
      - empreendimento geração
    - property: semanticType
      value: IDENTIFIER
  - name: dat_iniciorelacionamento
    physicalType: VARCHAR
    logicalType: string
    description: Data de início da vigência do relacionamento entre a usina e o conjunto. Armazenada como
      VARCHAR no Parquet; requer conversão para DATE em consultas temporais. Representa atributo cadastral
      de vigência, não dimensão de série temporal.
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - data inicio
      - inicio relacionamento
      - data inicio vigencia
      - dat_inicio
    - property: semanticType
      value: TIMESTAMP
  - name: dat_fimrelacionamento
    physicalType: VARCHAR
    logicalType: string
    description: 'Data de fim da vigência do relacionamento entre a usina e o conjunto. Armazenada como
      VARCHAR no Parquet; pode conter valor sentinela para registros ativos (ex: ''9999-12-31'' ou ''2999-12-31'').
      Requer conversão para DATE em consultas temporais.'
    customProperties:
    - property: aliases
      value:
      - data fim
      - fim relacionamento
      - data fim vigencia
      - dat_fim
      - data encerramento
    - property: semanticType
      value: TIMESTAMP
