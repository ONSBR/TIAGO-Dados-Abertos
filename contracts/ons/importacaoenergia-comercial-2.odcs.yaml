      preco_medio_por_pais_ano:
        template: "SELECT nom_pais,\n  EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) AS ano,\n\
          \  AVG(val_preco) AS preco_medio_rs_mwh,\n  MIN(val_preco) AS preco_min_rs_mwh,\n  MAX(val_preco)\
          \ AS preco_max_rs_mwh\nFROM {source}\nWHERE val_preco IS NOT NULL\nGROUP BY 1, 2\nORDER BY 2,\
          \ 1\n"
        output_unit: R$/MWh
        matches:
          output_modes:
          - average
          - comparison
          metrics:
          - preco
          grain: year
      diferenca_programada_despachada:
        template: "SELECT nom_pais,\n  AVG(val_importacaodespachada - val_importacaoprogramada) AS diferenca_media_mwmed,\n\
          \  SUM(val_importacaodespachada - val_importacaoprogramada) AS diferenca_total_mwh\nFROM {source}\n\
          GROUP BY 1\nORDER BY 2 DESC\n"
        output_unit: MWmed / MWh
        matches:
          output_modes:
          - comparison
          metrics:
          - importacaodespachada
          - importacaoprogramada
          grain: all
      importacao_verificada_com_nulos:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  SUM(val_importacaoverificada)\
          \ AS total_verificada_mwh,\n  COUNT(*) AS total_registros,\n  COUNT(val_importacaoverificada)\
          \ AS registros_com_valor\nFROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP))\
          \ = {year}\nGROUP BY 1\nORDER BY 1\n"
        output_unit: MWh
        note: 'Inclui contagem de nulos para transparencia. val_importacaoverificada tem ~75.6% de nulos;
          total_verificada_mwh reflete apenas registros consolidados.

          '
        matches:
          output_modes:
          - total
          metrics:
          - importacaoverificada
          grain: month
        validated_params:
          year: '2020'
    ambiguity_policy:
      default_assumptions:
      - when: usuario menciona "importacao" sem especificar tipo
        assume_metric: importacaodespachada
        assume_output: total
        note: 'Importacao despachada representa o volume efetivamente operacionalizado, sendo a metrica
          mais relevante para analises operacionais. Se o contexto for financeiro/PMO, preferir importacaoprogramada.

          '
      - when: usuario menciona "energia importada" sem qualificador
        assume_metric: importacaodespachada
        assume_output: total
        note: Padrao operacional; despachada e o dado mais completo (sem nulos).
      - when: usuario menciona "preco" ou "custo" sem especificar metrica
        assume_metric: preco
        assume_output: average
        note: Preco e intensivo (R$/MWh); media e a agregacao correta. Alertar sobre 42.6% de nulos.
      - when: usuario pede "total de importacao" sem especificar unidade
        assume_metric: importacaodespachada
        assume_output: total
        note: 'unit_note: SUM(val_importacaodespachada) retorna MWh quando interval_hours=1.0. Para GWh
          dividir por 1000; para TWh dividir por 1.000.000.

          '
      must_clarify_when:
      - trigger_terms:
        - programada
        - despachada
        - verificada
        - medida
        - consolidada
        question: 'Qual tipo de importacao deseja analisar? (1) Programada — conforme PMO, sem nulos,
          serie completa desde 2019; (2) Despachada — volume efetivamente operacionalizado, sem nulos;
          (3) Verificada — dado consolidado pos-operacao, ~75.6% de nulos (disponivel apenas para periodos
          ja consolidados).

          '
        reason: 'Os tres tipos de importacao tem semanticas distintas e coberturas de nulos muito diferentes.
          A escolha errada pode resultar em analise com dados incompletos (verificada) ou comparacao inadequada
          entre planejamento e execucao.

          '
      - trigger_terms:
        - comparar
        - diferenca
        - desvio
        - aderencia
        question: 'Deseja comparar: (1) programada vs despachada (aderencia ao PMO), (2) despachada vs
          verificada (conformidade operacional), ou (3) entre paises/agentes para a mesma metrica?

          '
        reason: 'Comparacoes entre tipos de importacao tem interpretacoes operacionais distintas e requerem
          tratamento diferente de nulos em val_importacaoverificada.

          '
      redirect_when:
      - user_mentions:
        - usina
        - ceg
        - itaipu
        - angra
        - ranking de usinas
        - usina especifica
        reason: Schema nao contem CEG, usina ou identificador fisico de usina.
        redirect: geracao-usina-2
      - user_mentions:
        - nuclear
        reason: Schema nao contem coluna ou dimensao de geracao nuclear.
        redirect: geracao-usina-2 com filtro de combustivel nuclear
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Schema nao contem coluna MMGD ou dimensao de microgeracao distribuida.
        redirect: dataset com coluna val_germmgd quando disponivel
      - user_mentions:
        - exportacao
        - exportar energia
        reason: Dataset registra apenas importacao comercial pelo Brasil; exportacao nao esta presente.
        redirect: verificar dataset de intercambio ou exportacao quando disponivel
      - user_mentions:
        - venezuela
        reason: Venezuela nao consta no enum fisico de nom_pais (apenas ARGENTINA e URUGUAI).
      - user_mentions:
        - subsistema
        - sudeste
        - nordeste
        - sul
        - norte
        - sin
        reason: Dataset nao tem dimensao de subsistema; cobre intercambio internacional por pais.
        redirect: balanco-energia-subsistema ou intercambio-energia-subsistema
      - user_mentions:
        - gas natural
        - biomassa
        - carvao
        - combustivel
        - fonte geradora
        reason: Schema nao discrimina combustivel ou fonte; val_importacaodespachada agrega toda importacao.
        redirect: geracao-usina-2 para analise por combustivel
- property: fewShotQueries
  value:
  - question: Qual foi o volume total de energia importada programada e despachada por país em cada mês?
    sql: SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, nom_pais, SUM(val_importacaoprogramada)
      AS total_programado_mwmed, SUM(val_importacaodespachada) AS total_despachado_mwmed, ROUND(100.0
      * SUM(val_importacaodespachada) / NULLIF(SUM(val_importacaoprogramada), 0), 2) AS pct_despacho_vs_programado
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/importacaoenergia-comercial-2-ho/*.parquet')
      WHERE val_importacaoprogramada IS NOT NULL GROUP BY DATE_TRUNC('month', TRY_CAST(din_instante AS
      TIMESTAMP)), nom_pais ORDER BY mes DESC, total_despachado_mwmed DESC
  - question: Quais agentes comercializadores mais importaram energia no período e qual o preço médio
      ofertado?
    sql: SELECT nom_agente, nom_pais, COUNT(DISTINCT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)))
      AS meses_ativos, SUM(val_importacaodespachada) AS total_despachado_mwmed, ROUND(AVG(val_preco),
      2) AS preco_medio_rs_mwh, MIN(val_preco) AS preco_min_rs_mwh, MAX(val_preco) AS preco_max_rs_mwh
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/importacaoenergia-comercial-2-ho/*.parquet')
      WHERE val_importacaodespachada > 0 GROUP BY nom_agente, nom_pais ORDER BY total_despachado_mwmed
      DESC LIMIT 20
  - question: Em quais blocos horários do PMO ocorrem os maiores desvios entre energia programada e despachada?
    sql: SELECT nom_bloco, nom_pais, COUNT(*) AS total_registros, ROUND(AVG(val_importacaodespachada -
      val_importacaoprogramada), 4) AS desvio_medio_mwmed, ROUND(SUM(ABS(val_importacaodespachada - val_importacaoprogramada)),
      2) AS desvio_absoluto_total, COUNT(*) FILTER (WHERE val_importacaodespachada > val_importacaoprogramada)
      AS registros_acima_programado, COUNT(*) FILTER (WHERE val_importacaodespachada < val_importacaoprogramada)
      AS registros_abaixo_programado FROM read_parquet('s3://ons-aws-prod-opendata/dataset/importacaoenergia-comercial-2-ho/*.parquet')
      WHERE val_importacaoprogramada IS NOT NULL AND val_importacaodespachada IS NOT NULL GROUP BY nom_bloco,
      nom_pais ORDER BY desvio_absoluto_total DESC
- property: relatedDatasets
  value:
    ofertapreco-importacao:
      join_keys:
      - nom_pais
      - nom_agente
      - nom_bloco
      - val_preco
