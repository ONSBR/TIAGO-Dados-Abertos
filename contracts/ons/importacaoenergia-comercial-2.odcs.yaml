  quality:
  - type: custom
    engine: soda
    implementation: "checks for importacaoenergia_comercial_2:\n  - row_count > 0:\n      name: Tabela\
      \ não pode estar vazia\n\n  # Referential integrity\n  - invalid_count(nom_pais) = 0:\n      valid\
      \ values:\n        - 'ARGENTINA'\n        - 'URUGUAI'\n      name: nom_pais deve ser um dos valores\
      \ válidos\n  - invalid_count(nom_agente) = 0:\n      valid values:\n        - 'AXIA ENERGIA'\n \
      \       - 'BANCO BTG'\n        - 'BOLT'\n        - 'ELETROBRAS'\n        - 'ENEL'\n        - 'TRADENER'\n\
      \      name: nom_agente deve ser um dos valores válidos\n  - invalid_count(nom_bloco) = 0:\n   \
      \   valid values:\n        - 'BLOCO 1'\n        - 'BLOCO 10'\n        - 'BLOCO 2'\n        - 'BLOCO\
      \ 3'\n        - 'BLOCO 4'\n        - 'BLOCO 5'\n        - 'BLOCO 6'\n        - 'BLOCO 7'\n     \
      \   - 'BLOCO 8'\n        - 'BLOCO 9'\n      name: nom_bloco deve ser um dos valores válidos\n\n\
      \  # Unicidade da chave primária composta ['nom_pais', 'nom_agente', 'nom_bloco', 'din_instante']\
      \ (candidata LLM)\n  - failed rows:\n      name: Chave composta (nom_pais, nom_agente, nom_bloco,\
      \ din_instante) não deve ter duplicatas\n      fail query: |\n        SELECT * FROM importacaoenergia_comercial_2\n\
      \        WHERE (nom_pais, nom_agente, nom_bloco, din_instante) IN (\n          SELECT nom_pais,\
      \ nom_agente, nom_bloco, din_instante FROM importacaoenergia_comercial_2\n          GROUP BY nom_pais,\
      \ nom_agente, nom_bloco, din_instante\n          HAVING COUNT(*) > 1\n        )\n\n  # Nulos em\
      \ val_importacaoverificada — alerta de qualidade (real=0%, threshold=5.0%)\n  - missing_percent(val_importacaoverificada)\
      \ < 5.0:\n      name: val_importacaoverificada não deve ter >5.0% nulos\n\n  # Nulos em val_preco\
      \ — alerta de qualidade (real=0%, threshold=5.0%)\n  - missing_percent(val_preco) < 5.0:\n     \
      \ name: val_preco não deve ter >5.0% nulos\n\n  # Freshness: din_instante deve ter dados recentes\
      \ (SLA: Atualizado diariamente)\n  - freshness(din_instante) < 3d:\n      name: din_instante não\
      \ pode ter dados com mais de 3 dias de atraso\n"
