description:
  purpose: Prover base de dados horária para acompanhamento, auditoria e análise das transações de importação
    comercial de energia elétrica com países vizinhos (Argentina, Uruguai, Venezuela e outros), suportando
    decisões de despacho econômico, liquidação financeira no mercado de curto prazo, planejamento da operação
    do sistema interligado e fiscalização regulatória pela ANEEL e CCEE. Utilizado por operadores do ONS,
    agentes comercializadores, reguladores e analistas do setor elétrico para comparar volumes programados
    versus despachados versus verificados e avaliar o custo de importação por bloco horário e por país
    exportador.
  limitations: 75. 42. O valor mínimo de val_importacaoverificada é -0.
  usage: Recuperar este dataset quando a pergunta envolver volumes ou preços de importação de energia
    elétrica na modalidade comercial internacional (Argentina, Uruguai, Venezuela), discriminados por
    país exportador, agente comercializador ou bloco horário do PMO.
domain: intercâmbio
