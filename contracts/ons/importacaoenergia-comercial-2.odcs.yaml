- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver volumes ou preços de importação de energia
    elétrica na modalidade comercial internacional (Argentina, Uruguai, Venezuela), discriminados por
    país exportador, agente comercializador ou bloco horário do PMO. Também relevante para análises de
    balanço de intercâmbio comercial, auditoria de despacho programado versus verificado, e avaliação
    de custo de importação em R$/MWh por período horário.
- property: agentInstructions
  value: '- [val_importacaoverificada] 77,1% dos registros possuem valor nulo em val_importacaoverificada
    (aproximadamente 286.804 linhas). A verificação só é preenchida após consolidação dos dados reais
    de operação, gerando defasagem significativa entre o instante do registro e a disponibilidade do dado
    verificado. Filtros que excluam nulos nesta coluna reduzem drasticamente o conjunto de dados disponível.


    - [val_preco] 45,1% dos registros possuem valor nulo em val_preco (aproximadamente 167.726 linhas).
    Blocos sem oferta de preço definida no PMO ou períodos sem contrato ativo resultam em ausência do
    valor. Análises financeiras devem tratar esses nulos explicitamente para evitar subestimação do custo
    total de importação.


    - [val_importacaoverificada] O valor mínimo de val_importacaoverificada é -0.0 (zero negativo), indicando
    possível artefato de arredondamento ou representação de fluxo reverso em situações de exportação líquida.
    Embora numericamente zero, a presença de sinal negativo pode causar inconsistências em comparações
    e filtros de validação.


    - [val_preco] val_preco apresenta amplitude extrema: mínimo de R$ 23,61/MWh e máximo de R$ 2.282,36/MWh.
    O valor máximo é aproximadamente 97 vezes o mínimo, sugerindo possíveis outliers em períodos de escassez
    hídrica ou eventos de mercado atípicos. Recomenda-se análise de distribuição antes de usar a média
    simples como referência de preço.


    - [din_instante] Dado que o dataset cobre o período 2019-01-01 a 2026-06-13 com granularidade horária
    e múltiplas combinações de país/agente/bloco, descontinuidades temporais podem existir para combinações
    específicas. Recomenda-se verificar gaps horários por país e agente para garantir integridade das
    séries temporais em análises de despacho e liquidação.


    - [val_importacaodespachada] val_importacaodespachada apresenta valor máximo de 600,621 MWmed, ligeiramente
    superior ao máximo de val_importacaoprogramada (600,0 MWmed). Valores despachados acima do programado
    podem indicar redespacho emergencial ou inconsistência de dados. Recomenda-se validar registros onde
    val_importacaodespachada supera val_importacaoprogramada.

    '
