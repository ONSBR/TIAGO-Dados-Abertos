    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: true
      supports_ranking: true
      primary_use_case: serie_temporal
    selection_policy:
      covers_metrics:
      - potencia
      - dispf
      - indisppf
      - indispff
      - dmdff
      - fdff
      - tdff
      preferred_for:
      - indicadores anuais UG
      - disponibilidade anual unidade geradora
      - DMDFF por usina
      - FDFF anual
      - duracao media falha forcada
      - frequencia falha forcada anual
      - TDFF anual UG
      - confiabilidade anual UG
      - benchmarking disponibilidade agente
      - Submodulo 9.2 anual
      - serie historica disponibilidade UG
      - indisponibilidade forcada anual por unidade
      not_preferred_for:
      - nuclear
      - MMGD
      - microgeracao
      - minigeracao
      - geracao distribuida
      - disponibilidade mensal
      - disponibilidade horaria
      - disponibilidade transmissao
      - disponibilidade linha transmissao
      - geracao verificada horaria
      - despacho horario
      - preco energia
      - CMO
      - PLD
      - carga subsistema
      - intercambio
      - EOL
      - UFV
      - PCH
    value_aliases:
      subsistema:
        SE:
          aliases:
          - sudeste
          - centro-oeste
          - se/co
          - sudeste centro-oeste
          filter: id_subsistema = 'SE'
        S:
          aliases:
          - sul
          filter: id_subsistema = 'S'
        NE:
          aliases:
          - nordeste
          filter: id_subsistema = 'NE'
        N:
          aliases:
          - norte
          filter: id_subsistema = 'N'
        PY:
          aliases:
          - paraguai
          filter: id_subsistema = 'PY'
      nom_modalidadeoperacao:
        Tipo I:
          aliases:
          - tipo i
          - despachada centralizadamente
          - DCE
          filter: nom_modalidadeoperacao = 'Tipo I'
        Tipo II-A:
          aliases:
          - tipo ii-a
          - nao despachada centralizadamente
          - NDCE
          filter: nom_modalidadeoperacao = 'Tipo II-A'
      id_tipousina:
        UHE:
          aliases:
          - UHE
          - hidreletrica
          - hidreletrico
          filter: id_tipousina = 'UHE'
        UTE:
          aliases:
          - UTE
          - termeletrica
          - termico
          filter: id_tipousina = 'UTE'
        UTN:
          aliases:
          - UTN
          - nuclear
          - usina nuclear
          filter: id_tipousina = 'UTN'
    sql_patterns:
      disponibilidade_media_por_tipo_ano:
        template: "SELECT din_ano, id_tipousina,\n  AVG(val_dispf) AS dispf_media_pct,\n  AVG(val_indispff)\
          \ AS indispff_media_pct,\n  AVG(val_indisppf) AS indisppf_media_pct\nFROM {source}\nWHERE TRY_CAST(din_ano\
          \ AS INTEGER) BETWEEN {ano_inicio} AND {ano_fim}\nGROUP BY din_ano, id_tipousina\nORDER BY din_ano,\
          \ id_tipousina"
        output_unit: '%'
        matches:
          output_modes:
          - average
          metrics:
          - dispf
          - indispff
          - indisppf
          grain: year
      ranking_agente_disponibilidade:
        template: "SELECT nom_agenteproprietario,\n  AVG(val_dispf) AS dispf_media_pct,\n  COUNT(DISTINCT\
          \ ceg || '-' || num_unidadegeradora) AS num_ugs\nFROM {source}\nWHERE TRY_CAST(din_ano AS INTEGER)\
          \ = {ano}\nGROUP BY nom_agenteproprietario\nORDER BY dispf_media_pct ASC"
        output_unit: '%'
        matches:
          output_modes:
          - ranking
          metrics:
          - dispf
          grain: year
      dmdff_serie_historica:
        template: "SELECT din_ano, id_tipousina,\n  AVG(val_dmdff) AS dmdff_media_h,\n  MAX(val_dmdff)\
          \ AS dmdff_max_h\nFROM {source}\nWHERE TRY_CAST(din_ano AS INTEGER) BETWEEN {ano_inicio} AND\
          \ {ano_fim}\nGROUP BY din_ano, id_tipousina\nORDER BY din_ano, id_tipousina"
        output_unit: h
        matches:
          output_modes:
          - average
          - maximum
          metrics:
          - dmdff
          grain: year
    ambiguity_policy:
      default_assumptions:
      - when: usuario pergunta disponibilidade sem especificar tipo
        assume_metric: dispf
        assume_output: average
        note: val_dispf e a metrica principal de disponibilidade; percentual nao deve ser somado
      - when: usuario pergunta falha forcada sem especificar metrica
        assume_metric: indispff
        assume_output: average
        note: indisponibilidade forcada percentual e o indicador mais consultado de falha
      - when: usuario pergunta duracao de falha
        assume_metric: dmdff
        assume_output: average
        note: DMDFF e uma media intensiva; nao somar entre UGs
      - when: usuario pergunta frequencia de falha
        assume_metric: fdff
        assume_output: average
        note: FDFF e uma taxa intensiva (falhas/h); nao somar entre UGs
      - when: usuario pergunta horas de falha ou tempo total indisponivel
        assume_metric: tdff
        assume_output: total
        note: TDFF pode ser somado para totalizar horas de falha de um conjunto de UGs; alertar sobre
          possivel acumulado multi-anual se valor > 8760
      must_clarify_when:
      - ambiguity: disponibilidade_vs_indisponibilidade
        question: Voce quer a disponibilidade (val_dispf, % do tempo disponivel) ou a indisponibilidade
          (val_indispff para falhas forcadas ou val_indisppf para manutencao programada)?
        trigger_terms:
        - desempenho
        - performance
        - confiabilidade
        - indicador
      - ambiguity: media_vs_pior_caso
        question: Voce quer a media de disponibilidade entre as UGs ou identificar as piores (ranking)?
        trigger_terms:
        - pior
        - melhor
        - ranking
        - top
        - mais critico
      - ambiguity: granularidade_ug_vs_usina
        question: Voce quer o indicador por unidade geradora individual ou agregado por usina (todas as
          UGs da usina)?
        trigger_terms:
        - usina
        - planta
        - empreendimento
      redirect_when:
      - user_mentions:
        - nuclear
        - angra
        reason: UTN aparece no schema mas nuclear como combustivel separado nao existe; para geracao nuclear
          usar geracao-usina-2 com filtro de tipo.
        redirect: geracao-usina-2 com filtro id_tipousina = 'UTN'
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Schema nao contem coluna MMGD; id_tipousina so cobre UHE, UTE, UTN.
        redirect: dataset com coluna val_germmgd quando disponivel
      - user_mentions:
        - eolica
        - eolico
        - EOL
        - vento
        reason: id_tipousina nao contem EOL neste dataset; usinas eolicas ausentes.
        redirect: ind_disponibilidade_fgeracao_uge_mensal com filtro EOL
      - user_mentions:
        - solar
        - fotovoltaica
        - UFV
        reason: id_tipousina nao contem UFV neste dataset; usinas solares ausentes.
        redirect: ind_disponibilidade_fgeracao_uge_mensal com filtro UFV
      - user_mentions:
        - mensal
        - mes
        - por mes
        reason: Granularidade deste dataset e anual (din_ano); para mensal usar dataset especifico.
        redirect: ind_disponibilidade_fgeracao_uge_mensal
      - user_mentions:
        - horario
        - hora
        - por hora
        reason: Granularidade deste dataset e anual; para horario usar disponibilidade_usina.
        redirect: disponibilidade_usina
      - user_mentions:
        - transmissao
        - linha de transmissao
        - equipamento transmissao
        reason: Dataset cobre apenas unidades geradoras, nao equipamentos de transmissao.
        redirect: ind_disponibilidade_ft_trlt
      - user_mentions:
        - geracao verificada
        - geracao horaria
        - MWmed
        - MWh gerado
        reason: Dataset reporta indicadores de disponibilidade, nao geracao verificada.
        redirect: geracao-usina-2
- property: fewShotQueries
  value:
  - question: Qual foi a disponibilidade forçada média por tipo de usina em 2023, ordenada da maior para
      a menor?
    sql: SELECT id_tipousina, COUNT(DISTINCT cod_equipamento) AS qtd_unidades, ROUND(AVG(val_dispf), 2)
      AS dispf_media_pct, ROUND(AVG(val_indispff), 2) AS indispff_media_pct, ROUND(AVG(val_indisppf),
      2) AS indisppf_media_pct FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_an/*.parquet')
      WHERE din_ano = 2023 GROUP BY id_tipousina ORDER BY dispf_media_pct DESC
  - question: Como evoluiu a indisponibilidade forçada média das unidades geradoras por subsistema entre
      2015 e 2023?
    sql: SELECT din_ano, id_subsistema, nom_subsistema, ROUND(AVG(val_indispff), 3) AS indispff_media_pct,
      COUNT(DISTINCT cod_equipamento) AS qtd_unidades FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_an/*.parquet')
      WHERE din_ano BETWEEN 2015 AND 2023 AND id_subsistema NOT IN ('SIN') GROUP BY din_ano, id_subsistema,
      nom_subsistema ORDER BY din_ano, id_subsistema
  - question: Quais unidades geradoras acumularam mais horas de falhas forçadas em 2022?
    sql: SELECT cod_equipamento, nom_unidadegeradora, id_tipousina, nom_agenteproprietario, id_subsistema,
      val_potencia, val_tdff, val_fdff, val_dmdff, val_indispff FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_an/*.parquet')
      WHERE din_ano = 2022 AND val_tdff <= 8760 ORDER BY val_tdff DESC LIMIT 20
