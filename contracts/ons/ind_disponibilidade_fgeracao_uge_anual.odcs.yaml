authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/ind_disponibilidade_fgeracao_uge_anual
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - disponibilidade anual das unidades geradoras
  - indisponibilidade das maquinas no ano
  - falhas das unidades geradoras por ano
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver indicadores anuais de desempenho, disponibilidade,
    indisponibilidade (programada ou forçada), confiabilidade ou falhas de unidades geradoras do SIN,
    especialmente quando o horizonte temporal for anual e a granularidade for por unidade geradora ou
    usina. Também relevante para perguntas sobre conformidade com o Submódulo 9.2 dos Procedimentos de
    Rede do ONS, benchmarking de desempenho entre agentes, tipos de usina ou subsistemas, e análise de
    tendências históricas de confiabilidade do parque gerador brasileiro.
- property: agentInstructions
  value: '- [val_tdff] O valor máximo de val_tdff é 178.560 horas, superando as 8.760 horas de um ano.
    Pode representar acumulado histórico multi-anual por unidade geradora em vez do total anual de referência
    din_ano. Requer validação contra a definição do Submódulo 9.2.

    - [val_dispf] Registros com val_dispf = 0.0 indicam unidades geradoras com disponibilidade forçada
    nula no ano inteiro, possivelmente em descomissionamento, reforma total ou com erro de registro.

    - [val_indisppf] Registros com val_indisppf = 100.0 indicam unidade geradora com 100% do tempo em
    indisponibilidade programada no ano, podendo representar unidades em reforma completa ou dados inconsistentes.

    - [val_indispff] Registros com val_indispff = 100.0 indicam unidade geradora com 100% do tempo em
    indisponibilidade forçada no ano, situação extrema que pode indicar unidade desativada ou erro de
    dados.

    - [val_dmdff] O valor máximo de val_dmdff é 735.99 horas (~30,6 dias). Valores acima de 720 horas
    merecem validação para distinguir falhas forçadas de manutenções programadas mal classificadas no
    Submódulo 9.2.

    - [din_ano] Unidades geradoras que entraram em operacao depois do inicio da serie ou ja foram desativadas terao
    series temporais incompletas. Verificar se todas as UGs ativas têm registros contínuos para
    todos os anos do período.

    - [num_unidadegeradora] A chave primária natural é (din_ano, cod_equipamento, num_unidadegeradora).
    Duplicatas podem indicar registros duplicados por reprocessamento do processo de consistência recorrente
    do ONS.

    - [val_potencia] val_potencia varia de 3.4 MW a 1350.0 MW. Valores abaixo de 1 MW podem indicar erro
    de unidade (kW registrado como MW), distorcendo análises ponderadas por capacidade instalada.'
- property: typicalQuestions
  value:
  - Qual foi a disponibilidade média das usinas hidrelétricas no subsistema Sudeste em 2023?
  - Quais unidades geradoras tiveram maior indisponibilidade forçada nos últimos 5 anos?
  - Como evoluiu a duração média de falhas forçadas das termelétricas entre 2015 e 2023?
  - Qual agente proprietário apresentou pior desempenho de disponibilidade em 2022?
  - Quais usinas eólicas tiveram frequência de falhas forçadas acima de 0.005 falhas/hora em 2023?
- property: granularity
  value: anual
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/ind_disponibilidade_fgeracao_uge_an/*.parquet',
    union_by_name=true)
- property: temporalCoverageStart
  value: '2011-01-01'
- property: semantics
  value:
    measure_terms:
    - disponibilidade
    - disponivel
    - indisponibilidade
    - indisponivel
    temporal_perspective: verificado
    row_grain:
      temporal: 1 dia
      temporal_column: din_ano
      spatial: usina
      entity: usina
      one_row_per:
      - din_ano
      - id_subsistema
      - ceg
      - cod_equipamento
      - num_unidadegeradora
    dimension_columns:
      subsistema: id_subsistema
      fonte: null
      usina: ceg
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: potencia
      label: Potencia Instalada UG
      columns:
      - val_potencia
      expression: val_potencia
      quantity_kind: capacity
      unit_native: MW
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total:
          sql: SUM(val_potencia)
          unit: MW
        maximum:
          sql: MAX(val_potencia)
          unit: MW
        time_series:
          sql: SUM(val_potencia)
          unit: MW
        ranking:
          sql: SUM(val_potencia)
          unit: MW
        comparison:
          sql: SUM(val_potencia)
          unit: MW
      interval_hours: 24.0
      aliases:
      - potencia
      - potencia instalada
      - capacidade instalada
      - val_potencia
    - id: dispf
      label: Disponibilidade Forcada (%)
      columns:
      - val_dispf
      expression: val_dispf
      quantity_kind: ratio
      unit_native: '%'
      default_aggregation: avg
      forbidden_aggregations:
      - sum
      aggregation_modes:
        average:
          sql: AVG(val_dispf)
          unit: '%'
        maximum:
          sql: MAX(val_dispf)
          unit: '%'
        minimum:
          sql: MIN(val_dispf)
          unit: '%'
        time_series:
          sql: AVG(val_dispf)
          unit: '%'
        ranking:
          sql: AVG(val_dispf)
          unit: '%'
        comparison:
          sql: AVG(val_dispf)
          unit: '%'
      interval_hours: 24.0
