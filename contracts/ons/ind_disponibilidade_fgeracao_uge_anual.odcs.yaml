description:
  purpose: Prover indicadores anuais de confiabilidade e desempenho operacional das unidades geradoras
    do SIN para uso por agentes do setor elétrico, reguladores (ANEEL) e o ONS, suportando decisões de
    planejamento da operação, programação de manutenção, avaliação de conformidade regulatória com o Submódulo
    9.2, benchmarking entre usinas e subsistemas, e análise de tendências de disponibilidade ao longo
    do tempo para garantir a segurança do suprimento energético.
  limitations: O ano maximo pode ultrapassar o ano corrente, indicando presenca de dados futuros ou projetados. Valor máximo de
    178. Valor máximo de 735 horas de duração média de falhas forçadas no dataset ind_disponibilidade_fgeracao_uge_anual
    equivale a ~30 dias contínuos, podendo indicar longas paradas não programadas ou inconsistências de
    classificação.
  usage: Recuperar este dataset quando a pergunta envolver indicadores anuais de desempenho, disponibilidade,
    indisponibilidade (programada ou forçada), confiabilidade ou falhas de unidades geradoras do SIN,
    especialmente quando o horizonte temporal for anual e a granularidade for por unidade geradora ou
    usina.
