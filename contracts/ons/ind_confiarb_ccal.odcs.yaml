authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/ind_confiarb_ccal
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - linhas sobrecarregadas
  - carregamento das linhas de transmissao
  - linhas acima do limite
  - quantas linhas violaram carregamento
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver carregamento, sobrecarga ou violação de linhas
    de transmissão da rede básica, indicador CCAL, proporção de linhas violadas por agente ou área de
    controle, ou conformidade regulatória de transmissão conforme Submódulo 9.1 do ONS. Também relevante
    para análises comparativas de confiabilidade entre agentes de transmissão ou períodos históricos a
    partir de 2016.
- property: agentInstructions
  value: '- [num_linhasoperacao] O valor mínimo de num_linhasoperacao é 0, o que pode indicar registros
    de entidades sem linhas em operação no período (ex: agentes com concessão inativa ou recém-constituídos).
    Quando num_linhasoperacao = 0, o cálculo de val_ccal resultaria em divisão por zero; verificar se
    val_ccal = 0.0 nesses casos ou se há tratamento especial pelo ONS.


    - [num_linhasvioladas] Verificar consistência entre num_linhasvioladas e num_linhasoperacao: num_linhasvioladas
    nunca deve ser maior que num_linhasoperacao. O máximo observado de num_linhasvioladas é 30 e de num_linhasoperacao
    é 1604, mas registros com num_linhasoperacao = 0 e num_linhasvioladas > 0 representariam inconsistência
    lógica grave.


    - [val_ccal] Verificar coerência entre val_ccal e a razão calculada diretamente (num_linhasvioladas
    / num_linhasoperacao). Divergências podem indicar metodologia de cálculo diferente do ONS (ex: ponderação
    por extensão de linha) ou arredondamentos. Casos com num_linhasoperacao = 0 e val_ccal = 0 devem ser
    tratados como casos especiais na análise.


    - [din_referencia] Verificar se há lacunas mensais na série temporal para cada combinação de entidade
    agregada e periodicidade. O periodo cobre de 2016-01-01 em diante, com um registro mensal esperado por combinacao. Ausências podem indicar períodos sem apuração ou entidades que entraram/saíram da rede básica.


    - [cod_tipoagregacao] Verificar se os valores de cod_tipoagregacao estão padronizados sem variações
    de caixa, espaços extras ou valores inesperados além dos três tipos documentados: SIN, AREA_CONTROLE
    e AGENTE. Inconsistências de nomenclatura podem causar falhas em joins e filtros.


    - [id_periodicidade] Verificar se existem registros duplicados na chave primária natural (cod_tipoagregacao,
    nom_agregacao, id_periodicidade, din_referencia). Duplicatas podem ocorrer em reprocessamentos do
    ONS e distorcer agregações e médias do indicador CCAL.

    '
- property: typicalQuestions
  value:
  - Qual foi o valor do indicador CCAL do SIN nos últimos 12 meses?
  - Quais agentes de transmissão apresentaram maior proporção de linhas violadas em 2024?
  - Como evoluiu o número de linhas sobrecarregadas na rede básica entre 2016 e 2025?
  - Qual área de controle teve o pior desempenho de carregamento de linhas no ano de 2023?
  - Quantas linhas de transmissão estavam em operação no SIN em março de 2026?
- property: granularity
  value: anual
- property: spatialGranularity
  value: nacional
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_ccal/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2016-01-01'
- property: semantics
  value:
    temporal_perspective: verificado
    row_grain:
      temporal: 1 ano
      temporal_column: din_referencia
      spatial: nacional
      entity: dataset_row
      one_row_per:
      - din_referencia
      - cod_tipoagregacao
      - id_periodicidade
      - nom_agregacao
    dimension_columns:
      subsistema: null
      fonte: null
      usina: null
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: ccal
      label: Indicador CCAL
      columns:
      - val_ccal
      expression: val_ccal
      quantity_kind: ratio
      unit_native: proporcao_0_1
      default_aggregation: sum
      forbidden_aggregations:
      - sum
      aggregation_modes:
        average:
          sql: AVG(val_ccal)
          unit: proporcao_0_1
        maximum:
          sql: MAX(val_ccal)
          unit: proporcao_0_1
        minimum:
          sql: MIN(val_ccal)
          unit: proporcao_0_1
        time_series:
          sql: AVG(val_ccal)
          unit: proporcao_0_1
        ranking:
          sql: AVG(val_ccal)
          unit: proporcao_0_1
        comparison:
          sql: AVG(val_ccal)
          unit: proporcao_0_1
      interval_hours: 8760.0
      aliases:
      - CCAL
      - indicador CCAL
      - controle de carregamento
      - indice de carregamento
      - valor CCAL
      - proporcao linhas violadas
    - id: num_linhasoperacao
      label: Linhas em Operacao
      columns:
      - num_linhasoperacao
      expression: num_linhasoperacao
      quantity_kind: count
      unit_native: linhas
      default_aggregation: maximum
      forbidden_aggregations:
      - sum
      aggregation_modes:
        maximum:
          sql: MAX(num_linhasoperacao)
          unit: linhas
        average:
          sql: AVG(num_linhasoperacao)
          unit: linhas
        time_series:
          sql: MAX(num_linhasoperacao)
          unit: linhas
        comparison:
          sql: MAX(num_linhasoperacao)
          unit: linhas
      interval_hours: 8760.0
      aliases:
      - linhas em operacao
      - total de linhas
      - linhas operando
      - numero de linhas
    - id: num_linhasvioladas
      label: Linhas Violadas
      columns:
      - num_linhasvioladas
      expression: num_linhasvioladas
      quantity_kind: count
      unit_native: linhas
      default_aggregation: maximum
      forbidden_aggregations:
      - sum
      aggregation_modes:
        maximum:
          sql: MAX(num_linhasvioladas)
          unit: linhas
        average:
          sql: AVG(num_linhasvioladas)
          unit: linhas
        time_series:
          sql: MAX(num_linhasvioladas)
          unit: linhas
        ranking:
          sql: MAX(num_linhasvioladas)
          unit: linhas
        comparison:
          sql: MAX(num_linhasvioladas)
          unit: linhas
      interval_hours: 8760.0
      aliases:
      - linhas violadas
      - linhas com violacao
      - linhas sobrecarregadas
      - violacoes
    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: true
      supports_ranking: true
      primary_use_case: serie_temporal
    value_aliases:
      cod_tipoagregacao:
        Agente:
          aliases:
          - agente
          - agente de transmissao
          - transmissora
          filter: cod_tipoagregacao = 'Agente'
        COSR:
          aliases:
          - COSR
          - area de controle
          - coordenadoria
          filter: cod_tipoagregacao = 'COSR'
        SIN:
          aliases:
          - SIN
          - sistema interligado
          - nacional
          - brasil
          filter: cod_tipoagregacao = 'SIN'
      id_periodicidade:
        AN:
          aliases:
          - AN
          - anual
          - ano
          filter: id_periodicidade = 'AN'
        ME:
          aliases:
          - ME
          - mensal
          - mes
          filter: id_periodicidade = 'ME'
    sql_patterns:
      ccal_sin_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_referencia AS TIMESTAMP)) AS mes,\n  AVG(val_ccal)\
          \ AS ccal_medio\nFROM {source}\nWHERE cod_tipoagregacao = 'SIN'\n  AND id_periodicidade = 'ME'\n\
          \  AND EXTRACT(YEAR FROM TRY_CAST(din_referencia AS TIMESTAMP)) = {year}\nGROUP BY 1\nORDER\
          \ BY 1"
        output_unit: proporcao_0_1
        matches:
          output_modes:
          - time_series
          metrics:
          - ccal
          grain: month
        validated_params:
          year: '2026'
      ccal_por_agente_anual:
        template: "SELECT nom_agregacao,\n  AVG(val_ccal) AS ccal_medio,\n  MAX(num_linhasvioladas) AS\
          \ max_linhas_violadas,\n  MAX(num_linhasoperacao) AS linhas_operacao\nFROM {source}\nWHERE cod_tipoagregacao\
          \ = 'Agente'\n  AND id_periodicidade = 'AN'\n  AND EXTRACT(YEAR FROM TRY_CAST(din_referencia\
          \ AS TIMESTAMP)) = {year}\nGROUP BY 1\nORDER BY 2 DESC"
        output_unit: proporcao_0_1
        matches:
          output_modes:
          - ranking
          - comparison
          metrics:
          - ccal
          grain: year
        validated_params:
          year: '2026'
      linhas_violadas_serie:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_referencia AS TIMESTAMP)) AS mes,\n  MAX(num_linhasvioladas)\
          \ AS linhas_violadas,\n  MAX(num_linhasoperacao) AS linhas_operacao\nFROM {source}\nWHERE cod_tipoagregacao\
          \ = 'SIN'\n  AND id_periodicidade = 'ME'\nGROUP BY 1\nORDER BY 1"
        output_unit: linhas
        matches:
          output_modes:
          - time_series
          metrics:
          - num_linhasvioladas
          - num_linhasoperacao
          grain: month
      ccal_calculado_verificacao:
        template: "SELECT din_referencia,\n  nom_agregacao,\n  num_linhasvioladas,\n  num_linhasoperacao,\n\
          \  val_ccal,\n  CASE WHEN num_linhasoperacao > 0\n    THEN ROUND(CAST(num_linhasvioladas AS\
          \ DOUBLE) / num_linhasoperacao, 6)\n    ELSE NULL END AS ccal_calculado\nFROM {source}\nWHERE\
          \ num_linhasoperacao > 0\nORDER BY din_referencia DESC"
        output_unit: proporcao_0_1
        matches:
          output_modes:
          - comparison
          metrics:
          - ccal
          grain: month
- property: fewShotQueries
  value:
  - question: Como evoluiu o indicador CCAL do Sistema Interligado Nacional mês a mês desde 2020?
    sql: SELECT din_referencia, val_ccal, num_linhasoperacao, num_linhasvioladas FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_ccal/*.parquet')
      WHERE cod_tipoagregacao = 'SIN' AND nom_agregacao = 'SIN' AND id_periodicidade = 'ME' AND din_referencia
      >= TIMESTAMP '2020-01-01' ORDER BY din_referencia;
  - question: Quais agentes de transmissão tiveram o maior indicador CCAL médio em 2024?
    sql: SELECT nom_agregacao, AVG(val_ccal) AS ccal_medio_2024, SUM(num_linhasvioladas) AS total_linhas_violadas,
      SUM(num_linhasoperacao) AS total_linhas_operacao, COUNT(*) AS meses_apurados FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_ccal/*.parquet')
      WHERE cod_tipoagregacao = 'Agente' AND id_periodicidade = 'ME' AND din_referencia >= TIMESTAMP '2024-01-01'
      AND din_referencia < TIMESTAMP '2025-01-01' GROUP BY nom_agregacao ORDER BY ccal_medio_2024 DESC
      LIMIT 20;
  - question: Como o CCAL de cada área de controle se compara com o indicador do SIN no mesmo período?
    sql: WITH sin_ref AS ( SELECT din_referencia, val_ccal AS ccal_sin FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_ccal/*.parquet')
      WHERE cod_tipoagregacao = 'SIN' AND nom_agregacao = 'SIN' AND id_periodicidade = 'ME' ), areas AS
      ( SELECT din_referencia, nom_agregacao, val_ccal AS ccal_area FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_ccal/*.parquet')
      WHERE cod_tipoagregacao = 'AREA_CONTROLE' AND id_periodicidade = 'ME' ) SELECT a.din_referencia,
      a.nom_agregacao, a.ccal_area, s.ccal_sin, a.ccal_area - s.ccal_sin AS desvio_do_sin FROM areas AS
      a LEFT JOIN sin_ref AS s ON a.din_referencia = s.din_referencia ORDER BY a.din_referencia DESC,
      desvio_do_sin DESC LIMIT 100;
- property: license
  value: CC-BY
