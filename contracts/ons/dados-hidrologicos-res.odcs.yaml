version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:dados-hidrologicos-res
name: dados-hidrologicos-res
tenant: ons
tags:
- ONS
- SIN
- balanço hídrico
- dados hidrológicos
- dados hidráulicos
- despacho hidrotérmico
- hidrologia
- nível montante
- reservatório hidrelétrico
- reservatórios
- reservatórios ONS
- vazão afluente
- volume útil
- volume útil reservatórios
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/dados_hidrologicos_di/*.parquet
  format: parquet
description:
  purpose: Prover aos operadores do ONS, planejadores energéticos, pesquisadores e agentes do mercado
    elétrico os dados hidráulicos diários consolidados dos reservatórios do SIN, permitindo monitoramento
    do estado de armazenamento, suporte ao despacho hidrotérmico otimizado, balanço hídrico por bacia
    e reservatório, estudos de planejamento da operação energética, análise de risco hidrológico e avaliação
    de disponibilidade hídrica para geração de energia elétrica.
  limitations: val_vazaoincrementalbruta tem nulos na maior parte das linhas — dado de preenchimento tardio ou não aplicável
    à maioria dos reservatórios; não deve ser usado como métrica obrigatória em análises. Valor mínimo
    de -2174,06 m³/s — fisicamente possível em contextos de transferência hídrica inversa ou evaporação
    líquida elevada, mas deve ser monitorado como possível erro de consistência. val_vazaoartificial tem nulos na maior parte das linhas — campo não se aplica a reservatórios sem regularização artificial; verificar se reservatórios com transferência
    hídrica possuem preenchimento adequado.
  usage: Recuperar este dataset quando a pergunta envolver estado operacional de reservatórios hidrelétricos
    do SIN, incluindo níveis, volumes de armazenamento, vazões afluentes, turbinadas, vertidas ou defluentes
    em base diária.
domain: hidrologia
schema:
- name: dados_hidrologicos_res
  physicalType: parquet
  logicalType: object
  physicalName: dados_hidrologicos_res
  properties:
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: Identificador do subsistema elétrico ao qual o reservatório pertence (SE, S, NE, N)
    customProperties:
    - property: aliases
      value:
      - subsistema
      - sistema
      - região elétrica
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
  - name: nom_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: Nome por extenso do subsistema elétrico (Sudeste/Centro-Oeste, Sul, Nordeste, Norte)
    customProperties:
    - property: aliases
      value:
      - nome subsistema
      - região
      - submercado
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Nordeste
      - Norte
      - Sudeste/Centro-Oeste
      - Sul
  - name: tip_reservatorio
    physicalType: VARCHAR
    logicalType: string
    description: Tipo do reservatório quanto à sua capacidade de regularização (equivalente, fio d'água,
      etc.)
    customProperties:
    - property: aliases
      value:
      - tipo reservatório
      - tipo de reservatório
      - classificação reservatório
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - CED
      - FIC
      - FIO
      - Fio dagua
      - RBB
      - RCU
      - RES
      - Reservatório Com Usina de Bombeamento
      - Reservatório com Usina
      - Reservatório sem usina
  - name: nom_bacia
    physicalType: VARCHAR
    logicalType: string
    description: Nome da bacia hidrográfica à qual o reservatório pertence
    customProperties:
    - property: aliases
      value:
      - bacia
      - bacia hidrográfica
      - bacia hidrológica
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - AMAZONAS
      - ARAGUARI
      - CAPIVARI
      - DOCE
      - GRANDE
      - IGUACU
      - ITABAPOANA
      - ITAJAI
      - JACUI
      - JEQUITINHONHA
      - MUCURI
      - PARAGUACU
      - PARAGUAI
      - PARAIBA DO SUL
      - PARANA
      - PARANAIBA
      - PARANAPANEMA
      - PARNAIBA
      - SANTA MARIA VIT
      - SAO FRANCISCO
      - TIETE
      - TOCANTINS
      - URUGUAI
  - name: nom_ree
    physicalType: VARCHAR
    logicalType: string
    description: Nome do Reservatório Equivalente de Energia (REE) ao qual o reservatório está associado;
      nulos em boa parte das linhas indicam reservatórios sem REE associado
    customProperties:
    - property: aliases
      value:
      - REE
      - reservatório equivalente
      - equivalente de energia
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - BELO MONTE
      - IGUACU
      - ITAIPU
      - MADEIRA
      - MANAUS-AMAPA
      - NORDESTE
      - NORTE
      - PARANA
      - PARANAPANEMA
      - SUDESTE
      - SUL
      - TELES PIRES
  - name: id_reservatorio
    physicalType: VARCHAR
    logicalType: string
    description: Identificador único do reservatório no sistema ONS
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - código reservatório
      - id res
      - identificador reservatório
    - property: semanticType
      value: IDENTIFIER
  - name: nom_reservatorio
    physicalType: VARCHAR
    logicalType: string
    description: Nome do reservatório
    customProperties:
    - property: aliases
      value:
      - nome do reservatório
      - reservatório
      - usina reservatório
    - property: semanticType
      value: DIMENSION
  - name: num_ordemcs
    physicalType: DOUBLE
    logicalType: integer
    description: Número de ordem do reservatório na cascata hidrológica; poucos nulos
    customProperties:
    - property: aliases
      value:
      - ordem cascata
      - ordem na cascata
      - posição cascata
    - property: semanticType
      value: IDENTIFIER
  - name: cod_usina
    physicalType: DOUBLE
    logicalType: integer
    description: Código numérico da usina associada ao reservatório no cadastro ONS; poucos nulos; min=0
      pode indicar reservatório sem usina associada
    customProperties:
    - property: aliases
      value:
      - código usina
      - código da usina
      - id usina
    - property: semanticType
      value: IDENTIFIER
  - name: din_instante
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Data e hora de referência do registro diário; representa o dia de medição dos dados hidráulicos
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - data
      - data de referência
      - data medição
      - instante
      - dia
    - property: semanticType
      value: TIMESTAMP
  - name: val_nivelmontante
    physicalType: VARCHAR
    logicalType: number
    description: Nível d'água de montante do reservatório (cota); nulos em parte das linhas
    customProperties:
    - property: aliases
      value:
      - nível montante
      - cota montante
      - nível do reservatório
      - cota do reservatório
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_nivelmontante AS DOUBLE)
    - property: unit
      value: m
  - name: val_niveljusante
    physicalType: VARCHAR
    logicalType: number
    description: Nível d'água de jusante do reservatório (cota a jusante da barragem); nulos em boa parte das linhas
    customProperties:
    - property: aliases
      value:
      - nível jusante
      - cota jusante
      - nível a jusante
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_niveljusante AS DOUBLE)
    - property: unit
      value: m
  - name: val_volumeutilcon
    physicalType: VARCHAR
    logicalType: number
    description: Volume útil do reservatório em percentual do volume útil total; nulos em boa parte das linhas
    customProperties:
    - property: aliases
      value:
      - volume útil
      - volume armazenado
      - armazenamento
      - volume útil controlável
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_volumeutilcon AS DOUBLE)
    - property: unit
      value: '%'
  - name: val_vazaoafluente
    physicalType: VARCHAR
    logicalType: number
    description: Vazão afluente total ao reservatório; ausente em parte das linhas, quase sempre como string VAZIA e nao como NULL — um filtro IS NOT NULL nao a exclui
    customProperties:
    - property: aliases
      value:
      - vazão afluente
      - afluência
      - vazão de entrada
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaoafluente AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaoturbinada
    physicalType: VARCHAR
    logicalType: number
    description: Vazão turbinada pela usina hidrelétrica associada ao reservatório; nulos em boa parte das linhas
    customProperties:
    - property: aliases
      value:
      - vazão turbinada
      - turbinamento
      - vazão geração
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaoturbinada AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaovertida
    physicalType: VARCHAR
    logicalType: number
    description: Vazão vertida pelo vertedouro do reservatório; nulos em parte das linhas
    customProperties:
    - property: aliases
      value:
      - vazão vertida
      - vertimento
      - spill
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaovertida AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaooutrasestruturas
    physicalType: VARCHAR
    logicalType: number
    description: Vazão descarregada por outras estruturas hidráulicas (comportas, descarregadores de fundo
      etc.); nulos na maior parte das linhas
    customProperties:
    - property: aliases
      value:
      - outras estruturas
      - vazão outras estruturas
      - descarregador de fundo
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaooutrasestruturas AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaodefluente
    physicalType: VARCHAR
    logicalType: number
    description: Vazão defluente total do reservatório (soma de turbinada, vertida e outras estruturas);
      nulos em parte das linhas
    customProperties:
    - property: aliases
      value:
      - vazão defluente
      - defluência
      - vazão de saída
      - descarga total
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaodefluente AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaotransferida
    physicalType: VARCHAR
    logicalType: number
    description: Vazão transferida entre bacias ou reservatórios por adução ou transposição; nulos na maior parte das linhas pois não se aplica a todos os reservatórios
    customProperties:
    - property: aliases
      value:
      - vazão transferida
      - transposição
      - adução
      - transferência hídrica
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaotransferida AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaonatural
    physicalType: VARCHAR
    logicalType: number
    description: Vazão natural afluente ao reservatório, desconsiderando regularizações artificiais; poucos nulos
    customProperties:
    - property: aliases
      value:
      - vazão natural
      - afluência natural
      - vazão naturalizada
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaonatural AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaoartificial
    physicalType: VARCHAR
    logicalType: number
    description: Componente artificial da vazão afluente resultante de regularizações e transferências;
      nulos na maior parte das linhas pois não se aplica a todos os reservatórios
    customProperties:
    - property: aliases
      value:
      - vazão artificial
      - regularização artificial
      - componente artificial
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaoartificial AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaoincremental
    physicalType: VARCHAR
    logicalType: number
    description: Vazão incremental líquida ao reservatório (contribuição da bacia incremental, descontadas
      transferências); nulos em parte das linhas
    customProperties:
    - property: aliases
      value:
      - vazão incremental
      - incremental
      - contribuição incremental
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaoincremental AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaoevaporacaoliquida
    physicalType: VARCHAR
    logicalType: number
    description: Vazão equivalente à evaporação líquida do espelho d'água do reservatório; nulos em boa parte das linhas
    customProperties:
    - property: aliases
      value:
      - evaporação
      - evaporação líquida
      - vazão evaporação
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaoevaporacaoliquida AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaousoconsuntivo
    physicalType: VARCHAR
    logicalType: number
    description: Vazão retirada do reservatório para uso consuntivo (irrigação, abastecimento, etc.);
      nulos em boa parte das linhas
    customProperties:
    - property: aliases
      value:
      - uso consuntivo
      - vazão consuntiva
      - retirada hídrica
      - consumo hídrico
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaousoconsuntivo AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaoincrementalbruta
    physicalType: DOUBLE
    logicalType: number
    description: Vazão incremental bruta ao reservatório antes de descontar transferências e uso consuntivo;
      nulos na maior parte das linhas — dado opcional ou de preenchimento tardio; admite valores negativos
    customProperties:
    - property: availableFrom
      value: '2023'
    - property: coverageNote
      value: Coluna ausente nos arquivos anteriores a 2023 (4 de 27 periodos da serie, que comeca em 2000). Como a fonte e' lida com union_by_name, consulta que inclua periodo anterior recebe NULL e nao erro, e AVG/SUM ignoram nulo - filtre o periodo ou declare a cobertura na resposta. Apurado em 2026-09-07.
    - property: aliases
      value:
      - incremental bruta
      - vazão incremental bruta
      - contribuição bruta
    - property: semanticType
      value: METRIC
    - property: unit
      value: m³/s
team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/dados-hidrologicos-res
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - nivel do reservatorio
  - quanto de agua tem na represa
  - vazao da usina
  - volume util do reservatorio
  - quanto entrou de agua
  - cota do reservatorio
  - afluencia da usina
  - situacao das represas
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver estado operacional de reservatórios hidrelétricos
    do SIN, incluindo níveis, volumes de armazenamento, vazões afluentes, turbinadas, vertidas ou defluentes
    em base diária. Também recuperar quando a análise requerer balanço hídrico por reservatório, bacia
    ou subsistema, monitoramento de armazenamento energético, ou correlação entre hidrologia e geração
    hidrelétrica.
- property: agentInstructions
  value: |
    - [val_vazaoincrementalbruta] A maior parte dos registros possuem valor nulo. Dado de preenchimento tardio no processo de consistência hidrológica ONS, não disponível para todos os reservatórios e períodos. Não deve ser usado como campo obrigatório em análises operacionais.

    - [val_vazaoincrementalbruta] Valores negativos presentes (min=-2174.06 m³/s), fisicamente inconsistentes para vazão incremental bruta. Podem indicar erros de consistência hidrológica ou ajustes de balanço hídrico ainda não finalizados no dataset dados-hidrologicos-res.

    - [val_vazaoartificial] Nulos na maior parte das linhas. Coluna aplicável apenas a reservatórios com contribuições artificiais identificadas no dataset dados-hidrologicos-res. Tratar nulos como zero em agregações de balanço hídrico pode introduzir viés sistemático.

    - [val_vazaotransferida] Nulos na maior parte das linhas. Aplicável apenas a reservatórios com transposição hídrica entre bacias no dataset dados-hidrologicos-res. Reservatórios sem transposição terão esta coluna sempre nula.

    - [val_vazaooutrasestruturas] Nulos na maior parte das linhas no dataset dados-hidrologicos-res. Indica que nem todos os reservatórios possuem estruturas hidráulicas adicionais (comportas de fundo, eclusas). Nulos devem ser tratados como zero no cálculo da defluência total apenas após confirmação cadastral.

    - [val_niveljusante] Nulos em boa parte das linhas no dataset dados-hidrologicos-res. Reservatórios do tipo fio d'água ou sem medição de nível a jusante podem não ter este dado disponível sistematicamente.

    - [cod_usina] cod_usina com valor mínimo 0 e poucos nulos no dataset dados-hidrologicos-res. Valor 0 pode indicar reservatório sem usina associada ou erro de cadastro. Verificar se cod_usina=0 é código válido ou sentinela de ausência antes de usar em JOINs.

    - [nom_ree] Nulos em boa parte das linhas em nom_ree no dataset dados-hidrologicos-res. Reservatórios sem REE associado podem ser de uso múltiplo não pertencentes ao despacho centralizado ONS.

    - [din_instante] Possíveis lacunas temporais por reservatório ao longo do período desde 2000 no dataset dados-hidrologicos-res. Reservatórios que entraram em operação após 2000 ou foram desativados terão séries incompletas. Verificar continuidade por reservatório antes de análises de séries temporais.

    - [val_vazaoturbinada] Nulos em boa parte das linhas em val_vazaoturbinada no dataset dados-hidrologicos-res. Pode indicar períodos de manutenção, restrições operativas ou reservatórios sem unidades geradoras ativas. Nulos não devem ser tratados como zero sem verificação operacional.

    - [id_subsistema] Valores com trailing spaces detectados em 'id_subsistema'. Use TRIM() em filtros WHERE para evitar perda de registros.
    - [nom_bacia] Valores com trailing spaces detectados em 'nom_bacia'. Use TRIM() em filtros WHERE para evitar perda de registros.
    - [nom_ree] Valores com trailing spaces detectados em 'nom_ree'. Use TRIM() em filtros WHERE para evitar perda de registros.
    - [val_vazaoincrementalbruta] Coluna 'val_vazaoincrementalbruta' ausente em arquivos históricos (ex: DADOS_HIDROLOGICOS_RES_2000.parquet). Presente apenas a partir de versões recentes (ex: DADOS_HIDROLOGICOS_RES_2026.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [tipos] As colunas `val_niveljusante`, `val_nivelmontante`, `val_vazaoafluente`, `val_vazaoartificial`, `val_vazaodefluente`, `val_vazaoevaporacaoliquida`, `val_vazaoincremental`, `val_vazaonatural`, `val_vazaooutrasestruturas`, `val_vazaotransferida`, `val_vazaoturbinada`, `val_vazaousoconsuntivo`, `val_vazaovertida`, `val_volumeutilcon` mudam de tipo entre arquivos anuais (texto em uns, número em outros); cada uma traz `castExpression` no schema: use-o em toda agregação e comparação.
- property: typicalQuestions
  value:
  - Qual foi o volume útil médio dos reservatórios do subsistema Sudeste/Centro-Oeste no último mês?
  - Quais reservatórios apresentaram vertimento acima de 1000 m³/s nos últimos 30 dias?
  - Como evoluiu a vazão afluente de Itaipu ao longo de 2024?
  - Quais reservatórios da bacia do Paraná estão com volume útil abaixo de 30%?
  - Qual a relação entre vazão turbinada e vazão afluente para os reservatórios do subsistema Sul em anos
    de La Niña?
  # geradas e validadas pelo benchmark em 2026-09-06
  - "Qual reservatório tá com maior nível montante agora?"
  - "Me mostra ranking de vazão afluente dos reservatórios do NE em setembro"
  - "Qual a diferença entre nível montante e jusante de Sobradinho?"
  - "Quais reservatórios da bacia do Paraná tiveram maior vazão afluente em agosto?"
  - "Qual foi o volume útil mínimo atingido em setembro?"
  - "Compara o volume útil: Sul vs Nordeste"
  - "Qual a vazão afluente média dos reservatórios do Norte?"
  - "Quais reservatórios aumentaram nível essa semana?"
- property: granularity
  value: diária
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/dados_hidrologicos_di/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2000-01-01'
- property: semantics
  value:
    family: dados_hidrologicos
    family_default: true
    temporal_perspective: verificado
    row_grain:
      temporal: 1 dia
      temporal_column: din_instante
      spatial: usina
      entity: reservatorio
      one_row_per:
      - din_instante
      - id_subsistema
      - id_reservatorio
    dimension_columns:
      subsistema: id_subsistema
      fonte: null
      usina: null
      reservatorio: nom_reservatorio
      bacia: nom_bacia
      subestacao: null
      patamar: null
    metrics:
    - id: nivelmontante
      label: Nivelmontante
      columns:
      - val_nivelmontante
      expression: TRY_CAST(val_nivelmontante AS DOUBLE)
      quantity_kind: level
      unit_native: m
      default_aggregation: max
      forbidden_aggregations:
      - sum
      aggregation_modes:
        maximum:
          sql: MAX(TRY_CAST(val_nivelmontante AS DOUBLE))
          unit: m
        minimum:
          sql: MIN(TRY_CAST(val_nivelmontante AS DOUBLE))
          unit: m
        average:
          sql: AVG(TRY_CAST(val_nivelmontante AS DOUBLE))
          unit: m
        time_series:
          sql: AVG(TRY_CAST(val_nivelmontante AS DOUBLE))
          unit: m
        ranking:
          sql: AVG(TRY_CAST(val_nivelmontante AS DOUBLE))
          unit: m
        comparison:
          sql: AVG(TRY_CAST(val_nivelmontante AS DOUBLE))
          unit: m
      interval_hours: 24.0
      aliases:
      - nível montante
      - cota montante
      - nível do reservatório
      - cota do reservatório
    - id: niveljusante
      label: Niveljusante
      columns:
      - val_niveljusante
      expression: TRY_CAST(val_niveljusante AS DOUBLE)
      quantity_kind: level
      unit_native: m
      default_aggregation: max
      forbidden_aggregations:
      - sum
      aggregation_modes:
        maximum:
          sql: MAX(TRY_CAST(val_niveljusante AS DOUBLE))
          unit: m
        minimum:
          sql: MIN(TRY_CAST(val_niveljusante AS DOUBLE))
          unit: m
        average:
          sql: AVG(TRY_CAST(val_niveljusante AS DOUBLE))
