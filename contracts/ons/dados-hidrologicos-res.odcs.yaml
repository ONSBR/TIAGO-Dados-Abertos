    sql_patterns:
      nivelmontante_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, id_subsistema,\n\
          \  MAX(TRY_CAST(val_nivelmontante AS DOUBLE)) AS valor\nFROM {source}\nWHERE EXTRACT(YEAR FROM\
          \ TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1, 2\nORDER BY 1, 2"
        output_unit: m
        matches:
          output_modes:
          - maximum
          metrics:
          - nivelmontante
          grain: month
        validated_params:
          year: '2001'
- property: fewShotQueries
  value:
  - question: Como evoluiu o volume útil médio dos reservatórios por subsistema elétrico ao longo de 2024?
    sql: SELECT id_subsistema, nom_subsistema, CAST(din_instante AS DATE) AS data, ROUND(AVG(TRY_CAST(val_volumeutilcon AS DOUBLE)),
      2) AS volume_util_medio_pct FROM read_parquet('s3://ons-aws-prod-opendata/dataset/dados_hidrologicos_di/*.parquet')
      WHERE din_instante >= '2024-01-01' AND din_instante < '2025-01-01' AND val_volumeutilcon IS NOT
      NULL GROUP BY id_subsistema, nom_subsistema, CAST(din_instante AS DATE) ORDER BY id_subsistema,
      data
  - question: Quais reservatórios apresentaram vertimento nos últimos 90 dias e qual foi o volume vertido
      médio?
    sql: SELECT id_reservatorio, nom_reservatorio, nom_bacia, id_subsistema, COUNT(*) AS dias_com_vertimento,
      ROUND(AVG(val_vazaovertida), 2) AS vazao_vertida_media_m3s, ROUND(MAX(val_vazaovertida), 2) AS vazao_vertida_max_m3s
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/dados_hidrologicos_di/*.parquet') WHERE din_instante
      >= CURRENT_DATE - INTERVAL '90' DAY AND val_vazaovertida > 0 AND val_vazaovertida IS NOT NULL GROUP
      BY id_reservatorio, nom_reservatorio, nom_bacia, id_subsistema ORDER BY vazao_vertida_media_m3s
      DESC LIMIT 30
  - question: Qual foi o balanço hídrico diário (afluente menos defluente) de Itaipu em 2023?
    sql: "SELECT\n    id_reservatorio,\n    nom_reservatorio,\n    CAST(din_instante AS DATE) AS data,\n\
      \    AVG(TRY_CAST(val_vazaoafluente AS DOUBLE)) AS vazao_afluente_m3s,\n    AVG(TRY_CAST(val_vazaodefluente\
      \ AS DOUBLE)) AS vazao_defluente_m3s,\n    ROUND(\n        AVG(TRY_CAST(val_vazaoafluente AS DOUBLE))\
      \ - AVG(TRY_CAST(val_vazaodefluente AS DOUBLE)),\n        2\n    ) AS balanco_hidrico_m3s,\n   \
      \ AVG(TRY_CAST(val_volumeutilcon AS DOUBLE)) AS volume_util_con\nFROM read_parquet('s3://ons-aws-prod-opendata/dataset/dados_hidrologicos_di/*.parquet',\
      \ union_by_name=true)\nWHERE\n    UPPER(nom_reservatorio) LIKE '%ITAIPU%'\n    AND din_instante\
      \ >= '2023-01-01'\n    AND din_instante < '2024-01-01'\nGROUP BY\n    id_reservatorio,\n    nom_reservatorio,\n\
      \    CAST(din_instante AS DATE)\nORDER BY data\nLIMIT 100"
