version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:dados-hidrologicos-res
name: dados-hidrologicos-res
tenant: ons
tags:
- ONS
- SIN
- balanço hídrico
- dados hidrológicos
- dados hidráulicos
- despacho hidrotérmico
- hidrologia
- nível montante
- reservatório hidrelétrico
- reservatórios
- reservatórios ONS
- vazão afluente
- volume útil
- volume útil reservatórios
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/dados_hidrologicos_di/*.parquet
  format: parquet
description:
  purpose: Prover aos operadores do ONS, planejadores energéticos, pesquisadores e agentes do mercado
    elétrico os dados hidráulicos diários consolidados dos reservatórios do SIN, permitindo monitoramento
    do estado de armazenamento, suporte ao despacho hidrotérmico otimizado, balanço hídrico por bacia
    e reservatório, estudos de planejamento da operação energética, análise de risco hidrológico e avaliação
    de disponibilidade hídrica para geração de energia elétrica.
  limitations: 69,9% dos registros possuem valor nulo — dado de preenchimento tardio ou não aplicável
    à maioria dos reservatórios; não deve ser usado como métrica obrigatória em análises. Valor mínimo
    de -2174,06 m³/s — fisicamente possível em contextos de transferência hídrica inversa ou evaporação
    líquida elevada, mas deve ser monitorado como possível erro de consistência. 26,9% de nulos — campo
    não se aplica a reservatórios sem regularização artificial; verificar se reservatórios com transferência
    hídrica possuem preenchimento adequado.
  usage: Recuperar este dataset quando a pergunta envolver estado operacional de reservatórios hidrelétricos
    do SIN, incluindo níveis, volumes de armazenamento, vazões afluentes, turbinadas, vertidas ou defluentes
    em base diária.
domain: hidrologia
schema:
- name: dados_hidrologicos_res
  physicalType: parquet
  logicalType: object
  physicalName: dados_hidrologicos_res
  properties:
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: Identificador do subsistema elétrico ao qual o reservatório pertence (SE, S, NE, N)
    customProperties:
    - property: aliases
      value:
      - subsistema
      - sistema
      - região elétrica
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
  - name: nom_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: Nome por extenso do subsistema elétrico (Sudeste/Centro-Oeste, Sul, Nordeste, Norte)
    customProperties:
    - property: aliases
      value:
      - nome subsistema
      - região
      - submercado
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Nordeste
      - Norte
      - Sudeste/Centro-Oeste
      - Sul
  - name: tip_reservatorio
    physicalType: VARCHAR
    logicalType: string
    description: Tipo do reservatório quanto à sua capacidade de regularização (equivalente, fio d'água,
      etc.)
    customProperties:
    - property: aliases
      value:
      - tipo reservatório
      - tipo de reservatório
      - classificação reservatório
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - CED
      - FIC
      - FIO
      - Fio dagua
      - RBB
      - RCU
      - RES
      - Reservatório Com Usina de Bombeamento
      - Reservatório com Usina
      - Reservatório sem usina
  - name: nom_bacia
    physicalType: VARCHAR
    logicalType: string
    description: Nome da bacia hidrográfica à qual o reservatório pertence
    customProperties:
    - property: aliases
      value:
      - bacia
      - bacia hidrográfica
      - bacia hidrológica
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - AMAZONAS
      - ARAGUARI
      - CAPIVARI
      - DOCE
      - GRANDE
      - IGUACU
      - ITABAPOANA
      - ITAJAI
      - JACUI
      - JEQUITINHONHA
      - MUCURI
      - PARAGUACU
      - PARAGUAI
      - PARAIBA DO SUL
      - PARANA
      - PARANAIBA
      - PARANAPANEMA
      - PARNAIBA
      - SANTA MARIA VIT
      - SAO FRANCISCO
      - TIETE
      - TOCANTINS
      - URUGUAI
  - name: nom_ree
    physicalType: VARCHAR
    logicalType: string
    description: Nome do Reservatório Equivalente de Energia (REE) ao qual o reservatório está associado;
      0,2% de nulos indicam reservatórios sem REE associado
    customProperties:
    - property: aliases
      value:
      - REE
      - reservatório equivalente
      - equivalente de energia
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - BELO MONTE
      - IGUACU
      - ITAIPU
      - MADEIRA
      - MANAUS-AMAPA
      - NORDESTE
      - NORTE
      - PARANA
      - PARANAPANEMA
      - SUDESTE
      - SUL
      - TELES PIRES
  - name: id_reservatorio
    physicalType: VARCHAR
    logicalType: string
    description: Identificador único do reservatório no sistema ONS
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - código reservatório
      - id res
      - identificador reservatório
    - property: semanticType
      value: IDENTIFIER
  - name: nom_reservatorio
    physicalType: VARCHAR
    logicalType: string
    description: Nome do reservatório
    customProperties:
    - property: aliases
      value:
      - nome do reservatório
      - reservatório
      - usina reservatório
    - property: semanticType
      value: DIMENSION
  - name: num_ordemcs
    physicalType: DOUBLE
    logicalType: integer
    description: Número de ordem do reservatório na cascata hidrológica; 0,7% de nulos
    customProperties:
    - property: aliases
      value:
      - ordem cascata
      - ordem na cascata
      - posição cascata
    - property: semanticType
      value: IDENTIFIER
  - name: cod_usina
    physicalType: DOUBLE
    logicalType: integer
    description: Código numérico da usina associada ao reservatório no cadastro ONS; 0,7% de nulos; min=0
      pode indicar reservatório sem usina associada
    customProperties:
    - property: aliases
      value:
      - código usina
      - código da usina
      - id usina
    - property: semanticType
      value: IDENTIFIER
  - name: din_instante
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Data e hora de referência do registro diário; representa o dia de medição dos dados hidráulicos
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - data
      - data de referência
      - data medição
      - instante
      - dia
    - property: semanticType
      value: TIMESTAMP
  - name: val_nivelmontante
    physicalType: VARCHAR
    logicalType: number
    description: Nível d'água de montante do reservatório (cota); 0,2% de nulos
    customProperties:
    - property: aliases
      value:
      - nível montante
      - cota montante
      - nível do reservatório
      - cota do reservatório
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_nivelmontante AS DOUBLE)
    - property: unit
      value: m
  - name: val_niveljusante
    physicalType: VARCHAR
    logicalType: number
    description: Nível d'água de jusante do reservatório (cota a jusante da barragem); 3,5% de nulos
    customProperties:
    - property: aliases
      value:
      - nível jusante
      - cota jusante
      - nível a jusante
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_niveljusante AS DOUBLE)
    - property: unit
      value: m
  - name: val_volumeutilcon
    physicalType: VARCHAR
    logicalType: number
    description: Volume útil do reservatório em percentual do volume útil total; 0,9% de nulos
    customProperties:
    - property: aliases
      value:
      - volume útil
      - volume armazenado
      - armazenamento
      - volume útil controlável
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_volumeutilcon AS DOUBLE)
    - property: unit
      value: '%'
  - name: val_vazaoafluente
    physicalType: VARCHAR
    logicalType: number
    description: Vazão afluente total ao reservatório; sem nulos registrados
    customProperties:
    - property: aliases
      value:
      - vazão afluente
      - afluência
      - vazão de entrada
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaoafluente AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaoturbinada
    physicalType: VARCHAR
    logicalType: number
    description: Vazão turbinada pela usina hidrelétrica associada ao reservatório; 2,4% de nulos
    customProperties:
    - property: aliases
      value:
      - vazão turbinada
      - turbinamento
      - vazão geração
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaoturbinada AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaovertida
    physicalType: VARCHAR
    logicalType: number
    description: Vazão vertida pelo vertedouro do reservatório; 0,5% de nulos
    customProperties:
    - property: aliases
      value:
      - vazão vertida
      - vertimento
      - spill
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaovertida AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaooutrasestruturas
    physicalType: VARCHAR
    logicalType: number
    description: Vazão descarregada por outras estruturas hidráulicas (comportas, descarregadores de fundo
      etc.); 13,7% de nulos
    customProperties:
    - property: aliases
      value:
      - outras estruturas
      - vazão outras estruturas
      - descarregador de fundo
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaooutrasestruturas AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaodefluente
    physicalType: VARCHAR
    logicalType: number
    description: Vazão defluente total do reservatório (soma de turbinada, vertida e outras estruturas);
      0,2% de nulos
    customProperties:
    - property: aliases
      value:
      - vazão defluente
      - defluência
      - vazão de saída
      - descarga total
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaodefluente AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaotransferida
    physicalType: VARCHAR
    logicalType: number
    description: Vazão transferida entre bacias ou reservatórios por adução ou transposição; 22,6% de
      nulos pois não se aplica a todos os reservatórios
    customProperties:
    - property: aliases
      value:
      - vazão transferida
      - transposição
      - adução
      - transferência hídrica
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaotransferida AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaonatural
    physicalType: VARCHAR
    logicalType: number
    description: Vazão natural afluente ao reservatório, desconsiderando regularizações artificiais; 0,4%
      de nulos
    customProperties:
    - property: aliases
      value:
      - vazão natural
      - afluência natural
      - vazão naturalizada
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaonatural AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaoartificial
    physicalType: VARCHAR
    logicalType: number
    description: Componente artificial da vazão afluente resultante de regularizações e transferências;
      26,9% de nulos pois não se aplica a todos os reservatórios
    customProperties:
    - property: aliases
      value:
      - vazão artificial
      - regularização artificial
      - componente artificial
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaoartificial AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaoincremental
    physicalType: VARCHAR
    logicalType: number
    description: Vazão incremental líquida ao reservatório (contribuição da bacia incremental, descontadas
      transferências); 0,5% de nulos
    customProperties:
    - property: aliases
      value:
      - vazão incremental
      - incremental
      - contribuição incremental
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaoincremental AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaoevaporacaoliquida
    physicalType: VARCHAR
    logicalType: number
    description: Vazão equivalente à evaporação líquida do espelho d'água do reservatório; 3,2% de nulos
    customProperties:
    - property: aliases
      value:
      - evaporação
      - evaporação líquida
      - vazão evaporação
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaoevaporacaoliquida AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaousoconsuntivo
    physicalType: VARCHAR
    logicalType: number
    description: Vazão retirada do reservatório para uso consuntivo (irrigação, abastecimento, etc.);
      3,1% de nulos
    customProperties:
    - property: aliases
      value:
      - uso consuntivo
      - vazão consuntiva
      - retirada hídrica
      - consumo hídrico
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_vazaousoconsuntivo AS DOUBLE)
    - property: unit
      value: m³/s
  - name: val_vazaoincrementalbruta
    physicalType: DOUBLE
    logicalType: number
    description: Vazão incremental bruta ao reservatório antes de descontar transferências e uso consuntivo;
      69,9% de nulos — dado opcional ou de preenchimento tardio; admite valores negativos
    customProperties:
    - property: aliases
      value:
      - incremental bruta
      - vazão incremental bruta
      - contribuição bruta
    - property: semanticType
      value: METRIC
    - property: unit
      value: m³/s
  quality:
  - type: custom
    engine: soda
    implementation: "checks for dados_hidrologicos_res:\n  - row_count > 0:\n      name: Tabela não pode\
      \ estar vazia\n\n  # Referential integrity\n  - invalid_count(id_subsistema) = 0:\n      valid values:\n\
      \        - 'N'\n        - 'NE'\n        - 'S'\n        - 'SE'\n      name: id_subsistema deve ser\
      \ um dos valores válidos\n  - invalid_count(nom_subsistema) = 0:\n      valid values:\n        -\
      \ 'Nordeste'\n        - 'Norte'\n        - 'Sudeste/Centro-Oeste'\n        - 'Sul'\n      name:\
      \ nom_subsistema deve ser um dos valores válidos\n  - invalid_count(tip_reservatorio) = 0:\n   \
      \   valid values:\n        - 'CED'\n        - 'FIC'\n        - 'FIO'\n        - 'Fio dagua'\n  \
      \      - 'RBB'\n        - 'RCU'\n        - 'RES'\n        - 'Reservatório Com Usina de Bombeamento'\n\
      \        - 'Reservatório com Usina'\n        - 'Reservatório sem usina'\n      name: tip_reservatorio\
      \ deve ser um dos valores válidos\n  - invalid_count(nom_bacia) = 0:\n      valid values:\n    \
      \    - 'AMAZONAS'\n        - 'ARAGUARI'\n        - 'CAPIVARI'\n        - 'DOCE'\n        - 'GRANDE'\n\
      \        - 'IGUACU'\n        - 'ITABAPOANA'\n        - 'ITAJAI'\n        - 'JACUI'\n        - 'JEQUITINHONHA'\n\
      \        - 'MUCURI'\n        - 'PARAGUACU'\n        - 'PARAGUAI'\n        - 'PARAIBA DO SUL'\n \
      \       - 'PARANA'\n        - 'PARANAIBA'\n        - 'PARANAPANEMA'\n        - 'PARNAIBA'\n    \
      \    - 'SANTA MARIA VIT'\n        - 'SAO FRANCISCO'\n        - 'TIETE'\n        - 'TOCANTINS'\n\
      \        - 'URUGUAI'\n      name: nom_bacia deve ser um dos valores válidos\n  - invalid_count(nom_ree)\
      \ = 0:\n      valid values:\n        - 'BELO MONTE'\n        - 'IGUACU'\n        - 'ITAIPU'\n  \
      \      - 'MADEIRA'\n        - 'MANAUS-AMAPA'\n        - 'NORDESTE'\n        - 'NORTE'\n        -\
      \ 'PARANA'\n        - 'PARANAPANEMA'\n        - 'SUDESTE'\n        - 'SUL'\n        - 'TELES PIRES'\n\
      \      name: nom_ree deve ser um dos valores válidos\n\n  # Circuit breaker: colunas numéricas VARCHAR\
      \ (formato de origem)\n  - missing_percent(val_nivelmontante) < 5:\n      name: val_nivelmontante\
      \ não pode ter >5% nulos\n  - missing_percent(val_niveljusante) < 5:\n      name: val_niveljusante\
      \ não pode ter >5% nulos\n  - missing_percent(val_volumeutilcon) < 5:\n      name: val_volumeutilcon\
      \ não pode ter >5% nulos\n  - missing_percent(val_vazaoafluente) < 5:\n      name: val_vazaoafluente\
      \ não pode ter >5% nulos\n  - missing_percent(val_vazaoturbinada) < 5:\n      name: val_vazaoturbinada\
      \ não pode ter >5% nulos\n  - missing_percent(val_vazaovertida) < 5:\n      name: val_vazaovertida\
      \ não pode ter >5% nulos\n  - missing_percent(val_vazaooutrasestruturas) < 5:\n      name: val_vazaooutrasestruturas\
      \ não pode ter >5% nulos\n  - missing_percent(val_vazaodefluente) < 5:\n      name: val_vazaodefluente\
      \ não pode ter >5% nulos\n  - missing_percent(val_vazaotransferida) < 5:\n      name: val_vazaotransferida\
      \ não pode ter >5% nulos\n  - missing_percent(val_vazaonatural) < 5:\n      name: val_vazaonatural\
      \ não pode ter >5% nulos\n  - missing_percent(val_vazaoartificial) < 5:\n      name: val_vazaoartificial\
      \ não pode ter >5% nulos\n  - missing_percent(val_vazaoincremental) < 5:\n      name: val_vazaoincremental\
      \ não pode ter >5% nulos\n  - missing_percent(val_vazaoevaporacaoliquida) < 5:\n      name: val_vazaoevaporacaoliquida\
      \ não pode ter >5% nulos\n  - missing_percent(val_vazaousoconsuntivo) < 5:\n      name: val_vazaousoconsuntivo\
      \ não pode ter >5% nulos\n\n  # Unicidade da chave primária composta ['id_reservatorio', 'din_instante']\
      \ (candidata LLM)\n  - failed rows:\n      name: Chave composta (id_reservatorio, din_instante)\
      \ não deve ter duplicatas\n      fail query: |\n        SELECT * FROM dados_hidrologicos_res\n \
      \       WHERE (id_reservatorio, din_instante) IN (\n          SELECT id_reservatorio, din_instante\
      \ FROM dados_hidrologicos_res\n          GROUP BY id_reservatorio, din_instante\n          HAVING\
      \ COUNT(*) > 1\n        )\n\n  # Nulos em val_vazaoincrementalbruta — alerta de qualidade (real=0%,\
      \ threshold=5.0%)\n  - missing_percent(val_vazaoincrementalbruta) < 5.0:\n      name: val_vazaoincrementalbruta\
      \ não deve ter >5.0% nulos\n\n  # Nulos em val_vazaoartificial — alerta de qualidade (real=0%, threshold=5.0%)\n\
      \  - missing_percent(val_vazaoartificial) < 5.0:\n      name: val_vazaoartificial não deve ter >5.0%\
      \ nulos\n\n  # Nulos em val_vazaotransferida — alerta de qualidade (real=0%, threshold=5.0%)\n \
      \ - missing_percent(val_vazaotransferida) < 5.0:\n      name: val_vazaotransferida não deve ter\
      \ >5.0% nulos\n\n  # Nulos em val_vazaooutrasestruturas — alerta de qualidade (real=0%, threshold=5.0%)\n\
      \  - missing_percent(val_vazaooutrasestruturas) < 5.0:\n      name: val_vazaooutrasestruturas não\
      \ deve ter >5.0% nulos\n\n  # Nulos em val_niveljusante — alerta de qualidade (real=0%, threshold=5.0%)\n\
      \  - missing_percent(val_niveljusante) < 5.0:\n      name: val_niveljusante não deve ter >5.0% nulos\n\
      \n  # Nulos em nom_ree — alerta de qualidade (real=0%, threshold=5.0%)\n  - missing_percent(nom_ree)\
      \ < 5.0:\n      name: nom_ree não deve ter >5.0% nulos\n\n  # Nulos em val_vazaoturbinada — alerta\
      \ de qualidade (real=0%, threshold=5.0%)\n  - missing_percent(val_vazaoturbinada) < 5.0:\n     \
      \ name: val_vazaoturbinada não deve ter >5.0% nulos\n\n  # Freshness: din_instante deve ter dados\
      \ recentes (SLA: Atualizado diariamente)\n  - freshness(din_instante) < 3d:\n      name: din_instante\
      \ não pode ter dados com mais de 3 dias de atraso\n"
team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/dados-hidrologicos-res
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - nivel do reservatorio
  - quanto de agua tem na represa
  - vazao da usina
  - volume util do reservatorio
  - quanto entrou de agua
  - cota do reservatorio
  - afluencia da usina
  - situacao das represas
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver estado operacional de reservatórios hidrelétricos
    do SIN, incluindo níveis, volumes de armazenamento, vazões afluentes, turbinadas, vertidas ou defluentes
    em base diária. Também recuperar quando a análise requerer balanço hídrico por reservatório, bacia
    ou subsistema, monitoramento de armazenamento energético, ou correlação entre hidrologia e geração
    hidrelétrica.
- property: agentInstructions
  value: |
    - [val_vazaoincrementalbruta] 67,9% dos registros possuem valor nulo. Dado de preenchimento tardio no processo de consistência hidrológica ONS, não disponível para todos os reservatórios e períodos. Não deve ser usado como campo obrigatório em análises operacionais.

    - [val_vazaoincrementalbruta] Valores negativos presentes (min=-2174.06 m³/s), fisicamente inconsistentes para vazão incremental bruta. Podem indicar erros de consistência hidrológica ou ajustes de balanço hídrico ainda não finalizados no dataset dados-hidrologicos-res.

    - [val_vazaoartificial] 28,7% de nulos. Coluna aplicável apenas a reservatórios com contribuições artificiais identificadas no dataset dados-hidrologicos-res. Tratar nulos como zero em agregações de balanço hídrico pode introduzir viés sistemático.

    - [val_vazaotransferida] 24,1% de nulos. Aplicável apenas a reservatórios com transposição hídrica entre bacias no dataset dados-hidrologicos-res. Reservatórios sem transposição terão esta coluna sempre nula.

    - [val_vazaooutrasestruturas] 14,6% de nulos no dataset dados-hidrologicos-res. Indica que nem todos os reservatórios possuem estruturas hidráulicas adicionais (comportas de fundo, eclusas). Nulos devem ser tratados como zero no cálculo da defluência total apenas após confirmação cadastral.

    - [val_niveljusante] 3,6% de nulos no dataset dados-hidrologicos-res. Reservatórios do tipo fio d'água ou sem medição de nível a jusante podem não ter este dado disponível sistematicamente.

    - [cod_usina] cod_usina com valor mínimo 0 e 0,8% de nulos no dataset dados-hidrologicos-res. Valor 0 pode indicar reservatório sem usina associada ou erro de cadastro. Verificar se cod_usina=0 é código válido ou sentinela de ausência antes de usar em JOINs.

    - [nom_ree] 0,2% de nulos em nom_ree no dataset dados-hidrologicos-res. Reservatórios sem REE associado podem ser de uso múltiplo não pertencentes ao despacho centralizado ONS.

    - [din_instante] Possíveis lacunas temporais por reservatório ao longo do período 2000-2026 no dataset dados-hidrologicos-res. Reservatórios que entraram em operação após 2000 ou foram desativados terão séries incompletas. Verificar continuidade por reservatório antes de análises de séries temporais.

    - [val_vazaoturbinada] 2,5% de nulos em val_vazaoturbinada no dataset dados-hidrologicos-res. Pode indicar períodos de manutenção, restrições operativas ou reservatórios sem unidades geradoras ativas. Nulos não devem ser tratados como zero sem verificação operacional.

    - [id_subsistema] Valores com trailing spaces detectados em 'id_subsistema'. Use TRIM() em filtros WHERE para evitar perda de registros.
    - [nom_bacia] Valores com trailing spaces detectados em 'nom_bacia'. Use TRIM() em filtros WHERE para evitar perda de registros.
    - [nom_ree] Valores com trailing spaces detectados em 'nom_ree'. Use TRIM() em filtros WHERE para evitar perda de registros.
    - [val_vazaoincrementalbruta] Coluna 'val_vazaoincrementalbruta' ausente em arquivos históricos (ex: DADOS_HIDROLOGICOS_RES_2000.parquet). Presente apenas a partir de versões recentes (ex: DADOS_HIDROLOGICOS_RES_2026.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [tipos] As colunas `val_niveljusante`, `val_nivelmontante`, `val_vazaoafluente`, `val_vazaoartificial`, `val_vazaodefluente`, `val_vazaoevaporacaoliquida`, `val_vazaoincremental`, `val_vazaonatural`, `val_vazaooutrasestruturas`, `val_vazaotransferida`, `val_vazaoturbinada`, `val_vazaousoconsuntivo`, `val_vazaovertida`, `val_volumeutilcon` mudam de tipo entre arquivos anuais (texto em uns, número em outros); cada uma traz `castExpression` no schema: use-o em toda agregação e comparação.
