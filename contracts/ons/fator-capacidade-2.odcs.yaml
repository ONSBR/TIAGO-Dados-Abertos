    sql_patterns:
      fatorcapacidade_medio_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  id_subsistema,\n\
          \  nom_tipousina,\n  AVG(TRY_CAST(val_fatorcapacidade AS DOUBLE)) AS fator_capacidade_medio\n\
          FROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP\
          \ BY 1, 2, 3\nORDER BY 1, 2, 3"
        output_unit: p.u.
        matches:
          output_modes:
          - average
          metrics:
          - fatorcapacidade
          grain: month
        validated_params:
          year: '2022'
      geracaoverificada_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  id_subsistema,\n\
          \  nom_tipousina,\n  SUM((TRY_CAST(val_geracaoverificada AS DOUBLE)) * 1.0) / 1000 AS energia_gwh\n\
          FROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP\
          \ BY 1, 2, 3\nORDER BY 1, 2, 3"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracaoverificada
          grain: month
        validated_params:
          year: '2022'
      desvio_programado_verificado:
        template: "SELECT nom_usina_conjunto,\n  ceg,\n  AVG(TRY_CAST(val_geracaoverificada AS DOUBLE)\
          \ - TRY_CAST(val_geracaoprogramada AS DOUBLE)) AS desvio_medio_mwmed,\n  AVG(ABS(TRY_CAST(val_geracaoverificada\
          \ AS DOUBLE) - TRY_CAST(val_geracaoprogramada AS DOUBLE))) AS desvio_absoluto_medio_mwmed\n\
          FROM {source}\nWHERE TRY_CAST(val_geracaoprogramada AS DOUBLE) IS NOT NULL\n  AND TRY_CAST(val_geracaoverificada\
          \ AS DOUBLE) IS NOT NULL\nGROUP BY 1, 2\nORDER BY desvio_absoluto_medio_mwmed DESC"
        output_unit: MWmed
        matches:
          output_modes:
          - comparison
          metrics:
          - geracaoverificada
          - geracaoprogramada
          grain: usina
      capacidade_instalada_por_subsistema:
        template: "SELECT id_subsistema,\n  nom_tipousina,\n  SUM(TRY_CAST(val_capacidadeinstalada AS\
          \ DOUBLE)) AS capacidade_total_mw\nFROM {source}\nWHERE din_instante = ( SELECT MAX(din_instante)\
          \ FROM {source} )\nGROUP BY 1, 2\nORDER BY 1, 2"
        output_unit: MW
        matches:
          output_modes:
          - total
          metrics:
          - capacidadeinstalada
          grain: subsistema
      geracaoprogramada_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, id_subsistema,\n\
          \  SUM((TRY_CAST(val_geracaoprogramada AS DOUBLE)) * 1.0) / 1000 AS valor\nFROM {source}\nWHERE\
          \ EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1, 2\nORDER BY 1,\
          \ 2"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracaoprogramada
          grain: month
        validated_params:
          year: '2022'
- property: fewShotQueries
  value:
  - question: Qual foi o fator de capacidade médio de usinas eólicas e solares por subsistema no período
      disponível?
    sql: SELECT nom_tipousina, id_subsistema, nom_subsistema, ROUND(AVG(TRY_CAST(val_fatorcapacidade AS
      DOUBLE)), 4) AS fc_medio, ROUND(MIN(TRY_CAST(val_fatorcapacidade AS DOUBLE)), 4) AS fc_min, ROUND(MAX(TRY_CAST(val_fatorcapacidade
      AS DOUBLE)), 4) AS fc_max, COUNT(DISTINCT id_ons) AS qtd_usinas FROM read_parquet('s3://ons-aws-prod-opendata/dataset/fator_capacidade_2_di/*.parquet')
      GROUP BY nom_tipousina, id_subsistema, nom_subsistema ORDER BY nom_tipousina, fc_medio DESC
  - question: Quais usinas apresentaram maior desvio absoluto entre geração programada e verificada, indicando
      possível curtailment ou erro de previsão?
    sql: SELECT id_ons, nom_usina_conjunto, nom_tipousina, id_subsistema, ROUND(AVG( ABS( TRY_CAST(val_geracaoverificada
      AS DOUBLE) - TRY_CAST(val_geracaoprogramada AS DOUBLE) ) ), 2) AS desvio_medio_mw, ROUND(AVG(TRY_CAST(val_geracaoprogramada
      AS DOUBLE)), 2) AS prog_media_mw, ROUND(AVG(TRY_CAST(val_geracaoverificada AS DOUBLE)), 2) AS verif_media_mw,
      COUNT(*) AS horas FROM read_parquet('s3://ons-aws-prod-opendata/dataset/fator_capacidade_2_di/*.parquet')
      GROUP BY id_ons, nom_usina_conjunto, nom_tipousina, id_subsistema ORDER BY desvio_medio_mw DESC
      LIMIT 20
  - question: Como o fator de capacidade de usinas solares varia ao longo das horas do dia?
    sql: SELECT EXTRACT(HOUR FROM TRY_CAST(din_instante AS TIMESTAMP)) AS hora_do_dia, ROUND(AVG(TRY_CAST(val_fatorcapacidade
      AS DOUBLE)), 4) AS fc_medio, ROUND(MAX(TRY_CAST(val_fatorcapacidade AS DOUBLE)), 4) AS fc_max, COUNT(*)
      AS observacoes FROM read_parquet('s3://ons-aws-prod-opendata/dataset/fator_capacidade_2_di/*.parquet')
      WHERE nom_tipousina = 'Solar Fotovoltaica' GROUP BY EXTRACT(HOUR FROM TRY_CAST(din_instante AS TIMESTAMP))
      ORDER BY hora_do_dia
