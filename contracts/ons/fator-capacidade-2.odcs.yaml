    customProperties:
    - property: aliases
      value:
      - subsistema
      - sistema
      - região elétrica
      - cod_subsistema
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
  - name: nom_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome por extenso do subsistema elétrico (ex: Sudeste, Sul, Nordeste, Norte)'
    customProperties:
    - property: aliases
      value:
      - nome subsistema
      - região
      - nome do sistema
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Nordeste
      - Norte
      - Sudeste/Centro-Oeste
      - Sul
  - name: id_estado
    physicalType: VARCHAR
    logicalType: string
    description: Sigla do estado brasileiro onde a usina está localizada
    customProperties:
