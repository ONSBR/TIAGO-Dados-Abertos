version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:fator-capacidade-2
name: fator-capacidade-2
tenant: ons
tags:
- FC eólico
- FC solar
- ONS
- SIN
- capacity factor
- fator capacidade eólica
- fator de aproveitamento
- fator de capacidade
- fator-de-capacidade
- geração-eólica
- geração-programada
- geração-verificada
- horário
