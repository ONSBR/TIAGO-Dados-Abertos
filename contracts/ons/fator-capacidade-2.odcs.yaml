      - RIO GRANDE DO SUL
      - SANTA CATARINA
      - SAO PAULO
  - name: cod_pontoconexao
    physicalType: VARCHAR
    logicalType: string
    description: Código do ponto de conexão da usina à rede de transmissão do SIN
    customProperties:
    - property: aliases
