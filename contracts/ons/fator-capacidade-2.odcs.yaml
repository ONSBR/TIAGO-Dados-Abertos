    - property: unit
      value: graus decimais
  - name: nom_modalidadeoperacao
    physicalType: VARCHAR
    logicalType: string
    description: 'Modalidade de operação da usina no âmbito do despacho pelo ONS (ex: despachada centralizadamente,
