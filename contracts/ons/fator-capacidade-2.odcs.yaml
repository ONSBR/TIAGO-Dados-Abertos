status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/fator_capacidade_2_di/*.parquet
  format: parquet
description:
  purpose: Permitir que analistas do ONS, agentes do setor elétrico, pesquisadores e reguladores avaliem
    o desempenho horário de usinas eólicas e solares fotovoltaicas no SIN, identificando padrões de variabilidade,
    desvios entre geração programada e verificada, e aproveitamento da capacidade instalada por usina,
    subsistema, estado e tipo de fonte. Suporta decisões de planejamento da operação, previsão de geração
    renovável, estudos de integração de fontes intermitentes, avaliação de acurácia de modelos de previsão
    e análises regulatórias de desempenho de empreendimentos cadastrados na ANEEL.
  limitations: Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização no dataset
    fator-capacidade-2. Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização no
    dataset fator-capacidade-2. Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização
    no dataset fator-capacidade-2.
  usage: Recuperar este dataset quando a pergunta envolver fator de capacidade, aproveitamento de capacidade
    instalada, desempenho horário ou variabilidade de usinas eólicas ou solares fotovoltaicas no SIN.
domain: geração
schema:
- name: fator_capacidade_2
  physicalType: parquet
  logicalType: object
  physicalName: fator_capacidade_2
  properties:
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Código identificador do subsistema elétrico ao qual a usina pertence (ex: SE, S, NE,
