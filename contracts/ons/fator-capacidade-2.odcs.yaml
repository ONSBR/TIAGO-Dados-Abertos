    logicalType: string
    description: Nome por extenso do estado brasileiro onde a usina está localizada
    customProperties:
    - property: aliases
      value:
      - nome estado
      - estado por extenso
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - BAHIA
      - CEARA
      - MARANHAO
      - MINAS GERAIS
      - PARAIBA
      - PERNAMBUCO
      - PIAUI
