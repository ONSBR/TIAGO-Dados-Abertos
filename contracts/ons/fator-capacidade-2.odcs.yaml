authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/fator-capacidade-2
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - aproveitamento das eolicas
  - quanto a usina gerou do que poderia
  - fator de capacidade solar
  - desempenho das renovaveis
  - rendimento do parque eolico
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver fator de capacidade, aproveitamento de capacidade
    instalada, desempenho horário ou variabilidade de usinas eólicas ou solares fotovoltaicas no SIN.
    Também relevante para perguntas sobre desvio entre geração programada e verificada de renováveis intermitentes,
    análise de perfil horário de geração renovável, ou avaliação de desempenho de empreendimentos cadastrados
    na ANEEL por CEG.
- property: agentInstructions
  value: '- [val_geracaoprogramada] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização.
    Contém valores numéricos representando MW de geração programada. Qualquer operação aritmética ou de
    agregação retornará erro ou resultado incorreto sem conversão explícita.


    - [val_geracaoverificada] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização.
    Contém valores numéricos representando MW de geração verificada. Operações aritméticas sem TRY_CAST
    resultarão em erro de tipo no DuckDB.


    - [val_capacidadeinstalada] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização.
    Contém valores numéricos representando MW de capacidade instalada. Sem TRY_CAST, cálculos de fator
    de capacidade derivados desta coluna produzirão resultados incorretos.


    - [val_fatorcapacidade] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização.
    Contém valores numéricos representando o fator de capacidade (razão entre geração verificada e capacidade
    instalada). Sem TRY_CAST, análises estatísticas do indicador principal do dataset serão inviáveis.


    - [val_latitudepontoconexao] Poucos registros possuem valor nulo na latitude do
    ponto de conexão. Embora a proporção seja baixa, pode impactar análises geoespaciais que dependam
    das coordenadas do ponto de conexão para mapeamento ou cálculo de distâncias.


    - [val_longitudepontoconexao] Poucos registros possuem valor nulo na longitude do
    ponto de conexão, coincidindo com os nulos de val_latitudepontoconexao. As usinas afetadas não possuem
    coordenadas completas do ponto de conexão cadastradas no ONS.


    - [din_instante] A serie e horaria e ativa, iniciada em 2009-07-01. Meca a cobertura corrente antes de
    assumir qualquer recorte. A cobertura histórica completa requer acesso a múltiplos
    datasets/arquivos do ONS; este glob isolado não representa série contínua de longo prazo.

    '
- property: typicalQuestions
  value:
  - Qual foi o fator de capacidade médio das usinas eólicas do Nordeste em janeiro de 2022?
  - Quais usinas solares apresentaram maior desvio entre geração programada e verificada?
  - Como varia o fator de capacidade horário das usinas eólicas ao longo do dia?
  - Qual a capacidade instalada total de usinas eólicas despachadas pelo ONS por subsistema?
  - Quais usinas tiveram fator de capacidade acima de 0,8 em algum instante horário?
  # geradas e validadas pelo benchmark em 2026-09-06
  - "Qual o desvio médio entre geração programada e verificada das eólicas?"
- property: granularity
  value: horária
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/fator_capacidade_2_di/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2009-07-01'
- property: semantics
  value:
    measure_terms:
    - fator de capacidade
    - capacity factor
    temporal_perspective: verificado
    row_grain:
      temporal: 1 hora
      temporal_column: din_instante
      spatial: usina
      entity: usina
      one_row_per:
      - din_instante
      - id_subsistema
      - ceg
      - id_ons
    dimension_columns:
      subsistema: id_subsistema
      fonte: nom_tipousina
      usina: ceg
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: geracaoprogramada
      label: Geracaoprogramada
      columns:
      - val_geracaoprogramada
      expression: TRY_CAST(val_geracaoprogramada AS DOUBLE)
      quantity_kind: average_power
      unit_native: MWmed
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total_energy:
          sql: SUM((TRY_CAST(val_geracaoprogramada AS DOUBLE)) * 1.0) / 1000
          unit: GWh
        average_power:
          sql: AVG(TRY_CAST(val_geracaoprogramada AS DOUBLE))
          unit: MWmed
        peak_power:
          sql: MAX(TRY_CAST(val_geracaoprogramada AS DOUBLE))
          unit: MWmed
        time_series:
          sql: AVG(TRY_CAST(val_geracaoprogramada AS DOUBLE))
          unit: MWmed
        ranking:
          sql: SUM((TRY_CAST(val_geracaoprogramada AS DOUBLE)) * 1.0) / 1000
          unit: GWh
        comparison:
          sql: AVG(TRY_CAST(val_geracaoprogramada AS DOUBLE))
          unit: MWmed
      interval_hours: 1.0
      aliases:
      - geração programada
      - programação geração
      - geração prevista
      - programa geração
    - id: geracaoverificada
      label: Geracaoverificada
      columns:
      - val_geracaoverificada
      expression: TRY_CAST(val_geracaoverificada AS DOUBLE)
      quantity_kind: average_power
      unit_native: MWmed
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total_energy:
          sql: SUM((TRY_CAST(val_geracaoverificada AS DOUBLE)) * 1.0) / 1000
          unit: GWh
        average_power:
          sql: AVG(TRY_CAST(val_geracaoverificada AS DOUBLE))
          unit: MWmed
        peak_power:
          sql: MAX(TRY_CAST(val_geracaoverificada AS DOUBLE))
          unit: MWmed
        time_series:
          sql: AVG(TRY_CAST(val_geracaoverificada AS DOUBLE))
          unit: MWmed
        ranking:
          sql: SUM((TRY_CAST(val_geracaoverificada AS DOUBLE)) * 1.0) / 1000
          unit: GWh
        comparison:
          sql: AVG(TRY_CAST(val_geracaoverificada AS DOUBLE))
          unit: MWmed
      interval_hours: 1.0
      aliases:
      - geração verificada
      - geração real
      - geração medida
      - geração observada
      - geração efetiva
    - id: capacidadeinstalada
      label: Capacidadeinstalada
      columns:
      - val_capacidadeinstalada
      expression: TRY_CAST(val_capacidadeinstalada AS DOUBLE)
      quantity_kind: capacity
      unit_native: MW
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total:
          sql: SUM(TRY_CAST(val_capacidadeinstalada AS DOUBLE))
          unit: MW
        maximum:
          sql: MAX(TRY_CAST(val_capacidadeinstalada AS DOUBLE))
          unit: MW
        time_series:
          sql: SUM(TRY_CAST(val_capacidadeinstalada AS DOUBLE))
          unit: MW
        ranking:
          sql: SUM(TRY_CAST(val_capacidadeinstalada AS DOUBLE))
          unit: MW
        comparison:
          sql: SUM(TRY_CAST(val_capacidadeinstalada AS DOUBLE))
          unit: MW
      interval_hours: 1.0
      aliases:
      - capacidade instalada
      - potência instalada
      - capacidade nominal
      - potência nominal
    - id: fatorcapacidade
      label: Fatorcapacidade
      columns:
      - val_fatorcapacidade
      expression: TRY_CAST(val_fatorcapacidade AS DOUBLE)
      quantity_kind: capacity
      unit_native: p.u.
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        average:
          sql: AVG(TRY_CAST(val_fatorcapacidade AS DOUBLE))
          unit: p.u.
        maximum:
          sql: MAX(TRY_CAST(val_fatorcapacidade AS DOUBLE))
          unit: p.u.
        minimum:
          sql: MIN(TRY_CAST(val_fatorcapacidade AS DOUBLE))
          unit: p.u.
        time_series:
          sql: AVG(TRY_CAST(val_fatorcapacidade AS DOUBLE))
          unit: p.u.
        ranking:
          sql: AVG(TRY_CAST(val_fatorcapacidade AS DOUBLE))
          unit: p.u.
        comparison:
          sql: AVG(TRY_CAST(val_fatorcapacidade AS DOUBLE))
          unit: p.u.
      interval_hours: 1.0
      aliases:
      - fator de capacidade
      - FC
      - capacity factor
      - fator capacidade
      - aproveitamento
    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: true
      supports_ranking: true
      primary_use_case: serie_temporal
    value_aliases:
      subsistema:
        SE:
          aliases:
          - sudeste
