      Tipo semântico intencional é DOUBLE.

      '
    customProperties:
    - property: aliases
      value:
      - fator de capacidade
      - FC
      - capacity factor
      - fator capacidade
      - aproveitamento
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_fatorcapacidade AS DOUBLE)
    - property: unit
      value: p.u.
  quality:
  - type: custom
    engine: soda
    implementation: "checks for fator_capacidade_2:\n  - row_count > 0:\n      name: Tabela não pode estar\
      \ vazia\n\n  # Referential integrity\n  - invalid_count(id_subsistema) = 0:\n      valid values:\n\
      \        - 'N'\n        - 'NE'\n        - 'S'\n        - 'SE'\n      name: id_subsistema deve ser\
      \ um dos valores válidos\n  - invalid_count(nom_subsistema) = 0:\n      valid values:\n        -\
      \ 'Nordeste'\n        - 'Norte'\n        - 'Sudeste/Centro-Oeste'\n        - 'Sul'\n      name:\
      \ nom_subsistema deve ser um dos valores válidos\n  - invalid_count(id_estado) = 0:\n      valid\
      \ values:\n        - 'BA'\n        - 'CE'\n        - 'MA'\n        - 'MG'\n        - 'PB'\n    \
      \    - 'PE'\n        - 'PI'\n        - 'RN'\n        - 'RS'\n        - 'SC'\n        - 'SP'\n  \
      \    name: id_estado deve ser um dos valores válidos\n  - invalid_count(nom_estado) = 0:\n     \
      \ valid values:\n        - 'BAHIA'\n        - 'CEARA'\n        - 'MARANHAO'\n        - 'MINAS GERAIS'\n\
      \        - 'PARAIBA'\n        - 'PERNAMBUCO'\n        - 'PIAUI'\n        - 'RIO GRANDE DO NORTE'\n\
      \        - 'RIO GRANDE DO SUL'\n        - 'SANTA CATARINA'\n        - 'SAO PAULO'\n      name: nom_estado\
      \ deve ser um dos valores válidos\n  - invalid_count(nom_localizacao) = 0:\n      valid values:\n\
      \        - 'Interior'\n        - 'Litoral'\n      name: nom_localizacao deve ser um dos valores\
      \ válidos\n  - invalid_count(nom_modalidadeoperacao) = 0:\n      valid values:\n        - 'Conjunto\
      \ de Usinas'\n        - 'Tipo I'\n        - 'Tipo II-B'\n      name: nom_modalidadeoperacao deve\
      \ ser um dos valores válidos\n  - invalid_count(nom_tipousina) = 0:\n      valid values:\n     \
      \   - 'Eólica'\n        - 'Solar'\n      name: nom_tipousina deve ser um dos valores válidos\n \
      \ - invalid_count(ceg) = 0:\n      valid values:\n        - '-'\n        - 'EOL.CV.CE.028631-1.01'\n\
      \        - 'EOL.CV.CE.028699-0.01'\n        - 'EOL.CV.CE.030841-2.01'\n        - 'EOL.CV.CE.033756-0.01'\n\
      \        - 'EOL.CV.RN.028443-2.01'\n        - 'EOL.CV.RN.028444-0.01'\n        - 'EOL.CV.RN.030339-9.01'\n\
      \        - 'EOL.CV.RN.030416-6.01'\n        - 'EOL.CV.RN.030417-4.01'\n        - 'EOL.CV.RS.028712-1.01'\n\
      \        - 'EOL.CV.RS.031302-5.01'\n        - 'UFV.RS.RN.034184-3.01'\n      name: ceg deve ser\
      \ um dos valores válidos\n\n  # Circuit breaker: colunas numéricas VARCHAR (formato de origem)\n\
      \  - missing_percent(val_geracaoprogramada) < 5:\n      name: val_geracaoprogramada não pode ter\
      \ >5% nulos\n  - missing_percent(val_geracaoverificada) < 5:\n      name: val_geracaoverificada\
      \ não pode ter >5% nulos\n  - missing_percent(val_capacidadeinstalada) < 5:\n      name: val_capacidadeinstalada\
      \ não pode ter >5% nulos\n  - missing_percent(val_fatorcapacidade) < 5:\n      name: val_fatorcapacidade\
      \ não pode ter >5% nulos\n\n  # Unicidade da chave primária composta ['id_ons', 'ceg', 'din_instante']\
      \ (candidata LLM)\n  - failed rows:\n      name: Chave composta (id_ons, ceg, din_instante) não\
      \ deve ter duplicatas\n      fail query: |\n        SELECT * FROM fator_capacidade_2\n        WHERE\
      \ (id_ons, ceg, din_instante) IN (\n          SELECT id_ons, ceg, din_instante FROM fator_capacidade_2\n\
      \          GROUP BY id_ons, ceg, din_instante\n          HAVING COUNT(*) > 1\n        )\n\n  # Nulos\
      \ em val_latitudepontoconexao — alerta de qualidade (real=0%, threshold=5.0%)\n  - missing_percent(val_latitudepontoconexao)\
      \ < 5.0:\n      name: val_latitudepontoconexao não deve ter >5.0% nulos\n\n  # Nulos em val_longitudepontoconexao\
      \ — alerta de qualidade (real=0%, threshold=5.0%)\n  - missing_percent(val_longitudepontoconexao)\
      \ < 5.0:\n      name: val_longitudepontoconexao não deve ter >5.0% nulos\n\n  # Range geográfico\
      \ de val_latitudesecoletora — Brasil: -33.75 a 5.27 graus\n  - failed rows:\n      name: val_latitudesecoletora\
      \ fora do intervalo válido para o Brasil\n      fail condition: val_latitudesecoletora IS NOT NULL\
      \ AND (val_latitudesecoletora < -33.75 OR val_latitudesecoletora > 5.27)\n\n  # Range geográfico\
      \ de val_longitudesecoletora — Brasil: -73.99 a -28.85 graus\n  - failed rows:\n      name: val_longitudesecoletora\
      \ fora do intervalo válido para o Brasil\n      fail condition: val_longitudesecoletora IS NOT NULL\
      \ AND (val_longitudesecoletora < -73.99 OR val_longitudesecoletora > -28.85)\n\n  # Range geográfico\
      \ de val_latitudepontoconexao — Brasil: -33.75 a 5.27 graus\n  - failed rows:\n      name: val_latitudepontoconexao\
      \ fora do intervalo válido para o Brasil\n      fail condition: val_latitudepontoconexao IS NOT\
      \ NULL AND (val_latitudepontoconexao < -33.75 OR val_latitudepontoconexao > 5.27)\n\n  # Range geográfico\
      \ de val_longitudepontoconexao — Brasil: -73.99 a -28.85 graus\n  - failed rows:\n      name: val_longitudepontoconexao\
      \ fora do intervalo válido para o Brasil\n      fail condition: val_longitudepontoconexao IS NOT\
      \ NULL AND (val_longitudepontoconexao < -73.99 OR val_longitudepontoconexao > -28.85)\n\n  # Freshness:\
      \ din_instante deve ter dados recentes (SLA: Atualizado diariamente)\n  - freshness(din_instante)\
      \ < 3d:\n      name: din_instante não pode ter dados com mais de 3 dias de atraso\n"
team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/fator-capacidade-2
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - aproveitamento das eolicas
  - quanto a usina gerou do que poderia
  - fator de capacidade solar
  - desempenho das renovaveis
  - rendimento do parque eolico
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver fator de capacidade, aproveitamento de capacidade
    instalada, desempenho horário ou variabilidade de usinas eólicas ou solares fotovoltaicas no SIN.
    Também relevante para perguntas sobre desvio entre geração programada e verificada de renováveis intermitentes,
    análise de perfil horário de geração renovável, ou avaliação de desempenho de empreendimentos cadastrados
    na ANEEL por CEG.
- property: agentInstructions
  value: '- [val_geracaoprogramada] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização.
    Contém valores numéricos representando MW de geração programada. Qualquer operação aritmética ou de
    agregação retornará erro ou resultado incorreto sem conversão explícita.


    - [val_geracaoverificada] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização.
    Contém valores numéricos representando MW de geração verificada. Operações aritméticas sem TRY_CAST
    resultarão em erro de tipo no DuckDB.


    - [val_capacidadeinstalada] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização.
    Contém valores numéricos representando MW de capacidade instalada. Sem TRY_CAST, cálculos de fator
    de capacidade derivados desta coluna produzirão resultados incorretos.


    - [val_fatorcapacidade] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização.
    Contém valores numéricos representando o fator de capacidade (razão entre geração verificada e capacidade
    instalada). Sem TRY_CAST, análises estatísticas do indicador principal do dataset serão inviáveis.


    - [val_latitudepontoconexao] Aproximadamente 0,3% dos registros possuem valor nulo na latitude do
    ponto de conexão. Embora a proporção seja baixa, pode impactar análises geoespaciais que dependam
    das coordenadas do ponto de conexão para mapeamento ou cálculo de distâncias.


    - [val_longitudepontoconexao] Aproximadamente 0,3% dos registros possuem valor nulo na longitude do
    ponto de conexão, coincidindo com os nulos de val_latitudepontoconexao. As usinas afetadas não possuem
    coordenadas completas do ponto de conexão cadastradas no ONS.


    - [din_instante] O período real dos arquivos S3 cobre apenas a transição 2021-12-31 a 2022-01-01,
    representando aproximadamente 2 dias de dados. A cobertura histórica completa requer acesso a múltiplos
    datasets/arquivos do ONS; este glob isolado não representa série contínua de longo prazo.

    '
- property: typicalQuestions
  value:
  - Qual foi o fator de capacidade médio das usinas eólicas do Nordeste em janeiro de 2022?
  - Quais usinas solares apresentaram maior desvio entre geração programada e verificada?
  - Como varia o fator de capacidade horário das usinas eólicas ao longo do dia?
  - Qual a capacidade instalada total de usinas eólicas despachadas pelo ONS por subsistema?
  - Quais usinas tiveram fator de capacidade acima de 0,8 em algum instante horário?
- property: granularity
  value: horária
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/fator_capacidade_2_di/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2009-07-01'
- property: semantics
  value:
    temporal_perspective: verificado
    row_grain:
      temporal: 1 hora
      temporal_column: din_instante
      spatial: usina
      entity: usina
      one_row_per:
      - din_instante
      - id_subsistema
      - ceg
      - id_ons
    dimension_columns:
      subsistema: id_subsistema
      fonte: nom_tipousina
      usina: ceg
      reservatorio: null
