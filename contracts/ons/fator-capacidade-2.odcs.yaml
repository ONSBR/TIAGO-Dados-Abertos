  - name: val_geracaoverificada
    physicalType: VARCHAR
    logicalType: string
    description: 'Geração verificada (real) da usina no instante de referência em MWmed. Armazenada como
      VARCHAR no Parquet pelo formato de serialização; requer TRY_CAST(val_geracaoverificada AS DOUBLE)
      para uso analítico. Tipo semântico intencional é DOUBLE.

      '
    customProperties:
    - property: aliases
      value:
      - geração verificada
      - geração real
      - geração medida
      - geração observada
      - geração efetiva
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_geracaoverificada AS DOUBLE)
    - property: unit
      value: MWmed
  - name: val_capacidadeinstalada
    physicalType: VARCHAR
    logicalType: string
    description: 'Capacidade instalada da usina ou conjunto de usinas no instante de referência em MW.
