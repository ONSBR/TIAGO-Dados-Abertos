    sql_patterns:
      listar_linhas_por_tensao:
        template: "SELECT nom_linhadetransmissao, nom_subestacao_de, nom_subestacao_para,\n  nom_subsistema_terminalde,\
          \ nom_subsistema_terminalpara,\n  val_niveltensao_kv, val_comprimento\nFROM {source}\nWHERE\
          \ val_niveltensao_kv = {tensao_kv}\nORDER BY nom_linhadetransmissao"
        output_unit: km
        matches:
          output_modes:
          - listing
          metrics:
          - comprimento
          grain: por_linha
      comprimento_total_por_estado:
        template: "SELECT nom_estado_de AS estado,\n  SUM(val_comprimento) AS comprimento_total_km\nFROM\
          \ {source}\nWHERE TRIM(nom_tipoderede) = 'BASICA'\n  AND val_niveltensao_kv = {tensao_kv}\n\
          GROUP BY nom_estado_de\nORDER BY comprimento_total_km DESC"
        output_unit: km
        matches:
          output_modes:
          - total
          - ranking
          metrics:
          - comprimento
          grain: por_estado
      capacidade_operativa_por_subsistema:
        template: "SELECT nom_subsistema_terminalde, nom_subsistema_terminalpara,\n  MAX(val_capacoperlongasemlimit)\
          \ AS cap_longa_sl_mva,\n  MAX(val_capacoperlongacomlimit) AS cap_longa_cl_mva\nFROM {source}\n\
          WHERE nom_subsistema_terminalde = '{subsistema_de}'\n  AND nom_subsistema_terminalpara = '{subsistema_para}'\n\
          GROUP BY nom_subsistema_terminalde, nom_subsistema_terminalpara"
        output_unit: MVA
        matches:
          output_modes:
          - comparison
          - maximum
          metrics:
          - capacoperlongasemlimit
          - capacoperlongacomlimit
          grain: por_interligacao
      linhas_sem_capacidade_sazonal:
        template: "SELECT cod_equipamento, nom_linhadetransmissao,\n  nom_subestacao_de, nom_subestacao_para\n\
          FROM {source}\nWHERE val_capacidadeoperveraodialonga IS NULL\n  AND val_capacoperinvernodialonga\
          \ IS NULL\nORDER BY nom_linhadetransmissao"
        output_unit: null
        matches:
          output_modes:
          - listing
          metrics: []
          grain: por_linha
      linhas_ativas:
        template: "SELECT cod_equipamento, nom_linhadetransmissao,\n  nom_subestacao_de, nom_subestacao_para,\n\
          \  val_niveltensao_kv,\n  TRY_CAST(dat_entradaoperacao AS DATE) AS dat_entrada\nFROM {source}\n\
          WHERE (dat_desativacao IS NULL\n   OR TRY_CAST(dat_desativacao AS DATE) >= CURRENT_DATE\n  \
          \ OR dat_desativacao = '9999-12-31')\nORDER BY nom_linhadetransmissao"
        output_unit: null
        matches:
          output_modes:
          - listing
          metrics: []
          grain: por_linha
- property: fewShotQueries
  value:
  - question: Quantas linhas de transmissão existem por subsistema de origem e nível de tensão, e qual
      a extensão total em km?
    sql: SELECT id_subsistema_terminalde, nom_subsistema_terminalde, val_niveltensao_kv, COUNT(*) AS qtd_linhas,
      ROUND(SUM(val_comprimento), 1) AS comprimento_total_km, ROUND(AVG(val_comprimento), 1) AS comprimento_medio_km
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/linha_transmissao/*.parquet') WHERE val_comprimento
      IS NOT NULL AND val_comprimento >= 0.01 GROUP BY id_subsistema_terminalde, nom_subsistema_terminalde,
      val_niveltensao_kv ORDER BY id_subsistema_terminalde, val_niveltensao_kv DESC
  - question: Qual a capacidade operativa total de longa duração sem limitação por agente proprietário,
      considerando apenas linhas com limite definido?
    sql: SELECT nom_agenteproprietario, COUNT(*) AS qtd_linhas_com_limite, ROUND(SUM(val_capacoperlongasemlimit),
      0) AS soma_cap_longa_sem_limit_mw, ROUND(AVG(val_capacoperlongasemlimit), 0) AS media_cap_longa_sem_limit_mw,
      ROUND(MIN(val_capacoperlongasemlimit), 0) AS min_cap_mw, ROUND(MAX(val_capacoperlongasemlimit),
      0) AS max_cap_mw FROM read_parquet('s3://ons-aws-prod-opendata/dataset/linha_transmissao/*.parquet')
      WHERE val_capacoperlongasemlimit IS NOT NULL GROUP BY nom_agenteproprietario ORDER BY soma_cap_longa_sem_limit_mw
      DESC LIMIT 20
  - question: Quais linhas de transmissão conectam subsistemas diferentes (interligações) e quais são
      seus parâmetros elétricos?
    sql: SELECT nom_linhadetransmissao, cod_equipamento, id_subsistema_terminalde, id_subsistema_terminalpara,
      val_niveltensao_kv, val_comprimento, val_resistencia, val_reatancia, val_shunt, val_capacoperlongasemlimit,
      nom_agenteproprietario FROM read_parquet('s3://ons-aws-prod-opendata/dataset/linha_transmissao/*.parquet')
      WHERE id_subsistema_terminalde IS NOT NULL AND id_subsistema_terminalpara IS NOT NULL AND id_subsistema_terminalde
      <> id_subsistema_terminalpara ORDER BY val_niveltensao_kv DESC, val_comprimento DESC
