version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:linha-transmissao
name: linha-transmissao
tenant: ons
tags:
- LT
- ONS
- SIN
- capacidade-operativa
- linha de transmissão
- linha-de-transmissao
- linhas de transmissão
- parametros-eletricos
- rede básica
- rede complementar
- rede-basica
- rede-complementar
- subestacao
- subsistema
- transmissao
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/linha_transmissao/*.parquet
  format: parquet
description:
  purpose: Prover o cadastro de referência das linhas de transmissão do SIN para analistas de planejamento,
    operação e regulação do sistema elétrico brasileiro, suportando estudos de fluxo de potência, análise
    de contingências N-1 e N-2, gestão de ativos de transmissão, cálculo de capacidade de intercâmbio
    entre subsistemas, monitoramento de restrições operativas e elaboração de relatórios regulatórios
    para ANEEL e ONS. Utilizado como tabela-dimensão em joins com datasets operativos de restrições, intercâmbio
    e disponibilidade de equipamentos.
  limitations: Valor máximo de 2545. Valor mínimo de 0. Aproximadamente 2.
  usage: Recuperar este dataset quando a pergunta envolver cadastro, parâmetros elétricos ou capacidades
    operativas de linhas de transmissão do SIN, identificação de equipamentos por subestação terminal,
    subsistema ou agente proprietário, ou quando for necessária uma tabela-dimensão de linhas para join
    com datasets operativos de restrições, intercâmbio ou disponibilidade de equipamentos de transmissão.
domain: transmissao
