team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/linha-transmissao
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - quantas linhas de transmissao existem
  - lista de linhas de transmissao
  - extensao das linhas
  - comprimento das linhas
  - quem e o dono da linha
  - linhas por nivel de tensao
  - linhas de 500 kv
  - mapa das linhas
  - cadastro de linhas
  - linhas por empresa transmissora
- property: aiContext
  value: 'Recuperar este dataset quando a pergunta envolver cadastro, parâmetros elétricos ou capacidades
    operativas de linhas de transmissão do SIN, identificação de equipamentos por subestação terminal,
    subsistema ou agente proprietário, ou quando for necessária uma tabela-dimensão de linhas para join
    com datasets operativos de restrições, intercâmbio ou disponibilidade de equipamentos de transmissão.
    Termos relacionados: ONS, capacidade-operativa, linha de transmissão, linha-de-transmissao, parametros-eletricos.'
- property: agentInstructions
  value: '- [val_comprimento] Valor mínimo de 0,0001 km indica registros com comprimento praticamente
    nulo, possivelmente representando transformadores ou conexões internas de subestação modelados como
    linhas de comprimento desprezível no modelo de rede.

    - [val_reatancia] Valor máximo de 2545 Ω é extremamente elevado para uma linha de transmissão convencional.
    Pode indicar uso de unidade em pu (por unidade) em vez de ohms absolutos, ou erro de cadastro em linhas
    muito longas.

    - [val_capacidadeoperveraodialonga] Nulos em boa parte das linhas indicam que quase metade das linhas não possui
    capacidade operativa sazonal de longa duração (verão/dia) definida. Linhas sem este campo podem estar
    usando apenas os limites genéricos val_capacoperlonga*.

    - [val_capacoperveradiacurta] Nulos em boa parte das linhas — taxa ligeiramente superior às capacidades de longa
    duração, indicando que os limites de emergência sazonais são ainda menos frequentemente cadastrados
    que os limites contínuos.

    - [num_barra_para] Poucos nulos em num_barra_para, ligeiramente superior ao padrão dos demais campos do terminal "para". Pode indicar linhas cujo terminal destino ainda não foi modelado no sistema
    de barras do ONS.

    - [nom_subestacao_para] Poucos nulos em nom_subestacao_para, consistente com id_subsistema_terminalpara,
    id_estado_terminalpara e nom_estado_para — indicando um conjunto de linhas cujo terminal destino não
    está completamente cadastrado.

    - [dat_entradaoperacao] Coluna de data armazenada como VARCHAR no Parquet em vez de DATE. Requer TRY_CAST
    para uso em filtros e ordenações temporais. Sem nulos, mas o tipo físico impede operações de data
    nativas.

    - [dat_desativacao] Coluna de data armazenada como VARCHAR no Parquet em vez de DATE. Requer TRY_CAST
    para uso em filtros temporais. As datas cadastradas de desativacao comecam em 1990-12-31 e alcancam o presente.

    - [dat_prevista] Coluna de data armazenada como VARCHAR no Parquet em vez de DATE. Requer TRY_CAST
    para uso em filtros e comparações temporais.

    - [val_resistencia] Valor mínimo de 0,0 Ω para resistência série pode indicar linhas modeladas como
    ideais (sem perdas resistivas) ou erros de cadastro. Verificar se são os mesmos registros com val_comprimento
    próximo de zero.

    - [cod_equipamento] cod_equipamento é a chave primária natural esperada. Verificar se existem duplicatas
    que possam indicar versões múltiplas do mesmo equipamento ou erros de carga.

    - [nom_tipoderede] Valores com trailing spaces detectados em ''nom_tipoderede''. Use TRIM() em filtros
    WHERE para evitar perda de registros.'
- property: typicalQuestions
  value:
  - Quais são as linhas de transmissão de 500 kV da CHESF no subsistema Nordeste?
  - Qual a capacidade operativa de longa duração das linhas de interligação entre os subsistemas SE e
    NE?
  - Quais linhas de transmissão ainda não possuem capacidade operativa sazonal definida?
  - Qual o comprimento total da rede básica de 500 kV por estado?
  - Quais linhas de transmissão conectam as subestações de ANGRA e ADRIANÓPOLIS?
  # geradas e validadas pelo benchmark em 2026-09-06
  - "Qual a resistência das LTs de 765 kV?"
  - "Distancia media de uma linha de transmissao no Brasil?"
