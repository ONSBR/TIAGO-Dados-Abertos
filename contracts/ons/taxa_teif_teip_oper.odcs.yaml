  - question: Qual é a média de TEIFa_Oper e TEIP_Oper por tipo de usina no período disponível?
    sql: "WITH versao_max AS (\n  SELECT nom_usina, din_mes, nom_taxa,\n         MAX(num_versao) AS max_versao\n\
      \  FROM read_parquet('s3://ons-aws-prod-opendata/dataset/taxa_teif_teip_oper/*.parquet')\n  GROUP\
      \ BY nom_usina, din_mes, nom_taxa\n)\nSELECT t.tip_usina,\n       t.nom_taxa,\n       ROUND(AVG(t.val_taxa)\
      \ * 100, 2) AS taxa_media_pct,\n       ROUND(MIN(t.val_taxa) * 100, 2) AS taxa_min_pct,\n      \
      \ ROUND(MAX(t.val_taxa) * 100, 2) AS taxa_max_pct,\n       COUNT(DISTINCT t.nom_usina) AS qtd_usinas,\n\
      \       COUNT(*) AS qtd_registros\nFROM read_parquet('s3://ons-aws-prod-opendata/dataset/taxa_teif_teip_oper/*.parquet')\
      \ t\nINNER JOIN versao_max v\n  ON t.nom_usina = v.nom_usina\n AND t.din_mes = v.din_mes\n AND t.nom_taxa\
      \ = v.nom_taxa\n AND t.num_versao = v.max_versao\nGROUP BY t.tip_usina, t.nom_taxa\nORDER BY t.tip_usina,\
      \ t.nom_taxa;"
