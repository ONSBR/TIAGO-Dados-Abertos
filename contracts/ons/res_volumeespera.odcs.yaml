status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/res_volumeespera/*.parquet
  format: parquet
description:
  purpose: Suportar operadores e planejadores do ONS na programação hidráulica diária, fornecendo o limite
    máximo de armazenamento recomendado por reservatório para garantir capacidade de amortecimento de
    cheias. Utilizado em decisões de despacho hidrelétrico, gestão de riscos hidrológicos e conformidade
    operativa, permitindo comparar o nível real armazenado com o limite recomendado e identificar reservatórios
    em situação de risco hidrológico.
  limitations: Aproximadamente 3% dos registros possuem num_ordemcs nulo, correspondendo a reservatórios
    sem posição definida em cascata hidrológica. O valor mínimo de val_volumeespera é 21. Dado que o CKAN
    informa publicação às 12h e 19h (duas vezes ao dia), mas o volume total de linhas (10.
  usage: Recuperar este dataset quando a pergunta envolver limites máximos de armazenamento em reservatórios,
    restrições operativas para amortecimento de cheias, conformidade do nível real com o volume de espera
    recomendado pelo ONS, ou análise de risco hidrológico por usina, bacia ou subsistema elétrico.
domain: hidrologia
