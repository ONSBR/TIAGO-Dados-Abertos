  quality:
  - type: custom
    engine: soda
    implementation: "checks for res_volumeespera:\n  - row_count > 0:\n      name: Tabela não pode estar\
      \ vazia\n\n  # Referential integrity\n  - invalid_count(id_subsistema) = 0:\n      valid values:\n\
      \        - 'NE'\n        - 'S'\n        - 'SE'\n      name: id_subsistema deve ser um dos valores\
      \ válidos\n  - invalid_count(nom_subsistema) = 0:\n      valid values:\n        - 'Nordeste'\n \
      \       - 'Sudeste/Centro-Oeste'\n        - 'Sul'\n      name: nom_subsistema deve ser um dos valores\
      \ válidos\n  - invalid_count(tip_reservatorio) = 0:\n      valid values:\n        - 'FIC'\n    \
      \    - 'RCU'\n      name: tip_reservatorio deve ser um dos valores válidos\n  - invalid_count(nom_bacia)\
      \ = 0:\n      valid values:\n        - 'GRANDE'\n        - 'IGUACU'\n        - 'JACUI'\n       \
      \ - 'JEQUITINHONHA'\n        - 'PARAIBA DO SUL'\n        - 'PARANA'\n        - 'PARANAIBA'\n   \
      \     - 'PARANAPANEMA'\n        - 'PARNAIBA'\n        - 'SAO FRANCISCO'\n        - 'TIETE'\n   \
      \   name: nom_bacia deve ser um dos valores válidos\n  - invalid_count(nom_ree) = 0:\n      valid\
      \ values:\n        - 'IGUACU'\n        - 'NORDESTE'\n        - 'PARANA'\n        - 'PARANAPANEMA'\n\
      \        - 'SUDESTE'\n        - 'SUL'\n      name: nom_ree deve ser um dos valores válidos\n  -\
      \ invalid_count(id_reservatorio) = 0:\n      valid values:\n        - 'GRAGVL'\n        - 'GRCAMA'\n\
      \        - 'GRFURN'\n        - 'GRMARI'\n        - 'GRMMOR'\n        - 'IGSSAN'\n        - 'JEIRAP'\n\
      \        - 'JIPREA'\n        - 'PBFUNI'\n        - 'PBSTAB'\n        - 'PDCACO'\n        - 'PIBESP'\n\
      \        - 'PNISOL'\n        - 'PNTIRM'\n        - 'PPCAPI'\n        - 'PPCHAV'\n        - 'PPJURU'\n\
      \        - 'PREMBO'\n        - 'PRITUM'\n        - 'PRNPON'\n        - 'PRSSIM'\n        - 'SFLGON'\n\
      \        - 'SFQMDO'\n        - 'SFSOBR'\n        - 'SFTMAR'\n        - 'TIBONI'\n        - 'TIPROM'\n\
      \        - 'TITIRM'\n      name: id_reservatorio deve ser um dos valores válidos\n  - invalid_count(nom_reservatorio)\
      \ = 0:\n      valid values:\n        - 'A. VERMELHA'\n        - 'B. BONITA'\n        - 'BOA ESPERANÇA'\n\
      \        - 'CACONDE'\n        - 'CAMARGOS'\n        - 'CAPIVARA'\n        - 'CHAVANTES'\n      \
      \  - 'EMBORCAÇÃO'\n        - 'FUNIL'\n        - 'FURNAS'\n        - 'I. SOLTEIRA'\n        - 'ILHA\
      \ + T. IRMÃOS'\n        - 'IRAPE'\n        - 'ITUMBIARA'\n        - 'JURUMIRIM'\n        - 'LUIZ\
      \ GONZAGA'\n        - 'M. MORAES'\n        - 'MARIMBONDO'\n        - 'NOVA PONTE'\n        - 'PASSO\
      \ REAL'\n        - 'PROMISSÃO'\n        - 'QUEIMADO'\n        - 'SALTO SANTIAGO'\n        - 'SANTA\
      \ BRANCA'\n        - 'SOBRADINHO'\n        - 'SÃO SIMÃO'\n        - 'TRÊS IRMÃOS'\n        - 'TRÊS\
      \ MARIAS'\n      name: nom_reservatorio deve ser um dos valores válidos\n\n  # Baseline de volume\
      \ — margem ±20% do row_count validado\n  - row_count between 8296 and 12444:\n      name: Volume\
      \ esperado entre 8,296 e 12,444 registros\n\n  # Unicidade da chave primária composta ['cod_usina',\
      \ 'din_instante'] (candidata LLM)\n  - failed rows:\n      name: Chave composta (cod_usina, din_instante)\
      \ não deve ter duplicatas\n      fail query: |\n        SELECT * FROM res_volumeespera\n       \
      \ WHERE (cod_usina, din_instante) IN (\n          SELECT cod_usina, din_instante FROM res_volumeespera\n\
      \          GROUP BY cod_usina, din_instante\n          HAVING COUNT(*) > 1\n        )\n\n  # Nulos\
      \ em num_ordemcs — alerta de qualidade (real=3.0%, threshold=8.0%)\n  - missing_percent(num_ordemcs)\
      \ < 8.0:\n      name: num_ordemcs não deve ter >8.0% nulos\n\n  # Freshness: din_instante deve ter\
      \ dados recentes (SLA: Atualizado diariamente)\n  - freshness(din_instante) < 3d:\n      name: din_instante\
      \ não pode ter dados com mais de 3 dias de atraso\n"
team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/res_volumeespera
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - volume de espera do reservatorio
  - limite para conter cheias
  - quanto o reservatorio pode encher
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver limites máximos de armazenamento em reservatórios,
    restrições operativas para amortecimento de cheias, conformidade do nível real com o volume de espera
    recomendado pelo ONS, ou análise de risco hidrológico por usina, bacia ou subsistema elétrico. Também
    relevante para perguntas sobre programação hidráulica diária e gestão de inundações a jusante de usinas
    hidrelétricas.
- property: agentInstructions
  value: '- [num_ordemcs] Campo num_ordemcs possui aproximadamente 3% de valores nulos (~311 registros).
    Pode indicar reservatórios sem curva de segurança definida ou registros históricos anteriores à implementação
    deste campo no sistema ONS. Nulos devem ser tratados antes de qualquer ordenação ou filtragem por
    curva de segurança.


    - [val_volumeespera] Valor mínimo de 21,13% pode representar reservatórios com restrições operativas
    severas ou registros atípicos. Valores próximos a 100% indicam reservatórios sem restrição de espera
    (capacidade plena permitida). Recomenda-se verificar distribuição por usina para identificar outliers
    por reservatório específico.


    - [din_instante] O dataset cobre período de 2006-10-28 a 2026-11-06 com apenas 10.370 registros totais.
    Considerando múltiplos reservatórios e granularidade diária, o volume é baixo, sugerindo possíveis
    lacunas temporais para determinadas usinas ou períodos sem publicação de volume de espera. Recomenda-se
    verificar continuidade por usina.


    - [cod_usina] A chave primária natural esperada é (cod_usina, din_instante). Dado que o CKAN informa
    duas atualizações diárias (12h e 19h), podem existir dois registros por usina por dia, o que não seria
    duplicata mas sim granularidade intradiária. Verificar se há registros duplicados exatos ou múltiplos
    registros por (usina, data) que requeiram deduplicação antes de análises diárias.


    - [id_subsistema] Valores com trailing spaces detectados em ''id_subsistema''. Use TRIM() em filtros
    WHERE para evitar perda de registros.

    - [nom_bacia] Valores com trailing spaces detectados em ''nom_bacia''. Use TRIM() em filtros WHERE
    para evitar perda de registros.

    - [nom_ree] Valores com trailing spaces detectados em ''nom_ree''. Use TRIM() em filtros WHERE para
    evitar perda de registros.'
- property: typicalQuestions
  value:
  - Quais reservatórios estão acima do volume de espera recomendado hoje?
  - Qual é o histórico do volume de espera recomendado para a usina de Itaipu nos últimos 12 meses?
  - Quais reservatórios do subsistema Sudeste têm volume de espera abaixo de 50% do volume útil?
  - Como o volume de espera recomendado variou durante períodos de cheia na bacia do Paraná?
  - Quais usinas da bacia do São Francisco apresentaram volume de espera igual a 100% (sem restrição)
    em 2023?
- property: granularity
  value: diária
- property: temporalCoverageStart
  value: '2006-10-28'
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/res_volumeespera/*.parquet', union_by_name=true)
- property: semantics
  value:
    temporal_perspective: verificado
    row_grain:
      temporal: 1 dia
      temporal_column: din_instante
      spatial: usina
      entity: reservatorio
      one_row_per:
      - din_instante
      - id_subsistema
      - id_reservatorio
      - cod_usina
    dimension_columns:
      subsistema: id_subsistema
      fonte: null
      usina: null
      reservatorio: nom_reservatorio
      bacia: nom_bacia
      subestacao: null
      patamar: null
    metrics:
    - id: volumeespera
      label: Volume de Espera Recomendado
      columns:
      - val_volumeespera
      expression: val_volumeespera
      quantity_kind: volume
      unit_native: '%'
      default_aggregation: last_or_avg
      forbidden_aggregations: []
      valid_intents:
      - volume espera
      - volume de espera
      - val volume espera
      - percentual volume util
      - nivel maximo reservatorio
      - limite armazenamento
      - restricao operativa reservatorio
      - amortecimento cheias
      aggregation_modes:
        maximum:
          sql: MAX(val_volumeespera)
          unit: '%'
        average:
          sql: AVG(val_volumeespera)
          unit: '%'
        minimum:
          sql: MIN(val_volumeespera)
          unit: '%'
        time_series:
          sql: AVG(val_volumeespera)
          unit: '%'
        ranking:
          sql: AVG(val_volumeespera)
          unit: '%'
        comparison:
          sql: AVG(val_volumeespera)
          unit: '%'
      interval_hours: 24.0
      aliases:
      - volume espera
      - volume de espera
      - val volume espera
      - percentual volume util
      - nivel maximo reservatorio
      - limite armazenamento
      - restricao operativa reservatorio
    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: true
      supports_ranking: true
      primary_use_case: serie_temporal
    selection_policy:
      covers_metrics:
      - volumeespera
      preferred_for:
      - volume de espera recomendado
      - limite maximo armazenamento reservatorio
      - restricao amortecimento cheias
      - conformidade nivel real volume espera
      - headroom armazenamento cheia
      - programacao hidraulica diaria
      - risco hidrologico reservatorio
      - violacao volume espera
      - capacidade amortecimento inundacao
      not_preferred_for:
      - nuclear
      - MMGD
      - energia armazenada percentual
      - EAR subsistema
      - energia natural afluente
      - ENA bacia
      - vazao fluviometrica
      - geracao hidraulica MWmed
      - cota reservatorio
      - volume util observado
      - nivel dagua observado
      - dados hidrologicos horarios
    value_aliases:
      subsistema:
        SE:
          aliases:
          - sudeste
          - centro-oeste
          - se/co
          - sudeste centro-oeste
          filter: TRIM(id_subsistema) = 'SE'
        S:
          aliases:
          - sul
          filter: TRIM(id_subsistema) = 'S'
        NE:
          aliases:
          - nordeste
          filter: TRIM(id_subsistema) = 'NE'
      nom_subsistema:
        Nordeste:
          aliases:
          - nordeste
          filter: TRIM(nom_subsistema) = 'Nordeste'
        Sudeste/Centro-Oeste:
          aliases:
          - sudeste
          - centro-oeste
          - sudeste centro-oeste
          filter: TRIM(nom_subsistema) = 'Sudeste/Centro-Oeste'
        Sul:
          aliases:
          - sul
          filter: TRIM(nom_subsistema) = 'Sul'
      tip_reservatorio:
