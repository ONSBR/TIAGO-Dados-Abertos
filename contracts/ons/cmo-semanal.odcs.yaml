- property: fewShotQueries
  value:
  - question: Qual foi a evolução do CMO médio semanal por subsistema no último ano disponível?
    sql: SELECT id_subsistema, nom_subsistema, DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP))
      AS mes, AVG(val_cmomediasemanal) AS cmo_medio_mensal, MIN(val_cmomediasemanal) AS cmo_minimo, MAX(val_cmomediasemanal)
      AS cmo_maximo FROM read_parquet('s3://ons-aws-prod-opendata/dataset/cmo_se/*.parquet') WHERE din_instante
      >= ( SELECT MAX(din_instante) - INTERVAL '1 year' FROM read_parquet('s3://ons-aws-prod-opendata/dataset/cmo_se/*.parquet')
      ) GROUP BY id_subsistema, nom_subsistema, DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP))
      ORDER BY mes, id_subsistema;
  - question: Qual é a diferença histórica entre o CMO do patamar pesado e leve para cada subsistema?
    sql: SELECT id_subsistema, nom_subsistema, CAST(DATE_TRUNC('year', TRY_CAST(din_instante AS TIMESTAMP))
      AS DATE) AS ano, AVG(val_cmopesada - val_cmoleve) AS spread_medio_anual, MAX(val_cmopesada - val_cmoleve)
      AS spread_maximo, MIN(val_cmopesada - val_cmoleve) AS spread_minimo FROM read_parquet('s3://ons-aws-prod-opendata/dataset/cmo_se/*.parquet')
      GROUP BY id_subsistema, nom_subsistema, CAST(DATE_TRUNC('year', TRY_CAST(din_instante AS TIMESTAMP))
      AS DATE) ORDER BY ano DESC, id_subsistema;
  - question: Quais subsistemas tiveram o maior CMO durante a crise hídrica de 2021?
    sql: SELECT id_subsistema, nom_subsistema, AVG(TRY_CAST(val_cmomediasemanal AS DOUBLE)) AS cmo_medio, MAX(TRY_CAST(val_cmomediasemanal AS DOUBLE))
      AS cmo_pico, COUNT(*) AS semanas_analisadas FROM read_parquet('s3://ons-aws-prod-opendata/dataset/cmo_se/*.parquet')
      WHERE din_instante >= '2021-01-01' AND din_instante < '2022-01-01' GROUP BY id_subsistema, nom_subsistema
      ORDER BY cmo_medio DESC;
