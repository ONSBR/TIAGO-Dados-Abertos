    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: false
      supports_ranking: false
      primary_use_case: serie_temporal
    selection_policy:
      covers_metrics:
      - modalidadecontratual
      - modalidadeemergencial
      - modalidadeoportunidade
      - modalidadeteste
      - modalidadeexcepcional
      - progmodalidadecontratual
      - progmodalidadeemergencial
      - progmodalidadeoportunidade
      - progmodalidadeteste
      - totalprogramado
      - totalverificado
      preferred_for:
      - modalidade contratual conversora
      - modalidade emergencial HVDC
      - intercambio por modalidade
      - conversora frequencia modalidade
      - programado verificado modalidade
      - acionamento emergencial conversora
      - modalidade excepcional intercambio
      - desvio programado verificado conversora
      - auditoria contrato intercambio internacional
      - CI GARABI modalidade
      - CI URUGUAIANA modalidade
      - CI RIVERA modalidade
      - CI MELO modalidade
      - CI ACARAY modalidade
      not_preferred_for:
      - intercambio subsistema agregado
      - carga energia subsistema
      - geracao termica despacho
      - fator capacidade
      - usina individual
      - nuclear
      - MMGD
      - geracao eolica subsistema
      - geracao solar subsistema
    value_aliases:
      nom_conversora:
        acaray:
          aliases:
          - acaray
          - CI ACARAY
          - conversora acaray
          filter: TRIM(nom_conversora) = 'CI ACARAY'
        garabi1:
          aliases:
          - garabi 1
          - garabi1
          - CI CV.GARABI 1
          - garabi um
          filter: TRIM(nom_conversora) = 'CI CV.GARABI 1'
        garabi2:
          aliases:
          - garabi 2
          - garabi2
          - CI CV.GARABI 2
          - garabi dois
          filter: TRIM(nom_conversora) = 'CI CV.GARABI 2'
        uruguaiana:
          aliases:
          - uruguaiana
          - CI CV.URUGUAIANA
          - conversora uruguaiana
          filter: TRIM(nom_conversora) = 'CI CV.URUGUAIANA'
        melo:
          aliases:
          - melo
          - CI MELO
          - conversora melo
          filter: TRIM(nom_conversora) = 'CI MELO'
        rivera:
          aliases:
          - rivera
          - CI RIVERA
          - conversora rivera
          filter: TRIM(nom_conversora) = 'CI RIVERA'
      nom_paisconversora:
        argentina:
          aliases:
          - argentina
          - Argentina
          - arg
          filter: TRIM(nom_paisconversora) = 'Argentina'
        uruguai:
          aliases:
          - uruguai
          - Uruguai
          - uru
          filter: TRIM(nom_paisconversora) = 'Uruguai'
    sql_patterns:
      modalidadecontratual_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  TRIM(nom_conversora)\
          \ AS conversora,\n  SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE)) AS intercambio_contratual_mwh\n\
          FROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP\
          \ BY 1, 2\nORDER BY 1, 2"
        output_unit: MWh
        matches:
          output_modes:
          - total
          metrics:
          - modalidadecontratual
          grain: month
        validated_params:
          year: '2026'
      desvio_programado_verificado:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  TRIM(nom_conversora)\
          \ AS conversora,\n  SUM(TRY_CAST(val_totalprogramado AS DOUBLE)) AS total_programado_mwh,\n\
          \  SUM(TRY_CAST(val_totalverificado AS DOUBLE)) AS total_verificado_mwh,\n  SUM(TRY_CAST(val_totalverificado\
          \ AS DOUBLE)) - SUM(TRY_CAST(val_totalprogramado AS DOUBLE)) AS desvio_mwh\nFROM {source}\n\
          WHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\n  AND val_totalprogramado\
          \ IS NOT NULL\n  AND val_totalverificado IS NOT NULL\nGROUP BY 1, 2\nORDER BY 1, 2"
        output_unit: MWh
        matches:
          output_modes:
          - comparison
          metrics:
          - totalprogramado
          - totalverificado
          grain: month
        validated_params:
          year: '2026'
      emergencial_por_conversora:
        template: "SELECT TRIM(nom_conversora) AS conversora,\n  SUM(TRY_CAST(val_modalidadeemergencial\
          \ AS DOUBLE)) AS intercambio_emergencial_mwh\nFROM {source}\nWHERE din_instante >= '{start_date}'\n\
          \  AND din_instante < '{end_date}'\nGROUP BY 1\nORDER BY 2 DESC"
        output_unit: MWh
        matches:
          output_modes:
          - ranking
          metrics:
          - modalidadeemergencial
          grain: period
        validated_params:
          start_date: '2026-01-01'
          end_date: '2026-07-16'
      participacao_modalidade:
        template: "SELECT TRIM(nom_conversora) AS conversora,\n  SUM(TRY_CAST(val_modalidadecontratual\
          \ AS DOUBLE)) AS contratual_mwh,\n  SUM(TRY_CAST(val_modalidadeemergencial AS DOUBLE)) AS emergencial_mwh,\n\
          \  SUM(TRY_CAST(val_modalidadeoportunidade AS DOUBLE)) AS oportunidade_mwh,\n  SUM(TRY_CAST(val_modalidadeteste\
          \ AS DOUBLE)) AS teste_mwh,\n  COALESCE(SUM(TRY_CAST(val_modalidadeexcepcional AS DOUBLE)),\
          \ 0) AS excepcional_mwh\nFROM {source}\nWHERE din_instante >= '{start_date}'\n  AND din_instante\
          \ < '{end_date}'\nGROUP BY 1\nORDER BY 1"
        output_unit: MWh
        matches:
          output_modes:
          - comparison
          metrics:
          - modalidadecontratual
          - modalidadeemergencial
          - modalidadeoportunidade
          - modalidadeteste
          - modalidadeexcepcional
          grain: period
        validated_params:
          start_date: '2026-01-01'
          end_date: '2026-07-16'
    ambiguity_policy:
      default_assumptions:
      - when:
        - intercambio
        - intercambio total
        - energia intercambiada
        assume_metric: totalverificado
        assume_output: total
        note: Quando usuario pede intercambio sem especificar modalidade, assume-se o total verificado
          (val_totalverificado). Alertar que dado disponivel apenas para ~22.8% dos registros (conversoras
          internacionais/HVDC).
      - when:
        - contratual
        - modalidade contratual
        assume_metric: modalidadecontratual
        assume_output: total
        note: Intercambio contratual verificado e a metrica primaria para analise de cumprimento de contratos.
      - when:
        - emergencial
        - acionamento emergencial
        - emergencia
        assume_metric: modalidadeemergencial
        assume_output: total
        note: Intercambio emergencial verificado. Valores negativos indicam exportacao de energia.
      - when:
        - programado
        - programa de intercambio
        assume_metric: totalprogramado
        assume_output: total
        note: Quando usuario pede intercambio programado sem especificar modalidade, assume-se val_totalprogramado.
          Alertar que disponivel apenas para subconjunto de conversoras e ausente em arquivos historicos
          anteriores a 2026.
      must_clarify_when:
      - trigger_terms:
        - desvio
        - diferenca programado verificado
        - aderencia
        clarification: Deseja o desvio absoluto (verificado - programado) ou percentual? E para qual modalidade
          especifica ou para o total?
        reason: Desvio pode ser calculado para cada modalidade individualmente ou para os totais; e pode
          ser absoluto ou relativo.
      - trigger_terms:
        - participacao
        - percentual modalidade
        - mix modalidade
        clarification: Deseja a participacao percentual de cada modalidade no total verificado por conversora,
          ou comparacao entre conversoras para uma modalidade especifica?
        reason: Participacao pode ser calculada por conversora ou agregada para todas as conversoras.
      redirect_when:
      - user_mentions:
        - usina
        - ceg
        - itaipu
        - angra
        - ranking de usinas
        reason: Schema nao contem CEG, usina ou identificador fisico de usina. Dataset cobre conversoras
          de frequencia/HVDC, nao usinas geradoras.
        redirect: geracao-usina-2
      - user_mentions:
        - nuclear
        reason: Schema nao contem dimensao de fonte nuclear. Dataset cobre intercambio internacional por
          conversora.
        redirect: geracao-usina-2 com filtro de combustivel/tipo nuclear
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Schema nao contem coluna MMGD ou micro/minigeracao distribuida.
        redirect: dataset com coluna val_germmgd quando disponivel
      - user_mentions:
        - carga
        - consumo subsistema
        - demanda subsistema
        reason: Dataset nao contem dados de carga ou consumo. Cobre apenas intercambio internacional por
          conversora.
        redirect: carga-energia
      - user_mentions:
        - geracao hidraulica
        - geracao eolica
        - geracao solar
        - geracao termica
        - fator capacidade
        reason: Dataset nao contem dados de geracao por fonte. Cobre apenas intercambio internacional
          por conversora discriminado por modalidade contratual.
        redirect: geracao-usina-2 ou balanco-energia-subsistema
- property: fewShotQueries
  value:
  - question: Qual a participação percentual de cada modalidade no intercâmbio total verificado por conversora
      em 2024?
    sql: SELECT nom_conversora, ROUND(SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE)), 2) AS total_contratual_mwh,
      ROUND(SUM(TRY_CAST(val_modalidadeemergencial AS DOUBLE)), 2) AS total_emergencial_mwh, ROUND(SUM(TRY_CAST(val_modalidadeoportunidade
      AS DOUBLE)), 2) AS total_oportunidade_mwh, ROUND(SUM(TRY_CAST(val_modalidadeteste AS DOUBLE)), 2)
      AS total_teste_mwh, ROUND(SUM(COALESCE(TRY_CAST(val_modalidadeexcepcional AS DOUBLE), 0.0)), 2)
      AS total_excepcional_mwh, ROUND( SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE)) + SUM(TRY_CAST(val_modalidadeemergencial
      AS DOUBLE)) + SUM(TRY_CAST(val_modalidadeoportunidade AS DOUBLE)) + SUM(TRY_CAST(val_modalidadeteste
      AS DOUBLE)) + SUM(COALESCE(TRY_CAST(val_modalidadeexcepcional AS DOUBLE), 0.0)), 2) AS total_geral_mwh
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/intercambio_modalidade_ho/*.parquet') WHERE
      din_instante >= '2024-01-01' AND din_instante < '2025-01-01' GROUP BY nom_conversora ORDER BY total_geral_mwh
      DESC;
  - question: Qual conversora apresentou maior desvio absoluto entre intercâmbio programado e verificado
      na modalidade contratual em 2024?
    sql: SELECT nom_conversora, COUNT(*) AS patamares_com_dados, ROUND(SUM(TRY_CAST(val_progmodalidadecontratual
      AS DOUBLE)), 2) AS total_programado_mwh, ROUND(SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE)),
      2) AS total_verificado_mwh, ROUND( SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE)) - SUM(TRY_CAST(val_progmodalidadecontratual
      AS DOUBLE)), 2) AS desvio_liquido_mwh, ROUND( ABS(SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE))
      - SUM(TRY_CAST(val_progmodalidadecontratual AS DOUBLE))), 2) AS desvio_absoluto_mwh FROM read_parquet('s3://ons-aws-prod-opendata/dataset/intercambio_modalidade_ho/*.parquet')
      WHERE din_instante >= '2024-01-01' AND din_instante < '2025-01-01' AND val_progmodalidadecontratual
      IS NOT NULL AND val_modalidadecontratual IS NOT NULL GROUP BY nom_conversora ORDER BY desvio_absoluto_mwh
      DESC;
  - question: Como evoluiu mensalmente o intercâmbio na modalidade oportunidade ao longo de 2023 e 2024?
    sql: SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes_referencia, nom_conversora,
      ROUND(SUM(TRY_CAST(val_modalidadeoportunidade AS DOUBLE)), 2) AS total_oportunidade_mwh, COUNT(*)
      AS patamares_horarios FROM read_parquet('s3://ons-aws-prod-opendata/dataset/intercambio_modalidade_ho/*.parquet')
      WHERE din_instante >= '2023-01-01' AND din_instante < '2025-01-01' GROUP BY DATE_TRUNC('month',
      TRY_CAST(din_instante AS TIMESTAMP)), nom_conversora ORDER BY mes_referencia, nom_conversora;
