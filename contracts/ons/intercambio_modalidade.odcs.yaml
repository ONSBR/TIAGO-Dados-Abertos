description:
  purpose: Suporta operadores do ONS e agentes do setor elétrico no acompanhamento, auditoria e reconciliação
    dos intercâmbios de energia por modalidade contratual em base horária, permitindo decisões de despacho,
    programação operativa, liquidação de contratos de intercâmbio internacional e análise de desvios entre
    volumes programados e verificados por conversora e patamar horário.
  limitations: Coluna armazena valores numéricos (MWh) como VARCHAR devido ao formato de serialização;
    operações aritméticas diretas falharão silenciosamente ou gerarão erro de tipo. Coluna armazena valores
    numéricos (MWh) como VARCHAR devido a formato de serialização; requer TRY_CAST para uso em agregações.
    Coluna armazena valores numéricos (MWh) como VARCHAR devido ao formato de serialização; requer TRY_CAST
    para uso em agregações.
  usage: Recuperar este dataset quando a pergunta envolver análise de intercâmbio de energia discriminado
    por modalidade contratual (contratual, emergencial, oportunidade, teste ou excepcional) em nível de
    patamar horário por conversora de frequência ou estação HVDC.
domain: intercâmbio
schema:
- name: intercambio_modalidade
  physicalType: parquet
  logicalType: object
  physicalName: intercambio_modalidade
  properties:
  - name: nom_conversora
    physicalType: VARCHAR
    logicalType: string
    description: Nome da conversora de frequência ou estação HVDC responsável pelo intercâmbio de energia
      registrado
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - conversora
      - estacao_conversora
      - nome_conversora
      - usina_conversora
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - CI ACARAY
      - CI CV.GARABI 1
      - CI CV.GARABI 2
      - CI CV.URUGUAIANA
      - CI MELO
      - CI RIVERA
  - name: din_instante
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Instante de referência do patamar horário ao qual os valores de intercâmbio se referem
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - instante
      - data_hora
      - timestamp
      - hora
      - patamar
      - data_instante
    - property: semanticType
      value: TIMESTAMP
  - name: val_modalidadecontratual
    physicalType: VARCHAR
    logicalType: string
    description: Energia intercambiada na modalidade contratual (MWh) no patamar horário — valor verificado/realizado
    customProperties:
    - property: aliases
      value:
      - intercambio_contratual
      - modalidade_contratual
      - energia_contratual
      - val_contratual
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_modalidadecontratual AS DOUBLE)
    - property: unit
      value: MWh
  - name: val_modalidadeemergencial
