          filter: TRIM(nom_conversora) = 'CI MELO'
        rivera:
          aliases:
          - rivera
          - CI RIVERA
          - conversora rivera
          filter: TRIM(nom_conversora) = 'CI RIVERA'
      nom_paisconversora:
        argentina:
          aliases:
          - argentina
          - Argentina
          - arg
          filter: TRIM(nom_paisconversora) = 'Argentina'
        uruguai:
          aliases:
          - uruguai
          - Uruguai
          - uru
          filter: TRIM(nom_paisconversora) = 'Uruguai'
    sql_patterns:
      modalidadecontratual_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  TRIM(nom_conversora)\
          \ AS conversora,\n  SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE)) AS intercambio_contratual_mwh\n\
          FROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP\
          \ BY 1, 2\nORDER BY 1, 2"
        output_unit: MWh
        matches:
          output_modes:
          - total
          metrics:
          - modalidadecontratual
          grain: month
        validated_params:
          year: '2026'
      desvio_programado_verificado:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  TRIM(nom_conversora)\
          \ AS conversora,\n  SUM(TRY_CAST(val_totalprogramado AS DOUBLE)) AS total_programado_mwh,\n\
          \  SUM(TRY_CAST(val_totalverificado AS DOUBLE)) AS total_verificado_mwh,\n  SUM(TRY_CAST(val_totalverificado\
          \ AS DOUBLE)) - SUM(TRY_CAST(val_totalprogramado AS DOUBLE)) AS desvio_mwh\nFROM {source}\n\
          WHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\n  AND val_totalprogramado\
          \ IS NOT NULL\n  AND val_totalverificado IS NOT NULL\nGROUP BY 1, 2\nORDER BY 1, 2"
        output_unit: MWh
        matches:
          output_modes:
          - comparison
          metrics:
          - totalprogramado
          - totalverificado
          grain: month
        validated_params:
          year: '2026'
      emergencial_por_conversora:
        template: "SELECT TRIM(nom_conversora) AS conversora,\n  SUM(TRY_CAST(val_modalidadeemergencial\
          \ AS DOUBLE)) AS intercambio_emergencial_mwh\nFROM {source}\nWHERE din_instante >= '{start_date}'\n\
          \  AND din_instante < '{end_date}'\nGROUP BY 1\nORDER BY 2 DESC"
        output_unit: MWh
        matches:
          output_modes:
          - ranking
          metrics:
          - modalidadeemergencial
          grain: period
        validated_params:
          start_date: '2026-01-01'
          end_date: '2026-07-16'
      participacao_modalidade:
        template: "SELECT TRIM(nom_conversora) AS conversora,\n  SUM(TRY_CAST(val_modalidadecontratual\
          \ AS DOUBLE)) AS contratual_mwh,\n  SUM(TRY_CAST(val_modalidadeemergencial AS DOUBLE)) AS emergencial_mwh,\n\
          \  SUM(TRY_CAST(val_modalidadeoportunidade AS DOUBLE)) AS oportunidade_mwh,\n  SUM(TRY_CAST(val_modalidadeteste\
          \ AS DOUBLE)) AS teste_mwh,\n  COALESCE(SUM(TRY_CAST(val_modalidadeexcepcional AS DOUBLE)),\
          \ 0) AS excepcional_mwh\nFROM {source}\nWHERE din_instante >= '{start_date}'\n  AND din_instante\
          \ < '{end_date}'\nGROUP BY 1\nORDER BY 1"
        output_unit: MWh
        matches:
          output_modes:
          - comparison
          metrics:
          - modalidadecontratual
          - modalidadeemergencial
          - modalidadeoportunidade
          - modalidadeteste
          - modalidadeexcepcional
          grain: period
        validated_params:
          start_date: '2026-01-01'
          end_date: '2026-07-16'
- property: fewShotQueries
  value:
  - question: Qual a participação percentual de cada modalidade no intercâmbio total verificado por conversora
      em 2024?
    sql: SELECT nom_conversora, ROUND(SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE)), 2) AS total_contratual_mwh,
      ROUND(SUM(TRY_CAST(val_modalidadeemergencial AS DOUBLE)), 2) AS total_emergencial_mwh, ROUND(SUM(TRY_CAST(val_modalidadeoportunidade
      AS DOUBLE)), 2) AS total_oportunidade_mwh, ROUND(SUM(TRY_CAST(val_modalidadeteste AS DOUBLE)), 2)
      AS total_teste_mwh, ROUND(SUM(COALESCE(TRY_CAST(val_modalidadeexcepcional AS DOUBLE), 0.0)), 2)
      AS total_excepcional_mwh, ROUND( SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE)) + SUM(TRY_CAST(val_modalidadeemergencial
      AS DOUBLE)) + SUM(TRY_CAST(val_modalidadeoportunidade AS DOUBLE)) + SUM(TRY_CAST(val_modalidadeteste
      AS DOUBLE)) + SUM(COALESCE(TRY_CAST(val_modalidadeexcepcional AS DOUBLE), 0.0)), 2) AS total_geral_mwh
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/intercambio_modalidade_ho/*.parquet') WHERE
      din_instante >= '2024-01-01' AND din_instante < '2025-01-01' GROUP BY nom_conversora ORDER BY total_geral_mwh
      DESC;
  - question: Qual conversora apresentou maior desvio absoluto entre intercâmbio programado e verificado
      na modalidade contratual em 2024?
    sql: SELECT nom_conversora, COUNT(*) AS patamares_com_dados, ROUND(SUM(TRY_CAST(val_progmodalidadecontratual
      AS DOUBLE)), 2) AS total_programado_mwh, ROUND(SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE)),
      2) AS total_verificado_mwh, ROUND( SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE)) - SUM(TRY_CAST(val_progmodalidadecontratual
      AS DOUBLE)), 2) AS desvio_liquido_mwh, ROUND( ABS(SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE))
      - SUM(TRY_CAST(val_progmodalidadecontratual AS DOUBLE))), 2) AS desvio_absoluto_mwh FROM read_parquet('s3://ons-aws-prod-opendata/dataset/intercambio_modalidade_ho/*.parquet')
      WHERE din_instante >= '2024-01-01' AND din_instante < '2025-01-01' AND val_progmodalidadecontratual
      IS NOT NULL AND val_modalidadecontratual IS NOT NULL GROUP BY nom_conversora ORDER BY desvio_absoluto_mwh
      DESC;
  - question: Como evoluiu mensalmente o intercâmbio na modalidade oportunidade ao longo de 2023 e 2024?
    sql: SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes_referencia, nom_conversora,
      ROUND(SUM(TRY_CAST(val_modalidadeoportunidade AS DOUBLE)), 2) AS total_oportunidade_mwh, COUNT(*)
      AS patamares_horarios FROM read_parquet('s3://ons-aws-prod-opendata/dataset/intercambio_modalidade_ho/*.parquet')
      WHERE din_instante >= '2023-01-01' AND din_instante < '2025-01-01' GROUP BY DATE_TRUNC('month',
      TRY_CAST(din_instante AS TIMESTAMP)), nom_conversora ORDER BY mes_referencia, nom_conversora;
