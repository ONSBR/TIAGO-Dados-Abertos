authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/intercambio_modalidade
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - intercambio por tipo de contrato
  - intercambio emergencial ou contratual
  - modalidade do intercambio
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver análise de intercâmbio de energia discriminado
    por modalidade contratual (contratual, emergencial, oportunidade, teste ou excepcional) em nível de
    patamar horário por conversora de frequência ou estação HVDC. Também relevante para comparações entre
    volumes programados e verificados de intercâmbio, auditoria de contratos de intercâmbio internacional
    e identificação de acionamentos emergenciais por conversora no Sistema Interligado Nacional.
- property: agentInstructions
  value: |
    - [val_modalidadecontratual] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização (object→UTF8). Contém valores numéricos representando MWh. Todas as operações aritméticas e agregações falharão sem conversão explícita de tipo.

    - [val_modalidadeemergencial] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização (object→UTF8). Contém valores numéricos representando MWh. Todas as operações aritméticas e agregações falharão sem conversão explícita de tipo.

    - [val_modalidadeoportunidade] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização (object→UTF8). Contém valores numéricos representando MWh. Todas as operações aritméticas e agregações falharão sem conversão explícita de tipo.

    - [val_modalidadeteste] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização (object→UTF8). Contém valores numéricos representando MWh. Todas as operações aritméticas e agregações falharão sem conversão explícita de tipo.

    - [val_modalidadeexcepcional] Boa parte dos registros possuem nulo nesta coluna, indicando que a modalidade excepcional não é aplicável a todas as conversoras ou períodos. Além disso, é armazenada como VARCHAR pelo formato de serialização. Filtros sem tratamento de nulo podem distorcer análises.

    - [nom_paisconversora] A maior parte dos registros possuem nulo nesta coluna. O padrão de nulidade coincide com as colunas val_prog* e val_total*, sugerindo que apenas conversoras internacionais ou HVDC possuem este campo preenchido. Joins ou filtros por país sem tratamento de nulo excluirão a maioria dos registros.

    - [val_progmodalidadecontratual] A maior parte dos registros possuem nulo nesta coluna. Dados programados estão disponíveis apenas para um subconjunto de conversoras, possivelmente as internacionais ou HVDC. Além disso, é armazenada como VARCHAR pelo formato de serialização.

    - [val_progmodalidadeemergencial] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização (object→UTF8), com nulos na maior parte das linhas. Contém valores numéricos representando MWh programados na modalidade emergencial. Requer TRY_CAST para uso analítico.

    - [val_progmodalidadeoportunidade] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização (object→UTF8), com nulos na maior parte das linhas. Contém valores numéricos representando MWh programados na modalidade oportunidade. Requer TRY_CAST para uso analítico.

    - [val_progmodalidadeteste] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização (object→UTF8), com nulos na maior parte das linhas. Contém valores numéricos representando MWh programados na modalidade teste. Requer TRY_CAST para uso analítico.

    - [val_totalprogramado] A maior parte dos registros possuem nulo nesta coluna. Disponível apenas para subconjunto de conversoras (possivelmente internacionais/HVDC). Além disso, é armazenada como VARCHAR pelo formato de serialização. Recomenda-se verificar consistência com a soma das modalidades programadas individuais.

    - [val_totalverificado] A maior parte dos registros possuem nulo nesta coluna. Disponível apenas para subconjunto de conversoras (possivelmente internacionais/HVDC). Além disso, é armazenada como VARCHAR pelo formato de serialização. Recomenda-se verificar consistência com a soma das modalidades verificadas individuais.

    - [nom_conversora] Valores com trailing spaces detectados em 'nom_conversora'. Use TRIM() em filtros WHERE para evitar perda de registros.
    - [nom_paisconversora] Valores com trailing spaces detectados em 'nom_paisconversora'. Use TRIM() em filtros WHERE para evitar perda de registros.
    - [nom_paisconversora] Coluna 'nom_paisconversora' ausente em arquivos históricos (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2023.parquet). Presente apenas a partir de versões recentes (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2026.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [val_progmodalidadecontratual] Coluna 'val_progmodalidadecontratual' ausente em arquivos históricos (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2023.parquet). Presente apenas a partir de versões recentes (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2026.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [val_progmodalidadeemergencial] Coluna 'val_progmodalidadeemergencial' ausente em arquivos históricos (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2023.parquet). Presente apenas a partir de versões recentes (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2026.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [val_progmodalidadeoportunidade] Coluna 'val_progmodalidadeoportunidade' ausente em arquivos históricos (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2023.parquet). Presente apenas a partir de versões recentes (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2026.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [val_progmodalidadeteste] Coluna 'val_progmodalidadeteste' ausente em arquivos históricos (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2023.parquet). Presente apenas a partir de versões recentes (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2026.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [val_totalprogramado] Coluna 'val_totalprogramado' ausente em arquivos históricos (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2023.parquet). Presente apenas a partir de versões recentes (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2026.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [val_totalverificado] Coluna 'val_totalverificado' ausente em arquivos históricos (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2023.parquet). Presente apenas a partir de versões recentes (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2026.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [tipos] As colunas `val_modalidadecontratual`, `val_modalidadeemergencial`, `val_modalidadeexcepcional`, `val_modalidadeoportunidade`, `val_modalidadeteste` mudam de tipo entre arquivos anuais (texto em uns, número em outros); cada uma traz `castExpression` no schema: use-o em toda agregação e comparação.
- property: typicalQuestions
  value:
  - Qual foi o volume de intercâmbio contratual pela conversora de Uruguaiana em janeiro de 2024?
  - Quais conversoras apresentaram maior volume de intercâmbio emergencial no último trimestre?
  - Qual é o desvio médio entre o intercâmbio programado e verificado por modalidade e conversora?
  - Em quais patamares horários ocorreram intercâmbios na modalidade excepcional em 2023?
  - Qual a participação percentual de cada modalidade contratual no intercâmbio total por conversora internacional?
- property: granularity
  value: horária
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/intercambio_modalidade_ho/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2023-01-01'
- property: semantics
  value:
    family: intercambio
    family_default: false
    temporal_perspective: verificado
    row_grain:
      temporal: 1 hora
      temporal_column: din_instante
      spatial: usina
      entity: usina
      one_row_per:
      - din_instante
      - nom_conversora
    dimension_columns:
      subsistema: null
      fonte: null
      usina: null
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: modalidadecontratual
      label: Intercambio Contratual Verificado
      columns:
      - val_modalidadecontratual
      expression: TRY_CAST(val_modalidadecontratual AS DOUBLE)
      quantity_kind: energy
      unit_native: MWh
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total:
          sql: SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE))
          unit: MWh
        average:
          sql: AVG(TRY_CAST(val_modalidadecontratual AS DOUBLE))
          unit: MWh
        maximum:
          sql: MAX(TRY_CAST(val_modalidadecontratual AS DOUBLE))
          unit: MWh
        time_series:
          sql: SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE))
          unit: MWh
        ranking:
          sql: SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE))
          unit: MWh
        comparison:
          sql: SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE))
          unit: MWh
      interval_hours: 1.0
      aliases:
      - intercambio_contratual
      - modalidade_contratual
      - energia_contratual
      - val_contratual
    - id: modalidadeemergencial
      label: Intercambio Emergencial Verificado
      columns:
      - val_modalidadeemergencial
      expression: TRY_CAST(val_modalidadeemergencial AS DOUBLE)
      quantity_kind: energy
      unit_native: MWh
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total:
          sql: SUM(TRY_CAST(val_modalidadeemergencial AS DOUBLE))
          unit: MWh
        average:
          sql: AVG(TRY_CAST(val_modalidadeemergencial AS DOUBLE))
          unit: MWh
        maximum:
          sql: MAX(TRY_CAST(val_modalidadeemergencial AS DOUBLE))
          unit: MWh
        time_series:
          sql: SUM(TRY_CAST(val_modalidadeemergencial AS DOUBLE))
          unit: MWh
        ranking:
          sql: SUM(TRY_CAST(val_modalidadeemergencial AS DOUBLE))
          unit: MWh
        comparison:
          sql: SUM(TRY_CAST(val_modalidadeemergencial AS DOUBLE))
          unit: MWh
      interval_hours: 1.0
      aliases:
      - intercambio_emergencial
      - modalidade_emergencial
      - energia_emergencial
      - val_emergencial
      - acionamento_emergencial
    - id: modalidadeoportunidade
      label: Intercambio Oportunidade Verificado
      columns:
      - val_modalidadeoportunidade
      expression: TRY_CAST(val_modalidadeoportunidade AS DOUBLE)
      quantity_kind: energy
      unit_native: MWh
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total:
          sql: SUM(TRY_CAST(val_modalidadeoportunidade AS DOUBLE))
          unit: MWh
        average:
          sql: AVG(TRY_CAST(val_modalidadeoportunidade AS DOUBLE))
