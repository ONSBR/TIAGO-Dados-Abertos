    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: false
      supports_ranking: false
      primary_use_case: serie_temporal
    value_aliases:
      nom_conversora:
        acaray:
          aliases:
          - acaray
          - CI ACARAY
          - conversora acaray
          filter: TRIM(nom_conversora) = 'CI ACARAY'
        garabi1:
          aliases:
          - garabi 1
          - garabi1
          - CI CV.GARABI 1
          - garabi um
          filter: TRIM(nom_conversora) = 'CI CV.GARABI 1'
        garabi2:
          aliases:
