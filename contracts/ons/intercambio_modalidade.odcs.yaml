version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:intercambio_modalidade
name: intercambio_modalidade
tenant: ons
tags:
- HVDC
- ONS
- SIN
- conversora
- energia_eletrica
- horario
- intercambio
- intercambio HVDC
- intercambio contratual
- intercambio emergencial
- intercambio por modalidade
- intercambio_internacional
- intercambio_modalidade
- modalidade_contratual
- programado_verificado
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/intercambio_modalidade_ho/*.parquet
  format: parquet
description:
  purpose: Suporta operadores do ONS e agentes do setor elétrico no acompanhamento, auditoria e reconciliação
    dos intercâmbios de energia por modalidade contratual em base horária, permitindo decisões de despacho,
    programação operativa, liquidação de contratos de intercâmbio internacional e análise de desvios entre
    volumes programados e verificados por conversora e patamar horário.
  limitations: Coluna armazena valores numéricos (MWh) como VARCHAR devido ao formato de serialização;
    operações aritméticas diretas falharão silenciosamente ou gerarão erro de tipo. Coluna armazena valores
    numéricos (MWh) como VARCHAR devido a formato de serialização; requer TRY_CAST para uso em agregações.
    Coluna armazena valores numéricos (MWh) como VARCHAR devido ao formato de serialização; requer TRY_CAST
    para uso em agregações.
  usage: Recuperar este dataset quando a pergunta envolver análise de intercâmbio de energia discriminado
    por modalidade contratual (contratual, emergencial, oportunidade, teste ou excepcional) em nível de
    patamar horário por conversora de frequência ou estação HVDC.
domain: intercâmbio
schema:
- name: intercambio_modalidade
  physicalType: parquet
  logicalType: object
  physicalName: intercambio_modalidade
  properties:
  - name: nom_conversora
    physicalType: VARCHAR
    logicalType: string
    description: Nome da conversora de frequência ou estação HVDC responsável pelo intercâmbio de energia
      registrado
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - conversora
      - estacao_conversora
      - nome_conversora
      - usina_conversora
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - CI ACARAY
      - CI CV.GARABI 1
      - CI CV.GARABI 2
      - CI CV.URUGUAIANA
      - CI MELO
      - CI RIVERA
  - name: din_instante
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Instante de referência do patamar horário ao qual os valores de intercâmbio se referem
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - instante
      - data_hora
      - timestamp
      - hora
      - patamar
      - data_instante
    - property: semanticType
      value: TIMESTAMP
  - name: val_modalidadecontratual
    physicalType: VARCHAR
    logicalType: string
    description: Energia intercambiada na modalidade contratual (MWh) no patamar horário — valor verificado/realizado
    customProperties:
    - property: aliases
      value:
      - intercambio_contratual
      - modalidade_contratual
      - energia_contratual
      - val_contratual
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_modalidadecontratual AS DOUBLE)
    - property: unit
      value: MWh
  - name: val_modalidadeemergencial
    physicalType: VARCHAR
    logicalType: string
    description: Energia intercambiada na modalidade emergencial (MWh) no patamar horário — valor verificado/realizado
    customProperties:
    - property: aliases
      value:
      - intercambio_emergencial
      - modalidade_emergencial
      - energia_emergencial
      - val_emergencial
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_modalidadeemergencial AS DOUBLE)
    - property: unit
      value: MWh
  - name: val_modalidadeoportunidade
    physicalType: VARCHAR
    logicalType: string
    description: Energia intercambiada na modalidade oportunidade (MWh) no patamar horário — valor verificado/realizado
    customProperties:
    - property: aliases
      value:
      - intercambio_oportunidade
      - modalidade_oportunidade
      - energia_oportunidade
      - val_oportunidade
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_modalidadeoportunidade AS DOUBLE)
    - property: unit
      value: MWh
  - name: val_modalidadeteste
    physicalType: VARCHAR
    logicalType: string
    description: Energia intercambiada na modalidade teste (MWh) no patamar horário — valor verificado/realizado
    customProperties:
    - property: aliases
      value:
      - intercambio_teste
      - modalidade_teste
      - energia_teste
      - val_teste
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_modalidadeteste AS DOUBLE)
    - property: unit
      value: MWh
  - name: val_modalidadeexcepcional
    physicalType: VARCHAR
    logicalType: string
    description: Energia intercambiada na modalidade excepcional (MWh) no patamar horário — valor verificado/realizado;
      ausente (~21,3% nulos) quando essa modalidade não ocorre
    customProperties:
    - property: aliases
      value:
      - intercambio_excepcional
      - modalidade_excepcional
      - energia_excepcional
      - val_excepcional
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_modalidadeexcepcional AS DOUBLE)
    - property: unit
      value: MWh
    - property: enum
      value:
      - '0.0'
  - name: nom_paisconversora
    physicalType: VARCHAR
    logicalType: string
    description: Nome do país ao qual a conversora está associada; preenchido apenas para conversoras
      internacionais (~21,3% dos registros têm valor, ~78,7% são nulos)
    customProperties:
    - property: aliases
      value:
      - pais_conversora
      - pais
      - nome_pais
      - country
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Argentina
      - Uruguai
  - name: val_progmodalidadecontratual
    physicalType: VARCHAR
    logicalType: string
    description: Energia programada na modalidade contratual (MWh) para o patamar horário; disponível
      apenas para subconjunto de conversoras (~21,3% dos registros)
    customProperties:
    - property: aliases
      value:
      - programado_contratual
      - prog_contratual
      - val_prog_contratual
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_progmodalidadecontratual AS DOUBLE)
    - property: unit
      value: MWh
  - name: val_progmodalidadeemergencial
    physicalType: VARCHAR
    logicalType: string
    description: Energia programada na modalidade emergencial (MWh) para o patamar horário; disponível
      apenas para subconjunto de conversoras (~21,3% dos registros)
    customProperties:
    - property: aliases
      value:
      - programado_emergencial
      - prog_emergencial
      - val_prog_emergencial
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_progmodalidadeemergencial AS DOUBLE)
    - property: unit
      value: MWh
    - property: enum
      value:
      - '-1100.000'
      - '-200.000'
      - '-250.000'
      - '-275.000'
      - '-500.000'
      - '-550.000'
      - '-675.000'
      - '-800.000'
      - '-825.000'
      - '-850.000'
      - '0.000'
  - name: val_progmodalidadeoportunidade
    physicalType: VARCHAR
    logicalType: string
    description: Energia programada na modalidade oportunidade (MWh) para o patamar horário; disponível
      apenas para subconjunto de conversoras (~21,3% dos registros)
    customProperties:
    - property: aliases
      value:
      - programado_oportunidade
      - prog_oportunidade
      - val_prog_oportunidade
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_progmodalidadeoportunidade AS DOUBLE)
    - property: unit
      value: MWh
    - property: enum
      value:
      - '0.000'
  - name: val_progmodalidadeteste
    physicalType: VARCHAR
    logicalType: string
    description: Energia programada na modalidade teste (MWh) para o patamar horário; disponível apenas
      para subconjunto de conversoras (~21,3% dos registros)
    customProperties:
    - property: aliases
      value:
      - programado_teste
      - prog_teste
      - val_prog_teste
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_progmodalidadeteste AS DOUBLE)
    - property: unit
      value: MWh
    - property: enum
      value:
      - '0.000'
  - name: val_totalprogramado
    physicalType: VARCHAR
    logicalType: string
    description: Soma total da energia programada em todas as modalidades (MWh) para o patamar horário;
      disponível apenas para subconjunto de conversoras (~21,3% dos registros)
    customProperties:
    - property: aliases
      value:
      - total_programado
      - intercambio_programado_total
      - prog_total
      - energia_programada_total
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_totalprogramado AS DOUBLE)
    - property: unit
      value: MWh
  - name: val_totalverificado
    physicalType: VARCHAR
    logicalType: string
    description: Soma total da energia verificada/realizada em todas as modalidades (MWh) para o patamar
      horário; disponível apenas para subconjunto de conversoras (~21,3% dos registros)
    customProperties:
    - property: aliases
      value:
      - total_verificado
      - intercambio_verificado_total
      - energia_verificada_total
      - total_realizado
    - property: semanticType
      value: METRIC
    - property: castExpression
      value: TRY_CAST(val_totalverificado AS DOUBLE)
    - property: unit
      value: MWh
  quality:
  - type: custom
    engine: soda
    implementation: "checks for intercambio_modalidade:\n  - row_count > 0:\n      name: Tabela não pode\
      \ estar vazia\n\n  # Referential integrity\n  - invalid_count(nom_conversora) = 0:\n      valid\
      \ values:\n        - 'CI ACARAY'\n        - 'CI CV.GARABI 1'\n        - 'CI CV.GARABI 2'\n     \
      \   - 'CI CV.URUGUAIANA'\n        - 'CI MELO'\n        - 'CI RIVERA'\n      name: nom_conversora\
      \ deve ser um dos valores válidos\n  - invalid_count(nom_paisconversora) = 0:\n      valid values:\n\
      \        - 'Argentina'\n        - 'Uruguai'\n      name: nom_paisconversora deve ser um dos valores\
      \ válidos\n\n  # Circuit breaker: colunas numéricas VARCHAR (formato de origem)\n  - missing_percent(val_modalidadecontratual)\
      \ < 5:\n      name: val_modalidadecontratual não pode ter >5% nulos\n  - missing_percent(val_modalidadeemergencial)\
      \ < 5:\n      name: val_modalidadeemergencial não pode ter >5% nulos\n  - missing_percent(val_modalidadeoportunidade)\
      \ < 5:\n      name: val_modalidadeoportunidade não pode ter >5% nulos\n  - missing_percent(val_modalidadeteste)\
      \ < 5:\n      name: val_modalidadeteste não pode ter >5% nulos\n  - missing_percent(val_modalidadeexcepcional)\
      \ < 5:\n      name: val_modalidadeexcepcional não pode ter >5% nulos\n  - missing_percent(val_progmodalidadecontratual)\
      \ < 5:\n      name: val_progmodalidadecontratual não pode ter >5% nulos\n  - missing_percent(val_progmodalidadeemergencial)\
      \ < 5:\n      name: val_progmodalidadeemergencial não pode ter >5% nulos\n  - missing_percent(val_progmodalidadeoportunidade)\
      \ < 5:\n      name: val_progmodalidadeoportunidade não pode ter >5% nulos\n  - missing_percent(val_progmodalidadeteste)\
      \ < 5:\n      name: val_progmodalidadeteste não pode ter >5% nulos\n  - missing_percent(val_totalprogramado)\
      \ < 5:\n      name: val_totalprogramado não pode ter >5% nulos\n  - missing_percent(val_totalverificado)\
      \ < 5:\n      name: val_totalverificado não pode ter >5% nulos\n\n  # Baseline de volume — margem\
      \ ±20% do row_count validado\n  - row_count between 54489 and 81734:\n      name: Volume esperado\
      \ entre 54,489 e 81,734 registros\n\n  # Unicidade da chave primária composta ['nom_conversora',\
      \ 'din_instante'] (candidata LLM)\n  - failed rows:\n      name: Chave composta (nom_conversora,\
      \ din_instante) não deve ter duplicatas\n      fail query: |\n        SELECT * FROM intercambio_modalidade\n\
      \        WHERE (nom_conversora, din_instante) IN (\n          SELECT nom_conversora, din_instante\
      \ FROM intercambio_modalidade\n          GROUP BY nom_conversora, din_instante\n          HAVING\
      \ COUNT(*) > 1\n        )\n\n  # Nulos em val_modalidadeexcepcional — alerta de qualidade (real=22.8%,\
      \ threshold=45.6%)\n  - missing_percent(val_modalidadeexcepcional) < 45.6:\n      name: val_modalidadeexcepcional\
      \ não deve ter >45.6% nulos\n\n  # Nulos em nom_paisconversora — alerta de qualidade (real=77.2%,\
      \ threshold=154.4%)\n  - missing_percent(nom_paisconversora) < 154.4:\n      name: nom_paisconversora\
      \ não deve ter >154.4% nulos\n\n  # Nulos em val_progmodalidadecontratual — alerta de qualidade\
      \ (real=77.2%, threshold=154.4%)\n  - missing_percent(val_progmodalidadecontratual) < 154.4:\n \
      \     name: val_progmodalidadecontratual não deve ter >154.4% nulos\n\n  # Nulos em val_totalprogramado\
      \ — alerta de qualidade (real=77.2%, threshold=154.4%)\n  - missing_percent(val_totalprogramado)\
      \ < 154.4:\n      name: val_totalprogramado não deve ter >154.4% nulos\n\n  # Nulos em val_totalverificado\
      \ — alerta de qualidade (real=77.2%, threshold=154.4%)\n  - missing_percent(val_totalverificado)\
      \ < 154.4:\n      name: val_totalverificado não deve ter >154.4% nulos\n"
team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/intercambio_modalidade
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - intercambio por tipo de contrato
  - intercambio emergencial ou contratual
  - modalidade do intercambio
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver análise de intercâmbio de energia discriminado
    por modalidade contratual (contratual, emergencial, oportunidade, teste ou excepcional) em nível de
    patamar horário por conversora de frequência ou estação HVDC. Também relevante para comparações entre
    volumes programados e verificados de intercâmbio, auditoria de contratos de intercâmbio internacional
    e identificação de acionamentos emergenciais por conversora no Sistema Interligado Nacional.
- property: agentInstructions
  value: |
    - [val_modalidadecontratual] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização (object→UTF8). Contém valores numéricos representando MWh. Todas as operações aritméticas e agregações falharão sem conversão explícita de tipo.

    - [val_modalidadeemergencial] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização (object→UTF8). Contém valores numéricos representando MWh. Todas as operações aritméticas e agregações falharão sem conversão explícita de tipo.

    - [val_modalidadeoportunidade] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização (object→UTF8). Contém valores numéricos representando MWh. Todas as operações aritméticas e agregações falharão sem conversão explícita de tipo.

    - [val_modalidadeteste] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização (object→UTF8). Contém valores numéricos representando MWh. Todas as operações aritméticas e agregações falharão sem conversão explícita de tipo.

    - [val_modalidadeexcepcional] Aproximadamente 22,8% dos registros possuem nulo nesta coluna, indicando que a modalidade excepcional não é aplicável a todas as conversoras ou períodos. Além disso, é armazenada como VARCHAR pelo formato de serialização. Filtros sem tratamento de nulo podem distorcer análises.

    - [nom_paisconversora] Aproximadamente 77,2% dos registros possuem nulo nesta coluna. O padrão de nulidade coincide com as colunas val_prog* e val_total*, sugerindo que apenas conversoras internacionais ou HVDC possuem este campo preenchido. Joins ou filtros por país sem tratamento de nulo excluirão a maioria dos registros.

    - [val_progmodalidadecontratual] Aproximadamente 77,2% dos registros possuem nulo nesta coluna. Dados programados estão disponíveis apenas para um subconjunto de conversoras, possivelmente as internacionais ou HVDC. Além disso, é armazenada como VARCHAR pelo formato de serialização.

    - [val_progmodalidadeemergencial] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização (object→UTF8), com 77,2% de nulos. Contém valores numéricos representando MWh programados na modalidade emergencial. Requer TRY_CAST para uso analítico.

    - [val_progmodalidadeoportunidade] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização (object→UTF8), com 77,2% de nulos. Contém valores numéricos representando MWh programados na modalidade oportunidade. Requer TRY_CAST para uso analítico.

    - [val_progmodalidadeteste] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização (object→UTF8), com 77,2% de nulos. Contém valores numéricos representando MWh programados na modalidade teste. Requer TRY_CAST para uso analítico.

    - [val_totalprogramado] Aproximadamente 77,2% dos registros possuem nulo nesta coluna. Disponível apenas para subconjunto de conversoras (possivelmente internacionais/HVDC). Além disso, é armazenada como VARCHAR pelo formato de serialização. Recomenda-se verificar consistência com a soma das modalidades programadas individuais.

    - [val_totalverificado] Aproximadamente 77,2% dos registros possuem nulo nesta coluna. Disponível apenas para subconjunto de conversoras (possivelmente internacionais/HVDC). Além disso, é armazenada como VARCHAR pelo formato de serialização. Recomenda-se verificar consistência com a soma das modalidades verificadas individuais.

    - [nom_conversora] Valores com trailing spaces detectados em 'nom_conversora'. Use TRIM() em filtros WHERE para evitar perda de registros.
    - [nom_paisconversora] Valores com trailing spaces detectados em 'nom_paisconversora'. Use TRIM() em filtros WHERE para evitar perda de registros.
    - [nom_paisconversora] Coluna 'nom_paisconversora' ausente em arquivos históricos (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2023.parquet). Presente apenas a partir de versões recentes (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2026.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [val_progmodalidadecontratual] Coluna 'val_progmodalidadecontratual' ausente em arquivos históricos (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2023.parquet). Presente apenas a partir de versões recentes (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2026.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [val_progmodalidadeemergencial] Coluna 'val_progmodalidadeemergencial' ausente em arquivos históricos (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2023.parquet). Presente apenas a partir de versões recentes (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2026.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [val_progmodalidadeoportunidade] Coluna 'val_progmodalidadeoportunidade' ausente em arquivos históricos (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2023.parquet). Presente apenas a partir de versões recentes (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2026.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [val_progmodalidadeteste] Coluna 'val_progmodalidadeteste' ausente em arquivos históricos (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2023.parquet). Presente apenas a partir de versões recentes (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2026.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [val_totalprogramado] Coluna 'val_totalprogramado' ausente em arquivos históricos (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2023.parquet). Presente apenas a partir de versões recentes (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2026.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [val_totalverificado] Coluna 'val_totalverificado' ausente em arquivos históricos (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2023.parquet). Presente apenas a partir de versões recentes (ex: INTERCAMBIO_ENERGIA_MODALIDADE_2026.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [tipos] As colunas `val_modalidadecontratual`, `val_modalidadeemergencial`, `val_modalidadeexcepcional`, `val_modalidadeoportunidade`, `val_modalidadeteste` mudam de tipo entre arquivos anuais (texto em uns, número em outros); cada uma traz `castExpression` no schema: use-o em toda agregação e comparação.
- property: typicalQuestions
  value:
  - Qual foi o volume de intercâmbio contratual pela conversora de Uruguaiana em janeiro de 2024?
  - Quais conversoras apresentaram maior volume de intercâmbio emergencial no último trimestre?
  - Qual é o desvio médio entre o intercâmbio programado e verificado por modalidade e conversora?
  - Em quais patamares horários ocorreram intercâmbios na modalidade excepcional em 2023?
  - Qual a participação percentual de cada modalidade contratual no intercâmbio total por conversora internacional?
- property: granularity
  value: horária
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/intercambio_modalidade_ho/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2023-01-01'
- property: semantics
  value:
    temporal_perspective: verificado
    row_grain:
      temporal: 1 hora
      temporal_column: din_instante
      spatial: usina
      entity: usina
      one_row_per:
      - din_instante
      - nom_conversora
    dimension_columns:
      subsistema: null
      fonte: null
      usina: null
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: modalidadecontratual
      label: Intercambio Contratual Verificado
      columns:
      - val_modalidadecontratual
      expression: TRY_CAST(val_modalidadecontratual AS DOUBLE)
      quantity_kind: energy
      unit_native: MWh
      default_aggregation: sum
      forbidden_aggregations: []
      valid_intents:
      - modalidadecontratual
      - intercambio_contratual
      - modalidade_contratual
      - energia_contratual
      - val_contratual
      aggregation_modes:
        total:
          sql: SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE))
          unit: MWh
        average:
          sql: AVG(TRY_CAST(val_modalidadecontratual AS DOUBLE))
          unit: MWh
        maximum:
          sql: MAX(TRY_CAST(val_modalidadecontratual AS DOUBLE))
          unit: MWh
        time_series:
          sql: SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE))
          unit: MWh
        ranking:
          sql: SUM(TRY_CAST(val_modalidadecontratual AS DOUBLE))
          unit: MWh
