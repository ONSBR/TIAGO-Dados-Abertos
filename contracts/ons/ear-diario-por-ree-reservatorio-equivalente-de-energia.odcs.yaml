    sql_patterns:
      ear_verif_ree_mwmes_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(ear_data AS DATE)) AS mes,\n  nom_ree,\n  AVG(TRY_CAST(ear_verif_ree_mwmes\
          \ AS DOUBLE)) AS ear_media_mwmes\nFROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(ear_data AS\
          \ DATE)) = 2024\nGROUP BY 1, 2\nORDER BY 1, 2"
        output_unit: MWmes
        matches:
          output_modes:
          - last_value
          - average
          metrics:
          - ear_verif_ree_mwmes
          grain: month
      ear_percentual_serie_diaria:
