    a série histórica diária de energia armazenada por REE, permitindo o acompanhamento das condições
    hidrológicas do SIN, a projeção do Custo Marginal de Operação (CMO), estudos de despacho hidrotérmico,
    análise de risco hidrológico e suporte a decisões de contratação de energia no mercado de curto prazo
    (PLD/CCEE).
  limitations: A coluna ear_data está tipada como VARCHAR no schema físico Parquet do dataset ear-diario-por-ree-reservatorio-equivalente-de-energia,
