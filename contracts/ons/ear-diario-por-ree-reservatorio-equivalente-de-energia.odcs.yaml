- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver nível de armazenamento de reservatórios, energia
    armazenada diária, percentual de capacidade dos REEs, condições hidrológicas do SIN ou análise de
    risco hídrico em granularidade diária. Também relevante para perguntas sobre correlação entre armazenamento
    e CMO/PLD ou balanço hídrico por bacia hidrográfica.
- property: agentInstructions
  value: '- [ear_data] Coluna ear_data está armazenada como VARCHAR no schema físico (Parquet S3), embora
    represente datas diárias no formato YYYY-MM-DD. Operações de filtragem temporal, ordenação e extração
    de componentes de data requerem conversão explícita via TRY_CAST para DATE. Comparações diretas como
    strings podem produzir resultados incorretos para datas fora do formato ISO 8601.


    - [ear_verif_ree_mwmes] ear_verif_ree_mwmes apresenta valores negativos (mín=-31.0 MWmês), o que fisicamente
    representaria energia armazenada abaixo de zero — situação impossível em condições normais. Esses
    valores podem indicar ajustes de consistência retroativa pelo ONS, déficits contábeis entre subsistemas
    à jusante/montante, ou erros de medição. Devem ser tratados com cautela em cálculos de média e percentis.


    - [ear_verif_ree_percentual] ear_verif_ree_percentual apresenta valores negativos (mín=-10.69%), consistente
    com os valores negativos em ear_verif_ree_mwmes. Percentuais negativos indicam situações de déficit
    contábil ou ajustes de consistência. Filtros de validação devem considerar o intervalo esperado de
    0% a 100%, tratando valores fora desse range como casos especiais.


    - [ear_max_ree] ear_max_ree apresenta valor mínimo de 0.0, indicando REEs com capacidade máxima de
    armazenamento nula em determinados períodos. Isso pode representar REEs sem reservatórios de regularização
    (fio d''água), inconsistências de cadastro ou períodos de transição operacional. Divisões por ear_max_ree
    para cálculo de percentual devem proteger contra divisão por zero.


    - [nom_ree] A chave primária natural é composta por (nom_ree, ear_data). Duplicatas nessa combinação
    indicariam inconsistência no processo de publicação ou sobreposição de arquivos Parquet particionados.
    Espera-se no maximo um registro por (nom_ree, ear_data); qualquer contagem superior deve ser investigada
    como duplicata.

    '
