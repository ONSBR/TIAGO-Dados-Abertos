          - time_series
          metrics:
          - ear_verif_ree_percentual
          grain: day
        validated_params:
          nom_ree: BELO MONTE
          data_inicio: '2026-01-01'
          data_fim: '2026-07-18'
      ear_abaixo_threshold:
        template: "SELECT nom_ree,\n  TRY_CAST(ear_data AS DATE) AS data,\n  TRY_CAST(ear_verif_ree_percentual\
          \ AS DOUBLE) AS ear_percentual\nFROM {source}\nWHERE TRY_CAST(ear_data AS DATE) >= CURRENT_DATE\
          \ - INTERVAL '7 days'\n  AND TRY_CAST(ear_verif_ree_percentual AS DOUBLE) < 50\nORDER BY ear_percentual\
          \ ASC"
        output_unit: '%'
        matches:
          output_modes:
          - ranking
          - comparison
          metrics:
          - ear_verif_ree_percentual
          grain: day
      ear_percentual_calculado_auditoria:
        template: "SELECT TRY_CAST(ear_data AS DATE) AS data,\n  nom_ree,\n  TRY_CAST(ear_verif_ree_percentual\
          \ AS DOUBLE) AS percentual_publicado,\n  TRY_CAST(ear_verif_ree_mwmes AS DOUBLE) / NULLIF(TRY_CAST(ear_max_ree\
          \ AS DOUBLE), 0) * 100 AS percentual_calculado\nFROM {source}\nWHERE TRY_CAST(ear_data AS DATE)\
          \ >= CURRENT_DATE - INTERVAL '30 days'\nORDER BY data DESC"
        output_unit: '%'
        matches:
          output_modes:
          - comparison
          metrics:
          - ear_percentual_calculado
          - ear_verif_ree_percentual
          grain: day
- property: fewShotQueries
  value:
  - question: Como evoluiu o percentual de armazenamento de cada REE ao longo de 2024?
    sql: SELECT nom_ree, TRY_CAST(ear_data AS DATE) AS ear_data_date, ear_verif_ree_percentual FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ear_ree_di/*.parquet')
      WHERE TRY_CAST(ear_data AS DATE) >= DATE '2024-01-01' AND TRY_CAST(ear_data AS DATE) <= DATE '2024-12-31'
      AND ear_verif_ree_percentual >= 0 ORDER BY nom_ree, ear_data_date LIMIT 2000
  - question: Quais foram os 10 dias com menor percentual de armazenamento em cada REE desde 2016?
    sql: WITH ranked AS ( SELECT nom_ree, TRY_CAST(ear_data AS DATE) AS ear_data_date, ear_verif_ree_mwmes,
      ear_verif_ree_percentual, ROW_NUMBER() OVER ( PARTITION BY nom_ree ORDER BY ear_verif_ree_percentual
      ASC ) AS rn FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ear_ree_di/*.parquet') WHERE ear_verif_ree_percentual
      >= 0 ) SELECT nom_ree, ear_data_date, ear_verif_ree_mwmes, ear_verif_ree_percentual FROM ranked
      WHERE rn <= 10 ORDER BY nom_ree, ear_verif_ree_percentual ASC
  - question: Qual é a média mensal de armazenamento em MWmês por REE para identificar padrões sazonais?
    sql: SELECT nom_ree, DATE_TRUNC('month', TRY_CAST(ear_data AS DATE)) AS mes_referencia, ROUND(AVG(TRY_CAST(ear_verif_ree_mwmes AS DOUBLE)),
      2) AS ear_media_mwmes, ROUND(AVG(ear_verif_ree_percentual), 2) AS ear_media_percentual, ROUND(MIN(ear_verif_ree_percentual),
      2) AS ear_min_percentual, ROUND(MAX(ear_verif_ree_percentual), 2) AS ear_max_percentual FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ear_ree_di/*.parquet')
      WHERE TRY_CAST(ear_data AS DATE) IS NOT NULL AND ear_verif_ree_mwmes >= 0 GROUP BY nom_ree, DATE_TRUNC('month',
      TRY_CAST(ear_data AS DATE)) ORDER BY nom_ree, mes_referencia
