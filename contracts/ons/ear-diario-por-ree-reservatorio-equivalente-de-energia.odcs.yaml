    apresenta valor mínimo de -10.
  usage: Recuperar este dataset quando a pergunta envolver nível de armazenamento de reservatórios, energia
    armazenada diária, percentual de capacidade dos REEs, condições hidrológicas do SIN ou análise de
    risco hídrico em granularidade diária.
