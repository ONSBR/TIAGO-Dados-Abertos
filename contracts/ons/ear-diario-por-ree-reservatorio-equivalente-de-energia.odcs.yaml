          FROM {source}\nWHERE nom_ree = '{nom_ree}'\n  AND TRY_CAST(ear_data AS DATE) BETWEEN '{data_inicio}'\
          \ AND '{data_fim}'\nORDER BY 1\n"
        output_unit: '%'
        matches:
