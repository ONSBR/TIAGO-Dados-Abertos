version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:uge_opera_csi
name: uge_opera_csi
tenant: ons
tags:
- CSI
- ONS
- SIN
- UG compensador síncrono
- compensador síncrono
- compensador-síncrono
- controle-de-tensão
- geração
- inércia-sintética
- operação síncrona
- operação-síncrona
- snapshot-operacional
- suporte-de-reativo
- uge_opera_csi
- unidade-geradora
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/uge_opera_csi/*.parquet
  format: parquet
description:
  purpose: Permitir que operadores do sistema elétrico e analistas de confiabilidade monitorem quais unidades
    geradoras estão operando no modo compensador síncrono em um dado momento, suportando decisões operacionais
    relacionadas ao controle de tensão, estabilidade do sistema e disponibilidade de suporte de reativo
    no SIN. Utilizado por equipes de operação em tempo real do ONS e por analistas de planejamento da
    operação para avaliar a capacidade de suporte de reativo disponível por usina e subsistema.
  limitations: Coluna possui 100% de valores nulos em todos os 63. Coluna possui aproximadamente 66. Nome
    da coluna possui inicial maiúscula ('Hora_verificada') divergindo do padrão snake_case minúsculo das
    demais colunas do dataset.
  usage: Recuperar este dataset quando a pergunta envolver monitoramento de unidades geradoras operando
    em modo compensador síncrono, suporte de reativo, inércia sintética ou controle de tensão no SIN.
domain: geração
schema:
- name: uge_opera_csi
  physicalType: parquet
  logicalType: object
  physicalName: uge_opera_csi
  properties:
  - name: dat_verificada
    physicalType: VARCHAR
    logicalType: string
    description: 'Data em que o estado da unidade geradora foi verificado/registrado, armazenada como
      texto. Formato esperado DD/MM/YYYY ou YYYY-MM-DD. Requer TRY_CAST ou TRY_STRPTIME para conversão
      em pipelines analíticos.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - data de verificação
      - data do snapshot
      - data de referência
    - property: semanticType
      value: TIMESTAMP
  - name: Hora_verificada
    physicalType: VARCHAR
    logicalType: string
    description: 'Hora em que o estado da unidade geradora foi verificado/registrado, armazenada como
      texto (formato esperado HH:MM ou HH:MM:SS). Atenção ao nome com inicial maiúscula — pode causar
      erros em queries case-sensitive e pipelines que assumem normalização de nomes.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - hora de verificação
      - hora do snapshot
      - hora_verificada
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - '12:00'
      - '19:00'
  - name: tip_usina
    physicalType: VARCHAR
    logicalType: string
    description: 'Tipo da usina geradora (ex: UHE para hidrelétrica, UTE para termelétrica, EOL para eólica,
      UFV para solar fotovoltaica). Classifica a tecnologia de geração da usina.

      '
    customProperties:
    - property: aliases
      value:
      - tipo de usina
      - tipo usina
      - categoria da usina
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - MP
  - name: nom_usina
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome da usina geradora à qual a unidade geradora pertence, conforme cadastro ONS.

      '
    customProperties:
    - property: aliases
      value:
