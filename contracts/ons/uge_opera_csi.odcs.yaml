    sql_patterns:
      temporal_filter:
        template: "SELECT nom_usina, din_instante, val_geracao\nFROM {source}\nWHERE TRY_CAST(din_instante\
          \ AS DATE) >= '{data_inicio}'\n  AND TRY_CAST(din_instante AS DATE) <= '{data_fim}'\nORDER BY\
          \ din_instante"
- property: fewShotQueries
  value:
  - question: Quais usinas tiveram mais dias com unidades geradoras operando como compensador síncrono
      em 2024?
    sql: SELECT nom_usina, tip_usina, COUNT(DISTINCT TRY_CAST(dat_verificada AS DATE)) AS dias_com_csi,
      COUNT(DISTINCT cod_ugedpp) AS ugs_distintas FROM read_parquet('s3://ons-aws-prod-opendata/dataset/uge_opera_csi/*.parquet')
      WHERE TRY_CAST(dat_verificada AS DATE) >= DATE '2024-01-01' AND TRY_CAST(dat_verificada AS DATE)
      <= DATE '2024-12-31' AND COALESCE(flg_sincrono, 0) = 1 GROUP BY nom_usina, tip_usina ORDER BY dias_com_csi
      DESC LIMIT 20;
  - question: Qual foi a evolução mensal do número de unidades geradoras operando como compensador síncrono
      entre 2021 e 2025?
    sql: SELECT DATE_TRUNC('month', TRY_CAST(dat_verificada AS DATE)) AS mes_referencia, COUNT(DISTINCT
      cod_ugedpp) AS ugs_em_csi, COUNT(DISTINCT nom_usina) AS usinas_com_csi, COUNT(*) AS registros_totais
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/uge_opera_csi/*.parquet') WHERE TRY_CAST(dat_verificada
      AS DATE) IS NOT NULL AND COALESCE(flg_sincrono, 0) = 1 AND "Hora_verificada" = '12:00' GROUP BY
      DATE_TRUNC('month', TRY_CAST(dat_verificada AS DATE)) ORDER BY mes_referencia;
  - question: Quais tipos de usina (UHE, UTE, EOL) mais contribuem com compensadores síncronos no SIN?
    sql: SELECT tip_usina, COUNT(DISTINCT nom_usina) AS usinas_distintas, COUNT(DISTINCT cod_ugedpp) AS
      ugs_distintas, COUNT(DISTINCT TRY_CAST(dat_verificada AS DATE)) AS dias_com_registro, COUNT(*) AS
      total_registros FROM read_parquet('s3://ons-aws-prod-opendata/dataset/uge_opera_csi/*.parquet')
      WHERE TRY_CAST(dat_verificada AS DATE) IS NOT NULL GROUP BY tip_usina ORDER BY total_registros DESC;
