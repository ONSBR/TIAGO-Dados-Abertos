  quality:
  - type: custom
    engine: soda
    implementation: "checks for uge_opera_csi:\n  - row_count > 0:\n      name: Tabela não pode estar\
      \ vazia\n\n  # Referential integrity\n  - invalid_count(Hora_verificada) = 0:\n      valid values:\n\
      \        - '12:00'\n        - '19:00'\n      name: Hora_verificada deve ser um dos valores válidos\n\
      \  - invalid_count(tip_usina) = 0:\n      valid values:\n        - 'MP'\n      name: tip_usina deve\
      \ ser um dos valores válidos\n  - invalid_count(nom_usina) = 0:\n      valid values:\n        -\
      \ 'BELO MONTE'\n        - 'BENTO MUNHOZ'\n        - 'CANA BRAVA'\n        - 'EMBORCACAO'\n     \
      \   - 'FURNAS'\n        - 'G.JOSE RICHA'\n        - 'GUILMA AMORIM'\n        - 'H.BORDEN EXT'\n\
      \        - 'H.BORDEN SUB'\n        - 'ILHA POMBOS'\n        - 'ILHA SOLTEIRA'\n        - 'IRAPE-US'\n\
      \        - 'ITAUBA'\n        - 'ITUMBIARA'\n        - 'ITUTINGA-US'\n        - 'L.C.BARRETO'\n \
      \       - 'NEY BRAGA'\n        - 'NOVA PONTE'\n        - 'P. AFONSO IV'\n        - 'PORTO ESTRELA'\n\
      \        - 'SALTO GRANDE'\n        - 'SALTO GRANDE MG'\n        - 'SAO SIMAO-US'\n        - 'THEO\
      \ C SANTIAGO'\n        - 'U.BARRAGRANDE'\n        - 'U.C NOVOS'\n        - 'U.D.FRANCISCA'\n   \
      \     - 'U.FOZ CHAPECO'\n        - 'U.ITA'\n        - 'U.MACHADINHO'\n        - 'U.PASSO FUNDO'\n\
      \        - 'U.S.OSORIO'\n        - 'U.S.SANTIAGO'\n        - 'U.SOBRADINHO'\n        - 'UB.ESPERANCA'\n\
      \        - 'UHE S.DA MESA'\n        - 'US. TUCURUI'\n        - 'USI PAR.SOUZA'\n        - 'USINA\
      \ XINGO'\n        - 'VOLTA GRANDE'\n      name: nom_usina deve ser um dos valores válidos\n  - invalid_count(cod_usinadpp)\
      \ = 0:\n      valid values:\n        - '103'\n        - '11'\n        - '113'\n        - '114'\n\
      \        - '115'\n        - '119'\n        - '130'\n        - '134'\n        - '135'\n        -\
      \ '148'\n        - '169'\n        - '175'\n        - '178'\n        - '190'\n        - '192'\n \
      \       - '2'\n        - '24'\n        - '25'\n        - '251'\n        - '252'\n        - '275'\n\
      \        - '288'\n        - '31'\n        - '33'\n        - '34'\n        - '6'\n        - '74'\n\
      \        - '76'\n        - '77'\n        - '78'\n        - '8'\n        - '82'\n        - '86'\n\
      \        - '90'\n        - '91'\n        - '92'\n        - '93'\n      name: cod_usinadpp deve ser\
      \ um dos valores válidos\n\n  # Baseline de volume — margem ±20% do row_count validado\n  - row_count\
      \ between 54743 and 82114:\n      name: Volume esperado entre 54,743 e 82,114 registros\n\n  # Unicidade\
      \ da chave primária composta ['dat_verificada', 'Hora_verificada', 'cod_ugedpp', 'cod_pontomedicao']\
      \ (candidata LLM)\n  - failed rows:\n      name: Chave composta (dat_verificada, Hora_verificada,\
      \ cod_ugedpp, cod_pontomedicao) não deve ter duplicatas\n      fail query: |\n        SELECT * FROM\
      \ uge_opera_csi\n        WHERE (dat_verificada, Hora_verificada, cod_ugedpp, cod_pontomedicao) IN\
      \ (\n          SELECT dat_verificada, Hora_verificada, cod_ugedpp, cod_pontomedicao FROM uge_opera_csi\n\
      \          GROUP BY dat_verificada, Hora_verificada, cod_ugedpp, cod_pontomedicao\n          HAVING\
      \ COUNT(*) > 1\n        )\n\n  # Nulos em dsc_comentario — alerta de qualidade (real=100.0%, threshold=200.0%)\n\
      \  - missing_percent(dsc_comentario) < 200.0:\n      name: dsc_comentario não deve ter >200.0% nulos\n\
      \n  # Nulos em flg_sincrono — alerta de qualidade (real=62.2%, threshold=124.4%)\n  - missing_percent(flg_sincrono)\
      \ < 124.4:\n      name: flg_sincrono não deve ter >124.4% nulos\n"
team:
