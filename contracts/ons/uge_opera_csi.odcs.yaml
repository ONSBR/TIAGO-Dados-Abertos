      - '19:00'
  - name: tip_usina
    physicalType: VARCHAR
    logicalType: string
    description: 'Tipo da usina geradora (ex: UHE para hidrelétrica, UTE para termelétrica, EOL para eólica,
      UFV para solar fotovoltaica). Classifica a tecnologia de geração da usina.

