slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/uge_opera_csi
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - usina operando como compensador sincrono
  - maquina em modo compensador
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver monitoramento de unidades geradoras operando
    em modo compensador síncrono, suporte de reativo, inércia sintética ou controle de tensão no SIN.
    Também relevante para perguntas sobre disponibilidade de compensação reativa por usina, tipo de usina
    ou ponto de medição em uma data específica.
- property: agentInstructions
  value: '- [dsc_comentario] Campo com 100% de valores nulos em todo o período 2021-2026 (68.429 linhas).
    Coluna completamente vazia, sem utilidade analítica. Candidata a remoção em versões futuras do dataset.


    - [flg_sincrono] Flag com 62.2% de nulos (aproximadamente 42.563 linhas). Evidência de migração de
    campo: flg_sincrono foi substituído por flg_operasincrono ao longo do tempo. As duas colunas são mutuamente
    exclusivas por período. Usar COALESCE para consolidar em análises que exijam série contínua.


    - [dat_verificada] Coluna armazenada como VARCHAR no Parquet em vez de DATE. Requer TRY_CAST para
    operações de filtro temporal, agrupamento por período e cálculo de intervalos. Possível formato de
    serialização .


    - [Hora_verificada] Nome da coluna com inicial maiúscula (Hora_verificada) diverge do padrão snake_case
    minúsculo adotado pelo ONS nas demais colunas. Pode causar erros de referência em queries case-sensitive.
    Verificar se os únicos valores são "12:00" e "19:00" conforme frequência declarada.


    - [cod_ugedpp] Verificar se a combinação (dat_verificada, cod_ugedpp, Hora_verificada) é de fato única.
    Duplicatas podem ocorrer se o mesmo snapshot for ingerido mais de uma vez ou se houver registros duplicados
    por falha no pipeline de carga.


    - [cod_pontomedicao] Verificar consistência entre cod_pontomedicao e cod_ugedpp — um mesmo ponto de
    medição pode estar associado a múltiplas unidades geradoras ou vice-versa, o que pode indicar erro
    de cadastro.


    - [tip_usina] Verificar consistência dos valores de tip_usina — possíveis variações de grafia (maiúsculas/minúsculas,
    abreviações diferentes) para o mesmo tipo de usina podem comprometer filtros e agrupamentos por tecnologia.


    - [Hora_verificada] Coluna ''Hora_verificada'' ausente em arquivos históricos (ex: UGE_OPERA_CSI_2021.parquet).
    Presente apenas a partir de versões recentes (ex: UGE_OPERA_CSI_2026.parquet). Queries históricas
    retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.

    - [flg_sincrono] Coluna ''flg_sincrono'' ausente em arquivos históricos (ex: UGE_OPERA_CSI_2021.parquet).
    Presente apenas a partir de versões recentes (ex: UGE_OPERA_CSI_2026.parquet). Queries históricas
    retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.

    - [flg_operasincrono] Coluna ''flg_operasincrono'' presente em arquivos históricos (ex: UGE_OPERA_CSI_2021.parquet)
    mas ausente em versões recentes (ex: UGE_OPERA_CSI_2026.parquet). Queries sobre dados recentes não
    encontrarão esta coluna.

    - [hora_verificada] Coluna ''hora_verificada'' presente em arquivos históricos (ex: UGE_OPERA_CSI_2021.parquet)
    mas ausente em versões recentes (ex: UGE_OPERA_CSI_2026.parquet). Queries sobre dados recentes não
    encontrarão esta coluna.'
- property: typicalQuestions
  value:
  - Quais usinas têm unidades geradoras operando como compensador síncrono hoje?
  - Quantas unidades geradoras estão em modo compensador síncrono por tipo de usina?
  - Qual a distribuição de compensadores síncronos ativos por usina hidrelétrica?
  - Houve mudança no número de compensadores síncronos entre o snapshot das 12h e das 19h?
  - Quais unidades geradoras da usina ITAIPU estão operando como compensador síncrono?
- property: granularity
  value: anual
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/uge_opera_csi/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2021-01-01'
- property: semantics
  value:
    temporal_perspective: verificado
    row_grain:
      temporal: 1 ano
      temporal_column: dat_verificada
      spatial: usina
      entity: usina
      one_row_per:
      - dat_verificada
      - Hora_verificada
      - cod_ugedpp
      - cod_pontomedicao
    dimension_columns:
      subsistema: null
      fonte: null
      usina: nom_usina
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics: []
    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: true
      supports_ranking: true
      primary_use_case: serie_temporal
    selection_policy:
      covers_metrics: []
      preferred_for:
      - compensador sincrono
      - modo CSI
      - operacao CSI
      - suporte de reativo por UG
      - UG operando como CSI
      - flag sincrono UG
      - ponto de medicao CSI
      - inertia sintetica UG
      - snapshot CSI 12h 19h
      - UGE opera CSI
      not_preferred_for:
      - nuclear
      - MMGD
      - geracao ativa MWmed
      - carga subsistema
      - preco energia
      - restricao eolica
      - balanco energetico
      - despacho programado
      - indisponibilidade forçada
      - TEIFa
      - TEIP
    value_aliases:
      Hora_verificada:
        '12:00':
          aliases:
          - '12:00'
          - meia-dia
          - meio-dia
          - snapshot 12h
          filter: '"Hora_verificada" = ''12:00'''
        '19:00':
          aliases:
          - '19:00'
          - 19h
          - snapshot 19h
          filter: '"Hora_verificada" = ''19:00'''
      tip_usina:
        MP:
          aliases:
          - MP
          filter: tip_usina = 'MP'
      flg_sincrono:
        '1':
          aliases:
          - sincrono ativo
          - operando sincrono
          - CSI ativo
          - '1'
          filter: COALESCE(flg_sincrono, flg_operasincrono) = 1
        '0':
          aliases:
          - nao sincrono
          - CSI inativo
          - '0'
          filter: COALESCE(flg_sincrono, flg_operasincrono) = 0
      cod_ugedpp:
        '1001':
          aliases:
          - '1001'
          filter: cod_ugedpp = 1001
        '1002':
          aliases:
          - '1002'
          filter: cod_ugedpp = 1002
        '1003':
          aliases:
          - '1003'
          filter: cod_ugedpp = 1003
        '1004':
          aliases:
          - '1004'
          filter: cod_ugedpp = 1004
