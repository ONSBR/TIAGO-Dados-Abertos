servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/uge_opera_csi/*.parquet
  format: parquet
description:
  purpose: Permitir que operadores do sistema elétrico e analistas de confiabilidade monitorem quais unidades
    geradoras estão operando no modo compensador síncrono em um dado momento, suportando decisões operacionais
    relacionadas ao controle de tensão, estabilidade do sistema e disponibilidade de suporte de reativo
    no SIN. Utilizado por equipes de operação em tempo real do ONS e por analistas de planejamento da
    operação para avaliar a capacidade de suporte de reativo disponível por usina e subsistema.
  limitations: dsc_comentario possui nulos em todas as linhas e nao serve para analise. flg_sincrono possui nulos na maior parte das linhas. Nome
    da coluna possui inicial maiúscula ('Hora_verificada') divergindo do padrão snake_case minúsculo das
    demais colunas do dataset.
  usage: Recuperar este dataset quando a pergunta envolver monitoramento de unidades geradoras operando
    em modo compensador síncrono, suporte de reativo, inércia sintética ou controle de tensão no SIN.
domain: geração
schema:
- name: uge_opera_csi
  physicalType: parquet
  logicalType: object
  physicalName: uge_opera_csi
  properties:
  - name: dat_verificada
    physicalType: VARCHAR
    logicalType: string
    description: 'Data em que o estado da unidade geradora foi verificado/registrado, armazenada como
      texto. Formato esperado DD/MM/YYYY ou YYYY-MM-DD. Requer TRY_CAST ou TRY_STRPTIME para conversão
      em pipelines analíticos.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - data de verificação
      - data do snapshot
      - data de referência
    - property: semanticType
      value: TIMESTAMP
  - name: Hora_verificada
    physicalType: VARCHAR
    logicalType: string
    description: 'Hora em que o estado da unidade geradora foi verificado/registrado, armazenada como
      texto (formato esperado HH:MM ou HH:MM:SS). Atenção ao nome com inicial maiúscula — pode causar
      erros em queries case-sensitive e pipelines que assumem normalização de nomes.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - hora de verificação
      - hora do snapshot
      - hora_verificada
    - property: semanticType
      value: DIMENSION
    - property: enum
