    sql_patterns:
      temporal_filter:
        template: "SELECT nom_usina, din_instante, val_geracao\nFROM {source}\nWHERE TRY_CAST(din_instante\
          \ AS DATE) >= '{data_inicio}'\n  AND TRY_CAST(din_instante AS DATE) <= '{data_fim}'\nORDER BY\
          \ din_instante"
    ambiguity_policy:
      default_assumptions:
      - when: compensadores sincronos ativos
        assume_filter: COALESCE(flg_sincrono, flg_operasincrono) = 1
        note: Usar COALESCE para consolidar flg_sincrono (recente) e flg_operasincrono (historico)
      - when: snapshot mais recente
        assume_filter: '"Hora_verificada" = ''19:00'''
        note: Snapshot das 19h e o mais recente do dia; usar 12h apenas se explicitamente solicitado
      - when: quantas UGs em modo CSI
        assume_output: COUNT(*) agrupado por nom_usina ou dat_verificada conforme contexto
        note: Dataset nao tem metrica numerica de potencia; contagem de registros e a agregacao natural
      must_clarify_when:
      - ambiguity: snapshot_hora
        question: Voce quer o snapshot das 12h ou das 19h?
        trigger_terms:
        - hoje
        - agora
        - ultimo snapshot
        - mais recente
        note: Perguntar apenas quando o usuario nao especificar a hora e a comparacao entre snapshots
          for relevante para a analise
      - ambiguity: periodo_historico_vs_recente
        question: Voce quer dados historicos (2021-2024, coluna flg_operasincrono) ou recentes (2025-2026,
          coluna flg_sincrono)? Para serie completa, usar COALESCE das duas colunas.
        trigger_terms:
        - serie historica
        - evolucao temporal
        - todos os anos
        - desde 2021
        note: Alertar sobre a migracao de coluna apenas quando o usuario pedir serie temporal longa
      redirect_when:
      - user_mentions:
        - nuclear
        - angra
        reason: Dataset nao contem dimensao nuclear; cobre apenas UGs em modo CSI.
        redirect: geracao-usina-2 com filtro de combustivel nuclear
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Dataset nao contem coluna MMGD.
        redirect: dataset com coluna val_germmgd quando disponivel
      - user_mentions:
        - MWmed
        - MWh
        - GWh
        - potencia gerada
        - energia gerada
        reason: Dataset registra modo operacional (flag CSI), nao potencia ou energia gerada.
        redirect: geracao-usina-2 para series de geracao ativa por usina
      - user_mentions:
        - PLD
        - CMO
        - preco spot
        - R$/MWh
        reason: Dataset nao contem colunas de preco.
        redirect: dataset de preco spot ou PLD quando disponivel
- property: fewShotQueries
  value:
  - question: Quais usinas tiveram mais dias com unidades geradoras operando como compensador síncrono
      em 2024?
    sql: SELECT nom_usina, tip_usina, COUNT(DISTINCT TRY_CAST(dat_verificada AS DATE)) AS dias_com_csi,
      COUNT(DISTINCT cod_ugedpp) AS ugs_distintas FROM read_parquet('s3://ons-aws-prod-opendata/dataset/uge_opera_csi/*.parquet')
      WHERE TRY_CAST(dat_verificada AS DATE) >= DATE '2024-01-01' AND TRY_CAST(dat_verificada AS DATE)
      <= DATE '2024-12-31' AND COALESCE(flg_sincrono, 0) = 1 GROUP BY nom_usina, tip_usina ORDER BY dias_com_csi
      DESC LIMIT 20;
  - question: Qual foi a evolução mensal do número de unidades geradoras operando como compensador síncrono
      entre 2021 e 2025?
    sql: SELECT DATE_TRUNC('month', TRY_CAST(dat_verificada AS DATE)) AS mes_referencia, COUNT(DISTINCT
      cod_ugedpp) AS ugs_em_csi, COUNT(DISTINCT nom_usina) AS usinas_com_csi, COUNT(*) AS registros_totais
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/uge_opera_csi/*.parquet') WHERE TRY_CAST(dat_verificada
      AS DATE) IS NOT NULL AND COALESCE(flg_sincrono, 0) = 1 AND "Hora_verificada" = '12:00' GROUP BY
      DATE_TRUNC('month', TRY_CAST(dat_verificada AS DATE)) ORDER BY mes_referencia;
  - question: Quais tipos de usina (UHE, UTE, EOL) mais contribuem com compensadores síncronos no SIN?
    sql: SELECT tip_usina, COUNT(DISTINCT nom_usina) AS usinas_distintas, COUNT(DISTINCT cod_ugedpp) AS
      ugs_distintas, COUNT(DISTINCT TRY_CAST(dat_verificada AS DATE)) AS dias_com_registro, COUNT(*) AS
      total_registros FROM read_parquet('s3://ons-aws-prod-opendata/dataset/uge_opera_csi/*.parquet')
      WHERE TRY_CAST(dat_verificada AS DATE) IS NOT NULL GROUP BY tip_usina ORDER BY total_registros DESC;
