  - name: val_vazaotransferida
    physicalType: DOUBLE
    logicalType: number
    description: 'Vazão transferida entre reservatórios ou bacias hidrográficas (transposição de bacias).
      Alto percentual de nulos (~60,9%) indica que a maioria dos reservatórios não realiza transferências.
      Valores negativos (mín = -371,0 m³/s) indicam transferência no sentido inverso.

      '
    customProperties:
    - property: aliases
      value:
      - vazão transferida
