  quality:
  - type: custom
    engine: soda
    implementation: "checks for dados_hidrologicos_ho:\n  - row_count > 0:\n      name: Tabela não pode\
      \ estar vazia\n\n  # Referential integrity\n  - invalid_count(id_subsistema) = 0:\n      valid values:\n\
      \        - 'N'\n        - 'NE'\n        - 'S'\n        - 'SE'\n      name: id_subsistema deve ser\
      \ um dos valores válidos\n  - invalid_count(nom_subsistema) = 0:\n      valid values:\n        -\
      \ 'Nordeste'\n        - 'Norte'\n        - 'Sudeste/Centro-Oeste'\n        - 'Sul'\n      name:\
      \ nom_subsistema deve ser um dos valores válidos\n  - invalid_count(tip_reservatorio) = 0:\n   \
      \   valid values:\n        - 'Fio dagua'\n        - 'Reservatório Com Usina de Bombeamento'\n  \
      \      - 'Reservatório com Usina'\n        - 'Reservatório sem usina'\n      name: tip_reservatorio\
      \ deve ser um dos valores válidos\n  - invalid_count(nom_bacia) = 0:\n      valid values:\n    \
      \    - 'AMAZONAS'\n        - 'ARAGUARI'\n        - 'CAPIVARI'\n        - 'DOCE'\n        - 'GRANDE'\n\
      \        - 'IGUACU'\n        - 'ITABAPOANA'\n        - 'ITAJAI'\n        - 'JACUI'\n        - 'JEQUITINHONHA'\n\
      \        - 'MUCURI'\n        - 'PARAGUACU'\n        - 'PARAGUAI'\n        - 'PARAIBA DO SUL'\n \
      \       - 'PARANA'\n        - 'PARANAIBA'\n        - 'PARANAPANEMA'\n        - 'PARNAIBA'\n    \
      \    - 'SANTA MARIA VIT'\n        - 'SAO FRANCISCO'\n        - 'TIETE'\n        - 'TOCANTINS'\n\
      \        - 'URUGUAI'\n      name: nom_bacia deve ser um dos valores válidos\n\n  # Baseline de volume\
      \ — margem ±20% do row_count validado\n  - row_count between 105859 and 158788:\n      name: Volume\
      \ esperado entre 105,859 e 158,788 registros\n\n  # Unicidade da chave primária composta ['id_reservatorio',\
      \ 'din_instante'] (candidata LLM)\n  - failed rows:\n      name: Chave composta (id_reservatorio,\
      \ din_instante) não deve ter duplicatas\n      fail query: |\n        SELECT * FROM dados_hidrologicos_ho\n\
      \        WHERE (id_reservatorio, din_instante) IN (\n          SELECT id_reservatorio, din_instante\
      \ FROM dados_hidrologicos_ho\n          GROUP BY id_reservatorio, din_instante\n          HAVING\
      \ COUNT(*) > 1\n        )\n\n  # Nulos em val_niveljusante — alerta de qualidade (real=10.0%, threshold=20.0%)\n\
      \  - missing_percent(val_niveljusante) < 20.0:\n      name: val_niveljusante não deve ter >20.0%\
      \ nulos\n\n  # Nulos em val_vazaooutrasestruturas — alerta de qualidade (real=70.9%, threshold=141.8%)\n\
      \  - missing_percent(val_vazaooutrasestruturas) < 141.8:\n      name: val_vazaooutrasestruturas\
      \ não deve ter >141.8% nulos\n\n  # Nulos em val_vazaovertidanaoturbinavel — alerta de qualidade\
      \ (real=64.6%, threshold=129.2%)\n  - missing_percent(val_vazaovertidanaoturbinavel) < 129.2:\n\
      \      name: val_vazaovertidanaoturbinavel não deve ter >129.2% nulos\n\n  # Nulos em cod_usina\
      \ — alerta de qualidade (real=1.0%, threshold=6.0%)\n  - missing_percent(cod_usina) < 6.0:\n   \
      \   name: cod_usina não deve ter >6.0% nulos\n\n  # Range físico de val_nivelmontante — baseado\
      \ em dados reais (min=0.0, max=912.97)\n  - failed rows:\n      name: val_nivelmontante fora do\
      \ intervalo histórico observado\n      fail condition: val_nivelmontante IS NOT NULL AND (val_nivelmontante\
      \ < 0.0 OR val_nivelmontante > 1095.564)\n\n  # Range físico de val_niveljusante — baseado em dados\
      \ reais (min=0.0, max=957.94)\n  - failed rows:\n      name: val_niveljusante fora do intervalo\
      \ histórico observado\n      fail condition: val_niveljusante IS NOT NULL AND (val_niveljusante\
      \ < 0.0 OR val_niveljusante > 1149.528)\n\n  # Range físico de val_volumeutil — baseado em dados\
      \ reais (min=-199.71, max=820.88)\n  - failed rows:\n      name: val_volumeutil fora do intervalo\
      \ histórico observado\n      fail condition: val_volumeutil IS NOT NULL AND (val_volumeutil < -239.652\
      \ OR val_volumeutil > 985.056)\n\n  # Range físico de val_vazaoafluente — baseado em dados reais\
      \ (min=-312167.0, max=840452.0)\n  - failed rows:\n      name: val_vazaoafluente fora do intervalo\
      \ histórico observado\n      fail condition: val_vazaoafluente IS NOT NULL AND (val_vazaoafluente\
      \ < -374600.4 OR val_vazaoafluente > 1008542.4)\n\n  # Range físico de val_vazaodefluente — baseado\
      \ em dados reais (min=-1.0, max=840453.0)\n  - failed rows:\n      name: val_vazaodefluente fora\
      \ do intervalo histórico observado\n      fail condition: val_vazaodefluente IS NOT NULL AND (val_vazaodefluente\
      \ < -1.2 OR val_vazaodefluente > 1008543.6)\n\n  # Range físico de val_vazaoturbinada — baseado\
      \ em dados reais (min=0.0, max=21872.0)\n  - failed rows:\n      name: val_vazaoturbinada fora do\
      \ intervalo histórico observado\n      fail condition: val_vazaoturbinada IS NOT NULL AND (val_vazaoturbinada\
      \ < 0.0 OR val_vazaoturbinada > 26246.4)\n\n  # Range físico de val_vazaovertida — baseado em dados\
      \ reais (min=0.0, max=16129.0)\n  - failed rows:\n      name: val_vazaovertida fora do intervalo\
      \ histórico observado\n      fail condition: val_vazaovertida IS NOT NULL AND (val_vazaovertida\
      \ < 0.0 OR val_vazaovertida > 19354.8)\n\n  # Range físico de val_vazaooutrasestruturas — baseado\
      \ em dados reais (min=0.0, max=610.0)\n  - failed rows:\n      name: val_vazaooutrasestruturas fora\
      \ do intervalo histórico observado\n      fail condition: val_vazaooutrasestruturas IS NOT NULL\
      \ AND (val_vazaooutrasestruturas < 0.0 OR val_vazaooutrasestruturas > 732.0)\n\n  # Range físico\
      \ de val_vazaotransferida — baseado em dados reais (min=-383.0, max=4633.0)\n  - failed rows:\n\
      \      name: val_vazaotransferida fora do intervalo histórico observado\n      fail condition: val_vazaotransferida\
      \ IS NOT NULL AND (val_vazaotransferida < -459.6 OR val_vazaotransferida > 5559.6)\n\n  # Range\
      \ físico de val_vazaovertidanaoturbinavel — baseado em dados reais (min=0.0, max=1506.0)\n  - failed\
      \ rows:\n      name: val_vazaovertidanaoturbinavel fora do intervalo histórico observado\n     \
      \ fail condition: val_vazaovertidanaoturbinavel IS NOT NULL AND (val_vazaovertidanaoturbinavel <\
      \ 0.0 OR val_vazaovertidanaoturbinavel > 1807.2)\n\n  # Freshness: din_instante deve ter dados recentes\
      \ (SLA: Atualizado diariamente)\n  - freshness(din_instante) < 3d:\n      name: din_instante não\
      \ pode ter dados com mais de 3 dias de atraso\n"
team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/dados_hidrologicos_ho
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - nivel do reservatorio hora a hora
  - vazao horaria da usina
  - volume util por hora
  - condicao hidraulica intradiaria
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver condições hidráulicas horárias de reservatórios
    do SIN, incluindo níveis de montante/jusante, volume útil percentual, vazões afluente/defluente/turbinada/vertida
    ou balanço hídrico horário por usina ou bacia. Também relevante para perguntas sobre vertimento, produtibilidade
    específica, eficiência hidráulica horária ou monitoramento em tempo real do estado dos reservatórios
    hidrelétricos brasileiros.
- property: agentInstructions
  value: '- [val_volumeutil] Campo apresenta valores negativos (mín=-199,71%), fisicamente impossível
    para percentual de volume útil. Indica dados brutos inconsistentes reportados pelos agentes de geração,
    não consistidos pelo ONS. Requer filtragem antes de análises quantitativas.


    - [val_vazaoafluente] Valores extremos negativos (mín=-312167,0 m³/s) e máximos muito elevados (840452,0
    m³/s) são fisicamente implausíveis para vazões de reservatórios brasileiros. Dados brutos não validados
    reportados pelos agentes. Valores negativos de vazão afluente não têm significado físico convencional.


    - [val_vazaodefluente] Valor mínimo de -1,0 m³/s para vazão defluente é fisicamente inconsistente
    (vazão não pode ser negativa). Provavelmente arredondamento ou erro de reporte do agente. Filtrar
    valores negativos antes de somar componentes de defluência.


    - [val_vazaotransferida] Valores negativos (mín=-383,0 m³/s) em val_vazaotransferida indicam transferência
    no sentido inverso ao convencionado positivo. Embora possa ser intencional (reversão de fluxo), requer
    atenção em agregações — somar sem tratamento pode subestimar ou superestimar a defluência total.


    - [val_niveljusante] Taxa de nulos de 10% — a mais alta entre as colunas de nível/volume. Pode indicar
    usinas fio d''água sem medição de jusante, falhas de telemetria ou dados não reportados pelos agentes.
    Verificar se a ausência é sistemática por usina ou aleatória.


    - [val_vazaooutrasestruturas] Taxa de nulos de 70,9% — uso esparso esperado, pois a maioria das usinas
    não possui outras estruturas hidráulicas além de turbinas e vertedouros. Não deve ser incluída em
    somas de defluência sem verificar se NULL significa zero ou dado ausente para cada usina.


    - [val_vazaovertidanaoturbinavel] Taxa de nulos de 64,6% — uso esparso, aplicável apenas a usinas
    com medição específica de vertimento não turbinável. Tratar NULL como zero apenas após confirmar que
    a usina reporta este campo; caso contrário, pode mascarar vertimentos reais não registrados.


    - [cod_usina] Apresenta 1% de nulos (aproximadamente 1.323 registros). Como cod_usina é a chave de
    join com o cadastro de usinas, registros sem este código ficam órfãos em joins e não podem ser enriquecidos
    com dados cadastrais. Verificar se id_reservatorio pode suprir o join nesses casos.


    - [din_instante] Possíveis lacunas temporais na série horária por reservatório. Dados não consistidos
    pelo ONS — falhas de telemetria ou não envio pelos agentes podem criar buracos na série temporal que
    afetam análises de continuidade e médias horárias.


    - [id_subsistema] Valores com trailing spaces detectados em ''id_subsistema''. Use TRIM() em filtros
    WHERE para evitar perda de registros.

    - [tip_reservatorio] Valores com trailing spaces detectados em ''tip_reservatorio''. Use TRIM() em
    filtros WHERE para evitar perda de registros.

    - [nom_bacia] Valores com trailing spaces detectados em ''nom_bacia''. Use TRIM() em filtros WHERE
    para evitar perda de registros.'
