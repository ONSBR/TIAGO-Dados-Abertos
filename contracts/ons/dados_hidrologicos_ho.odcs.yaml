version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:dados_hidrologicos_ho
name: dados_hidrologicos_ho
tenant: ons
tags:
- ONS
- SIN
- afluencia
- dados hidrológicos horários
- dados hidráulicos
- hidraulica
- hidrologia
- horario
- nivel
- níveis de reservatório
- reservatorios
- reservatórios ONS
- vazao
- vazão reservatório horário
- vazões horárias
- volume-util
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/dados_hidrologicos_ho/*.parquet
  format: parquet
description:
  purpose: Prover condições hidráulicas horárias dos reservatórios do SIN para operadores do ONS, agentes
    de geração e analistas de planejamento energético, suportando monitoramento em tempo real do estado
    dos reservatórios, despacho hidrotérmico, verificação de conformidade dos dados reportados pelos agentes
    geradores, cálculo de produtibilidade específica e análise de balanço hídrico por bacia hidrográfica.
  limitations: val_volumeutil apresenta valores negativos (mín = -276,75%), fisicamente impossível para
    volume útil percentual. val_vazaoafluente apresenta valores extremos (máx = 840. val_vazaodefluente
    apresenta valores extremos (máx = 840.
  usage: Recuperar este dataset quando a pergunta envolver condições hidráulicas horárias de reservatórios
    do SIN, incluindo níveis de montante/jusante, volume útil percentual, vazões afluente/defluente/turbinada/vertida
    ou balanço hídrico horário por usina ou bacia.
domain: hidrologia
schema:
- name: dados_hidrologicos_ho
  physicalType: parquet
  logicalType: object
  physicalName: dados_hidrologicos_ho
  properties:
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: Identificador do subsistema elétrico ao qual o reservatório pertence (ex. SE, S, NE,
      N)
    customProperties:
    - property: aliases
      value:
      - subsistema
      - sistema
      - região elétrica
      - submercado
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
  - name: nom_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: Nome por extenso do subsistema elétrico (ex. Sudeste/Centro-Oeste, Sul, Nordeste, Norte)
    customProperties:
    - property: aliases
      value:
      - nome subsistema
      - nome do subsistema
      - região
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Nordeste
      - Norte
      - Sudeste/Centro-Oeste
      - Sul
  - name: tip_reservatorio
    physicalType: VARCHAR
    logicalType: string
    description: Tipo do reservatório quanto à sua capacidade de regularização (ex. Reservatório, Fio
      d'Água)
    customProperties:
    - property: aliases
      value:
      - tipo reservatório
      - tipo do reservatório
      - classificação reservatório
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Fio dagua
      - Reservatório Com Usina de Bombeamento
      - Reservatório com Usina
      - Reservatório sem usina
  - name: nom_bacia
    physicalType: VARCHAR
    logicalType: string
    description: Nome da bacia hidrográfica à qual o reservatório pertence (ex. Paraná, São Francisco,
      Tocantins)
    customProperties:
    - property: aliases
      value:
      - bacia
      - bacia hidrográfica
      - bacia hidrológica
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - AMAZONAS
      - ARAGUARI
      - CAPIVARI
      - DOCE
      - GRANDE
      - IGUACU
      - ITABAPOANA
      - ITAJAI
      - JACUI
      - JEQUITINHONHA
      - MUCURI
      - PARAGUACU
      - PARAGUAI
      - PARAIBA DO SUL
      - PARANA
      - PARANAIBA
      - PARANAPANEMA
      - PARNAIBA
      - SANTA MARIA VIT
      - SAO FRANCISCO
      - TIETE
      - TOCANTINS
      - URUGUAI
  - name: id_reservatorio
    physicalType: VARCHAR
    logicalType: string
    description: Código identificador único do reservatório no sistema ONS
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - código reservatório
      - id do reservatório
      - identificador reservatório
    - property: semanticType
      value: IDENTIFIER
  - name: nom_reservatorio
    physicalType: VARCHAR
    logicalType: string
    description: Nome do reservatório/usina hidrelétrica associada
    customProperties:
    - property: aliases
      value:
      - nome reservatório
      - nome da usina
      - usina
      - reservatório
    - property: semanticType
      value: DIMENSION
  - name: cod_usina
    physicalType: DOUBLE
    logicalType: integer
    description: Código numérico da usina hidrelétrica no cadastro ONS; 1,4% de nulos indica registros
      sem usina associada diretamente
    customProperties:
    - property: aliases
      value:
      - código usina
      - código da usina
      - id usina
      - cód usina
    - property: semanticType
      value: IDENTIFIER
  - name: din_instante
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: 'Data e hora de referência do registro hidráulico, com granularidade horária. Convenção
      ONS de hora-fim: o instante 01:00 representa o intervalo 00:00–00:59. Período coberto: 2010-01-01
      a 2026-05-31.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - instante
      - data hora
      - timestamp
      - hora
      - data
      - din_instante
    - property: semanticType
      value: TIMESTAMP
  - name: val_nivelmontante
    physicalType: DOUBLE
    logicalType: number
    description: 'Nível d''água de montante do reservatório (cota), medido na entrada do reservatório.
      Representa a altura da lâmina d''água acima de um datum de referência. Nulos em 0,4% dos registros.

      '
    customProperties:
    - property: aliases
      value:
      - nível montante
      - cota montante
      - nível do reservatório
      - cota do reservatório
    - property: semanticType
      value: METRIC
    - property: unit
      value: m
  - name: val_niveljusante
    physicalType: DOUBLE
    logicalType: number
    description: 'Nível d''água de jusante do reservatório (cota), medido na saída/canal de fuga. Nulos
      em 8,3% dos registros — percentual mais elevado entre os níveis, comum em usinas fio d''água.

      '
    customProperties:
    - property: aliases
      value:
      - nível jusante
      - cota jusante
      - nível canal de fuga
      - cota de jusante
    - property: semanticType
      value: METRIC
    - property: unit
      value: m
  - name: val_volumeutil
    physicalType: DOUBLE
    logicalType: number
    description: 'Volume útil armazenado no reservatório, expresso em percentual do volume útil total
      (%). Valores negativos (mín = -276,75) indicam inconsistências nos dados reportados pelos agentes.
      Nulos em 4,2% dos registros.

      '
    customProperties:
    - property: aliases
      value:
      - volume útil
      - volume armazenado
      - armazenamento
      - nível do reservatório percentual
    - property: semanticType
      value: METRIC
    - property: unit
      value: '%'
  - name: val_vazaoafluente
    physicalType: DOUBLE
    logicalType: number
    description: 'Vazão afluente ao reservatório, representando o total de água que entra no reservatório
      por unidade de tempo. Inclui contribuições naturais e transferências de outras bacias. Valores extremos
      (até 840.452 m³/s) e negativos (mín = -74.007 m³/s) podem indicar erros de reporte ou outliers.
      Nulos em 2,1% dos registros.

      '
    customProperties:
    - property: aliases
      value:
      - vazão afluente
      - afluência
      - vazão de entrada
      - inflow
    - property: semanticType
      value: METRIC
    - property: unit
      value: m³/s
  - name: val_vazaodefluente
    physicalType: DOUBLE
    logicalType: number
    description: 'Vazão defluente total do reservatório, representando o total de água que sai do reservatório
      por unidade de tempo (turbinada + vertida + outras estruturas). Valores extremos (até 840.453 m³/s)
      e valor mínimo negativo (-1,0 m³/s) podem indicar erros de reporte. Nulos em 1,7% dos registros.

      '
    customProperties:
    - property: aliases
      value:
      - vazão defluente
      - defluência
      - vazão de saída
      - outflow
      - vazão total
    - property: semanticType
      value: METRIC
    - property: unit
      value: m³/s
  - name: val_vazaoturbinada
    physicalType: DOUBLE
    logicalType: number
    description: 'Vazão turbinada pelas unidades geradoras da usina hidrelétrica, diretamente relacionada
      à geração de energia elétrica. Mínimo = 0,0 (sem geração). Nulos em 6,1% dos registros.

      '
    customProperties:
    - property: aliases
      value:
      - vazão turbinada
      - turbinamento
      - vazão nas turbinas
      - geração hidráulica vazão
    - property: semanticType
      value: METRIC
    - property: unit
      value: m³/s
  - name: val_vazaovertida
    physicalType: DOUBLE
    logicalType: number
    description: 'Vazão vertida pelo vertedouro do reservatório, representando o excesso de água não turbinada
      que é descarregado para o canal de fuga. Mínimo = 0,0. Nulos em 2,8% dos registros.

      '
    customProperties:
    - property: aliases
      value:
      - vazão vertida
      - vertimento
      - spill
      - vazão do vertedouro
    - property: semanticType
      value: METRIC
    - property: unit
      value: m³/s
  - name: val_vazaooutrasestruturas
    physicalType: DOUBLE
    logicalType: number
    description: 'Vazão descarregada por outras estruturas hidráulicas do reservatório (ex. eclusas, tomadas
      d''água para irrigação, descargas de fundo). Alto percentual de nulos (~60,9%) indica que a maioria
      dos reservatórios não possui essas estruturas ou não reporta esse dado.

      '
    customProperties:
    - property: aliases
      value:
      - outras estruturas
      - vazão outras estruturas
      - descarga outras estruturas
    - property: semanticType
      value: METRIC
    - property: unit
      value: m³/s
    - property: enum
