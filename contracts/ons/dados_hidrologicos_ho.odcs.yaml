team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/dados_hidrologicos_ho
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - nivel do reservatorio hora a hora
  - vazao horaria da usina
  - volume util por hora
  - condicao hidraulica intradiaria
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver condições hidráulicas horárias de reservatórios
    do SIN, incluindo níveis de montante/jusante, volume útil percentual, vazões afluente/defluente/turbinada/vertida
    ou balanço hídrico horário por usina ou bacia. Também relevante para perguntas sobre vertimento, produtibilidade
    específica, eficiência hidráulica horária ou monitoramento em tempo real do estado dos reservatórios
    hidrelétricos brasileiros.
- property: agentInstructions
  value: '- [val_volumeutil] Campo apresenta valores negativos (mín=-199,71%), fisicamente impossível
    para percentual de volume útil. Indica dados brutos inconsistentes reportados pelos agentes de geração,
    não consistidos pelo ONS. Requer filtragem antes de análises quantitativas.


    - [val_vazaoafluente] Valores extremos negativos (mín=-312167,0 m³/s) e máximos muito elevados (840452,0
    m³/s) são fisicamente implausíveis para vazões de reservatórios brasileiros. Dados brutos não validados
    reportados pelos agentes. Valores negativos de vazão afluente não têm significado físico convencional.


    - [val_vazaodefluente] Valor mínimo de -1,0 m³/s para vazão defluente é fisicamente inconsistente
    (vazão não pode ser negativa). Provavelmente arredondamento ou erro de reporte do agente. Filtrar
    valores negativos antes de somar componentes de defluência.


    - [val_vazaotransferida] Valores negativos (mín=-383,0 m³/s) em val_vazaotransferida indicam transferência
    no sentido inverso ao convencionado positivo. Embora possa ser intencional (reversão de fluxo), requer
    atenção em agregações — somar sem tratamento pode subestimar ou superestimar a defluência total.


    - [val_niveljusante] Nulos em parte das linhas — a mais alta entre as colunas de nível/volume. Pode indicar
    usinas fio d''água sem medição de jusante, falhas de telemetria ou dados não reportados pelos agentes.
    Verificar se a ausência é sistemática por usina ou aleatória.


    - [val_vazaooutrasestruturas] Nulos em boa parte das linhas — uso esparso esperado, pois a maioria das usinas
    não possui outras estruturas hidráulicas além de turbinas e vertedouros. Não deve ser incluída em
    somas de defluência sem verificar se NULL significa zero ou dado ausente para cada usina.


    - [val_vazaovertidanaoturbinavel] Nulos na maior parte das linhas — uso esparso, aplicável apenas a usinas
    com medição específica de vertimento não turbinável. Tratar NULL como zero apenas após confirmar que
    a usina reporta este campo; caso contrário, pode mascarar vertimentos reais não registrados.


    - [cod_usina] Apresenta poucos nulos. Como cod_usina é a chave de
    join com o cadastro de usinas, registros sem este código ficam órfãos em joins e não podem ser enriquecidos
    com dados cadastrais. Verificar se id_reservatorio pode suprir o join nesses casos.


    - [din_instante] Possíveis lacunas temporais na série horária por reservatório. Dados não consistidos
    pelo ONS — falhas de telemetria ou não envio pelos agentes podem criar buracos na série temporal que
    afetam análises de continuidade e médias horárias.


    - [id_subsistema] Valores com trailing spaces detectados em ''id_subsistema''. Use TRIM() em filtros
    WHERE para evitar perda de registros.

    - [tip_reservatorio] Valores com trailing spaces detectados em ''tip_reservatorio''. Use TRIM() em
    filtros WHERE para evitar perda de registros.

    - [nom_bacia] Valores com trailing spaces detectados em ''nom_bacia''. Use TRIM() em filtros WHERE
    para evitar perda de registros.'
- property: typicalQuestions
  value:
  - Qual foi o volume útil médio dos reservatórios do subsistema Sudeste/Centro-Oeste na última semana?
  - Quais reservatórios apresentaram vertimento nas últimas 24 horas?
  - Qual a vazão afluente horária de Itaipu no mês de janeiro de 2024?
  - Quais usinas da bacia do Paraná estão com nível de montante abaixo da média histórica?
  - Qual a relação entre vazão turbinada e geração de energia em Tucuruí nas últimas 48 horas?
- property: granularity
  value: horária
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/dados_hidrologicos_ho/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2010-01-01'
- property: semantics
  value:
    family: dados_hidrologicos
    family_default: false
    temporal_perspective: verificado
    row_grain:
      temporal: 1 hora
      temporal_column: din_instante
      spatial: usina
      entity: reservatorio
      one_row_per:
      - din_instante
      - id_subsistema
      - id_reservatorio
    dimension_columns:
      subsistema: id_subsistema
      fonte: null
      usina: null
      reservatorio: nom_reservatorio
      bacia: nom_bacia
      subestacao: null
      patamar: null
    metrics:
    - id: nivelmontante
      label: Nivelmontante
      columns:
      - val_nivelmontante
      expression: val_nivelmontante
      quantity_kind: level
      unit_native: m
      default_aggregation: max
      forbidden_aggregations:
      - sum
      aggregation_modes:
        maximum:
          sql: MAX(val_nivelmontante)
          unit: m
        minimum:
          sql: MIN(val_nivelmontante)
          unit: m
        average:
          sql: AVG(val_nivelmontante)
          unit: m
        time_series:
          sql: AVG(val_nivelmontante)
          unit: m
        ranking:
          sql: AVG(val_nivelmontante)
          unit: m
        comparison:
          sql: AVG(val_nivelmontante)
          unit: m
      interval_hours: 1.0
      aliases:
      - nível montante
      - cota montante
      - nível do reservatório
      - cota do reservatório
    - id: niveljusante
      label: Niveljusante
      columns:
      - val_niveljusante
      expression: val_niveljusante
      quantity_kind: level
      unit_native: m
      default_aggregation: max
      forbidden_aggregations:
      - sum
      aggregation_modes:
        maximum:
          sql: MAX(val_niveljusante)
          unit: m
        minimum:
          sql: MIN(val_niveljusante)
          unit: m
        average:
          sql: AVG(val_niveljusante)
          unit: m
        time_series:
          sql: AVG(val_niveljusante)
          unit: m
        ranking:
          sql: AVG(val_niveljusante)
          unit: m
        comparison:
          sql: AVG(val_niveljusante)
          unit: m
      interval_hours: 1.0
      aliases:
      - nível jusante
      - cota jusante
      - nível canal de fuga
      - cota de jusante
    - id: volumeutil
      label: Volumeutil
      columns:
      - val_volumeutil
      expression: val_volumeutil
      quantity_kind: volume
      unit_native: '%'
      default_aggregation: last_or_avg
      forbidden_aggregations: []
      aggregation_modes:
        maximum:
          sql: MAX(val_volumeutil)
          unit: '%'
        minimum:
          sql: MIN(val_volumeutil)
          unit: '%'
        average:
          sql: AVG(val_volumeutil)
          unit: '%'
        time_series:
          sql: AVG(val_volumeutil)
          unit: '%'
        ranking:
          sql: AVG(val_volumeutil)
          unit: '%'
        comparison:
          sql: AVG(val_volumeutil)
          unit: '%'
      interval_hours: 1.0
      aliases:
      - volume útil
      - volume armazenado
      - armazenamento
      - nível do reservatório percentual
      - armazenamento percentual
    - id: vazaoafluente
      label: Vazaoafluente
      columns:
      - val_vazaoafluente
      expression: val_vazaoafluente
      quantity_kind: flow
      unit_native: m³/s
      default_aggregation: avg
      forbidden_aggregations: []
      aggregation_modes:
        average:
          sql: AVG(val_vazaoafluente)
          unit: m³/s
        peak:
          sql: MAX(val_vazaoafluente)
          unit: m³/s
        minimum:
          sql: MIN(val_vazaoafluente)
          unit: m³/s
        time_series:
          sql: AVG(val_vazaoafluente)
          unit: m³/s
        ranking:
          sql: AVG(val_vazaoafluente)
          unit: m³/s
        comparison:
          sql: AVG(val_vazaoafluente)
          unit: m³/s
      interval_hours: 1.0
      aliases:
      - vazão afluente
      - afluência
      - vazão de entrada
      - inflow
    - id: vazaodefluente
      label: Vazaodefluente
      columns:
      - val_vazaodefluente
      expression: val_vazaodefluente
      quantity_kind: flow
      unit_native: m³/s
      default_aggregation: avg
      forbidden_aggregations: []
      aggregation_modes:
        average:
          sql: AVG(val_vazaodefluente)
          unit: m³/s
        peak:
          sql: MAX(val_vazaodefluente)
          unit: m³/s
        minimum:
          sql: MIN(val_vazaodefluente)
          unit: m³/s
        time_series:
          sql: AVG(val_vazaodefluente)
          unit: m³/s
        ranking:
          sql: AVG(val_vazaodefluente)
          unit: m³/s
        comparison:
          sql: AVG(val_vazaodefluente)
          unit: m³/s
      interval_hours: 1.0
      aliases:
      - vazão defluente
      - defluência
      - vazão de saída
