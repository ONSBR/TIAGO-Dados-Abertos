    ambiguity_policy:
      default_assumptions: []
      must_clarify_when:
      - ambiguity: nivel_montante_vs_jusante
        question: 'Voce quer o nivel de montante (cota do reservatorio) ou o nivel de jusante (canal de
          fuga)?

          '
        trigger_terms:
        - nível
        - cota
        - lâmina d'água
        note: 'Clarificar apenas quando o contexto nao indica montante nem jusante. Se usuario mencionar
          "reservatorio" ou "armazenamento", assumir montante. Se mencionar "canal de fuga" ou "saida",
          assumir jusante.

          '
      - ambiguity: vazao_componente
        question: 'Voce quer a vazao afluente (entrada), defluente (saida total), turbinada (geracao)
          ou vertida (vertedouro)?

          '
        trigger_terms:
        - vazão
        - fluxo hidrico
        note: 'Clarificar apenas quando nenhum qualificador (afluente/defluente/ turbinada/vertida/transferida)
          estiver presente e o contexto nao permitir inferencia.

          '
      - ambiguity: granularidade_horaria_vs_diaria
        question: 'Este dataset tem granularidade horaria. Voce quer dados hora a hora ou agregados por
          dia/mes?

          '
        trigger_terms:
        - historico
        - serie
        - evolucao
        note: 'Clarificar apenas quando o usuario pede serie longa (anos) sem especificar agregacao —
          scan_cost=high justifica confirmacao.

          '
      redirect_when:
      - user_mentions:
        - nuclear
        - angra
        - angra 1
        - angra 2
        reason: 'Dataset nao contem dados de usinas nucleares. Dados hidrologicos aplicam-se apenas a
          reservatorios hidrelétricos do SIN.

          '
        redirect: geracao-usina-2 com filtro de tipo de combustivel nuclear
      - user_mentions:
        - MMGD
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Dataset nao contem coluna MMGD ou geracao distribuida.
        redirect: dataset com coluna val_germmgd quando disponivel
      - user_mentions:
        - EAR
        - energia armazenada MWmes
        - energia armazenada subsistema
        reason: 'EAR em MWmes nao esta neste dataset. Este dataset tem volume util percentual por reservatorio
          individual.

          '
        redirect: ear-diario-por-subsistema ou ear-diario-por-reservatorio
      - user_mentions:
        - ENA
        - energia natural afluente
        reason: 'ENA calculada nao esta neste dataset. Este dataset tem vazao afluente bruta em m3/s por
          reservatorio.

          '
        redirect: ena-diario-por-reservatorio
      - user_mentions:
        - PLD
        - CMO
        - preco spot
        - preco energia
        reason: Dataset nao contem dados de preco ou custo marginal.
        redirect: dataset de CMO ou PLD da CCEE/ONS
      - user_mentions:
        - carga eletrica
        - demanda eletrica
        reason: Dataset nao contem dados de carga ou demanda eletrica.
        redirect: dataset de carga do ONS
      - user_mentions:
        - geracao MWmed
        - geracao eletrica
        - potencia gerada
        reason: 'Este dataset contem vazao turbinada em m3/s, nao geracao em MWmed. Para geracao eletrica
          por usina, usar dataset de despacho ou geracao.

          '
        redirect: descontinuado-dados-do-historico-de-despacho-de-energia-de-01-2021-a-09-2024
      - user_mentions:
        - volume espera
        - volume de espera
        - restricao armazenamento
        reason: 'Volume de espera recomendado nao esta neste dataset. Este dataset tem volume util observado.

          '
        redirect: res_volumeespera
      - user_mentions:
        - dados diarios reservatorio
        - granularidade diaria reservatorio
        reason: 'Para dados diarios do mesmo reservatorio, usar dados-hidrologicos-res que tem menor scan_cost.

          '
        redirect: dados-hidrologicos-res
    sql_patterns:
      nivelmontante_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n       TRIM(id_subsistema)\
          \ AS id_subsistema,\n       MAX(val_nivelmontante) AS nivel_max_m,\n       MIN(val_nivelmontante)\
          \ AS nivel_min_m,\n       AVG(val_nivelmontante) AS nivel_medio_m\nFROM {source}\nWHERE EXTRACT(YEAR\
          \ FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1, 2\nORDER BY 1, 2\n"
        output_unit: m
        matches:
          output_modes:
          - maximum
          - minimum
          - average
          metrics:
          - nivelmontante
          grain: month
        validated_params:
          year: '2010'
      volumeutil_medio_subsistema:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n       TRIM(id_subsistema)\
          \ AS id_subsistema,\n       AVG(val_volumeutil) AS volume_util_medio_pct\nFROM {source}\nWHERE\
          \ val_volumeutil >= 0\n  AND val_volumeutil <= 150\nGROUP BY 1, 2\nORDER BY 1, 2\n"
        output_unit: '%'
        matches:
          output_modes:
          - average
          metrics:
          - volumeutil
          grain: month
        note: 'Filtro val_volumeutil BETWEEN 0 AND 150 remove valores fisicamente impossiveis (negativos
          e acima de 100% com margem para dados brutos).

          '
      vertimento_horario_reservatorio:
        template: "SELECT din_instante,\n       nom_reservatorio,\n       TRIM(id_subsistema) AS id_subsistema,\n\
          \       val_vazaovertida,\n       val_vazaovertidanaoturbinavel\nFROM {source}\nWHERE nom_reservatorio\
          \ = '{nom_reservatorio}'\n  AND din_instante BETWEEN '{data_inicio}' AND '{data_fim}'\n  AND\
          \ val_vazaovertida > 0\nORDER BY din_instante\n"
        output_unit: m³/s
        matches:
          output_modes:
          - time_series
          metrics:
          - vazaovertida
          - vazaovertidanaoturbinavel
          grain: hour
        validated_params:
          nom_reservatorio: CACONDE
          data_inicio: '2010-01-01 01:00:00'
          data_fim: '2010-02-28 23:59:00'
      balanco_hidrico_horario:
        template: "SELECT din_instante,\n       nom_reservatorio,\n       val_vazaoafluente,\n       val_vazaodefluente,\n\
          \       val_vazaoturbinada,\n       val_vazaovertida,\n       val_volumeutil\nFROM {source}\n\
          WHERE nom_reservatorio = '{nom_reservatorio}'\n  AND din_instante BETWEEN '{data_inicio}' AND\
          \ '{data_fim}'\n  AND val_vazaoafluente >= 0\n  AND val_vazaodefluente >= 0\nORDER BY din_instante\n"
        output_unit: m³/s
        matches:
          output_modes:
          - time_series
          metrics:
          - vazaoafluente
          - vazaodefluente
          - vazaoturbinada
          - vazaovertida
          - volumeutil
          grain: hour
        note: 'Filtros de nao-negatividade aplicados a afluente e defluente para remover erros de reporte.
          val_vazaotransferida pode ser negativa (fluxo reverso) e nao deve ser filtrada por sinal.

          '
        validated_params:
          nom_reservatorio: E. DA CUNHA
          data_inicio: '2010-01-01 01:00:00'
          data_fim: '2010-02-28 23:59:00'
- property: fewShotQueries
  value:
  - question: Qual foi a evolução do volume útil médio dos reservatórios por subsistema nas últimas 72
      horas?
    sql: SELECT id_subsistema, nom_subsistema, din_instante, ROUND(AVG(CASE WHEN val_volumeutil >= 0 THEN
      val_volumeutil END), 2) AS vol_util_medio_pct, COUNT(DISTINCT id_reservatorio) AS qtd_reservatorios
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/dados_hidrologicos_ho/*.parquet') WHERE din_instante
      >= ( SELECT MAX(din_instante) - INTERVAL '72 hours' FROM read_parquet('s3://ons-aws-prod-opendata/dataset/dados_hidrologicos_ho/*.parquet')
      ) GROUP BY id_subsistema, nom_subsistema, din_instante ORDER BY id_subsistema, din_instante
  - question: Quais foram as 20 usinas com maior vazão afluente média no dia anterior, excluindo outliers?
    sql: SELECT id_reservatorio, nom_reservatorio, nom_bacia, id_subsistema, ROUND(AVG(val_vazaoafluente),
      2) AS vazao_afluente_media_m3s, MIN(val_vazaoafluente) AS vazao_min, MAX(val_vazaoafluente) AS vazao_max,
      COUNT(*) AS horas_com_dado FROM read_parquet('s3://ons-aws-prod-opendata/dataset/dados_hidrologicos_ho/*.parquet')
      WHERE CAST(din_instante AS DATE) = CURRENT_DATE - INTERVAL '1 day' AND val_vazaoafluente >= 0 AND
      val_vazaoafluente <= 100000 GROUP BY id_reservatorio, nom_reservatorio, nom_bacia, id_subsistema
      ORDER BY vazao_afluente_media_m3s DESC LIMIT 20
  - question: Quais bacias hidrográficas tiveram maior volume de vertimento não turbinável no último mês?
    sql: SELECT nom_bacia, id_subsistema, COUNT(DISTINCT id_reservatorio) AS usinas_com_vertimento, ROUND(SUM(COALESCE(val_vazaovertidanaoturbinavel,
      0)), 2) AS soma_vertimento_nturb_m3s, ROUND(AVG(CASE WHEN val_vazaovertidanaoturbinavel > 0 THEN
      val_vazaovertidanaoturbinavel END), 2) AS media_quando_positivo FROM read_parquet('s3://ons-aws-prod-opendata/dataset/dados_hidrologicos_ho/*.parquet')
      WHERE din_instante >= ( SELECT MAX(din_instante) - INTERVAL '30 days' FROM read_parquet('s3://ons-aws-prod-opendata/dataset/dados_hidrologicos_ho/*.parquet')
      ) AND val_vazaovertidanaoturbinavel IS NOT NULL AND val_vazaovertidanaoturbinavel >= 0 GROUP BY
      nom_bacia, id_subsistema ORDER BY soma_vertimento_nturb_m3s DESC
