version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:ena-diario-por-ree-reservatorio-equivalente-de-energia
name: ena-diario-por-ree-reservatorio-equivalente-de-energia
tenant: ons
tags:
- ENA
- ENA bruta diária
- ENA diária REE
- ENA por reservatório equivalente
- MLT
- REE
- SIN
- afluência
- afluência diária por REE
- diário
- energia natural afluente
- energia natural afluente diária
- hidrologia
- média de longo termo
- reservatório equivalente de energia
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/ena_ree_di/*.parquet
  format: parquet
description:
  purpose: Prover séries históricas diárias de Energia Natural Afluente por Reservatório Equivalente de
    Energia para uso por geradores, comercializadores, agentes do mercado de energia e pesquisadores do
    setor elétrico brasileiro. Suporta estudos energéticos, projeção do Custo Marginal de Operação (CMO),
    acompanhamento das condições hidrológicas do SIN, análise de risco hidrológico, planejamento de despacho
    hidrotérmico e monitoramento operativo das condições de afluência nos subsistemas do sistema elétrico
    nacional.
  limitations: Coluna armazenada como VARCHAR no Parquet, embora represente datas no formato YYYY-MM-DD.
    Valores percentuais de ENA bruta variam de 12,56% a 408,62%, refletindo extremos hidrológicos reais
    (seca severa a cheia excepcional). Valores percentuais de ENA armazenável variam de 9,37% a 398,77%,
    com mínimo absoluto inferior ao da ENA bruta, indicando situações de estresse hídrico severo.
  usage: Recuperar este dataset quando a pergunta envolver Energia Natural Afluente (ENA) diária desagregada
    por Reservatório Equivalente de Energia (REE) ou subsistema hidrológico do SIN, incluindo análises
    de condições hidrológicas, comparação com a MLT, risco de seca, ou correlação entre afluência e Custo
    Marginal de Operação em granularidade diária.
domain: hidrologia
schema:
- name: ena_diario_por_ree_reservatorio_equivalente_de_energia
  physicalType: parquet
  logicalType: object
  physicalName: ena_diario_por_ree_reservatorio_equivalente_de_energia
  properties:
  - name: nom_reservatorioee
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome do Reservatório Equivalente de Energia (REE), que representa a agregação hidrológica
      e energética de usinas hidrelétricas por região/subsistema do Sistema Interligado Nacional (SIN).
      Funciona como identificador espacial equivalente ao subsistema para fins de estudos energéticos.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - reservatório equivalente
      - REE
      - subsistema
      - região hidrológica
      - bacia equivalente
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - BELO MONTE
      - IGUACU
      - ITAIPU
      - MADEIRA
      - MANAUS-AMAPA
      - NORDESTE
      - NORTE
      - PARANA
      - PARANAPANEMA
      - SUDESTE
      - SUL
      - TELES PIRES
  - name: ena_data
    physicalType: VARCHAR
    logicalType: string
    description: 'Data de referência da medição da Energia Natural Afluente, armazenada como VARCHAR no
      Parquet no formato YYYY-MM-DD. Representa o dia calendário ao qual os valores de ENA se referem.
      Recomenda-se CAST para DATE nas queries para operações temporais corretas.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - data
      - data da ENA
      - data de referência
      - dia
      - data hidrológica
    - property: semanticType
      value: DIMENSION
  - name: ena_bruta_ree_mwmed
    physicalType: VARCHAR
    logicalType: number
    description: 'Energia Natural Afluente Bruta do REE em MWmed (megawatts médios). Representa a energia
      produzível calculada pelo produto das vazões naturais aos reservatórios com as produtividades a
      65% dos volumes úteis. Inclui toda a energia afluente, independentemente da capacidade de armazenamento.

      '
    customProperties:
    - property: castExpression
      value: TRY_CAST(ena_bruta_ree_mwmed AS DOUBLE)
    - property: aliases
      value:
      - ENA bruta
      - energia natural afluente bruta
      - ENA bruta MWmed
      - afluência bruta
    - property: unit
      value: MWmed
  - name: ena_bruta_ree_percentualmlt
    physicalType: VARCHAR
    logicalType: number
    description: 'Energia Natural Afluente Bruta do REE expressa como percentual da Média de Longo Termo
      (MLT). Indica o desvio da afluência bruta em relação à média histórica de longo prazo, sendo 100%
      equivalente à MLT. Valores abaixo de 100% indicam condição hidrológica desfavorável; acima de 100%,
      favorável.

      '
    customProperties:
    - property: castExpression
      value: TRY_CAST(ena_bruta_ree_percentualmlt AS DOUBLE)
    - property: aliases
      value:
      - ENA bruta percentual MLT
      - ENA bruta % MLT
      - percentual MLT bruta
      - afluência bruta relativa
      - ENA bruta normalizada
    - property: unit
      value: '%MLT'
  - name: ena_armazenavel_ree_mwmed
    physicalType: VARCHAR
    logicalType: number
    description: 'Energia Natural Afluente Armazenável do REE em MWmed (megawatts médios). Considera as
      vazões naturais descontadas das vazões vertidas nos reservatórios, representando a parcela da afluência
      que pode efetivamente ser armazenada e utilizada para geração futura. Sempre menor ou igual à ENA
      bruta.

      '
    customProperties:
    - property: castExpression
      value: TRY_CAST(ena_armazenavel_ree_mwmed AS DOUBLE)
    - property: aliases
      value:
      - ENA armazenável
      - energia natural afluente armazenável
      - ENA armazenável MWmed
      - afluência armazenável
    - property: unit
      value: MWmed
  - name: ena_armazenavel_ree_percentualmlt
    physicalType: VARCHAR
    logicalType: number
    description: 'Energia Natural Afluente Armazenável do REE expressa como percentual da Média de Longo
      Termo (MLT). Indica o desvio da afluência armazenável em relação à média histórica de longo prazo.
      Tende a ser menor que o percentual bruto em períodos de cheias, quando ocorre vertimento.

      '
    customProperties:
    - property: castExpression
      value: TRY_CAST(ena_armazenavel_ree_percentualmlt AS DOUBLE)
    - property: aliases
      value:
      - ENA armazenável percentual MLT
      - ENA armazenável % MLT
      - percentual MLT armazenável
      - afluência armazenável relativa
      - ENA armazenável normalizada
    - property: unit
      value: '%MLT'
team:
