    ambiguity_policy:
      default_assumptions:
      - when: geracao
        assume_metric: proggeracao
        assume_output: total_energy
        assume_unit: GWh
        unless_mentions:
        - media
        - potencia
        - pico
        - instantaneo
      must_clarify_when:
      - ambiguity: energia_total_vs_potencia_media
        question: Voce quer energia total no periodo ou potencia media?
        trigger_terms:
        - geracao
        - energia
        - potencia
        - media
        - pico
      redirect_when:
      - user_mentions:
        - nuclear
        - angra
        reason: Schema nao contem coluna ou dimensao nuclear separada.
        redirect: geracao-usina-2 com filtro de combustivel/tipo quando disponivel
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Schema nao contem coluna MMGD separada.
        redirect: dataset com coluna val_germmgd/val_ger_mmgd quando disponivel
    sql_patterns:
      proggeracao_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, id_subsistema,\n\
          \  SUM((TRY_CAST(val_proggeracao AS DOUBLE)) * 1.0) / 1000 AS valor\nFROM {source}\nWHERE EXTRACT(YEAR\
          \ FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1, 2\nORDER BY 1, 2"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - proggeracao
          grain: month
        validated_params:
          year: '2022'
- property: fewShotQueries
  value:
  - question: Quais foram as 10 usinas térmicas com maior volume de Geração Fora da Ordem de Mérito (GFOM)
      verificado em 2023, e em quais subsistemas estão localizadas?
    sql: SELECT nom_usina, id_subsistema, SUM(TRY_CAST(val_verifgfom AS DOUBLE)) AS total_gfom_mwmed FROM
      read_parquet('s3://ons-aws-prod-opendata/dataset/geracao_termica_despacho_2_ho/*.parquet') WHERE
      din_instante >= TIMESTAMP '2023-01-01 00:00:00' AND din_instante < TIMESTAMP '2024-01-01 00:00:00'
      AND id_subsistema <> 'SIN' GROUP BY nom_usina, id_subsistema ORDER BY total_gfom_mwmed DESC LIMIT
      10;
  - question: Qual foi o desvio médio mensal entre geração total programada e verificada por subsistema
      ao longo de 2022 e 2023?
    sql: SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, id_subsistema, SUM((TRY_CAST(val_proggeracao
      AS DOUBLE)) * 1.0) / 1000 AS total_programado_mwmed, SUM((TRY_CAST(val_verifgeracao AS DOUBLE))
      * 1.0) / 1000 AS total_verificado_mwmed, SUM((TRY_CAST(val_verifgeracao AS DOUBLE)) * 1.0) / 1000
      - SUM((TRY_CAST(val_proggeracao AS DOUBLE)) * 1.0) / 1000 AS desvio_mwmed, ROUND( 100.0 * ( SUM((TRY_CAST(val_verifgeracao
      AS DOUBLE)) * 1.0) / 1000 - SUM((TRY_CAST(val_proggeracao AS DOUBLE)) * 1.0) / 1000 ) / NULLIF(SUM((TRY_CAST(val_proggeracao
      AS DOUBLE)) * 1.0) / 1000, 0), 2 ) AS desvio_pct FROM read_parquet('s3://ons-aws-prod-opendata/dataset/geracao_termica_despacho_2_ho/*.parquet')
      WHERE din_instante >= TIMESTAMP '2022-01-01 00:00:00' AND din_instante < TIMESTAMP '2024-01-01 00:00:00'
      AND id_subsistema <> 'SIN' GROUP BY DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)), id_subsistema
      ORDER BY mes, id_subsistema;
