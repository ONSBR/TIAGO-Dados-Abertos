  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/geracao-termica-despacho-2
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - por que a termica foi despachada
  - motivo do despacho termico
  - termicas ligadas por inflexibilidade
  - quais termicas foram acionadas
  - despacho fora da ordem de merito
  - razao do acionamento termico
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver geração de usinas termelétricas despachadas
    pelo ONS com desagregação por motivo de despacho (ordem de mérito, inflexibilidade, razão elétrica,
    GFOM, constrained-off, unit commitment, garantia energética, exportação ou reserva de potência) em
    base horária para o período 2022–2024. Também relevante para análises de conformidade de despacho,
    custo de inflexibilidade, auditoria de despachos fora da ordem de mérito e comparação entre valores
    programados e verificados por usina.
- property: agentInstructions
  value: |
    - [val_proggeracao] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização. Contém valores numéricos de geração programada em MWmed que requerem conversão explícita para uso em agregações SQL no dataset geracao-termica-despacho-2.

    - [val_verifgeracao] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização. Contém valores numéricos de geração verificada em MWmed que requerem conversão explícita para uso em agregações SQL no dataset geracao-termica-despacho-2.

    - [val_fdexp] Única coluna com ausência relevante de dados no dataset geracao-termica-despacho-2 — 8,6% de nulos (~79.672 registros). Pode indicar que o fator de disponibilidade para exportação não é calculado para usinas sem contrato de exportação ou em períodos sem demanda de exportação.

    - [cod_usinaplanejamento] Apresenta 0,2% de nulos (~1.853 registros) no dataset geracao-termica-despacho-2, possivelmente para usinas recém-cadastradas ou sem código atribuído no sistema de planejamento ONS. Impacta joins que utilizam este campo como chave.

    - [val_progordemdemeritoref] Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização no dataset geracao-termica-despacho-2. Verificar se há registros com valores não conversíveis que possam indicar strings inválidas além do comportamento padrão.

    - [val_progconstrainedoff] Valores de constrained-off programado podem ser negativos no contexto ONS do dataset geracao-termica-despacho-2, representando constrained-on (despacho forçado acima do mérito). Verificar distribuição de valores negativos para validar consistência operacional.

    - [val_verifconstrainedoff] Valores de constrained-off verificado podem ser negativos (constrained-on efetivo) no dataset geracao-termica-despacho-2. Verificar distribuição para validar consistência entre programado e verificado.

    - [din_instante] Verificar se há horas faltantes na série temporal do dataset geracao-termica-despacho-2 para usinas com presença contínua no período 2022-2024, o que poderia indicar falhas de coleta ou processamento dos dados horários.

    - [tip_restricaoeletrica] Coluna INTEGER com valores entre 0 e 1078 no dataset geracao-termica-despacho-2. Valores muito elevados (acima de 500) podem representar códigos de restrições especiais ou erros de codificação. Verificar distribuição para identificar concentração em valores extremos.

    - [val_fdexp] Coluna 'val_fdexp' ausente em arquivos históricos (ex: GERACAO_TERMICA_DESPACHO-2_2022_01.parquet). Presente apenas a partir de versões recentes (ex: GERACAO_TERMICA_DESPACHO_2024.parquet). Queries históricas retornarão NULL para esta coluna. Use union_by_name=true ao combinar arquivos de diferentes períodos.
    - [tipos] As colunas de código `cod_usinaplanejamento` variam entre inteiro e decimal entre arquivos; compare-as como número, não como texto.
- property: typicalQuestions
  value:
  - Qual foi a geração térmica total programada e verificada por subsistema em 2023?
  - Quais usinas termelétricas tiveram maior volume de despacho por inflexibilidade pura no período 2022–2024?
  - Qual a diferença entre geração programada e verificada (desvio de despacho) por usina no último trimestre?
  - Quais usinas apresentaram constrained-off e qual o volume total de MW afetados por mês?
  - Qual a participação percentual de cada motivo de despacho (ordem de mérito, inflexibilidade, razão
    elétrica, GFOM) na geração térmica total do SIN?
- property: granularity
  value: horária
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet(['s3://ons-aws-prod-opendata/dataset/geracao_termica_despacho_2_ho/GERACAO_TERMICA_DESPACHO_201*.parquet',
