version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:geracao-termica-despacho-2
name: geracao-termica-despacho-2
tenant: ons
tags:
- constrained-off ONS
- despacho térmico
- despacho térmico motivo
- geração termelétrica por motivo
- inflexibilidade térmica
- motivo de despacho ONS
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/geracao_termica_despacho_2_ho/*.parquet
  format: parquet
description:
  purpose: Subsidiar analistas de operação, planejamento e regulação do setor elétrico brasileiro no acompanhamento
    da conformidade do despacho térmico horário, auditoria de acionamentos fora da ordem de mérito, quantificação
    de custos de inflexibilidade, análise de constrained-off e avaliação de eficiência do despacho centralizado
    pelo ONS. Suporta decisões de regulação tarifária, análise de custo marginal de operação e monitoramento
    de restrições elétricas que motivam despachos não econômicos.
  limitations: A coluna val_fdexp apresenta 8,6% de nulos (aproximadamente 79. Aproximadamente 0,2% dos
    registros (~1. Coluna armazenada como VARCHAR no dataset geracao-termica-despacho-2 devido ao formato
    de serialização.
  usage: Recuperar este dataset quando a pergunta envolver geração de usinas termelétricas despachadas
    pelo ONS com desagregação por motivo de despacho (ordem de mérito, inflexibilidade, razão elétrica,
    GFOM, constrained-off, unit commitment, garantia energética, exportação ou reserva de potência) em
    base horária para o período 2022–2024.
domain: geração
schema:
- name: geracao_termica_despacho_2
  physicalType: parquet
  logicalType: object
  physicalName: geracao_termica_despacho_2
  properties:
  - name: din_instante
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Instante de referência da medição horária de geração térmica por motivo de despacho
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - instante
      - hora
      - data_hora
      - timestamp
      - data_referencia
    - property: semanticType
      value: TIMESTAMP
  - name: nom_tipopatamar
    physicalType: VARCHAR
    logicalType: string
    description: Nome do patamar de carga associado ao instante horário (Leve, Médio ou Pesado), conforme
      classificação ONS
    customProperties:
    - property: aliases
      value:
      - patamar
      - tipo_patamar
      - patamar_carga
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - LEVE
      - MÉDIA
      - PESADA
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: Identificador/sigla do subsistema elétrico ao qual a usina pertence (SE, S, NE, N, SIN)
    customProperties:
    - property: aliases
      value:
      - subsistema
      - sigla_subsistema
      - cod_subsistema
      - regiao
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
    primaryKey: true
  - name: nom_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: Nome completo do subsistema elétrico ao qual a usina pertence
    customProperties:
    - property: aliases
      value:
      - nome_subsistema
      - subsistema_nome
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - NORDESTE
      - NORTE
      - SUDESTE
      - SUL
  - name: nom_usina
    physicalType: VARCHAR
    logicalType: string
    description: Nome da usina termelétrica despachada pelo ONS
    customProperties:
    - property: aliases
      value:
      - usina
      - nome_usina
      - termica
      - planta
    - property: semanticType
      value: DIMENSION
    primaryKey: true
  - name: cod_usinaplanejamento
    physicalType: DOUBLE
    logicalType: integer
    description: Código numérico de planejamento da usina no sistema ONS; pode ser nulo em 0,2% dos registros
    customProperties:
    - property: aliases
      value:
      - codigo_usina
      - cod_usina
      - id_usina_planejamento
    - property: semanticType
      value: IDENTIFIER
  - name: ceg
    physicalType: VARCHAR
    logicalType: string
    description: Código de Empreendimento de Geração (CEG) da ANEEL, identificador único da usina no cadastro
      regulatório
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - codigo_empreendimento
      - codigo_aneel
      - id_empreendimento
    - property: semanticType
      value: IDENTIFIER
  - name: val_proggeracao
    physicalType: VARCHAR
    logicalType: string
    description: Geração total programada da usina no instante horário (soma de todos os motivos de despacho
      programados). Armazenado como VARCHAR pelo formato de serialização; converter com TRY_CAST para
      uso analítico
    customProperties:
    - property: aliases
      value:
