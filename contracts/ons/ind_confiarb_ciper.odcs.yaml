customProperties:
- property: vectorTags
  value:
  - carga interrompida por perturbacao
  - quanto de carga caiu em perturbacoes
  - indicador de carga interrompida
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver carga interrompida por perturbações, confiabilidade
    da rede básica de transmissão, indicadores regulatórios do Submódulo 9.1 do ONS ou desempenho do sistema
    elétrico por subsistema em termos de interrupções. Também relevante para análises de penalidades regulatórias
    da ANEEL relacionadas a perturbações no sistema de transmissão e comparações históricas de confiabilidade
    entre subsistemas ou estados brasileiros.
- property: agentInstructions
  value: '- [val_ciper1] val_ciper1 apresenta amplitude muito elevada (0 a 345 MW) em comparação com val_ciper2
    a val_ciper5 (máximos entre 2 e 15 MW). Valores extremos próximos a 345 MW podem representar eventos
    de grande perturbação ou registros anuais acumulados do SIN. Recomenda-se filtrar por id_periodicidade
    e dsc_agregacao antes de comparações diretas.


    - [val_ciper2] val_ciper2 possui máximo de 10 MW, muito inferior ao máximo de val_ciper1 (345 MW).
    Verificar se registros com val_ciper2 no máximo correspondem a eventos específicos ou agregações SIN/anuais
    que possam distorcer análises por subsistema.


    - [val_ciper3] val_ciper3 possui máximo de 6 MW. Verificar consistência entre val_ciper3 e demais
    subindicadores para identificar registros onde val_ciper3 > val_ciper2, o que poderia indicar inversão
    de categorias ou erro de classificação.


    - [val_ciper4] val_ciper4 possui o menor máximo entre todos os subindicadores (2 MW). Verificar se
    existem registros onde val_ciper4 > val_ciper3, o que poderia indicar inconsistência na ordenação
    dos subcomponentes CIPER.


    - [val_ciper5] val_ciper5 possui máximo de 15 MW, superior a val_ciper2 (10), val_ciper3 (6) e val_ciper4
    (2), quebrando a ordenação decrescente esperada dos subcomponentes. Isso sugere que val_ciper5 pode
    representar uma categoria distinta. Recomenda-se investigar a definição regulatória de cada subindicador
    no Submódulo 9.1.


    - [din_referencia] O período cobre 2007-01-01 a 2026-04-01 com registros mensais e anuais coexistindo
    via id_periodicidade. Verificar se há meses faltantes na série mensal para cada combinação de dsc_agregacao
    e cod_caracteristica, o que poderia indicar descontinuidades na apuração do indicador CIPER.


    - [id_periodicidade] Verificar se existem registros duplicados para a chave primária natural (dsc_agregacao,
    cod_caracteristica, id_periodicidade, din_referencia). A coexistência de registros mensais e anuais
    para o mesmo período pode gerar dupla contagem em análises que não filtrem por id_periodicidade.


    - [dsc_agregacao] Verificar se os valores de dsc_agregacao estão padronizados e se não há variações
    de grafia (ex: "Subsistema" vs "subsistema", "Região" vs "Regiao") que possam fragmentar filtros e
    agrupamentos nas análises.

    '
- property: typicalQuestions
  value:
  - Qual foi a evolução do CIPER no subsistema Sudeste/Centro-Oeste nos últimos 5 anos?
  - Quais subsistemas apresentaram maior carga interrompida por perturbações em 2023?
  - Como o CIPER anual do SIN variou entre 2010 e 2025?
  - Qual o ranking de estados com maior val_ciper1 médio nos últimos 3 anos?
  - Existe tendência de redução da carga interrompida por perturbações no subsistema Sul?
