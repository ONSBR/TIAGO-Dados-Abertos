version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:ind_confiarb_ciper
name: ind_confiarb_ciper
tenant: ons
tags:
- ANEEL
- CIPER
- ONS
- Submódulo 9.1
- carga interrompida
- carga interrompida por perturbações
- confiabilidade
- confiabilidade rede básica
- ind_confiarb_ciper
- indicador de confiabilidade CIPER
- indicadores regulatórios
