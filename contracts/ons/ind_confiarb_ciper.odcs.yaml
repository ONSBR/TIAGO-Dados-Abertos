      - AMAPA
      - AMAZONAS
      - BAHIA
      - CEARA
      - Centro-Oeste
      - DISTRITO FEDERAL
      - ESPIRITO SANTO
      - GOIAS
      - MARANHAO
      - MATO GROSSO
      - MATO GROSSO DO SUL
      - MINAS GERAIS
      - NORDESTE
      - NORTE
      - Nordeste
      - Norte
      - PARA
      - PARAIBA
      - PARANA
      - PERNAMBUCO
      - PIAUI
      - RIO DE JANEIRO
      - RIO GRANDE DO NORTE
      - RIO GRANDE DO SUL
      - RONDONIA
      - RORAIMA
      - SANTA CATARINA
      - SAO PAULO
      - SERGIPE
      - SUDESTE
      - SUL
      - Sistema Brasileiro
      - Sudeste
      - Sul
      - TOCANTINS
  - name: id_periodicidade
    physicalType: VARCHAR
    logicalType: string
    description: 'Identificador da periodicidade do registro. Indica se o valor CIPER corresponde a uma
      apuração mensal ou anual, conforme previsto no Submódulo 9.1 dos Procedimentos de Rede do ONS.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - periodicidade
      - tipo_periodicidade
      - frequencia
      - periodo
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - AN
      - ME
  - name: din_referencia
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: 'Data de referência do indicador CIPER, representada como timestamp no primeiro dia do
      mês de apuração. Para registros anuais, corresponde ao primeiro dia do ano (01/01/AAAA). Cobre o
      período de janeiro de 2007 a março de 2026.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - data_referencia
      - mes_referencia
      - ano_referencia
      - competencia
      - data
    - property: semanticType
      value: TIMESTAMP
  - name: val_ciper1
    physicalType: DOUBLE
    logicalType: number
    description: 'Componente principal do Indicador de Carga Interrompida por Perturbações (CIPER), conforme
      Submódulo 9.1 dos Procedimentos de Rede do ONS. Representa a carga interrompida total em decorrência
      de perturbações no sistema elétrico. Possui o maior range de valores (0 a 345 MW), sendo o indicador
      de maior abrangência.

      '
    customProperties:
    - property: aliases
      value:
      - ciper1
      - carga_interrompida_1
      - indicador_ciper_1
      - ciper_principal
    - property: semanticType
      value: METRIC
    - property: unit
      value: MW
  - name: val_ciper2
    physicalType: DOUBLE
    logicalType: number
    description: 'Segundo componente do Indicador CIPER, possivelmente representando um subcomponente
      ou categoria específica de perturbação. Possui range reduzido (0 a 10 MW) em relação ao val_ciper1,
      sugerindo menor magnitude ou escopo mais restrito.

      '
    customProperties:
    - property: aliases
      value:
      - ciper2
      - carga_interrompida_2
      - indicador_ciper_2
    - property: semanticType
