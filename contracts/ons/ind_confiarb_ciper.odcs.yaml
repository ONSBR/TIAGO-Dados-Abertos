    sql_patterns:
      ciper1_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_referencia AS TIMESTAMP)) AS mes,\n  SUM(val_ciper1)\
          \ AS valor\nFROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_referencia AS TIMESTAMP)) =\
          \ {year}\n  AND id_periodicidade = 'ME'\n  AND dsc_agregacao = 'Subsistema'\nGROUP BY 1\nORDER\
          \ BY 1\n"
        output_unit: MW
        matches:
          output_modes:
          - total
          metrics:
          - ciper1
          grain: month
        validated_params:
          year: '2026'
      ciper1_anual_sin:
        template: "SELECT EXTRACT(YEAR FROM TRY_CAST(din_referencia AS TIMESTAMP)) AS ano,\n  SUM(val_ciper1)\
          \ AS valor\nFROM {source}\nWHERE id_periodicidade = 'AN'\n  AND dsc_agregacao = 'Sistema'\n\
          GROUP BY 1\nORDER BY 1\n"
        output_unit: MW
        matches:
          output_modes:
          - total
          - time_series
          metrics:
          - ciper1
          grain: year
      ranking_estados_ciper1:
        template: "SELECT cod_caracteristica AS estado,\n  dsc_caracteristica AS nome_estado,\n  AVG(val_ciper1)\
          \ AS media_ciper1\nFROM {source}\nWHERE id_periodicidade = 'ME'\n  AND dsc_agregacao = 'Estado'\n\
          \  AND din_referencia >= '{data_inicio}'\n  AND din_referencia <= '{data_fim}'\nGROUP BY 1,\
          \ 2\nORDER BY media_ciper1 DESC\n"
        output_unit: MW
        matches:
          output_modes:
          - ranking
          metrics:
          - ciper1
          grain: period
        validated_params:
          data_inicio: '2026-01-01'
          data_fim: '2026-05-01'
    ambiguity_policy:
      default_assumptions:
      - when: CIPER
        assume_metric: ciper1
        assume_output: total
        note: 'Sem especificacao de subindicador, assume-se val_ciper1 (componente principal, maior abrangencia
          e range). Informar usuario e oferecer detalhamento por subindicador.

          '
      - when: carga interrompida
        assume_metric: ciper1
        assume_output: total
        note: val_ciper1 representa a carga interrompida total por perturbacoes.
      - when: periodicidade nao especificada
        assume_filter: id_periodicidade = 'ME'
        note: 'Registros mensais sao mais granulares e evitam dupla contagem com anuais. Para series anuais
          longas, usar id_periodicidade=''AN''.

          '
      - when: nivel geografico nao especificado
        assume_filter: dsc_agregacao = 'Subsistema'
        note: Subsistema e o nivel mais comum para analises de confiabilidade ONS.
      must_clarify_when:
      - ambiguity: subindicador_ciper_nao_especificado
        question: 'Qual subindicador CIPER voce deseja analisar? As opcoes sao: ciper1 (carga interrompida
          total, range 0-345 MW), ciper2 (range 0-10 MW), ciper3 (range 0-6 MW), ciper4 (range 0-2 MW)
          ou ciper5 (range 0-15 MW)?

          '
        trigger_terms:
        - subindicador
        - componente
        - ciper2
        - ciper3
        - ciper4
        - ciper5
      - ambiguity: periodicidade_mensal_vs_anual
        question: 'Voce quer dados mensais (id_periodicidade=''ME'') ou anuais (id_periodicidade=''AN'')?
          Misturar os dois gera dupla contagem.

          '
        trigger_terms:
        - mensal e anual
        - todos os periodos
        - historico completo
        - serie completa
      - ambiguity: nivel_geografico_ambiguo
        question: 'Voce quer o dado por Subsistema (SE, S, NE, N), por Estado (UF), por Regiao Geografica
          ou para o Sistema (SIN total)?

          '
        trigger_terms:
        - regiao
        - estado
        - subsistema
        - nacional
        - brasil
        - SIN
      redirect_when:
      - user_mentions:
        - usina
        - ceg
        - itaipu
        - belo monte
        - tucurui
        - ranking de usinas
        reason: Schema nao contem CEG, nome de usina ou identificador fisico de usina.
        redirect: geracao-usina-2
      - user_mentions:
        - nuclear
        - angra
        reason: Schema nao contem coluna ou dimensao nuclear separada.
        redirect: geracao-usina-2 com filtro de combustivel/tipo quando disponivel
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Schema nao contem coluna MMGD separada.
        redirect: dataset com coluna val_germmgd/val_ger_mmgd quando disponivel
      - user_mentions:
        - energia nao suprida
        - ENS
        reason: Energia nao suprida e indicador distinto do CIPER.
        redirect: ind_confiarb_energianaosuprida
      - user_mentions:
        - severidade
        reason: Severidade de perturbacoes e indicador distinto do CIPER.
        redirect: ind_confiarb_severidade
      - user_mentions:
        - dreq
        - freq
        - indisponibilidade
        reason: DREQ e FREQ sao indicadores de indisponibilidade distintos do CIPER.
        redirect: ind_confiarb_dreq_freq
      - user_mentions:
        - robustez
        reason: Robustez do sistema e indicador distinto do CIPER.
        redirect: ind_confiarb_robustez
      - user_mentions:
        - previsao
        - programacao
        - programada
        - prevista
        - dessem
        - pmo
        reason: Este dataset contem apenas dados verificados/realizados do indicador CIPER. Nao ha dados
          programados ou previstos.
- property: fewShotQueries
  value:
  - question: Como evoluiu o indicador CIPER 1 por subsistema ao longo dos anos?
    sql: SELECT cod_caracteristica, dsc_caracteristica, DATE_TRUNC('year', din_referencia::DATE) AS ano,
      AVG(val_ciper1) AS media_ciper1, MAX(val_ciper1) AS max_ciper1, MIN(val_ciper1) AS min_ciper1 FROM
      read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_ciper/*.parquet') WHERE dsc_agregacao
      = 'Subsistema' AND id_periodicidade = 'ME' GROUP BY cod_caracteristica, dsc_caracteristica, DATE_TRUNC('year',
      din_referencia::DATE) ORDER BY cod_caracteristica, ano;
  - question: Quais estados tiveram maior carga interrompida por perturbações em 2023?
    sql: SELECT cod_caracteristica, dsc_caracteristica, SUM(val_ciper1) AS total_ciper1, SUM(val_ciper2)
      AS total_ciper2, SUM(val_ciper3) AS total_ciper3, SUM(val_ciper4) AS total_ciper4, SUM(val_ciper5)
      AS total_ciper5, SUM(val_ciper1 + val_ciper2 + val_ciper3 + val_ciper4 + val_ciper5) AS total_ciper_geral
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_ciper/*.parquet') WHERE dsc_agregacao
      = 'Estado' AND id_periodicidade = 'ME' AND YEAR(din_referencia::DATE) = 2023 GROUP BY cod_caracteristica,
      dsc_caracteristica ORDER BY total_ciper_geral DESC LIMIT 20;
  - question: Como o CIPER anual do Sistema Interligado Nacional variou entre 2010 e 2025?
    sql: SELECT YEAR(din_referencia::DATE) AS ano, val_ciper1, val_ciper2, val_ciper3, val_ciper4, val_ciper5,
      val_ciper1 + val_ciper2 + val_ciper3 + val_ciper4 + val_ciper5 AS total_ciper FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_ciper/*.parquet')
      WHERE dsc_agregacao = 'SIN' AND id_periodicidade = 'AN' AND YEAR(din_referencia::DATE) BETWEEN 2010
      AND 2025 ORDER BY ano;
