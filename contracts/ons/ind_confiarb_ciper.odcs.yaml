status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/ind_confiarb_ciper/*.parquet
  format: parquet
description:
  purpose: Monitorar a carga interrompida em decorrência de perturbações no sistema elétrico brasileiro,
    permitindo que analistas de confiabilidade, agentes de transmissão e reguladores da ANEEL avaliem
    o desempenho da rede básica por subsistema e período, suportem decisões sobre manutenção preventiva,
    apliquem penalidades regulatórias e planejem a expansão do sistema de transmissão com base em histórico
    de perturbações desde 2007.
  limitations: val_ciper1 apresenta range muito amplo (0 a 345 MW), com máximo significativamente superior
    aos demais componentes CIPER (max 2 a 15 MW). val_ciper5 possui range máximo (15 MW) superior ao val_ciper2
    (10 MW) e val_ciper3 (6 MW), apesar de ser o quinto componente. A coexistência de registros mensais
    e anuais na mesma tabela pode gerar dupla contagem em agregações temporais.
  usage: Recuperar este dataset quando a pergunta envolver carga interrompida por perturbações, confiabilidade
    da rede básica de transmissão, indicadores regulatórios do Submódulo 9.
domain: qualidade
schema:
- name: ind_confiarb_ciper
  physicalType: parquet
  logicalType: object
  physicalName: ind_confiarb_ciper
  properties:
  - name: dsc_agregacao
    physicalType: VARCHAR
    logicalType: string
    description: 'Nível de agregação geográfica do indicador CIPER. Indica se o registro corresponde ao
      Sistema Interligado Nacional (SIN), a um Subsistema elétrico, a uma Região geográfica ou a um Estado
      brasileiro.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - agregacao
      - nivel_geografico
      - tipo_agregacao
      - nivel_espacial
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Estado
      - Região Geográfica
      - Sistema
      - Subsistema
  - name: cod_caracteristica
    physicalType: VARCHAR
    logicalType: string
    description: 'Código identificador da entidade geográfica correspondente ao nível de agregação definido
      em dsc_agregacao. Pode representar o código do SIN, do subsistema (SE, S, NE, N), da região geográfica
      ou da sigla do estado.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - codigo_caracteristica
      - cod_subsistema
      - cod_regiao
      - cod_estado
      - codigo_entidade
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - AC
      - AL
      - AM
      - AP
      - BA
      - CE
      - CO
      - DF
      - ES
      - GO
      - MA
      - MG
      - MS
      - MT
      - N
      - NE
      - PA
      - PB
      - PE
      - PI
      - PR
      - RJ
      - RN
      - RO
      - RR
      - RS
      - S
      - SBR
      - SC
      - SE
      - SP
      - TO
  - name: dsc_caracteristica
    physicalType: VARCHAR
    logicalType: string
    description: 'Descrição textual da entidade geográfica identificada por cod_caracteristica. Exemplos:
      "Sudeste/Centro-Oeste", "Sul", "Nordeste", "Norte", nome do estado ou "Sistema Interligado Nacional".

      '
    customProperties:
    - property: aliases
      value:
      - descricao_caracteristica
      - nome_subsistema
      - nome_regiao
      - nome_estado
      - descricao_entidade
    - property: semanticType
