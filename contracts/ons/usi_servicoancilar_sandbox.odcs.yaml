      - 02:22
      - 02:31
      - 02:55
      - 04:02
      - 05:09
      - 05:12
      - 07:15
      - 09:11
      - 09:29
      - 09:34
      - 09:43
      - '13:45'
      - '16:05'
    primaryKey: true
  - name: cod_pontoconexao
    physicalType: VARCHAR
    logicalType: string
    description: Código do ponto de conexão da usina à rede elétrica básica, identificando o barramento
      ou subestação de interligação
    primaryKey: true
    customProperties:
    - property: aliases
      value:
