    metrics:
    - id: must
      label: Must
      columns:
      - val_must
      expression: TRY_CAST(val_must AS DOUBLE)
      quantity_kind: capacity
      unit_native: MW
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total:
          sql: SUM(TRY_CAST(val_must AS DOUBLE))
          unit: MW
        average:
          sql: AVG(TRY_CAST(val_must AS DOUBLE))
          unit: MW
        maximum:
          sql: MAX(TRY_CAST(val_must AS DOUBLE))
          unit: MW
        time_series:
          sql: SUM(TRY_CAST(val_must AS DOUBLE))
          unit: MW
        ranking:
          sql: SUM(TRY_CAST(val_must AS DOUBLE))
          unit: MW
        comparison:
          sql: SUM(TRY_CAST(val_must AS DOUBLE))
          unit: MW
      interval_hours: 168.0
      aliases:
      - MUST
      - montante de uso do sistema de transmissão
      - valor MUST
      - capacidade contratada
    - id: flg_cpsa
      label: Flag CPSA
      columns:
      - flg_cpsa
      expression: flg_cpsa
      quantity_kind: flag
      unit_native: binario
      default_aggregation: count_nonzero
      forbidden_aggregations:
      - sum
      - avg
      aggregation_modes:
        count_eligible:
          sql: COUNT(CASE WHEN flg_cpsa = 1.0 THEN 1 END)
          unit: usinas
        count_not_eligible:
          sql: COUNT(CASE WHEN flg_cpsa = 0.0 THEN 1 END)
          unit: usinas
        rate_eligible:
          sql: COUNT(CASE WHEN flg_cpsa = 1.0 THEN 1 END) * 1.0 / COUNT(flg_cpsa)
          unit: proporcao
      interval_hours: 168.0
      aliases:
      - flag CPSA
      - compensacao de potencia reativa
      - indicador CPSA
      - presta servico ancilar de reativo
    query_routing:
