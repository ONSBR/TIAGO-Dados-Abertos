description:
  purpose: Registrar e disponibilizar o cadastro de usinas elegíveis e participantes do sandbox regulatório
    de compensação de reativo do ONS, permitindo que analistas do setor elétrico, reguladores da ANEEL
    e agentes do mercado acompanhem quais usinas prestam serviço ancilar de suporte de tensão (CPSA),
    seus pontos de conexão e montantes contratados. Suporta decisões regulatórias sobre elegibilidade,
    controle de tensão na rede básica e avaliação do programa piloto de reativos.
  limitations: Coluna val_must armazenada como VARCHAR no Parquet devido ao formato de serialização. Coluna
    dsc_comentario possui 100% de valores nulos (385/385 registros), tornando-a completamente inútil para
    análise no estado atual; possível campo reservado para uso futuro ou falha no pipeline de carga do
    sandbox regulatório. Coluna dat_verificada possui 73,5% de nulos (~283 de 385 registros), indicando
    que apenas ~102 registros possuem data preenchida; estrutura sugere template parcialmente preenchido
    ou carga incompleta do sandbox regulatório ONS.
  usage: Recuperar este dataset quando a pergunta envolver elegibilidade ou participação de usinas no
    programa sandbox regulatório de compensação de reativo (CPSA) do ONS.
domain: geração
