          filter: ceg = 'UFV.RS.MG.037839-9'
      nom_conjunto:
        Conj. Lar do Sol:
          aliases:
          - Conj. Lar do Sol
          - Lar do Sol
          - conjunto Lar do Sol
          filter: nom_conjunto = 'Conj. Lar do Sol'
        Conj. Pirapora 2:
          aliases:
          - Conj. Pirapora 2
          - Pirapora 2
          - conjunto Pirapora 2
          filter: nom_conjunto = 'Conj. Pirapora 2'
      val_must:
        '328':
          aliases:
          - '328'
          filter: val_must = '328'
        328,000:
          aliases:
          - 328,000
          filter: val_must = '328,000'
        481,1:
          aliases:
          - 481,1
          filter: val_must = '481,1'
        481,100:
          aliases:
          - 481,100
          filter: val_must = '481,100'
      flg_cpsa:
        '1.0':
          aliases:
          - presta CPSA
          - elegivel CPSA
          - habilitado reativo
          - sim
          - '1'
          filter: flg_cpsa = 1.0
        '0.0':
          aliases:
          - nao presta CPSA
          - nao elegivel CPSA
          - nao habilitado reativo
          - nao
          - '0'
          filter: flg_cpsa = 0.0
    sql_patterns:
      must_total_por_usina:
        template: "SELECT ceg,\n  SUM(TRY_CAST(val_must AS DOUBLE)) AS must_total_mw\nFROM {source}\n\
          WHERE dat_verificada IS NOT NULL\n  AND ceg IS NOT NULL\nGROUP BY ceg\nORDER BY must_total_mw\
          \ DESC"
        output_unit: MW
        matches:
          output_modes:
          - ranking
          - total
          metrics:
          - must
          grain: usina
      must_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(dat_verificada AS DATE)) AS mes,\n  SUM(TRY_CAST(val_must\
          \ AS DOUBLE)) AS must_total_mw\nFROM {source}\nWHERE dat_verificada IS NOT NULL\n  AND ceg IS\
          \ NOT NULL\nGROUP BY 1\nORDER BY 1"
        output_unit: MW
        matches:
          output_modes:
          - time_series
          - total
          metrics:
          - must
          grain: month
      usinas_cpsa_elegiveis:
        template: "SELECT ceg, nom_conjunto, cod_pontoconexao,\n  TRY_CAST(val_must AS DOUBLE) AS must_mw\n\
          FROM {source}\nWHERE dat_verificada IS NOT NULL\n  AND ceg IS NOT NULL\n  AND flg_cpsa = 1.0\n\
          ORDER BY ceg"
        output_unit: lista
        matches:
          output_modes:
          - listing
          metrics:
          - flg_cpsa
          grain: usina
      contagem_cpsa_por_conjunto:
        template: "SELECT nom_conjunto,\n  COUNT(CASE WHEN flg_cpsa = 1.0 THEN 1 END) AS usinas_cpsa,\n\
          \  COUNT(flg_cpsa) AS total_usinas_validas,\n  COUNT(CASE WHEN flg_cpsa = 1.0 THEN 1 END) *\
          \ 1.0 / COUNT(flg_cpsa) AS taxa_cpsa\nFROM {source}\nWHERE dat_verificada IS NOT NULL\n  AND\
          \ nom_conjunto IS NOT NULL\nGROUP BY nom_conjunto\nORDER BY nom_conjunto"
        output_unit: usinas / proporcao
        matches:
          output_modes:
          - comparison
          - count_eligible
          metrics:
          - flg_cpsa
          grain: nom_conjunto
    ambiguity_policy:
      default_assumptions:
      - when: usuario pergunta sobre MUST sem especificar agregacao
        assume_metric: must
        assume_output: total
        note: MUST e capacidade contratada por usina; soma e a agregacao mais util para visao de portfolio
      - when: usuario pergunta quais usinas prestam CPSA sem especificar periodo
        assume_metric: flg_cpsa
        assume_output: count_eligible
        note: Filtrar WHERE dat_verificada IS NOT NULL AND ceg IS NOT NULL AND flg_cpsa = 1.0
      - when: usuario pergunta sobre sandbox de reativos sem especificar metrica
        assume_metric: flg_cpsa
        assume_output: count_eligible
        note: Pergunta generica sobre sandbox assume listagem de usinas elegiveis CPSA
      must_clarify_when:
      - trigger_terms:
        - conjunto
        - agrupamento
        question: Voce quer filtrar por conjunto especifico (Conj. Lar do Sol ou Conj. Pirapora 2) ou
          ver todos os conjuntos?
        reason: Apenas dois conjuntos existem no dataset; pode ser relevante especificar
      - trigger_terms:
        - ponto de conexao
        - barramento
        question: Voce quer filtrar por ponto de conexao especifico (MGPI2-CFLS-10 ou MGPIRDUFPPO03)?
        reason: Apenas dois pontos de conexao existem; pode ser relevante especificar
      redirect_when:
      - user_mentions:
        - nuclear
        - angra
        reason: Dataset cobre apenas usinas fotovoltaicas (UFV) no sandbox de reativos. Nenhuma coluna
          de geracao nuclear presente.
        redirect: geracao-usina-2 com filtro de combustivel/tipo nuclear
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Dataset nao contem coluna MMGD separada.
        redirect: dataset com coluna val_germmgd/val_ger_mmgd quando disponivel
      - user_mentions:
        - fator de capacidade
        - fator capacidade
        reason: Dataset nao contem dados de geracao bruta para calculo de fator de capacidade.
        redirect: fator-capacidade-2
      - user_mentions:
        - despacho
        - historico de despacho
        reason: Dataset nao contem series de despacho de energia.
        redirect: descontinuado-dados-do-historico-de-despacho-de-energia-de-01-2021-a-09-2024
- property: fewShotQueries
  value:
  - question: Quais usinas tiveram maior e menor taxa de conformidade com o CPSA durante o sandbox regulatório?
    sql: SELECT ceg, nom_conjunto, COUNT(flg_cpsa) AS horas_verificadas, SUM(CASE WHEN flg_cpsa = 1.0
      THEN 1 ELSE 0 END) AS horas_conforme, SUM(CASE WHEN flg_cpsa = 0.0 THEN 1 ELSE 0 END) AS horas_nao_conforme,
      ROUND(100.0 * SUM(CASE WHEN flg_cpsa = 1.0 THEN 1 ELSE 0 END) / NULLIF(COUNT(flg_cpsa), 0), 2) AS
      pct_conformidade FROM read_parquet('s3://ons-aws-prod-opendata/dataset/usi_servicoancilar_sandbox/*.parquet')
      WHERE ceg IS NOT NULL AND dat_verificada IS NOT NULL GROUP BY ceg, nom_conjunto ORDER BY pct_conformidade
      ASC LIMIT 100
  - question: Como evoluiu a taxa diária de conformidade das usinas com o serviço ancilar de reativo ao
      longo do período do sandbox?
    sql: SELECT dat_verificada, COUNT(DISTINCT ceg) AS usinas_verificadas, COUNT(flg_cpsa) AS registros_validos,
      SUM(CASE WHEN flg_cpsa = 1.0 THEN 1 ELSE 0 END) AS conformes, SUM(CASE WHEN flg_cpsa = 0.0 THEN
      1 ELSE 0 END) AS nao_conformes, ROUND(100.0 * SUM(CASE WHEN flg_cpsa = 1.0 THEN 1 ELSE 0 END) /
      NULLIF(COUNT(flg_cpsa), 0), 2) AS pct_conformidade_diaria FROM read_parquet('s3://ons-aws-prod-opendata/dataset/usi_servicoancilar_sandbox/*.parquet')
      WHERE dat_verificada IS NOT NULL AND ceg IS NOT NULL GROUP BY dat_verificada ORDER BY dat_verificada
  - question: Qual é o valor médio de MUST (Mínimo de Suporte de Tensão) exigido para cada conjunto de
      usinas no sandbox?
    sql: SELECT nom_conjunto, COUNT(DISTINCT ceg) AS usinas_no_conjunto, ROUND(AVG(TRY_CAST(val_must AS
      DOUBLE)), 2) AS must_medio_mvar, ROUND(MIN(TRY_CAST(val_must AS DOUBLE)), 2) AS must_minimo_mvar,
      ROUND(MAX(TRY_CAST(val_must AS DOUBLE)), 2) AS must_maximo_mvar FROM read_parquet('s3://ons-aws-prod-opendata/dataset/usi_servicoancilar_sandbox/*.parquet')
      WHERE nom_conjunto IS NOT NULL AND ceg IS NOT NULL AND TRY_CAST(val_must AS DOUBLE) IS NOT NULL
      GROUP BY nom_conjunto ORDER BY must_medio_mvar DESC
