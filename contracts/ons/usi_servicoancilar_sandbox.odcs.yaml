      - código ponto de conexão
      - ponto de interligação
      - barramento de conexão
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - MGPI2-CFLS-10
      - MGPIRDUFPPO03
  - name: ceg
    physicalType: VARCHAR
    logicalType: string
    description: Código de Empreendimento de Geração — identificador único da usina conforme cadastro
      ANEEL/ONS, utilizado para joins com datasets de cadastro de usinas
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - código de empreendimento de geração
      - código da usina
      - identificador da usina
      - CEG
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - UFV.RS.MG.032339-0
      - UFV.RS.MG.032340-3
      - UFV.RS.MG.032341-1
      - UFV.RS.MG.033185-6
      - UFV.RS.MG.033186-4
      - UFV.RS.MG.033187-2
      - UFV.RS.MG.033188-0
      - UFV.RS.MG.033189-9
      - UFV.RS.MG.033190-2
      - UFV.RS.MG.033192-9
      - UFV.RS.MG.033193-7
      - UFV.RS.MG.037830-5
      - UFV.RS.MG.037831-3
      - UFV.RS.MG.037836-4
      - UFV.RS.MG.037837-2
      - UFV.RS.MG.037838-0
      - UFV.RS.MG.037839-9
  - name: nom_conjunto
    physicalType: VARCHAR
    logicalType: string
    description: Nome do conjunto ou agrupamento ao qual a usina pertence no contexto do sandbox regulatório
      de suporte de reativos
    customProperties:
    - property: aliases
      value:
      - nome do conjunto
      - conjunto de usinas
      - agrupamento
      - nome conjunto
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Conj. Lar do Sol
      - Conj. Pirapora 2
  - name: val_must
    physicalType: VARCHAR
    logicalType: string
    description: Valor de MUST (Montante de Uso do Sistema de Transmissão) associado à usina, armazenado
      como VARCHAR no Parquet devido ao formato de serialização.0
    customProperties:
    - property: castExpression
      value: TRY_CAST(val_must AS DOUBLE)
    - property: enum
      value:
      - '328'
      - 328,000
      - 481,1
      - 481,100
  - name: flg_cpsa
    physicalType: VARCHAR
    logicalType: number
    description: Flag binária indicando se a usina presta Compensação de Potência Reativa (CPSA) como
      serviço ancilar; 1.0 = presta CPSA, 0.0 = não presta CPSA
    customProperties:
    - property: castExpression
      value: TRY_CAST(flg_cpsa AS DOUBLE)
    - property: aliases
      value:
      - flag CPSA
      - compensação de potência reativa
      - indicador CPSA
      - presta serviço ancilar de reativo
    - property: semanticType
      value: FLAG
    - property: enum
      value:
      - 0.0
      - 1.0
  - name: dsc_comentario
    physicalType: VARCHAR
    logicalType: number
    description: Campo de comentário descritivo sobre a usina ou sua participação no sandbox; atualmente
      nulos em todas as linhas — sem utilidade analítica no estado atual
    customProperties:
    - property: castExpression
      value: TRY_CAST(dsc_comentario AS DOUBLE)
    - property: aliases
      value:
      - comentário
      - descrição
      - observação
      - nota
