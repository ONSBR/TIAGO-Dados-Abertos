          \ 1.0 / COUNT(flg_cpsa) AS taxa_cpsa\nFROM {source}\nWHERE dat_verificada IS NOT NULL\n  AND\
          \ nom_conjunto IS NOT NULL\nGROUP BY nom_conjunto\nORDER BY nom_conjunto"
        output_unit: usinas / proporcao
        matches:
          output_modes:
          - comparison
          - count_eligible
          metrics:
          - flg_cpsa
          grain: nom_conjunto
- property: fewShotQueries
  value:
  - question: Quais usinas tiveram maior e menor taxa de conformidade com o CPSA durante o sandbox regulatório?
    sql: SELECT ceg, nom_conjunto, COUNT(flg_cpsa) AS horas_verificadas, SUM(CASE WHEN flg_cpsa = 1.0
      THEN 1 ELSE 0 END) AS horas_conforme, SUM(CASE WHEN flg_cpsa = 0.0 THEN 1 ELSE 0 END) AS horas_nao_conforme,
      ROUND(100.0 * SUM(CASE WHEN flg_cpsa = 1.0 THEN 1 ELSE 0 END) / NULLIF(COUNT(flg_cpsa), 0), 2) AS
      pct_conformidade FROM read_parquet('s3://ons-aws-prod-opendata/dataset/usi_servicoancilar_sandbox/*.parquet')
      WHERE ceg IS NOT NULL AND dat_verificada IS NOT NULL GROUP BY ceg, nom_conjunto ORDER BY pct_conformidade
      ASC LIMIT 100
  - question: Como evoluiu a taxa diária de conformidade das usinas com o serviço ancilar de reativo ao
      longo do período do sandbox?
    sql: SELECT dat_verificada, COUNT(DISTINCT ceg) AS usinas_verificadas, COUNT(flg_cpsa) AS registros_validos,
      SUM(CASE WHEN flg_cpsa = 1.0 THEN 1 ELSE 0 END) AS conformes, SUM(CASE WHEN flg_cpsa = 0.0 THEN
      1 ELSE 0 END) AS nao_conformes, ROUND(100.0 * SUM(CASE WHEN flg_cpsa = 1.0 THEN 1 ELSE 0 END) /
      NULLIF(COUNT(flg_cpsa), 0), 2) AS pct_conformidade_diaria FROM read_parquet('s3://ons-aws-prod-opendata/dataset/usi_servicoancilar_sandbox/*.parquet')
      WHERE dat_verificada IS NOT NULL AND ceg IS NOT NULL GROUP BY dat_verificada ORDER BY dat_verificada
  - question: Qual é o valor médio de MUST (Mínimo de Suporte de Tensão) exigido para cada conjunto de
      usinas no sandbox?
    sql: SELECT nom_conjunto, COUNT(DISTINCT ceg) AS usinas_no_conjunto, ROUND(AVG(TRY_CAST(val_must AS
      DOUBLE)), 2) AS must_medio_mvar, ROUND(MIN(TRY_CAST(val_must AS DOUBLE)), 2) AS must_minimo_mvar,
      ROUND(MAX(TRY_CAST(val_must AS DOUBLE)), 2) AS must_maximo_mvar FROM read_parquet('s3://ons-aws-prod-opendata/dataset/usi_servicoancilar_sandbox/*.parquet')
      WHERE nom_conjunto IS NOT NULL AND ceg IS NOT NULL AND TRY_CAST(val_must AS DOUBLE) IS NOT NULL
      GROUP BY nom_conjunto ORDER BY must_medio_mvar DESC
