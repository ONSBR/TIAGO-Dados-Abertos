customProperties:
- property: vectorTags
  value:
  - sandbox de reativos
  - usinas no programa cpsa
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver elegibilidade ou participação de usinas no
    programa sandbox regulatório de compensação de reativo (CPSA) do ONS. Também relevante para perguntas
    sobre MUST de usinas prestadoras de serviço ancilar de suporte de tensão ou identificação de pontos
    de conexão no contexto do sandbox piloto de reativos.
- property: agentInstructions
  value: '- [val_must] Coluna val_must armazenada como VARCHAR no Parquet devido ao formato de serialização.
    Contém valores numéricos (Mvar) que não podem ser diretamente agregados. Todas as operações aritméticas
    e de agregação requerem conversão explícita via TRY_CAST.


    - [dsc_comentario] Coluna dsc_comentario possui 100% de valores nulos em todo o período disponível
    (2026-01-01 a 2026-05-11). Coluna sem dados úteis — não deve ser utilizada em análises, filtros ou
    joins. Adicionalmente, o tipo DOUBLE é inconsistente com o propósito descritivo textual da coluna.


    - [dat_verificada] Aproximadamente 59% das linhas possuem dat_verificada nula, correspondendo a ~227
    linhas-fantasma de exportação sem dados válidos. Apenas ~158 registros (~41%) contêm dados reais.
    Filtros por NOT NULL são obrigatórios antes de qualquer análise temporal ou agregação.


    - [hor_verificada] Coluna hor_verificada possui ~59% de nulos, alinhado com o padrão de linhas-fantasma
    do dataset. Sem hor_verificada válida, não é possível determinar a granularidade horária do registro.
    Deve ser filtrada com NOT NULL em conjunto com dat_verificada.


    - [ceg] Coluna ceg (identificador canônico de usina) possui ~59% de nulos, impossibilitando joins
    com cadastros de usinas para as linhas-fantasma. Qualquer análise por usina deve filtrar WHERE ceg
    IS NOT NULL para evitar distorções nos resultados.


    - [cod_pontoconexao] Coluna cod_pontoconexao possui ~59% de nulos, consistente com o padrão de linhas-fantasma.
    Joins com datasets de topologia de rede devem filtrar WHERE cod_pontoconexao IS NOT NULL para garantir
    integridade referencial.


    - [nom_conjunto] Coluna nom_conjunto possui ~59% de nulos, alinhado com o padrão geral do dataset.
    Análises por conjunto de usinas devem filtrar WHERE nom_conjunto IS NOT NULL.


    - [flg_cpsa] Flag de conformidade CPSA possui ~59% de nulos, consistente com linhas-fantasma. Cálculos
    de taxa de conformidade devem usar COUNT(flg_cpsa) no denominador (não COUNT(*)) para evitar distorção
    pela inclusão de nulos.


    - [cod_pontoconexao] Valores com trailing spaces detectados em ''cod_pontoconexao''. Use TRIM() em
    filtros WHERE para evitar perda de registros.'
- property: typicalQuestions
  value:
  - Quais usinas estão participando do sandbox regulatório de compensação de reativo?
  - Quais usinas prestam serviço de CPSA (Compensação de Potência Reativa) no sandbox ONS?
  - Qual o MUST total das usinas participantes do sandbox de reativos?
  - Quantas usinas por conjunto estão no sandbox regulatório de suporte de tensão?
  - Quais são os pontos de conexão das usinas elegíveis ao sandbox de reativos?
- property: granularity
  value: mensal
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/usi_servicoancilar_sandbox/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2026-01-01'
- property: semantics
  value:
    temporal_perspective: verificado
    row_grain:
      temporal: 1 semana
      temporal_column: dat_verificada
      spatial: usina
      entity: usina
      one_row_per:
      - dat_verificada
      - ceg
      - hor_verificada
      - cod_pontoconexao
    dimension_columns:
      subsistema: null
      fonte: null
      usina: ceg
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: must
      label: Must
      columns:
      - val_must
      expression: TRY_CAST(val_must AS DOUBLE)
      quantity_kind: capacity
      unit_native: MW
      default_aggregation: sum
      forbidden_aggregations: []
      valid_intents:
      - must
      - MUST
      - montante de uso do sistema de transmissão
      - valor MUST
      - capacidade contratada
      aggregation_modes:
        total:
          sql: SUM(TRY_CAST(val_must AS DOUBLE))
          unit: MW
        average:
          sql: AVG(TRY_CAST(val_must AS DOUBLE))
          unit: MW
        maximum:
          sql: MAX(TRY_CAST(val_must AS DOUBLE))
          unit: MW
        time_series:
          sql: SUM(TRY_CAST(val_must AS DOUBLE))
          unit: MW
        ranking:
          sql: SUM(TRY_CAST(val_must AS DOUBLE))
          unit: MW
        comparison:
          sql: SUM(TRY_CAST(val_must AS DOUBLE))
          unit: MW
      interval_hours: 168.0
      aliases:
      - MUST
      - montante de uso do sistema de transmissão
      - valor MUST
      - capacidade contratada
    - id: flg_cpsa
      label: Flag CPSA
      columns:
      - flg_cpsa
      expression: flg_cpsa
      quantity_kind: flag
      unit_native: binario
      default_aggregation: count_nonzero
      forbidden_aggregations:
      - sum
      - avg
      valid_intents:
      - cpsa
      - CPSA
      - compensacao de potencia reativa
      - presta servico ancilar de reativo
      - flag cpsa
      - indicador cpsa
      aggregation_modes:
        count_eligible:
          sql: COUNT(CASE WHEN flg_cpsa = 1.0 THEN 1 END)
          unit: usinas
        count_not_eligible:
          sql: COUNT(CASE WHEN flg_cpsa = 0.0 THEN 1 END)
          unit: usinas
        rate_eligible:
          sql: COUNT(CASE WHEN flg_cpsa = 1.0 THEN 1 END) * 1.0 / COUNT(flg_cpsa)
          unit: proporcao
      interval_hours: 168.0
      aliases:
      - flag CPSA
      - compensacao de potencia reativa
      - indicador CPSA
      - presta servico ancilar de reativo
    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: true
      supports_ranking: true
      primary_use_case: serie_temporal
    selection_policy:
      covers_metrics:
      - must
      - flg_cpsa
      preferred_for:
      - sandbox regulatorio reativo
      - elegibilidade CPSA
      - compensacao potencia reativa sandbox
      - MUST sandbox ONS
      - servico ancilar suporte tensao sandbox
      - habilitacao reativo piloto
      - programa piloto reativos ONS
      - usinas prestadoras CPSA
      - montante uso transmissao sandbox
