    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: true
      supports_ranking: true
      primary_use_case: serie_temporal
    selection_policy:
      preferred_for:
      - RMAL subsistema
      - RMCS rede basica
      - RRB contingencia simples
      - RRBCS robustez
      - robustez malha sistemica
      - perturbacoes por faixa MW
      - corte de carga 0 a 50 MW
      - corte de carga 50 a 100 MW
      - corte de carga acima 100 MW
      - num_perturbacoes transmissao
      - submodulo 9.1 robustez
      covers_metrics:
      - indicador
      - num_perturbacoes
      - num_perturbacoescortecarga
      - num_perturbacoescortecarga_0a50mw
      - num_perturbacoescortecarga_50a100mw
      - num_perturbacoescortecarga_maior100mw
      not_preferred_for:
      - energia nao suprida
      - carga interrompida MW
      - CIPER
      - DREQ
      - FREQ
      - indisponibilidade equipamento
      - severidade perturbacao
      - usina individual
      - geracao nuclear
      - MMGD
      - CEG
      - preco energia
      - despacho
    value_aliases:
      cod_indicador:
        RMAL:
          aliases:
          - RMAL
          - robustez malha sistemica
          - robustez da malha
          filter: cod_indicador = 'RMAL'
        RMCS:
          aliases:
          - RMCS
          - robustez malha contingencia simples
          - malha contingencia simples
          filter: cod_indicador = 'RMCS'
        RRB:
          aliases:
          - RRB
          - robustez rede basica
          - rede basica
          filter: cod_indicador = 'RRB'
        RRBCS:
          aliases:
          - RRBCS
          - robustez rede basica contingencia simples
          - rede basica contingencia simples
          filter: cod_indicador = 'RRBCS'
      dsc_agregacao:
        Estado:
          aliases:
          - estado
          - UF
          - unidade federativa
          filter: dsc_agregacao = 'Estado'
        Regiao Geografica:
          aliases:
          - regiao geografica
          - regiao
          - norte
          - sul
          - nordeste
          - sudeste
          - centro-oeste
          filter: dsc_agregacao = 'Região Geográfica'
        Sistema:
          aliases:
          - sistema
          - SIN
          - sistema brasileiro
          - sistema interligado nacional
          filter: dsc_agregacao = 'Sistema'
        Subsistema:
          aliases:
          - subsistema
          - SE
          - S
          - NE
          - N
          filter: dsc_agregacao = 'Subsistema'
      id_periodicidade:
        AN:
          aliases:
          - anual
          - AN
          - por ano
          - ano
          filter: id_periodicidade = 'AN'
        ME:
          aliases:
          - mensal
          - ME
          - por mes
          - mes
          filter: id_periodicidade = 'ME'
    sql_patterns:
      indicador_serie_anual:
        template: "SELECT\n  EXTRACT(YEAR FROM TRY_CAST(din_referencia AS TIMESTAMP)) AS ano,\n  cod_indicador,\n\
          \  dsc_caracteristica,\n  AVG(val_indicador) AS indicador_medio_pct\nFROM {source}\nWHERE id_periodicidade\
          \ = 'AN'\n  AND cod_indicador = '{cod_indicador}'\n  AND dsc_agregacao = '{dsc_agregacao}'\n\
          GROUP BY 1, 2, 3\nORDER BY 1\n"
        output_unit: '%'
        matches:
          output_modes:
          - time_series
          metrics:
          - indicador
          grain: year
        validated_params:
          cod_indicador: RRB
          dsc_agregacao: Estado
      perturbacoes_corte_carga_sin:
        template: "SELECT\n  EXTRACT(YEAR FROM TRY_CAST(din_referencia AS TIMESTAMP)) AS ano,\n  SUM(num_perturbacoescortecarga)\
          \ AS total_cortes,\n  SUM(num_perturbacoescortecarga_0a50mw) AS cortes_0a50mw,\n  SUM(num_perturbacoescortecarga_50a100mw)\
          \ AS cortes_50a100mw,\n  SUM(num_perturbacoescortecarga_maior100mw) AS cortes_maior100mw\nFROM\
          \ {source}\nWHERE id_periodicidade = 'AN'\n  AND dsc_agregacao = 'Sistema'\nGROUP BY 1\nORDER\
          \ BY 1\n"
        output_unit: ocorrencias
        matches:
          output_modes:
          - total
          metrics:
          - num_perturbacoescortecarga
          - num_perturbacoescortecarga_0a50mw
          - num_perturbacoescortecarga_50a100mw
          - num_perturbacoescortecarga_maior100mw
          grain: year
      proporcao_corte_vs_total:
        template: "SELECT\n  EXTRACT(YEAR FROM TRY_CAST(din_referencia AS TIMESTAMP)) AS ano,\n  cod_caracteristica,\n\
          \  SUM(num_perturbacoescortecarga) AS cortes,\n  SUM(num_perturbacoes) AS total,\n  ROUND(100.0\
          \ * SUM(num_perturbacoescortecarga) / NULLIF(SUM(num_perturbacoes), 0), 2) AS pct_corte\nFROM\
          \ {source}\nWHERE id_periodicidade = 'AN'\n  AND dsc_agregacao = 'Subsistema'\nGROUP BY 1, 2\n\
          ORDER BY 1, 2\n"
        output_unit: '%'
        matches:
          output_modes:
          - comparison
          metrics:
          - num_perturbacoes
          - num_perturbacoescortecarga
          grain: year
    ambiguity_policy:
      default_assumptions:
      - when: usuario pergunta sobre indicador sem especificar cod_indicador
        assume_metric: indicador
        assume_output: average
        note: Retornar todos os cod_indicador (RMAL, RMCS, RRB, RRBCS) ou pedir esclarecimento se contexto
          nao indicar qual.
      - when: usuario pergunta sobre perturbacoes sem especificar faixa de MW
        assume_metric: num_perturbacoes
        assume_output: total
        note: Usar num_perturbacoes (total geral). Se usuario mencionar corte de carga, usar num_perturbacoescortecarga.
      - when: usuario nao especifica periodicidade
        assume_metric: indicador
        assume_output: average
        note: Assumir id_periodicidade = 'AN' para evitar duplicatas. Alertar usuario se analise mensal
          for necessaria.
      - when: usuario pergunta sobre SIN ou Brasil sem especificar agregacao
        assume_metric: indicador
        assume_output: average
        note: Filtrar dsc_agregacao = 'Sistema' para nivel nacional.
      must_clarify_when:
      - ambiguity: periodicidade_nao_especificada_em_analise_mensal
        question: Voce quer dados mensais (ME) ou anuais (AN)? Registros de ambas as periodicidades coexistem
          para o mesmo periodo e podem gerar duplicatas se nao filtrados.
        trigger_terms:
        - janeiro
        - fevereiro
        - marco
        - abril
        - maio
        - junho
        - julho
        - agosto
        - setembro
        - outubro
        - novembro
        - dezembro
        - mensal
        - mes a mes
      - ambiguity: indicador_nao_especificado
        question: Qual indicador de robustez voce quer analisar? RMAL (Robustez da Malha Sistemica), RMCS
          (Robustez da Malha para Contingencias Simples), RRB (Robustez da Rede Basica) ou RRBCS (Robustez
          da Rede Basica para Contingencias Simples)?
        trigger_terms:
        - indicador de robustez
        - robustez
        - qual indicador
      - ambiguity: agregacao_geografica_ambigua
        question: 'Voce quer o indicador para qual nivel geografico: Sistema (SIN), Subsistema (SE, S,
          NE, N), Regiao Geografica ou Estado?'
        trigger_terms:
        - nordeste
        - norte
        - sul
        - sudeste
        - centro-oeste
      redirect_when:
      - user_mentions:
        - energia nao suprida
        - ENS
        reason: Energia nao suprida pertence ao dataset ind_confiarb_energianaosuprida.
        redirect: ind_confiarb_energianaosuprida
      - user_mentions:
        - carga interrompida
        - CIPER
        - MW interrompido
        reason: Carga interrompida em MW pertence ao dataset ind_confiarb_ciper.
        redirect: ind_confiarb_ciper
      - user_mentions:
        - severidade
        - classificacao de severidade
        reason: Indicadores de severidade de perturbacoes pertencem ao dataset ind_confiarb_severidade.
        redirect: ind_confiarb_severidade
      - user_mentions:
        - DREQ
        - FREQ
        - indisponibilidade
        - desligamento de equipamento
        reason: Indicadores DREQ e FREQ pertencem ao dataset ind_confiarb_dreq_freq.
        redirect: ind_confiarb_dreq_freq
      - user_mentions:
        - usina
        - ceg
        - itaipu
        - belo monte
        reason: Schema nao contem identificador de usina. Redirecionar para dataset de geracao por usina.
        redirect: geracao-usina-2
      - user_mentions:
        - nuclear
        - angra
        reason: Schema nao contem dimensao nuclear separada.
        redirect: geracao-usina-2
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Schema nao contem coluna MMGD.
        redirect: dataset com coluna val_germmgd quando disponivel
      critical_filters:
        id_periodicidade:
          warning: Sempre filtrar id_periodicidade (AN ou ME) para evitar duplicatas. Registros mensais
            e anuais coexistem para o mesmo din_referencia no primeiro mes de cada ano.
          default: AN
        agregacao_sin:
          warning: Para nivel nacional, usar dsc_agregacao = 'Sistema'. Nao somar registros de diferentes
            niveis de agregacao (Sistema + Subsistema + Estado) pois gera dupla contagem.
          exclude_in_aggregation:
          - Sistema
- property: fewShotQueries
  value:
  - question: Como evoluiu o indicador RMAL mensalmente para cada subsistema nos últimos 3 anos?
    sql: SELECT dsc_agregacao, DATE_TRUNC('month', TRY_CAST(din_referencia AS TIMESTAMP)) AS mes_referencia,
      AVG(val_indicador) AS media_rmal, MIN(val_indicador) AS minimo_rmal, MAX(val_indicador) AS maximo_rmal
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_robustez/*.parquet') WHERE cod_indicador
      = 'RMAL' AND id_periodicidade = 'ME' AND din_referencia >= TIMESTAMP '2023-01-01' AND dsc_agregacao
      NOT IN ('SIN') GROUP BY dsc_agregacao, DATE_TRUNC('month', TRY_CAST(din_referencia AS TIMESTAMP))
      ORDER BY dsc_agregacao, mes_referencia
  - question: Quais subsistemas tiveram mais perturbações com corte de carga acima de 100 MW em 2023?
    sql: SELECT dsc_agregacao, cod_indicador, SUM(num_perturbacoescortecarga_maior100mw) AS total_cortes_graves,
      SUM(num_perturbacoescortecarga) AS total_cortes_carga, SUM(num_perturbacoes) AS total_perturbacoes,
      ROUND( 100.0 * SUM(num_perturbacoescortecarga_maior100mw) / NULLIF(SUM(num_perturbacoes), 0), 2
      ) AS pct_cortes_graves FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_robustez/*.parquet')
      WHERE id_periodicidade = 'ME' AND din_referencia >= TIMESTAMP '2023-01-01' AND din_referencia <
      TIMESTAMP '2024-01-01' AND dsc_agregacao NOT IN ('SIN') GROUP BY dsc_agregacao, cod_indicador ORDER
      BY total_cortes_graves DESC LIMIT 20
  - question: Em quais meses o indicador de robustez da rede básica atingiu zero no SIN?
    sql: SELECT cod_indicador, cod_caracteristica, dsc_caracteristica, din_referencia, val_indicador,
      num_perturbacoes, num_perturbacoescortecarga FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_robustez/*.parquet')
      WHERE val_indicador = 0.0 AND dsc_agregacao = 'SIN' AND id_periodicidade = 'ME' ORDER BY cod_indicador,
      din_referencia
