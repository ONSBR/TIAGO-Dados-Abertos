  quality:
  - type: custom
    engine: soda
    implementation: "checks for ind_confiarb_robustez:\n  - row_count > 0:\n      name: Tabela não pode\
      \ estar vazia\n\n  # Referential integrity\n  - invalid_count(cod_indicador) = 0:\n      valid values:\n\
      \        - 'RMAL'\n        - 'RMCS'\n        - 'RRB'\n        - 'RRBCS'\n      name: cod_indicador\
      \ deve ser um dos valores válidos\n  - invalid_count(dsc_agregacao) = 0:\n      valid values:\n\
      \        - 'Estado'\n        - 'Região Geográfica'\n        - 'Sistema'\n        - 'Subsistema'\n\
      \      name: dsc_agregacao deve ser um dos valores válidos\n  - invalid_count(cod_caracteristica)\
      \ = 0:\n      valid values:\n        - 'AC'\n        - 'AL'\n        - 'AM'\n        - 'AP'\n  \
      \      - 'BA'\n        - 'CE'\n        - 'CO'\n        - 'DF'\n        - 'ES'\n        - 'GO'\n\
      \        - 'MA'\n        - 'MG'\n        - 'MS'\n        - 'MT'\n        - 'N'\n        - 'NE'\n\
      \        - 'PA'\n        - 'PB'\n        - 'PE'\n        - 'PI'\n        - 'PR'\n        - 'RJ'\n\
      \        - 'RN'\n        - 'RO'\n        - 'RR'\n        - 'RS'\n        - 'S'\n        - 'SBR'\n\
      \        - 'SC'\n        - 'SE'\n        - 'SP'\n        - 'TO'\n      name: cod_caracteristica\
      \ deve ser um dos valores válidos\n  - invalid_count(dsc_caracteristica) = 0:\n      valid values:\n\
      \        - 'ACRE'\n        - 'ALAGOAS'\n        - 'AMAPA'\n        - 'AMAZONAS'\n        - 'BAHIA'\n\
      \        - 'CEARA'\n        - 'Centro-Oeste'\n        - 'DISTRITO FEDERAL'\n        - 'ESPIRITO\
      \ SANTO'\n        - 'GOIAS'\n        - 'MARANHAO'\n        - 'MATO GROSSO'\n        - 'MATO GROSSO\
      \ DO SUL'\n        - 'MINAS GERAIS'\n        - 'NORDESTE'\n        - 'NORTE'\n        - 'Nordeste'\n\
      \        - 'Norte'\n        - 'PARA'\n        - 'PARAIBA'\n        - 'PARANA'\n        - 'PERNAMBUCO'\n\
      \        - 'PIAUI'\n        - 'RIO DE JANEIRO'\n        - 'RIO GRANDE DO NORTE'\n        - 'RIO\
      \ GRANDE DO SUL'\n        - 'RONDONIA'\n        - 'RORAIMA'\n        - 'SANTA CATARINA'\n      \
      \  - 'SAO PAULO'\n        - 'SERGIPE'\n        - 'SUDESTE'\n        - 'SUL'\n        - 'Sistema\
      \ Brasileiro'\n        - 'Sudeste'\n        - 'Sul'\n        - 'TOCANTINS'\n      name: dsc_caracteristica\
      \ deve ser um dos valores válidos\n  - invalid_count(id_periodicidade) = 0:\n      valid values:\n\
      \        - 'AN'\n        - 'ME'\n      name: id_periodicidade deve ser um dos valores válidos\n\n\
      \  # Baseline de volume — margem ±20% do row_count validado\n  - row_count between 29718 and 44577:\n\
      \      name: Volume esperado entre 29,718 e 44,577 registros\n\n  # Unicidade da chave primária\
      \ composta ['cod_indicador', 'dsc_agregacao', 'cod_caracteristica', 'id_periodicidade', 'din_referencia']\
      \ (candidata LLM)\n  - failed rows:\n      name: Chave composta (cod_indicador, dsc_agregacao, cod_caracteristica,\
      \ id_periodicidade, din_referencia) não deve ter duplicatas\n      fail query: |\n        SELECT\
      \ * FROM ind_confiarb_robustez\n        WHERE (cod_indicador, dsc_agregacao, cod_caracteristica,\
      \ id_periodicidade, din_referencia) IN (\n          SELECT cod_indicador, dsc_agregacao, cod_caracteristica,\
      \ id_periodicidade, din_referencia FROM ind_confiarb_robustez\n          GROUP BY cod_indicador,\
      \ dsc_agregacao, cod_caracteristica, id_periodicidade, din_referencia\n          HAVING COUNT(*)\
      \ > 1\n        )\n\n  # Freshness: din_referencia deve ter dados recentes (SLA: Atualizado diariamente)\n\
      \  - freshness(din_referencia) < 3d:\n      name: din_referencia não pode ter dados com mais de\
      \ 3 dias de atraso\n"
team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/ind_confiarb_robustez
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - quantas perturbacoes houve
  - perturbacoes com corte de carga
  - robustez da rede
  - eventos na rede basica
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver indicadores de robustez da rede básica de transmissão
    (RMAL, RMCS, RRB, RRBCS), análise de perturbações com ou sem corte de carga por subsistema, região
    ou estado, ou avaliação de confiabilidade da transmissão conforme Submódulo 9.1 dos Procedimentos
    de Rede do ONS. Também relevante para perguntas sobre severidade de eventos de transmissão segmentados
    por faixa de MW interrompido.
- property: agentInstructions
  value: '- [num_perturbacoescortecarga] A soma das perturbações por faixa de MW (num_perturbacoescortecarga_0a50mw
    + num_perturbacoescortecarga_50a100mw + num_perturbacoescortecarga_maior100mw) pode não ser igual
    a num_perturbacoescortecarga em todos os registros, pois registros de agregações superiores (SIN)
    consolidam os valores das agregações inferiores. Verificar consistência aritmética antes de somar
    faixas.


    - [val_indicador] Existem registros com val_indicador igual a 0.0, o que representa ausência total
    de robustez. Embora tecnicamente válido, valores zero podem indicar períodos críticos ou problemas
    de apuração. O mínimo observado é 0.0 e o máximo é 100.0. Recomenda-se verificar contexto dos registros
    com valor zero.


    - [id_periodicidade] Registros mensais e anuais coexistem no dataset com a mesma din_referencia para
    o primeiro mês de cada ano (ex: 2024-01-01 pode aparecer como registro mensal de janeiro e como registro
    anual de 2024). Filtros sem id_periodicidade podem gerar duplicatas em análises temporais e distorcer
    agregações.


    - [num_perturbacoes] O valor máximo de num_perturbacoes é 3844, que ocorre em agregações de nível
    superior (SIN ou subsistemas maiores) e/ou periodicidade anual. Ao filtrar apenas por periodicidade
    mensal e agregação SIN, verificar se valores extremos são esperados ou indicam erro de consolidação.


    - [din_referencia] O dataset cobre 2007-01-01 a 2026-04-01. Podem existir lacunas temporais para combinações
    específicas de cod_indicador, dsc_agregacao e cod_caracteristica, especialmente em agregações por
    Estado que podem ter sido incorporadas ao monitoramento em datas posteriores a 2007.

    '
- property: typicalQuestions
  value:
  - Qual foi a evolução do indicador RRB para o subsistema Sudeste/Centro-Oeste nos últimos 12 meses?
  - Quais subsistemas apresentaram menor robustez da rede básica (RRBCS) em 2023?
  - Quantas perturbações com corte de carga acima de 100 MW ocorreram no SIN em 2024?
  - Como o indicador RMAL variou anualmente entre 2010 e 2025 para o subsistema Sul?
  - Qual a proporção de perturbações com corte de carga em relação ao total de perturbações por subsistema
    no último ano disponível?
- property: granularity
  value: anual
- property: spatialGranularity
  value: nacional
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_robustez/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2007-01-01'
- property: semantics
  value:
    temporal_perspective: verificado
    row_grain:
      temporal: 1 ano
      temporal_column: din_referencia
      spatial: nacional
      entity: dataset_row
      one_row_per:
      - din_referencia
      - cod_indicador
      - dsc_agregacao
      - cod_caracteristica
      - id_periodicidade
    dimension_columns:
      subsistema: null
      fonte: null
      usina: null
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: indicador
      label: Indicador de Robustez
      columns:
      - val_indicador
      expression: val_indicador
      quantity_kind: ratio
      unit_native: '%'
      default_aggregation: avg
      forbidden_aggregations:
      - sum
      valid_intents:
      - indicador de robustez
      - percentual de robustez
      - RMAL
      - RMCS
      - RRB
      - RRBCS
      - robustez da malha sistemica
      - robustez da rede basica
      aggregation_modes:
        average:
          sql: AVG(val_indicador)
          unit: '%'
        maximum:
          sql: MAX(val_indicador)
          unit: '%'
        minimum:
          sql: MIN(val_indicador)
          unit: '%'
        time_series:
          sql: AVG(val_indicador)
          unit: '%'
        ranking:
          sql: AVG(val_indicador)
          unit: '%'
        comparison:
          sql: AVG(val_indicador)
          unit: '%'
      interval_hours: 8760.0
      aliases:
      - valor do indicador
      - indicador de robustez
      - percentual de robustez
      - RMAL
      - RMCS
      - RRB
      - RRBCS
    - id: num_perturbacoes
      label: Total de Perturbacoes
      columns:
      - num_perturbacoes
      expression: num_perturbacoes
      quantity_kind: count
      unit_native: ocorrencias
      default_aggregation: sum
      forbidden_aggregations: []
      valid_intents:
      - numero de perturbacoes
      - total de perturbacoes
      - quantidade de perturbacoes
      - ocorrencias
      - disturbios
      aggregation_modes:
        total:
          sql: SUM(num_perturbacoes)
          unit: ocorrencias
        average:
          sql: AVG(num_perturbacoes)
          unit: ocorrencias
        maximum:
          sql: MAX(num_perturbacoes)
          unit: ocorrencias
        time_series:
          sql: SUM(num_perturbacoes)
          unit: ocorrencias
        ranking:
          sql: SUM(num_perturbacoes)
          unit: ocorrencias
        comparison:
          sql: SUM(num_perturbacoes)
          unit: ocorrencias
      interval_hours: 8760.0
      aliases:
      - numero de perturbacoes
      - total de perturbacoes
      - ocorrencias na rede
      - disturbios na transmissao
    - id: num_perturbacoescortecarga
      label: Perturbacoes com Corte de Carga
      columns:
      - num_perturbacoescortecarga
      expression: num_perturbacoescortecarga
      quantity_kind: count
      unit_native: ocorrencias
      default_aggregation: sum
      forbidden_aggregations: []
      valid_intents:
      - perturbacoes com corte de carga
      - cortes de carga
      - interrupcoes
      - perturbacoes com interrupcao
      aggregation_modes:
        total:
          sql: SUM(num_perturbacoescortecarga)
          unit: ocorrencias
        average:
          sql: AVG(num_perturbacoescortecarga)
          unit: ocorrencias
        maximum:
          sql: MAX(num_perturbacoescortecarga)
          unit: ocorrencias
        time_series:
          sql: SUM(num_perturbacoescortecarga)
          unit: ocorrencias
        ranking:
          sql: SUM(num_perturbacoescortecarga)
          unit: ocorrencias
        comparison:
