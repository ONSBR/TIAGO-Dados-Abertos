version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:ind_confiarb_robustez
name: ind_confiarb_robustez
tenant: ons
tags:
- RMAL
- RMCS
- RRB
- RRBCS
- confiabilidade
- corte de carga
- perturbações
- rede básica
- robustez
- robustez da malha sistêmica
- robustez rede básica
- transmissão
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/ind_confiarb_robustez/*.parquet
  format: parquet
description:
  purpose: Suportar analistas de confiabilidade, planejadores do sistema elétrico e agentes regulados
    no monitoramento da robustez da rede básica frente a perturbações e contingências simples, habilitando
    decisões de planejamento de expansão da transmissão, avaliação de desempenho operacional por subsistema
    e cumprimento de critérios regulatórios de confiabilidade definidos pelo ONS no Submódulo 9.1 dos
    Procedimentos de Rede.
  limitations: A soma das perturbações por faixa de MW (num_perturbacoescortecarga_0a50mw + num_perturbacoescortecarga_50a100mw
    + num_perturbacoescortecarga_maior100mw) pode não ser igual a num_perturbacoescortecarga em todos
    os registros, possivelmente devido a perturbações sem classificação de faixa ou critérios de categorização
    distintos. Registros com val_indicador igual a 0. O dataset cobre o período de 2007-01-01 a 2026-03-01
    com granularidade mensal.
  usage: Recuperar este dataset quando a pergunta envolver indicadores de robustez da rede básica de transmissão
    (RMAL, RMCS, RRB, RRBCS), análise de perturbações com ou sem corte de carga por subsistema, região
    ou estado, ou avaliação de confiabilidade da transmissão conforme Submódulo 9.
domain: qualidade
schema:
- name: ind_confiarb_robustez
  physicalType: parquet
  logicalType: object
  physicalName: ind_confiarb_robustez
  properties:
  - name: cod_indicador
    physicalType: VARCHAR
    logicalType: string
    description: 'Código identificador do indicador de robustez. Representa um dos quatro indicadores
      definidos no Submódulo 9.1 dos Procedimentos de Rede do ONS: RMAL (Robustez da Malha Sistêmica),
      RMCS (Robustez da Malha Sistêmica para Contingências Simples), RRB (Robustez da Rede Básica) e RRBCS
      (Robustez da Rede Básica para Contingências Simples).

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - indicador
      - tipo de indicador
      - código do indicador
      - indicador de robustez
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - RMAL
      - RMCS
      - RRB
      - RRBCS
  - name: dsc_agregacao
    physicalType: VARCHAR
    logicalType: string
    description: 'Descrição do nível de agregação geográfica ao qual o registro se refere. Indica se o
      indicador é calculado para o Sistema Interligado Nacional (SIN), para um subsistema elétrico, para
      uma região geográfica ou para um estado específico.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - nível de agregação
      - agregação geográfica
      - tipo de agregação
      - escopo geográfico
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Estado
      - Região Geográfica
      - Sistema
      - Subsistema
  - name: cod_caracteristica
    physicalType: VARCHAR
    logicalType: string
    description: 'Código que identifica a característica geográfica específica dentro do nível de agregação
      definido em dsc_agregacao. Para dsc_agregacao=''Subsistema'', contém códigos como ''SE'', ''S'',
      ''NE'', ''N''; para dsc_agregacao=''SIN'', contém o código do sistema integrado; para estados, contém
      a sigla do estado.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - código da característica
      - código geográfico
      - código do subsistema
      - código da região
      - código do estado
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - AC
      - AL
      - AM
      - AP
      - BA
      - CE
      - CO
      - DF
      - ES
      - GO
      - MA
      - MG
      - MS
      - MT
      - N
      - NE
      - PA
      - PB
      - PE
      - PI
      - PR
      - RJ
      - RN
      - RO
      - RR
      - RS
      - S
      - SBR
      - SC
      - SE
      - SP
      - TO
  - name: dsc_caracteristica
    physicalType: VARCHAR
    logicalType: string
    description: 'Descrição textual da característica geográfica identificada por cod_caracteristica.
      Complementa o código com o nome completo da entidade geográfica, como o nome do subsistema, da região
      ou do estado.

      '
    customProperties:
    - property: aliases
      value:
      - descrição da característica
      - nome do subsistema
      - nome da região
      - nome do estado
      - descrição geográfica
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - ACRE
      - ALAGOAS
      - AMAPA
      - AMAZONAS
      - BAHIA
      - CEARA
      - Centro-Oeste
      - DISTRITO FEDERAL
      - ESPIRITO SANTO
      - GOIAS
      - MARANHAO
      - MATO GROSSO
      - MATO GROSSO DO SUL
      - MINAS GERAIS
      - NORDESTE
      - NORTE
      - Nordeste
      - Norte
      - PARA
      - PARAIBA
      - PARANA
      - PERNAMBUCO
      - PIAUI
      - RIO DE JANEIRO
      - RIO GRANDE DO NORTE
      - RIO GRANDE DO SUL
      - RONDONIA
      - RORAIMA
      - SANTA CATARINA
      - SAO PAULO
      - SERGIPE
      - SUDESTE
      - SUL
      - Sistema Brasileiro
      - Sudeste
      - Sul
      - TOCANTINS
  - name: id_periodicidade
    physicalType: VARCHAR
    logicalType: string
    description: 'Identificador da periodicidade do indicador calculado. Distingue se o valor de val_indicador
      e as contagens de perturbações referem-se a um período mensal ou anual, permitindo separar as duas
      granularidades temporais presentes no dataset.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - periodicidade
      - frequência
      - tipo de período
      - granularidade temporal
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - AN
      - ME
  - name: din_referencia
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: 'Data de referência do registro, representando o mês/ano ao qual o indicador se refere.
      As datas são registradas no primeiro dia de cada mês (ex: 2024-01-01 00:00:00 para janeiro de 2024).
      Para registros anuais (id_periodicidade=''Anual''), representa o primeiro mês do ano de referência.

      '
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - data de referência
      - mês de referência
      - ano de referência
      - período
      - competência
    - property: semanticType
      value: TIMESTAMP
  - name: val_indicador
    physicalType: DOUBLE
    logicalType: number
    description: 'Valor percentual do indicador de robustez calculado para o período e agregação geográfica
      especificados. Representa a proporção de situações em que a rede básica atendeu aos critérios de
      robustez definidos no Submódulo 9.1 dos Procedimentos de Rede do ONS. Varia de 0,0 (nenhuma robustez)
      a 100,0 (robustez plena).

      '
    customProperties:
    - property: aliases
      value:
      - valor do indicador
      - indicador de robustez
      - percentual de robustez
      - RMAL
      - RMCS
      - RRB
      - RRBCS
    - property: semanticType
      value: METRIC
    - property: unit
      value: '%'
  - name: num_perturbacoes
    physicalType: DOUBLE
    logicalType: number
    description: 'Número total de perturbações registradas na rede básica no período e agregação geográfica
      de referência, independentemente de terem causado corte de carga. Inclui todas as ocorrências de
      contingências e distúrbios no sistema de transmissão. Valor máximo observado: 3844.

      '
    customProperties:
    - property: aliases
      value:
      - número de perturbações
      - total de perturbações
      - quantidade de perturbações
      - ocorrências
      - distúrbios
    - property: semanticType
      value: IDENTIFIER
  - name: num_perturbacoescortecarga
    physicalType: DOUBLE
    logicalType: number
    description: 'Número total de perturbações que resultaram em corte de carga (interrupção no fornecimento
      de energia) no período e agregação geográfica de referência. É um subconjunto de num_perturbacoes.
      Valor máximo observado: 347.

      '
    customProperties:
    - property: aliases
      value:
      - perturbações com corte de carga
      - cortes de carga
      - interrupções
      - perturbações com interrupção
    - property: semanticType
      value: IDENTIFIER
  - name: num_perturbacoescortecarga_0a50mw
    physicalType: DOUBLE
    logicalType: number
    description: 'Número de perturbações com corte de carga cuja magnitude de carga interrompida está
      na faixa de 0 a 50 MW. Permite análise de severidade dos eventos por faixa de potência. Valor máximo
      observado: 176.

      '
    customProperties:
    - property: aliases
      value:
      - perturbações 0 a 50 MW
