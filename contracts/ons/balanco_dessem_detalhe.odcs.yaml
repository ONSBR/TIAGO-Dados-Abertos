    sql_patterns:
      geracao_total_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_programacaodia AS TIMESTAMP)) AS mes, cod_subsistema,\n\
          \  SUM(TRY_CAST(val_ger_hidraulica AS DOUBLE) + TRY_CAST(val_ger_pch AS DOUBLE) + TRY_CAST(val_ger_termica\
          \ AS DOUBLE) + TRY_CAST(val_ger_eolica AS DOUBLE) + TRY_CAST(val_ger_solar AS DOUBLE)) AS geracao_total_mwmed\n\
          FROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_programacaodia AS TIMESTAMP)) = {year}\n\
          GROUP BY 1, 2\nORDER BY 1, 2"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracao_total
          grain: month
      balanco_dessem_detalhe_mensal_gwh:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_programacaodia AS TIMESTAMP)) AS mes,\n\
          \  ROUND(SUM(TRY_CAST(TRY_CAST(val_cons_elevatoria AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1)\
          \ AS val_cons_elevatoria_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_demanda AS VARCHAR) AS DOUBLE))\
          \ * 0.5 / 1000, 1) AS val_demanda_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_ger_eolica AS VARCHAR)\
          \ AS DOUBLE)) * 0.5 / 1000, 1) AS val_ger_eolica_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_ger_fotovoltaica\
          \ AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1) AS val_ger_fotovoltaica_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_ger_hidraulica\
          \ AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1) AS val_ger_hidraulica_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_ger_mmgd\
          \ AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1) AS val_ger_mmgd_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_ger_pch\
          \ AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1) AS val_ger_pch_gwh,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_ger_pct\
          \ AS VARCHAR) AS DOUBLE)) * 0.5 / 1000, 1) AS val_ger_pct_gwh\nFROM {source}\nWHERE EXTRACT(YEAR\
          \ FROM TRY_CAST(din_programacaodia AS TIMESTAMP)) = {year}\nGROUP BY 1\nORDER BY 1"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          grain: month
        validated_params:
          year: '2025'
      balanco_dessem_detalhe_mensal_mwmed:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_programacaodia AS TIMESTAMP)) AS mes,\n\
          \  ROUND(SUM(TRY_CAST(TRY_CAST(val_cons_elevatoria AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT\
          \ TRY_CAST(din_programacaodia AS TIMESTAMP)), 1) AS val_cons_elevatoria_mwmed,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_demanda\
          \ AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_programacaodia AS TIMESTAMP)), 1) AS\
          \ val_demanda_mwmed,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_ger_eolica AS VARCHAR) AS DOUBLE)) /\
          \ COUNT(DISTINCT TRY_CAST(din_programacaodia AS TIMESTAMP)), 1) AS val_ger_eolica_mwmed,\n \
          \ ROUND(SUM(TRY_CAST(TRY_CAST(val_ger_fotovoltaica AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT\
          \ TRY_CAST(din_programacaodia AS TIMESTAMP)), 1) AS val_ger_fotovoltaica_mwmed,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_ger_hidraulica\
          \ AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_programacaodia AS TIMESTAMP)), 1) AS\
          \ val_ger_hidraulica_mwmed,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_ger_mmgd AS VARCHAR) AS DOUBLE))\
          \ / COUNT(DISTINCT TRY_CAST(din_programacaodia AS TIMESTAMP)), 1) AS val_ger_mmgd_mwmed,\n \
          \ ROUND(SUM(TRY_CAST(TRY_CAST(val_ger_pch AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_programacaodia\
          \ AS TIMESTAMP)), 1) AS val_ger_pch_mwmed,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_ger_pct AS VARCHAR)\
          \ AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_programacaodia AS TIMESTAMP)), 1) AS val_ger_pct_mwmed\n\
          FROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_programacaodia AS TIMESTAMP)) = {year}\n\
          GROUP BY 1\nORDER BY 1"
        output_unit: MWmed
        matches:
          output_modes:
          - average_power
          grain: month
        validated_params:
          year: '2025'
- property: fewShotQueries
  value:
  - question: Qual foi a participação de cada fonte de geração na demanda total programada pelo DESSEM
      por subsistema em um dia específico?
    sql: SELECT cod_subsistema, SUM((TRY_CAST(val_demanda AS DOUBLE)) * 0.5) / 1000 AS demanda_total_mwmed,
      SUM((TRY_CAST(val_ger_hidraulica AS DOUBLE)) * 0.5) / 1000 AS hidraulica_mwmed, SUM((TRY_CAST(val_ger_pch
      AS DOUBLE)) * 0.5) / 1000 AS pch_mwmed, SUM((TRY_CAST(val_ger_termica AS DOUBLE)) * 0.5) / 1000
      AS termica_mwmed, SUM(TRY_CAST(val_ger_pct AS DOUBLE)) AS pct_mwmed, SUM((TRY_CAST(val_ger_eolica
      AS DOUBLE)) * 0.5) / 1000 AS eolica_mwmed, SUM(TRY_CAST(val_ger_fotovoltaica AS DOUBLE)) AS fotovoltaica_mwmed,
      SUM((TRY_CAST(val_ger_mmgd AS DOUBLE)) * 0.5) / 1000 AS mmgd_mwmed, ROUND( 100.0 * SUM((TRY_CAST(val_ger_hidraulica
      AS DOUBLE)) * 0.5) / 1000 / NULLIF(SUM((TRY_CAST(val_demanda AS DOUBLE)) * 0.5) / 1000, 0), 2 )
      AS pct_hidraulica FROM read_parquet('s3://ons-aws-prod-opendata/dataset/balanco_dessem_detalhe/*.parquet')
      WHERE TRY_CAST(din_programacaodia AS DATE) = '2025-06-01' AND cod_subsistema NOT IN ('SIN', 'TOTAL')
      GROUP BY cod_subsistema ORDER BY cod_subsistema;
  - question: Como varia a geração eólica e fotovoltaica programada pelo DESSEM ao longo dos 48 patamares
      do dia no subsistema Nordeste?
    sql: SELECT num_patamar, AVG(TRY_CAST(val_ger_eolica AS DOUBLE)) AS media_eolica_mwmed, AVG(TRY_CAST(val_ger_fotovoltaica
      AS DOUBLE)) AS media_solar_mwmed, AVG(TRY_CAST(val_ger_mmgd AS DOUBLE)) AS media_mmgd_mwmed, AVG(TRY_CAST(val_demanda
      AS DOUBLE)) AS media_demanda_mwmed, ROUND( 100.0 * AVG(TRY_CAST(val_ger_eolica AS DOUBLE)) / NULLIF(AVG(TRY_CAST(val_demanda
      AS DOUBLE)), 0), 2 ) AS pct_eolica_demanda FROM read_parquet('s3://ons-aws-prod-opendata/dataset/balanco_dessem_detalhe/*.parquet')
      WHERE cod_subsistema = 'NE' GROUP BY num_patamar ORDER BY num_patamar;
  - question: O balanço entre geração total e demanda programada pelo DESSEM fecha corretamente em cada
      patamar e subsistema?
    sql: SELECT TRY_CAST(din_programacaodia AS DATE) AS data_programacao, cod_subsistema, num_patamar,
      TRY_CAST(val_demanda AS DOUBLE) AS demanda_mwmed, ( COALESCE(TRY_CAST(val_ger_hidraulica AS DOUBLE),
      0) + COALESCE(TRY_CAST(val_ger_pch AS DOUBLE), 0) + COALESCE(TRY_CAST(val_ger_termica AS DOUBLE),
      0) + COALESCE(TRY_CAST(val_ger_pct AS DOUBLE), 0) + COALESCE(TRY_CAST(val_ger_eolica AS DOUBLE),
      0) + COALESCE(TRY_CAST(val_ger_fotovoltaica AS DOUBLE), 0) + COALESCE(TRY_CAST(val_ger_mmgd AS DOUBLE),
      0) ) AS geracao_total_mwmed, ( COALESCE(TRY_CAST(val_ger_hidraulica AS DOUBLE), 0) + COALESCE(TRY_CAST(val_ger_pch
      AS DOUBLE), 0) + COALESCE(TRY_CAST(val_ger_termica AS DOUBLE), 0) + COALESCE(TRY_CAST(val_ger_pct
      AS DOUBLE), 0) + COALESCE(TRY_CAST(val_ger_eolica AS DOUBLE), 0) + COALESCE(TRY_CAST(val_ger_fotovoltaica
      AS DOUBLE), 0) + COALESCE(TRY_CAST(val_ger_mmgd AS DOUBLE), 0) ) - TRY_CAST(val_demanda AS DOUBLE)
      AS desvio_mwmed FROM read_parquet('s3://ons-aws-prod-opendata/dataset/balanco_dessem_detalhe/*.parquet')
      WHERE cod_subsistema NOT IN ('SIN', 'TOTAL') ORDER BY ABS( ( COALESCE(TRY_CAST(val_ger_hidraulica
      AS DOUBLE), 0) + COALESCE(TRY_CAST(val_ger_pch AS DOUBLE), 0) + COALESCE(TRY_CAST(val_ger_termica
      AS DOUBLE), 0) + COALESCE(TRY_CAST(val_ger_pct AS DOUBLE), 0) + COALESCE(TRY_CAST(val_ger_eolica
      AS DOUBLE), 0) + COALESCE(TRY_CAST(val_ger_fotovoltaica AS DOUBLE), 0) + COALESCE(TRY_CAST(val_ger_mmgd
      AS DOUBLE), 0) ) - TRY_CAST(val_demanda AS DOUBLE) ) DESC LIMIT 20;
