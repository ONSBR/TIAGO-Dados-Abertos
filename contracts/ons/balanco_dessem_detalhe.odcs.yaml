- property: temporalCoverageStart
  value: '2025-05-23'
- property: semantics
  value:
    measure_terms:
    - programacao
    - programada
    - programado
    - dessem
    family: balanco_dessem
    family_default: true
    temporal_perspective: programado
    row_grain:
      temporal: 30 min
      temporal_column: din_programacaodia
      spatial: subsistema
      entity: fonte_agregada
      one_row_per:
      - din_programacaodia
      - cod_subsistema
      - num_patamar
    dimension_columns:
      subsistema: cod_subsistema
      fonte: _pivot(val_ger_eolica, val_ger_hidraulica, val_ger_termica)
      usina: null
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: num_patamar
    metrics:
    - id: geracao_total
      label: Geração Total
      columns:
      - val_ger_hidraulica
      - val_ger_pch
      - val_ger_termica
      - val_ger_pct
      - val_ger_eolica
      - val_ger_fotovoltaica
      - val_ger_mmgd
      expression: TRY_CAST(val_ger_hidraulica AS DOUBLE) + TRY_CAST(val_ger_pch AS DOUBLE) + TRY_CAST(val_ger_termica
        AS DOUBLE) + TRY_CAST(val_ger_pct AS DOUBLE) + TRY_CAST(val_ger_eolica AS DOUBLE) + TRY_CAST(val_ger_fotovoltaica
        AS DOUBLE) + TRY_CAST(val_ger_mmgd AS DOUBLE)
      quantity_kind: average_power
      unit_native: MWmed
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total_energy:
          sql: SUM((TRY_CAST(val_ger_hidraulica AS DOUBLE) + TRY_CAST(val_ger_pch AS DOUBLE) + TRY_CAST(val_ger_termica
            AS DOUBLE) + TRY_CAST(val_ger_pct AS DOUBLE) + TRY_CAST(val_ger_eolica AS DOUBLE) + TRY_CAST(val_ger_fotovoltaica
            AS DOUBLE) + TRY_CAST(val_ger_mmgd AS DOUBLE)) * 0.5) / 1000
          unit: GWh
        average_power:
          sql: AVG(TRY_CAST(val_ger_hidraulica AS DOUBLE) + TRY_CAST(val_ger_pch AS DOUBLE) + TRY_CAST(val_ger_termica
            AS DOUBLE) + TRY_CAST(val_ger_pct AS DOUBLE) + TRY_CAST(val_ger_eolica AS DOUBLE) + TRY_CAST(val_ger_fotovoltaica
            AS DOUBLE) + TRY_CAST(val_ger_mmgd AS DOUBLE))
          unit: MWmed
        peak_power:
          sql: MAX(TRY_CAST(val_ger_hidraulica AS DOUBLE) + TRY_CAST(val_ger_pch AS DOUBLE) + TRY_CAST(val_ger_termica
            AS DOUBLE) + TRY_CAST(val_ger_pct AS DOUBLE) + TRY_CAST(val_ger_eolica AS DOUBLE) + TRY_CAST(val_ger_fotovoltaica
            AS DOUBLE) + TRY_CAST(val_ger_mmgd AS DOUBLE))
          unit: MWmed
        time_series:
          sql: AVG(TRY_CAST(val_ger_hidraulica AS DOUBLE) + TRY_CAST(val_ger_pch AS DOUBLE) + TRY_CAST(val_ger_termica
            AS DOUBLE) + TRY_CAST(val_ger_pct AS DOUBLE) + TRY_CAST(val_ger_eolica AS DOUBLE) + TRY_CAST(val_ger_fotovoltaica
            AS DOUBLE) + TRY_CAST(val_ger_mmgd AS DOUBLE))
          unit: MWmed
        ranking:
          sql: SUM((TRY_CAST(val_ger_hidraulica AS DOUBLE) + TRY_CAST(val_ger_pch AS DOUBLE) + TRY_CAST(val_ger_termica
            AS DOUBLE) + TRY_CAST(val_ger_pct AS DOUBLE) + TRY_CAST(val_ger_eolica AS DOUBLE) + TRY_CAST(val_ger_fotovoltaica
            AS DOUBLE) + TRY_CAST(val_ger_mmgd AS DOUBLE)) * 0.5) / 1000
          unit: GWh
        comparison:
          sql: AVG(TRY_CAST(val_ger_hidraulica AS DOUBLE) + TRY_CAST(val_ger_pch AS DOUBLE) + TRY_CAST(val_ger_termica
            AS DOUBLE) + TRY_CAST(val_ger_pct AS DOUBLE) + TRY_CAST(val_ger_eolica AS DOUBLE) + TRY_CAST(val_ger_fotovoltaica
            AS DOUBLE) + TRY_CAST(val_ger_mmgd AS DOUBLE))
          unit: MWmed
      interval_hours: 0.5
    - id: demanda
      label: Demanda
      columns:
      - val_demanda
      expression: TRY_CAST(val_demanda AS DOUBLE)
      quantity_kind: average_power
      unit_native: MWmed
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total_energy:
          sql: SUM((TRY_CAST(val_demanda AS DOUBLE)) * 0.5) / 1000
          unit: GWh
        average_power:
          sql: AVG(TRY_CAST(val_demanda AS DOUBLE))
          unit: MWmed
        peak_power:
          sql: MAX(TRY_CAST(val_demanda AS DOUBLE))
          unit: MWmed
        time_series:
          sql: AVG(TRY_CAST(val_demanda AS DOUBLE))
          unit: MWmed
        ranking:
          sql: SUM((TRY_CAST(val_demanda AS DOUBLE)) * 0.5) / 1000
          unit: GWh
        comparison:
          sql: AVG(TRY_CAST(val_demanda AS DOUBLE))
          unit: MWmed
      interval_hours: 0.5
      aliases:
      - demanda
      - carga
      - consumo
      - demanda prevista
      - val_carga
    - id: geracao_hidraulica
