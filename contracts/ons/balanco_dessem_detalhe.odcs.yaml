description:
  purpose: Suportar operadores e planejadores do ONS no acompanhamento e validação da programação eletro-energética
    diária resultante do modelo DESSEM, permitindo análise intra-diária do balanço entre demanda e geração
    por fonte e subsistema. Utilizado para decisões de despacho, verificação de adequação de oferta, análise
    de participação de fontes renováveis na matriz programada e fechamento do balanço energético semi-horário
    do SIN.
  limitations: Coluna armazenada como VARCHAR no Parquet devido ao formato de serialização. Coluna armazenada
    como VARCHAR no Parquet devido ao formato de serialização. Coluna armazenada como VARCHAR no Parquet
    devido a formato de serialização.
  usage: Recuperar este dataset quando a pergunta envolver programação eletro-energética diária resultante
    do modelo DESSEM com detalhamento por fonte de geração (hidráulica, térmica, eólica, solar, PCH, PCT,
    MMGD) em granularidade semi-horária (30 minutos) por subsistema.
