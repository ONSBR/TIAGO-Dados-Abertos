- property: agentInstructions
  value: '- [din_programacaodia] Coluna de data armazenada como VARCHAR em vez de DATE. O formato exato
    (YYYY-MM-DD, DD/MM/YYYY ou outro) deve ser verificado antes de operações temporais. Filtros por data
    requerem conversão explícita para evitar comparações lexicográficas incorretas.


    - [val_demanda] Campo numérico armazenado como VARCHAR devido ao formato de serialização. Qualquer
    agregação (SUM, AVG, MIN, MAX) ou comparação numérica requer TRY_CAST explícito. Valores não conversíveis
    retornarão NULL silenciosamente.


    - [val_ger_hidraulica] Campo numérico armazenado como VARCHAR pelo formato de serialização. Requer
    TRY_CAST para uso analítico. Verificar se existem valores negativos inesperados, que poderiam indicar
    reversão de fluxo ou erro de sinal na exportação.


    - [val_ger_pch] Campo numérico armazenado como VARCHAR pelo formato de serialização. Requer TRY_CAST
    para uso analítico. Valores esperados não negativos; verificar anomalias.


    - [val_ger_termica] Campo numérico armazenado como VARCHAR pelo formato de serialização. Requer TRY_CAST
    para uso analítico. Valores esperados não negativos; picos elevados podem indicar despacho de emergência
    ou erro de modelo.


    - [val_ger_pct] Campo numérico armazenado como VARCHAR pelo formato de serialização. Requer TRY_CAST
    para uso analítico.


    - [val_ger_eolica] Campo numérico armazenado como VARCHAR pelo formato de serialização. Requer TRY_CAST
    para uso analítico. Valores de geração eólica variam significativamente por patamar; verificar se
    patamares noturnos apresentam valores coerentes.


    - [val_ger_fotovoltaica] Campo numérico armazenado como VARCHAR pelo formato de serialização. Requer
    TRY_CAST para uso analítico. Geração fotovoltaica deve ser zero ou próxima de zero nos patamares noturnos
    (1–6 e 44–48 aproximadamente); valores positivos nesses patamares indicam possível inconsistência
    no modelo.


    - [val_ger_mmgd] Campo numérico armazenado como VARCHAR pelo formato de serialização. Requer TRY_CAST
    para uso analítico. MMGD de origem solar deve apresentar geração nula em patamares noturnos.


    - [val_cons_elevatoria] Campo numérico armazenado como VARCHAR pelo formato de serialização. Requer
    TRY_CAST para uso analítico. Consumo de elevatórias pode apresentar valores negativos dependendo da
    convenção de sinal adotada no DESSEM. Verificar consistência do sinal antes de somar ao balanço.

    '
- property: typicalQuestions
  value:
  - Qual foi a geração eólica programada pelo DESSEM no subsistema NE no dia 2025-06-01 por patamar?
  - Como se distribui a geração fotovoltaica ao longo do dia no subsistema SE segundo o DESSEM?
  - Qual a participação percentual de cada fonte na geração total programada pelo DESSEM por subsistema?
  - Qual o patamar de maior demanda programada pelo DESSEM no subsistema SE em um dia típico?
  - Qual a diferença entre demanda e geração total programada pelo DESSEM (balanço) por subsistema e patamar?
