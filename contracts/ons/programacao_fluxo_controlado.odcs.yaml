version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:programacao_fluxo_controlado
name: programacao_fluxo_controlado
tenant: ons
tags:
- 30min
- MW
- ONS
- SIN
- elementos controlados de transmissão
- elementos-de-transmissao
- fluxo controlado
- fluxo controlado programado
- fluxo programado SIN
- fluxo-controlado
- patamar
- patamar 30 min transmissão
- programacao-operativa
- programação de transmissão
- submercado
- transmissao
- non-pii
