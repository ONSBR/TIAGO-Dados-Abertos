- property: fewShotQueries
  value:
  - question: Qual foi o desvio médio diário entre val_previsao e val_programado para cada usina em novembro
      de 2024?
    sql: SELECT dat_programacao, cod_usinapdp, nom_usinapdp, AVG(TRY_CAST(val_previsao AS DOUBLE) - TRY_CAST(val_programado
      AS DOUBLE)) AS desvio_medio_mw, AVG(ABS(TRY_CAST(val_previsao AS DOUBLE) - TRY_CAST(val_programado
      AS DOUBLE))) AS desvio_absoluto_medio_mw, COUNT(*) AS qtd_patamares FROM read_parquet('s3://ons-aws-prod-opendata/dataset/programacao_x_previsao/*.parquet')
      WHERE TRY_CAST(dat_programacao AS DATE) >= DATE '2024-11-01' AND TRY_CAST(dat_programacao AS DATE)
      <= DATE '2024-11-30' AND TRY_CAST(val_previsao AS DOUBLE) IS NOT NULL AND TRY_CAST(val_programado
      AS DOUBLE) IS NOT NULL GROUP BY dat_programacao, cod_usinapdp, nom_usinapdp ORDER BY desvio_absoluto_medio_mw
      DESC LIMIT 100
  - question: Quais são as 20 usinas com maior erro absoluto acumulado entre previsão e programação no
      período disponível?
    sql: SELECT cod_usinapdp, nom_usinapdp, SUM(ABS(TRY_CAST(val_previsao AS DOUBLE) - TRY_CAST(val_programado
      AS DOUBLE))) AS erro_absoluto_acumulado_mw, AVG(ABS(TRY_CAST(val_previsao AS DOUBLE) - TRY_CAST(val_programado
      AS DOUBLE))) AS erro_absoluto_medio_mw, COUNT(*) AS total_patamares FROM read_parquet('s3://ons-aws-prod-opendata/dataset/programacao_x_previsao/*.parquet')
      WHERE TRY_CAST(val_previsao AS DOUBLE) IS NOT NULL AND TRY_CAST(val_programado AS DOUBLE) IS NOT
      NULL GROUP BY cod_usinapdp, nom_usinapdp ORDER BY erro_absoluto_acumulado_mw DESC LIMIT 20
  - question: Como varia o desvio médio entre previsão e programação ao longo dos 48 patamares do dia?
    sql: SELECT num_patamar, AVG(TRY_CAST(val_previsao AS DOUBLE) - TRY_CAST(val_programado AS DOUBLE))
      AS desvio_medio_mw, AVG(ABS(TRY_CAST(val_previsao AS DOUBLE) - TRY_CAST(val_programado AS DOUBLE)))
      AS desvio_absoluto_medio_mw, STDDEV(TRY_CAST(val_previsao AS DOUBLE) - TRY_CAST(val_programado AS
      DOUBLE)) AS desvio_padrao_mw, COUNT(*) AS total_registros FROM read_parquet('s3://ons-aws-prod-opendata/dataset/programacao_x_previsao/*.parquet')
      WHERE TRY_CAST(val_previsao AS DOUBLE) IS NOT NULL AND TRY_CAST(val_programado AS DOUBLE) IS NOT
      NULL AND num_patamar BETWEEN 1 AND 48 GROUP BY num_patamar ORDER BY num_patamar
