    sql_patterns:
      preco_medio_por_pais:
        template: "SELECT nom_pais,\n  AVG(val_preco) AS preco_medio_R_MWh\nFROM {source}\nGROUP BY nom_pais\n\
          ORDER BY preco_medio_R_MWh DESC"
        output_unit: R$/MWh
        matches:
          output_modes:
          - average
          - comparison
          metrics:
          - preco
          grain: all_time
      preco_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(dat_iniciovalidade AS DATE)) AS mes,\n  AVG(val_preco)\
          \ AS preco_medio_R_MWh\nFROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(dat_iniciovalidade AS\
          \ DATE)) = {year}\nGROUP BY 1\nORDER BY 1"
        output_unit: R$/MWh
        matches:
          output_modes:
          - average
          - time_series
          metrics:
          - preco
          grain: month
        validated_params:
          year: '2026'
      preco_por_agente_bloco:
        template: "SELECT nom_agente, nom_bloco,\n  AVG(val_preco) AS preco_medio_R_MWh,\n  MAX(val_preco)\
          \ AS preco_maximo_R_MWh\nFROM {source}\nWHERE nom_pais = '{pais}'\nGROUP BY nom_agente, nom_bloco\n\
          ORDER BY preco_medio_R_MWh DESC"
        output_unit: R$/MWh
        matches:
          output_modes:
          - average
          - maximum
          - ranking
          metrics:
          - preco
          grain: agent_block
        validated_params:
          pais: URUGUAI
    ambiguity_policy:
      default_assumptions:
      - when: usuario pergunta preco sem especificar agregacao
        assume_metric: preco
        assume_output: average
        note: Preco de oferta e intensivo (R$/MWh); usar AVG como padrao, nunca SUM.
      - when: usuario pergunta preco sem especificar pais
        assume_metric: preco
        assume_output: average
        note: Retornar preco medio agregado para Argentina e Uruguai juntos, com breakdown por nom_pais.
      - when: usuario pergunta preco sem especificar periodo
        assume_metric: preco
        assume_output: time_series
        note: Retornar serie temporal mensal com AVG(val_preco) para todo o historico disponivel.
      - when: usuario pergunta preco mais alto ou pico
        assume_metric: preco
        assume_output: maximum
        note: Usar MAX(val_preco); nunca SUM.
      must_clarify_when:
      - trigger_terms:
        - bloco
        - segmento
        question: 'Você quer analisar um bloco específico (ex: BLOCO 1 a BLOCO 9) ou todos os blocos agregados?'
        reason: Dataset possui 9 blocos de oferta; sem especificacao, retornar todos com GROUP BY nom_bloco.
      - trigger_terms:
        - vigente
        - atual
        - hoje
        question: Você quer os preços com vigência ativa na data de hoje, ou o último registro disponível
          no dataset?
        reason: Vigencia requer filtro em dat_iniciovalidade <= CURRENT_DATE AND dat_fimvalidade >= CURRENT_DATE;
          ultimo registro usa MAX(dat_iniciovalidade).
      redirect_when:
      - user_mentions:
        - volume importado
        - energia importada
        - MWmed importacao
        - intercambio realizado
        - intercambio verificado
        reason: Dataset contem apenas precos declarados (R$/MWh), nao volumes de energia importada.
        redirect: importacaoenergia-comercial-2
      - user_mentions:
        - usina
        - ceg
        - itaipu
        - ranking de usinas
        reason: Schema nao contem CEG, usina ou identificador fisico de usina.
        redirect: geracao-usina-2
      - user_mentions:
        - nuclear
        - angra
        reason: Schema nao contem coluna ou dimensao nuclear separada.
        redirect: geracao-usina-2
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Schema nao contem coluna MMGD separada.
        redirect: dataset com coluna val_germmgd/val_ger_mmgd quando disponivel
      - user_mentions:
        - carga
        - demanda de energia
        reason: Dataset nao contem dados de carga; apenas precos de oferta de importacao.
        redirect: carga-energia-subsistema
- property: fewShotQueries
  value:
  - question: Como evoluiu o preço médio de importação de energia da Argentina e do Uruguai ao longo dos
      anos?
    sql: SELECT nom_pais, YEAR(TRY_CAST(dat_iniciovalidade AS DATE)) AS ano, ROUND(AVG(val_preco), 2)
      AS preco_medio, ROUND(MIN(val_preco), 2) AS preco_minimo, ROUND(MAX(val_preco), 2) AS preco_maximo,
      COUNT(*) AS qtd_ofertas FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ofertapreco-importacao-se/*.parquet')
      WHERE TRY_CAST(dat_iniciovalidade AS DATE) IS NOT NULL GROUP BY nom_pais, YEAR(TRY_CAST(dat_iniciovalidade
      AS DATE)) ORDER BY nom_pais, ano;
  - question: Qual é o preço médio de importação de energia por bloco/patamar de carga para cada país?
    sql: SELECT nom_pais, nom_bloco, ROUND(AVG(val_preco), 2) AS preco_medio, ROUND(MEDIAN(val_preco),
      2) AS preco_mediano, ROUND(STDDEV(val_preco), 2) AS desvio_padrao, COUNT(*) AS qtd_ofertas FROM
      read_parquet('s3://ons-aws-prod-opendata/dataset/ofertapreco-importacao-se/*.parquet') GROUP BY
      nom_pais, nom_bloco ORDER BY nom_pais, preco_medio DESC;
  - question: Quais agentes comercializadores declararam os maiores preços de oferta para importação de
      energia?
    sql: SELECT nom_agente, nom_pais, ROUND(AVG(val_preco), 2) AS preco_medio, ROUND(MAX(val_preco), 2)
      AS preco_maximo, COUNT(*) AS qtd_ofertas, MIN(TRY_CAST(dat_iniciovalidade AS DATE)) AS primeira_oferta,
      MAX(TRY_CAST(dat_iniciovalidade AS DATE)) AS ultima_oferta FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ofertapreco-importacao-se/*.parquet')
      WHERE TRY_CAST(dat_iniciovalidade AS DATE) IS NOT NULL GROUP BY nom_agente, nom_pais ORDER BY preco_medio
      DESC LIMIT 20;
