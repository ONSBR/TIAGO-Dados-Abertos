description:
  purpose: Subsidiar operadores do ONS e agentes do mercado de energia elétrico brasileiro nas decisões
    de despacho e intercâmbio internacional, fornecendo os preços declarados por agentes comercializadores
    para importação de energia da Argentina e do Uruguai. Suporta análises de competitividade de ofertas,
    auditoria de transações de importação, liquidação financeira no âmbito da CCEE e estudos de planejamento
    de curto prazo do SIN.
  limitations: Coluna armazenada como VARCHAR em vez de DATE/TIMESTAMP, impedindo operações temporais
    nativas (ORDER BY, BETWEEN, MIN/MAX de datas). Coluna armazenada como VARCHAR em vez de DATE/TIMESTAMP,
    impedindo operações temporais nativas. O valor máximo de 2282.
  usage: Recuperar este dataset quando a pergunta envolver preços declarados por agentes para importação
    de energia elétrica da Argentina ou do Uruguai ao SIN, incluindo análises de competitividade de ofertas,
    histórico de preços de importação por agente ou bloco, e correlação entre preços declarados e intercâmbio
    internacional realizado.
domain: preco
schema:
- name: ofertapreco_importacao
  physicalType: parquet
  logicalType: object
  physicalName: ofertapreco_importacao
  properties:
  - name: nom_pais
    physicalType: VARCHAR
    logicalType: string
    description: Nome do país de origem da energia importada (Argentina ou Uruguai)
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - país
      - pais de origem
      - origem da importação
      - país exportador
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - ARGENTINA
      - URUGUAI
  - name: nom_agente
    physicalType: VARCHAR
    logicalType: string
    description: Nome do agente comercializador responsável pela declaração da oferta de preço de importação
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - agente
      - comercializador
      - agente comercializador
      - empresa
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - BANCO BTG
      - BOLT
      - ELETROBRAS
      - ENEL
      - TRADENER
  - name: nom_bloco
    physicalType: VARCHAR
    logicalType: string
    description: Nome do bloco de oferta ao qual o preço declarado está associado, representando uma faixa
      ou segmento de energia ofertada
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - bloco
      - bloco de oferta
      - segmento de oferta
      - faixa de energia
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - BLOCO 1
      - BLOCO 2
      - BLOCO 3
      - BLOCO 4
      - BLOCO 5
      - BLOCO 6
      - BLOCO 7
      - BLOCO 8
      - BLOCO 9
  - name: dat_iniciovalidade
    physicalType: VARCHAR
    logicalType: string
    description: Data de início da validade do preço declarado pelo agente, armazenada como VARCHAR em
      vez de DATE — requer conversão para consultas temporais
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - início de validade
      - data início
      - início do período
      - data de vigência inicial
    - property: semanticType
      value: TIMESTAMP
  - name: dat_fimvalidade
    physicalType: VARCHAR
    logicalType: string
    description: Data de fim da validade do preço declarado pelo agente, armazenada como VARCHAR em vez
      de DATE — requer conversão para consultas temporais
    customProperties:
    - property: aliases
      value:
      - fim de validade
      - data fim
      - fim do período
      - data de vigência final
      - data de expiração
    - property: semanticType
      value: TIMESTAMP
  - name: val_preco
    physicalType: DOUBLE
    logicalType: number
    description: Valor do preço declarado pelo agente comercializador para oferta de importação de energia,
      em R$/MWh
    customProperties:
    - property: aliases
      value:
      - preço
      - preço de oferta
      - valor do preço
      - preço de importação
      - oferta de preço
    - property: semanticType
      value: METRIC
    - property: unit
      value: R$/MWh
  quality:
  - type: custom
    engine: soda
    implementation: "checks for ofertapreco_importacao:\n  - row_count > 0:\n      name: Tabela não pode\
      \ estar vazia\n\n  # Referential integrity\n  - invalid_count(nom_pais) = 0:\n      valid values:\n\
      \        - 'ARGENTINA'\n        - 'URUGUAI'\n      name: nom_pais deve ser um dos valores válidos\n\
      \  - invalid_count(nom_agente) = 0:\n      valid values:\n        - 'BANCO BTG'\n        - 'BOLT'\n\
      \        - 'ELETROBRAS'\n        - 'ENEL'\n        - 'TRADENER'\n      name: nom_agente deve ser\
      \ um dos valores válidos\n  - invalid_count(nom_bloco) = 0:\n      valid values:\n        - 'BLOCO\
      \ 1'\n        - 'BLOCO 2'\n        - 'BLOCO 3'\n        - 'BLOCO 4'\n        - 'BLOCO 5'\n     \
      \   - 'BLOCO 6'\n        - 'BLOCO 7'\n        - 'BLOCO 8'\n        - 'BLOCO 9'\n      name: nom_bloco\
      \ deve ser um dos valores válidos\n\n  # Unicidade da chave primária composta ['nom_pais', 'nom_agente',\
      \ 'nom_bloco', 'dat_iniciovalidade'] (candidata LLM)\n  - failed rows:\n      name: Chave composta\
      \ (nom_pais, nom_agente, nom_bloco, dat_iniciovalidade) não deve ter duplicatas\n      fail query:\
      \ |\n        SELECT * FROM ofertapreco_importacao\n        WHERE (nom_pais, nom_agente, nom_bloco,\
      \ dat_iniciovalidade) IN (\n          SELECT nom_pais, nom_agente, nom_bloco, dat_iniciovalidade\
      \ FROM ofertapreco_importacao\n          GROUP BY nom_pais, nom_agente, nom_bloco, dat_iniciovalidade\n\
      \          HAVING COUNT(*) > 1\n        )\n"
