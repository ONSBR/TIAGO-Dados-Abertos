customProperties:
- property: vectorTags
  value:
  - preco ofertado para importar
  - quanto os agentes pediram para importar
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver preços declarados por agentes para importação
    de energia elétrica da Argentina ou do Uruguai ao SIN, incluindo análises de competitividade de ofertas,
    histórico de preços de importação por agente ou bloco, e correlação entre preços declarados e intercâmbio
    internacional realizado. Também relevante para auditorias de liquidação de transações de importação
    e estudos de despacho com energia importada.
- property: agentInstructions
  value: '- [dat_iniciovalidade] A coluna dat_iniciovalidade está armazenada como VARCHAR no schema físico,
    embora represente uma data. Operações de filtragem temporal, ordenação e cálculo de intervalos requerem
    conversão explícita para DATE. Risco de ordenação lexicográfica incorreta se o formato não for estritamente
    ISO (YYYY-MM-DD) em todos os registros.


    - [dat_fimvalidade] A coluna dat_fimvalidade está armazenada como VARCHAR no schema físico, embora
    represente uma data de fim de vigência. Requer conversão explícita para DATE em operações temporais.
    Deve-se verificar se dat_fimvalidade >= dat_iniciovalidade em todos os registros.


    - [val_preco] O valor máximo de val_preco é 2282,36, enquanto o mínimo é 23,61 — amplitude de aproximadamente
    97x. Valores muito elevados podem representar ofertas em períodos de escassez extrema ou erros de
    declaração. Recomenda-se monitorar registros acima de 3 desvios padrão da média.


    - [nom_bloco] Não há dicionário de dados disponível para nom_bloco. Recomenda-se inspecionar os valores
    únicos para verificar padronização de nomenclatura (maiúsculas, acentuação, abreviações) e confirmar
    se representam patamares de carga (Pesada, Média, Leve) ou blocos horários numerados.


    - [nom_agente] Risco de duplicatas na chave primária composta (nom_pais, nom_agente, nom_bloco, dat_iniciovalidade)
    caso um mesmo agente submeta múltiplas ofertas para o mesmo bloco e período. Deve-se verificar se
    a combinação dessas quatro colunas é de fato única em todos os registros.

    '
- property: typicalQuestions
  value:
  - Quais agentes declararam ofertas de preço para importação de energia da Argentina na última semana?
  - Qual é o preço médio de oferta de importação por país (Argentina vs Uruguai) ao longo do tempo?
  - Quais blocos de oferta apresentam os maiores preços declarados para importação?
  - Existe correlação entre os preços declarados de importação e os volumes de intercâmbio internacional
    realizados?
  - Quais agentes comercializadores têm histórico de ofertas de preço acima de 500 R$/MWh para importação?
