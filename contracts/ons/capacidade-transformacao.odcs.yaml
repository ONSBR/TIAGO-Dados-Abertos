- property: fewShotQueries
  value:
  - question: Qual é a capacidade total de transformação instalada em cada subsistema elétrico do SIN?
    sql: SELECT id_subsistema, nom_subsistema, COUNT(*) AS qtd_transformadores, ROUND(SUM(val_potencianominal_mva),
      2) AS potencia_total_mva, ROUND(AVG(val_potencianominal_mva), 2) AS potencia_media_mva FROM read_parquet('s3://ons-aws-prod-opendata/dataset/capacidade-transformacao/*.parquet')
      GROUP BY id_subsistema, nom_subsistema ORDER BY potencia_total_mva DESC
  - question: Quais são as subestações com maior capacidade total de transformação instalada na rede básica?
    sql: SELECT nom_subestacao, nom_subsistema, nom_estado, COUNT(*) AS qtd_transformadores, ROUND(SUM(val_potencianominal_mva),
      2) AS potencia_total_mva FROM read_parquet('s3://ons-aws-prod-opendata/dataset/capacidade-transformacao/*.parquet')
      GROUP BY nom_subestacao, nom_subsistema, nom_estado ORDER BY potencia_total_mva DESC LIMIT 20
  - question: Qual é a participação de cada agente de transmissão na capacidade de transformação da rede
      básica?
    sql: SELECT nom_agenteproprietario, COUNT(*) AS qtd_transformadores, ROUND(SUM(val_potencianominal_mva),
      2) AS potencia_total_mva, ROUND(100.0 * SUM(val_potencianominal_mva) / SUM(SUM(val_potencianominal_mva))
      OVER (), 2) AS participacao_pct FROM read_parquet('s3://ons-aws-prod-opendata/dataset/capacidade-transformacao/*.parquet')
      GROUP BY nom_agenteproprietario ORDER BY potencia_total_mva DESC
