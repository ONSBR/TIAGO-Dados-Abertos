status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/capacidade-transformacao/*.parquet
  format: parquet
description:
  purpose: Suportar planejadores e operadores do sistema elétrico na análise da capacidade de transformação
    instalada na Rede Básica do SIN, permitindo estudos de fluxo de potência, avaliação de adequação da
    infraestrutura de transmissão, decisões sobre expansão da rede, manutenção de equipamentos e conformidade
    regulatória com normas ANEEL/ONS. Utilizado por agentes de transmissão, pesquisadores e reguladores
    para inventário e diagnóstico da infraestrutura de transformação.
  limitations: Parte dos registros (aproximadamente 384 linhas) possuem val_tensaoterciario_kv nulo. Poucos registros possuem num_barra_primario nulo, indicando transformadores sem barra primária associada no modelo computacional. Poucos registros possuem num_barra_secundario nulo, indicando transformadores sem barra secundária associada no modelo computacional.
  usage: Recuperar este dataset quando a pergunta envolver capacidade instalada de transformação, inventário
    de transformadores da Rede Básica, potência nominal em MVA por subestação ou subsistema, tensões de
    transformação (primário/secundário/terciário), agentes proprietários de transformadores ou análise
    de infraestrutura de transformação do SIN.
domain: transmissao
schema:
- name: capacidade_transformacao
  physicalType: parquet
  logicalType: object
  physicalName: capacidade_transformacao
  properties:
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
