    sql_patterns:
      capacidade_total_por_subsistema:
        template: "SELECT id_subsistema, nom_subsistema,\n  COUNT(*) AS qtd_transformadores,\n  SUM(val_potencianominal_mva)\
          \ AS total_mva\nFROM {source}\nWHERE dat_desativacao IS NULL\n  OR TRY_CAST(dat_desativacao\
          \ AS DATE) > CURRENT_DATE\nGROUP BY id_subsistema, nom_subsistema\nORDER BY total_mva DESC"
        output_unit: MVA
        matches:
          output_modes:
          - total
          metrics:
          - potencianominal_mva
          grain: subsistema
      transformadores_ativos:
        template: "SELECT *\nFROM {source}\nWHERE dat_desativacao IS NULL\n  OR TRY_CAST(dat_desativacao\
          \ AS DATE) > CURRENT_DATE\nORDER BY nom_subestacao, nom_transformador"
        output_unit: null
        matches:
          output_modes:
          - listing
          grain: equipamento
      capacidade_por_subestacao:
        template: "SELECT nom_subestacao, nom_agenteproprietario, id_subsistema,\n  COUNT(*) AS qtd_transformadores,\n\
          \  SUM(val_potencianominal_mva) AS total_mva\nFROM {source}\nWHERE dat_desativacao IS NULL\n\
          \  OR TRY_CAST(dat_desativacao AS DATE) > CURRENT_DATE\nGROUP BY nom_subestacao, nom_agenteproprietario,\
          \ id_subsistema\nORDER BY total_mva DESC"
        output_unit: MVA
        matches:
          output_modes:
          - ranking
          metrics:
          - potencianominal_mva
          grain: subestacao
      transformadores_tres_enrolamentos:
        template: "SELECT nom_subestacao, nom_transformador, nom_agenteproprietario,\n  val_tensaoprimario_kv,\
          \ val_tensaosecundario_kv, val_tensaoterciario_kv,\n  val_potencianominal_mva\nFROM {source}\n\
          WHERE nom_tipotransformador = 'TRANSFORMADOR DE 3 TERMINAIS'\n  AND (dat_desativacao IS NULL\
          \ OR TRY_CAST(dat_desativacao AS DATE) > CURRENT_DATE)\nORDER BY val_potencianominal_mva DESC"
        output_unit: MVA
        matches:
          output_modes:
          - listing
          metrics:
          - potencianominal_mva
          grain: equipamento
    ambiguity_policy:
      default_assumptions:
      - when: usuario pergunta capacidade de transformacao sem especificar metrica
        assume_metric: potencianominal_mva
        assume_output: total
        note: Soma de val_potencianominal_mva em MVA. Excluir transformadores desativados com TRY_CAST(dat_desativacao
          AS DATE) > CURRENT_DATE ou dat_desativacao IS NULL.
      - when: usuario pergunta tensao sem especificar primario/secundario/terciario
        assume_metric: tensaoprimario_kv
        assume_output: maximum
        note: Tensao primaria e o nivel de tensao mais alto e mais relevante para classificacao de transformadores
          de transmissao.
      - when: usuario pergunta transformadores ativos sem especificar data
        assume_metric: potencianominal_mva
        assume_output: total
        note: Filtrar por dat_desativacao IS NULL OR TRY_CAST(dat_desativacao AS DATE) > CURRENT_DATE
          para retornar apenas equipamentos em operacao.
      must_clarify_when:
      - trigger_terms:
        - desativados
        - historico
        - retirados
        question: Deseja incluir apenas transformadores desativados, ou comparar ativos versus desativados?
          Informe o periodo de desativacao se necessario.
        reason: dat_desativacao pode ser data passada (desativado), futura (programado) ou nulo (ativo);
          a intencao determina o filtro correto.
      - trigger_terms:
        - maior
        - ranking
        - top
        question: Deseja ranking por subestacao, por agente proprietario ou por subsistema?
        reason: Dataset suporta agrupamento por subestacao, agente ou subsistema; a granularidade do ranking
          muda o GROUP BY.
      redirect_when:
      - user_mentions:
        - usina
        - ceg
        - itaipu
        - belo monte
        - ranking de usinas
        - geracao por usina
        reason: Schema nao contem CEG, nom_usina ou identificador fisico de usina geradora.
        redirect: geracao-usina-2
      - user_mentions:
        - nuclear
        - angra
        reason: Schema nao contem coluna ou dimensao de combustivel nuclear.
        redirect: geracao-usina-2 com filtro de combustivel nuclear
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Schema nao contem coluna MMGD ou geracao distribuida.
        redirect: dataset com coluna val_germmgd quando disponivel
      - user_mentions:
        - fator de capacidade
        - fator capacidade
        - utilizacao
        reason: Dataset e cadastral e nao contem medicoes de geracao real ou fator de utilizacao de transformadores.
        redirect: fator-capacidade-2
      - user_mentions:
        - controle de reativo
        - reativo
        - capacitor
        - reator
        reason: Equipamentos de controle reativo estao em dataset separado.
        redirect: equipamento-controle-reativo
- property: fewShotQueries
  value:
  - question: Qual é a capacidade total de transformação instalada em cada subsistema elétrico do SIN?
    sql: SELECT id_subsistema, nom_subsistema, COUNT(*) AS qtd_transformadores, ROUND(SUM(val_potencianominal_mva),
      2) AS potencia_total_mva, ROUND(AVG(val_potencianominal_mva), 2) AS potencia_media_mva FROM read_parquet('s3://ons-aws-prod-opendata/dataset/capacidade-transformacao/*.parquet')
      GROUP BY id_subsistema, nom_subsistema ORDER BY potencia_total_mva DESC
  - question: Quais são as subestações com maior capacidade total de transformação instalada na rede básica?
    sql: SELECT nom_subestacao, nom_subsistema, nom_estado, COUNT(*) AS qtd_transformadores, ROUND(SUM(val_potencianominal_mva),
      2) AS potencia_total_mva FROM read_parquet('s3://ons-aws-prod-opendata/dataset/capacidade-transformacao/*.parquet')
      GROUP BY nom_subestacao, nom_subsistema, nom_estado ORDER BY potencia_total_mva DESC LIMIT 20
  - question: Qual é a participação de cada agente de transmissão na capacidade de transformação da rede
      básica?
    sql: SELECT nom_agenteproprietario, COUNT(*) AS qtd_transformadores, ROUND(SUM(val_potencianominal_mva),
      2) AS potencia_total_mva, ROUND(100.0 * SUM(val_potencianominal_mva) / SUM(SUM(val_potencianominal_mva))
      OVER (), 2) AS participacao_pct FROM read_parquet('s3://ons-aws-prod-opendata/dataset/capacidade-transformacao/*.parquet')
      GROUP BY nom_agenteproprietario ORDER BY potencia_total_mva DESC
