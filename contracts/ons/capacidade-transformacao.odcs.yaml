        template: "SELECT id_subsistema, nom_subsistema,\n  COUNT(*) AS qtd_transformadores,\n  SUM(val_potencianominal_mva)\
          \ AS total_mva\nFROM {source}\nWHERE dat_desativacao IS NULL\n  OR TRY_CAST(dat_desativacao\
          \ AS DATE) > CURRENT_DATE\nGROUP BY id_subsistema, nom_subsistema\nORDER BY total_mva DESC"
