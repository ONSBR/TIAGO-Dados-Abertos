      - 4.16
      - 4.63
      - 6.0
      - 6.3
      - 6.6
      - 6.9
      - 13.2
      - 13.8
      - 20.0
      - 34.5
      - 69.0
  - name: val_potencianominal_mva
    physicalType: DOUBLE
    logicalType: number
    description: Potência nominal do transformador em megavolt-ampere (MVA), representando a capacidade
      máxima de transformação
    customProperties:
    - property: aliases
      value:
      - potencia_nominal
      - capacidade_transformacao
      - mva
      - potencia_mva
      - capacidade_mva
    - property: semanticType
      value: METRIC
    - property: unit
      value: MVA
  - name: nom_tipoderede
    physicalType: VARCHAR
    logicalType: string
    description: 'Tipo de rede elétrica ao qual o transformador pertence (ex: Rede Básica), conforme classificação
      regulatória ANEEL/ONS'
    customProperties:
    - property: aliases
      value:
      - tipo_rede
      - classificacao_rede
      - rede
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - BASICA
      - COMPLEMENTAR
