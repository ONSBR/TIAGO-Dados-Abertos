version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:capacidade-transformacao
name: capacidade-transformacao
tenant: ons
tags:
- AT rede básica
- cadastro-equipamentos
- capacidade de transformação
- capacidade trafo
- mva
- ons
- potencia-nominal
- rede-basica
- sin
- subestacao
- tensao-kv
- trafo
- transformador
- transformador rede básica
- transformação SIN
- transmissao
- non-pii
- public_data
status: active
servers:
- server: production
  type: s3
  location: s3://ons-aws-prod-opendata/dataset/capacidade-transformacao/*.parquet
  format: parquet
description:
  purpose: Suportar planejadores e operadores do sistema elétrico na análise da capacidade de transformação
    instalada na Rede Básica do SIN, permitindo estudos de fluxo de potência, avaliação de adequação da
    infraestrutura de transmissão, decisões sobre expansão da rede, manutenção de equipamentos e conformidade
    regulatória com normas ANEEL/ONS. Utilizado por agentes de transmissão, pesquisadores e reguladores
    para inventário e diagnóstico da infraestrutura de transformação.
  limitations: 19% dos registros (aproximadamente 384 linhas) possuem val_tensaoterciario_kv nulo. 0,3%
    dos registros possuem num_barra_primario nulo, indicando transformadores sem barra primária associada
    no modelo computacional. 1,1% dos registros possuem num_barra_secundario nulo, indicando transformadores
    sem barra secundária associada no modelo computacional.
  usage: Recuperar este dataset quando a pergunta envolver capacidade instalada de transformação, inventário
    de transformadores da Rede Básica, potência nominal em MVA por subestação ou subsistema, tensões de
    transformação (primário/secundário/terciário), agentes proprietários de transformadores ou análise
    de infraestrutura de transformação do SIN.
domain: transmissao
schema:
- name: capacidade_transformacao
  physicalType: parquet
  logicalType: object
  physicalName: capacidade_transformacao
  properties:
  - name: id_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Identificador do subsistema elétrico ao qual o transformador pertence (ex: SE, S, NE,
      N)'
    customProperties:
    - property: aliases
      value:
      - subsistema
      - sistema
      - id_sistema
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - N
      - NE
      - S
      - SE
  - name: nom_subsistema
    physicalType: VARCHAR
    logicalType: string
    description: 'Nome por extenso do subsistema elétrico (ex: Sudeste/Centro-Oeste, Sul, Nordeste, Norte)'
    customProperties:
    - property: aliases
      value:
      - nome_subsistema
      - regiao_subsistema
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Nordeste
      - Norte
      - Sudeste/Centro-Oeste
      - Sul
  - name: id_estado
    physicalType: VARCHAR
    logicalType: string
    description: Sigla do estado da federação onde a subestação está localizada
    customProperties:
    - property: aliases
      value:
      - estado
      - uf
      - sigla_estado
    - property: semanticType
      value: IDENTIFIER
    - property: enum
      value:
      - AC
      - AL
      - AM
      - AP
      - BA
      - CE
      - DF
      - ES
      - GO
      - MA
      - MG
      - MS
      - MT
      - PA
      - PB
      - PE
      - PI
      - PR
      - RJ
      - RN
      - RO
      - RR
      - RS
      - SC
      - SE
      - SP
      - TO
  - name: nom_estado
    physicalType: VARCHAR
    logicalType: string
    description: Nome por extenso do estado da federação onde a subestação está localizada
    customProperties:
    - property: aliases
      value:
      - nome_estado
      - estado_nome
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - Acre
      - Alagoas
      - Amapá
      - Amazonas
      - Bahia
      - Ceará
      - Distrito Federal
      - Espírito Santo
      - Goiás
      - Maranhão
      - Mato Grosso
      - Mato Grosso do Sul
      - Minas Gerais
      - Paraná
      - Paraíba
      - Pará
      - Pernambuco
      - Piauí
      - Rio Grande do Norte
      - Rio Grande do Sul
      - Rio de Janeiro
      - Rondônia
      - Roraima
      - Santa Catarina
      - Sergipe
      - São Paulo
      - Tocantins
  - name: nom_tipotransformador
    physicalType: VARCHAR
    logicalType: string
    description: 'Tipo do transformador conforme classificação ONS (ex: Autotransformador, Transformador
      de dois enrolamentos, Transformador de três enrolamentos)'
    customProperties:
    - property: aliases
      value:
      - tipo_transformador
      - tipo_equipamento
      - classificacao_transformador
    - property: semanticType
      value: DIMENSION
    - property: enum
      value:
      - TRANSFORMADOR DE 2 TERMINAIS
      - TRANSFORMADOR DE 3 TERMINAIS
  - name: nom_agenteproprietario
    physicalType: VARCHAR
    logicalType: string
    description: Nome do agente proprietário do transformador conforme cadastro ONS (concessionária de
      transmissão ou geração)
    customProperties:
    - property: aliases
      value:
      - agente
      - proprietario
      - empresa
      - concessionaria
      - transmissora
    - property: semanticType
      value: DIMENSION
  - name: nom_subestacao
    physicalType: VARCHAR
    logicalType: string
    description: Nome da subestação onde o transformador está instalado
    customProperties:
    - property: aliases
      value:
      - subestacao
      - nome_subestacao
      - se
    - property: semanticType
      value: DIMENSION
  - name: nom_transformador
    physicalType: VARCHAR
    logicalType: string
    description: Nome ou designação do transformador dentro da subestação, geralmente incluindo tensões
      e número de identificação
    customProperties:
    - property: aliases
      value:
      - transformador
      - nome_transformador
      - designacao_transformador
    - property: semanticType
      value: DIMENSION
  - name: cod_equipamento
    physicalType: VARCHAR
    logicalType: string
    description: Código único do equipamento no cadastro ONS, utilizado como identificador primário do
      transformador
    primaryKey: true
    customProperties:
    - property: aliases
      value:
      - codigo_equipamento
      - id_equipamento
      - cod_trafo
    - property: semanticType
      value: IDENTIFIER
  - name: dat_entradaoperacao
    physicalType: VARCHAR
    logicalType: string
    description: Data de entrada em operação do transformador. Armazenada como VARCHAR no Parquet; requer
      conversão para DATE em análises temporais
    customProperties:
    - property: aliases
      value:
      - data_entrada_operacao
      - data_operacao
      - entrada_operacao
      - data_comissionamento
    - property: semanticType
      value: TIMESTAMP
  - name: dat_desativacao
    physicalType: VARCHAR
    logicalType: string
    description: 'Data de desativação do transformador. Armazenada como VARCHAR; valor pode representar
      data futura, data passada ou indicador de equipamento ativo (ex: ''9999-12-31''). Requer conversão
      para DATE em análises temporais'
    customProperties:
    - property: aliases
      value:
      - data_desativacao
      - data_retirada
      - desativacao
      - data_baixa
    - property: semanticType
      value: TIMESTAMP
  - name: val_tensaoprimario_kv
    physicalType: DOUBLE
    logicalType: number
    description: Tensão nominal do enrolamento primário do transformador em quilovolts (kV)
    customProperties:
    - property: aliases
      value:
      - tensao_primario
      - tensao_alta
      - kv_primario
      - tensao_at
    - property: semanticType
      value: METRIC
    - property: unit
      value: kV
    - property: enum
      value:
      - 69.0
      - 132.0
      - 138.0
      - 230.0
      - 289.0
      - 345.0
      - 440.0
      - 500.0
      - 765.0
  - name: val_tensaosecundario_kv
    physicalType: DOUBLE
    logicalType: number
    description: Tensão nominal do enrolamento secundário do transformador em quilovolts (kV)
    customProperties:
    - property: aliases
      value:
      - tensao_secundario
      - tensao_media
      - kv_secundario
      - tensao_mt
    - property: semanticType
      value: METRIC
    - property: unit
      value: kV
    - property: enum
      value:
      - 11.0
      - 11.9
      - 13.8
      - 16.0
      - 17.5
      - 20.0
      - 22.0
      - 23.0
      - 34.5
      - 44.0
      - 69.0
      - 88.0
      - 138.0
      - 161.0
      - 230.0
      - 289.0
      - 345.0
      - 440.0
      - 500.0
  - name: val_tensaoterciario_kv
    physicalType: DOUBLE
    logicalType: number
    description: Tensão nominal do enrolamento terciário do transformador em quilovolts (kV). Nulo para
      transformadores de dois enrolamentos (19% dos registros)
    customProperties:
    - property: aliases
      value:
      - tensao_terciario
      - tensao_baixa
      - kv_terciario
      - tensao_bt
    - property: semanticType
      value: METRIC
    - property: unit
      value: kV
    - property: enum
