    physicalType: INTEGER
    logicalType: integer
    description: Número da barra elétrica associada ao enrolamento primário do transformador no modelo
      computacional do SIN. Nulo para 0,3% dos equipamentos sem barra associada
    customProperties:
    - property: aliases
      value:
      - barra_primario
      - barra_at
      - numero_barra_primario
      - barra_alta_tensao
    - property: semanticType
      value: IDENTIFIER
  - name: num_barra_secundario
    physicalType: INTEGER
    logicalType: integer
    description: Número da barra elétrica associada ao enrolamento secundário do transformador no modelo
      computacional do SIN. Nulo para 1,1% dos equipamentos sem barra associada
    customProperties:
    - property: aliases
      value:
      - barra_secundario
      - barra_mt
      - numero_barra_secundario
      - barra_media_tensao
    - property: semanticType
      value: IDENTIFIER
  quality:
  - type: custom
    engine: soda
    implementation: "checks for capacidade_transformacao:\n  - row_count > 0:\n      name: Tabela não\
      \ pode estar vazia\n\n  # Referential integrity\n  - invalid_count(id_subsistema) = 0:\n      valid\
      \ values:\n        - 'N'\n        - 'NE'\n        - 'S'\n        - 'SE'\n      name: id_subsistema\
      \ deve ser um dos valores válidos\n  - invalid_count(nom_subsistema) = 0:\n      valid values:\n\
      \        - 'Nordeste'\n        - 'Norte'\n        - 'Sudeste/Centro-Oeste'\n        - 'Sul'\n  \
      \    name: nom_subsistema deve ser um dos valores válidos\n  - invalid_count(id_estado) = 0:\n \
      \     valid values:\n        - 'AC'\n        - 'AL'\n        - 'AM'\n        - 'AP'\n        - 'BA'\n\
      \        - 'CE'\n        - 'DF'\n        - 'ES'\n        - 'GO'\n        - 'MA'\n        - 'MG'\n\
      \        - 'MS'\n        - 'MT'\n        - 'PA'\n        - 'PB'\n        - 'PE'\n        - 'PI'\n\
      \        - 'PR'\n        - 'RJ'\n        - 'RN'\n        - 'RO'\n        - 'RR'\n        - 'RS'\n\
      \        - 'SC'\n        - 'SE'\n        - 'SP'\n        - 'TO'\n      name: id_estado deve ser\
      \ um dos valores válidos\n  - invalid_count(nom_estado) = 0:\n      valid values:\n        - 'Acre'\n\
      \        - 'Alagoas'\n        - 'Amapá'\n        - 'Amazonas'\n        - 'Bahia'\n        - 'Ceará'\n\
      \        - 'Distrito Federal'\n        - 'Espírito Santo'\n        - 'Goiás'\n        - 'Maranhão'\n\
      \        - 'Mato Grosso'\n        - 'Mato Grosso do Sul'\n        - 'Minas Gerais'\n        - 'Paraná'\n\
      \        - 'Paraíba'\n        - 'Pará'\n        - 'Pernambuco'\n        - 'Piauí'\n        - 'Rio\
      \ Grande do Norte'\n        - 'Rio Grande do Sul'\n        - 'Rio de Janeiro'\n        - 'Rondônia'\n\
      \        - 'Roraima'\n        - 'Santa Catarina'\n        - 'Sergipe'\n        - 'São Paulo'\n \
      \       - 'Tocantins'\n      name: nom_estado deve ser um dos valores válidos\n  - invalid_count(nom_tipotransformador)\
      \ = 0:\n      valid values:\n        - 'TRANSFORMADOR DE 2 TERMINAIS'\n        - 'TRANSFORMADOR\
      \ DE 3 TERMINAIS'\n      name: nom_tipotransformador deve ser um dos valores válidos\n  - invalid_count(nom_tipoderede)\
      \ = 0:\n      valid values:\n        - 'BASICA'\n        - 'COMPLEMENTAR'\n      name: nom_tipoderede\
      \ deve ser um dos valores válidos\n\n  # Unicidade da chave primária (candidata LLM — confirmar\
      \ com dados reais)\n  - duplicate_count(cod_equipamento) = 0:\n      name: cod_equipamento não deve\
      \ ter duplicatas (chave primária)\n\n  # Nulos em val_tensaoterciario_kv — alerta de qualidade (real=0%,\
      \ threshold=5.0%)\n  - missing_percent(val_tensaoterciario_kv) < 5.0:\n      name: val_tensaoterciario_kv\
      \ não deve ter >5.0% nulos\n\n  # Nulos em num_barra_primario — alerta de qualidade (real=0%, threshold=5.0%)\n\
      \  - missing_percent(num_barra_primario) < 5.0:\n      name: num_barra_primario não deve ter >5.0%\
      \ nulos\n\n  # Nulos em num_barra_secundario — alerta de qualidade (real=0%, threshold=5.0%)\n \
      \ - missing_percent(num_barra_secundario) < 5.0:\n      name: num_barra_secundario não deve ter\
      \ >5.0% nulos\n"
team:
  name: ONS - Operador Nacional do Sistema Elétrico
  members:
  - username: dadosabertos@ons.org.br
    role: owner
slaProperties:
- property: freshness
  value: P1D
  description: Atualizado diariamente
authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/capacidade-transformacao
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - quantos transformadores existem
  - capacidade das subestacoes em mva
  - transformadores por subestacao
  - quantos mva instalados
  - lista de transformadores
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver capacidade instalada de transformação, inventário
    de transformadores da Rede Básica, potência nominal em MVA por subestação ou subsistema, tensões de
    transformação (primário/secundário/terciário), agentes proprietários de transformadores ou análise
    de infraestrutura de transformação do SIN. Também relevante para perguntas sobre adequação da rede
    de transmissão, expansão de subestações e estudos de fluxo de potência que requerem dados cadastrais
    de transformadores.
- property: agentInstructions
  value: '- [val_tensaoterciario_kv] 19% dos registros possuem val_tensaoterciario_kv nulo. Comportamento
    esperado para transformadores de dois enrolamentos, que não possuem enrolamento terciário. Filtrar
    por nom_tipotransformador antes de agregar para evitar distorções.


    - [num_barra_primario] 0,3% dos registros possuem num_barra_primario nulo, indicando transformadores
    sem barra primária cadastrada no modelo de rede. Pode impactar joins com datasets de modelagem elétrica
    e estudos de fluxo de potência.


    - [num_barra_secundario] 1,1% dos registros possuem num_barra_secundario nulo, proporção maior que
    num_barra_primario. Transformadores sem barra secundária cadastrada podem estar em processo de comissionamento
    ou com dados incompletos no sistema de origem.


    - [dat_entradaoperacao] Coluna armazenada como VARCHAR no Parquet. Pode conter formatos de data heterogêneos
    (YYYY-MM-DD, DD/MM/YYYY, etc.) provenientes do sistema de origem. Requer TRY_CAST ou strptime para
    uso em filtros e ordenações temporais.


    - [dat_desativacao] Coluna armazenada como VARCHAR no Parquet. Pode conter formatos de data heterogêneos.
    Requer TRY_CAST para uso em filtros temporais. O período 1990-12-31 a 2026-03-31 reflete o intervalo
    histórico de desativações cadastradas, não uma série temporal de medições.


    - [cod_equipamento] cod_equipamento é a chave primária natural esperada. Duplicatas indicariam inconsistência
    cadastral no sistema de origem ONS. Verificar existência de registros duplicados antes de usar como
    chave de join.


    - [val_potencianominal_mva] Potência nominal varia de 4,687 MVA a 1650 MVA. O valor mínimo de 4,687
    MVA é incomum para transformadores da rede básica (tipicamente acima de 25 MVA) e pode indicar erro
    de cadastro ou equipamento de características especiais. O máximo de 1650 MVA corresponde a grandes
    autotransformadores de 765/500 kV.


    - [nom_tipoderede] Valores com trailing spaces detectados em ''nom_tipoderede''. Use TRIM() em filtros
    WHERE para evitar perda de registros.'
- property: typicalQuestions
  value:
  - Qual é a capacidade total de transformação instalada por subsistema no SIN?
  - Quais subestações possuem maior potência nominal de transformação instalada?
  - Quais agentes proprietários detêm mais transformadores de extra-alta tensão (500 kV ou acima)?
  - Quantos transformadores de três enrolamentos estão cadastrados na Rede Básica?
  - Quais transformadores foram desativados nos últimos anos e qual era sua capacidade?
- property: granularity
  value: STATIC
- property: spatialGranularity
  value: por_subestacao
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/capacidade-transformacao/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '1965-03-29'
- property: semantics
  value:
    temporal_perspective: cadastral
    row_grain:
      temporal: STATIC
      temporal_column: dat_entradaoperacao
      spatial: subestacao
      entity: subestacao
      one_row_per:
      - dat_entradaoperacao
      - id_subsistema
      - cod_equipamento
    dimension_columns:
      subsistema: id_subsistema
      fonte: null
      usina: null
      reservatorio: null
      bacia: null
      subestacao: nom_subestacao
      patamar: null
    metrics:
    - id: tensaoprimario_kv
      label: Tensaoprimario Kv
      columns:
      - val_tensaoprimario_kv
      expression: val_tensaoprimario_kv
      quantity_kind: numeric
      unit_native: kV
      default_aggregation: sum
      forbidden_aggregations: []
      valid_intents:
      - tensaoprimario_kv
      - tensao_primario
      - tensao_alta
      - kv_primario
      - tensao_at
      aggregation_modes:
        total:
          sql: SUM(val_tensaoprimario_kv)
          unit: kV
        average:
          sql: AVG(val_tensaoprimario_kv)
          unit: kV
        maximum:
          sql: MAX(val_tensaoprimario_kv)
          unit: kV
        time_series:
          sql: SUM(val_tensaoprimario_kv)
          unit: kV
        ranking:
          sql: SUM(val_tensaoprimario_kv)
          unit: kV
        comparison:
          sql: SUM(val_tensaoprimario_kv)
          unit: kV
      aliases:
      - tensao_primario
      - tensao_alta
      - kv_primario
      - tensao_at
    - id: tensaosecundario_kv
      label: Tensaosecundario Kv
      columns:
      - val_tensaosecundario_kv
      expression: val_tensaosecundario_kv
      quantity_kind: numeric
      unit_native: kV
      default_aggregation: sum
      forbidden_aggregations: []
      valid_intents:
      - tensaosecundario_kv
      - tensao_secundario
      - tensao_media
      - kv_secundario
      - tensao_mt
      aggregation_modes:
        total:
          sql: SUM(val_tensaosecundario_kv)
          unit: kV
        average:
          sql: AVG(val_tensaosecundario_kv)
          unit: kV
        maximum:
          sql: MAX(val_tensaosecundario_kv)
          unit: kV
        time_series:
          sql: SUM(val_tensaosecundario_kv)
          unit: kV
        ranking:
          sql: SUM(val_tensaosecundario_kv)
          unit: kV
        comparison:
          sql: SUM(val_tensaosecundario_kv)
          unit: kV
      aliases:
      - tensao_secundario
      - tensao_media
      - kv_secundario
      - tensao_mt
    - id: tensaoterciario_kv
      label: Tensaoterciario Kv
      columns:
      - val_tensaoterciario_kv
      expression: val_tensaoterciario_kv
      quantity_kind: numeric
      unit_native: kV
      default_aggregation: sum
      forbidden_aggregations: []
      valid_intents:
      - tensaoterciario_kv
      - tensao_terciario
      - tensao_baixa
      - kv_terciario
      - tensao_bt
      aggregation_modes:
        total:
          sql: SUM(val_tensaoterciario_kv)
          unit: kV
        average:
          sql: AVG(val_tensaoterciario_kv)
          unit: kV
        maximum:
          sql: MAX(val_tensaoterciario_kv)
          unit: kV
        time_series:
          sql: SUM(val_tensaoterciario_kv)
          unit: kV
        ranking:
          sql: SUM(val_tensaoterciario_kv)
          unit: kV
        comparison:
          sql: SUM(val_tensaoterciario_kv)
          unit: kV
      aliases:
      - tensao_terciario
      - tensao_baixa
      - kv_terciario
      - tensao_bt
    - id: potencianominal_mva
      label: Potencianominal Mva
      columns:
      - val_potencianominal_mva
      expression: val_potencianominal_mva
      quantity_kind: capacity
      unit_native: MVA
      default_aggregation: sum
      forbidden_aggregations: []
      valid_intents:
      - potencianominal_mva
      - potencia_nominal
      - capacidade_transformacao
      - mva
      - potencia_mva
      - capacidade_mva
      aggregation_modes:
        total:
          sql: SUM(val_potencianominal_mva)
          unit: MVA
        maximum:
          sql: MAX(val_potencianominal_mva)
          unit: MVA
        time_series:
          sql: SUM(val_potencianominal_mva)
          unit: MVA
        ranking:
          sql: SUM(val_potencianominal_mva)
          unit: MVA
        comparison:
