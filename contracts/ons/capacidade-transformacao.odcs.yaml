version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:ons-opendata:capacidade-transformacao
name: capacidade-transformacao
tenant: ons
tags:
- AT rede básica
- cadastro-equipamentos
- capacidade de transformação
- capacidade trafo
- mva
- ons
- potencia-nominal
- rede-basica
- sin
