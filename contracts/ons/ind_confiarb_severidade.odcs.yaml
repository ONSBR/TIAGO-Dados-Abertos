authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/ind_confiarb_severidade
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - gravidade das perturbacoes
  - quao severos foram os eventos
  - severidade de ocorrencias na rede
- property: aiContext
  value: Recuperar este dataset quando a pergunta envolver indicadores de severidade de perturbações (SM),
    confiabilidade da rede básica de transmissão, faixas de gravidade de eventos elétricos ou desempenho
    operativo do SIN por subsistema, região ou estado. Também relevante para análises regulatórias do
    Submódulo 9.1 dos Procedimentos de Rede do ONS e comparações históricas de confiabilidade entre agregações
    geográficas.
- property: agentInstructions
  value: '- [id_periodicidade] A tabela contém registros de duas periodicidades distintas (Mensal e Anual)
    misturados na mesma partição. Consultas que não filtram por id_periodicidade podem duplicar ou distorcer
    agregações temporais, pois um mesmo período (ex: 2024) aparece tanto como 12 registros mensais quanto
    como 1 registro anual para cada entidade geográfica.


    - [val_sm1] O valor máximo de val_sm1 é 339, significativamente superior aos demais níveis de severidade
    (SM2 máx=79, SM3 máx=45, SM4 máx=24, SM5 máx=16). Valores muito elevados de SM1 podem corresponder
    a períodos de alta perturbação sistêmica ou a registros de agregação SIN/anual que acumulam ocorrências
    de todos os subsistemas. Recomenda-se verificar o contexto de dsc_agregacao e id_periodicidade.


    - [val_sm2] Valor máximo de val_sm2 é 79, consideravelmente acima da mediana esperada para perturbações
    de nível 2. Picos podem indicar eventos sistêmicos relevantes ou acumulação em registros anuais do
    SIN. Monitorar para subsidiar análises regulatórias de penalidades conforme Submódulo 9.1.


    - [din_referencia] O dataset cobre o período de 2007-01-01 a 2026-04-01. Podem existir lacunas temporais
    para determinadas combinações de entidade geográfica e periodicidade, especialmente em estados ou
    regiões com histórico de dados incompleto nos anos iniciais da série (2007-2010). A atualização diária
    (12h e 19h) pode gerar versões intermediárias com dados parciais do mês corrente.


    - [dsc_agregacao] A combinação (dsc_agregacao, cod_caracteristica, id_periodicidade, din_referencia)
    define a chave primária natural. Dado que o processo de consistência é recorrente e atualizado diariamente,
    podem existir registros duplicados para o período mais recente caso o pipeline de ingestão não realize
    deduplicação adequada antes da escrita no Parquet.

    '
- property: typicalQuestions
  value:
  - Qual foi a evolução mensal do indicador de severidade SM1 para o subsistema Sudeste/Centro-Oeste nos
    últimos 5 anos?
  - Quais meses apresentaram maior número de perturbações graves (SM5) no SIN entre 2015 e 2025?
  - Como se compara a severidade das perturbações entre os subsistemas SE/CO, S, NE e N em 2023?
  - Qual a tendência anual do indicador SM para o SIN desde 2007?
  - Em quais regiões geográficas ocorreram os maiores valores de SM4 e SM5 nos últimos 3 anos?
- property: granularity
  value: anual
- property: spatialGranularity
  value: nacional
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_severidade/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2007-01-01'
- property: semantics
  value:
    temporal_perspective: verificado
    row_grain:
      temporal: 1 semana
      temporal_column: din_referencia
      spatial: nacional
      entity: dataset_row
      one_row_per:
