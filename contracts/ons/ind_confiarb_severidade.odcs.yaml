      default_aggregation: sum
      forbidden_aggregations: []
      valid_intents:
      - sm5
      - severidade_faixa5
      - val_severidade_5
      - perturbacoes_sm5
      - perturbacoes_graves
      aggregation_modes:
        total:
          sql: SUM(val_sm5)
          unit: indice
        average:
          sql: AVG(val_sm5)
          unit: indice
        maximum:
          sql: MAX(val_sm5)
          unit: indice
        time_series:
          sql: SUM(val_sm5)
          unit: indice
        ranking:
          sql: SUM(val_sm5)
          unit: indice
        comparison:
          sql: SUM(val_sm5)
          unit: indice
      interval_hours: 168.0
      aliases:
      - sm5
      - severidade_faixa5
      - val_severidade_5
      - perturbacoes_sm5
      - perturbacoes_graves
      - faixa 5
      - maior severidade
      - eventos graves
      - perturbacoes criticas
    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: false
      supports_ranking: false
      primary_use_case: serie_temporal
    selection_policy:
      covers_metrics:
      - sm1
      - sm2
      - sm3
      - sm4
      - sm5
      preferred_for:
      - indicador SM faixas
      - severidade perturbacoes SM1 SM2 SM3 SM4 SM5
      - faixas de gravidade eventos eletricos
      - classificacao magnitude perturbacoes
      - submodulo 9.1 severidade
      - escala decrescente frequencia severidade
      - perturbacoes graves rede basica
      - SM5 eventos criticos
      - distribuicao severidade SIN
      not_preferred_for:
      - ranking usinas
      - usina individual
      - nuclear
      - MMGD
      - carga interrompida
      - energia nao suprida
      - indisponibilidade equipamento
      - robustez rede
      - frequencia desligamentos
      - DREQ
      - CIPER
      - ENS
    value_aliases:
      dsc_agregacao:
        Estado:
          aliases:
          - Estado
          - estado
          - UF
          - uf
          filter: dsc_agregacao = 'Estado'
        Regiao Geografica:
          aliases:
          - Regiao Geografica
          - regiao geografica
          - Região Geográfica
          - regiao
          filter: dsc_agregacao = 'Região Geográfica'
        Sistema:
          aliases:
          - Sistema
          - sistema
          - SIN
          - sin
          - sistema brasileiro
          - nacional
          filter: dsc_agregacao = 'Sistema'
        Subsistema:
          aliases:
          - Subsistema
          - subsistema
          - submercado
          filter: dsc_agregacao = 'Subsistema'
      cod_caracteristica:
        SBR:
          aliases:
          - SBR
          - sistema brasileiro
          - SIN
          - nacional
          filter: cod_caracteristica = 'SBR'
        SE:
          aliases:
          - SE
          - sudeste
          - SE/CO
          filter: cod_caracteristica = 'SE'
        CO:
          aliases:
          - CO
          - centro-oeste
          filter: cod_caracteristica = 'CO'
        S:
          aliases:
          - S
          - sul
          filter: cod_caracteristica = 'S'
        NE:
          aliases:
          - NE
          - nordeste
          filter: cod_caracteristica = 'NE'
        N:
          aliases:
          - N
          - norte
          filter: cod_caracteristica = 'N'
      id_periodicidade:
        AN:
          aliases:
          - AN
          - anual
          - ano
          - consolidado anual
          filter: id_periodicidade = 'AN'
        ME:
          aliases:
          - ME
          - mensal
          - mes
          - apuracao mensal
          filter: id_periodicidade = 'ME'
    sql_patterns:
      sm1_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_referencia AS TIMESTAMP)) AS mes,\n  SUM(val_sm1)\
          \ AS valor\nFROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_referencia AS TIMESTAMP)) =\
          \ {year}\n  AND id_periodicidade = 'ME'\nGROUP BY 1\nORDER BY 1"
        output_unit: indice
        matches:
          output_modes:
          - total
          metrics:
          - sm1
          grain: month
        validated_params:
          year: '2026'
      sm5_graves_por_subsistema:
        template: "SELECT cod_caracteristica,\n  SUM(val_sm5) AS total_sm5\nFROM {source}\nWHERE EXTRACT(YEAR\
          \ FROM TRY_CAST(din_referencia AS TIMESTAMP)) = {year}\n  AND id_periodicidade = 'ME'\n  AND\
          \ dsc_agregacao = 'Subsistema'\nGROUP BY 1\nORDER BY 2 DESC"
        output_unit: indice
        matches:
          output_modes:
          - ranking
          metrics:
          - sm5
          grain: year
        validated_params:
          year: '2026'
      todas_faixas_sin_anual:
        template: "SELECT EXTRACT(YEAR FROM TRY_CAST(din_referencia AS TIMESTAMP)) AS ano,\n  SUM(val_sm1)\
          \ AS sm1,\n  SUM(val_sm2) AS sm2,\n  SUM(val_sm3) AS sm3,\n  SUM(val_sm4) AS sm4,\n  SUM(val_sm5)\
          \ AS sm5\nFROM {source}\nWHERE id_periodicidade = 'AN'\n  AND cod_caracteristica = 'SBR'\nGROUP\
          \ BY 1\nORDER BY 1"
        output_unit: indice
        matches:
          output_modes:
          - time_series
          - comparison
          metrics:
          - sm1
          - sm2
          - sm3
          - sm4
          - sm5
          grain: year
    ambiguity_policy:
      default_assumptions:
      - when: usuario pergunta sobre perturbacoes sem especificar faixa
        assume_metric: sm1
        assume_output: total
        note: SM1 e a faixa de maior frequencia e mais representativa do volume total de perturbacoes
      - when: usuario pergunta sobre periodicidade sem especificar
        assume_filter: id_periodicidade = 'ME'
        note: Registros mensais sao a granularidade primaria de analise; registros anuais (AN) devem ser
          usados apenas quando explicitamente solicitado consolidado anual, para evitar dupla contagem
      - when: usuario pergunta sobre SIN ou Brasil sem especificar agregacao
        assume_filter: cod_caracteristica = 'SBR' AND dsc_agregacao = 'Sistema'
        note: SBR/Sistema representa o total do Sistema Brasileiro sem sobreposicao com subsistemas
      - when: usuario pergunta sobre perturbacoes graves ou criticas
        assume_metric: sm5
        assume_output: total
        note: SM5 representa a faixa de maior severidade (menor frequencia, maior impacto)
      must_clarify_when:
      - trigger_terms:
        - faixa
        - nivel de severidade
        - qual SM
        question: Qual faixa de severidade deseja analisar? SM1 (menor severidade/maior frequencia), SM2,
          SM3, SM4 ou SM5 (maior severidade/menor frequencia)?
        reason: O dataset possui 5 faixas distintas de severidade; sem especificacao, nao e possivel determinar
          qual metrica usar
      - trigger_terms:
        - mensal e anual
        - todos os periodos
        - historico completo
        question: Deseja dados mensais (id_periodicidade='ME') ou consolidados anuais (id_periodicidade='AN')?
          Misturar ambos causa dupla contagem.
        reason: O dataset contem registros mensais e anuais para o mesmo periodo; somar ambos duplica
          os valores
      - trigger_terms:
        - regiao
        - area
        - agregacao
        question: Qual nivel de agregacao geografica? Estado, Regiao Geografica, Subsistema ou Sistema
          (SIN)?
        reason: O dataset possui 4 niveis de agregacao geografica distintos; somar todos causa multipla
          contagem do mesmo evento
      redirect_when:
      - user_mentions:
        - usina
        - ceg
        - itaipu
        - belo monte
        - ranking de usinas
        - usina especifica
        reason: Schema nao contem CEG, usina ou identificador fisico de usina. Granularidade minima e
          subsistema/estado.
        redirect: geracao-usina-2
      - user_mentions:
        - nuclear
        - angra
        - angra 1
        - angra 2
        reason: Schema nao contem coluna ou dimensao nuclear separada. Indicadores SM sao agregados geograficamente.
        redirect: geracao-usina-2 com filtro de combustivel/tipo quando disponivel
      - user_mentions:
        - mmgd
        - microgeracao
        - minigeracao
        - geracao distribuida
        reason: Schema nao contem coluna MMGD separada.
        redirect: dataset com coluna val_germmgd/val_ger_mmgd quando disponivel
      - user_mentions:
        - carga interrompida
        - CIPER
        - MWh interrompido
        reason: Carga interrompida e medida pelo indicador CIPER, nao pelo SM de severidade.
        redirect: ind_confiarb_ciper
      - user_mentions:
        - energia nao suprida
        - ENS
        reason: Energia nao suprida e medida por dataset especifico.
        redirect: ind_confiarb_energianaosuprida
      - user_mentions:
        - indisponibilidade
        - DREQ
        - FREQ
        - desligamento forcado
        reason: Indisponibilidade de equipamentos e medida por dataset especifico.
        redirect: ind_confiarb_dreq_freq
      - user_mentions:
        - robustez
        - indicador de robustez
        reason: Indicador de robustez e medido por dataset especifico.
        redirect: ind_confiarb_robustez
- property: fewShotQueries
  value:
  - question: Qual foi a evolução mensal do indicador SM1 em cada subsistema elétrico nos últimos 3 anos?
    sql: SELECT cod_caracteristica, dsc_caracteristica, CAST(din_referencia AS DATE) AS mes_referencia,
      val_sm1 FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_severidade/*.parquet')
      WHERE id_periodicidade = 'ME' AND dsc_agregacao = 'Subsistema' AND din_referencia >= CAST('2023-01-01'
      AS TIMESTAMP) ORDER BY cod_caracteristica, din_referencia;
  - question: Quais foram os 20 meses com maior índice de perturbações mais severas (SM5) no SIN desde
      2007?
    sql: SELECT CAST(din_referencia AS DATE) AS mes_referencia, dsc_caracteristica, val_sm5, val_sm4,
      val_sm3 FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_severidade/*.parquet')
      WHERE id_periodicidade = 'ME' AND dsc_agregacao = 'SIN' ORDER BY val_sm5 DESC LIMIT 20;
  - question: Como se comparam os indicadores anuais SM1 a SM5 entre os quatro subsistemas elétricos em
      2023?
    sql: SELECT cod_caracteristica, dsc_caracteristica, val_sm1, val_sm2, val_sm3, val_sm4, val_sm5, (val_sm1
      + val_sm2 + val_sm3 + val_sm4 + val_sm5) AS total_sm FROM read_parquet('s3://ons-aws-prod-opendata/dataset/ind_confiarb_severidade/*.parquet')
      WHERE id_periodicidade = 'AN' AND dsc_agregacao = 'Subsistema' AND YEAR(din_referencia) = 2023 ORDER
      BY total_sm DESC;
