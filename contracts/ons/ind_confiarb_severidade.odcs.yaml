description:
  purpose: Permitir o monitoramento, regulação e planejamento da manutenção da rede básica de transmissão
    do SIN por agentes de transmissão, ONS e ANEEL, fornecendo a evolução histórica da severidade das
    perturbações por nível geográfico e periodicidade. Suporta decisões de desempenho operativo, conformidade
    regulatória com o Submódulo 9.1 dos Procedimentos de Rede e análise integrada de confiabilidade do
    sistema de transmissão.
  limitations: O valor máximo de val_sm1 é 339, consideravelmente superior às demais faixas (val_sm2 máx=79,
    val_sm3 máx=45, val_sm4 máx=24, val_sm5 máx=16). O dataset contém registros mensais e anuais para
    a mesma combinação de dsc_agregacao, cod_caracteristica e din_referencia. O período cobre 2007-01-01
    a 2026-03-01.
  usage: Recuperar este dataset quando a pergunta envolver indicadores de severidade de perturbações (SM),
    confiabilidade da rede básica de transmissão, faixas de gravidade de eventos elétricos ou desempenho
    operativo do SIN por subsistema, região ou estado.
domain: qualidade
