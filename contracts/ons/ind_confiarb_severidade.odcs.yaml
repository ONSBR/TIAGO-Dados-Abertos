      fonte: null
      usina: null
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: sm1
      label: Sm1
      columns:
      - val_sm1
      expression: val_sm1
      quantity_kind: count
      unit_native: indice
      default_aggregation: sum
      forbidden_aggregations: []
      valid_intents:
      - sm1
      - severidade_faixa1
      - val_severidade_1
      - perturbacoes_sm1
      aggregation_modes:
        total:
          sql: SUM(val_sm1)
          unit: indice
        average:
          sql: AVG(val_sm1)
          unit: indice
        maximum:
          sql: MAX(val_sm1)
          unit: indice
        time_series:
          sql: SUM(val_sm1)
          unit: indice
        ranking:
          sql: SUM(val_sm1)
          unit: indice
        comparison:
          sql: SUM(val_sm1)
          unit: indice
      interval_hours: 168.0
      aliases:
