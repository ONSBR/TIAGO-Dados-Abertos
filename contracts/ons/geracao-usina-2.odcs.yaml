authoritativeDefinitions:
- url: https://dados.ons.org.br/dataset/geracao-usina-2
  type: businessDefinition
  description: Portal ONS OpenData
customProperties:
- property: vectorTags
  value:
  - quanto foi gerado
  - quanto geramos
  - energia gerada por usina
  - producao de cada usina
  - geracao da usina
  - quanto a usina produziu
  - geracao eolica verificada
  - geracao solar verificada
  - geracao hidraulica verificada
- property: partitionPruning
  value: year
- property: aiContext
  value: Recuperar este dataset quando a pergunta nomear uma USINA, pedir um ranking de usinas ou
    exigir o detalhe por CEG. É o único que tem a produção de uma planta geradora específica, em base
    horária, e serve para série histórica de uma usina e para fator de capacidade por usina.
- property: agentInstructions
  value: '- [val_geracao] Coluna armazena valores numéricos de geração (MWmed) como VARCHAR devido ao
    formato de serialização. A coluna nao possui nulos no periodo apurado, mas operações aritméticas
    diretas falharão sem conversão explícita de tipo. Pode conter strings não conversíveis em casos excepcionais
    de dados inconsistentes no processo de consistência recorrente do ONS.


    - [val_geracao] Valores negativos de geração são possíveis para usinas reversíveis (hidrelétricas
    com bombeamento) operando em modo de consumo. Devem ser tratados como consumo líquido, não como erro
    de dados. Recomenda-se verificar a magnitude e frequência para distinguir operação normal de possíveis
    inconsistências de medição.


    - [din_instante] Dataset cobre de 2000 em diante, com processo de consistencia recorrente que permite
    atualizacoes retroativas. Podem existir lacunas horárias para usinas específicas em períodos de indisponibilidade
    de medição, manutenção ou entrada/saída de operação. Arquivos organizados anualmente (2000-2021) e
    mensalmente (2022+) podem apresentar inconsistências nas bordas de período.


    - [ceg] O CEG ANEEL segue formato padronizado (ex: UHE.PH.SP.000001-0.01), mas usinas do tipo Tipo
    II-C (conjuntos) e Tipo III (grupos de pequenas usinas) podem não possuir CEG individual válido, podendo
    conter valores placeholder, CEG do conjunto ou string vazia mascarada como não-nulo. Verificar consistência
    do formato antes de joins com cadastro ANEEL.


    - [id_ons] A chave primária natural esperada é (din_instante, id_ons). Duplicatas podem ocorrer em
    períodos de transição de modalidade operativa, renomeação de usinas ou erros no processo de consistência
    recorrente. Verificar unicidade antes de joins que assumam cardinalidade 1:1 por instante/usina.

    '
- property: typicalQuestions
  value:
  - Qual foi a geração total de energia hidráulica no subsistema Sudeste em janeiro de 2024?
  - Quais usinas eólicas geraram mais energia no Nordeste no último trimestre?
  - Como evoluiu a participação de energia solar na matriz de geração do SIN entre 2020 e 2024?
  - Qual é o fator de capacidade médio de Itaipu nos últimos 12 meses?
  - Quais usinas registraram geração negativa (bombeamento) e em quais períodos?
  # geradas e validadas pelo benchmark em 2026-09-06
  - "Quanto gerou a usina Itaipu hoje?"
  - "E ai, quanto tá a geracao hidra no NE?"
  - "Qual usina nuclear foi a pior em dezembro de 2024?"
  - "Qual estado mais gerou energia em janeiro de 2024?"
  - "Como variou a geração solar entre março e maio de 2024?"
  - "Qual a geração horaria do SIN em SP na madrugada?"
  - "Qual o pior horário pra geração solar em janeiro?"
- property: granularity
  value: horária
- property: spatialGranularity
  value: por_usina
- property: sourceExpression
  value: read_parquet('s3://ons-aws-prod-opendata/dataset/geracao_usina_2_ho/*.parquet', union_by_name=true)
- property: temporalCoverageStart
  value: '2000-01-01'
- property: semantics
  value:
    measure_terms:
    - geracao
    - gerou
    - gerada
    - gerado
    - producao
    - produziu
    temporal_perspective: verificado
    row_grain:
      temporal: 1 hora
      temporal_column: din_instante
      spatial: usina
      entity: usina
      one_row_per:
      - din_instante
      - id_subsistema
      - ceg
      - id_ons
    dimension_columns:
      subsistema: id_subsistema
      fonte: nom_tipocombustivel
      usina: ceg
      reservatorio: null
      bacia: null
      subestacao: null
      patamar: null
    metrics:
    - id: geracao
      label: Geracao
      columns:
      - val_geracao
      expression: TRY_CAST(val_geracao AS DOUBLE)
      quantity_kind: average_power
      unit_native: MWmed
      default_aggregation: sum
      forbidden_aggregations: []
      aggregation_modes:
        total_energy:
          sql: SUM((TRY_CAST(val_geracao AS DOUBLE)) * 1.0) / 1000
          unit: GWh
        average_power:
          sql: AVG(TRY_CAST(val_geracao AS DOUBLE))
          unit: MWmed
        peak_power:
          sql: MAX(TRY_CAST(val_geracao AS DOUBLE))
          unit: MWmed
        time_series:
          sql: AVG(TRY_CAST(val_geracao AS DOUBLE))
          unit: MWmed
        ranking:
          sql: SUM((TRY_CAST(val_geracao AS DOUBLE)) * 1.0) / 1000
          unit: GWh
        comparison:
          sql: AVG(TRY_CAST(val_geracao AS DOUBLE))
          unit: MWmed
      interval_hours: 1.0
      aliases:
      - geracao
      - potencia_gerada
      - geracao_verificada
      - geracao_mw
      - potencia_mw
      - medicao
    query_routing:
      supports_listing: false
      supports_time_series: true
      supports_comparison: true
      supports_ranking: true
      primary_use_case: serie_temporal
    value_aliases:
      subsistema:
        SE:
          aliases:
          - sudeste
          - centro-oeste
          - se/co
          - sudeste centro-oeste
          filter: id_subsistema = 'SE'
        S:
          aliases:
          - sul
          filter: id_subsistema = 'S'
        NE:
          aliases:
          - nordeste
          filter: id_subsistema = 'NE'
        N:
          aliases:
          - norte
          filter: id_subsistema = 'N'
      nom_tipousina:
        EOLIELÉTRICA:
          aliases:
          - eolica
          - eoleletrica
          - eolioeletrica
          - vento
          - aerogeradores
          filter: nom_tipousina = 'EOLIELÉTRICA'
        FOTOVOLTAICA:
          aliases:
          - solar
          - fotovoltaica
          - solar fotovoltaica
          - paineis solares
          filter: nom_tipousina = 'FOTOVOLTAICA'
        HIDROELÉTRICA:
          aliases:
          - hidraulica
          - hidreletrica
          - hidro
          - agua
          - uhe
          - pch
          filter: nom_tipousina = 'HIDROELÉTRICA'
        NUCLEAR:
          aliases:
          - nuclear
          - ute nuclear
          - angra
          filter: nom_tipousina = 'NUCLEAR'
        TÉRMICA:
          aliases:
          - termica
          - termeletrica
          - ute
          - termoeletrica
          filter: nom_tipousina = 'TÉRMICA'
      nom_tipocombustivel:
        Biomassa:
          aliases:
          - biomassa
          - bagaco
          - cana
          - residuos vegetais
          filter: nom_tipocombustivel = 'Biomassa'
        Carvão:
          aliases:
          - carvao
          - carvao mineral
          filter: nom_tipocombustivel = 'Carvão'
        Eólica:
          aliases:
          - eolica
          - vento
          filter: nom_tipocombustivel = 'Eólica'
        Fotovoltaica:
          aliases:
          - fotovoltaica
          - solar
          filter: nom_tipocombustivel = 'Fotovoltaica'
        Gás:
          aliases:
          - gas
          - gas natural
          - gnl
          filter: nom_tipocombustivel = 'Gás'
        Hidráulica:
          aliases:
          - hidraulica
          - agua
          filter: nom_tipocombustivel = 'Hidráulica'
        Multi-Combustível Diesel/Óleo:
          aliases:
          - multi combustivel diesel oleo
          - diesel oleo
          filter: nom_tipocombustivel = 'Multi-Combustível Diesel/Óleo'
        Nuclear:
          aliases:
          - nuclear
          filter: nom_tipocombustivel = 'Nuclear'
        Outras Multi-Combustível:
          aliases:
          - outras multi combustivel
          - multi combustivel
          filter: nom_tipocombustivel = 'Outras Multi-Combustível'
        Resíduos Industriais:
          aliases:
          - residuos industriais
          - residuos
          filter: nom_tipocombustivel = 'Resíduos Industriais'
        Óleo Combustível:
          aliases:
          - oleo combustivel
          - oleo
          filter: nom_tipocombustivel = 'Óleo Combustível'
        Óleo Diesel:
          aliases:
          - oleo diesel
          - diesel
          filter: nom_tipocombustivel = 'Óleo Diesel'
      cod_modalidadeoperacao:
        TIPO I:
          aliases:
          - tipo i
          - tipo 1
          - relacionamento direto ONS
          filter: cod_modalidadeoperacao = 'TIPO I'
        TIPO II-A:
          aliases:
          - tipo ii-a
          - tipo 2a
          filter: cod_modalidadeoperacao = 'TIPO II-A'
        TIPO II-B:
          aliases:
          - tipo ii-b
          - tipo 2b
          filter: cod_modalidadeoperacao = 'TIPO II-B'
        TIPO II-C:
          aliases:
          - tipo ii-c
          - tipo 2c
          - conjunto usinas ajustamento operativo
          - submodulo 7.2
          filter: cod_modalidadeoperacao = 'TIPO II-C'
        TIPO III:
          aliases:
          - tipo iii
          - tipo 3
          - pequenas usinas sem relacionamento ONS
          filter: cod_modalidadeoperacao = 'TIPO III'
        Conjunto de Usinas:
          aliases:
          - conjunto de usinas
          - conjunto usinas
          filter: cod_modalidadeoperacao = 'Conjunto de Usinas'
        Pequenas Usinas (MMGD):
          aliases:
          - mmgd
          - micro minigeracao distribuida
          - geracao distribuida
          filter: cod_modalidadeoperacao = 'Pequenas Usinas (MMGD)'
        Pequenas Usinas (Tipo III):
          aliases:
          - pequenas usinas tipo iii
          - pequenas usinas tipo 3
          filter: cod_modalidadeoperacao = 'Pequenas Usinas (Tipo III)'
    sql_patterns:
      geracao_mensal:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes, id_subsistema,\n\
          \  SUM((TRY_CAST(val_geracao AS DOUBLE)) * 1.0) / 1000 AS valor\nFROM {source}\nWHERE EXTRACT(YEAR\
          \ FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1, 2\nORDER BY 1, 2"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracao
          grain: month
        validated_params:
          year: '2000'
      geracao_por_combustivel:
        template: "SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  nom_tipocombustivel,\n\
          \  SUM((TRY_CAST(val_geracao AS DOUBLE)) * 1.0) / 1000 AS valor_gwh\nFROM {source}\nWHERE din_instante\
          \ BETWEEN '{start_date}' AND '{end_date}'\n  AND nom_tipocombustivel IS NOT NULL\nGROUP BY 1,\
          \ 2\nORDER BY 1, 2"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          metrics:
          - geracao
          grain: month
        validated_params:
          start_date: '2000-01-01 00:00:00'
          end_date: '2000-02-07 12:00:00'
      ranking_usinas:
        template: "SELECT nom_usina, nom_tipousina, nom_tipocombustivel, id_subsistema,\n  SUM((TRY_CAST(val_geracao\
          \ AS DOUBLE)) * 1.0) / 1000 AS total_gwh\nFROM {source}\nWHERE din_instante BETWEEN '{start_date}'\
          \ AND '{end_date}'\n  AND TRY_CAST(val_geracao AS DOUBLE) > 0\nGROUP BY 1, 2, 3, 4\nORDER BY\
          \ total_gwh DESC\nLIMIT {top_n}"
        output_unit: GWh
        matches:
          output_modes:
          - ranking
          metrics:
          - geracao
          grain: period
        validated_params:
          start_date: '2000-01-01 00:00:00'
          end_date: '2000-02-07 12:00:00'
      geracao_negativa_bombeamento:
        template: "SELECT nom_usina, din_instante,\n  TRY_CAST(val_geracao AS DOUBLE) AS geracao_mw\n\
          FROM {source}\nWHERE TRY_CAST(val_geracao AS DOUBLE) < 0\nORDER BY geracao_mw ASC"
        output_unit: MWmed
        matches:
          output_modes:
          - time_series
          metrics:
          - geracao
          grain: hour
      geracao_usina_2_mensal_gwh:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracao\
          \ AS VARCHAR) AS DOUBLE)) * 1.0 / 1000, 1) AS val_geracao_gwh\nFROM {source}\nWHERE EXTRACT(YEAR\
          \ FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP BY 1\nORDER BY 1"
        output_unit: GWh
        matches:
          output_modes:
          - total_energy
          grain: month
        validated_params:
          year: '2025'
      geracao_usina_2_mensal_mwmed:
        template: "SELECT\n  DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,\n  ROUND(SUM(TRY_CAST(TRY_CAST(val_geracao\
          \ AS VARCHAR) AS DOUBLE)) / COUNT(DISTINCT TRY_CAST(din_instante AS TIMESTAMP)), 1) AS val_geracao_mwmed\n\
          FROM {source}\nWHERE EXTRACT(YEAR FROM TRY_CAST(din_instante AS TIMESTAMP)) = {year}\nGROUP\
          \ BY 1\nORDER BY 1"
        output_unit: MWmed
        matches:
          output_modes:
          - average_power
          grain: month
        validated_params:
          year: '2025'
- property: fewShotQueries
  value:
  - question: Qual foi a geração total por tipo de usina no subsistema Sudeste em janeiro de 2024, hora
      a hora?
    sql: SELECT din_instante, nom_tipousina, SUM((TRY_CAST(val_geracao AS DOUBLE)) * 1.0) / 1000 AS geracao_total_mwmed
      FROM read_parquet('s3://ons-aws-prod-opendata/dataset/geracao_usina_2_ho/*.parquet') WHERE id_subsistema
      = 'SE' AND din_instante >= TIMESTAMP '2024-01-01 00:00:00' AND din_instante < TIMESTAMP '2024-02-01
      00:00:00' GROUP BY din_instante, nom_tipousina ORDER BY din_instante, nom_tipousina LIMIT 1000;
  - question: Quais foram as 20 usinas com maior geração média horária em 2023?
    sql: SELECT id_ons, nom_usina, nom_tipousina, id_subsistema, AVG(TRY_CAST(val_geracao AS DOUBLE))
      AS geracao_media_mwmed, SUM(TRY_CAST(val_geracao AS DOUBLE)) AS geracao_total_mwmed, COUNT(*) AS
      horas_operacao FROM read_parquet('s3://ons-aws-prod-opendata/dataset/geracao_usina_2_ho/*.parquet')
      WHERE din_instante >= TIMESTAMP '2023-01-01 00:00:00' AND din_instante < TIMESTAMP '2024-01-01 00:00:00'
      AND TRY_CAST(val_geracao AS DOUBLE) > 0 GROUP BY id_ons, nom_usina, nom_tipousina, id_subsistema
      ORDER BY geracao_media_mwmed DESC LIMIT 20;
  - question: Como evoluiu a participação percentual da geração eólica no total gerado pelo subsistema
      Nordeste entre 2020 e 2024?
    sql: WITH geracao_mensal AS ( SELECT DATE_TRUNC('month', TRY_CAST(din_instante AS TIMESTAMP)) AS mes,
      nom_tipousina, SUM((TRY_CAST(val_geracao AS DOUBLE)) * 1.0) / 1000 AS geracao_total FROM read_parquet('s3://ons-aws-prod-opendata/dataset/geracao_usina_2_ho/*.parquet')
      WHERE id_subsistema = 'NE' AND din_instante >= TIMESTAMP '2020-01-01 00:00:00' AND din_instante
      < TIMESTAMP '2025-01-01 00:00:00' AND TRY_CAST(val_geracao AS DOUBLE) > 0 GROUP BY DATE_TRUNC('month',
      TRY_CAST(din_instante AS TIMESTAMP)), nom_tipousina ), total_mensal AS ( SELECT mes, SUM(geracao_total)
      AS total_subsistema FROM geracao_mensal GROUP BY mes ) SELECT g.mes, g.nom_tipousina, g.geracao_total,
      t.total_subsistema, ROUND(100.0 * g.geracao_total / t.total_subsistema, 2) AS participacao_pct FROM
      geracao_mensal AS g JOIN total_mensal AS t ON g.mes = t.mes WHERE g.nom_tipousina = 'Eólica' ORDER
      BY g.mes;
