version: 2
updates:
  # uv e nao pip: o PR do bot precisa trazer o uv.lock, senao o CI (uv sync --frozen)
  # testa a versao antiga e o verde nao vale.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Um PR por semana com todas as actions juntas, em vez de um PR por action.
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
